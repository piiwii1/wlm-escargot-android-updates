<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b4b9d"/><stop offset=".5" stop-color="#062854"/><stop offset="1" stop-color="#020b1b"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#67f7ff"/><stop offset=".55" stop-color="#13d7f3"/><stop offset="1" stop-color="#087cff"/></linearGradient>
  <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#9eb7d4"/></linearGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="round"><rect x="28" y="28" width="968" height="968" rx="170"/></clipPath>
</defs>
<g clip-path="url(#round)">
  <rect x="28" y="28" width="968" height="968" rx="170" fill="url(#bg)"/>
  <rect x="35" y="35" width="954" height="954" rx="164" fill="none" stroke="#0d95ff" stroke-width="12" opacity=".9" filter="url(#glow)"/>
</g>
<!-- capture corners -->
<g fill="none" stroke="url(#cyan)" stroke-width="34" stroke-linecap="round" filter="url(#glow)">
  <path d="M155 250V155h95"/><path d="M774 155h95v95"/><path d="M155 774v95h95"/><path d="M774 869h95v-95"/>
</g>
<!-- browser window -->
<rect x="215" y="248" width="590" height="508" rx="52" fill="#06172e" stroke="url(#silver)" stroke-width="26"/>
<path d="M228 365h564" stroke="#dceaff" stroke-width="18" opacity=".85"/>
<circle cx="286" cy="307" r="18" fill="#168cff"/><circle cx="340" cy="307" r="18" fill="#2ce8f5"/><circle cx="394" cy="307" r="18" fill="#19cce8"/>
<rect x="455" y="284" width="276" height="44" rx="22" fill="#42678f"/>
<!-- webpage preview -->
<rect x="276" y="422" width="245" height="166" rx="20" fill="url(#cyan)"/>
<path d="M291 568l72-83 55 59 36-41 55 65z" fill="#0750c9"/><circle cx="466" cy="474" r="26" fill="#9dfcff"/>
<g fill="#647b9a"><rect x="278" y="625" width="242" height="20" rx="10"/><rect x="278" y="669" width="214" height="20" rx="10"/><rect x="278" y="713" width="165" height="20" rx="10"/></g>
<!-- arrow -->
<path d="M420 384c132-31 264 5 337 107" fill="none" stroke="url(#cyan)" stroke-width="38" stroke-linecap="round" filter="url(#glow)"/>
<path d="M750 431l31 85-87-21z" fill="url(#cyan)" filter="url(#glow)"/>
<!-- code panel -->
<rect x="545" y="454" width="350" height="354" rx="44" fill="#062247" stroke="#77f8ff" stroke-width="18" stroke-dasharray="34 22" filter="url(#glow)"/>
<!-- code symbol -->
<g fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
  <path d="M664 572l-57 50 57 50"/><path d="M786 572l57 50-57 50"/><path d="M748 548l-43 150"/>
</g>
<!-- code lines -->
<g stroke-linecap="round" stroke-width="18"><path d="M622 736h78" stroke="#3ef1f7"/><path d="M732 736h94" stroke="#0c86ff"/><path d="M622 775h53" stroke="#fff"/><path d="M704 775h122" stroke="#11c7f5"/></g>
</svg>