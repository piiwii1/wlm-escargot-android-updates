name: FannyArchive 1.3.1 macOS Smoke

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'fannyarchive-ci/verify-v131.txt'

jobs:
  verify-apk:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Download already built APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/fanny131apk
          gh run download 32732941196 --repo piiwii1/wlm-escargot-android-updates --name FannyArchive-1.3.1-STABLE --dir /tmp/fanny131apk
          test -f /tmp/fanny131apk/FannyArchive-1.3.1-STABLE.apk
          echo '363ccc5e29a4cafe5d4c3370cd169866ee2a96cc189a2e5936d04dfe5b4122f3  /tmp/fanny131apk/FannyArchive-1.3.1-STABLE.apk' | shasum -a 256 -c -

      - name: Install launch verify Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-boot-timeout: 600
          script: |
            set -e
            adb install -r /tmp/fanny131apk/FannyArchive-1.3.1-STABLE.apk | tee /tmp/install131.txt
            grep -q 'Success' /tmp/install131.txt
            adb logcat -c
            adb shell am force-stop ch.piiwii.fannyarchive.stable
            adb shell am start -n ch.piiwii.fannyarchive.stable/ch.piiwii.fannyarchive.MainActivity | tee /tmp/start131.txt
            sleep 10
            ok=0
            for i in $(seq 1 24); do
              PID=$(adb shell pidof ch.piiwii.fannyarchive.stable 2>/dev/null | tr -d '\r' || true)
              if [ -n "$PID" ]; then
                adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
                adb pull /sdcard/window.xml /tmp/window131.xml >/dev/null 2>&1 || true
                if grep -Fq 'Archive Fanny' /tmp/window131.xml 2>/dev/null; then
                  echo "UI_OK pid=$PID"
                  ok=1
                  break
                fi
              fi
              sleep 3
            done
            test "$ok" = 1
            adb shell dumpsys activity activities | grep -F 'ch.piiwii.fannyarchive.stable/ch.piiwii.fannyarchive.MainActivity'
            ! adb logcat -d -v brief | grep -E 'FATAL EXCEPTION|AndroidRuntime' | grep -F 'ch.piiwii.fannyarchive.stable'
            adb exec-out screencap -p > /tmp/FannyArchive-1.3.1-STABLE-macos.png
            echo 'INSTALL_LAUNCH_UI=PASS'

      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FannyArchive-1.3.1-macos-proof
          path: |
            /tmp/install131.txt
            /tmp/start131.txt
            /tmp/window131.xml
            /tmp/FannyArchive-1.3.1-STABLE-macos.png
          if-no-files-found: ignore
          retention-days: 7
