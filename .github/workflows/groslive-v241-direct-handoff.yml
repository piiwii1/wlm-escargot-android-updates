name: Gros Live 2.4.1 direct handoff

on:
  push:
    paths:
      - '.github/workflows/groslive-v241-direct-handoff.yml'

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified APK
        run: |
          curl -fsSL --retry 3 -o /tmp/GrosLive2026-v2.4.1.apk https://piiwii.ch/wp-content/uploads/2026/09/GrosLive2026-v2.4.1.apk
          echo 'f0b81b11148d168e5166b43cee807b46b6315cb1f5c7370fa475a10ce572f024  /tmp/GrosLive2026-v2.4.1.apk' | sha256sum -c -
          echo 'f0b81b11148d168e5166b43cee807b46b6315cb1f5c7370fa475a10ce572f024  GrosLive2026-v2.4.1.apk' > /tmp/GrosLive2026-v2.4.1-SHA256.txt
      - name: Upload handoff
        uses: actions/upload-artifact@v4
        with:
          name: GrosLive2026-v2.4.1
          retention-days: 30
          path: |
            /tmp/GrosLive2026-v2.4.1.apk
            /tmp/GrosLive2026-v2.4.1-SHA256.txt
