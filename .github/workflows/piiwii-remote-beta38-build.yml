name: PiiWii Remote beta38 build

on:
  push:
    branches:
      - piiwii-remote-beta38-routing-fix
    paths:
      - 'piiwii-remote-beta38/**'
      - '.github/workflows/piiwii-remote-beta38-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct exact beta38 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/src
          cat piiwii-remote-beta38/payload.part*.b64 | base64 -d > /tmp/piiwii-beta38.tar.xz
          echo "19480796651bf7a696dd974785d28093f02a72404c5379d2f9dba617aa5003c1  /tmp/piiwii-beta38.tar.xz" | sha256sum -c -
          tar -xJf /tmp/piiwii-beta38.tar.xz -C /tmp/src
          test -f /tmp/src/piiwii-remote/settings.gradle
          grep -q 'versionCode = 68' /tmp/src/piiwii-remote/remote/build.gradle.kts
          grep -q '2.0.0-beta38' /tmp/src/piiwii-remote/remote/build.gradle.kts

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned release APK
        working-directory: /tmp/src/piiwii-remote
        run: gradle --no-daemon --stacktrace :remote:assembleRelease

      - name: Prepare build artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/out
          APK="$(find /tmp/src/piiwii-remote/remote/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" /tmp/out/PiiWii-Remote-2.0.0-beta38-UNSIGNED.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" /tmp/out/apksigner.jar
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" /tmp/out/zipalign
          chmod +x /tmp/out/zipalign
          sha256sum /tmp/out/PiiWii-Remote-2.0.0-beta38-UNSIGNED.apk > /tmp/out/SHA256-UNSIGNED.txt
          unzip -t /tmp/out/PiiWii-Remote-2.0.0-beta38-UNSIGNED.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PiiWii-Remote-beta38-unsigned
          path: /tmp/out/*
          retention-days: 1
          if-no-files-found: error
