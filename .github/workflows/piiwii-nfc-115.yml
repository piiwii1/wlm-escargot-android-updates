name: PiiWii NFC 1.0.15 Privacy Settings Build

on:
  push:
    branches: [ main ]
    paths:
      - 'piiwii-nfc-public/v115/**'
      - '.github/workflows/piiwii-nfc-115.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download validated 1.0.14 sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/piiwii-nfc /tmp/art114
          mkdir -p /tmp/piiwii-nfc /tmp/art114
          gh api repos/${{ github.repository }}/actions/artifacts/11025018915/zip > /tmp/art114.zip
          unzip -q /tmp/art114.zip -d /tmp/art114
          unzip -q /tmp/art114/PiiWii-NFC-1.0.14-SOURCES.zip -d /tmp/piiwii-nfc
          test -d /tmp/piiwii-nfc/PiiWii-NFC-1.0.14
      - name: Prepare 1.0.15 sources
        run: |
          cd /tmp/piiwii-nfc/PiiWii-NFC-1.0.14
          python3 -c 'import base64,zlib; open("/tmp/apply115.patch","wb").write(zlib.decompress(base64.b64decode(open("'$GITHUB_WORKSPACE'/piiwii-nfc-public/v115/patch115.z64","rb").read())))'
          test "$(sha256sum /tmp/apply115.patch | cut -d' ' -f1)" = "9e97827f2c5000741f7053b1872945a57c54af86a8d207c04703c7a5144c7332"
          patch -p2 < /tmp/apply115.patch
          cd /tmp/piiwii-nfc
          mv PiiWii-NFC-1.0.14 PiiWii-NFC-1.0.15
      - name: Build APK
        working-directory: /tmp/piiwii-nfc/PiiWii-NFC-1.0.15
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify APK and privacy settings
        run: |
          AAPT=/usr/local/lib/android/sdk/build-tools/35.0.0/aapt
          APKSIGNER=/usr/local/lib/android/sdk/build-tools/35.0.0/apksigner
          ROOT=/tmp/piiwii-nfc/PiiWii-NFC-1.0.15
          APK=$ROOT/app/build/outputs/apk/debug/app-debug.apk
          "$AAPT" dump badging "$APK" | head -20
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          grep -q "versionName '1.0.15'" "$ROOT/app/build.gradle"
          grep -q "versionCode 16" "$ROOT/app/build.gradle"
          grep -q "applicationId 'ch.piiwii.nfc.v115'" "$ROOT/app/build.gradle"
          grep -q 'privateModeSwitch' "$ROOT/app/src/main/res/layout/activity_main.xml"
          grep -q 'eraseConfirmSwitch' "$ROOT/app/src/main/res/layout/activity_main.xml"
          grep -q 'privateMode' "$ROOT/app/src/main/java/ch/piiwii/nfc/MainActivity.java"
          grep -q 'eraseConfirm' "$ROOT/app/src/main/java/ch/piiwii/nfc/MainActivity.java"
      - name: Package deliverables
        run: |
          mkdir -p piiwii-nfc-public/dist-115
          cp /tmp/piiwii-nfc/PiiWii-NFC-1.0.15/app/build/outputs/apk/debug/app-debug.apk piiwii-nfc-public/dist-115/PiiWii-NFC-1.0.15.apk
          cd /tmp/piiwii-nfc
          zip -qr "$GITHUB_WORKSPACE/piiwii-nfc-public/dist-115/PiiWii-NFC-1.0.15-SOURCES.zip" PiiWii-NFC-1.0.15
          cd "$GITHUB_WORKSPACE/piiwii-nfc-public/dist-115"
          sha256sum PiiWii-NFC-1.0.15.apk PiiWii-NFC-1.0.15-SOURCES.zip > SHA256SUMS.txt
      - name: Upload deliverables
        uses: actions/upload-artifact@v4
        with:
          name: PiiWii-NFC-1.0.15
          path: piiwii-nfc-public/dist-115/
          retention-days: 7
          if-no-files-found: error
