name: Build Mode Convoi 0.3.3 Update

on:
  push:
    branches: [main]
    paths: ['.github/workflows/mode-convoi-033-build.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4
        with:
          ref: mode-convoi-apk-build

      - name: Reconstruct source and apply patches
        run: |
          mkdir -p mode-convoi-build/android/app/src/main/java/ch/piiwii/modeconvoi
          cat mode-convoi-build/main-parts/part-00 mode-convoi-build/main-parts/part-01 mode-convoi-build/main-parts/part-02 mode-convoi-build/main-parts/part-03 mode-convoi-build/main-parts/part-04 mode-convoi-build/main-parts/part-05 > mode-convoi-build/android/app/src/main/java/ch/piiwii/modeconvoi/MainActivity.java
          python mode-convoi-build/ui_patch.py
          python mode-convoi-build/bottom_nav_patch.py
          python mode-convoi-build/ux_032_patch.py
          python mode-convoi-build/ux_033_patch.py
          sed -i -E 's/versionCode [0-9]+/versionCode 6/' mode-convoi-build/android/app/build.gradle
          sed -i -E "s/versionName '[^']+'/versionName '0.3.3'/" mode-convoi-build/android/app/build.gradle
          grep -q 'participantActionsDialog' mode-convoi-build/android/app/src/main/java/ch/piiwii/modeconvoi/MainActivity.java
          grep -q 'general-stop' mode-convoi-build/android/app/src/main/java/ch/piiwii/modeconvoi/MainActivity.java
          grep -q "versionName '0.3.3'" mode-convoi-build/android/app/build.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned release APK
        run: gradle -p mode-convoi-build/android --no-daemon assembleRelease

      - name: Prepare unsigned APK and signing tool
        run: |
          APK='mode-convoi-build/android/app/build/outputs/apk/release/app-release-unsigned.apk'
          test -s "$APK"
          cp "$APK" ModeConvoi-0.3.3-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" apksigner.jar
          sha256sum ModeConvoi-0.3.3-unsigned.apk > ModeConvoi-0.3.3-unsigned.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ModeConvoi-0.3.3-unsigned-and-tools
          if-no-files-found: error
          path: |
            ModeConvoi-0.3.3-unsigned.apk
            ModeConvoi-0.3.3-unsigned.apk.sha256
            apksigner.jar
