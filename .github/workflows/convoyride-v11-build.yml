name: Build ConvoyRide V1.1.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/convoyride-v11-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source
        shell: bash
        run: |
          set -euo pipefail
          cat convoyride-v11/part-00.b64 convoyride-v11/part-01.b64 convoyride-v11/part-02.b64 convoyride-v11/part-03.b64 convoyride-v11/part-04.b64 | base64 -d > /tmp/convoyride-v11.zip
          mkdir -p convoyride-v11-src
          unzip -q /tmp/convoyride-v11.zip -d convoyride-v11-src
          test -s convoyride-v11-src/app/src/main/java/ch/piiwii/convoyride/MainActivity.java
          test -s convoyride-v11-src/app/src/main/java/ch/piiwii/convoyride/ConvoyMapView.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build release
        run: gradle -p convoyride-v11-src --no-daemon assembleRelease
      - name: Align and inspect
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 convoyride-v11-src/app/build/outputs/apk/release/app-release-unsigned.apk ConvoyRide-V1.1.0-aligned-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 ConvoyRide-V1.1.0-aligned-unsigned.apk
          sha256sum ConvoyRide-V1.1.0-aligned-unsigned.apk > ConvoyRide-V1.1.0-aligned-unsigned.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ConvoyRide-V1.1.0-unsigned
          if-no-files-found: error
          retention-days: 7
          path: |
            ConvoyRide-V1.1.0-aligned-unsigned.apk
            ConvoyRide-V1.1.0-aligned-unsigned.apk.sha256
