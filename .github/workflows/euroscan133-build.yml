name: EuroScan CH 1.3.3 build
on:
  push:
    branches: [euroscan-build-133]
    paths:
      - '.ci/euroscan133/**'
      - '.github/workflows/euroscan133-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: true
      - name: Restore proven 1.3.0 source
        run: |
          set -euo pipefail
          cd .ci/euroscan130
          cat payload.part00 payload.part01 payload.part02 payload.part03 payload.part04full | base64 -d > /tmp/euroscan130.zip
          echo '88a4ae5c43d7852a68861a953f916ef3f32b2faf8956bfefaaa28f18178f53dd  /tmp/euroscan130.zip' | sha256sum -c -
          cd "$GITHUB_WORKSPACE"
          rm -rf euroscan-ch
          unzip -q /tmp/euroscan130.zip
      - name: Apply 1.3.2 persistent navigation
        run: python3 .ci/euroscan132/patch132.py
      - name: Apply 1.3.3 scanner and native icon
        run: |
          set -euo pipefail
          for i in $(seq -w 0 11); do : > ".ci/euroscan133/icon.part${i}"; done
          python3 .ci/euroscan133/patch133.py
          rm -f euroscan-ch/app/src/main/res/drawable-nodpi/euroscan_icon.png
          mkdir -p euroscan-ch/app/src/main/res/drawable
          cat > euroscan-ch/app/src/main/res/drawable/euroscan_icon.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <!-- transparent outside -->
              <path android:fillColor="#071A47" android:strokeColor="#3E69FF" android:strokeWidth="2"
                    android:pathData="M22,4 H86 C96,4 104,12 104,22 V86 C104,96 96,104 86,104 H22 C12,104 4,96 4,86 V22 C4,12 12,4 22,4 Z"/>
              <path android:fillColor="#0C2D72" android:fillAlpha="0.75"
                    android:pathData="M23,8 H85 C93,8 100,15 100,23 V85 C100,93 93,100 85,100 H23 C15,100 8,93 8,85 V23 C8,15 15,8 23,8 Z"/>
              <!-- lottery ticket -->
              <path android:fillColor="#FFF9EE" android:strokeColor="#F4C766" android:strokeWidth="1.2"
                    android:pathData="M35,30 L78,36 L73,82 L30,75 Z"/>
              <!-- ticket star -->
              <path android:fillColor="#17356E"
                    android:pathData="M54,38 L56.6,45.2 L64,45.4 L58.1,49.9 L60.2,57 L54,52.9 L47.8,57 L49.9,49.9 L44,45.4 L51.4,45.2 Z"/>
              <!-- ticket rows -->
              <path android:fillColor="#25345A" android:pathData="M39,60 H44 V65 H39 Z M47,60 H52 V65 H47 Z M55,60 H60 V65 H55 Z M63,60 H68 V65 H63 Z M38,68 H43 V73 H38 Z M46,68 H51 V73 H46 Z M54,68 H59 V73 H54 Z M62,68 H67 V73 H62 Z"/>
              <!-- scan corners -->
              <path android:fillColor="#FFD052" android:pathData="M25,27 H42 V31 H29 V43 H25 Z M68,27 H85 V43 H81 V31 H68 Z M25,69 H29 V81 H42 V85 H25 Z M81,69 H85 V85 H68 V81 H81 Z"/>
              <!-- foreground blue lottery ball -->
              <path android:fillColor="#0B2C74" android:strokeColor="#F4B93E" android:strokeWidth="2"
                    android:pathData="M18,57 C18,44 28,35 41,35 C54,35 64,45 64,58 C64,71 54,81 41,81 C28,81 18,70 18,57 Z"/>
              <path android:fillColor="#FFD052"
                    android:pathData="M41,43 L44.4,52.2 L54,52.6 L46.4,58.4 L49,68 L41,62.6 L33,68 L35.6,58.4 L28,52.6 L37.6,52.2 Z"/>
              <!-- Swiss badge -->
              <path android:fillColor="#E7192D" android:strokeColor="#FF5A66" android:strokeWidth="1"
                    android:pathData="M76,13 H94 C98,13 101,16 101,20 V38 C101,42 98,45 94,45 H76 C72,45 69,42 69,38 V20 C69,16 72,13 76,13 Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M82,19 H88 V26 H95 V32 H88 V39 H82 V32 H75 V26 H82 Z"/>
          </vector>
          XML
      - name: Verify source
        run: |
          set -euo pipefail
          grep -q 'versionCode 8' euroscan-ch/app/build.gradle
          grep -q "versionName '1.3.3'" euroscan-ch/app/build.gradle
          grep -q 'Analyser maintenant' euroscan-ch/app/src/main/java/ch/piiwii/euroscan/ScannerActivity.java
          grep -q 'stableFrames>=2' euroscan-ch/app/src/main/java/ch/piiwii/euroscan/ScannerActivity.java
          grep -q 'countLotteryNumbers' euroscan-ch/app/src/main/java/ch/piiwii/euroscan/TicketParser.java
          grep -q '@drawable/euroscan_icon' euroscan-ch/app/src/main/AndroidManifest.xml
          test -s euroscan-ch/app/src/main/res/drawable/euroscan_icon.xml
          grep -q '#E7192D' euroscan-ch/app/src/main/res/drawable/euroscan_icon.xml
          grep -q '#FFD052' euroscan-ch/app/src/main/res/drawable/euroscan_icon.xml
      - name: Build release
        working-directory: euroscan-ch
        run: gradle --no-daemon --stacktrace assembleRelease
      - name: Verify APK
        run: |
          set -euo pipefail
          APK='euroscan-ch/app/build/outputs/apk/release/app-release-unsigned.apk'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='ch.piiwii.euroscan' versionCode='8' versionName='1.3.3'" /tmp/badging.txt
          grep -q "launchable-activity: name='ch.piiwii.euroscan.MainActivity'" /tmp/badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
      - name: Delivery
        run: |
          set -euo pipefail
          mkdir -p delivery
          cp euroscan-ch/app/build/outputs/apk/release/app-release-unsigned.apk delivery/EuroScan-CH-1.3.3-UNSIGNED.apk
          zip -qr delivery/EuroScan-CH-1.3.3-SOURCES.zip euroscan-ch -x 'euroscan-ch/app/build/*' 'euroscan-ch/.gradle/*'
          cp /tmp/badging.txt delivery/APK-BADGING.txt
          printf 'versionName=1.3.3\nversionCode=8\npackage=ch.piiwii.euroscan\n' > delivery/VERSION.txt
          sha256sum delivery/EuroScan-CH-1.3.3-UNSIGNED.apk delivery/EuroScan-CH-1.3.3-SOURCES.zip > delivery/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: EuroScan-CH-1.3.3-UNSIGNED
          path: delivery/*
          retention-days: 7
