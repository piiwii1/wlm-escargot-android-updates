name: Publish Mode Convoi 0.3.10 Unsigned Temp

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-mode-convoi-0310-unsigned.yml']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download unsigned artifact from this repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api /repos/piiwii1/wlm-escargot-android-updates/actions/artifacts/9732807116/zip > /tmp/mc.zip
          mkdir -p /tmp/mc
          unzip -q /tmp/mc.zip -d /tmp/mc
          test -s /tmp/mc/ModeConvoi-0.3.10-unsigned.apk

      - name: Publish temporary base64 payload
        run: |
          mkdir -p tmp-signing
          base64 -w0 /tmp/mc/ModeConvoi-0.3.10-unsigned.apk > tmp-signing/ModeConvoi-0.3.10-unsigned.apk.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp-signing/ModeConvoi-0.3.10-unsigned.apk.b64
          git commit -m 'Temporary unsigned Mode Convoi 0.3.10 payload'
          git push origin HEAD:main
