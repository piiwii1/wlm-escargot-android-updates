name: Compagnon Autoroute 1.0.3 encrypted build

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/ca103-temp-build.yml'

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Live Swiss Overpass WC and fuel smoke test
        shell: bash
        run: |
          set -euo pipefail
          LAT='46.5197'
          LON='6.6323'
          Q_FUEL='[out:json][timeout:10];(nwr(around:12000,'"$LAT"','"$LON"')[amenity=fuel];nwr(around:12000,'"$LAT"','"$LON"')[highway=services];);out center qt;'
          Q_WC='[out:json][timeout:10];(nwr(around:12000,'"$LAT"','"$LON"')[amenity=toilets];nwr(around:12000,'"$LAT"','"$LON"')[highway~"^(services|rest_area)$"][toilets];);out center qt;'
          : > /tmp/overpass-smoke.txt
          OK=0
          for ENDPOINT in \
            'https://overpass.osm.ch/api/interpreter' \
            'https://overpass.private.coffee/api/interpreter' \
            'https://maps.mail.ru/osm/tools/overpass/api/interpreter' \
            'https://overpass-api.de/api/interpreter'; do
            echo "ENDPOINT=$ENDPOINT" | tee -a /tmp/overpass-smoke.txt
            FUEL=0
            WC=0
            if curl --fail --silent --show-error --max-time 22 -A 'CompagnonAutoroute-CI/1.0.3' -X POST "$ENDPOINT" --data-urlencode "data=$Q_FUEL" -o /tmp/fuel.json; then
              FUEL=$(jq '.elements | length' /tmp/fuel.json 2>/dev/null || echo 0)
            fi
            if curl --fail --silent --show-error --max-time 22 -A 'CompagnonAutoroute-CI/1.0.3' -X POST "$ENDPOINT" --data-urlencode "data=$Q_WC" -o /tmp/wc.json; then
              WC=$(jq '.elements | length' /tmp/wc.json 2>/dev/null || echo 0)
            fi
            echo "FUEL_LIKE=$FUEL WC_LIKE=$WC" | tee -a /tmp/overpass-smoke.txt
            if [ "$FUEL" -gt 0 ] && [ "$WC" -gt 0 ]; then OK=1; break; fi
          done
          test "$OK" = 1

      - name: Open encrypted build session
        id: session
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SESSION=$(openssl rand -hex 12)
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/ca103-private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/ca103-private.pem -pubout -out /tmp/ca103-public.pem
          PUB=$(base64 -w0 /tmp/ca103-public.pem)
          gh api repos/${GITHUB_REPOSITORY}/issues/41/comments -f body="CA103_PUBLIC_KEY:${SESSION}:${PUB}" >/dev/null
          echo "session=${SESSION}" >> "$GITHUB_OUTPUT"

      - name: Receive and decrypt source chunks
        env:
          GH_TOKEN: ${{ github.token }}
          SESSION: ${{ steps.session.outputs.session }}
        run: |
          set -euo pipefail
          DONE=''
          for i in $(seq 1 160); do
            DONE=$(gh api --paginate repos/${GITHUB_REPOSITORY}/issues/41/comments --jq ".[] | select(.body | startswith(\"CA103_DONE:${SESSION}:\")) | .body" | tail -n 1 || true)
            [ -n "$DONE" ] && break
            sleep 5
          done
          test -n "$DONE"
          REST=${DONE#CA103_DONE:${SESSION}:}
          COUNT=${REST%%:*}
          KEY_B64=${REST#*:}
          : > /tmp/ca103-source.enc.b64
          for N in $(seq 1 "$COUNT"); do
            BODY=$(gh api --paginate repos/${GITHUB_REPOSITORY}/issues/41/comments --jq ".[] | select(.body | startswith(\"CA103_CHUNK:${SESSION}:${N}:\")) | .body" | tail -n 1)
            test -n "$BODY"
            PREFIX="CA103_CHUNK:${SESSION}:${N}:"
            printf '%s' "${BODY#${PREFIX}}" >> /tmp/ca103-source.enc.b64
          done
          printf '%s' "$KEY_B64" | base64 -d > /tmp/ca103-key.enc
          base64 -d /tmp/ca103-source.enc.b64 > /tmp/ca103-source.enc
          openssl pkeyutl -decrypt -inkey /tmp/ca103-private.pem -in /tmp/ca103-key.enc -pkeyopt rsa_padding_mode:oaep > /tmp/ca103-pass.txt
          openssl enc -d -aes-256-cbc -pbkdf2 -in /tmp/ca103-source.enc -out /tmp/ca103-source.zip -pass file:/tmp/ca103-pass.txt
          unzip -tq /tmp/ca103-source.zip
          mkdir -p /tmp/ca103-src
          unzip -q /tmp/ca103-source.zip -d /tmp/ca103-src

      - name: Build and verify APK
        shell: bash
        run: |
          set -euo pipefail
          PROJ=$(dirname "$(find /tmp/ca103-src -maxdepth 3 -type f -name settings.gradle | head -n 1)")
          test -n "$PROJ"
          cd "$PROJ"
          gradle --no-daemon :app:assembleDebug --stacktrace
          APK=$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)
          test -f "$APK"
          mkdir -p /tmp/ca103-out
          cp "$APK" /tmp/ca103-out/CompagnonAutoroute-1.0.3-V1.apk
          sha256sum /tmp/ca103-out/CompagnonAutoroute-1.0.3-V1.apk | tee /tmp/ca103-out/CompagnonAutoroute-1.0.3-V1.apk.sha256
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$AAPT" dump badging /tmp/ca103-out/CompagnonAutoroute-1.0.3-V1.apk | tee /tmp/ca103-out/badging.txt
          grep -F "package: name='com.compagnonautoroute.app' versionCode='4' versionName='1.0.3-v1'" /tmp/ca103-out/badging.txt
          "$APKSIGNER" verify --verbose --print-certs /tmp/ca103-out/CompagnonAutoroute-1.0.3-V1.apk | tee /tmp/ca103-out/signature.txt
          cp /tmp/overpass-smoke.txt /tmp/ca103-out/overpass-smoke.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CompagnonAutoroute-1.0.3-V1-APK
          path: /tmp/ca103-out/*
          if-no-files-found: error
          retention-days: 1

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          SESSION: ${{ steps.session.outputs.session }}
        run: gh api repos/${GITHUB_REPOSITORY}/issues/41/comments -f body="CA103_BUILD_DONE:${SESSION}" >/dev/null
