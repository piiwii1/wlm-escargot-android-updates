name: Build DriveBox RC10 APK

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'drivebox-ci/rc10-trigger.txt'
      - '.github/workflows/drivebox-rc10.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare RC9 source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/drivebox-rc9b.yml').read_text()
          def extract(step_name, out):
              marker = '      - name: ' + step_name + '\n'
              start = text.index(marker)
              run_start = text.index('        run: |\n', start) + len('        run: |\n')
              end = text.find('\n      - ', run_start)
              if end < 0: end = len(text)
              block = text[run_start:end]
              lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
              Path(out).write_text('\n'.join(lines) + '\n')
          extract('Prepare verified RC8 source', '/tmp/prepare.sh')
          extract('Download official motorway signs', '/tmp/signs.sh')
          extract('Apply RC9 UI changes', '/tmp/rc9.sh')
          PY
          bash /tmp/prepare.sh
          bash /tmp/signs.sh
          bash /tmp/rc9.sh
          grep -q "DriveBox 1.0.0 RC9" /tmp/drivebox-src/app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java

      - name: Apply RC10 harmonization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          java = Path('/tmp/drivebox-src/app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java')
          s = java.read_text()

          def replace_method(src, signature_start, new_method):
              a = src.index(signature_start)
              brace = src.index('{', a)
              depth = 0
              i = brace
              while i < len(src):
                  if src[i] == '{': depth += 1
                  elif src[i] == '}':
                      depth -= 1
                      if depth == 0:
                          return src[:a] + new_method + src[i+1:]
                  i += 1
              raise RuntimeError('Unbalanced method: ' + signature_start)

          s = s.replace('DriveBox 1.0.0 RC9', 'DriveBox 1.0.0 RC10')

          country_card = r'''private View countryCard(String flag, String name, String signColorName, String speedSummary, int accent, Runnable action) {
              LinearLayout c = row(Gravity.CENTER_VERTICAL);
              c.setPadding(dp(14), dp(11), dp(14), dp(11));
              c.setBackground(round(PANEL, 18));
              c.setClickable(true);
              c.setFocusable(true);
              c.setOnClickListener(v -> action.run());

              TextView f = text(flag, 28, TEXT, false);
              f.setGravity(Gravity.CENTER);
              c.addView(f, lp(dp(42), dp(54), 0, 0, 10, 0));

              LinearLayout labels = column();
              labels.addView(text(name, 17, TEXT, true));
              labels.addView(text(speedSummary, 12, MUTED, false), lp(-2, -2, 0, 3, 0, 0));
              c.addView(labels, new LinearLayout.LayoutParams(0, -2, 1));

              MotorwaySignView sign = new MotorwaySignView(this, accent);
              sign.setContentDescription("Panneau autoroute harmonisé - " + name);
              c.addView(sign, lp(dp(74), dp(68), 10, 0, 0, 0));
              return withMargins(c, 0, 0, 0, 10);
          }'''
          s = replace_method(s, 'private View countryCard(', country_card)

          equipment = r'''private View equipmentRow(String status, String title, String detail) {
              LinearLayout c = column();
              c.setPadding(dp(13), dp(11), dp(13), dp(11));
              c.setBackground(round(PANEL, 14));

              String u = status.toUpperCase(Locale.ROOT);
              int badgeBg;
              int badgeText = Color.WHITE;
              if (u.contains("NON OBLIGATOIRE")) {
                  badgeBg = Color.rgb(73, 78, 88);
              } else if (u.contains("RECOMMAND")) {
                  badgeBg = Color.rgb(49, 92, 145);
              } else if (u.contains("OBLIGATOIRE") || u.contains("À PORTER")) {
                  badgeBg = Color.rgb(155, 53, 58);
              } else if (u.contains("VÉHICULE SUISSE") || u.contains("SORTIE DU PAYS") || u.contains("SELON")) {
                  badgeBg = Color.rgb(151, 100, 34);
              } else {
                  badgeBg = Color.rgb(92, 83, 137);
              }

              TextView state = pill(status, badgeText, badgeBg);
              state.setContentDescription("Statut : " + status);
              c.addView(state, lp(-2, -2, 0, 0, 0, 6));
              c.addView(text(title, 15, TEXT, true));
              c.addView(text(detail, 12, MUTED, false), lp(-1, -2, 0, 4, 0, 0));
              return withMargins(c, 0, 0, 0, 8);
          }'''
          s = replace_method(s, 'private View equipmentRow(', equipment)

          java.write_text(s)

          gradle = Path('/tmp/drivebox-src/app/build.gradle')
          g = gradle.read_text()
          g = g.replace('versionCode 18', 'versionCode 19')
          g = g.replace("versionName '1.0.0-rc9'", "versionName '1.0.0-rc10'")
          gradle.write_text(g)
          PY

          grep -q "versionCode 19" /tmp/drivebox-src/app/build.gradle
          grep -q "versionName '1.0.0-rc10'" /tmp/drivebox-src/app/build.gradle
          grep -q "DriveBox 1.0.0 RC10" /tmp/drivebox-src/app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java
          grep -q "Panneau autoroute harmonisé" /tmp/drivebox-src/app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java
          grep -q "Color.rgb(155, 53, 58)" /tmp/drivebox-src/app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        working-directory: /tmp/drivebox-src
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Verify RC10
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/drivebox-src/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/cert.txt
          grep -qi '6699b2b6b15b5e09032b4f54c5c26bbd982a41dc48d5a5093d1501036a474a1e' /tmp/cert.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='ch.clubvwsuisse.drivebox.v1'" /tmp/badging.txt
          grep -q "versionCode='19'" /tmp/badging.txt
          grep -q "versionName='1.0.0-rc10'" /tmp/badging.txt
          grep -q "application-label:'DriveBox'" /tmp/badging.txt
          unzip -t "$APK"
          for f in ch fr de it at; do unzip -l "$APK" | grep -q "res/drawable-nodpi-v4/motorway_${f}.png"; done
          unzip -p "$APK" res/mipmap-xxxhdpi-v4/ic_launcher.webp > /tmp/icon-from-apk.webp
          test "$(sha256sum /tmp/icon-from-apk.webp | awk '{print $1}')" = 'ab5bbd86c44f537aae43e60584c39c923cee3e7c855ae887332617158c0e8a05'
          cp "$APK" "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC10.apk"
          sha256sum "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC10.apk" > "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC10.apk.sha256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: DriveBox-1.0.0-RC10
          path: |
            DriveBox-1.0.0-RC10.apk
            DriveBox-1.0.0-RC10.apk.sha256.txt
          if-no-files-found: error
          retention-days: 7
