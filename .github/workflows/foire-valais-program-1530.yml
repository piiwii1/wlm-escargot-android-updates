name: Foire du Valais 1.5.30 Programme crash fix
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/foire-valais-program-1530.yml'
      - 'foire-valais-app/patches/program1530/step1530.patch'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download 1.5.29 source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous buildsrc
          gh run download 36508901512 -R piiwii1/wlm-escargot-android-updates -n Foire-du-Valais-2026-1.5.29 -D previous
          unzip -q previous/Foire-du-Valais-2026-1.5.29-SOURCES.zip -d buildsrc
      - name: Apply Programme crash fix
        shell: bash
        run: |
          set -euo pipefail
          (cd buildsrc && patch -p1 < ../foire-valais-app/patches/program1530/step1530.patch)
          grep -q 'versionCode = 36' buildsrc/app/build.gradle.kts
          grep -q 'versionName = "1.5.30"' buildsrc/app/build.gradle.kts
          grep -q 'Innothèque","Bonne de Bourbon","Conférences","Halles","Autres","Mes choix' buildsrc/app/src/main/java/ch/piiwii/foirevalais/MainActivity.java
          python - <<'PY'
          import re
          p='buildsrc/app/src/main/java/ch/piiwii/foirevalais/MainActivity.java'
          s=open(p,encoding='utf-8').read()
          zones=re.search(r'final String\[\] zones=\{([^}]*)\};',s).group(1)
          labels=re.search(r'String\[\] labels=\{([^}]*)\};',s).group(1)
          zc=len(re.findall(r'"(?:[^"\\]|\\.)*"',zones))
          lc=len(re.findall(r'"(?:[^"\\]|\\.)*"',labels))
          print('zones=',zc,'labels=',lc)
          assert zc==lc==12
          PY
      - name: Install Android SDK 35
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build release
        working-directory: buildsrc
        run: gradle --no-daemon :app:assembleRelease
      - name: Prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deliverables/sign-tools/lib
          /usr/local/lib/android/sdk/build-tools/35.0.0/zipalign -f -p 4 buildsrc/app/build/outputs/apk/release/app-release-unsigned.apk deliverables/Foire-du-Valais-2026-1.5.30-ALIGNED-UNSIGNED.apk
          /usr/local/lib/android/sdk/build-tools/35.0.0/zipalign -c -v 4 deliverables/Foire-du-Valais-2026-1.5.30-ALIGNED-UNSIGNED.apk
          cp /usr/local/lib/android/sdk/build-tools/35.0.0/lib/apksigner.jar deliverables/sign-tools/lib/apksigner.jar
          cd buildsrc
          zip -qr ../deliverables/Foire-du-Valais-2026-1.5.30-SOURCES.zip . -x '*/build/*' '.gradle/*'
      - uses: actions/upload-artifact@v4
        with:
          name: Foire-du-Valais-2026-1.5.30
          path: deliverables/*
          retention-days: 7
