name: Build PiiWii Camera 1.3.0 direct

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/piiwii-camera-v130-direct.yml'
      - 'piiwii-camera-v130-direct/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Restore clean 1.3.0 source
        run: |
          cat piiwii-camera-v130-direct/transport/source-part-* | base64 -d > /tmp/PiiWii-Camera-1.3.0-SRC.zip
          echo 'a1544367b5880f63b3b8444a7497b5c8259259197eda1bac644fc0c08db5d89b  /tmp/PiiWii-Camera-1.3.0-SRC.zip' | sha256sum -c -
          mkdir -p /tmp/piiwii-camera-v130
          unzip -q /tmp/PiiWii-Camera-1.3.0-SRC.zip -d /tmp/piiwii-camera-v130
      - name: Build release APK
        run: gradle -p /tmp/piiwii-camera-v130/PiiWii-Camera-1.3.0-public --no-daemon :app:assembleRelease
      - name: Collect APK
        run: |
          mkdir -p /tmp/piiwii-camera-v130-out
          cp /tmp/piiwii-camera-v130/PiiWii-Camera-1.3.0-public/app/build/outputs/apk/release/app-release-unsigned.apk /tmp/piiwii-camera-v130-out/PiiWii-Camera-1.3.0-UNSIGNED.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" /tmp/piiwii-camera-v130-out/apksigner.jar
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging /tmp/piiwii-camera-v130-out/PiiWii-Camera-1.3.0-UNSIGNED.apk > /tmp/piiwii-camera-v130-out/badging.txt
          sha256sum /tmp/piiwii-camera-v130-out/PiiWii-Camera-1.3.0-UNSIGNED.apk > /tmp/piiwii-camera-v130-out/unsigned-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PiiWii-Camera-1.3.0-direct-unsigned
          retention-days: 7
          path: /tmp/piiwii-camera-v130-out/
