name: Build PiiWii Camera 1.3.0 direct

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/piiwii-camera-v130-direct.yml'
      - 'piiwii-camera-v130-direct/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build release APK
        run: gradle -p piiwii-camera-v130-direct --no-daemon :app:assembleRelease
      - name: Collect APK
        run: |
          mkdir -p /tmp/piiwii-camera-v130-out
          cp piiwii-camera-v130-direct/app/build/outputs/apk/release/app-release-unsigned.apk /tmp/piiwii-camera-v130-out/PiiWii-Camera-1.3.0-UNSIGNED.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" /tmp/piiwii-camera-v130-out/apksigner.jar
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging /tmp/piiwii-camera-v130-out/PiiWii-Camera-1.3.0-UNSIGNED.apk > /tmp/piiwii-camera-v130-out/badging.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PiiWii-Camera-1.3.0-direct-unsigned
          path: /tmp/piiwii-camera-v130-out/
