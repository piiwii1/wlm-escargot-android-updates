name: Compteur GTI 1.2.0 Compile

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/gti-speedometer-v120-compile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Generate project
        shell: bash
        run: |
          set -euo pipefail
          P='piiwii-delivery/gti-speedometer/v120-src'
          rm -rf "$P"
          mkdir -p "$P/app/src/main/java/ch/piiwii/gtispeed" "$P/app/src/main/res/layout" "$P/app/src/main/res/xml" "$P/app/src/main/res/values" "$P/app/src/main/res/drawable"

          cat > "$P/settings.gradle" <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='GtiSpeed'
          include ':app'
          EOF

          cat > "$P/build.gradle" <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF

          cat > "$P/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > "$P/app/build.gradle" <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'ch.piiwii.gtispeed'
              compileSdk 35
              defaultConfig {
                  applicationId 'ch.piiwii.gtispeed'
                  minSdk 23
                  targetSdk 29
                  versionCode 3
                  versionName '1.2.0'
              }
              lint { disable 'ExpiredTargetSdkVersion' }
              buildTypes { release { minifyEnabled false; shrinkResources false } }
          }
          EOF

          cat > "$P/app/src/main/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
            <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
            <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
            <uses-permission android:name="android.permission.WAKE_LOCK"/>
            <application android:allowBackup="true" android:icon="@drawable/ic_launcher" android:label="Compteur GTI" android:theme="@style/AppTheme">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
              <service android:name=".SpeedService" android:exported="false" android:foregroundServiceType="location"/>
              <receiver android:name=".GtiSpeedWidgetProvider" android:exported="true">
                <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"/></intent-filter>
                <meta-data android:name="android.appwidget.provider" android:resource="@xml/gti_speed_widget_info"/>
              </receiver>
              <receiver android:name=".BootReceiver" android:enabled="true" android:exported="true">
                <intent-filter><action android:name="android.intent.action.BOOT_COMPLETED"/><action android:name="android.intent.action.LOCKED_BOOT_COMPLETED"/></intent-filter>
              </receiver>
            </application>
          </manifest>
          EOF

          cat > "$P/app/src/main/java/ch/piiwii/gtispeed/GtiPrefs.java" <<'EOF'
          package ch.piiwii.gtispeed;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.os.SystemClock;

          final class GtiPrefs {
            static final String[] ELEMENT_KEYS={"needle","accent","major","minor","numbers","digital","unit","logo","honeycomb","ring"};
            static final String[] ELEMENT_LABELS={"Aiguille","Ligne rouge / zone accent","Grandes graduations","Petites graduations","Chiffres du cadran","Vitesse numérique","Texte km/h ou mph","Logo GTI","Nid d’abeille","Cerclage"};
            private static final String NAME="gti_speed_prefs";
            private GtiPrefs(){}
            static SharedPreferences p(Context c){return c.getSharedPreferences(NAME,Context.MODE_PRIVATE);}
            static boolean mph(Context c){return p(c).getBoolean("mph",false);}
            static void setMph(Context c,boolean b){p(c).edit().putBoolean("mph",b).apply();}
            static int accentMode(Context c){return p(c).getInt("accent_mode",0);}
            static void setAccentMode(Context c,int v){p(c).edit().putInt("accent_mode",v).apply();}
            static float accentThresholdKmh(Context c){return p(c).getFloat("accent_threshold_kmh",80f);}
            static void setAccentThresholdKmh(Context c,float v){p(c).edit().putFloat("accent_threshold_kmh",Math.max(0f,Math.min(240f,v))).apply();}
            static float rise(Context c){return p(c).getFloat("rise_alpha",0.42f);}
            static float fall(Context c){return p(c).getFloat("fall_alpha",0.32f);}
            static float zero(Context c){return p(c).getFloat("zero_alpha",0.55f);}
            static int def(String k){
              if("needle".equals(k)||"accent".equals(k)||"logo".equals(k))return 0xFFF01828;
              if("major".equals(k)||"numbers".equals(k)||"digital".equals(k))return 0xFFF2F3F4;
              if("minor".equals(k))return 0xFF9EA5AB;
              if("unit".equals(k))return 0xFFD5D8DB;
              if("honeycomb".equals(k))return 0xFF596068;
              if("ring".equals(k))return 0xFFC5C9CC;
              return Color.WHITE;
            }
            static int color(Context c,String k){
              if(rgb(c,k)){
                float h=(SystemClock.uptimeMillis()%6000L)/6000f*360f;
                return Color.HSVToColor(new float[]{h,0.95f,1f});
              }
              return p(c).getInt("color_"+k,def(k));
            }
            static int staticColor(Context c,String k){return p(c).getInt("color_"+k,def(k));}
            static void setColor(Context c,String k,int v){p(c).edit().putInt("color_"+k,v).apply();}
            static boolean rgb(Context c,String k){return p(c).getBoolean("rgb_"+k,false);}
            static void setRgb(Context c,String k,boolean v){p(c).edit().putBoolean("rgb_"+k,v).apply();}
            static void resetOriginal(Context c){
              SharedPreferences.Editor e=p(c).edit().clear();
              e.putFloat("rise_alpha",0.42f).putFloat("fall_alpha",0.32f).putFloat("zero_alpha",0.55f)
               .putFloat("accent_threshold_kmh",80f).putInt("accent_mode",0).putBoolean("mph",false);
              for(String k:ELEMENT_KEYS){e.putInt("color_"+k,def(k)).putBoolean("rgb_"+k,false);}
              e.apply();
            }
            static void diag(Context c,float raw,float filtered,float accuracy,long fixTime,boolean hasFix){
              p(c).edit().putFloat("diag_raw",raw).putFloat("diag_filtered",filtered).putFloat("diag_accuracy",accuracy).putLong("diag_fix_time",fixTime).putBoolean("diag_has_fix",hasFix).apply();
            }
            static float lastFiltered(Context c){return p(c).getFloat("diag_filtered",0f);}
          }
          EOF

          cat > "$P/app/src/main/java/ch/piiwii/gtispeed/GaugeRenderer.java" <<'EOF'
          package ch.piiwii.gtispeed;
          import android.content.Context;
          import android.graphics.*;
          import java.util.Locale;

          final class GaugeRenderer {
            static final int REF_W=380, REF_H=350;
            private static final float CX=190f,CY=175f,START=135f,SWEEP=270f,OUTER=164f,FACE=151f,TICK_OUT=146f,LABEL_R=121f,RED_R=108f;
            private GaugeRenderer(){}

            static Bitmap render(Context ctx,float speedKmh){
              Bitmap b=Bitmap.createBitmap(REF_W,REF_H,Bitmap.Config.ARGB_8888);
              Canvas c=new Canvas(b); draw(ctx,c,Math.max(0f,Math.min(280f,speedKmh))); return b;
            }

            private static float max(Context c){return GtiPrefs.mph(c)?150f:240f;}
            private static float disp(Context c,float kmh){return GtiPrefs.mph(c)?kmh/1.609344f:kmh;}
            private static float ang(Context c,float display){return START+SWEEP*(Math.max(0f,Math.min(max(c),display))/max(c));}

            private static void draw(Context ctx,Canvas c,float speedKmh){
              float speed=disp(ctx,speedKmh);
              Paint p=new Paint(Paint.ANTI_ALIAS_FLAG);
              c.drawColor(Color.TRANSPARENT);

              p.setStyle(Paint.Style.FILL); p.setColor(0x66000000); p.setShadowLayer(7f,0f,3f,0xCC000000); c.drawCircle(CX,CY+1.5f,OUTER,p); p.clearShadowLayer();
              int ring=GtiPrefs.color(ctx,"ring");
              p.setShader(new LinearGradient(CX-OUTER,CY-OUTER,CX+OUTER,CY+OUTER,new int[]{darken(ring,.18f),lighten(ring,.30f),ring,darken(ring,.42f),lighten(ring,.18f)},null,Shader.TileMode.CLAMP));
              c.drawCircle(CX,CY,OUTER,p); p.setShader(null);
              p.setColor(0xFF050607);c.drawCircle(CX,CY,160f,p);p.setColor(ring);c.drawCircle(CX,CY,157.5f,p);p.setColor(0xFF222427);c.drawCircle(CX,CY,155.5f,p);

              p.setShader(new RadialGradient(CX,CY,FACE,new int[]{0xFF111416,0xFF090B0D,0xFF020304},new float[]{0f,.62f,1f},Shader.TileMode.CLAMP));c.drawCircle(CX,CY,FACE,p);p.setShader(null);
              honey(ctx,c); accent(ctx,c); ticks(ctx,c); redRing(ctx,c); needle(ctx,c,speed); numbers(ctx,c); brand(ctx,c); digital(ctx,c,speed);
            }

            private static void honey(Context ctx,Canvas c){
              c.save();Path clip=new Path();clip.addCircle(CX,CY,FACE-4f,Path.Direction.CW);c.clipPath(clip);
              Paint p=new Paint(Paint.ANTI_ALIAS_FLAG);p.setStyle(Paint.Style.STROKE);p.setStrokeWidth(.8f);
              int hc=GtiPrefs.color(ctx,"honeycomb");p.setColor((hc&0x00FFFFFF)|0x2E000000);
              float r=8.2f,w=(float)(Math.sqrt(3)*r),stepY=1.5f*r;int row=0;
              for(float y=CY-FACE-r;y<=CY+FACE+r;y+=stepY,row++){float off=(row&1)==0?0f:w/2f;for(float x=CX-FACE-w+off;x<=CX+FACE+w;x+=w){Path h=new Path();for(int i=0;i<6;i++){double a=Math.toRadians(60*i-30);float hx=x+(float)Math.cos(a)*r,hy=y+(float)Math.sin(a)*r;if(i==0)h.moveTo(hx,hy);else h.lineTo(hx,hy);}h.close();c.drawPath(h,p);}}
              c.restore();
            }

            private static void accent(Context ctx,Canvas c){
              int mode=GtiPrefs.accentMode(ctx);if(mode==2)return;
              float th=disp(ctx,GtiPrefs.accentThresholdKmh(ctx));th=Math.max(0f,Math.min(max(ctx),th));
              float a0=mode==0?START:ang(ctx,th), a1=mode==0?ang(ctx,th):START+SWEEP;
              Paint p=new Paint(Paint.ANTI_ALIAS_FLAG);p.setStyle(Paint.Style.STROKE);p.setStrokeCap(Paint.Cap.ROUND);RectF r=new RectF(CX-153f,CY-153f,CX+153f,CY+153f);
              p.setStrokeWidth(7f);p.setColor(0x331D0003);c.drawArc(r,a0,a1-a0,false,p);
              p.setStrokeWidth(3.2f);p.setColor(GtiPrefs.color(ctx,"accent"));c.drawArc(r,a0,a1-a0,false,p);
            }

            private static void ticks(Context ctx,Canvas c){
              Paint p=new Paint(Paint.ANTI_ALIAS_FLAG);p.setStyle(Paint.Style.STROKE);p.setStrokeCap(Paint.Cap.SQUARE);
              float mx=max(ctx);float step=2f;for(float s=0;s<=mx+.01f;s+=step){
                boolean major=GtiPrefs.mph(ctx)?(((int)s)%10==0):(((int)s)%20==0);
                boolean med=!major&&(GtiPrefs.mph(ctx)?(((int)s)%5==0):(((int)s)%10==0));
                float in;if(major){in=132.5f;p.setStrokeWidth(2.7f);p.setColor(GtiPrefs.color(ctx,"major"));}else if(med){in=137.5f;p.setStrokeWidth(1.8f);p.setColor(GtiPrefs.color(ctx,"minor"));}else{in=141.5f;p.setStrokeWidth(1.05f);p.setColor(GtiPrefs.color(ctx,"minor"));}
                line(c,p,ang(ctx,s),in,TICK_OUT);
              }
            }

            private static void redRing(Context ctx,Canvas c){
              Paint p=new Paint(Paint.ANTI_ALIAS_FLAG);p.setStyle(Paint.Style.STROKE);p.setStrokeCap(Paint.Cap.SQUARE);RectF r=new RectF(CX-RED_R,CY-RED_R,CX+RED_R,CY+RED_R);
              int ac=GtiPrefs.color(ctx,"accent");p.setStrokeWidth(1.1f);p.setColor((ac&0x00FFFFFF)|0x66000000);c.drawArc(r,START,SWEEP,false,p);
              float mx=max(ctx),step=GtiPrefs.mph(ctx)?2.5f:4f;
              for(float s=0;s<=mx+.01f;s+=step){boolean major=GtiPrefs.mph(ctx)?(((int)Math.round(s*10))%100==0):(((int)s)%20==0);p.setColor(major?ac:darken(ac,.42f));p.setStrokeWidth(major?2.4f:1.15f);line(c,p,ang(ctx,s),major?RED_R-8f:RED_R-4f,RED_R+1f);}
            }

            private static void numbers(Context ctx,Canvas c){
              Paint p=new Paint(Paint.ANTI_ALIAS_FLAG|Paint.SUBPIXEL_TEXT_FLAG);p.setTextAlign(Paint.Align.CENTER);p.setTypeface(Typeface.create("sans-serif-condensed",Typeface.NORMAL));p.setTextSize(21.5f);p.setColor(GtiPrefs.color(ctx,"numbers"));p.setShadowLayer(2f,0f,1f,0xFF000000);
              Paint.FontMetrics fm=p.getFontMetrics();float adj=-(fm.ascent+fm.descent)/2f;
              if(GtiPrefs.mph(ctx)){for(int s=0;s<=140;s+=20)label(c,p,ctx,s,adj);label(c,p,ctx,150,adj);}else for(int s=0;s<=240;s+=20)label(c,p,ctx,s,adj);
              p.clearShadowLayer();
            }
            private static void label(Canvas c,Paint p,Context ctx,int s,float adj){double a=Math.toRadians(ang(ctx,s));c.drawText(Integer.toString(s),CX+(float)Math.cos(a)*LABEL_R,CY+(float)Math.sin(a)*LABEL_R+adj,p);}

            private static void needle(Context ctx,Canvas c,float speed){
              double a=Math.toRadians(ang(ctx,speed));float ux=(float)Math.cos(a),uy=(float)Math.sin(a),px=-uy,py=ux,tip=140f,tail=17f,hw=5.2f;
              Path n=new Path();n.moveTo(CX+ux*tip,CY+uy*tip);n.lineTo(CX+px*hw,CY+py*hw);n.lineTo(CX-ux*tail+px*2.7f,CY-uy*tail+py*2.7f);n.lineTo(CX-ux*tail-px*2.7f,CY-uy*tail-py*2.7f);n.lineTo(CX-px*hw,CY-py*hw);n.close();
              Paint p=new Paint(Paint.ANTI_ALIAS_FLAG);p.setStyle(Paint.Style.FILL);p.setColor(0x99000000);c.save();c.translate(2f,2f);c.drawPath(n,p);c.restore();
              int nc=GtiPrefs.color(ctx,"needle");p.setShader(new LinearGradient(CX,CY,CX+ux*tip,CY+uy*tip,lighten(nc,.25f),darken(nc,.15f),Shader.TileMode.CLAMP));c.drawPath(n,p);p.setShader(null);
              p.setColor(0xFF17191B);c.drawCircle(CX,CY,9f,p);p.setStyle(Paint.Style.STROKE);p.setStrokeWidth(1.7f);p.setColor(GtiPrefs.color(ctx,"ring"));c.drawCircle(CX,CY,9f,p);p.setStyle(Paint.Style.FILL);p.setColor(nc);c.drawCircle(CX,CY,4.5f,p);
            }

            private static void brand(Context ctx,Canvas c){
              Paint p=new Paint(Paint.ANTI_ALIAS_FLAG|Paint.SUBPIXEL_TEXT_FLAG);p.setTextAlign(Paint.Align.CENTER);p.setTypeface(Typeface.create("sans-serif",Typeface.NORMAL));p.setTextSize(23f);p.setColor(GtiPrefs.color(ctx,"unit"));p.setShadowLayer(2f,0f,1f,Color.BLACK);c.drawText(GtiPrefs.mph(ctx)?"mph":"km/h",CX,238f,p);
              p.setTypeface(Typeface.create("sans-serif-black",Typeface.BOLD));p.setTextSize(39f);p.setColor(GtiPrefs.color(ctx,"logo"));p.setShadowLayer(2.5f,0f,1.5f,0xFF260000);c.drawText("GTI",CX,287f,p);p.clearShadowLayer();
            }

            private static void digital(Context ctx,Canvas c,float speed){
              Paint p=new Paint(Paint.ANTI_ALIAS_FLAG|Paint.SUBPIXEL_TEXT_FLAG);p.setTextAlign(Paint.Align.CENTER);p.setTypeface(Typeface.create("sans-serif",Typeface.BOLD));p.setTextSize(78f);p.setColor(GtiPrefs.color(ctx,"digital"));p.setShadowLayer(3f,0f,2f,Color.BLACK);c.drawText(String.format(Locale.ROOT,"%d",Math.round(speed)),CX,207f,p);p.clearShadowLayer();
            }
            private static void line(Canvas c,Paint p,float deg,float r1,float r2){double a=Math.toRadians(deg);float x=(float)Math.cos(a),y=(float)Math.sin(a);c.drawLine(CX+x*r1,CY+y*r1,CX+x*r2,CY+y*r2,p);}
            private static int lighten(int col,float f){int r=Color.red(col),g=Color.green(col),b=Color.blue(col);return Color.rgb((int)(r+(255-r)*f),(int)(g+(255-g)*f),(int)(b+(255-b)*f));}
            private static int darken(int col,float f){return Color.rgb((int)(Color.red(col)*(1f-f)),(int)(Color.green(col)*(1f-f)),(int)(Color.blue(col)*(1f-f)));}
          }
          EOF

          cat > "$P/app/src/main/java/ch/piiwii/gtispeed/GtiWidgetUpdater.java" <<'EOF'
          package ch.piiwii.gtispeed;
          import android.appwidget.AppWidgetManager;import android.content.ComponentName;import android.content.Context;import android.graphics.Bitmap;import android.widget.RemoteViews;
          final class GtiWidgetUpdater{
            static void updateAll(Context c,float speedKmh){AppWidgetManager m=AppWidgetManager.getInstance(c);int[] ids=m.getAppWidgetIds(new ComponentName(c,GtiSpeedWidgetProvider.class));if(ids==null||ids.length==0)return;Bitmap b=GaugeRenderer.render(c,speedKmh);for(int id:ids){RemoteViews rv=new RemoteViews(c.getPackageName(),R.layout.widget_speed);rv.setImageViewBitmap(R.id.gauge_image,b);m.updateAppWidget(id,rv);}}
            static boolean hasWidgets(Context c){int[] ids=AppWidgetManager.getInstance(c).getAppWidgetIds(new ComponentName(c,GtiSpeedWidgetProvider.class));return ids!=null&&ids.length>0;}
          }
          EOF

          cat > "$P/app/src/main/java/ch/piiwii/gtispeed/GtiSpeedWidgetProvider.java" <<'EOF'
          package ch.piiwii.gtispeed;
          import android.appwidget.*;import android.content.*;import android.os.Build;
          public class GtiSpeedWidgetProvider extends AppWidgetProvider{
            private static void start(Context c){Intent i=new Intent(c,SpeedService.class);if(Build.VERSION.SDK_INT>=26)c.startForegroundService(i);else c.startService(i);}
            @Override public void onEnabled(Context c){super.onEnabled(c);start(c);}
            @Override public void onUpdate(Context c,AppWidgetManager m,int[] ids){super.onUpdate(c,m,ids);GtiWidgetUpdater.updateAll(c,GtiPrefs.lastFiltered(c));start(c);}
            @Override public void onDisabled(Context c){super.onDisabled(c);c.stopService(new Intent(c,SpeedService.class));}
          }
          EOF

          cat > "$P/app/src/main/java/ch/piiwii/gtispeed/BootReceiver.java" <<'EOF'
          package ch.piiwii.gtispeed;
          import android.content.*;import android.os.Build;
          public class BootReceiver extends BroadcastReceiver{public void onReceive(Context c,Intent i){if(!GtiWidgetUpdater.hasWidgets(c))return;Intent s=new Intent(c,SpeedService.class);if(Build.VERSION.SDK_INT>=26)c.startForegroundService(s);else c.startService(s);}}
          EOF

          cat > "$P/app/src/main/java/ch/piiwii/gtispeed/SpeedService.java" <<'EOF'
          package ch.piiwii.gtispeed;
          import android.Manifest;import android.app.*;import android.content.*;import android.content.pm.PackageManager;import android.location.*;import android.os.*;
          public class SpeedService extends Service implements LocationListener{
            private static final String CH="gti_speed_location";private static final int NOTIF=1201;private final Handler h=new Handler(Looper.getMainLooper());private LocationManager lm;private float raw=0f,filtered=0f,accuracy=999f;private long lastGoodElapsed=0L,lastFixWall=0L;
            private final Runnable tick=new Runnable(){public void run(){long age=lastGoodElapsed==0?Long.MAX_VALUE:SystemClock.elapsedRealtime()-lastGoodElapsed;if(age>2800){filtered+=GtiPrefs.zero(SpeedService.this)*(0f-filtered);if(filtered<.45f)filtered=0f;raw=0f;}GtiPrefs.diag(SpeedService.this,raw,filtered,accuracy,lastFixWall,lastGoodElapsed!=0&&age<=2800);GtiWidgetUpdater.updateAll(SpeedService.this,filtered);h.postDelayed(this,200L);}};
            @Override public void onCreate(){super.onCreate();if(Build.VERSION.SDK_INT>=26)((NotificationManager)getSystemService(NOTIFICATION_SERVICE)).createNotificationChannel(new NotificationChannel(CH,"Compteur GTI GPS",NotificationManager.IMPORTANCE_LOW));Intent o=new Intent(this,MainActivity.class);PendingIntent pi=PendingIntent.getActivity(this,0,o,Build.VERSION.SDK_INT>=23?PendingIntent.FLAG_IMMUTABLE:0);Notification.Builder b=Build.VERSION.SDK_INT>=26?new Notification.Builder(this,CH):new Notification.Builder(this);b.setContentTitle("Compteur GTI").setContentText("Vitesse GPS active").setSmallIcon(R.drawable.ic_speed_notification).setOngoing(true).setContentIntent(pi);startForeground(NOTIF,b.build());lm=(LocationManager)getSystemService(LOCATION_SERVICE);requestGps();h.post(tick);}
            private void requestGps(){if(checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION)!=PackageManager.PERMISSION_GRANTED)return;try{lm.requestLocationUpdates(LocationManager.GPS_PROVIDER,200L,0f,this,Looper.getMainLooper());}catch(Exception ignored){}}
            @Override public int onStartCommand(Intent i,int f,int id){requestGps();return START_STICKY;}
            @Override public void onLocationChanged(Location l){long now=SystemClock.elapsedRealtime();long le=Build.VERSION.SDK_INT>=17?l.getElapsedRealtimeNanos()/1000000L:now;long age=Math.max(0,now-le);accuracy=l.hasAccuracy()?l.getAccuracy():999f;float v=l.hasSpeed()?l.getSpeed()*3.6f:0f;if(age>2500||accuracy>80f||v<0f||v>280f)return;if(v<1.5f)v=0f;raw=v;float a=v>filtered?GtiPrefs.rise(this):GtiPrefs.fall(this);if(v==0)a=GtiPrefs.zero(this);filtered+=a*(v-filtered);if(v==0&&filtered<.45f)filtered=0f;lastGoodElapsed=now;lastFixWall=System.currentTimeMillis();GtiPrefs.diag(this,raw,filtered,accuracy,lastFixWall,true);}
            public void onProviderEnabled(String p){}public void onProviderDisabled(String p){}public void onStatusChanged(String p,int s,Bundle e){}@Override public void onDestroy(){h.removeCallbacksAndMessages(null);try{if(lm!=null)lm.removeUpdates(this);}catch(Exception ignored){}super.onDestroy();}@Override public IBinder onBind(Intent i){return null;}
          }
          EOF

          cat > "$P/app/src/main/java/ch/piiwii/gtispeed/MainActivity.java" <<'EOF'
          package ch.piiwii.gtispeed;
          import android.Manifest;import android.app.*;import android.appwidget.AppWidgetManager;import android.content.*;import android.content.pm.PackageManager;import android.graphics.Color;import android.location.LocationManager;import android.os.*;import android.provider.Settings;import android.view.*;import android.widget.*;import java.util.Locale;

          public class MainActivity extends Activity{
            private LinearLayout box;private TextView diag,thresholdLabel,colorHex,preview;private Spinner unitSpinner,accentSpinner,elementSpinner;private SeekBar threshold,rBar,gBar,bBar;private Switch rgbSwitch;private boolean loading=false;private final Handler h=new Handler(Looper.getMainLooper());private final Runnable refresh=new Runnable(){public void run(){updateDiag();h.postDelayed(this,1000);}};
            @Override protected void onCreate(Bundle b){super.onCreate(b);ScrollView sc=new ScrollView(this);sc.setBackgroundColor(0xFF070809);box=new LinearLayout(this);box.setOrientation(LinearLayout.VERTICAL);box.setPadding(28,24,28,34);sc.addView(box);box.addView(txt("COMPTEUR GTI",30,Color.WHITE,true));box.addView(txt("Personnalisation complète • km/h / mph • couleurs fixes ou RGB animé",15,0xFFB9BDC2,false));section("UNITÉ ET ÉCHELLE");unitSpinner=spinner(new String[]{"km/h — 0 à 240","mph — 0 à 150"});unitSpinner.setSelection(GtiPrefs.mph(this)?1:0);unitSpinner.setOnItemSelectedListener(sel(()->{if(loading)return;GtiPrefs.setMph(this,unitSpinner.getSelectedItemPosition()==1);setupThreshold();redraw();}));box.addView(unitSpinner);
              section("ZONE / LIGNE D’ACCENT");accentSpinner=spinner(new String[]{"Côté bas : 0 → seuil","Côté haut : seuil → maximum","Désactivée"});accentSpinner.setSelection(GtiPrefs.accentMode(this));accentSpinner.setOnItemSelectedListener(sel(()->{if(loading)return;GtiPrefs.setAccentMode(this,accentSpinner.getSelectedItemPosition());redraw();}));box.addView(accentSpinner);thresholdLabel=txt("",16,Color.WHITE,false);box.addView(thresholdLabel);threshold=new SeekBar(this);threshold.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener(){public void onProgressChanged(SeekBar s,int v,boolean f){if(loading)return;float kmh=GtiPrefs.mph(MainActivity.this)?v*1.609344f:v;GtiPrefs.setAccentThresholdKmh(MainActivity.this,kmh);updateThresholdLabel();redraw();}public void onStartTrackingTouch(SeekBar s){}public void onStopTrackingTouch(SeekBar s){}});box.addView(threshold);setupThreshold();
              section("COULEURS — ÉLÉMENT PAR ÉLÉMENT");elementSpinner=spinner(GtiPrefs.ELEMENT_LABELS);elementSpinner.setOnItemSelectedListener(sel(()->loadColorEditor()));box.addView(elementSpinner);preview=txt("APERÇU",18,Color.WHITE,true);preview.setGravity(Gravity.CENTER);preview.setPadding(8,14,8,14);box.addView(preview);colorHex=txt("",16,Color.WHITE,false);box.addView(colorHex);rBar=colorBar("Rouge");gBar=colorBar("Vert");bBar=colorBar("Bleu");rgbSwitch=new Switch(this);rgbSwitch.setText("Mode RGB animé pour cet élément");rgbSwitch.setTextColor(Color.WHITE);rgbSwitch.setOnCheckedChangeListener((v,checked)->{if(loading)return;GtiPrefs.setRgb(this,key(),checked);redraw();loadColorEditor();});box.addView(rgbSwitch);
              LinearLayout presets=new LinearLayout(this);presets.setOrientation(LinearLayout.HORIZONTAL);presets.addView(preset("Rouge",0xFFF01828));presets.addView(preset("Bleu",0xFF2196F3));presets.addView(preset("Vert",0xFF00D26A));presets.addView(preset("Blanc",0xFFFFFFFF));box.addView(presets);
              Button reset=button("Rétablir le style GTI d’origine");reset.setOnClickListener(v->{GtiPrefs.resetOriginal(this);reloadAll();redraw();});box.addView(reset);
              section("GPS / DIAGNOSTIC");Button perm=button("Autoriser la localisation");perm.setOnClickListener(v->requestLocation());box.addView(perm);Button start=button("Activer / relancer le GPS");start.setOnClickListener(v->startSpeed());box.addView(start);Button gps=button("Ouvrir les réglages GPS");gps.setOnClickListener(v->startActivity(new Intent(Settings.ACTION_LOCATION_SOURCE_SETTINGS)));box.addView(gps);diag=txt("",15,0xFFE6E7E8,false);box.addView(diag);setContentView(sc);loadColorEditor();if(checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION)==PackageManager.PERMISSION_GRANTED)startSpeed();}
            private void section(String s){TextView t=txt(s,20,0xFFF01828,true);t.setPadding(0,24,0,8);box.addView(t);}
            private Spinner spinner(String[] a){Spinner s=new Spinner(this);ArrayAdapter<String> ad=new ArrayAdapter<>(this,android.R.layout.simple_spinner_dropdown_item,a);s.setAdapter(ad);return s;}
            private AdapterView.OnItemSelectedListener sel(final Runnable r){return new AdapterView.OnItemSelectedListener(){public void onItemSelected(AdapterView<?> p,View v,int pos,long id){r.run();}public void onNothingSelected(AdapterView<?> p){}};}
            private SeekBar colorBar(String label){box.addView(txt(label,14,0xFFD7D9DC,false));SeekBar s=new SeekBar(this);s.setMax(255);s.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener(){public void onProgressChanged(SeekBar b,int v,boolean f){if(loading)return;saveColor();}public void onStartTrackingTouch(SeekBar s){}public void onStopTrackingTouch(SeekBar s){}});box.addView(s);return s;}
            private Button preset(String text,int color){Button b=new Button(this);b.setText(text);b.setLayoutParams(new LinearLayout.LayoutParams(0,-2,1f));b.setOnClickListener(v->{loading=true;rBar.setProgress(Color.red(color));gBar.setProgress(Color.green(color));bBar.setProgress(Color.blue(color));loading=false;saveColor();});return b;}
            private void saveColor(){int c=Color.rgb(rBar.getProgress(),gBar.getProgress(),bBar.getProgress());GtiPrefs.setColor(this,key(),c);GtiPrefs.setRgb(this,key(),rgbSwitch.isChecked());updateColorPreview();redraw();}
            private String key(){int i=elementSpinner==null?0:elementSpinner.getSelectedItemPosition();return GtiPrefs.ELEMENT_KEYS[Math.max(0,Math.min(i,GtiPrefs.ELEMENT_KEYS.length-1))];}
            private void loadColorEditor(){if(rBar==null)return;loading=true;int c=GtiPrefs.staticColor(this,key());rBar.setProgress(Color.red(c));gBar.setProgress(Color.green(c));bBar.setProgress(Color.blue(c));rgbSwitch.setChecked(GtiPrefs.rgb(this,key()));loading=false;updateColorPreview();}
            private void updateColorPreview(){int c=GtiPrefs.staticColor(this,key());colorHex.setText(String.format(Locale.ROOT,"Couleur fixe : #%02X%02X%02X%s",Color.red(c),Color.green(c),Color.blue(c),GtiPrefs.rgb(this,key())?" • RGB animé activé":""));preview.setBackgroundColor(c);preview.setTextColor((Color.red(c)+Color.green(c)+Color.blue(c))>420?Color.BLACK:Color.WHITE);}
            private void setupThreshold(){if(threshold==null)return;loading=true;boolean mph=GtiPrefs.mph(this);threshold.setMax(mph?150:240);int v=Math.round(mph?GtiPrefs.accentThresholdKmh(this)/1.609344f:GtiPrefs.accentThresholdKmh(this));threshold.setProgress(Math.max(0,Math.min(threshold.getMax(),v)));loading=false;updateThresholdLabel();}
            private void updateThresholdLabel(){thresholdLabel.setText("Seuil : "+threshold.getProgress()+" "+(GtiPrefs.mph(this)?"mph":"km/h"));}
            private void reloadAll(){loading=true;unitSpinner.setSelection(GtiPrefs.mph(this)?1:0);accentSpinner.setSelection(GtiPrefs.accentMode(this));loading=false;setupThreshold();loadColorEditor();}
            private void redraw(){GtiWidgetUpdater.updateAll(this,GtiPrefs.lastFiltered(this));}
            private void requestLocation(){if(Build.VERSION.SDK_INT>=23)requestPermissions(new String[]{Manifest.permission.ACCESS_FINE_LOCATION,Manifest.permission.ACCESS_COARSE_LOCATION},42);}
            @Override public void onRequestPermissionsResult(int r,String[] p,int[] g){super.onRequestPermissionsResult(r,p,g);if(r==42&&g.length>0&&g[0]==PackageManager.PERMISSION_GRANTED)startSpeed();}
            private void startSpeed(){Intent i=new Intent(this,SpeedService.class);if(Build.VERSION.SDK_INT>=26)startForegroundService(i);else startService(i);}
            private void updateDiag(){boolean perm=checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION)==PackageManager.PERMISSION_GRANTED;LocationManager lm=(LocationManager)getSystemService(LOCATION_SERVICE);boolean gps=false;try{gps=lm.isProviderEnabled(LocationManager.GPS_PROVIDER);}catch(Exception ignored){}android.content.SharedPreferences p=GtiPrefs.p(this);long t=p.getLong("diag_fix_time",0),age=t==0?-1:Math.max(0,System.currentTimeMillis()-t);int count=AppWidgetManager.getInstance(this).getAppWidgetIds(new ComponentName(this,GtiSpeedWidgetProvider.class)).length;float raw=p.getFloat("diag_raw",0),fil=p.getFloat("diag_filtered",0);String u=GtiPrefs.mph(this)?"mph":"km/h";if(GtiPrefs.mph(this)){raw/=1.609344f;fil/=1.609344f;}diag.setText(String.format(Locale.ROOT,"Permission : %s\nGPS : %s\nFix : %s\nPrécision : %.1f m\nÂge : %s\nVitesse brute : %.1f %s\nVitesse filtrée : %.1f %s\nWidget actif : %s (%d)\nVersion : 1.2.0 (3)",perm?"OK":"KO",gps?"oui":"non",p.getBoolean("diag_has_fix",false)?"oui":"non",p.getFloat("diag_accuracy",999f),age<0?"—":age+" ms",raw,u,fil,u,count>0?"oui":"non",count));}
            private TextView txt(String s,int sp,int color,boolean bold){TextView t=new TextView(this);t.setText(s);t.setTextSize(sp);t.setTextColor(color);if(bold)t.setTypeface(android.graphics.Typeface.DEFAULT_BOLD);t.setPadding(0,6,0,6);return t;}
            private Button button(String s){Button b=new Button(this);b.setText(s);LinearLayout.LayoutParams lp=new LinearLayout.LayoutParams(-1,-2);lp.setMargins(0,6,0,6);b.setLayoutParams(lp);return b;}
            @Override protected void onResume(){super.onResume();h.removeCallbacks(refresh);h.post(refresh);}@Override protected void onPause(){h.removeCallbacks(refresh);super.onPause();}
          }
