name: CI GTI Altimeter Widget 1.2.7

on:
  push:
    branches: [ci-gti-altimeter-widget-1.2.7]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild base project
        shell: bash
        run: |
          set -euo pipefail
          cat ci/gtia120.part.00 ci/gtia120.part.01 ci/gtia120.part.02 ci/gtia120.part.03 ci/gtia120.part.04 ci/gtia120.part.05 ci/gtia120.part.06.00 ci/gtia120.part.06.01 ci/gtia120.part.06.02 ci/gtia120.part.06.03 ci/gtia120.part.06.04 ci/gtia120.part.07.00 ci/gtia120.part.07.01 ci/gtia120.part.07.02 ci/gtia120.part.07.03 ci/gtia120.part.07.04 ci/gtia120.part.07.05 ci/gtia120.part.07.06 ci/gtia120.part.07.07 ci/gtia120.part.07.08 ci/gtia120.part.07.09 ci/gtia120.part.07.10 ci/gtia120.part.07.11 ci/gtia120.part.07.12 ci/gtia120.part.07.13 ci/gtia120.part.07.14 ci/gtia120.part.07.15 | tr -d '\n\r' | base64 -d > /tmp/gtialtimeter-base.zip
          unzip -t /tmp/gtialtimeter-base.zip
          rm -rf ci-gtialtimeter-1.2.7-project
          mkdir ci-gtialtimeter-1.2.7-project
          unzip -q /tmp/gtialtimeter-base.zip -d ci-gtialtimeter-1.2.7-project

      - name: Apply premium skin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-gtialtimeter-1.2.7-project/app/src/main/res/drawable-nodpi
          cat ci/gtia121skin.part.00 ci/gtia121skin.part.01 ci/gtia121skin.part.02 ci/gtia121skin.part.03 ci/gtia121skin.part.04 ci/gtia121skin.part.05 ci/gtia121skin.part.06 | tr -d '\n\r' | base64 -d > ci-gtialtimeter-1.2.7-project/app/src/main/res/drawable-nodpi/altimeter_skin_reference.png

      - name: Apply current logic and two-skin renderer
        shell: bash
        run: |
          set -euo pipefail
          ROOT=ci-gtialtimeter-1.2.7-project
          JAVA="$ROOT/app/src/main/java/ch/piiwii/gtialtimeter"
          cp ci/gtia122-AltitudeState.java "$JAVA/AltitudeState.java"
          cp ci/gtia122-AltitudeService.java "$JAVA/AltitudeService.java"
          cp ci/gtia122-ServiceWatchdog.java "$JAVA/ServiceWatchdog.java"
          cp ci/gtia122-WatchdogReceiver.java "$JAVA/WatchdogReceiver.java"
          cp ci/gtia122-BootReceiver.java "$JAVA/BootReceiver.java"
          cp ci/gtia122-GTIAltimeterWidgetProvider.java "$JAVA/GTIAltimeterWidgetProvider.java"
          cp ci/gtia127-WidgetRenderer.java "$JAVA/WidgetRenderer.java"
          cp ci/gtia127-MainActivity.java "$JAVA/MainActivity.java"
          cp ci/gtia127-SkinPrefs.java "$JAVA/SkinPrefs.java"
          python3 ci/gtia127-procedural-silhouette.py "$JAVA/WidgetRenderer.java"
          python3 ci/gtia125-gps-recovery.py "$ROOT"
          python3 - <<'PY'
          from pathlib import Path
          root=Path('ci-gtialtimeter-1.2.7-project')
          p=root/'app/build.gradle'
          s=p.read_text().replace('versionCode 5','versionCode 12').replace("versionName '1.2.0'","versionName '1.2.7'")
          p.write_text(s)
          m=root/'app/src/main/AndroidManifest.xml'
          s=m.read_text()
          marker='''        <receiver\n            android:name=".BootReceiver"'''
          insertion='''        <receiver\n            android:name=".WatchdogReceiver"\n            android:enabled="true"\n            android:exported="false" />\n\n        <receiver\n            android:name=".BootReceiver"'''
          if '.WatchdogReceiver' not in s:
              s=s.replace(marker,insertion)
          s=s.replace('android:exported="false"\n            android:foregroundServiceType="location" />', 'android:exported="false"\n            android:stopWithTask="false"\n            android:foregroundServiceType="location" />')
          m.write_text(s)
          PY

      - name: Verify Skin 2 and version
        shell: bash
        run: |
          set -euo pipefail
          ROOT=ci-gtialtimeter-1.2.7-project
          grep -q "versionCode 12" "$ROOT/app/build.gradle"
          grep -q "versionName '1.2.7'" "$ROOT/app/build.gradle"
          grep -q 'class SkinPrefs' "$ROOT/app/src/main/java/ch/piiwii/gtialtimeter/SkinPrefs.java"
          grep -q 'Skin 2 · Silhouette' "$ROOT/app/src/main/java/ch/piiwii/gtialtimeter/MainActivity.java"
          grep -q 'drawSilhouetteBase' "$ROOT/app/src/main/java/ch/piiwii/gtialtimeter/WidgetRenderer.java"
          grep -q 'Explicitly erase the Swiss flag area' "$ROOT/app/src/main/java/ch/piiwii/gtialtimeter/WidgetRenderer.java"
          grep -q 'No panel, no outer rectangle' "$ROOT/app/src/main/java/ch/piiwii/gtialtimeter/WidgetRenderer.java"
          grep -q 'GPS_PROVISIONAL_AFTER_MS' "$ROOT/app/src/main/java/ch/piiwii/gtialtimeter/AltitudeService.java"
          grep -q 'invalidateBarometerCalibration' "$ROOT/app/src/main/java/ch/piiwii/gtialtimeter/AltitudeState.java"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle -p ci-gtialtimeter-1.2.7-project --no-daemon --stacktrace clean assembleRelease

      - name: Zipalign and inspect
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          "$BT/zipalign" -p -f 4 ci-gtialtimeter-1.2.7-project/app/build/outputs/apk/release/app-release-unsigned.apk GTI-Altimeter-Widget-1.2.7-aligned-unsigned.apk
          "$BT/aapt" dump badging GTI-Altimeter-Widget-1.2.7-aligned-unsigned.apk > GTI-Altimeter-Widget-1.2.7-badging.txt
          grep -q "package: name='ch.piiwii.gtialtimeter' versionCode='12' versionName='1.2.7'" GTI-Altimeter-Widget-1.2.7-badging.txt
          cp "$BT/lib/apksigner.jar" apksigner.jar
          sha256sum GTI-Altimeter-Widget-1.2.7-aligned-unsigned.apk apksigner.jar > CI-SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: GTI-Altimeter-Widget-1.2.7-build
          retention-days: 3
          path: |
            GTI-Altimeter-Widget-1.2.7-aligned-unsigned.apk
            GTI-Altimeter-Widget-1.2.7-badging.txt
            CI-SHA256.txt
            apksigner.jar
