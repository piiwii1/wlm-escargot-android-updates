name: Build DriveBox RC35 Parkingpay Flow

on:
  push:
    branches: [ drivebox-rc35-parkingpay-flow ]
    paths:
      - '.github/workflows/drivebox-rc35-parkingpay-flow.yml'
      - 'drivebox-ci/rc35-parkingpay-flow.patch.gz.b64'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore validated RC34 source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9629446124/zip" \
            -o /tmp/rc34-artifact.zip
          rm -rf /tmp/rc34-artifact /tmp/drivebox-src
          mkdir -p /tmp/rc34-artifact /tmp/drivebox-src
          unzip -oq /tmp/rc34-artifact.zip -d /tmp/rc34-artifact
          unzip -oq /tmp/rc34-artifact/DriveBox-1.0.0-RC34-source.zip -d /tmp/drivebox-src
          grep -q 'versionCode 43' /tmp/drivebox-src/app/build.gradle
          grep -q "versionName '1.0.0-rc34'" /tmp/drivebox-src/app/build.gradle

      - name: Apply RC35 Parkingpay flow
        shell: bash
        run: |
          set -euo pipefail
          base64 -d drivebox-ci/rc35-parkingpay-flow.patch.gz.b64 | gzip -d > /tmp/rc35.patch
          test "$(sha256sum /tmp/rc35.patch | awk '{print $1}')" = '9311edff0d02b74764f9f1c43587e2557059c1d549591c2f7681fb5a8483de17'
          cd /tmp/drivebox-src
          patch -p1 < /tmp/rc35.patch
          grep -q 'versionCode 44' app/build.gradle
          grep -q "versionName '1.0.0-rc35'" app/build.gradle
          grep -q 'https://twint.parkingpay.ch/' app/src/main/java/ch/clubvwsuisse/drivebox/TwintParkingDetailActivity.java
          grep -q 'Ouvrir le parking TWINT' app/src/main/java/ch/clubvwsuisse/drivebox/TwintParkingDetailActivity.java
          grep -q 'openParkingFlowForPhysicalQr' app/src/main/java/ch/clubvwsuisse/drivebox/TwintParkingDetailActivity.java
          if grep -q 'openTwintForPhysicalQr' app/src/main/java/ch/clubvwsuisse/drivebox/TwintParkingDetailActivity.java; then echo 'Old TWINT-home fallback still present'; exit 1; fi
          if grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml; then echo 'Unexpected INTERNET permission'; exit 1; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build RC35
        working-directory: /tmp/drivebox-src
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Verify and package RC35
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/drivebox-src/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/cert.txt
          grep -qi '6699b2b6b15b5e09032b4f54c5c26bbd982a41dc48d5a5093d1501036a474a1e' /tmp/cert.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='ch.clubvwsuisse.drivebox.v1'" /tmp/badging.txt
          grep -q "versionCode='44'" /tmp/badging.txt
          grep -q "versionName='1.0.0-rc35'" /tmp/badging.txt
          grep -q "application-label:'DriveBox'" /tmp/badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | tee /tmp/perms.txt
          grep -q 'android.permission.CAMERA' /tmp/perms.txt
          grep -q 'android.permission.ACCESS_COARSE_LOCATION' /tmp/perms.txt
          grep -q 'android.permission.ACCESS_FINE_LOCATION' /tmp/perms.txt
          grep -q 'android.permission.POST_NOTIFICATIONS' /tmp/perms.txt
          if grep -q 'android.permission.INTERNET' /tmp/perms.txt; then echo 'Unexpected INTERNET permission'; exit 1; fi
          unzip -t "$APK"
          unzip -p "$APK" res/mipmap-xxxhdpi-v4/ic_launcher.webp > /tmp/icon.webp
          test "$(sha256sum /tmp/icon.webp | awk '{print $1}')" = 'ab5bbd86c44f537aae43e60584c39c923cee3e7c855ae887332617158c0e8a05'
          cp "$APK" "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC35.apk"
          rm -rf /tmp/drivebox-src/app/build /tmp/drivebox-src/.gradle
          (cd /tmp/drivebox-src && zip -qr "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC35-source.zip" .)
          sha256sum "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC35.apk" > "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC35.apk.sha256.txt"
          sha256sum "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC35-source.zip" > "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC35-source.zip.sha256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: DriveBox-1.0.0-RC35-PARKINGPAY-FLOW
          path: |
            DriveBox-1.0.0-RC35.apk
            DriveBox-1.0.0-RC35.apk.sha256.txt
            DriveBox-1.0.0-RC35-source.zip
            DriveBox-1.0.0-RC35-source.zip.sha256.txt
          if-no-files-found: error
          retention-days: 7
