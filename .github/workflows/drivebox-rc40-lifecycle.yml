name: Build DriveBox RC40 Lifecycle

on:
  push:
    branches: [ drivebox-rc40-lifecycle ]
    paths:
      - '.github/workflows/drivebox-rc40-lifecycle.yml'
      - 'drivebox-ci/rc40.part*.b64'
      - 'drivebox-ci/rc40fix.part*.b64'
      - 'drivebox-ci/rc40fix2.b64'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore validated RC39 source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9637107493/zip" -o /tmp/rc39-artifact.zip
          rm -rf /tmp/rc39-artifact /tmp/drivebox-src
          mkdir -p /tmp/rc39-artifact /tmp/drivebox-src
          unzip -oq /tmp/rc39-artifact.zip -d /tmp/rc39-artifact
          test "$(sha256sum /tmp/rc39-artifact/DriveBox-1.0.0-RC39-source.zip | awk '{print $1}')" = 'b442be6895e75d4f147f33580fc537456ee035a7f42481a4317be6bd837820f8'
          unzip -oq /tmp/rc39-artifact/DriveBox-1.0.0-RC39-source.zip -d /tmp/drivebox-src
          grep -q 'versionCode 48' /tmp/drivebox-src/app/build.gradle
          grep -q "versionName '1.0.0-rc39'" /tmp/drivebox-src/app/build.gradle

      - name: Verify and apply RC40 lifecycle patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum drivebox-ci/rc40.part00.b64 | awk '{print $1}')" = '3ac8d9c43e05e53a24227199c69b5678f57c106f45d3b59a23f074911452fd24'
          test "$(sha256sum drivebox-ci/rc40.part01.b64 | awk '{print $1}')" = '9708523536fb572f608e459435de3cf058d1b29632a5182d27a302f2f9e975f9'
          test "$(sha256sum drivebox-ci/rc40.part02.b64 | awk '{print $1}')" = '8b85443da51d4741c6a1e064d697f192de56ce68a7a6d9b0ca9d9604c87c017c'
          test "$(sha256sum drivebox-ci/rc40.part03.b64 | awk '{print $1}')" = '5dffecac7aac0be5be06bf9c0f01f98577d3136e060b622a6264278ac71efd85'
          test "$(sha256sum drivebox-ci/rc40.part04.b64 | awk '{print $1}')" = '31a7f5223b654c517943a1047c6b9ac47da26c7d98dc77e3c34343bc2290a3ed'
          test "$(sha256sum drivebox-ci/rc40.part05.b64 | awk '{print $1}')" = '9845a1a1e8b992b96f4897b86930a5b79e0a1d5bf054c229bd8cf4566b5428a1'
          test "$(sha256sum drivebox-ci/rc40.part06.b64 | awk '{print $1}')" = 'bb80c7c31be917148e8df128edff527aa6570b5ee394a8207fa8b72ebd06a220'
          test "$(sha256sum drivebox-ci/rc40.part07.b64 | awk '{print $1}')" = '4763443901f17f67b8006eeed9546712bbd9c2293c7214d75a511bd99247c24c'
          test "$(sha256sum drivebox-ci/rc40.part08.b64 | awk '{print $1}')" = 'e9dac27d91c194a40f87bec0328b15ab214e76f9307eef3274f9a425ff8c073a'
          test "$(sha256sum drivebox-ci/rc40.part09.b64 | awk '{print $1}')" = '66d71b565ba89afd13cf033cf4f1cca98d7d3da8fee9ed753039fcb518fe42e0'
          cat drivebox-ci/rc40.part*.b64 | base64 -d | gzip -d > /tmp/rc40.patch
          test "$(sha256sum /tmp/rc40.patch | awk '{print $1}')" = 'e635e213ef0956282c11bf6cd86e3459269efb8f2e055bbc49c4afe873bf9c20'
          cd /tmp/drivebox-src
          patch -p1 < /tmp/rc40.patch

          cd "$GITHUB_WORKSPACE"
          test "$(sha256sum drivebox-ci/rc40fix.part00.b64 | awk '{print $1}')" = '5614a1c5de97475b10ff587cad71439bbc793ade82a8b80e4369ec56bab0f8a0'
          test "$(sha256sum drivebox-ci/rc40fix.part01.b64 | awk '{print $1}')" = 'ef0c323c6a073cb1f1948ea1c7846257d28d75f155c6cff0931e8d6a43a99fc1'
          test "$(sha256sum drivebox-ci/rc40fix.part02.b64 | awk '{print $1}')" = '7938907f6d18bf9118a6cac60c666001a04e0d53a44c18a4d415dfd55c4e2e03'
          cat drivebox-ci/rc40fix.part*.b64 | base64 -d | gzip -d > /tmp/rc40fix.patch
          test "$(sha256sum /tmp/rc40fix.patch | awk '{print $1}')" = '0bc6d06b3706a2b1bef04fbd03e997eb259e186b187d219c2cf4928a3bdd97fe'
          cd /tmp/drivebox-src
          patch -p1 < /tmp/rc40fix.patch

          cd "$GITHUB_WORKSPACE"
          test "$(sha256sum drivebox-ci/rc40fix2.b64 | awk '{print $1}')" = '126cb31258160fe6db03fee1fe2d4e687ff52d303ac3188780aabbec61a6dec6'
          base64 -d drivebox-ci/rc40fix2.b64 | gzip -d > /tmp/rc40fix2.patch
          test "$(sha256sum /tmp/rc40fix2.patch | awk '{print $1}')" = 'ad9c2663e696d4bc4da6d3b79c5f4d4dab6178b56cb6e1f78b846494431023f0'
          cd /tmp/drivebox-src
          patch -p1 < /tmp/rc40fix2.patch

          grep -q 'versionCode 49' app/build.gradle
          grep -q "versionName '1.0.0-rc40'" app/build.gradle
          grep -q 'STATE_SCREEN_TAG' app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java
          grep -q 'onSaveInstanceState' app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java
          grep -q 'restoreScreen' app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java
          grep -q 'getPackageManager().getPackageInfo' app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java
          grep -q 'displayVersionCode()' app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java
          grep -q 'android.os.Build.VERSION.SDK_INT' app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java
          grep -q 'stopParkingTicker();' app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java
          grep -q 'widget.render' app/src/main/java/ch/clubvwsuisse/drivebox/ParkingWidgetRenderer.java
          test "$(grep -c '@Test' app/src/test/java/ch/clubvwsuisse/drivebox/ParkingTimePolicyTest.java)" -ge 6
          test -f CONTINUITE-RC40.md
          if grep -q 'BuildConfig.VERSION_' app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java; then echo 'Stale BuildConfig version reference'; exit 1; fi
          if grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml; then echo 'Unexpected INTERNET permission'; exit 1; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests and compile RC40
        working-directory: /tmp/drivebox-src
        run: gradle --no-daemon clean :app:testDebugUnitTest :app:assembleDebug

      - name: Verify and package RC40
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/drivebox-src/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/cert.txt
          grep -qi '6699b2b6b15b5e09032b4f54c5c26bbd982a41dc48d5a5093d1501036a474a1e' /tmp/cert.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='ch.clubvwsuisse.drivebox.v1'" /tmp/badging.txt
          grep -q "versionCode='49'" /tmp/badging.txt
          grep -q "versionName='1.0.0-rc40'" /tmp/badging.txt
          grep -q "application-label:'DriveBox'" /tmp/badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | tee /tmp/perms.txt
          grep -q 'android.permission.CAMERA' /tmp/perms.txt
          grep -q 'android.permission.ACCESS_FINE_LOCATION' /tmp/perms.txt
          grep -q 'android.permission.POST_NOTIFICATIONS' /tmp/perms.txt
          if grep -q 'android.permission.INTERNET' /tmp/perms.txt; then exit 1; fi
          unzip -t "$APK"
          unzip -p "$APK" res/mipmap-xxxhdpi-v4/ic_launcher.webp > /tmp/icon.webp
          test "$(sha256sum /tmp/icon.webp | awk '{print $1}')" = 'ab5bbd86c44f537aae43e60584c39c923cee3e7c855ae887332617158c0e8a05'
          cp "$APK" "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC40.apk"
          rm -rf /tmp/drivebox-src/app/build /tmp/drivebox-src/.gradle
          (cd /tmp/drivebox-src && zip -qr "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC40-source.zip" .)
          sha256sum "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC40.apk" > "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC40.apk.sha256.txt"
          sha256sum "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC40-source.zip" > "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC40-source.zip.sha256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: DriveBox-1.0.0-RC40-LIFECYCLE
          path: |
            DriveBox-1.0.0-RC40.apk
            DriveBox-1.0.0-RC40.apk.sha256.txt
            DriveBox-1.0.0-RC40-source.zip
            DriveBox-1.0.0-RC40-source.zip.sha256.txt
          if-no-files-found: error
          retention-days: 7
