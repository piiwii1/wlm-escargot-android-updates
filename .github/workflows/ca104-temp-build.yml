name: Compagnon Autoroute 1.0.4 graph build

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/ca104-temp-build.yml'

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Live Swiss motorway geometry smoke test
        shell: bash
        run: |
          set -euo pipefail
          LAT='46.2330'; LON='7.3600'
          Q='[out:json][timeout:12];way(around:12000,'"$LAT"','"$LON"')[highway~"^(motorway|motorway_link|trunk|trunk_link)$"];out body geom qt;'
          : > /tmp/ca104-smoke.txt
          OK=0
          for ENDPOINT in 'https://overpass.osm.ch/api/interpreter' 'https://overpass.private.coffee/api/interpreter' 'https://maps.mail.ru/osm/tools/overpass/api/interpreter' 'https://overpass-api.de/api/interpreter'; do
            echo "GRAPH_ENDPOINT=$ENDPOINT" | tee -a /tmp/ca104-smoke.txt
            if curl --fail --silent --show-error --max-time 24 -A 'CompagnonAutoroute-CI/1.0.4' -X POST "$ENDPOINT" --data-urlencode "data=$Q" -o /tmp/graph.json; then
              WAYS=$(jq '[.elements[] | select(.type=="way")] | length' /tmp/graph.json 2>/dev/null || echo 0)
              GEOM=$(jq '[.elements[] | select(.type=="way" and (.geometry|type)=="array" and (.geometry|length)>1)] | length' /tmp/graph.json 2>/dev/null || echo 0)
              ONEWAY=$(jq '[.elements[] | select(.type=="way" and ((.tags.oneway // "") == "yes" or (.tags.oneway // "") == "1" or (.tags.oneway // "") == "-1"))] | length' /tmp/graph.json 2>/dev/null || echo 0)
              echo "GRAPH_WAYS=$WAYS GRAPH_WITH_GEOMETRY=$GEOM EXPLICIT_ONEWAY=$ONEWAY" | tee -a /tmp/ca104-smoke.txt
              if [ "$WAYS" -gt 5 ] && [ "$GEOM" -gt 5 ]; then OK=1; break; fi
            fi
          done
          test "$OK" = 1

      - name: Live Swiss WC and fuel regression smoke test
        shell: bash
        run: |
          set -euo pipefail
          LAT='46.2330'; LON='7.3600'
          Q_FUEL='[out:json][timeout:10];(nwr(around:15000,'"$LAT"','"$LON"')[amenity=fuel];nwr(around:15000,'"$LAT"','"$LON"')[highway=services];);out center qt;'
          Q_WC='[out:json][timeout:10];(nwr(around:15000,'"$LAT"','"$LON"')[amenity=toilets];nwr(around:15000,'"$LAT"','"$LON"')[highway~"^(services|rest_area)$"][toilets];);out center qt;'
          OK=0
          for ENDPOINT in 'https://overpass.osm.ch/api/interpreter' 'https://overpass.private.coffee/api/interpreter' 'https://maps.mail.ru/osm/tools/overpass/api/interpreter' 'https://overpass-api.de/api/interpreter'; do
            FUEL=0; WC=0
            if curl --fail --silent --show-error --max-time 22 -A 'CompagnonAutoroute-CI/1.0.4' -X POST "$ENDPOINT" --data-urlencode "data=$Q_FUEL" -o /tmp/fuel.json; then FUEL=$(jq '.elements | length' /tmp/fuel.json 2>/dev/null || echo 0); fi
            if curl --fail --silent --show-error --max-time 22 -A 'CompagnonAutoroute-CI/1.0.4' -X POST "$ENDPOINT" --data-urlencode "data=$Q_WC" -o /tmp/wc.json; then WC=$(jq '.elements | length' /tmp/wc.json 2>/dev/null || echo 0); fi
            echo "SERVICE_ENDPOINT=$ENDPOINT FUEL_LIKE=$FUEL WC_LIKE=$WC" | tee -a /tmp/ca104-smoke.txt
            if [ "$FUEL" -gt 0 ] && [ "$WC" -gt 0 ]; then OK=1; break; fi
          done
          test "$OK" = 1

      - name: Open encrypted build session
        id: session
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SESSION=$(openssl rand -hex 12)
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/ca104-private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/ca104-private.pem -pubout -out /tmp/ca104-public.pem
          PUB=$(base64 -w0 /tmp/ca104-public.pem)
          gh api repos/${GITHUB_REPOSITORY}/issues/42/comments -f body="CA104_PUBLIC_KEY:${SESSION}:${PUB}" >/dev/null
          echo "session=${SESSION}" >> "$GITHUB_OUTPUT"

      - name: Receive encrypted Git blob manifest and decrypt source
        env:
          GH_TOKEN: ${{ github.token }}
          SESSION: ${{ steps.session.outputs.session }}
        run: |
          set -euo pipefail
          MANIFEST=''
          for i in $(seq 1 160); do
            MANIFEST=$(gh api --paginate repos/${GITHUB_REPOSITORY}/issues/42/comments --jq ".[] | select(.body | startswith(\"CA104_BLOBS:${SESSION}:\")) | .body" | tail -n 1 || true)
            [ -n "$MANIFEST" ] && break
            sleep 5
          done
          test -n "$MANIFEST"
          REST=${MANIFEST#CA104_BLOBS:${SESSION}:}
          KEY_SHA=${REST%%:*}
          SHAS_CSV=${REST#*:}
          gh api repos/${GITHUB_REPOSITORY}/git/blobs/${KEY_SHA} --jq .content | tr -d '\n' | base64 -d > /tmp/ca104-key.enc
          : > /tmp/ca104-source.enc
          IFS=',' read -ra SHAS <<< "$SHAS_CSV"
          for SHA in "${SHAS[@]}"; do
            gh api repos/${GITHUB_REPOSITORY}/git/blobs/${SHA} --jq .content | tr -d '\n' | base64 -d >> /tmp/ca104-source.enc
          done
          openssl pkeyutl -decrypt -inkey /tmp/ca104-private.pem -in /tmp/ca104-key.enc -pkeyopt rsa_padding_mode:oaep > /tmp/ca104-pass.txt
          openssl enc -d -aes-256-cbc -pbkdf2 -in /tmp/ca104-source.enc -out /tmp/ca104-source.zip -pass file:/tmp/ca104-pass.txt
          unzip -tq /tmp/ca104-source.zip
          mkdir -p /tmp/ca104-src
          unzip -q /tmp/ca104-source.zip -d /tmp/ca104-src

      - name: Run route graph core tests
        shell: bash
        run: |
          set -euo pipefail
          PROJ=$(dirname "$(find /tmp/ca104-src -maxdepth 3 -type f -name settings.gradle | head -n 1)")
          test -n "$PROJ"
          cd "$PROJ"
          mkdir -p /tmp/ca104-tests
          javac -d /tmp/ca104-tests app/src/main/java/com/compagnonautoroute/app/core/GeoMath.java app/src/main/java/com/compagnonautoroute/app/core/RouteGraph.java tools/CoreLogicSelfTest.java
          java -cp /tmp/ca104-tests CoreLogicSelfTest | tee -a /tmp/ca104-smoke.txt

      - name: Build and verify APK
        shell: bash
        run: |
          set -euo pipefail
          PROJ=$(dirname "$(find /tmp/ca104-src -maxdepth 3 -type f -name settings.gradle | head -n 1)")
          test -n "$PROJ"; cd "$PROJ"
          gradle --no-daemon :app:assembleDebug --stacktrace
          APK=$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)
          test -f "$APK"; mkdir -p /tmp/ca104-out
          cp "$APK" /tmp/ca104-out/CompagnonAutoroute-1.0.4-V1.apk
          sha256sum /tmp/ca104-out/CompagnonAutoroute-1.0.4-V1.apk | tee /tmp/ca104-out/CompagnonAutoroute-1.0.4-V1.apk.sha256
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$AAPT" dump badging /tmp/ca104-out/CompagnonAutoroute-1.0.4-V1.apk | tee /tmp/ca104-out/badging.txt
          grep -F "package: name='com.compagnonautoroute.app' versionCode='5' versionName='1.0.4-v1'" /tmp/ca104-out/badging.txt
          "$APKSIGNER" verify --verbose --print-certs /tmp/ca104-out/CompagnonAutoroute-1.0.4-V1.apk | tee /tmp/ca104-out/signature.txt
          cp /tmp/ca104-smoke.txt /tmp/ca104-out/live-smoke.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CompagnonAutoroute-1.0.4-V1-APK
          path: /tmp/ca104-out/*
          if-no-files-found: error
          retention-days: 1

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          SESSION: ${{ steps.session.outputs.session }}
        run: gh api repos/${GITHUB_REPOSITORY}/issues/42/comments -f body="CA104_BUILD_DONE:${SESSION}" >/dev/null
