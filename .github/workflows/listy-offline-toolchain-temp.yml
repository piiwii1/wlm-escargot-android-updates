name: Temporary Android Offline Toolchain

on:
  push:
    paths:
      - '.github/workflows/listy-offline-toolchain-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Download Gradle 8.9
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 4 --retry-delay 2 https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle-8.9-bin.zip
          unzip -q /tmp/gradle-8.9-bin.zip -d /tmp
          /tmp/gradle-8.9/bin/gradle --version

      - name: Ensure Android SDK 35 packages
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Seed Android Gradle Plugin 8.7.3 cache
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/seed/app/src/main/java/example/seed
          cat > /tmp/seed/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name='Seed'
          include ':app'
          EOF
          cat > /tmp/seed/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF
          cat > /tmp/seed/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'example.seed'
              compileSdk 35
              defaultConfig { applicationId 'example.seed'; minSdk 26; targetSdk 35; versionCode 1; versionName '1.0' }
              buildTypes { release { minifyEnabled false } }
          }
          EOF
          cat > /tmp/seed/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:theme="@style/AppTheme"/></manifest>
          EOF
          mkdir -p /tmp/seed/app/src/main/res/values
          cat > /tmp/seed/app/src/main/res/values/styles.xml <<'EOF'
          <resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"/></resources>
          EOF
          cd /tmp/seed
          /tmp/gradle-8.9/bin/gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Pack offline toolchain
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/offline/android-sdk/platforms /tmp/offline/android-sdk/build-tools /tmp/offline/gradle-cache/caches
          cp /tmp/gradle-8.9-bin.zip /tmp/offline/
          cp -a "$ANDROID_HOME/platforms/android-35" /tmp/offline/android-sdk/platforms/
          cp -a "$ANDROID_HOME/build-tools/35.0.0" /tmp/offline/android-sdk/build-tools/
          cp -a "$HOME/.gradle/caches/modules-2" /tmp/offline/gradle-cache/caches/
          tar -C /tmp/offline -czf /tmp/listy-android-offline-toolchain.tar.gz .
          sha256sum /tmp/listy-android-offline-toolchain.tar.gz | tee /tmp/listy-android-offline-toolchain.sha256
          ls -lh /tmp/listy-android-offline-toolchain.tar.gz

      - name: Upload toolchain
        uses: actions/upload-artifact@v4
        with:
          name: listy-android-offline-toolchain
          retention-days: 1
          if-no-files-found: error
          path: |
            /tmp/listy-android-offline-toolchain.tar.gz
            /tmp/listy-android-offline-toolchain.sha256
