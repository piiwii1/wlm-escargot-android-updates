name: Temporary Android Manual Toolchain

on:
  push:
    paths:
      - '.github/workflows/listy-offline-toolchain-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Android SDK 35 packages
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Pack minimal manual build toolchain
        shell: bash
        run: |
          set -euxo pipefail
          ROOT=/tmp/listy-manual-toolchain
          mkdir -p "$ROOT/platforms/android-35" "$ROOT/build-tools"
          cp "$ANDROID_HOME/platforms/android-35/android.jar" "$ROOT/platforms/android-35/android.jar"
          cp -a "$ANDROID_HOME/build-tools/35.0.0" "$ROOT/build-tools/35.0.0"
          tar -C /tmp -czf /tmp/listy-android-manual-toolchain.tar.gz listy-manual-toolchain
          sha256sum /tmp/listy-android-manual-toolchain.tar.gz > /tmp/listy-android-manual-toolchain.sha256
          du -sh "$ROOT"
          ls -lh /tmp/listy-android-manual-toolchain.tar.gz

      - name: Upload toolchain
        uses: actions/upload-artifact@v4
        with:
          name: listy-android-manual-toolchain
          retention-days: 1
          if-no-files-found: error
          path: |
            /tmp/listy-android-manual-toolchain.tar.gz
            /tmp/listy-android-manual-toolchain.sha256
