name: EuroScan CH 1.3.9 build
on:
  push:
    branches: [euroscan-build-139]
    paths:
      - '.ci/euroscan139/**'
      - '.github/workflows/euroscan135-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: true
      - name: Restore proven source
        run: |
          set -euo pipefail
          cd .ci/euroscan130
          cat payload.part00 payload.part01 payload.part02 payload.part03 payload.part04full | base64 -d > /tmp/euroscan130.zip
          echo '88a4ae5c43d7852a68861a953f916ef3f32b2faf8956bfefaaa28f18178f53dd  /tmp/euroscan130.zip' | sha256sum -c -
          cd "$GITHUB_WORKSPACE"
          rm -rf euroscan-ch
          unzip -q /tmp/euroscan130.zip
      - name: Apply 1.3.2 navigation
        run: python3 .ci/euroscan132/patch132.py
      - name: Apply 1.3.3 scanner
        run: |
          set -euo pipefail
          for i in $(seq -w 0 11); do : > ".ci/euroscan133/icon.part${i}"; done
          python3 .ci/euroscan133/patch133.py
      - name: Apply 1.3.4 jackpot/history base
        run: |
          set -euo pipefail
          python3 .ci/euroscan134/patch134.py
          rm -f euroscan-ch/app/src/main/res/drawable-nodpi/euroscan_icon.png
          rm -f euroscan-ch/app/src/main/res/drawable/euroscan_icon.xml
          mkdir -p euroscan-ch/app/src/main/res/drawable-nodpi
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAYAAABytg0kAAAAFElEQVR4nGNkl3L/z8DAwMDEAAUAFGgBa7xs7YYAAAAASUVORK5CYII=' | base64 -d > euroscan-ch/app/src/main/res/drawable-nodpi/euroscan_icon.png
      - name: Apply 1.3.5 redesign
        run: gzip -dc .ci/euroscan135/changes.patch.gz | (cd euroscan-ch && patch -p1)
      - name: Apply 1.3.6 replacements
        run: |
          set -euo pipefail
          cat .ci/euroscan136/replacements.part00 .ci/euroscan136/replacements.part01 .ci/euroscan136/replacements.part02 .ci/euroscan136/replacements.part03 | base64 -d > /tmp/euroscan136-replacements.zip
          echo '86adb1460b9d3ed3792363400871c7295d121f2259e7b64472d52756842644ac  /tmp/euroscan136-replacements.zip' | sha256sum -c -
          unzip -qo /tmp/euroscan136-replacements.zip -d euroscan-ch
      - name: Apply 1.3.7 display hotfix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('euroscan-ch')
          f=p/'app/build.gradle'; s=f.read_text().replace('versionCode 11','versionCode 12').replace("versionName '1.3.6'","versionName '1.3.7'"); f.write_text(s)
          f=p/'app/src/main/java/ch/piiwii/euroscan/MainActivity.java'; s=f.read_text().replace('1.3.6','1.3.7')
          old='''    private String formatJackpot(long amount) {\n        long millions = Math.max(0, Math.round(amount / 1000000.0));\n        return millions + (millions == 1 ? " million" : " millions");\n    }'''
          new='''    private String formatJackpot(long amount) {\n        long millions = Math.max(0L, Math.round(amount / 1_000_000.0));\n        return millions + " millions";\n    }'''
          if old not in s: raise SystemExit('formatJackpot anchor missing')
          f.write_text(s.replace(old,new,1))
          PY
      - name: Apply 1.3.8 strict jackpot parser
        run: python3 .ci/euroscan138/patch138.py
      - name: Apply 1.3.9 jackpot/history fix
        run: python3 .ci/euroscan139/patch139.py
      - name: Verify source
        run: |
          set -euo pipefail
          grep -q 'versionCode 14' euroscan-ch/app/build.gradle
          grep -q "versionName '1.3.9'" euroscan-ch/app/build.gradle
          grep -q '160_000_000L' euroscan-ch/app/src/main/java/ch/piiwii/euroscan/MainActivity.java
          grep -q 'TES NUMÉROS' euroscan-ch/app/src/main/java/ch/piiwii/euroscan/MainActivity.java
          grep -q 'TIRAGE OFFICIEL' euroscan-ch/app/src/main/java/ch/piiwii/euroscan/MainActivity.java
          grep -q 'Les numéros entourés sont ceux que tu avais joués ET qui sont sortis.' euroscan-ch/app/src/main/java/ch/piiwii/euroscan/MainActivity.java
          grep -q 'legacyGrids' euroscan-ch/app/src/main/java/ch/piiwii/euroscan/MainActivity.java
          grep -q 'historyNumberRow' euroscan-ch/app/src/main/java/ch/piiwii/euroscan/MainActivity.java
          grep -q 'extractJackpotAmount' euroscan-ch/app/src/main/java/ch/piiwii/euroscan/ResultsRepository.java
      - name: Build release
        working-directory: euroscan-ch
        run: gradle --no-daemon --stacktrace assembleRelease
      - name: Verify APK
        run: |
          set -euo pipefail
          APK='euroscan-ch/app/build/outputs/apk/release/app-release-unsigned.apk'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='ch.piiwii.euroscan' versionCode='14' versionName='1.3.9'" /tmp/badging.txt
          grep -q "launchable-activity: name='ch.piiwii.euroscan.MainActivity'" /tmp/badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
      - name: Delivery
        run: |
          set -euo pipefail
          mkdir -p delivery
          cp euroscan-ch/app/build/outputs/apk/release/app-release-unsigned.apk delivery/EuroScan-CH-1.3.9-UNSIGNED.apk
          zip -qr delivery/EuroScan-CH-1.3.9-SOURCES.zip euroscan-ch -x 'euroscan-ch/app/build/*' 'euroscan-ch/.gradle/*'
          cp /tmp/badging.txt delivery/APK-BADGING.txt
          cat > delivery/CHANGELOG.txt <<'EOF'
          EuroScan CH 1.3.9
          - Rejects the stale 16M jackpot value for the 29.09.2026 rollover and displays the announced 160M value.
          - History now displays played numbers first and the official draw directly below.
          - Numbers and stars present in both the played grid and the official draw are visibly circled in both rows.
          - Older history entries are parsed when possible to reconstruct played grids.
          - Keeps scanner, profile, gain net and persistent navigation from 1.3.8.
          EOF
          printf 'versionName=1.3.9\nversionCode=14\npackage=ch.piiwii.euroscan\n' > delivery/VERSION.txt
          sha256sum delivery/EuroScan-CH-1.3.9-UNSIGNED.apk delivery/EuroScan-CH-1.3.9-SOURCES.zip > delivery/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: EuroScan-CH-1.3.9-UNSIGNED
          path: delivery/*
          retention-days: 7
