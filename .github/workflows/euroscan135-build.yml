name: EuroScan CH 1.3.6 build
on:
  push:
    branches: [euroscan-build-136]
    paths:
      - '.ci/euroscan136/**'
      - '.github/workflows/euroscan135-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: true
      - name: Restore proven source
        run: |
          set -euo pipefail
          cd .ci/euroscan130
          cat payload.part00 payload.part01 payload.part02 payload.part03 payload.part04full | base64 -d > /tmp/euroscan130.zip
          echo '88a4ae5c43d7852a68861a953f916ef3f32b2faf8956bfefaaa28f18178f53dd  /tmp/euroscan130.zip' | sha256sum -c -
          cd "$GITHUB_WORKSPACE"
          rm -rf euroscan-ch
          unzip -q /tmp/euroscan130.zip
      - name: Apply 1.3.2 navigation
        run: python3 .ci/euroscan132/patch132.py
      - name: Apply 1.3.3 scanner
        run: |
          set -euo pipefail
          for i in $(seq -w 0 11); do : > ".ci/euroscan133/icon.part${i}"; done
          python3 .ci/euroscan133/patch133.py
      - name: Apply 1.3.4 jackpot/history base
        run: |
          set -euo pipefail
          python3 .ci/euroscan134/patch134.py
          rm -f euroscan-ch/app/src/main/res/drawable-nodpi/euroscan_icon.png
          rm -f euroscan-ch/app/src/main/res/drawable/euroscan_icon.xml
          mkdir -p euroscan-ch/app/src/main/res/drawable-nodpi
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAYAAABytg0kAAAAFElEQVR4nGNkl3L/z8DAwMDEAAUAFGgBa7xs7YYAAAAASUVORK5CYII=' | base64 -d > euroscan-ch/app/src/main/res/drawable-nodpi/euroscan_icon.png
      - name: Apply 1.3.5 redesign
        run: |
          set -euo pipefail
          gzip -dc .ci/euroscan135/changes.patch.gz | (cd euroscan-ch && patch -p1)
      - name: Apply 1.3.6 replacements
        run: |
          set -euo pipefail
          unzip -t .ci/euroscan136/replacements.zip >/dev/null
          unzip -qo .ci/euroscan136/replacements.zip -d euroscan-ch
      - name: Verify source
        run: |
          set -euo pipefail
          grep -q 'versionCode 11' euroscan-ch/app/build.gradle
          grep -q "versionName '1.3.6'" euroscan-ch/app/build.gradle
          grep -q 'return millions + (millions == 1 ? " million" : " millions")' euroscan-ch/app/src/main/java/ch/piiwii/euroscan/MainActivity.java
          grep -q 'historyDrawRow' euroscan-ch/app/src/main/java/ch/piiwii/euroscan/MainActivity.java
          grep -q 'Gain net' euroscan-ch/app/src/main/java/ch/piiwii/euroscan/MainActivity.java
          grep -q 'pickProfilePhoto' euroscan-ch/app/src/main/java/ch/piiwii/euroscan/MainActivity.java
          grep -q 'scannerBottomNav' euroscan-ch/app/src/main/java/ch/piiwii/euroscan/ScannerActivity.java
      - name: Build release
        working-directory: euroscan-ch
        run: gradle --no-daemon --stacktrace assembleRelease
      - name: Verify APK
        run: |
          set -euo pipefail
          APK='euroscan-ch/app/build/outputs/apk/release/app-release-unsigned.apk'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='ch.piiwii.euroscan' versionCode='11' versionName='1.3.6'" /tmp/badging.txt
          grep -q "launchable-activity: name='ch.piiwii.euroscan.MainActivity'" /tmp/badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
      - name: Delivery
        run: |
          set -euo pipefail
          mkdir -p delivery
          cp euroscan-ch/app/build/outputs/apk/release/app-release-unsigned.apk delivery/EuroScan-CH-1.3.6-UNSIGNED.apk
          zip -qr delivery/EuroScan-CH-1.3.6-SOURCES.zip euroscan-ch -x 'euroscan-ch/app/build/*' 'euroscan-ch/.gradle/*'
          cp /tmp/badging.txt delivery/APK-BADGING.txt
          cat > delivery/CHANGELOG.txt <<'EOF'
          EuroScan CH 1.3.6
          - Jackpot simplified to rounded whole millions only.
          - Bottom navigation added to scanner.
          - History removes Home and Scan action buttons.
          - History focuses on official draw numbers and circles matches from played grids.
          - Adds per-ticket and global net gain.
          - Profile reduced to profile photo + nickname only.
          - Keeps scanner OCR improvements and persistent history.
          EOF
          printf 'versionName=1.3.6\nversionCode=11\npackage=ch.piiwii.euroscan\n' > delivery/VERSION.txt
          sha256sum delivery/EuroScan-CH-1.3.6-UNSIGNED.apk delivery/EuroScan-CH-1.3.6-SOURCES.zip > delivery/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: EuroScan-CH-1.3.6-UNSIGNED
          path: delivery/*
          retention-days: 7
