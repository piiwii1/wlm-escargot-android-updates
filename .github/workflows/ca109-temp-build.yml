name: Compagnon Autoroute 1.0.9 build verified
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ca109-temp-build.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Reconstruct verified 1.0.8 base and apply 1.0.9 code patch
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          set -euo pipefail
          : > /tmp/source.zip
          for H in 2ea825b585a9f260bd4256fe811650d245ccd837 5e6264585e4ec332f8e6b0f3852857f9edfb4dca d39c3528e691213de6d750e3ba12d2e29baccf78 0f9b4635d69cc740e8ccb462379e07c0685e0159; do
            gh api repos/${GITHUB_REPOSITORY}/git/blobs/$H --jq .content | tr -d '\n' | base64 -d >> /tmp/source.zip
          done
          echo '4b336e63b342a0cd7eca9a68d7b51fdf7a908d531c6ba87a1a585f7aed2374a1  /tmp/source.zip' | sha256sum -c -
          unzip -tq /tmp/source.zip
          mkdir /tmp/src
          unzip -q /tmp/source.zip -d /tmp/src
          gh api repos/${GITHUB_REPOSITORY}/git/blobs/e5976342589fed3af27f050fc65c81615775cc91 --jq .content | tr -d '\n' | base64 -d > /tmp/ca109-code.patch
          echo '09c5b55d9b36f1c5bdd4aad44f42e45651e822003dfe68eaeae5cb4afaa0f4c9  /tmp/ca109-code.patch' | sha256sum -c -
          P=$(dirname "$(find /tmp/src -maxdepth 3 -name settings.gradle | head -1)")
          cd "$P"
          patch -p4 --batch < /tmp/ca109-code.patch
          sed -i 's/external\.setOnClickListener(v -> openCurrentPositionInMaps())/external.setOnClickListener(view -> openCurrentPositionInMaps())/' app/src/main/java/com/compagnonautoroute/app/MainActivity.java
          echo '121c62f3ec26fa03159c30fe6bc15f925f62077fb255c18b198e21dca8fbee5e  app/build.gradle' | sha256sum -c -
          echo 'e2eb00e1af1019ecfe7b9215888197a7bdd3f059f2071c5e12cee92beb8fedce  app/src/main/java/com/compagnonautoroute/app/MainActivity.java' | sha256sum -c -
          echo '1a327e931b1d05006d7178d5259992c810ef96642fd008edd4f65b2d34f1147b  app/src/main/java/com/compagnonautoroute/app/data/OverpassClient.java' | sha256sum -c -
          echo 'c88532054aa31c547215a6f344038cedbe8801d6320acb1a402be0b3dd53d923  app/src/main/res/values/styles.xml' | sha256sum -c -
      - name: Core tests
        run: |
          set -e
          P=$(dirname "$(find /tmp/src -maxdepth 3 -name settings.gradle | head -1)")
          mkdir /tmp/core
          javac -d /tmp/core "$P/app/src/main/java/com/compagnonautoroute/app/core/GeoMath.java" "$P/app/src/main/java/com/compagnonautoroute/app/core/RouteGraph.java" "$P/tools/CoreLogicSelfTest.java"
          java -cp /tmp/core CoreLogicSelfTest | tee /tmp/core-tests.txt
      - name: Live Swiss service data
        run: |
          set -e
          Q='[out:json][timeout:18];(nwr(around:25000,46.2331,7.3606)[amenity=fuel];nwr(around:25000,46.2331,7.3606)[amenity=toilets];nwr(around:25000,46.2331,7.3606)[amenity=charging_station];);out center qt;'
          curl -fsS --max-time 35 -A 'CompagnonAutoroute-CI/1.0.9' -X POST https://overpass.osm.ch/api/interpreter --data-urlencode "data=$Q" -o /tmp/services.json
          F=$(jq '[.elements[]|select(.tags.amenity=="fuel")]|length' /tmp/services.json)
          W=$(jq '[.elements[]|select(.tags.amenity=="toilets")]|length' /tmp/services.json)
          C=$(jq '[.elements[]|select(.tags.amenity=="charging_station")]|length' /tmp/services.json)
          echo "FUEL=$F WC=$W CHARGE=$C" | tee /tmp/live-services.txt
          test "$F" -gt 0
          test "$W" -gt 0
          test "$C" -gt 0
      - name: Build unsigned APK
        run: |
          set -e
          P=$(dirname "$(find /tmp/src -maxdepth 3 -name settings.gradle | head -1)")
          cd "$P"
          gradle --no-daemon :app:assembleRelease
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          test -f "$APK"
          mkdir /tmp/out
          cp "$APK" /tmp/out/CompagnonAutoroute-1.0.9-V1-unsigned.apk
          B=$(find $ANDROID_HOME/build-tools -name aapt | sort -V | tail -1)
          $B dump badging /tmp/out/CompagnonAutoroute-1.0.9-V1-unsigned.apk | tee /tmp/out/badging.txt
          grep -F "package: name='com.compagnonautoroute.app' versionCode='10' versionName='1.0.9-v1'" /tmp/out/badging.txt
          cp /tmp/core-tests.txt /tmp/live-services.txt /tmp/out/
      - uses: actions/upload-artifact@v4
        with:
          name: CompagnonAutoroute-1.0.9-V1-UNSIGNED
          path: '/tmp/out/*'
          retention-days: 1
