name: Compagnon Autoroute 1.0.9 build
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ca109-temp-build.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Reconstruct source
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          set -euo pipefail
          : > /tmp/source.zip
          for H in 943f3465dea4b796b1e565174ab27a8f7dcf5772 44dd6458dd5a5585eea192dc9a0d8a90299531c2; do
            gh api repos/${GITHUB_REPOSITORY}/git/blobs/$H --jq .content | tr -d '\n' | base64 -d >> /tmp/source.zip
          done
          echo '3865d9ec7c7489d00a76da98683e004f1d20b8da6a92fb17991a02a9acfd0d3b  /tmp/source.zip' | sha256sum -c -
          unzip -tq /tmp/source.zip
          mkdir /tmp/src
          unzip -q /tmp/source.zip -d /tmp/src
      - name: Core tests
        run: |
          set -e
          P=$(dirname "$(find /tmp/src -maxdepth 3 -name settings.gradle | head -1)")
          mkdir /tmp/core
          javac -d /tmp/core "$P/app/src/main/java/com/compagnonautoroute/app/core/GeoMath.java" "$P/app/src/main/java/com/compagnonautoroute/app/core/RouteGraph.java" "$P/tools/CoreLogicSelfTest.java"
          java -cp /tmp/core CoreLogicSelfTest | tee /tmp/core-tests.txt
      - name: Live Swiss service data
        run: |
          set -e
          Q='[out:json][timeout:18];(nwr(around:25000,46.2331,7.3606)[amenity=fuel];nwr(around:25000,46.2331,7.3606)[amenity=toilets];nwr(around:25000,46.2331,7.3606)[amenity=charging_station];);out center qt;'
          curl -fsS --max-time 35 -A 'CompagnonAutoroute-CI/1.0.9' -X POST https://overpass.osm.ch/api/interpreter --data-urlencode "data=$Q" -o /tmp/services.json
          F=$(jq '[.elements[]|select(.tags.amenity=="fuel")]|length' /tmp/services.json)
          W=$(jq '[.elements[]|select(.tags.amenity=="toilets")]|length' /tmp/services.json)
          C=$(jq '[.elements[]|select(.tags.amenity=="charging_station")]|length' /tmp/services.json)
          echo "FUEL=$F WC=$W CHARGE=$C" | tee /tmp/live-services.txt
          test "$F" -gt 0
          test "$W" -gt 0
          test "$C" -gt 0
      - name: Build unsigned APK
        run: |
          set -e
          P=$(dirname "$(find /tmp/src -maxdepth 3 -name settings.gradle | head -1)")
          cd "$P"
          gradle --no-daemon :app:assembleRelease
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          test -f "$APK"
          mkdir /tmp/out
          cp "$APK" /tmp/out/CompagnonAutoroute-1.0.9-V1-unsigned.apk
          B=$(find $ANDROID_HOME/build-tools -name aapt | sort -V | tail -1)
          $B dump badging /tmp/out/CompagnonAutoroute-1.0.9-V1-unsigned.apk | tee /tmp/out/badging.txt
          grep -F "package: name='com.compagnonautoroute.app' versionCode='10' versionName='1.0.9-v1'" /tmp/out/badging.txt
          cp /tmp/core-tests.txt /tmp/live-services.txt /tmp/out/
      - uses: actions/upload-artifact@v4
        with:
          name: CompagnonAutoroute-1.0.9-V1-UNSIGNED
          path: '/tmp/out/*'
          retention-days: 1
