name: Decode APK Installer PiiWii delivery

on:
  push:
    branches: [apk-installer-piiwii-133-delivery]

permissions:
  contents: write

jobs:
  decode:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and verify APK
        run: |
          set -euo pipefail
          base64 -d APK-Installer-PiiWii-1.3.3.apk.b64 > APK-Installer-PiiWii-1.3.3.apk
          echo '538f0f49ba149ae11657a5f1efb8e14c34de36e1e105d4e343d2d9d7336756fa  APK-Installer-PiiWii-1.3.3.apk' | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: APK-Installer-PiiWii-1.3.3
          path: APK-Installer-PiiWii-1.3.3.apk
          if-no-files-found: error
          retention-days: 7
