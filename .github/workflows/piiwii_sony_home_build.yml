name: PiiWii Sony Accueil 1.5.0 Unsigned Build
on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/piiwii_sony_home_build.yml' ]
  pull_request:
    paths: [ '.github/workflows/piiwii_sony_home_build.yml' ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Restore Android 7 project (wallpaper placeholder only)
        shell: bash
        run: |
          mkdir -p sony-launcher
          cat <<'PROJECT_B64' | base64 --decode | tar xzf - -C sony-launcher
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          PROJECT_B64
      - name: Compile unsigned APK
        working-directory: sony-launcher
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon assembleRelease
          mkdir -p ../delivery
          find app/build/outputs/apk/release -type f -name '*.apk' -print
          APK=$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)
          test -s "$APK"
          cp "$APK" ../delivery/PiiWii-Sony-Accueil-1.5.0-UNSIGNED.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PiiWii-Sony-Accueil-1.5.0-UNSIGNED
          path: delivery/
          if-no-files-found: error
