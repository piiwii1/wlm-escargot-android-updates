name: PiiWii Sony Accueil 1.0.0 Public Build
on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/piiwii_sony_home_build.yml' ]
  workflow_dispatch:
  pull_request:
    paths: [ '.github/workflows/piiwii_sony_home_build.yml' ]
permissions:
  contents: write
