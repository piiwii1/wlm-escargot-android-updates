      - name: Build Sony Android 7 launcher
        working-directory: sony-launcher
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../build-output/piiwii-sony-home-1.0.0
          gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee ../build-output/piiwii-sony-home-1.0.0/gradle.log
      - name: Create APK artifact
        shell: bash
        run: |
          set -euo pipefail
          APK=sony-launcher/app/build/outputs/apk/debug/app-debug.apk
          OUT=sony-launcher-output/v1.0.0
          mkdir -p "$OUT"
          if [ ! -f "$APK" ]; then
            mkdir -p build-output/piiwii-sony-home-1.0.0
            echo BUILD_FAILED > build-output/piiwii-sony-home-1.0.0/STATUS.txt
            exit 0
          fi
          cp "$APK" "$OUT/PiiWii-Sony-Accueil-1.0.0.apk"
          sha256sum "$OUT/PiiWii-Sony-Accueil-1.0.0.apk" > "$OUT/SHA256.txt"
          mkdir -p build-output/piiwii-sony-home-1.0.0
          base64 -w0 "$APK" | fold -w 4000 | split -d -a 3 -l 1 - build-output/piiwii-sony-home-1.0.0/apk_
          cp "$OUT/SHA256.txt" build-output/piiwii-sony-home-1.0.0/SHA256.txt
          echo 'BUILD_OK' > build-output/piiwii-sony-home-1.0.0/STATUS.txt
      - uses: actions/upload-artifact@v4
        if: hashFiles('sony-launcher-output/v1.0.0/*.apk') != ''
        with:
          name: PiiWii-Sony-Accueil-1.0.0
          path: sony-launcher-output/v1.0.0/
          if-no-files-found: error
      - name: Publish APK chunks in private build repository
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-output/piiwii-sony-home-1.0.0/
          git diff --cached --quiet && exit 0
          git commit -m 'Deliver PiiWii Sony Home 1.0.0 APK for Android 7'
          git push

# Verify Nougat build on pull request
