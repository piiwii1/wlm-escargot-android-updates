name: Compagnon Autoroute encrypted payload joiner

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/ca-temp-join.yml'

permissions:
  contents: read
  issues: write

jobs:
  join:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Join encrypted chunks
        env:
          GH_TOKEN: ${{ github.token }}
          SESSION: '581941c975841d8f47eef081'
          ISSUE: '38'
        run: |
          set -euo pipefail
          DONE=''
          for i in $(seq 1 120); do
            DONE=$(gh api --paginate repos/${GITHUB_REPOSITORY}/issues/${ISSUE}/comments --jq ".[] | select(.body | startswith(\"CA_CHUNK_DONE_V1:${SESSION}:\")) | .body" | tail -n 1 || true)
            [ -n "$DONE" ] && break
            sleep 5
          done
          test -n "$DONE"
          COUNT=${DONE##*:}
          : > /tmp/joined.txt
          for N in $(seq 1 "$COUNT"); do
            BODY=$(gh api --paginate repos/${GITHUB_REPOSITORY}/issues/${ISSUE}/comments --jq ".[] | select(.body | startswith(\"CA_CHUNK_V1:${SESSION}:${N}:\")) | .body" | tail -n 1)
            test -n "$BODY"
            PREFIX="CA_CHUNK_V1:${SESSION}:${N}:"
            printf '%s' "${BODY#${PREFIX}}" >> /tmp/joined.txt
          done
          BODY="CA_PAYLOAD_V1:${SESSION}:$(cat /tmp/joined.txt)"
          test $(printf '%s' "$BODY" | wc -c) -lt 65000
          jq -n --arg body "$BODY" '{body:$body}' > /tmp/comment.json
          gh api --method POST repos/${GITHUB_REPOSITORY}/issues/${ISSUE}/comments --input /tmp/comment.json >/dev/null
