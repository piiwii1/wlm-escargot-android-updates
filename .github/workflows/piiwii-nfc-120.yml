name: PiiWii NFC 1.0.20 Screenshot UI Build

on:
  push:
    branches: [ main ]
    paths:
      - 'piiwii-nfc-public/v120/**'
      - '.github/workflows/piiwii-nfc-120.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download validated 1.0.19 sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/piiwii-nfc /tmp/art119
          mkdir -p /tmp/piiwii-nfc /tmp/art119
          gh api repos/${{ github.repository }}/actions/artifacts/11034799470/zip > /tmp/art119.zip
          unzip -q /tmp/art119.zip -d /tmp/art119
          unzip -q /tmp/art119/PiiWii-NFC-1.0.19-SOURCES.zip -d /tmp/piiwii-nfc
          test -d /tmp/piiwii-nfc/PiiWii-NFC-1.0.19
      - name: Apply 1.0.20 UI refinement
        working-directory: /tmp/piiwii-nfc/PiiWii-NFC-1.0.19
        run: |
          python3 "$GITHUB_WORKSPACE/piiwii-nfc-public/v120/apply120.py"
          cd /tmp/piiwii-nfc
          mv PiiWii-NFC-1.0.19 PiiWii-NFC-1.0.20
      - name: Build APK
        working-directory: /tmp/piiwii-nfc/PiiWii-NFC-1.0.20
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify APK and UI refinement
        run: |
          AAPT=/usr/local/lib/android/sdk/build-tools/35.0.0/aapt
          APKSIGNER=/usr/local/lib/android/sdk/build-tools/35.0.0/apksigner
          ROOT=/tmp/piiwii-nfc/PiiWii-NFC-1.0.20
          APK=$ROOT/app/build/outputs/apk/debug/app-debug.apk
          "$AAPT" dump badging "$APK" | head -20
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          grep -q "versionName '1.0.20'" "$ROOT/app/build.gradle"
          grep -q "versionCode 21" "$ROOT/app/build.gradle"
          grep -q "applicationId 'ch.piiwii.nfc.v120'" "$ROOT/app/build.gradle"
          ! grep -q 'android:text="Outils NFC" android:textColor="@color/text" android:textSize="24sp"' "$ROOT/app/src/main/res/layout/activity_main.xml"
          grep -q 'android:layout_height="68dp"' "$ROOT/app/src/main/res/layout/activity_main.xml"
          grep -q 'historyErase' "$ROOT/app/src/main/res/layout/activity_main.xml"
          grep -q 'switch_thumb' "$ROOT/app/src/main/res/layout/activity_main.xml"
          test -f "$ROOT/app/src/main/res/color/switch_thumb.xml"
          test -f "$ROOT/app/src/main/res/color/switch_track.xml"
      - name: Package deliverables
        run: |
          mkdir -p piiwii-nfc-public/dist-120
          cp /tmp/piiwii-nfc/PiiWii-NFC-1.0.20/app/build/outputs/apk/debug/app-debug.apk piiwii-nfc-public/dist-120/PiiWii-NFC-1.0.20.apk
          cd /tmp/piiwii-nfc
          zip -qr "$GITHUB_WORKSPACE/piiwii-nfc-public/dist-120/PiiWii-NFC-1.0.20-SOURCES.zip" PiiWii-NFC-1.0.20
          cd "$GITHUB_WORKSPACE/piiwii-nfc-public/dist-120"
          sha256sum PiiWii-NFC-1.0.20.apk PiiWii-NFC-1.0.20-SOURCES.zip > SHA256SUMS.txt
      - name: Upload deliverables
        uses: actions/upload-artifact@v4
        with:
          name: PiiWii-NFC-1.0.20
          path: piiwii-nfc-public/dist-120/
          retention-days: 7
          if-no-files-found: error
