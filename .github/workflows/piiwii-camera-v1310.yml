name: Build PiiWii Camera 1.3.10 Samsung landscape

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/piiwii-camera-v1310.yml'
      - 'piiwii-camera-v1310/**'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Restore verified 1.3.9 source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10176737158/zip" \
            -o /tmp/v139-artifact.zip
          mkdir -p /tmp/v139-artifact /tmp/piiwii-camera-v1310
          unzip -q /tmp/v139-artifact.zip -d /tmp/v139-artifact
          unzip -q /tmp/v139-artifact/PiiWii-Camera-1.3.9-SOURCES.zip -d /tmp/piiwii-camera-v1310
          test -f /tmp/piiwii-camera-v1310/PiiWii-Camera-1.3.9-public/app/build.gradle
          grep -q "versionCode 22" /tmp/piiwii-camera-v1310/PiiWii-Camera-1.3.9-public/app/build.gradle
          grep -q "versionName '1.3.9'" /tmp/piiwii-camera-v1310/PiiWii-Camera-1.3.9-public/app/build.gradle

      - name: Apply 1.3.10 Samsung landscape patch
        run: |
          base64 -d "$GITHUB_WORKSPACE/piiwii-camera-v1310/v1310.patch.gz.b64" | gzip -d > /tmp/v1310.patch
          echo '97a8e49a0b96ca45e534f8d63221ba47de456cce79ba3721e99feff5a9ae218e  /tmp/v1310.patch' | sha256sum -c -
          cd /tmp/piiwii-camera-v1310/PiiWii-Camera-1.3.9-public
          patch -p2 < /tmp/v1310.patch
          grep -q "versionCode 23" app/build.gradle
          grep -q "versionName '1.3.10'" app/build.gradle
          grep -q 'landscapeAdvancedDrawer' app/src/main/java/ch/piiwii/camera/MainActivity.java
          grep -q 'android:rotation="-90"' app/src/main/res/layout-land/activity_main.xml
          grep -q 'android:id="@+id/landscapeZoomRail"' app/src/main/res/layout-land/activity_main.xml

      - name: Build release APK
        run: gradle -p /tmp/piiwii-camera-v1310/PiiWii-Camera-1.3.9-public --no-daemon :app:assembleRelease

      - name: Collect APK and sources
        run: |
          set -e
          mkdir -p /tmp/piiwii-camera-v1310-out
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 \
            /tmp/piiwii-camera-v1310/PiiWii-Camera-1.3.9-public/app/build/outputs/apk/release/app-release-unsigned.apk \
            /tmp/piiwii-camera-v1310-out/PiiWii-Camera-1.3.10-ALIGNED-UNSIGNED.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" /tmp/piiwii-camera-v1310-out/apksigner.jar
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging /tmp/piiwii-camera-v1310-out/PiiWii-Camera-1.3.10-ALIGNED-UNSIGNED.apk > /tmp/piiwii-camera-v1310-out/badging.txt
          sha256sum /tmp/piiwii-camera-v1310-out/PiiWii-Camera-1.3.10-ALIGNED-UNSIGNED.apk > /tmp/piiwii-camera-v1310-out/unsigned-sha256.txt
          cd /tmp/piiwii-camera-v1310
          mv PiiWii-Camera-1.3.9-public PiiWii-Camera-1.3.10-public
          zip -qr /tmp/piiwii-camera-v1310-out/PiiWii-Camera-1.3.10-SOURCES.zip PiiWii-Camera-1.3.10-public

      - uses: actions/upload-artifact@v4
        with:
          name: PiiWii-Camera-1.3.10-samsung-landscape-unsigned
          retention-days: 7
          path: /tmp/piiwii-camera-v1310-out/
