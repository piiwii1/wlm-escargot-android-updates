name: GTI Audio Visualizer 0.2.2 Build

on:
  push:
    branches: ["gti-audio-visualizer-v022-build"]
    paths:
      - ".github/workflows/gti-audio-visualizer-v022-build.yml"
      - "gti-audio-visualizer-v022/**"

permissions:
  contents: read

env:
  ANDROID_BUILD_TOOLS: "35.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gti-audio-visualizer-v022-build

      - name: Reconstruct and verify source
        run: |
          set -euo pipefail
          cat \
            gti-audio-visualizer-v022/source.part00 \
            gti-audio-visualizer-v022/source.part01 \
            gti-audio-visualizer-v022/source.part02 \
            gti-audio-visualizer-v022/source.part03a \
            gti-audio-visualizer-v022/source.part03b \
            gti-audio-visualizer-v022/source.part04a \
            gti-audio-visualizer-v022/source.part04b \
            gti-audio-visualizer-v022/source.part05a \
            gti-audio-visualizer-v022/source.part05b \
            gti-audio-visualizer-v022/source.part06a \
            gti-audio-visualizer-v022/source.part06b \
            gti-audio-visualizer-v022/source.part07a \
            gti-audio-visualizer-v022/source.part07b > /tmp/source.b64
          test "$(wc -c < /tmp/source.b64)" = "53736"
          base64 -d /tmp/source.b64 > /tmp/source.zip
          echo "3b96afc22e1c9c27af970bdcd20a6418e345c33505ea2e27067f8bad72764344  /tmp/source.zip" | sha256sum -c -
          rm -rf /tmp/gti-v022
          mkdir -p /tmp/gti-v022
          unzip -q /tmp/source.zip -d /tmp/gti-v022
          grep -n "versionName '0.2.2'" /tmp/gti-v022/app/build.gradle
          grep -n "versionCode 4" /tmp/gti-v022/app/build.gradle

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Assemble release
        working-directory: /tmp/gti-v022
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Align and verify APK
        run: |
          set -euo pipefail
          mkdir -p /tmp/out
          "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/zipalign" -f -p 4 \
            /tmp/gti-v022/app/build/outputs/apk/release/app-release-unsigned.apk \
            /tmp/out/GTI-Audio-Visualizer-0.2.2-aligned-unsigned.apk
          "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/zipalign" -c -v 4 /tmp/out/GTI-Audio-Visualizer-0.2.2-aligned-unsigned.apk
          sha256sum /tmp/out/GTI-Audio-Visualizer-0.2.2-aligned-unsigned.apk > /tmp/out/UNSIGNED-SHA256.txt
          unzip -t /tmp/out/GTI-Audio-Visualizer-0.2.2-aligned-unsigned.apk > /tmp/out/ZIP-TEST.txt

      - name: Upload unsigned aligned APK
        uses: actions/upload-artifact@v4
        with:
          name: GTI-Audio-Visualizer-0.2.2-unsigned
          path: |
            /tmp/out/GTI-Audio-Visualizer-0.2.2-aligned-unsigned.apk
            /tmp/out/UNSIGNED-SHA256.txt
            /tmp/out/ZIP-TEST.txt
          if-no-files-found: error
          retention-days: 7
