name: EuroScan CH 1.3.1 Build

on:
  push:
    branches: [ euroscan-build-131 ]
    paths:
      - '.github/workflows/euroscan-ch-131-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore proven EuroScan 1.3.0 source
        run: |
          set -euo pipefail
          cd .ci/euroscan130
          cat payload.part00 payload.part01 payload.part02 payload.part03 payload.part04full | base64 -d > /tmp/euroscan130.zip
          echo '88a4ae5c43d7852a68861a953f916ef3f32b2faf8956bfefaaa28f18178f53dd  /tmp/euroscan130.zip' | sha256sum -c -
          cd "$GITHUB_WORKSPACE"
          rm -rf euroscan-ch
          unzip -q /tmp/euroscan130.zip
          grep -q 'versionCode 5' euroscan-ch/app/build.gradle
          grep -q "versionName '1.3.0'" euroscan-ch/app/build.gradle

      - name: Apply 1.3.1 startup and Samsung safe-area hotfix
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # Version bump.
          gradle = Path('euroscan-ch/app/build.gradle')
          s = gradle.read_text()
          s = s.replace('versionCode 5', 'versionCode 6')
          s = s.replace("versionName '1.3.0'", "versionName '1.3.1'")
          gradle.write_text(s)

          main = Path('euroscan-ch/app/src/main/java/ch/piiwii/euroscan/MainActivity.java')
          s = main.read_text()

          # The 1.3.0 configured system bars before the startup safety net.
          old = '''        super.onCreate(b);\n        configureSystemBars();\n        try {\n            history = new HistoryStore(this);'''
          new = '''        super.onCreate(b);\n        try {\n            configureSystemBars();\n            history = new HistoryStore(this);'''
          if old not in s:
              raise SystemExit('MainActivity startup anchor not found')
          s = s.replace(old, new, 1)

          # Keep system-bar setup deliberately conservative. The v35 theme opts out
          # of forced edge-to-edge, so the app content begins below the status bar.
          start = s.index('    private void configureSystemBars() {')
          end = s.index('\n    private void applySafeInsets', start)
          safe_bars = '''    private void configureSystemBars() {\n        try { getWindow().setStatusBarColor(BG); } catch (Throwable ignored) {}\n        try { getWindow().setNavigationBarColor(BG); } catch (Throwable ignored) {}\n        if (Build.VERSION.SDK_INT >= 26) {\n            try {\n                int flags = getWindow().getDecorView().getSystemUiVisibility();\n                flags &= ~View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR;\n                flags &= ~View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR;\n                getWindow().getDecorView().setSystemUiVisibility(flags);\n            } catch (Throwable ignored) {}\n        }\n    }\n'''
          s = s[:start] + safe_bars + s[end:]

          # Do not manually re-add Android bar insets when decor already fits system
          # windows; this prevents both overlap and double-padding on Samsung One UI.
          start = s.index('    private void applySafeInsets(View v, int leftDp, int topDp, int rightDp, int bottomDp) {')
          end = s.index('\n    private void applyBottomInset', start)
          simple_insets = '''    private void applySafeInsets(View v, int leftDp, int topDp, int rightDp, int bottomDp) {\n        v.setPadding(dp(leftDp), dp(topDp), dp(rightDp), dp(bottomDp));\n    }\n'''
          s = s[:start] + simple_insets + s[end:]

          start = s.index('    private void applyBottomInset(View v, int baseBottomDp) {')
          end = s.index('\n    private void showSafeHome', start)
          simple_bottom = '''    private void applyBottomInset(View v, int baseBottomDp) {\n        v.setPadding(dp(8), dp(8), dp(8), dp(baseBottomDp));\n    }\n'''
          s = s[:start] + simple_bottom + s[end:]

          # Make even the fallback impossible to disappear silently if its richer UI fails.
          old = '''        } catch (Throwable startupError) {\n            showSafeHome(startupError);\n        }'''
          new = '''        } catch (Throwable startupError) {\n            try {\n                showSafeHome(startupError);\n            } catch (Throwable emergencyError) {\n                TextView emergency = new TextView(this);\n                emergency.setText("EuroScan CH\\n\\nDémarrage de secours actif.\\nRéouvre l'application ou utilise la version précédente si nécessaire.");\n                emergency.setTextColor(Color.WHITE);\n                emergency.setTextSize(18);\n                emergency.setGravity(Gravity.CENTER);\n                emergency.setPadding(dp(24), dp(24), dp(24), dp(24));\n                emergency.setBackgroundColor(BG);\n                setContentView(emergency);\n            }\n        }'''
          if old not in s:
              raise SystemExit('MainActivity fallback anchor not found')
          s = s.replace(old, new, 1)
          s = s.replace('v1.3.0', 'v1.3.1').replace('EuroScan CH 1.3.0', 'EuroScan CH 1.3.1')
          main.write_text(s)

          scanner = Path('euroscan-ch/app/src/main/java/ch/piiwii/euroscan/ScannerActivity.java')
          s = scanner.read_text()
          # Scanner uses normal fitted system areas too: no forced edge-to-edge and no
          # custom re-addition of status/navigation insets.
          old = '''        getWindow().setStatusBarColor(Color.rgb(5, 18, 39));\n        getWindow().setNavigationBarColor(Color.rgb(5, 18, 39));\n        if (Build.VERSION.SDK_INT >= 29) getWindow().setNavigationBarContrastEnforced(false);\n        if (Build.VERSION.SDK_INT >= 30 && getWindow().getInsetsController() != null) {\n            getWindow().getInsetsController().setSystemBarsAppearance(0, android.view.WindowInsetsController.APPEARANCE_LIGHT_STATUS_BARS | android.view.WindowInsetsController.APPEARANCE_LIGHT_NAVIGATION_BARS);\n        }'''
          new = '''        try { getWindow().setStatusBarColor(Color.rgb(5, 18, 39)); } catch (Throwable ignored) {}\n        try { getWindow().setNavigationBarColor(Color.rgb(5, 18, 39)); } catch (Throwable ignored) {}'''
          if old not in s:
              raise SystemExit('Scanner system-bars anchor not found')
          s = s.replace(old, new, 1)

          start = s.index('    private void applySafeInsets(View root, FrameLayout.LayoutParams topLp, FrameLayout.LayoutParams bottomLp) {')
          end = s.index('\n\n    @Override\n    public void onRequestPermissionsResult', start)
          simple = '''    private void applySafeInsets(View root, FrameLayout.LayoutParams topLp, FrameLayout.LayoutParams bottomLp) {\n        topLp.setMargins(dp(10), dp(10), dp(10), 0);\n        bottomLp.setMargins(dp(16), 0, dp(16), dp(18));\n        topBar.setLayoutParams(topLp);\n        bottomCard.setLayoutParams(bottomLp);\n    }\n'''
          s = s[:start] + simple + s[end:]
          scanner.write_text(s)
          PY

      - name: Verify hotfix source before build
        run: |
          set -euo pipefail
          MAIN='euroscan-ch/app/src/main/java/ch/piiwii/euroscan/MainActivity.java'
          SCANNER='euroscan-ch/app/src/main/java/ch/piiwii/euroscan/ScannerActivity.java'
          grep -q 'versionCode 6' euroscan-ch/app/build.gradle
          grep -q "versionName '1.3.1'" euroscan-ch/app/build.gradle
          grep -q 'Démarrage de secours actif' "$MAIN"
          grep -q 'v1.3.1' "$MAIN"
          if grep -q 'setDecorFitsSystemWindows(false)' "$MAIN"; then exit 1; fi
          if grep -q 'setDecorFitsSystemWindows(false)' "$SCANNER"; then exit 1; fi

      - name: Build unsigned release
        working-directory: euroscan-ch
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Verify package metadata
        run: |
          set -euo pipefail
          APK='euroscan-ch/app/build/outputs/apk/release/app-release-unsigned.apk'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='ch.piiwii.euroscan' versionCode='6' versionName='1.3.1'" /tmp/badging.txt
          grep -q "launchable-activity: name='ch.piiwii.euroscan.MainActivity'" /tmp/badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"

      - name: Prepare unsigned delivery
        run: |
          set -euo pipefail
          mkdir -p delivery
          cp euroscan-ch/app/build/outputs/apk/release/app-release-unsigned.apk delivery/EuroScan-CH-1.3.1-UNSIGNED.apk
          zip -qr delivery/EuroScan-CH-1.3.1-SOURCES.zip euroscan-ch -x 'euroscan-ch/app/build/*' 'euroscan-ch/.gradle/*'
          cp /tmp/badging.txt delivery/APK-BADGING.txt
          printf 'versionName=1.3.1\nversionCode=6\npackage=ch.piiwii.euroscan\n' > delivery/VERSION.txt
          sha256sum delivery/EuroScan-CH-1.3.1-UNSIGNED.apk > delivery/UNSIGNED-SHA256.txt
          sha256sum delivery/EuroScan-CH-1.3.1-SOURCES.zip > delivery/SOURCES-SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: EuroScan-CH-1.3.1-UNSIGNED
          path: delivery/*
          retention-days: 7
          if-no-files-found: error
