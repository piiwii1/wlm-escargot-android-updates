name: EuroScan CH 1.3.1 Build

on:
  push:
    branches: [ euroscan-build-131 ]
    paths:
      - '.ci/euroscan131/**'
      - '.github/workflows/euroscan-ch-131-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore exact EuroScan 1.3.1 source
        run: |
          set -euo pipefail
          base64 -d .ci/euroscan131/payload.b64 > /tmp/euroscan131.zip
          echo 'ef0482faee1eb4f42f1c28e0ce0e8f237e68a62c499f54a0bab4bc32bc5eebd2  /tmp/euroscan131.zip' | sha256sum -c -
          unzip -q /tmp/euroscan131.zip -d /tmp/euroscan131-src
          rm -rf euroscan-ch
          mv /tmp/euroscan131-src/euroscan131-work euroscan-ch
          grep -q 'versionCode 6' euroscan-ch/app/build.gradle
          grep -q "versionName '1.3.1'" euroscan-ch/app/build.gradle

      - name: Verify startup hotfix source
        run: |
          set -euo pipefail
          MAIN='euroscan-ch/app/src/main/java/ch/piiwii/euroscan/MainActivity.java'
          SCANNER='euroscan-ch/app/src/main/java/ch/piiwii/euroscan/ScannerActivity.java'
          grep -q 'try {' "$MAIN"
          grep -q 'configureSystemBars();' "$MAIN"
          grep -q 'setDecorFitsSystemWindows(true)' "$MAIN"
          grep -q 'setDecorFitsSystemWindows(true)' "$SCANNER"
          if grep -q 'setDecorFitsSystemWindows(false)' "$MAIN"; then exit 1; fi
          if grep -q 'setDecorFitsSystemWindows(false)' "$SCANNER"; then exit 1; fi
          grep -q 'v1.3.1' "$MAIN"

      - name: Build unsigned release
        working-directory: euroscan-ch
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Verify package metadata
        run: |
          set -euo pipefail
          APK='euroscan-ch/app/build/outputs/apk/release/app-release-unsigned.apk'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='ch.piiwii.euroscan' versionCode='6' versionName='1.3.1'" /tmp/badging.txt
          grep -q "launchable-activity: name='ch.piiwii.euroscan.MainActivity'" /tmp/badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"

      - name: Prepare unsigned delivery
        run: |
          set -euo pipefail
          mkdir -p delivery
          cp euroscan-ch/app/build/outputs/apk/release/app-release-unsigned.apk delivery/EuroScan-CH-1.3.1-UNSIGNED.apk
          zip -qr delivery/EuroScan-CH-1.3.1-SOURCES.zip euroscan-ch -x 'euroscan-ch/app/build/*' 'euroscan-ch/.gradle/*'
          cp /tmp/badging.txt delivery/APK-BADGING.txt
          printf 'versionName=1.3.1\nversionCode=6\npackage=ch.piiwii.euroscan\n' > delivery/VERSION.txt
          sha256sum delivery/EuroScan-CH-1.3.1-UNSIGNED.apk > delivery/UNSIGNED-SHA256.txt
          sha256sum delivery/EuroScan-CH-1.3.1-SOURCES.zip > delivery/SOURCES-SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: EuroScan-CH-1.3.1-UNSIGNED
          path: delivery/*
          retention-days: 7
          if-no-files-found: error
