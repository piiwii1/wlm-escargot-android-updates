name: FannyArchive APK Final Linux Test

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'fannyarchive-apk-test-linux-final-trigger.txt'

jobs:
  verify-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android
        uses: android-actions/setup-android@v3
      - name: Download exact compiled APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" 'https://api.github.com/repos/piiwii1/wlm-escargot-android-updates/actions/artifacts/9523159952/zip' -o /tmp/fanny.zip
          mkdir -p /tmp/fanny
          unzip -q /tmp/fanny.zip -d /tmp/fanny
          echo '5e8e2bf4a81af5fbe55b987dc7c364e665002d30854a4f38865d4dcdca0b9510  /tmp/fanny/FannyArchive-1.3.1-STABLE.apk' | sha256sum -c -
      - name: Install launch verify Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-boot-timeout: 900
          script: |
            adb install -r /tmp/fanny/FannyArchive-1.3.1-STABLE.apk | tee /tmp/install.txt
            grep -q 'Success' /tmp/install.txt
            adb logcat -c
            adb shell am force-stop ch.piiwii.fannyarchive.stable
            adb shell am start -n ch.piiwii.fannyarchive.stable/ch.piiwii.fannyarchive.MainActivity | tee /tmp/start.txt
            sleep 20
            adb shell pidof ch.piiwii.fannyarchive.stable | tee /tmp/pid.txt
            test -s /tmp/pid.txt
            adb shell dumpsys activity activities | grep -F 'ch.piiwii.fannyarchive.stable/ch.piiwii.fannyarchive.MainActivity' | tee /tmp/activity.txt
            test -s /tmp/activity.txt
            adb shell uiautomator dump /sdcard/window.xml
            adb pull /sdcard/window.xml /tmp/window.xml
            grep -F 'Archive Fanny' /tmp/window.xml | tee /tmp/ui-proof.txt
            test -s /tmp/ui-proof.txt
            adb logcat -d -v brief > /tmp/logcat.txt
            ! grep -E 'FATAL EXCEPTION|AndroidRuntime' /tmp/logcat.txt | grep -F 'ch.piiwii.fannyarchive.stable'
            adb exec-out screencap -p > /tmp/FannyArchive-1.3.1-STABLE-launch.png
            echo INSTALL_LAUNCH_UI_PASS
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: FannyArchive-1.3.1-ANDROID15-VERIFIED
          path: |
            /tmp/fanny/FannyArchive-1.3.1-STABLE.apk
            /tmp/FannyArchive-1.3.1-STABLE-launch.png
            /tmp/install.txt
            /tmp/start.txt
            /tmp/pid.txt
            /tmp/activity.txt
            /tmp/ui-proof.txt
            /tmp/logcat.txt
          retention-days: 7
