name: Foire du Valais 1.5.14 Header
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/foire-valais-header-1514.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Rebuild exact 1.5.12 stable base
        shell: bash
        run: |
          set -euo pipefail
          cat foire-valais-app/patches/etape1/chunk-* | base64 -d | tar -xzf - -C foire-valais-app
          cat foire-valais-app/patches/etape2c/chunk-* | base64 -d | tar -xzf - -C foire-valais-app
          cat foire-valais-app/patches/etape3/chunk-* | base64 -d | gunzip > /tmp/step3.patch
          (cd foire-valais-app && patch -p1 < /tmp/step3.patch)
          cat foire-valais-app/patches/etape4/chunk-* | base64 -d | gunzip > /tmp/step4.patch
          (cd foire-valais-app && patch -p1 < /tmp/step4.patch)
          cat foire-valais-app/patches/etape5/chunk-* | base64 -d | gunzip > /tmp/step5.patch
          (cd foire-valais-app && patch -p1 < /tmp/step5.patch)
          sed -i 's/Version 1\.5\.1 · versionCode 7/Version 1.5.4 · versionCode 10/g' foire-valais-app/app/src/main/java/ch/piiwii/foirevalais/MainActivity.java
          (cd foire-valais-app && patch -p1 < patches/etape6a/step6a.patch)
          sed -i 's/Version 1\.5\.4/Version 1.5.5/g; s/versionCode 10/versionCode 11/g' foire-valais-app/app/src/main/java/ch/piiwii/foirevalais/MainActivity.java
          (cd foire-valais-app && patch -p1 < patches/etape6b/step6b.patch)
          (cd foire-valais-app && patch -p1 < patches/etape-icons/step-icons.patch)
          sed -i 's/versionCode = 13/versionCode = 18/; s/versionName = "1.5.7"/versionName = "1.5.12"/' foire-valais-app/app/build.gradle.kts
          sed -i 's/Version 1\.5\.7/Version 1.5.12/g; s/versionCode 13/versionCode 18/g' foire-valais-app/app/src/main/java/ch/piiwii/foirevalais/MainActivity.java
      - name: Apply 1.5.14 official popcorn header only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p foire-valais-app/app/src/main/res/drawable
          base64 -d foire-valais-app/patches/header2026/fdv_hero_2026.webp.b64 > foire-valais-app/app/src/main/res/drawable/fdv_header_2026.webp
          (cd foire-valais-app && patch -p1 < patches/header1514/step1514.patch)
          grep -q 'versionCode = 20' foire-valais-app/app/build.gradle.kts
          grep -q 'versionName = "1.5.14"' foire-valais-app/app/build.gradle.kts
          grep -q 'R.drawable.fdv_header_2026' foire-valais-app/app/src/main/java/ch/piiwii/foirevalais/MainActivity.java
          ! grep -q 'APPEARANCE_LIGHT_STATUS_BARS' foire-valais-app/app/src/main/java/ch/piiwii/foirevalais/MainActivity.java
      - name: Install Android SDK 35
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build release
        working-directory: foire-valais-app
        run: gradle --no-daemon :app:assembleRelease
      - name: Prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deliverables/sign-tools
          /usr/local/lib/android/sdk/build-tools/35.0.0/zipalign -f -p 4 foire-valais-app/app/build/outputs/apk/release/app-release-unsigned.apk deliverables/Foire-du-Valais-2026-1.5.14-ALIGNED-UNSIGNED.apk
          /usr/local/lib/android/sdk/build-tools/35.0.0/zipalign -c -v 4 deliverables/Foire-du-Valais-2026-1.5.14-ALIGNED-UNSIGNED.apk
          cp /usr/local/lib/android/sdk/build-tools/35.0.0/apksigner deliverables/sign-tools/apksigner
          cp -a /usr/local/lib/android/sdk/build-tools/35.0.0/lib deliverables/sign-tools/lib
          cd foire-valais-app
          zip -qr ../deliverables/Foire-du-Valais-2026-1.5.14-SOURCES.zip . -x '*/build/*' '.gradle/*'
      - uses: actions/upload-artifact@v4
        with:
          name: Foire-du-Valais-2026-1.5.14
          path: deliverables/*
          retention-days: 7
