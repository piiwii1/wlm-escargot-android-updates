name: Compagnon Autoroute encrypted temp build

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/ca-temp-build.yml'

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Open encrypted build session
        id: session
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SESSION=$(openssl rand -hex 12)
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/ca-private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/ca-private.pem -pubout -out /tmp/ca-public.pem
          PUB=$(base64 -w0 /tmp/ca-public.pem)
          gh api repos/${GITHUB_REPOSITORY}/issues/38/comments -f body="CA_PUBLIC_KEY_V1:${SESSION}:${PUB}" >/dev/null
          echo "session=${SESSION}" >> "$GITHUB_OUTPUT"

      - name: Receive and decrypt source
        env:
          GH_TOKEN: ${{ github.token }}
          SESSION: ${{ steps.session.outputs.session }}
        run: |
          set -euo pipefail
          BODY=""
          for i in $(seq 1 120); do
            BODY=$(gh api --paginate repos/${GITHUB_REPOSITORY}/issues/38/comments --jq ".[] | select(.body | startswith(\"CA_PAYLOAD_V1:${SESSION}:\")) | .body" | tail -n 1 || true)
            if [ -n "$BODY" ]; then break; fi
            sleep 5
          done
          test -n "$BODY"
          REST=${BODY#CA_PAYLOAD_V1:${SESSION}:}
          KEY_B64=${REST%%:*}
          DATA_B64=${REST#*:}
          printf '%s' "$KEY_B64" | base64 -d > /tmp/ca-key.enc
          printf '%s' "$DATA_B64" | base64 -d > /tmp/ca-source.enc
          openssl pkeyutl -decrypt -inkey /tmp/ca-private.pem -in /tmp/ca-key.enc -pkeyopt rsa_padding_mode:oaep > /tmp/ca-pass.txt
          openssl enc -d -aes-256-cbc -pbkdf2 -in /tmp/ca-source.enc -out /tmp/ca-source.zip -pass file:/tmp/ca-pass.txt
          unzip -tq /tmp/ca-source.zip
          mkdir -p /tmp/ca-src
          unzip -q /tmp/ca-source.zip -d /tmp/ca-src

      - name: Build debug APK
        run: |
          set -euo pipefail
          PROJ=$(dirname "$(find /tmp/ca-src -maxdepth 3 -type f -name settings.gradle | head -n 1)")
          test -n "$PROJ"
          cd "$PROJ"
          gradle --no-daemon :app:assembleDebug --stacktrace
          APK=$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)
          test -f "$APK"
          mkdir -p /tmp/ca-out
          cp "$APK" /tmp/ca-out/CompagnonAutoroute-1.0.1-V1.apk
          sha256sum /tmp/ca-out/CompagnonAutoroute-1.0.1-V1.apk | tee /tmp/ca-out/CompagnonAutoroute-1.0.1-V1.apk.sha256
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs /tmp/ca-out/CompagnonAutoroute-1.0.1-V1.apk | tee /tmp/ca-out/signature.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CompagnonAutoroute-1.0.1-V1-APK
          path: /tmp/ca-out/*
          if-no-files-found: error
          retention-days: 1

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          SESSION: ${{ steps.session.outputs.session }}
        run: gh api repos/${GITHUB_REPOSITORY}/issues/38/comments -f body="CA_BUILD_DONE_V1:${SESSION}" >/dev/null
