name: PiiWii Remote Phone beta10 simple
on:
  workflow_dispatch:
  push:
    branches: [piiwii-remote-v2-phone-beta10-icons]
    paths:
      - 'piiwii-remote-phone-beta10/apply-beta10-simple.sh'
      - '.github/workflows/piiwii-remote-phone-beta10-simple.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct beta9 and apply beta10 icons
        shell: bash
        run: |
          set -euo pipefail
          bash piiwii-remote-v2-lot12/reconstruct-lot12.sh /tmp/src
          ROOT=/tmp/src/piiwii-remote
          for v in 3 4 5 6 7 8; do
            base64 -d piiwii-remote-phone-beta${v}/phone-beta${v}.patch.xz.b64 > /tmp/p.patch.xz
            xz -dc /tmp/p.patch.xz > /tmp/p.patch
            (cd "$ROOT" && patch -p1 < /tmp/p.patch)
          done
          base64 -d piiwii-remote-phone-beta9/phone-beta9.patch.xz.b64 > /tmp/p9.patch.xz
          xz -dc /tmp/p9.patch.xz > /tmp/p9.patch
          (cd "$ROOT" && patch -p1 < /tmp/p9.patch)
          (cd "$ROOT" && patch -p1 < "$GITHUB_WORKSPACE/piiwii-remote-phone-beta9/phone-beta9-fix1.patch")
          (cd "$ROOT" && patch -p1 < "$GITHUB_WORKSPACE/piiwii-remote-phone-beta9/phone-beta9-space.patch")
          bash "$GITHUB_WORKSPACE/piiwii-remote-phone-beta10/apply-beta10-simple.sh" "$ROOT"
          grep -q 'versionCode = 40' "$ROOT/remote/build.gradle.kts"
          grep -q 'versionName = "2.0.0-beta10"' "$ROOT/remote/build.gradle.kts"
          grep -q 'R.drawable.ic_settings' "$ROOT/remote/src/main/java/ch/piiwii/remote2/ui/MainShellView.kt"
          grep -q 'R.drawable.ic_youtube' "$ROOT/remote/src/main/java/ch/piiwii/remote2/ui/screens/SectionScreenFactory.kt"
          grep -q 'Maintenir pour parler' "$ROOT/remote/src/main/java/ch/piiwii/remote2/ui/RemoteKeyboardView.kt"
          file "$ROOT/remote/src/main/res/drawable-nodpi/ic_remote.png" "$ROOT/remote/src/main/res/drawable-nodpi/ic_settings.png"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        shell: bash
        run: |
          echo 'ANDROID_HOME=/usr/local/lib/android/sdk' >> "$GITHUB_ENV"
          echo 'ANDROID_SDK_ROOT=/usr/local/lib/android/sdk' >> "$GITHUB_ENV"
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release
        working-directory: /tmp/src/piiwii-remote
        run: gradle --no-daemon :remote:testDebugUnitTest :remote:assembleRelease
      - name: Validate and package
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/src/piiwii-remote
          OUT=/tmp/out
          mkdir -p "$OUT"
          ZIPALIGN=/usr/local/lib/android/sdk/build-tools/35.0.0/zipalign
          AAPT=/usr/local/lib/android/sdk/build-tools/35.0.0/aapt
          RAW="$ROOT/remote/build/outputs/apk/release/remote-release-unsigned.apk"
          APK="$OUT/PiiWii-Remote-Phone-2.0.0-beta10-UNSIGNED.apk"
          "$ZIPALIGN" -f 4 "$RAW" "$APK"
          "$ZIPALIGN" -c -v 4 "$APK" > "$OUT/ZIPALIGN.txt"
          "$AAPT" dump badging "$APK" > "$OUT/BADGING.txt"
          grep -q "package: name='ch.piiwii.remote2' versionCode='40' versionName='2.0.0-beta10'" "$OUT/BADGING.txt"
          unzip -t "$APK" > "$OUT/ZIPTEST.txt"
          unzip -l "$APK" > "$OUT/CONTENTS.txt"
          for n in remote settings apps keyboard touchpad browser vlc youtube spotify; do grep -q "ic_${n}\.png" "$OUT/CONTENTS.txt"; done
          sha256sum "$APK" > "$OUT/SHA256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: PiiWii-Remote-Phone-2.0.0-beta10-UNSIGNED
          path: /tmp/out/*
          retention-days: 7
