name: Geek TV 0.8.0 Unsigned Build

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'piiwii-tv-0.2.0-ci/**'
      - '.github/workflows/piiwii-tv-0.2.0-unsigned.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Geek TV 0.8.0 source parts
        run: |
          set -e
          echo 'd19a0319c0b5799b56dfee2bb917abb7c989b4d4305ae1ddeb32c6466495f234  piiwii-tv-0.2.0-ci/geektv-080-00.part' | sha256sum -c -
          echo 'c05915e2af80d1116f3f215015bc61fd9246b0e0c3ec7d443841385da8f39a9d  piiwii-tv-0.2.0-ci/geektv-080-01.part' | sha256sum -c -
          echo '0e95972a4350498796651ae88b96d5dbaca7fac5172db5645e2c2de0d5009446  piiwii-tv-0.2.0-ci/geektv-080-02.part' | sha256sum -c -
          echo '1f1397a032122f66a6ab57744b9c51c43f959ac3e1d99090094d23afd7cb4831  piiwii-tv-0.2.0-ci/geektv-080-03.part' | sha256sum -c -
          echo '9447eb3896048c2e9214e5a040db803065dccaeb7b2028be24cf9b356c77cf4d  piiwii-tv-0.2.0-ci/geektv-080-04.part' | sha256sum -c -
          echo 'b4fbf8c668cca1bfdfb6209c8d074a02d6fd22f609ec7f09cc6b0d59b305ed40  piiwii-tv-0.2.0-ci/geektv-080-05a.part' | sha256sum -c -
          echo '1b7eccccb6366c19658f3472639b4d89ae4d498ef5dead7b7b17a02a03e1da63  piiwii-tv-0.2.0-ci/geektv-080-05b.part' | sha256sum -c -
          echo '4b956185c5941b4e75405693897258114273e0635536de7faa6c4eceaf835f22  piiwii-tv-0.2.0-ci/geektv-080-06.part' | sha256sum -c -
          echo 'bfc7db70be3947f3ee793e9e6a1f8d73917077960ab5774089286cda4b2fbf6b  piiwii-tv-0.2.0-ci/geektv-080-07a.part' | sha256sum -c -
          echo 'e06170aa6c9beef02f4fc8da674ce5b61eb6adaf3c3809fab3da170ead1539cb  piiwii-tv-0.2.0-ci/geektv-080-07b.part' | sha256sum -c -

      - name: Restore Geek TV 0.8.0 source tree
        run: |
          set -e
          cat piiwii-tv-0.2.0-ci/geektv-080-*.part | base64 -d > /tmp/geektv-080.tar.gz
          gzip -t /tmp/geektv-080.tar.gz
          tar -xzf /tmp/geektv-080.tar.gz
          test -f geek-tv-0.8.0-ci-public/app/build.gradle
          grep -q "versionCode 8" geek-tv-0.8.0-ci-public/app/build.gradle
          grep -q "versionName '0.8.0'" geek-tv-0.8.0-ci-public/app/build.gradle
          test -f geek-tv-0.8.0-ci-public/app/src/main/java/ch/piiwii/tv/RecordingAlarmReceiver.java
          test -f geek-tv-0.8.0-ci-public/app/src/main/java/ch/piiwii/tv/ScheduleManager.java

      - name: Build unsigned release APK
        working-directory: geek-tv-0.8.0-ci-public
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Prepare output
        run: |
          set -e
          APK="geek-tv-0.8.0-ci-public/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK"
          mkdir -p out
          cp "$APK" out/Geek-TV-0.8.0-unsigned.apk
          cp /usr/local/lib/android/sdk/build-tools/35.0.0/lib/apksigner.jar out/apksigner.jar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Geek-TV-0.8.0-unsigned
          path: out/*
          retention-days: 14
          if-no-files-found: error
