name: Geek TV 0.7.0 Unsigned Build

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'geek-tv-0.7.0-ci/**'
      - '.github/workflows/piiwii-tv-0.2.0-unsigned.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore Geek TV source tree
        run: |
          set -euo pipefail
          cd geek-tv-0.7.0-ci
          echo '8a9cdbefc2691b0335c5081c769ebf9266bbe5dfebb6a707238645e6af4f206a  geektv-070-00.part' | sha256sum -c -
          echo 'c3533a592178da0455af1cbd95c4df8cf1d5d7f92173a6389e00eeeb57b74f3e  geektv-070-01.part' | sha256sum -c -
          echo '8eccbed16c354911eeebe61d184d48a54aa07d071992b1c7e80e85422c58f8a6  geektv-070-02.part' | sha256sum -c -
          echo 'a169b2baf1bee98005728412493648dc85647659d0b5716534470bb7f7cc2e8f  geektv-070-03.part' | sha256sum -c -
          echo 'b8a96b307d2bfcb6b3d02ee15d692fd8ec8d78880a955273eb6509d6380c2990  geektv-070-04.part' | sha256sum -c -
          echo '269a50435509d3549d0b2bf82da33ed51322f20aa84f1a62cab9731b744d1831  geektv-070-050.part' | sha256sum -c -
          echo '6f564e5439ce3a042d365a03390a1cdfad18b572258b74c02da346449afe0a01  geektv-070-051.part' | sha256sum -c -
          echo '1a2024acbaf161c3f8457487aeeb83f8daafc4d8d7c7f3011ea7e37ae4670df2  geektv-070-052.part' | sha256sum -c -
          echo '51d3dcdeece804804c64b1c7ce365d541f52779df98daa731b6e4a11777a6e12  geektv-070-053.part' | sha256sum -c -
          echo '9624c7e691ce6f482f0e8b317fdb700b14e71c23d3c1568df6837583d8b317d6  geektv-070-06.part' | sha256sum -c -
          echo 'ff975a62ee566dc8841d5c10a71d2fc6170e927ac213eb90da1f0537c673a8be  geektv-070-07.part' | sha256sum -c -
          echo '943c4b748ac10ba001aafd4dc83470934cd19db7f1def0efa9cc5f7bb4baafcf  geektv-070-08.part' | sha256sum -c -
          cat geektv-070-00.part geektv-070-01.part geektv-070-02.part geektv-070-03.part geektv-070-04.part geektv-070-050.part geektv-070-051.part geektv-070-052.part geektv-070-053.part geektv-070-06.part geektv-070-07.part geektv-070-08.part > /tmp/geektv-070.b64
          cd ..
          base64 -d /tmp/geektv-070.b64 > /tmp/geek-tv-0.7.0-public-src.tar.gz
          gzip -t /tmp/geek-tv-0.7.0-public-src.tar.gz
          tar -xzf /tmp/geek-tv-0.7.0-public-src.tar.gz
          test -f geek-tv-0.7.0-ci-public/app/build.gradle
          grep -q "versionCode 7" geek-tv-0.7.0-ci-public/app/build.gradle
          grep -q "applicationId 'ch.piiwii.tv'" geek-tv-0.7.0-ci-public/app/build.gradle

      - name: Build unsigned release APK
        working-directory: geek-tv-0.7.0-ci-public
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Prepare output
        run: |
          set -euo pipefail
          APK="geek-tv-0.7.0-ci-public/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK"
          mkdir -p out
          cp "$APK" out/Geek-TV-0.7.0-unsigned.apk
          cp /usr/local/lib/android/sdk/build-tools/35.0.0/lib/apksigner.jar out/apksigner.jar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Geek-TV-0.7.0-unsigned
          path: out/*
          retention-days: 14
          if-no-files-found: error
