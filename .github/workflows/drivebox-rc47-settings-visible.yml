name: Build DriveBox RC47 Settings Visible

on:
  push:
    branches: [ drivebox-rc47-settings-visible ]
    paths:
      - '.github/workflows/drivebox-rc47-settings-visible.yml'
      - 'drivebox-ci/rc47.b64'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore validated RC46 source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9656522001/zip" -o /tmp/rc46-artifact.zip
          rm -rf /tmp/rc46-artifact /tmp/drivebox-src
          mkdir -p /tmp/rc46-artifact /tmp/drivebox-src
          unzip -oq /tmp/rc46-artifact.zip -d /tmp/rc46-artifact
          test "$(sha256sum /tmp/rc46-artifact/DriveBox-1.0.0-RC46-source.zip | awk '{print $1}')" = '4019d1606c5012ee5e81d27f72f8b2cfa7bd4d9d33e85baacce94c788618e835'
          unzip -oq /tmp/rc46-artifact/DriveBox-1.0.0-RC46-source.zip -d /tmp/drivebox-src
          grep -q 'versionCode 55' /tmp/drivebox-src/app/build.gradle
          grep -q "versionName '1.0.0-rc46'" /tmp/drivebox-src/app/build.gradle

      - name: Verify and apply RC47 patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum drivebox-ci/rc47.b64 | awk '{print $1}')" = '30d6ed37154b422b4cb3e0da663824f6b734d2a1bc91a252844ba14522ca0896'
          base64 -d drivebox-ci/rc47.b64 > /tmp/rc47.patch.gz
          test "$(sha256sum /tmp/rc47.patch.gz | awk '{print $1}')" = '46cc1bb2a1cc5f5f258959f2db2f48c5b3028d6d9e7ea4c32160e0ae6f6f537d'
          gzip -d -c /tmp/rc47.patch.gz > /tmp/rc47.patch
          test "$(sha256sum /tmp/rc47.patch | awk '{print $1}')" = '279ddb5ebe57263034ddbfca3de55c1563012eb4606656e333cdfe33a6adaaf0'
          cd /tmp/drivebox-src
          patch -p1 < /tmp/rc47.patch
          grep -q 'versionCode 56' app/build.gradle
          grep -q "versionName '1.0.0-rc47'" app/build.gradle
          grep -q 'pill("⚙  Paramètres"' app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java
          grep -q 'lp(dp(128), dp(48)' app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java
          grep -q 'Historique des arrêts' app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java
          grep -q 'Automatique GPS' app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java
          test "$(grep -R -h '@Test' app/src/test/java | wc -l)" -ge 17
          test -f CONTINUITE-RC47.md
          if grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml; then exit 1; fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests and compile RC47
        working-directory: /tmp/drivebox-src
        run: gradle --no-daemon clean :app:testDebugUnitTest :app:assembleDebug

      - name: Verify and package RC47
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/drivebox-src/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/cert.txt
          grep -qi '6699b2b6b15b5e09032b4f54c5c26bbd982a41dc48d5a5093d1501036a474a1e' /tmp/cert.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='ch.clubvwsuisse.drivebox.v1'" /tmp/badging.txt
          grep -q "versionCode='56'" /tmp/badging.txt
          grep -q "versionName='1.0.0-rc47'" /tmp/badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | tee /tmp/perms.txt
          if grep -q 'android.permission.INTERNET' /tmp/perms.txt; then exit 1; fi
          unzip -t "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC47.apk"
          rm -rf /tmp/drivebox-src/app/build /tmp/drivebox-src/.gradle
          (cd /tmp/drivebox-src && zip -qr "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC47-source.zip" .)
          sha256sum "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC47.apk" > "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC47.apk.sha256.txt"
          sha256sum "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC47-source.zip" > "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC47-source.zip.sha256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: DriveBox-1.0.0-RC47-SETTINGS-VISIBLE
          path: |
            DriveBox-1.0.0-RC47.apk
            DriveBox-1.0.0-RC47.apk.sha256.txt
            DriveBox-1.0.0-RC47-source.zip
            DriveBox-1.0.0-RC47-source.zip.sha256.txt
          if-no-files-found: error
          retention-days: 7
