name: Build ConvoyRide V1.6.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/convoyride-v16-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct V1.5 and apply V1.6
        shell: bash
        run: |
          set -euo pipefail
          cat convoyride-v15-source/source-part-* | base64 -d > /tmp/ConvoyRide-V1.5.0-source.zip
          echo '9618adb3c1c52a94af1f4a655f816ea37f4d9ff44d1ab6b465e627abe21a1afc  /tmp/ConvoyRide-V1.5.0-source.zip' | sha256sum -c -
          rm -rf cr16
          mkdir -p cr16
          unzip -q /tmp/ConvoyRide-V1.5.0-source.zip -d cr16
          cat convoyride-v16/patch-part-* | base64 -d | gunzip > /tmp/convoyride-v16.patch
          (cd cr16 && patch -p4 < /tmp/convoyride-v16.patch)
          grep -q "versionName '1.6.0'" cr16/app/build.gradle
          grep -q "versionCode 7" cr16/app/build.gradle
          test -s cr16/app/src/main/java/ch/piiwii/convoyride/ConvoyService.java
          grep -q 'FOREGROUND_SERVICE_LOCATION' cr16/app/src/main/AndroidManifest.xml
          grep -q 'foregroundServiceType="location"' cr16/app/src/main/AndroidManifest.xml
          grep -q 'startForegroundService' cr16/app/src/main/java/ch/piiwii/convoyride/MainActivity.java

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build release
        run: gradle -p cr16 --no-daemon assembleRelease

      - name: Align and inspect
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 \
            cr16/app/build/outputs/apk/release/app-release-unsigned.apk \
            ConvoyRide-V1.6.0-aligned-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 ConvoyRide-V1.6.0-aligned-unsigned.apk
          sha256sum ConvoyRide-V1.6.0-aligned-unsigned.apk > ConvoyRide-V1.6.0-aligned-unsigned.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ConvoyRide-V1.6.0-unsigned
          if-no-files-found: error
          retention-days: 7
          path: |
            ConvoyRide-V1.6.0-aligned-unsigned.apk
            ConvoyRide-V1.6.0-aligned-unsigned.apk.sha256
