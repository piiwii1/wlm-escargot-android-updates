name: Build StreamRadar 0.32.0 temp

on:
  push:
    branches: [ streamradar-build-032 ]
    paths:
      - 'temp-streamradar-build/source.b64'
  pull_request:
    branches: [ main ]
    paths:
      - 'temp-streamradar-build/**'
      - '.github/workflows/build-streamradar-032-temp.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restaurer les sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/streamradar-src
          grep -hv '^#' temp-streamradar-build/source.b64.part* | tr -d '\n\r' | base64 -d > /tmp/streamradar-src/android.zip
          unzip -t /tmp/streamradar-src/android.zip
          unzip -q /tmp/streamradar-src/android.zip -d /tmp/streamradar-src
          test -f /tmp/streamradar-src/android/app/build.gradle.kts

      - name: Compiler release
        working-directory: /tmp/streamradar-src/android
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease
          test -f app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Signer APK et conserver la clé
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/streamradar-out
          mkdir -p "$OUT"
          PASS="$(openssl rand -hex 18)"
          keytool -genkeypair -v \
            -keystore "$OUT/StreamRadar-release.jks" \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -alias streamradar \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=StreamRadar, OU=PiiWii, O=PiiWii, L=Sion, ST=Valais, C=CH'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$OUT/StreamRadar-release.jks" \
            --ks-key-alias streamradar \
            --ks-pass "pass:$PASS" \
            --key-pass "pass:$PASS" \
            --out "$OUT/StreamRadar-0.32.0.apk" \
            /tmp/streamradar-src/android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$OUT/StreamRadar-0.32.0.apk"
          printf 'alias=streamradar\nstorePassword=%s\nkeyPassword=%s\n' "$PASS" "$PASS" > "$OUT/SIGNING.txt"
          sha256sum "$OUT/StreamRadar-0.32.0.apk" > "$OUT/StreamRadar-0.32.0.apk.sha256"

      - name: Publier artefact de build
        uses: actions/upload-artifact@v4
        with:
          name: StreamRadar-0.32.0-build
          path: |
            /tmp/streamradar-out/StreamRadar-0.32.0.apk
            /tmp/streamradar-out/StreamRadar-0.32.0.apk.sha256
            /tmp/streamradar-out/StreamRadar-release.jks
            /tmp/streamradar-out/SIGNING.txt
          if-no-files-found: error
          retention-days: 1
