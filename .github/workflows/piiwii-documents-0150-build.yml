name: PiiWii Documents 0.15.0 Windows Build
on:
  push:
    branches: [build/piiwii-documents-0.15.0]
    paths:
      - '.github/workflows/piiwii-documents-0150-build.yml'
      - 'build-piiwii-documents-0150/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble 0.14.0 base
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-piiwii-documents-0150/work
          cat build-piiwii-documents-030/chunks/00 build-piiwii-documents-030/chunks/01 build-piiwii-documents-030/chunks/02 build-piiwii-documents-030/chunks/03 build-piiwii-documents-030/chunks/04 build-piiwii-documents-030/chunks/05 build-piiwii-documents-030/chunks/06 > build-piiwii-documents-0150/source.b64
          base64 -d build-piiwii-documents-0150/source.b64 > build-piiwii-documents-0150/source.zip
          unzip -q -o build-piiwii-documents-0150/source.zip -d build-piiwii-documents-0150/work || [ $? -eq 1 ]
          rm -rf build-piiwii-documents-0150/work/src/*/bin build-piiwii-documents-0150/work/src/*/obj build-piiwii-documents-0150/work/src/PiiWii.Documents.Installer/payload
          rm -rf build-piiwii-documents-040/work build-piiwii-documents-050/work build-piiwii-documents-060/work build-piiwii-documents-070/work build-piiwii-documents-080/work build-piiwii-documents-090/work build-piiwii-documents-0100/work build-piiwii-documents-0110/work build-piiwii-documents-0120/work build-piiwii-documents-0130/work build-piiwii-documents-0140/work
          for v in 040 050 060 070 080 090 0100 0110 0120 0130 0140; do ln -s ../build-piiwii-documents-0150/work build-piiwii-documents-$v/work; done
          python3 build-piiwii-documents-040/fix_apply.py || true
          python3 build-piiwii-documents-040/apply.py
          python3 build-piiwii-documents-050/apply.py
          python3 build-piiwii-documents-060/apply.py
          python3 build-piiwii-documents-070/apply.py
          python3 build-piiwii-documents-080/apply.py
          python3 build-piiwii-documents-090/apply.py
          python3 build-piiwii-documents-090/fix.py
          python3 build-piiwii-documents-0100/apply.py
          python3 build-piiwii-documents-0110/apply.py
          python3 build-piiwii-documents-0120/apply.py
          python3 build-piiwii-documents-0130/apply.py
          python3 build-piiwii-documents-0140/apply.py
          python3 build-piiwii-documents-0140/harden.py
          for v in 040 050 060 070 080 090 0100 0110 0120 0130 0140; do rm build-piiwii-documents-$v/work; done
      - name: Apply 0.15.0 recovery and preflight
        run: python3 build-piiwii-documents-0150/apply.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build application
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore build-piiwii-documents-0150/work/src/PiiWii.Documents/PiiWii.Documents.csproj -r win-x64
          dotnet publish build-piiwii-documents-0150/work/src/PiiWii.Documents/PiiWii.Documents.csproj -c Release -r win-x64 --self-contained true -o build-piiwii-documents-0150/work/publish
          test -f build-piiwii-documents-0150/work/publish/PiiWii.Documents.exe
      - name: Build installer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-piiwii-documents-0150/work/src/PiiWii.Documents.Installer/payload
          cp build-piiwii-documents-0150/work/publish/PiiWii.Documents.exe build-piiwii-documents-0150/work/src/PiiWii.Documents.Installer/payload/PiiWii.Documents.exe
          dotnet restore build-piiwii-documents-0150/work/src/PiiWii.Documents.Installer/PiiWii.Documents.Installer.csproj -r win-x64
          dotnet publish build-piiwii-documents-0150/work/src/PiiWii.Documents.Installer/PiiWii.Documents.Installer.csproj -c Release -r win-x64 --self-contained true -o build-piiwii-documents-0150/work/installer-publish
          test -f build-piiwii-documents-0150/work/installer-publish/PiiWii-Documents-Setup-0.15.0.exe
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          W=build-piiwii-documents-0150/work
          cat > $W/README.md <<'EOF'
          # PiiWii Documents 0.15.0
          Version récupération et contrôle : restauration de sauvegarde validée, précontrôle des paquets ChatGPT et visibilité des sessions du pont.
          EOF
          cat > $W/CHANGELOG.md <<'EOF'
          # Changelog

          ## 0.15.0
          - Validation d'une sauvegarde avant restauration avec PRAGMA integrity_check.
          - Sauvegarde automatique de l'état courant avant toute restauration.
          - Restauration de la base SQLite depuis l'interface.
          - Précontrôle des PiiWii Import Packs avant copie/OCR.
          - Détection avant import des doublons, SHA-256 invalides, fichiers absents et chemins dangereux.
          - Limites anti zip-bomb : 500 documents, 100 Mo par fichier, 2 Go décompressés.
          - Visualisation des dernières sessions du pont avec portée, état et expiration.
          - Révocation globale conservée ; aucune écriture via le pont HTTP.
          - Compatibilité ascendante avec les données existantes.
          EOF
          mkdir -p $W/dist $W/PACK-REPRISE
          cp $W/installer-publish/PiiWii-Documents-Setup-0.15.0.exe $W/dist/
          cp $W/publish/PiiWii.Documents.exe $W/dist/PiiWii-Documents-0.15.0-PORTABLE.exe
          cd $W
          zip -qr dist/PiiWii-Documents-0.15.0-SOURCES.zip src README.md CHANGELOG.md -x 'src/*/bin/*' 'src/*/obj/*' 'src/PiiWii.Documents.Installer/payload/*'
          cp README.md CHANGELOG.md PACK-REPRISE/
          cp ../../build-piiwii-documents-0150/apply.py PACK-REPRISE/
          zip -qr dist/PiiWii-Documents-0.15.0-PACK-REPRISE.zip PACK-REPRISE
          cd dist
          sha256sum PiiWii-Documents-Setup-0.15.0.exe PiiWii-Documents-0.15.0-PORTABLE.exe PiiWii-Documents-0.15.0-SOURCES.zip PiiWii-Documents-0.15.0-PACK-REPRISE.zip > PiiWii-Documents-0.15.0-SHA256SUMS.txt
          cat PiiWii-Documents-0.15.0-SHA256SUMS.txt
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: PiiWii-Documents-0.15.0-BINARIES
          path: |
            build-piiwii-documents-0150/work/dist/PiiWii-Documents-Setup-0.15.0.exe
            build-piiwii-documents-0150/work/dist/PiiWii-Documents-0.15.0-PORTABLE.exe
            build-piiwii-documents-0150/work/dist/PiiWii-Documents-0.15.0-SHA256SUMS.txt
      - name: Upload sources
        uses: actions/upload-artifact@v4
        with:
          name: PiiWii-Documents-0.15.0-SOURCEPACK
          path: |
            build-piiwii-documents-0150/work/dist/PiiWii-Documents-0.15.0-SOURCES.zip
            build-piiwii-documents-0150/work/dist/PiiWii-Documents-0.15.0-PACK-REPRISE.zip
            build-piiwii-documents-0150/work/dist/PiiWii-Documents-0.15.0-SHA256SUMS.txt
