name: Build PiiWii Camera 1.3.13 capture polish

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/piiwii-camera-v1313.yml'
      - 'piiwii-camera-v1313/**'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Restore verified 1.3.12 source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10177604344/zip" \
            -o /tmp/v1312-artifact.zip
          mkdir -p /tmp/v1312-artifact /tmp/piiwii-camera-v1313
          unzip -q /tmp/v1312-artifact.zip -d /tmp/v1312-artifact
          unzip -q /tmp/v1312-artifact/PiiWii-Camera-1.3.12-SOURCES.zip -d /tmp/piiwii-camera-v1313
          test -f /tmp/piiwii-camera-v1313/PiiWii-Camera-1.3.12-public/app/build.gradle
          grep -q "versionCode 25" /tmp/piiwii-camera-v1313/PiiWii-Camera-1.3.12-public/app/build.gradle
          grep -q "versionName '1.3.12'" /tmp/piiwii-camera-v1313/PiiWii-Camera-1.3.12-public/app/build.gradle

      - name: Apply 1.3.13 capture polish patch
        run: |
          set -e
          base64 -d "$GITHUB_WORKSPACE/piiwii-camera-v1313/v1313.patch.gz.b64" | gzip -d > /tmp/v1313.patch
          echo '1853a80ee2cac5e7910c1fe9a373c393f75cbb43135926c94d07d9fb17c754c1  /tmp/v1313.patch' | sha256sum -c -
          cd /tmp/piiwii-camera-v1313/PiiWii-Camera-1.3.12-public
          patch -p1 < /tmp/v1313.patch
          grep -q "versionCode 26" app/build.gradle
          grep -q "versionName '1.3.13'" app/build.gradle
          grep -q 'videoTorchEnabled' app/src/main/java/ch/piiwii/camera/MainActivity.java
          grep -q 'updateZoomPresetAvailability' app/src/main/java/ch/piiwii/camera/MainActivity.java
          grep -q 'setCaptureRecordingState' app/src/main/java/ch/piiwii/camera/MainActivity.java
          grep -q 'countVisibleZoomPresets' app/src/main/java/ch/piiwii/camera/MainActivity.java

      - name: Build release APK
        run: gradle -p /tmp/piiwii-camera-v1313/PiiWii-Camera-1.3.12-public --no-daemon :app:assembleRelease

      - name: Collect APK and sources
        run: |
          set -e
          mkdir -p /tmp/piiwii-camera-v1313-out
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 \
            /tmp/piiwii-camera-v1313/PiiWii-Camera-1.3.12-public/app/build/outputs/apk/release/app-release-unsigned.apk \
            /tmp/piiwii-camera-v1313-out/PiiWii-Camera-1.3.13-ALIGNED-UNSIGNED.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" /tmp/piiwii-camera-v1313-out/apksigner.jar
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging /tmp/piiwii-camera-v1313-out/PiiWii-Camera-1.3.13-ALIGNED-UNSIGNED.apk > /tmp/piiwii-camera-v1313-out/badging.txt
          sha256sum /tmp/piiwii-camera-v1313-out/PiiWii-Camera-1.3.13-ALIGNED-UNSIGNED.apk > /tmp/piiwii-camera-v1313-out/unsigned-sha256.txt
          cd /tmp/piiwii-camera-v1313
          mv PiiWii-Camera-1.3.12-public PiiWii-Camera-1.3.13-public
          rm -rf PiiWii-Camera-1.3.13-public/app/build PiiWii-Camera-1.3.13-public/.gradle
          zip -qr /tmp/piiwii-camera-v1313-out/PiiWii-Camera-1.3.13-SOURCES.zip PiiWii-Camera-1.3.13-public

      - uses: actions/upload-artifact@v4
        with:
          name: PiiWii-Camera-1.3.13-capture-polish-unsigned
          retention-days: 7
          path: /tmp/piiwii-camera-v1313-out/
