name: PiiWii TV 1.0.5 Windows Build

on:
  push:
    branches: [piiwii-tv-1.0.2-build]
    paths:
      - '.chatgpt-build/PiiWiiTV-master-1.0.5.ico.b64'
      - '.github/workflows/piiwii-tv-1.0.2-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download exact 1.0.4 source package
        uses: actions/download-artifact@v4
        with:
          name: PiiWii-TV-1.0.4-Windows-CANONICAL-ICON
          path: previous
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: piiwii1/wlm-escargot-android-updates
          run-id: 36258259734

      - name: Prepare 1.0.5 with exact master icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/src | Out-Null
          Expand-Archive 'previous/PiiWii-TV-Windows-1.0.4-SOURCES.zip' 'build/src' -Force

          $masterB64=(Get-Content '.chatgpt-build/PiiWiiTV-master-1.0.5.ico.b64' -Raw).Trim()
          [IO.File]::WriteAllBytes('build/src/PiiWiiTV.ico',[Convert]::FromBase64String($masterB64))
          $masterHash=(Get-FileHash 'build/src/PiiWiiTV.ico' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($masterHash -ne 'f7c065901c2c99e5c1150f9cabeae050b5dc3be483c0d9cc7a85226c7d90ef83') { throw "Wrong master icon hash: $masterHash" }

          $props='build/src/Directory.Build.props'
          $d=Get-Content $props -Raw
          $d=$d.Replace('<PiiWiiVersion>1.0.4</PiiWiiVersion>','<PiiWiiVersion>1.0.5</PiiWiiVersion>')
          Set-Content $props $d -Encoding utf8

          $proj='build/src/PiiWiiTV.csproj'
          $p=Get-Content $proj -Raw
          if ($p -notmatch '<ApplicationIcon>PiiWiiTV.ico</ApplicationIcon>') { throw 'ApplicationIcon not bound to PiiWiiTV.ico' }
          if ($p -notmatch 'CopyToPublishDirectory="Always"') { throw 'PiiWiiTV.ico not copied to publish output' }

          $form='build/src/MainForm.cs'
          $f=Get-Content $form -Raw
          if ($f -notmatch 'new System.Drawing.Icon\(System.IO.Path.Combine\(AppContext.BaseDirectory, "PiiWiiTV.ico"\)\)') { throw 'Main window not bound to canonical PiiWiiTV.ico' }

          $iss='build/src/installer.iss'
          $i=Get-Content $iss -Raw
          $i=$i.Replace('#define MyAppVersion "1.0.4"','#define MyAppVersion "1.0.5"')
          if ($i -notmatch '(?m)^SetupIconFile=PiiWiiTV\.ico$') {
            $i=$i -replace '(?m)^(AppVersion=.*)$', '$1' + [Environment]::NewLine + 'SetupIconFile=PiiWiiTV.ico'
          }
          if ($i -match '\[Icons\]' -and $i -notmatch 'IconFilename: "\{app\}\\PiiWiiTV\.exe"') {
            $i=$i -replace 'Filename: "\{app\}\\PiiWiiTV\.exe"', 'Filename: "{app}\PiiWiiTV.exe"; IconFilename: "{app}\PiiWiiTV.exe"'
          }
          Set-Content $iss $i -Encoding utf8

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained Windows x64
        shell: pwsh
        working-directory: build/src
        run: |
          dotnet restore .\PiiWiiTV.csproj
          dotnet publish .\PiiWiiTV.csproj -c Release -r win-x64 --self-contained true -o .\publish
          if (!(Test-Path '.\publish\PiiWiiTV.exe')) { throw 'PiiWiiTV.exe missing' }
          if (!(Test-Path '.\publish\PiiWiiTV.ico')) { throw 'PiiWiiTV.ico missing from publish output' }
          $v=(Get-Item '.\publish\PiiWiiTV.exe').VersionInfo.FileVersion
          if ($v -ne '1.0.5.0') { throw "Bad EXE version: $v" }
          $publishedIconHash=(Get-FileHash '.\publish\PiiWiiTV.ico' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($publishedIconHash -ne 'f7c065901c2c99e5c1150f9cabeae050b5dc3be483c0d9cc7a85226c7d90ef83') { throw "Published icon changed: $publishedIconHash" }

          Add-Type -AssemblyName System.Drawing
          $appIcon=[System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path '.\publish\PiiWiiTV.exe'))
          if ($null -eq $appIcon) { throw 'EXE has no extractable embedded icon' }
          $appBmp=$appIcon.ToBitmap()
          $appBmp.Save((Join-Path (Get-Location) 'APP-EXE-ICON-CHECK.png'),[System.Drawing.Imaging.ImageFormat]::Png)
          $appBmp.Dispose(); $appIcon.Dispose()

      - name: Prepare installer dependencies
        shell: pwsh
        working-directory: build/src
        run: |
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile 'MicrosoftEdgeWebview2Setup.exe'
          if ((Get-Item 'MicrosoftEdgeWebview2Setup.exe').Length -lt 1000000) { throw 'Invalid WebView2 bootstrapper' }
          choco install innosetup -y --no-progress

      - name: Build release package
        shell: pwsh
        working-directory: build/src
        run: |
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { throw 'ISCC.exe missing' }
          & $iscc '/DMyAppVersion=1.0.5' '.\installer.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno failed: $LASTEXITCODE" }
          if (!(Test-Path '.\output\PiiWii-TV-Setup-1.0.5.exe')) { throw 'Installer missing' }

          Add-Type -AssemblyName System.Drawing
          $setupIcon=[System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path '.\output\PiiWii-TV-Setup-1.0.5.exe'))
          if ($null -eq $setupIcon) { throw 'Installer has no extractable embedded icon' }
          $setupBmp=$setupIcon.ToBitmap()
          $setupBmp.Save((Join-Path (Get-Location) 'SETUP-EXE-ICON-CHECK.png'),[System.Drawing.Imaging.ImageFormat]::Png)
          $setupBmp.Dispose(); $setupIcon.Dispose()

          New-Item -ItemType Directory -Force '.\release' | Out-Null
          Copy-Item '.\output\PiiWii-TV-Setup-1.0.5.exe' '.\release\PiiWii-TV-Setup-1.0.5.exe'
          Copy-Item '.\APP-EXE-ICON-CHECK.png' '.\release\APP-EXE-ICON-CHECK.png'
          Copy-Item '.\SETUP-EXE-ICON-CHECK.png' '.\release\SETUP-EXE-ICON-CHECK.png'
          Copy-Item '.\PiiWiiTV.ico' '.\release\PiiWiiTV-MASTER.ico'
          Compress-Archive '.\publish\*' '.\release\PiiWii-TV-1.0.5-PORTABLE.zip' -CompressionLevel Optimal
          Compress-Archive @('Program.cs','MainForm.cs','NativeBridge.cs','AppCommands.cs','AppInfo.cs','AppLogger.cs','PiiWiiTV.csproj','Directory.Build.props','installer.iss','PiiWiiTV.ico') '.\release\PiiWii-TV-Windows-1.0.5-SOURCES.zip' -CompressionLevel Optimal
          $files=Get-ChildItem '.\release' -File | Sort-Object Name
          $lines=foreach($f in $files){$h=(Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant(); "$h  $($f.Name)"}
          $lines | Set-Content '.\release\SHA256SUMS.txt' -Encoding ascii
          Get-Content '.\release\SHA256SUMS.txt'

      - uses: actions/upload-artifact@v4
        with:
          name: PiiWii-TV-1.0.5-Windows-MASTER-ICON
          path: build/src/release/*
          if-no-files-found: error
          retention-days: 7
