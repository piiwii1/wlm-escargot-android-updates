name: Foire du Valais Android Build
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/foire-valais-build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply step 1 base
        shell: bash
        run: |
          set -euo pipefail
          cat foire-valais-app/patches/etape1/chunk-* | base64 -d | tar -xzf - -C foire-valais-app
      - name: Apply step 2 home
        shell: bash
        run: |
          set -euo pipefail
          cat foire-valais-app/patches/etape2c/chunk-* | base64 -d | tar -xzf - -C foire-valais-app
      - name: Apply step 3 programme and search
        shell: bash
        run: |
          set -euo pipefail
          cat foire-valais-app/patches/etape3/chunk-* | base64 -d | gunzip > /tmp/step3.patch
          cd foire-valais-app
          patch -p1 < /tmp/step3.patch
      - name: Apply step 4 favorites and settings
        shell: bash
        run: |
          set -euo pipefail
          cat foire-valais-app/patches/etape4/chunk-* | base64 -d | gunzip > /tmp/step4.patch
          cd foire-valais-app
          patch -p1 < /tmp/step4.patch
      - name: Apply step 5 visual fidelity
        shell: bash
        run: |
          set -euo pipefail
          cat foire-valais-app/patches/etape5/chunk-* | base64 -d | gunzip > /tmp/step5.patch
          cd foire-valais-app
          patch -p1 < /tmp/step5.patch
          sed -i 's/Version 1\.5\.1 · versionCode 7/Version 1.5.4 · versionCode 10/g' app/src/main/java/ch/piiwii/foirevalais/MainActivity.java
      - name: Apply 1.5.5 step 6A reminder restore only
        shell: bash
        run: |
          set -euo pipefail
          cd foire-valais-app
          patch -p1 < patches/etape6a/step6a.patch
          sed -i 's/Version 1\.5\.4/Version 1.5.5/g; s/versionCode 10/versionCode 11/g' app/src/main/java/ch/piiwii/foirevalais/MainActivity.java
          grep -q 'versionCode = 11' app/build.gradle.kts
          grep -q 'versionName = "1.5.5"' app/build.gradle.kts
          grep -q 'key.startsWith("delay")' app/src/main/java/ch/piiwii/foirevalais/ReminderRestoreReceiver.java
          ! grep -q 'key.startsWith("fav")' app/src/main/java/ch/piiwii/foirevalais/ReminderRestoreReceiver.java
          ! grep -q 'Personnalisé' app/src/main/java/ch/piiwii/foirevalais/MainActivity.java
          ! grep -q 'Version 1.5.4\|versionCode 10' app/src/main/java/ch/piiwii/foirevalais/MainActivity.java
      - name: Install Android SDK 35
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build release APK
        working-directory: foire-valais-app
        run: gradle --no-daemon :app:assembleRelease
      - name: Prepare aligned deliverables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deliverables/sign-tools/lib
          /usr/local/lib/android/sdk/build-tools/35.0.0/zipalign -f -p 4 foire-valais-app/app/build/outputs/apk/release/app-release-unsigned.apk deliverables/Foire-du-Valais-2026-1.5.5-ETAPE6A-ALIGNED-UNSIGNED.apk
          /usr/local/lib/android/sdk/build-tools/35.0.0/zipalign -c -v 4 deliverables/Foire-du-Valais-2026-1.5.5-ETAPE6A-ALIGNED-UNSIGNED.apk
          cp /usr/local/lib/android/sdk/build-tools/35.0.0/lib/apksigner.jar deliverables/sign-tools/lib/apksigner.jar
          cd foire-valais-app
          zip -qr ../deliverables/Foire-du-Valais-2026-1.5.5-ETAPE6A-SOURCES.zip . -x '*/build/*' '.gradle/*'
      - uses: actions/upload-artifact@v4
        with:
          name: Foire-du-Valais-2026-1.5.5-ETAPE6A-aligned
          path: deliverables/*
          retention-days: 7
