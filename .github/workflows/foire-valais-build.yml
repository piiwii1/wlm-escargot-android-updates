name: Foire du Valais Android Build
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/foire-valais-build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply 1.5.0 step 1 source
        shell: bash
        run: |
          set -euo pipefail
          cat foire-valais-app/patches/etape1/chunk-* | base64 -d | tar -xzf - -C foire-valais-app
          grep -q 'versionCode = 6' foire-valais-app/app/build.gradle.kts
          grep -q 'versionName = "1.5.0"' foire-valais-app/app/build.gradle.kts
      - name: Install Android SDK 35
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build release APK
        working-directory: foire-valais-app
        run: gradle --no-daemon :app:assembleRelease
      - name: Prepare deliverables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deliverables
          cp foire-valais-app/app/build/outputs/apk/release/app-release-unsigned.apk deliverables/Foire-du-Valais-2026-1.5.0-ETAPE1-UNSIGNED.apk
          cd foire-valais-app
          zip -qr ../deliverables/Foire-du-Valais-2026-1.5.0-ETAPE1-SOURCES.zip . -x '*/build/*' '.gradle/*'
      - uses: actions/upload-artifact@v4
        with:
          name: Foire-du-Valais-2026-1.5.0-ETAPE1-unsigned
          path: deliverables/*
          retention-days: 7
