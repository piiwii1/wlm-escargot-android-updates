name: Gros Live 2.4.4 direct handoff

on:
  push:
    paths:
      - '.github/workflows/groslive-v244-direct-handoff.yml'

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified APK
        run: |
          curl -L --fail --retry 3 'https://piiwii.ch/wp-content/uploads/2026/09/GrosLive2026-v2.4.4.apk' -o GrosLive2026-v2.4.4.apk
          echo 'e2438a1e9eeb890012e3a0935c82454444bf05709bf8968c6fcee8b62211e5f5  GrosLive2026-v2.4.4.apk' | sha256sum -c -
          echo 'e2438a1e9eeb890012e3a0935c82454444bf05709bf8968c6fcee8b62211e5f5  GrosLive2026-v2.4.4.apk' > GrosLive2026-v2.4.4-SHA256.txt
      - name: Upload handoff
        uses: actions/upload-artifact@v4
        with:
          name: GrosLive2026-v2.4.4
          path: |
            GrosLive2026-v2.4.4.apk
            GrosLive2026-v2.4.4-SHA256.txt
