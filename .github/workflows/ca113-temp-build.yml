name: PiiWii Files 1.3.12 Home Footer Build

on:
  push:
    branches: [piiwii-files-1312-build]
    paths:
      - 'piiwii-files-1312-build/**'
      - '.github/workflows/ca113-temp-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - uses: android-actions/setup-android@v3
      - name: Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Reconstruct 1.3.7
        shell: bash
        run: |
          set -euo pipefail
          W=/tmp/pf1312; mkdir -p "$W/project"
          cat piiwii-files-137-build/source.part.00 piiwii-files-137-build/source.part.01 piiwii-files-137-build/source.part.02 piiwii-files-137-build/source.part.03 piiwii-files-137-build/source.part.04 > "$W/source.b64"
          base64 -d "$W/source.b64" > "$W/source.tar.gz"
          echo '4c4633dc8f43e866887ee1bdcf85397a60a6af01c25cb1c0d3e491ca11f20754  /tmp/pf1312/source.tar.gz' | sha256sum -c -
          tar -xzf "$W/source.tar.gz" -C "$W/project"

      - name: Rebuild 1.3.8
        run: |
          set -euo pipefail
          W=/tmp/pf1312; cd "$W/project"
          patch -p1 < "$GITHUB_WORKSPACE/piiwii-files-138-build/visual-138.patch"
          base64 -d "$GITHUB_WORKSPACE/piiwii-files-138-build/icons-138.tar.gz.b64" > "$W/icons138.tar.gz"
          echo 'a9154deed37876647251637b34b3ead2276d4763e6e41ed1252b294bd23e73df  /tmp/pf1312/icons138.tar.gz' | sha256sum -c -
          tar -xzf "$W/icons138.tar.gz" -C app/src/main/res/drawable

      - name: Rebuild 1.3.9
        run: |
          set -euo pipefail
          W=/tmp/pf1312
          cat piiwii-files-139-build/ui139.patch.gz.b64.part.00 piiwii-files-139-build/ui139.patch.gz.b64.part.01 piiwii-files-139-build/ui139.patch.gz.b64.part.02 > "$W/ui139.b64"
          base64 -d "$W/ui139.b64" > "$W/ui139.gz"
          echo 'b82c35c81a2f271f86e759ba0db81177280f77d7f14cbea91aafad9f7e8aa209  /tmp/pf1312/ui139.gz' | sha256sum -c -
          gunzip -c "$W/ui139.gz" | (cd "$W/project" && patch --batch -p1)
          cd "$W/project" && patch --batch -p1 < "$GITHUB_WORKSPACE/piiwii-files-139-build/browsernav-compile-fix.patch"

      - name: Rebuild 1.3.10
        run: |
          set -euo pipefail
          W=/tmp/pf1312
          cat piiwii-files-1310-build/ui1310.patch.gz.b64.part.00 piiwii-files-1310-build/ui1310.patch.gz.b64.part.01 piiwii-files-1310-build/ui1310.patch.gz.b64.part.02 > "$W/ui1310.b64"
          base64 -d "$W/ui1310.b64" > "$W/ui1310.gz"
          echo 'a97267e244a1fecd9c7ea78d9be9a58f4f214cb6339d4c538a5e7cc639ae3927  /tmp/pf1312/ui1310.gz' | sha256sum -c -
          gunzip -c "$W/ui1310.gz" | (cd "$W/project" && patch --batch -p1)

      - name: Rebuild 1.3.11
        run: |
          set -euo pipefail
          W=/tmp/pf1312
          cat piiwii-files-1311-build/ui1311.patch.gz.b64.part.00 piiwii-files-1311-build/ui1311.patch.gz.b64.part.01 piiwii-files-1311-build/ui1311.patch.gz.b64.part.02 piiwii-files-1311-build/ui1311.patch.gz.b64.part.03 > "$W/ui1311.b64"
          base64 -d "$W/ui1311.b64" > "$W/ui1311.gz"
          echo '8c85407ca9429be22a5f58f3a5c316db84da233abcd1c56b7b79319ea7e8d4fc  /tmp/pf1312/ui1311.gz' | sha256sum -c -
          gunzip -c "$W/ui1311.gz" | (cd "$W/project" && patch --batch -p1)
          grep -q "versionName '1.3.11'" "$W/project/app/build.gradle"

      - name: Apply exact 1.3.12 Home footer
        run: |
          set -euo pipefail
          W=/tmp/pf1312
          echo '9887a141d2999b01dffaecc67bc1d4e17c2e5a624c00c265c6216bdc16525c9a  piiwii-files-1312-build/ui1312.patch.gz' | sha256sum -c -
          gunzip -c piiwii-files-1312-build/ui1312.patch.gz | (cd "$W/project" && patch --batch -p1)
          grep -q "versionCode 16" "$W/project/app/build.gradle"
          grep -q "versionName '1.3.12'" "$W/project/app/build.gradle"
          grep -q 'R.drawable.ic_nav_home, "Home"' "$W/project/app/src/main/java/ch/piiwii/files/MainActivity.java"
          grep -q 'private void showHome() { showHomeTab(HOME_MAIN); }' "$W/project/app/src/main/java/ch/piiwii/files/MainActivity.java"
          test -f "$W/project/app/src/main/res/drawable/ic_nav_home.xml"

      - name: Build release
        run: cd /tmp/pf1312/project && gradle --no-daemon clean assembleRelease

      - name: Align and validate
        run: |
          set -euo pipefail
          W=/tmp/pf1312; mkdir -p "$W/out"
          RAW="$W/project/app/build/outputs/apk/release/app-release-unsigned.apk"
          APK="$W/out/PiiWii-Files-1.3.12-aligned-unsigned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 "$RAW" "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK" > "$W/out/zipalign.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > "$W/out/metadata.txt"
          grep -q "package: name='ch.piiwii.files' versionCode='16' versionName='1.3.12'" "$W/out/metadata.txt"
          sha256sum "$APK" > "$W/out/unsigned.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: piiwii-files-1.3.12-unsigned
          path: /tmp/pf1312/out/
          if-no-files-found: error
          retention-days: 90
