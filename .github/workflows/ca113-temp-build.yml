name: Temporary Android toolchain export for ListY

on:
  push:
    paths:
      - '.github/workflows/ca113-temp-build.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 35 tools from preinstalled sdkmanager
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Pack minimal toolchain
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/listy-toolchain/platform /tmp/listy-toolchain/build-tools/lib
          cp "$ANDROID_HOME/platforms/android-35/android.jar" /tmp/listy-toolchain/platform/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/d8.jar" /tmp/listy-toolchain/build-tools/lib/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" /tmp/listy-toolchain/build-tools/lib/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" /tmp/listy-toolchain/build-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/aapt2" /tmp/listy-toolchain/build-tools/
          tar -C /tmp -czf /tmp/listy-android35-toolchain.tar.gz listy-toolchain
          sha256sum /tmp/listy-android35-toolchain.tar.gz
      - name: Upload toolchain
        uses: actions/upload-artifact@v4
        with:
          name: listy-android35-toolchain
          path: /tmp/listy-android35-toolchain.tar.gz
          retention-days: 1
