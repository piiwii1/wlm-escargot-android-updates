name: Compagnon Autoroute 1.0.14 icon build
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ca113-temp-build.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}

      - name: Reconstruct verified source through 1.0.14
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          set -euo pipefail
          : > /tmp/source.zip
          for H in 2ea825b585a9f260bd4256fe811650d245ccd837 5e6264585e4ec332f8e6b0f3852857f9edfb4dca d39c3528e691213de6d750e3ba12d2e29baccf78 0f9b4635d69cc740e8ccb462379e07c0685e0159; do
            gh api repos/${GITHUB_REPOSITORY}/git/blobs/$H --jq .content | tr -d '\n' | base64 -d >> /tmp/source.zip
          done
          echo '4b336e63b342a0cd7eca9a68d7b51fdf7a908d531c6ba87a1a585f7aed2374a1  /tmp/source.zip' | sha256sum -c -
          unzip -tq /tmp/source.zip
          mkdir /tmp/src
          unzip -q /tmp/source.zip -d /tmp/src
          P=$(dirname "$(find /tmp/src -maxdepth 3 -name settings.gradle | head -1)")
          cd "$P"

          gh api repos/${GITHUB_REPOSITORY}/git/blobs/e5976342589fed3af27f050fc65c81615775cc91 --jq .content | tr -d '\n' | base64 -d > /tmp/ca109.patch
          echo '09c5b55d9b36f1c5bdd4aad44f42e45651e822003dfe68eaeae5cb4afaa0f4c9  /tmp/ca109.patch' | sha256sum -c -
          patch -p4 --batch < /tmp/ca109.patch
          sed -i 's/external\.setOnClickListener(v -> openCurrentPositionInMaps())/external.setOnClickListener(view -> openCurrentPositionInMaps())/' app/src/main/java/com/compagnonautoroute/app/MainActivity.java

          gh api repos/${GITHUB_REPOSITORY}/git/blobs/da4a0a7c795216b8b4d65cfe70c3ec02a0452167 --jq .content | tr -d '\n' | base64 -d > /tmp/ca110.patch.gz
          echo '5f40cd7d732eb8af8491e36eb67f512aae7c04eb15128417520bd24f9fc2df65  /tmp/ca110.patch.gz' | sha256sum -c -
          gunzip -c /tmp/ca110.patch.gz > /tmp/ca110.patch
          patch -p1 --batch < /tmp/ca110.patch

          gh api repos/${GITHUB_REPOSITORY}/git/blobs/6a3a01e49ae6c80c085846318197c51961b4851b --jq .content | tr -d '\n' | base64 -d > /tmp/ca111.patch.gz
          echo '2b3ca6e35a3cd7f2ab5711d9f68299ffcb5788f58f420fbb9cb23106768235f2  /tmp/ca111.patch.gz' | sha256sum -c -
          gunzip -c /tmp/ca111.patch.gz > /tmp/ca111.patch
          patch -p1 --batch < /tmp/ca111.patch

          gh api repos/${GITHUB_REPOSITORY}/git/blobs/4cd028abd1f01b38d26a92763e9c5ee4eea72be7 --jq .content | tr -d '\n' | base64 -d > /tmp/ca112.patch.gz
          echo '112691f0b61a728eefa02849b366b35296b724f4942faf2ae19e37348f384970  /tmp/ca112.patch.gz' | sha256sum -c -
          gunzip -c /tmp/ca112.patch.gz > /tmp/ca112.patch
          patch -p1 --batch < /tmp/ca112.patch
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/compagnonautoroute/app/MainActivity.java')
          s = p.read_text()
          old = 'raw.replaceAll("[^\\p{L}\\p{N}]+", " ")'
          new = 'raw.replaceAll("[^\\\\p{L}\\\\p{N}]+", " ")'
          if old in s:
              p.write_text(s.replace(old, new, 1))
          PY

          gh api repos/${GITHUB_REPOSITORY}/git/blobs/f9182dba3e168a51c227bcb17d0717e62beca545 --jq .content | tr -d '\n' | base64 -d > /tmp/ca113.patch
          echo '9564e9c005fbc0b11bc73e3a484660460bfce72a597ebaa896bf8e9234e56e81  /tmp/ca113.patch' | sha256sum -c -
          patch -p1 --batch < /tmp/ca113.patch

          gh api repos/${GITHUB_REPOSITORY}/git/blobs/9aab393de93635a3466820d7f68a577e42929c71 --jq .content | tr -d '\n' | base64 -d > /tmp/ca114.patch
          echo '44007a76e58519d99adcdba7ec45fa65280f04acdd797fc8950148e6026bbda1  /tmp/ca114.patch' | sha256sum -c -
          patch -p1 --batch < /tmp/ca114.patch

          echo '25c98aed39aef133e6ad47de22f335f2b94e7ec1eab4038c2460dde880522ee6  app/build.gradle' | sha256sum -c -
          echo '6308d6600a2adfe40e39aaa9c645c797d8bc7116753ab3e044f039082f95e782  app/src/main/java/com/compagnonautoroute/app/MainActivity.java' | sha256sum -c -
          echo '00a15aad00c67fb599990b8fc20c46f08e5791b13389b89d8c794a607ffe129d  app/src/main/java/com/compagnonautoroute/app/data/OverpassClient.java' | sha256sum -c -
          grep -F 'case "miniprix": return "Mini Prix";' app/src/main/java/com/compagnonautoroute/app/MainActivity.java
          grep -F 'coop tankstelle' app/src/main/java/com/compagnonautoroute/app/MainActivity.java
          echo "$P" > /tmp/project-path

      - name: Download and compact seven verified station logos
        run: |
          set -euo pipefail
          P=$(cat /tmp/project-path)
          D="$P/app/src/main/res/drawable-nodpi"
          rm -rf "$D"
          mkdir -p "$D" /tmp/logos
          UA='Mozilla/5.0'
          get() { echo "Downloading $1"; curl -A "$UA" -fL --retry 3 --connect-timeout 15 --max-time 60 "$2" -o "/tmp/logos/$1"; test -s "/tmp/logos/$1"; }

          get eni.png 'https://cdn.freebiesupply.com/logos/large/2x/eni-1-logo-png-transparent.png'
          get shell.jpg 'https://amecorg.com/wp-content/uploads/2023/06/Shell-Pecten-Logo-RGB.jpg'
          get migrol.jpg 'https://upload.wikimedia.org/wikipedia/commons/9/92/Migrol_Logo.jpg'
          get tamoil.png 'https://cdn.freebiesupply.com/logos/large/2x/tamoil-logo-png-transparent.png'
          get combustia.png 'https://media.jobs.ch/media/6089b4f1-172f-44fd-9aee-38b1e8ec124a?dimensions=1200x0&format=png'
          get miniprix.png 'https://zbinden-schwarzsee.ch/wp-content/uploads/2024/02/miniprix.png'

          curl -A "$UA" -fL --retry 3 --connect-timeout 15 --max-time 60 'https://libs.coop.ch/logos-vst/coop-pronto-fr.svg' -o /tmp/logos/coop.svg
          if command -v magick >/dev/null 2>&1; then
            magick -background none /tmp/logos/coop.svg /tmp/logos/coop.png
          elif command -v convert >/dev/null 2>&1; then
            convert -background none /tmp/logos/coop.svg /tmp/logos/coop.png
          else
            get coop.jpg 'https://uploads-ssl.webflow.com/617a436ffeb78984e38dc31b/61b91989cf42f08bb4b00e16_Coop_Pronto_Logo.jpg'
          fi

          cat > /tmp/TrimLogo.java <<'JAVA'
          import java.awt.image.BufferedImage;
          import java.io.File;
          import javax.imageio.ImageIO;
          public class TrimLogo {
            public static void main(String[] a) throws Exception {
              BufferedImage in = ImageIO.read(new File(a[0]));
              if (in == null) throw new IllegalArgumentException("Unreadable image: " + a[0]);
              int w=in.getWidth(), h=in.getHeight(), minX=w, minY=h, maxX=-1, maxY=-1;
              for (int y=0;y<h;y++) for (int x=0;x<w;x++) {
                int p=in.getRGB(x,y), al=(p>>>24)&255, r=(p>>>16)&255, g=(p>>>8)&255, b=p&255;
                boolean bg = al < 20 || (r>245 && g>245 && b>245);
                if (!bg) { if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y; }
              }
              if (maxX < minX || maxY < minY) { minX=0; minY=0; maxX=w-1; maxY=h-1; }
              int m=Math.max(4, Math.max(w,h)/100);
              minX=Math.max(0,minX-m); minY=Math.max(0,minY-m); maxX=Math.min(w-1,maxX+m); maxY=Math.min(h-1,maxY+m);
              BufferedImage crop=in.getSubimage(minX,minY,maxX-minX+1,maxY-minY+1);
              BufferedImage out=new BufferedImage(crop.getWidth()+16,crop.getHeight()+16,BufferedImage.TYPE_INT_ARGB);
              out.getGraphics().drawImage(crop,8,8,null);
              ImageIO.write(out,"png",new File(a[1]));
              System.out.println(new File(a[1]).getName()+" "+out.getWidth()+"x"+out.getHeight());
            }
          }
          JAVA
          javac /tmp/TrimLogo.java
          for f in eni shell migrol tamoil combustia miniprix coop; do
            IN=$(find /tmp/logos -maxdepth 1 -type f -name "$f.*" ! -name '*.svg' | head -1)
            test -n "$IN"
            java -Djava.awt.headless=true -cp /tmp TrimLogo "$IN" "$D/fuel_logo_${f}.png"
          done
          file "$D"/fuel_logo_* | tee /tmp/logo-files.txt
          for f in eni shell migrol tamoil combustia miniprix coop; do test -s "$D/fuel_logo_${f}.png"; done

      - name: Core tests
        run: |
          set -e
          P=$(cat /tmp/project-path)
          mkdir /tmp/core
          javac -d /tmp/core \
            "$P/app/src/main/java/com/compagnonautoroute/app/core/GeoMath.java" \
            "$P/app/src/main/java/com/compagnonautoroute/app/core/RouteGraph.java" \
            "$P/app/src/main/java/com/compagnonautoroute/app/core/ServiceQuality.java" \
            "$P/app/src/main/java/com/compagnonautoroute/app/model/ServiceType.java" \
            "$P/app/src/main/java/com/compagnonautoroute/app/model/HighwayService.java" \
            "$P/tools/CoreLogicSelfTest.java"
          java -cp /tmp/core CoreLogicSelfTest | tee /tmp/core-tests.txt

      - name: Build and verify APK
        run: |
          set -euo pipefail
          P=$(cat /tmp/project-path)
          cd "$P"
          gradle --no-daemon :app:assembleRelease
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          test -f "$APK"
          mkdir -p /tmp/out
          BDIR="$ANDROID_HOME/build-tools/35.0.0"
          "$BDIR/zipalign" -p -f 4 "$APK" /tmp/out/CompagnonAutoroute-1.0.14-V1-aligned-unsigned.apk
          "$BDIR/zipalign" -c -v 4 /tmp/out/CompagnonAutoroute-1.0.14-V1-aligned-unsigned.apk
          "$BDIR/aapt" dump badging /tmp/out/CompagnonAutoroute-1.0.14-V1-aligned-unsigned.apk | tee /tmp/out/badging.txt
          grep -F "package: name='com.compagnonautoroute.app' versionCode='15' versionName='1.0.14-v1'" /tmp/out/badging.txt
          "$BDIR/aapt" dump resources /tmp/out/CompagnonAutoroute-1.0.14-V1-aligned-unsigned.apk > /tmp/out/resources.txt
          grep -E 'fuel_logo_(eni|shell|migrol|tamoil|combustia|coop|miniprix)' /tmp/out/resources.txt | tee /tmp/out/embedded-logos.txt
          for f in eni shell migrol tamoil combustia coop miniprix; do grep -q "fuel_logo_${f}" /tmp/out/resources.txt; done
          sha256sum /tmp/out/CompagnonAutoroute-1.0.14-V1-aligned-unsigned.apk > /tmp/out/unsigned.sha256
          cp /tmp/core-tests.txt /tmp/out/
          cp /tmp/logo-files.txt /tmp/out/
          cp -a "$P/app/src/main/res/drawable-nodpi" /tmp/out/brand-assets

      - uses: actions/upload-artifact@v4
        with:
          name: CompagnonAutoroute-1.0.14-V1-ICONS
          path: '/tmp/out/*'
          retention-days: 1
