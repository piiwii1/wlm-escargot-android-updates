name: CA113 temporary build (retired)

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Workflow retired after successful CA113 1.0.0 delivery"
        required: false
        default: "No build is performed."

permissions:
  contents: read

jobs:
  retired:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "This temporary CA113 build workflow is retired."
