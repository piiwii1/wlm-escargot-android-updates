      - name: Build APK
        working-directory: sony-launcher
        run: gradle --no-daemon --stacktrace assembleDebug
      - uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: pi...-stable-v140
      - name: Stage APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp sony-launcher/app/build/outputs/apk/debug/app-debug.apk release/PiiWii-Sony-Accueil-1.4.0.apk
          (cd release && sha256sum PiiWii-Sony-Accueil-1.4.0.apk > SHA256.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: PiiWii-Sony-Accueil-1.4.0
          path: release/
          if-no-files-found: error
