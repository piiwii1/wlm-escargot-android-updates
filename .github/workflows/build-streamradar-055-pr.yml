name: Build StreamRadar 0.55.0 installable PR

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'temp-streamradar-055/**'
      - '.github/workflows/build-streamradar-055-pr.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Récupérer source 0.54 validée
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9565626657/zip" -o /tmp/sr054-artifact.zip
          mkdir -p /tmp/sr054-artifact /tmp/streamradar-src
          unzip -q /tmp/sr054-artifact.zip -d /tmp/sr054-artifact
          test -f /tmp/sr054-artifact/StreamRadar-0.54.0-source.zip
          unzip -q /tmp/sr054-artifact/StreamRadar-0.54.0-source.zip -d /tmp/streamradar-src
          test -f /tmp/streamradar-src/android/app/build.gradle.kts

      - name: Appliquer StreamRadar 0.55.0
        shell: bash
        run: |
          set -euo pipefail
          tr -d '\n\r' < "$GITHUB_WORKSPACE/temp-streamradar-055/patch.b64" > /tmp/p055.b64
          echo '8aa94586ef824a5e4b45a77778af5e979c11c5812ead9b2b4b2d686846a6643b  /tmp/p055.b64' | sha256sum -c -
          base64 -d < /tmp/p055.b64 | gzip -d > /tmp/p055.patch
          cd /tmp/streamradar-src/android
          patch -p1 --dry-run < /tmp/p055.patch
          patch -p1 < /tmp/p055.patch
          cp "$GITHUB_WORKSPACE/temp-streamradar-055/RecommendationEngine.kt" app/src/main/java/ch/piiwii/streamradar/data/RecommendationEngine.kt

          grep -q 'applicationId = "ch.piiwii.streamradar2"' app/build.gradle.kts
          grep -q 'versionName = "0.55.0"' app/build.gradle.kts
          grep -q 'versionCode = 55' app/build.gradle.kts
          test -f app/src/main/java/ch/piiwii/streamradar/data/RecommendationEngine.kt
          grep -q 'toggleInterested' app/src/main/java/ch/piiwii/streamradar/data/AppStore.kt
          grep -q 'dismissRecommendation' app/src/main/java/ch/piiwii/streamradar/data/AppStore.kt
          grep -q 'resetRecommendations' app/src/main/java/ch/piiwii/streamradar/data/AppStore.kt
          grep -q 'RecommendationEngine.recommend' app/src/main/java/ch/piiwii/streamradar/StreamRadarApp.kt
          grep -q 'CalendarSelectedDaySummary' app/src/main/java/ch/piiwii/streamradar/StreamRadarApp.kt
          grep -q 'PAS POUR MOI' app/src/main/java/ch/piiwii/streamradar/StreamRadarApp.kt

      - name: Préparer sources 0.55
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/streamradar-src
          zip -qr /tmp/StreamRadar-0.55.0-source.zip android -x 'android/.gradle/*' 'android/app/build/*' 'android/build/*'

      - name: Compiler release
        working-directory: /tmp/streamradar-src/android
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk /tmp/StreamRadar-0.55.0-aligned.apk

      - name: Récupérer la clé StreamRadar
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9539378213/zip" -o /tmp/streamradar-signing.zip
          mkdir -p /tmp/streamradar-signing
          unzip -q /tmp/streamradar-signing.zip -d /tmp/streamradar-signing
          test -f /tmp/streamradar-signing/StreamRadar-release.jks
          test -f /tmp/streamradar-signing/SIGNING.txt

      - name: Signer et vérifier
        shell: bash
        run: |
          set -euo pipefail
          STOREPASS="$(sed -n 's/^storePassword=//p' /tmp/streamradar-signing/SIGNING.txt)"
          KEYPASS="$(sed -n 's/^keyPassword=//p' /tmp/streamradar-signing/SIGNING.txt)"
          ALIAS="$(sed -n 's/^alias=//p' /tmp/streamradar-signing/SIGNING.txt)"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks /tmp/streamradar-signing/StreamRadar-release.jks --ks-key-alias "$ALIAS" --ks-pass "pass:$STOREPASS" --key-pass "pass:$KEYPASS" --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true --out /tmp/StreamRadar-0.55.0-INSTALLABLE.apk /tmp/StreamRadar-0.55.0-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs /tmp/StreamRadar-0.55.0-INSTALLABLE.apk | tee /tmp/verify-055.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/verify-055.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/verify-055.txt
          grep -qi 'Signer #1 certificate SHA-256 digest: dd7ba53a3fe59e22b8dac20251711929dd0cbc9e0cc211f1c1cac8499aca4bec' /tmp/verify-055.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging /tmp/StreamRadar-0.55.0-INSTALLABLE.apk | head -n 3 | tee /tmp/package-055.txt
          grep -q "package: name='ch.piiwii.streamradar2' versionCode='55' versionName='0.55.0'" /tmp/package-055.txt
          sha256sum /tmp/StreamRadar-0.55.0-INSTALLABLE.apk > /tmp/StreamRadar-0.55.0-INSTALLABLE.apk.sha256

      - name: Publier APK installable
        uses: actions/upload-artifact@v4
        with:
          name: StreamRadar-0.55.0-INSTALLABLE
          path: |
            /tmp/StreamRadar-0.55.0-INSTALLABLE.apk
            /tmp/StreamRadar-0.55.0-INSTALLABLE.apk.sha256
            /tmp/StreamRadar-0.55.0-source.zip
            /tmp/verify-055.txt
            /tmp/package-055.txt
          if-no-files-found: error
          retention-days: 1
