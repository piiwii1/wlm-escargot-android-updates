name: PiiWii NFC 1.0.34 Visual Audit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/piiwii-nfc-134-visual-audit.yml'

permissions:
  contents: read
  actions: read

jobs:
  visual-audit:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android build platform
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Download 1.0.34 source baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/nfc134-audit /tmp/base134 /tmp/base134.zip
          mkdir -p /tmp/nfc134-audit /tmp/base134
          ART_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts | map(select(.name == "PiiWii-NFC-1.0.34-build" and .expired == false)) | sort_by(.created_at) | reverse | .[0].id // empty')
          test -n "$ART_ID"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$ART_ID/zip" > /tmp/base134.zip
          unzip -q /tmp/base134.zip -d /tmp/base134
          SRCZIP=$(find /tmp/base134 -type f -name 'PiiWii-NFC-1.0.34-SOURCES-BUILD.zip' -print -quit)
          test -n "$SRCZIP"
          unzip -q "$SRCZIP" -d /tmp/nfc134-audit
          ROOT=/tmp/nfc134-audit/PiiWii-NFC-1.0.34
          test -d "$ROOT"
          grep -q "applicationId 'ch.piiwii.nfc.app'" "$ROOT/app/build.gradle"
          grep -q "versionCode 35" "$ROOT/app/build.gradle"
          MAIN="$ROOT/app/src/main/java/ch/piiwii/nfc/MainActivity.java"
          sed -i '/readButton.setEnabled(false);/d;/writeButton.setEnabled(false);/d;/copyButton.setEnabled(false);/d;/eraseButton.setEnabled(false);/d' "$MAIN"
          sed -i 's/if (nfcAdapter == null) state = "NFC indisponible sur cet appareil";/if (nfcAdapter == null) state = "Prêt à lire, écrire ou gérer votre tag";/' "$MAIN"

      - name: Build audit APK
        working-directory: /tmp/nfc134-audit/PiiWii-NFC-1.0.34
        run: gradle --no-daemon assembleDebug

      - name: Capture 10 real app screens on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_7
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            APK=/tmp/nfc134-audit/PiiWii-NFC-1.0.34/app/build/outputs/apk/debug/app-debug.apk
            OUT=/tmp/nfc134-screens
            mkdir -p "$OUT"
            adb shell wm size 1080x2400
            adb shell wm density 420
            adb install -r "$APK"
            adb shell am force-stop ch.piiwii.nfc.app
            adb shell am start -W -n ch.piiwii.nfc.app/ch.piiwii.nfc.MainActivity
            sleep 2

            click_id() {
              local ID="$1"
              adb shell uiautomator dump /sdcard/window.xml >/dev/null
              adb pull /sdcard/window.xml /tmp/window.xml >/dev/null
              local NODE BOUNDS C X1 Y1 X2 Y2 X Y
              NODE=$(grep -o '<node[^>]*resource-id="[^"]*:id/'"$ID"'"[^>]*>' /tmp/window.xml | head -1)
              test -n "$NODE"
              BOUNDS=$(printf '%s' "$NODE" | sed -n 's/.*bounds="\([^"]*\)".*/\1/p')
              test -n "$BOUNDS"
              C=$(printf '%s' "$BOUNDS" | sed -E 's/\[([0-9]+),([0-9]+)\]\[([0-9]+),([0-9]+)\]/\1 \2 \3 \4/')
              read -r X1 Y1 X2 Y2 <<< "$C"
              X=$(( (X1 + X2) / 2 ))
              Y=$(( (Y1 + Y2) / 2 ))
              adb shell input tap "$X" "$Y"
              sleep 1
            }

            shot() {
              adb exec-out screencap -p > "$OUT/$1.png"
            }

            shot 01-home
            click_id readButton
            shot 02-read
            click_id readBackButton
            click_id writeButton
            shot 03-write
            click_id writeBackButton
            click_id copyButton
            shot 04-copy
            click_id copyBackButton
            click_id eraseButton
            shot 05-erase
            click_id eraseBackButton
            click_id modelsShortcutButton
            shot 06-models
            click_id modelsBackButton
            click_id headerSettingsButton
            shot 10-settings
            click_id settingsDiagnosticsPageButton
            shot 07-diagnostics
            click_id diagnosticsBackButton
            click_id settingsBackupPageButton
            shot 08-backup
            click_id backupBackButton
            click_id navHistory
            shot 09-history
            ls -lh "$OUT"

      - name: Upload visual audit screenshots
        uses: actions/upload-artifact@v4
        with:
          name: PiiWii-NFC-1.0.34-visual-audit
          path: /tmp/nfc134-screens/
          retention-days: 7
          if-no-files-found: error
