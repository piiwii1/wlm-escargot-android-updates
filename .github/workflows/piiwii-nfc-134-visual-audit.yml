name: PiiWii NFC 1.0.34 Visual Audit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/piiwii-nfc-134-visual-audit.yml'
      - 'piiwii-nfc-public/v134/audit-capture.sh'

permissions:
  contents: read
  actions: read

jobs:
  visual-audit:
    runs-on: ubuntu-22.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm || true
          ls -l /dev/kvm || true

      - name: Install Android build platform
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Download 1.0.34 source baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/nfc134-audit /tmp/base134 /tmp/base134.zip
          mkdir -p /tmp/nfc134-audit /tmp/base134
          ART_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts | map(select(.name == "PiiWii-NFC-1.0.34-build" and .expired == false)) | sort_by(.created_at) | reverse | .[0].id // empty')
          test -n "$ART_ID"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$ART_ID/zip" > /tmp/base134.zip
          unzip -q /tmp/base134.zip -d /tmp/base134
          SRCZIP=$(find /tmp/base134 -type f -name 'PiiWii-NFC-1.0.34-SOURCES-BUILD.zip' -print -quit)
          test -n "$SRCZIP"
          unzip -q "$SRCZIP" -d /tmp/nfc134-audit
          ROOT=/tmp/nfc134-audit/PiiWii-NFC-1.0.34
          test -d "$ROOT"
          grep -q "applicationId 'ch.piiwii.nfc.app'" "$ROOT/app/build.gradle"
          grep -q "versionCode 35" "$ROOT/app/build.gradle"
          MAIN="$ROOT/app/src/main/java/ch/piiwii/nfc/MainActivity.java"
          sed -i '/readButton.setEnabled(false);/d;/writeButton.setEnabled(false);/d;/copyButton.setEnabled(false);/d;/eraseButton.setEnabled(false);/d' "$MAIN"
          sed -i 's/if (nfcAdapter == null) state = "NFC indisponible sur cet appareil";/if (nfcAdapter == null) state = "Prêt à lire, écrire ou gérer votre tag";/' "$MAIN"

      - name: Build audit APK
        working-directory: /tmp/nfc134-audit/PiiWii-NFC-1.0.34
        run: gradle --no-daemon assembleDebug

      - name: Capture 10 real app screens on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash "$GITHUB_WORKSPACE/piiwii-nfc-public/v134/audit-capture.sh"

      - name: Upload visual audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PiiWii-NFC-1.0.34-visual-audit
          path: /tmp/nfc134-screens/
          retention-days: 7
          if-no-files-found: warn
