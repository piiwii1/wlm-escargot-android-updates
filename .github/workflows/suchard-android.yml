name: Suchard 2026 Android build
on:
  push:
    branches:
      - suchard-2026
    paths:
      - suchard-2026/**
      - .github/workflows/suchard-android.yml
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK platform
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle --no-daemon :app:assembleDebug
        working-directory: suchard-2026
      - uses: actions/upload-artifact@v4
        with:
          name: Suchard-APK
          path: suchard-2026/app/build/outputs/apk/debug/*.apk
