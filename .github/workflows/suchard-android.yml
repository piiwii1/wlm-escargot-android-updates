name: Suchard 2026 Android build
on:
  push:
    branches:
      - suchard-2026
    paths:
      - suchard-2026/**
      - .github/workflows/suchard-android.yml
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK platform
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle --no-daemon :app:assembleDebug
        working-directory: suchard-2026
      - name: Verify and package deliverables
        run: |
          set -euo pipefail
          mkdir -p delivery
          cp suchard-2026/app/build/outputs/apk/debug/app-debug.apk delivery/PiiWii-Suchard-2026-v1.0.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs delivery/PiiWii-Suchard-2026-v1.0.0.apk > delivery/SIGNATURE.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging delivery/PiiWii-Suchard-2026-v1.0.0.apk > delivery/BADGING.txt
          sha256sum delivery/PiiWii-Suchard-2026-v1.0.0.apk > delivery/SHA256.txt
          cd suchard-2026
          zip -qr ../delivery/PiiWii-Suchard-2026-v1.0.0-SOURCES.zip app/src app/build.gradle build.gradle settings.gradle README.md
          cd ..
          unzip -t delivery/PiiWii-Suchard-2026-v1.0.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Suchard-APK-AND-SOURCES
          path: delivery/*
