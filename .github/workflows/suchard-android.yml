name: Suchard 2026 Android V1.2 release
on:
  push:
    branches: [suchard-v1.2]
    paths:
      - 'suchard-2026/**'
      - '.github/workflows/suchard-android.yml'
permissions:
  actions: read
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 35
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Retrieve and optimize official artwork
        working-directory: suchard-2026
        run: |
          python3 -m pip install -q --break-system-packages Pillow
          python3 assets.py
          cat OFFICIAL-ASSETS.txt
      - uses: actions/download-artifact@v4
        with:
          name: PiiWii-Suchard-2026-v1.1.0-APK-SOURCES-SIGNATURE
          run-id: 38801054333
          github-token: ${{ github.token }}
          path: previous
      - name: Reuse V1.1 certificate
        run: |
          mkdir -p delivery
          cp previous/Suchard-2026-SIGNATURE.jks suchard-2026/app/suchard-release.jks
          cp previous/Suchard-2026-SIGNATURE.jks delivery/
          cp previous/SIGNATURE-RECUPERATION.txt delivery/
          pw=$(sed -n 's/^MOT DE PASSE: //p' previous/SIGNATURE-RECUPERATION.txt)
          echo "::add-mask::$pw"
          echo "SUCHARD_SIGN_PASS=$pw" >> "$GITHUB_ENV"
      - name: Build release APK
        working-directory: suchard-2026
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Validate and pack
        run: |
          set -euo pipefail
          cp suchard-2026/app/build/outputs/apk/release/app-release.apk delivery/PiiWii-Suchard-2026-v1.2.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs delivery/PiiWii-Suchard-2026-v1.2.0.apk > delivery/SIGNATURE-ANDROID.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging delivery/PiiWii-Suchard-2026-v1.2.0.apk > delivery/APK-METADATA.txt
          unzip -t delivery/PiiWii-Suchard-2026-v1.2.0.apk > delivery/INTEGRITE.txt
          cp suchard-2026/OFFICIAL-ASSETS.txt delivery/IMAGES-SOURCES.txt
          cd suchard-2026
          zip -qr ../delivery/PiiWii-Suchard-2026-v1.2.0-SOURCES.zip app/src app/build.gradle build.gradle settings.gradle assets.py OFFICIAL-ASSETS.txt README.md
          cd ..
          sha256sum delivery/PiiWii-Suchard-2026-v1.2.0.apk delivery/PiiWii-Suchard-2026-v1.2.0-SOURCES.zip > delivery/SHA256.txt
          grep -m 1 '^package:' delivery/APK-METADATA.txt
          tail -n 8 delivery/SIGNATURE-ANDROID.txt
          cat delivery/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PiiWii-Suchard-2026-v1.2.0-APK-SOURCES-SIGNATURE
          path: delivery/
          retention-days: 30
