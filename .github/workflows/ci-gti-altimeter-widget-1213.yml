name: CI GTI Altimeter Widget 1.2.13

on:
  push:
    branches: [ci-gti-altimeter-widget-1.2.13]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Reconstruct and run verified build script
        shell: bash
        run: |
          set -euo pipefail
          cat ci/gtia1213build.part.* > /tmp/gtia1213-build.sh
          echo "6bb24983f16834fe04cb6a201d7a9a963fe008e63824cd07f2666b0ddab5be48  /tmp/gtia1213-build.sh" | sha256sum -c -
          sed -i 's/UI_MIN_INTERVAL_MS = 1_000L/UI_MIN_INTERVAL_MS = 1000L/' /tmp/gtia1213-build.sh
          bash /tmp/gtia1213-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: GTI-Altimeter-Widget-1.2.13-build
          retention-days: 3
          path: |
            GTI-Altimeter-Widget-1.2.13-aligned-unsigned.apk
            GTI-Altimeter-Widget-1.2.13-badging.txt
            CI-SHA256.txt
            apksigner.jar
            zipalign
            aapt2
