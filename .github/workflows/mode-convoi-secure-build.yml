name: Mode Convoi 0.2.0 secure APK build

on:
  push:
    branches: [ mode-convoi-secure-build ]
    paths:
      - '.github/workflows/mode-convoi-secure-build.yml'

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Open encrypted build session
        id: session
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SESSION=$(openssl rand -hex 12)
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/mc-private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/mc-private.pem -pubout -out /tmp/mc-public.pem
          PUB=$(base64 -w0 /tmp/mc-public.pem)
          gh api repos/${GITHUB_REPOSITORY}/issues/40/comments -f body="MC_PUBLIC_KEY_V1:${SESSION}:${PUB}" >/dev/null
          echo "session=${SESSION}" >> "$GITHUB_OUTPUT"

      - name: Receive and decrypt source
        env:
          GH_TOKEN: ${{ github.token }}
          SESSION: ${{ steps.session.outputs.session }}
        run: |
          set -euo pipefail
          BODY=""
          for i in $(seq 1 120); do
            BODY=$(gh api --paginate repos/${GITHUB_REPOSITORY}/issues/40/comments --jq ".[] | select(.body | startswith(\"MC_PAYLOAD_V1:${SESSION}:\")) | .body" | tail -n 1 || true)
            if [ -z "$BODY" ]; then
              DONE=$(gh api --paginate repos/${GITHUB_REPOSITORY}/issues/40/comments --jq ".[] | select(.body | startswith(\"MC_CHUNK_DONE_V1:${SESSION}:\")) | .body" | tail -n 1 || true)
              if [ -n "$DONE" ]; then
                COUNT=${DONE##*:}
                JOINED=""
                for N in $(seq 1 "$COUNT"); do
                  CHUNK=$(gh api --paginate repos/${GITHUB_REPOSITORY}/issues/40/comments --jq ".[] | select(.body | startswith(\"MC_CHUNK_V1:${SESSION}:${N}:\")) | .body" | tail -n 1 || true)
                  test -n "$CHUNK"
                  PREFIX="MC_CHUNK_V1:${SESSION}:${N}:"
                  JOINED="${JOINED}${CHUNK#${PREFIX}}"
                done
                BODY="MC_PAYLOAD_V1:${SESSION}:${JOINED}"
              fi
            fi
            [ -n "$BODY" ] && break
            sleep 5
          done
          test -n "$BODY"
          REST=${BODY#MC_PAYLOAD_V1:${SESSION}:}
          KEY_B64=${REST%%:*}
          DATA_B64=${REST#*:}
          printf '%s' "$KEY_B64" | base64 -d > /tmp/mc-key.enc
          printf '%s' "$DATA_B64" | base64 -d > /tmp/mc-source.enc
          openssl pkeyutl -decrypt -inkey /tmp/mc-private.pem -in /tmp/mc-key.enc -pkeyopt rsa_padding_mode:oaep > /tmp/mc-pass.txt
          openssl enc -d -aes-256-cbc -pbkdf2 -in /tmp/mc-source.enc -out /tmp/mc-source.zip -pass file:/tmp/mc-pass.txt
          echo '279e07436ff2d9501d3a78f2b6353247d742a513b3eb0a6a14422c6deda01cc2  /tmp/mc-source.zip' | sha256sum -c -
          unzip -tq /tmp/mc-source.zip
          mkdir -p /tmp/mc-src
          unzip -q /tmp/mc-source.zip -d /tmp/mc-src

      - name: Build debug APK
        run: |
          set -euo pipefail
          SETTINGS=$(find /tmp/mc-src -maxdepth 4 -type f -name settings.gradle | head -n 1)
          test -n "$SETTINGS"
          PROJ=$(dirname "$SETTINGS")
          cd "$PROJ"
          gradle --no-daemon :app:assembleDebug --stacktrace
          APK=$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)
          test -f "$APK"
          mkdir -p /tmp/mc-out
          cp "$APK" /tmp/mc-out/ModeConvoi-0.2.0.apk
          sha256sum /tmp/mc-out/ModeConvoi-0.2.0.apk | tee /tmp/mc-out/ModeConvoi-0.2.0.apk.sha256
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs /tmp/mc-out/ModeConvoi-0.2.0.apk | tee /tmp/mc-out/signature.txt
          "$AAPT" dump badging /tmp/mc-out/ModeConvoi-0.2.0.apk | tee /tmp/mc-out/badging.txt
          grep -F "package: name='ch.piiwii.modeconvoi' versionCode='2' versionName='0.2.0'" /tmp/mc-out/badging.txt
          grep -F "sdkVersion:'26'" /tmp/mc-out/badging.txt
          grep -F "targetSdkVersion:'35'" /tmp/mc-out/badging.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModeConvoi-0.2.0-APK
          path: /tmp/mc-out/*
          if-no-files-found: error
          retention-days: 1

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          SESSION: ${{ steps.session.outputs.session }}
        run: gh api repos/${GITHUB_REPOSITORY}/issues/40/comments -f body="MC_BUILD_DONE_V1:${SESSION}" >/dev/null
