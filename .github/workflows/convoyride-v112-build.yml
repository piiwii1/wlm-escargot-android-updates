      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build release
        run: gradle -p cr112 --no-daemon assembleRelease
      - name: Align and inspect
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 cr112/app/build/outputs/apk/release/app-release-unsigned.apk ConvoyRide-V1.12.0-aligned-unsigned.apk
