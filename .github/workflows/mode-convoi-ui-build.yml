name: Build Mode Convoi 0.3.0 UI

on:
  push:
    branches: [main]
    paths: ['.github/workflows/mode-convoi-ui-build.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Mode Convoi build branch
        uses: actions/checkout@v4
        with:
          ref: mode-convoi-apk-build

      - name: Reconstruct source and apply UI refactor
        run: |
          mkdir -p mode-convoi-build/android/app/src/main/java/ch/piiwii/modeconvoi
          cat mode-convoi-build/main-parts/part-00 mode-convoi-build/main-parts/part-01 mode-convoi-build/main-parts/part-02 mode-convoi-build/main-parts/part-03 mode-convoi-build/main-parts/part-04 mode-convoi-build/main-parts/part-05 > mode-convoi-build/android/app/src/main/java/ch/piiwii/modeconvoi/MainActivity.java
          python mode-convoi-build/ui_patch.py
          python mode-convoi-build/ui_patch_fix.py
          sed -i "s/versionCode 2/versionCode 3/" mode-convoi-build/android/app/build.gradle
          sed -i "s/versionName '0.2.0'/versionName '0.3.0'/" mode-convoi-build/android/app/build.gradle
          grep -q 'private GradientDrawable roundBg' mode-convoi-build/android/app/src/main/java/ch/piiwii/modeconvoi/MainActivity.java
          grep -q 'String\[\]\[\] statuses={{"🛑 Arrêt"' mode-convoi-build/android/app/src/main/java/ch/piiwii/modeconvoi/MainActivity.java
          grep -q "versionName '0.3.0'" mode-convoi-build/android/app/build.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p mode-convoi-build/android --no-daemon assembleDebug

      - name: Verify APK
        run: |
          APK='mode-convoi-build/android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          cp "$APK" ModeConvoi-0.3.0-UI.apk
          sha256sum ModeConvoi-0.3.0-UI.apk > ModeConvoi-0.3.0-UI.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ModeConvoi-0.3.0-UI-apk
          if-no-files-found: error
          path: |
            ModeConvoi-0.3.0-UI.apk
            ModeConvoi-0.3.0-UI.apk.sha256
