name: PiiWii Sony Accueil v1.3.0 - Build APK
on:
  push:
    branches: [main]
    paths:
      - 'build-input/piiwii-sony-home-1.3.0/**'
      - '.github/workflows/piiwii_sony_home_v130.yml'
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/piiwii_sony_home_v130.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Restore sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-project
          base64 -d build-input/piiwii-sony-home-1.3.0/source.tar.gz.b64 | tar xzf - -C build-project
          test -f build-project/app/src/main/java/ch/piiwii/sony/home/HomeActivity.java
      - name: Compile Android TV 7 APK
        working-directory: build-project
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --console=plain :app:assembleDebug
      - name: Package final APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery
          cp build-project/app/build/outputs/apk/debug/app-debug.apk delivery/PiiWii-Sony-Accueil-1.3.0.apk
          cd delivery
          sha256sum PiiWii-Sony-Accueil-1.3.0.apk > SHA256.txt
          printf 'versionName=1.3.0\nversionCode=130\nminSdk=24\npackage=ch.piiwii.sony.home\n' > VERSION.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PiiWii-Sony-Accueil-1.3.0-APK
          path: delivery/
          if-no-files-found: error
      - name: Export binary for direct delivery in chat
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-output/piiwii-sony-home-1.3.0
          base64 -w0 delivery/PiiWii-Sony-Accueil-1.3.0.apk | fold -w 4000 | split -d -a 3 -l 1 - build-output/piiwii-sony-home-1.3.0/apk_
          cp delivery/SHA256.txt delivery/VERSION.txt build-output/piiwii-sony-home-1.3.0/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-output/piiwii-sony-home-1.3.0/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Deliver PiiWii Sony Accueil v1.3.0 APK'
          git push
