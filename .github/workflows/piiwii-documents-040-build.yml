name: PiiWii Documents 0.4.0 Windows Build
on:
  push:
    branches: [build/piiwii-documents-0.4.0]
    paths:
      - '.github/workflows/piiwii-documents-040-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble 0.3.0 validated source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-piiwii-documents-040/work
          cat build-piiwii-documents-030/chunks/00 build-piiwii-documents-030/chunks/01 build-piiwii-documents-030/chunks/02 build-piiwii-documents-030/chunks/03 build-piiwii-documents-030/chunks/04 build-piiwii-documents-030/chunks/05 build-piiwii-documents-030/chunks/06 > build-piiwii-documents-040/source.b64
          base64 -d build-piiwii-documents-040/source.b64 > build-piiwii-documents-040/source.zip
          set +e; unzip -t build-piiwii-documents-040/source.zip; rc=$?; set -e; if [ "$rc" -gt 1 ]; then exit "$rc"; fi
          set +e; unzip -q -o build-piiwii-documents-040/source.zip -d build-piiwii-documents-040/work; rc=$?; set -e; if [ "$rc" -gt 1 ]; then exit "$rc"; fi
          rm -rf build-piiwii-documents-040/work/src/*/bin build-piiwii-documents-040/work/src/*/obj build-piiwii-documents-040/work/src/PiiWii.Documents.Installer/payload

      - name: Apply 0.4.0 changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('build-piiwii-documents-040/work')
          def rw(path, pairs):
              p=root/path; s=p.read_text()
              for a,b in pairs:s=s.replace(a,b)
              p.write_text(s)
          rw(Path('src/PiiWii.Documents/PiiWii.Documents.csproj'),[
            ('<Version>0.3.0</Version>','<Version>0.4.0</Version>'),('<FileVersion>0.3.0.0</FileVersion>','<FileVersion>0.4.0.0</FileVersion>'),('<AssemblyVersion>0.3.0.0</AssemblyVersion>','<AssemblyVersion>0.4.0.0</AssemblyVersion>')])
          rw(Path('src/PiiWii.Documents.Installer/PiiWii.Documents.Installer.csproj'),[('PiiWii-Documents-Setup-0.3.0','PiiWii-Documents-Setup-0.4.0'),('<Version>0.3.0</Version>','<Version>0.4.0</Version>')])
          rw(Path('src/PiiWii.Documents.Installer/Program.cs'),[('0.3.0','0.4.0')])
          rw(Path('src/PiiWii.Documents/Services/BridgeService.cs'),[('version="0.2.0"','version="0.4.0"')])
          p=root/'src/PiiWii.Documents/Services/DatabaseService.cs'; s=p.read_text(); needle='    public static void SetDeleted(long id,bool deleted)'; add='    public static void Unlink(long a,long b,string type){var x=Math.Min(a,b);var y=Math.Max(a,b);using var c=new SqliteConnection(Cs);c.Open();using var tx=c.BeginTransaction();var cmd=c.CreateCommand();cmd.Transaction=tx;cmd.CommandText="DELETE FROM document_links WHERE document_id=$a AND related_document_id=$b AND relation_type=$t";cmd.Parameters.AddWithValue("$a",x);cmd.Parameters.AddWithValue("$b",y);cmd.Parameters.AddWithValue("$t",type);cmd.ExecuteNonQuery();Audit(c,tx,"Utilisateur","Association retirée",x,$"{type} avec {y}");tx.Commit();}\n'; s=s.replace(needle,add+needle); p.write_text(s)
          p=root/'src/PiiWii.Documents/Services/DocumentAnalyzer.cs'; s=p.read_text(); s=s.replace('        if(low.Contains("facture")||low.Contains("invoice")){type=type=="Document"?"Facture":type;score+=12;}','        var swissQr = low.Contains("qr-facture") || low.Contains("section paiement") || low.Contains("compte / payable à") || low.Contains("compte / payable a") || Regex.IsMatch(src,@"\\bCH\\d{2}\\s?(?:\\d{4}\\s?){4,5}\\d{1,4}\\b",RegexOptions.IgnoreCase);\n        if(swissQr){type="QR-facture suisse";score+=22;}\n        if(low.Contains("facture")||low.Contains("invoice")){if(type=="Document")type="Facture";score+=12;}'); s=s.replace('        reference = FindReference(src);','        reference = FindReference(src);\n        if(string.IsNullOrWhiteSpace(reference) && swissQr){var qrRef=Regex.Match(src,@"(?<!\\d)(\\d{27})(?!\\d)");if(qrRef.Success) reference=qrRef.Groups[1].Value;}'); s=s.replace('new[]{category,type,org,vehicle}.Where','new[]{category,type,org,vehicle,swissQr?"QR Suisse":""}.Where'); s=s.replace('var desc = $"Analyse locale automatique (confiance {conf} %)." + (conf<65?" Vérification conseillée.":"");','var desc = $"Analyse locale automatique (confiance {conf} %)." + (swissQr?" QR-facture suisse détectée.":"") + (conf<65?" Vérification conseillée.":"");'); p.write_text(s)
          p=root/'src/PiiWii.Documents/MainForm.cs'; s=p.read_text(); s=s.replace('PiiWii Documents 0.3.0','PiiWii Documents 0.4.0'); old='var top=new TableLayoutPanel{Dock=DockStyle.Fill,ColumnCount=6,Padding=new(10)};top.ColumnStyles.Add(new ColumnStyle(SizeType.Percent,100));for(int i=1;i<6;i++)top.ColumnStyles.Add(new ColumnStyle(SizeType.Absolute,125));top.Controls.Add(search,0,0);\n        top.Controls.Add(Btn("Importer",async()=>await Import()),1,0);top.Controls.Add(Btn("Importer dossier",async()=>await ImportFolder()),2,0);top.Controls.Add(Btn("Réanalyser",async()=>await Reanalyze()),3,0);top.Controls.Add(Btn("Ouvrir fichier",OpenFile),4,0);top.Controls.Add(Btn("Corbeille",ToggleDelete),5,0);'; new='var top=new TableLayoutPanel{Dock=DockStyle.Fill,ColumnCount=8,Padding=new(10)};top.ColumnStyles.Add(new ColumnStyle(SizeType.Percent,100));for(int i=1;i<8;i++)top.ColumnStyles.Add(new ColumnStyle(SizeType.Absolute,125));top.Controls.Add(search,0,0);\n        top.Controls.Add(Btn("Importer",async()=>await Import()),1,0);top.Controls.Add(Btn("Importer dossier",async()=>await ImportFolder()),2,0);top.Controls.Add(Btn("Contrôler lot",ReviewBatch),3,0);top.Controls.Add(Btn("Classer ChatGPT",ClassifyWithChatGpt),4,0);top.Controls.Add(Btn("Importer résultat IA",ImportAiResults),5,0);top.Controls.Add(Btn("Réanalyser",async()=>await Reanalyze()),6,0);top.Controls.Add(Btn("Corbeille",ToggleDelete),7,0);'; s=s.replace(old,new); marker='    void ShowBridge(){'; methods='    void ReviewBatch(){var id=!string.IsNullOrWhiteSpace(lastBatchId)?lastBatchId:(selectedId is long sid?DatabaseService.Get(sid)?.BatchId:"");if(string.IsNullOrWhiteSpace(id)){MessageBox.Show("Sélectionne un document d\'un lot ou importe d\'abord un lot.");return;}using var f=new BatchReviewForm(id);f.ShowDialog(this);RefreshList();LoadSelected();}\n    void ClassifyWithChatGpt(){var id=!string.IsNullOrWhiteSpace(lastBatchId)?lastBatchId:(selectedId is long sid?DatabaseService.Get(sid)?.BatchId:"");if(string.IsNullOrWhiteSpace(id)){MessageBox.Show("Aucun lot à préparer pour l\'assistant.");return;}try{var path=AssistantExchangeService.ExportBatch(id);Clipboard.SetText(path);MessageBox.Show($"Le lot est prêt pour ChatGPT.\\n\\nFichier : {path}\\n\\nLe paquet contient uniquement les documents de ce lot (métadonnées + OCR), pas le reste du PC.","Classer avec ChatGPT",MessageBoxButtons.OK,MessageBoxIcon.Information);Process.Start(new ProcessStartInfo(Path.GetDirectoryName(path)!){UseShellExecute=true});}catch(Exception ex){MessageBox.Show(ex.Message,"Export assistant",MessageBoxButtons.OK,MessageBoxIcon.Error);}}\n    void ImportAiResults(){using var o=new OpenFileDialog{Filter="Résultats assistant JSON|*.json|Tous les fichiers|*.*",Title="Importer le classement renvoyé par l\'assistant"};if(o.ShowDialog()!=DialogResult.OK)return;try{var r=AssistantExchangeService.ImportResults(o.FileName);MessageBox.Show($"Mises à jour appliquées : {r.updated}\\nIgnorées : {r.ignored}\\nErreurs : {r.errors.Count}","Résultats assistant",MessageBoxButtons.OK,r.errors.Count>0?MessageBoxIcon.Warning:MessageBoxIcon.Information);RefreshList();LoadSelected();}catch(Exception ex){MessageBox.Show(ex.Message,"Résultats assistant",MessageBoxButtons.OK,MessageBoxIcon.Error);}}\n'; s=s.replace(marker,methods+marker); p.write_text(s)
          (root/'src/PiiWii.Documents/Services/AssistantExchangeService.cs').write_text(r'''using System.Text.Json;
using PiiWii.Documents.Models;
namespace PiiWii.Documents.Services;
public static class AssistantExchangeService{public static string ExportBatch(string batchId){var docs=DatabaseService.GetBatch(batchId);var folder=Path.Combine(AppPaths.DataRoot,"Assistant","outbox");Directory.CreateDirectory(folder);var path=Path.Combine(folder,$"batch-{batchId}.json");var payload=new{schema="piiwii-documents-assistant-v1",appVersion="0.4.0",batchId,exportedAt=DateTime.UtcNow,instructions="Return JSON with documents array and id plus fields to update.",documents=docs.Select(d=>new{d.Id,d.Title,d.DocumentType,d.Category,d.Organization,d.Reference,d.Amount,d.Currency,d.DocumentDate,d.Status,d.Vehicle,d.Tags,d.Description,d.Confidence,d.AnalysisStatus,d.OriginalName,d.PageCount,d.OcrText,links=DatabaseService.GetLinks(d.Id).Select(x=>new{x.id,x.title,x.type,x.confidence})}).ToArray()};File.WriteAllText(path,JsonSerializer.Serialize(payload,new JsonSerializerOptions{WriteIndented=true}));DatabaseService.AuditExternal("Utilisateur","Export lot pour assistant",null,batchId);return path;}public static (int updated,int ignored,List<string> errors) ImportResults(string path){var errors=new List<string>();int updated=0,ignored=0;using var doc=JsonDocument.Parse(File.ReadAllText(path));if(!doc.RootElement.TryGetProperty("documents",out var arr)||arr.ValueKind!=JsonValueKind.Array)throw new InvalidDataException("Le fichier ne contient pas de tableau documents.");foreach(var item in arr.EnumerateArray()){try{if(!item.TryGetProperty("id",out var idEl)||!idEl.TryGetInt64(out var id)){ignored++;continue;}var d=DatabaseService.Get(id);if(d==null){ignored++;continue;}string? S(string n)=>item.TryGetProperty(n,out var e)&&e.ValueKind==JsonValueKind.String?e.GetString():null;if(S("title")is{}a)d.Title=a.Trim();if(S("documentType")is{}b)d.DocumentType=b.Trim();if(S("category")is{}c)d.Category=c.Trim();if(S("organization")is{}e)d.Organization=e.Trim();if(S("reference")is{}f)d.Reference=f.Trim();if(S("currency")is{}g)d.Currency=g.Trim();if(S("status")is{}h)d.Status=h.Trim();if(S("vehicle")is{}i)d.Vehicle=i.Trim();if(S("tags")is{}j)d.Tags=j.Trim();if(S("description")is{}k)d.Description=k.Trim();if(item.TryGetProperty("amount",out var am)&&am.ValueKind==JsonValueKind.Number&&am.TryGetDecimal(out var av))d.Amount=av;if(S("documentDate")is{}ds&&DateTime.TryParse(ds,out var dv))d.DocumentDate=dv.Date;if(item.TryGetProperty("confidence",out var cf)&&cf.TryGetInt32(out var cv))d.Confidence=Math.Clamp(cv,0,100);else d.Confidence=Math.Max(d.Confidence,85);d.AnalysisStatus="Classé par assistant";DatabaseService.Update(d,"Assistant IA","Classement importé depuis paquet assistant");updated++;}catch(Exception ex){errors.Add(ex.Message);}}return(updated,ignored,errors);}}'''.replace('\n','
'))
          (root/'src/PiiWii.Documents/BatchReviewForm.cs').write_text(r'''using PiiWii.Documents.Services;
namespace PiiWii.Documents;
public sealed class BatchReviewForm:Form{readonly string batchId;readonly DataGridView docs=new(){Dock=DockStyle.Fill,ReadOnly=true,AllowUserToAddRows=false,SelectionMode=DataGridViewSelectionMode.FullRowSelect,MultiSelect=true,AutoGenerateColumns=false};readonly DataGridView links=new(){Dock=DockStyle.Fill,ReadOnly=true,AllowUserToAddRows=false,SelectionMode=DataGridViewSelectionMode.FullRowSelect,MultiSelect=false,AutoGenerateColumns=false};readonly Label summary=new(){AutoSize=true,Padding=new Padding(8),Font=new("Segoe UI Semibold",10)};public BatchReviewForm(string id){batchId=id;Text="Contrôle du lot importé";Width=1200;Height=760;StartPosition=FormStartPosition.CenterParent;Build();Reload();}void Build(){var root=new TableLayoutPanel{Dock=DockStyle.Fill,RowCount=3};root.RowStyles.Add(new RowStyle(SizeType.Absolute,42));root.RowStyles.Add(new RowStyle(SizeType.Percent,100));root.RowStyles.Add(new RowStyle(SizeType.Absolute,58));Controls.Add(root);root.Controls.Add(summary,0,0);var split=new SplitContainer{Dock=DockStyle.Fill,SplitterDistance=760};root.Controls.Add(split,0,1);foreach(var c in new[]{("Document",240),("Type",120),("Catégorie",130),("Organisme",130),("Montant",90),("État",130)})docs.Columns.Add(new DataGridViewTextBoxColumn{HeaderText=c.Item1,Width=c.Item2});foreach(var c in new[]{("Document A",220),("Document B",220),("Relation",170),("Confiance",80)})links.Columns.Add(new DataGridViewTextBoxColumn{HeaderText=c.Item1,Width=c.Item2});split.Panel1.Controls.Add(docs);split.Panel2.Controls.Add(links);var buttons=new FlowLayoutPanel{Dock=DockStyle.Fill,Padding=new Padding(8)};root.Controls.Add(buttons,0,2);buttons.Controls.Add(B("Marquer sélection vérifiée",MarkVerified));buttons.Controls.Add(B("Retirer association",RemoveLink));buttons.Controls.Add(B("Ouvrir document",OpenSelected));buttons.Controls.Add(B("Fermer",Close));}Button B(string t,Action a){var b=new Button{Text=t,AutoSize=true,Height=34,Margin=new Padding(5)};b.Click+=(_,_)=>a();return b;}void Reload(){var list=DatabaseService.GetBatch(batchId);docs.Rows.Clear();foreach(var d in list){var i=docs.Rows.Add(d.Title,d.DocumentType,d.Category,d.Organization,d.Amount?.ToString("0.00")??"",$"{d.AnalysisStatus} {d.Confidence}%");docs.Rows[i].Tag=d.Id;if(d.AnalysisStatus.Contains("vérifier",StringComparison.OrdinalIgnoreCase)||d.Confidence<65)docs.Rows[i].DefaultCellStyle.BackColor=Color.FromArgb(255,247,220);}links.Rows.Clear();var seen=new HashSet<string>();foreach(var d in list)foreach(var l in DatabaseService.GetLinks(d.Id)){var k=$"{Math.Min(d.Id,l.id)}-{Math.Max(d.Id,l.id)}-{l.type}";if(!seen.Add(k))continue;var i=links.Rows.Add(d.Title,l.title,l.type,l.confidence+"%");links.Rows[i].Tag=(Math.Min(d.Id,l.id),Math.Max(d.Id,l.id),l.type);}summary.Text=$"Lot {batchId[..Math.Min(8,batchId.Length)]} • {list.Count} documents • {list.Count(x=>x.AnalysisStatus.Contains("vérifier",StringComparison.OrdinalIgnoreCase))} à vérifier • {links.Rows.Count} association(s)";}void MarkVerified(){foreach(DataGridViewRow r in docs.SelectedRows){if(r.Tag is not long id)continue;var d=DatabaseService.Get(id);if(d==null)continue;d.AnalysisStatus="Vérifié manuellement";d.Confidence=100;DatabaseService.Update(d,"Utilisateur","Validation rapide du lot");}Reload();}void RemoveLink(){if(links.SelectedRows.Count==0||links.SelectedRows[0].Tag is not ValueTuple<long,long,string>x)return;DatabaseService.Unlink(x.Item1,x.Item2,x.Item3);Reload();}void OpenSelected(){if(docs.SelectedRows.Count==0||docs.SelectedRows[0].Tag is not long id)return;var d=DatabaseService.Get(id);if(d!=null&&File.Exists(d.StoredPath))System.Diagnostics.Process.Start(new System.Diagnostics.ProcessStartInfo(d.StoredPath){UseShellExecute=true});}}'''.replace('\n','
'))
          (root/'README.md').write_text('# PiiWii Documents 0.4.0\n\nOCR local, lots, contrôle visuel, QR-factures suisses, recherche, pont sécurisé et échange assistant IA.\n')
          (root/'CHANGELOG.md').write_text('# Changelog\n\n## 0.4.0\n- Contrôle visuel des lots.\n- Retrait manuel des associations erronées.\n- Détection QR-factures suisses renforcée.\n- Export/import de classement ChatGPT.\n- Sources propres sans bin/obj.\n')
          PY

      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - name: Restore and publish application
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore build-piiwii-documents-040/work/src/PiiWii.Documents/PiiWii.Documents.csproj -r win-x64
          dotnet publish build-piiwii-documents-040/work/src/PiiWii.Documents/PiiWii.Documents.csproj -c Release -r win-x64 --self-contained true -o build-piiwii-documents-040/work/publish
          test -f build-piiwii-documents-040/work/publish/PiiWii.Documents.exe
      - name: Build installer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-piiwii-documents-040/work/src/PiiWii.Documents.Installer/payload
          cp build-piiwii-documents-040/work/publish/PiiWii.Documents.exe build-piiwii-documents-040/work/src/PiiWii.Documents.Installer/payload/PiiWii.Documents.exe
          dotnet restore build-piiwii-documents-040/work/src/PiiWii.Documents.Installer/PiiWii.Documents.Installer.csproj -r win-x64
          dotnet publish build-piiwii-documents-040/work/src/PiiWii.Documents.Installer/PiiWii.Documents.Installer.csproj -c Release -r win-x64 --self-contained true -o build-piiwii-documents-040/work/installer-publish
          test -f build-piiwii-documents-040/work/installer-publish/PiiWii-Documents-Setup-0.4.0.exe
      - name: Package deliverables
        shell: bash
        run: |
          set -euo pipefail
          W=build-piiwii-documents-040/work
          mkdir -p $W/dist $W/PACK-REPRISE
          cp $W/installer-publish/PiiWii-Documents-Setup-0.4.0.exe $W/dist/
          cp $W/publish/PiiWii.Documents.exe $W/dist/PiiWii-Documents-0.4.0-PORTABLE.exe
          cd $W
          zip -qr dist/PiiWii-Documents-0.4.0-SOURCES.zip src README.md CHANGELOG.md -x 'src/*/bin/*' 'src/*/obj/*' 'src/PiiWii.Documents.Installer/payload/*'
          cp README.md CHANGELOG.md PACK-REPRISE/
          cp ../../.github/workflows/piiwii-documents-040-build.yml PACK-REPRISE/
          zip -qr dist/PiiWii-Documents-0.4.0-PACK-REPRISE.zip PACK-REPRISE
          cd dist
          sha256sum PiiWii-Documents-Setup-0.4.0.exe PiiWii-Documents-0.4.0-PORTABLE.exe PiiWii-Documents-0.4.0-SOURCES.zip PiiWii-Documents-0.4.0-PACK-REPRISE.zip > PiiWii-Documents-0.4.0-SHA256SUMS.txt
          cat PiiWii-Documents-0.4.0-SHA256SUMS.txt
      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: PiiWii-Documents-0.4.0-BINARIES
          path: |
            build-piiwii-documents-040/work/dist/PiiWii-Documents-Setup-0.4.0.exe
            build-piiwii-documents-040/work/dist/PiiWii-Documents-0.4.0-PORTABLE.exe
            build-piiwii-documents-040/work/dist/PiiWii-Documents-0.4.0-SHA256SUMS.txt
      - name: Upload sources and recovery
        uses: actions/upload-artifact@v4
        with:
          name: PiiWii-Documents-0.4.0-SOURCEPACK
          path: |
            build-piiwii-documents-040/work/dist/PiiWii-Documents-0.4.0-SOURCES.zip
            build-piiwii-documents-040/work/dist/PiiWii-Documents-0.4.0-PACK-REPRISE.zip
            build-piiwii-documents-040/work/dist/PiiWii-Documents-0.4.0-SHA256SUMS.txt
