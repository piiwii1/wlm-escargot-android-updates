name: PiiWii Remote Public Build
on:
  push:
    branches: [ piiwii-remote-build ]
    paths:
      - 'piiwii-remote/**'
      - '.github/workflows/piiwii-remote-public-build.yml'
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - working-directory: piiwii-remote
        run: gradle --no-daemon :remote:assembleDebug :tvreceiver:assembleDebug
      - run: |
          mkdir -p out
          cp piiwii-remote/remote/build/outputs/apk/debug/remote-debug.apk out/PiiWii-Remote-Phone-1.0.0.apk
          cp piiwii-remote/tvreceiver/build/outputs/apk/debug/tvreceiver-debug.apk out/PiiWii-Remote-TV-1.0.0.apk
          sha256sum out/*.apk > out/SHA256-Android.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PiiWii-Remote-Android-1.0.0
          path: out/
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller
      - shell: pwsh
        run: |
          pyinstaller --onefile --windowed --name PiiWii-Remote-Agent-1.0.0 piiwii-remote/windows/PiiWiiRemoteAgent.py
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item dist/PiiWii-Remote-Agent-1.0.0.exe out/
          (Get-FileHash out/PiiWii-Remote-Agent-1.0.0.exe -Algorithm SHA256).Hash.ToLower() | Set-Content out/SHA256-Windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PiiWii-Remote-Windows-1.0.0
          path: out/
