name: PiiWii Remote beta18 LAN simple

on:
  push:
    branches: [piiwii-remote-phone-beta17-icons-restore]
    paths:
      - '.github/workflows/piiwii-remote-beta16-fastremote-build.yml'
      - 'piiwii-remote-beta18-lan-src2/**'
      - 'piiwii-remote-beta18-p03fix/**'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct beta18 and apply simple LAN mapping
        shell: bash
        run: |
          set -euo pipefail
          {
            cat piiwii-remote-beta18-lan-src2/p00.b64 piiwii-remote-beta18-lan-src2/p01.b64 piiwii-remote-beta18-lan-src2/p02.b64
            cat piiwii-remote-beta18-p03fix/fix*.b64
            cat piiwii-remote-beta18-lan-src2/p04.b64 piiwii-remote-beta18-lan-src2/p05.b64 piiwii-remote-beta18-lan-src2/p06.b64 piiwii-remote-beta18-lan-src2/p07.b64 piiwii-remote-beta18-lan-src2/p08.b64
          } | base64 -d > /tmp/beta18.tar.xz
          echo '25de2feff4a0a60badea14c5bde6e840ea8bb7cac0bd57e584d36021450fd1f5  /tmp/beta18.tar.xz' | sha256sum -c -
          xz -t /tmp/beta18.tar.xz
          mkdir -p /tmp/beta18
          tar -xJf /tmp/beta18.tar.xz -C /tmp/beta18
          RES=/tmp/beta18/remote/src/main/res/drawable-nodpi
          mkdir -p "$RES"
          for n in remote touchpad keyboard apps; do
            base64 -d "piiwii-remote-beta17-icons/ic_${n}_custom.png.b64" > "$RES/ic_${n}_custom.png"
          done
          MAIN=/tmp/beta18/remote/src/main/java/ch/piiwii/remote2/ui/MainActivity.kt
          sed -i \
            -e 's/RemoteCommand.PIIWII_TV_CHANNEL_UP/RemoteCommand.NAV_UP/g' \
            -e 's/RemoteCommand.PIIWII_TV_CHANNEL_DOWN/RemoteCommand.NAV_DOWN/g' \
            -e 's/RemoteCommand.PIIWII_TV_VOLUME_UP/RemoteCommand.VOLUME_UP/g' \
            -e 's/RemoteCommand.PIIWII_TV_VOLUME_DOWN/RemoteCommand.VOLUME_DOWN/g' \
            -e 's/RemoteCommand.PIIWII_TV_MUTE/RemoteCommand.VOLUME_MUTE/g' \
            "$MAIN"
          grep -q 'versionCode = 48' /tmp/beta18/remote/build.gradle.kts
          grep -q 'versionName = "2.0.0-beta18"' /tmp/beta18/remote/build.gradle.kts
          grep -q '"channel_up" -> RemoteCommand.NAV_UP' "$MAIN"
          grep -q '"channel_down" -> RemoteCommand.NAV_DOWN' "$MAIN"
          grep -q '"volume_up" -> RemoteCommand.VOLUME_UP' "$MAIN"
          grep -q '"volume_down" -> RemoteCommand.VOLUME_DOWN' "$MAIN"
          grep -q '"mute" -> RemoteCommand.VOLUME_MUTE' "$MAIN"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android 35 packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        working-directory: /tmp/beta18
        run: gradle --no-daemon :remote:testDebugUnitTest :remote:assembleRelease

      - name: Validate and package
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/out; mkdir -p "$OUT"
          RAW=/tmp/beta18/remote/build/outputs/apk/release/remote-release-unsigned.apk
          APK="$OUT/PiiWii-Remote-Phone-2.0.0-beta18-LAN-ALIGNED-UNSIGNED.apk"
          test -s "$RAW"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$RAW" "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK" > "$OUT/ZIPALIGN.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > "$OUT/BADGING.txt"
          grep -q "package: name='ch.piiwii.remote2' versionCode='48' versionName='2.0.0-beta18'" "$OUT/BADGING.txt"
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" "$OUT/apksigner.jar"
          sha256sum "$APK" > "$OUT/SHA256-UNSIGNED.txt"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: PiiWii-Remote-beta18-LAN-simple
          path: /tmp/out/*
          retention-days: 7
          if-no-files-found: error
