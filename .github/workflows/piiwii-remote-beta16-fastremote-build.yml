name: PiiWii Remote beta18 LAN fast path

on:
  push:
    branches: [piiwii-remote-phone-beta17-icons-restore]
    paths:
      - '.github/workflows/piiwii-remote-beta16-fastremote-build.yml'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover intact historical beta15 source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, subprocess, zipfile
          folder=Path('piiwii-remote-beta15-temp')
          names=[f'rb15c.{i:02d}.b64' for i in range(8)]
          target='7427ac4f4e6a95f6bfb9660fd6c4ea117c4fe24d4aa30370aa0b6cb9649c90ed'
          def show(commit,name):
              try:
                  return subprocess.check_output(['git','show',f'{commit}:{folder/name}'],text=True).strip()
              except subprocess.CalledProcessError:
                  return None
          commits=subprocess.check_output(['git','log','--all','--format=%H','--',str(folder)],text=True).split()
          print('candidate commits',len(commits))
          for commit in commits:
              parts=[]
              ok=True
              for name in names:
                  x=show(commit,name)
                  if x is None:
                      ok=False; break
                  parts.append(''.join(x.split()))
              if not ok: continue
              text=''.join(parts)
              try: raw=base64.b64decode(text,validate=True)
              except Exception: continue
              if hashlib.sha256(raw).hexdigest()==target and zipfile.is_zipfile(__import__('io').BytesIO(raw)):
                  Path('/tmp/remote-base.zip').write_bytes(raw)
                  print('recovered exact source from',commit)
                  break
          else:
              raise SystemExit('No intact historical beta15 source archive found')
          PY
          rm -rf /tmp/remote-beta18-src && mkdir -p /tmp/remote-beta18-src
          unzip -q /tmp/remote-base.zip -d /tmp/remote-beta18-src
          ROOT=/tmp/remote-beta18-src/remote_ci_text
          test -f "$ROOT/remote/build.gradle.kts"
          echo "$ROOT" > /tmp/remote-root.txt
          find "$ROOT" -maxdepth 3 -type d | sort | head -80

      - name: Apply beta18 LAN fast path
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(cat /tmp/remote-root.txt)"
          sed -i 's/versionCode = 45/versionCode = 48/' "$ROOT/remote/build.gradle.kts"
          sed -i 's/versionName = "2.0.0-beta15"/versionName = "2.0.0-beta18"/' "$ROOT/remote/build.gradle.kts"
          python3 - <<'PY'
          from pathlib import Path
          root=Path(open('/tmp/remote-root.txt').read().strip())
          # New local UDP commands
          p=root/'remote/src/main/java/ch/piiwii/remote2/protocol/RemoteCommand.kt'
          s=p.read_text()
          s=s.replace('VOLUME_UP, VOLUME_DOWN, VOLUME_MUTE,','VOLUME_UP, VOLUME_DOWN, VOLUME_MUTE,\n    PIIWII_TV_CHANNEL_UP, PIIWII_TV_CHANNEL_DOWN, PIIWII_TV_VOLUME_UP, PIIWII_TV_VOLUME_DOWN, PIIWII_TV_MUTE,')
          p.write_text(s)
          # Allow on Windows transport
          p=root/'remote/src/main/java/ch/piiwii/remote2/ui/MainViewModel.kt'
          s=p.read_text()
          marker='RemoteCommand.VOLUME_DOWN, RemoteCommand.VOLUME_MUTE, RemoteCommand.POINTER_MOVE'
          repl='RemoteCommand.VOLUME_DOWN, RemoteCommand.VOLUME_MUTE, RemoteCommand.PIIWII_TV_CHANNEL_UP, RemoteCommand.PIIWII_TV_CHANNEL_DOWN,\n            RemoteCommand.PIIWII_TV_VOLUME_UP, RemoteCommand.PIIWII_TV_VOLUME_DOWN, RemoteCommand.PIIWII_TV_MUTE, RemoteCommand.POINTER_MOVE'
          if marker not in s: raise SystemExit('Windows allowlist marker missing')
          p.write_text(s.replace(marker,repl,1))
          # Route CH/VOL/MUTE through selected Windows PC over local UDP; HTTP remains fallback.
          p=root/'remote/src/main/java/ch/piiwii/remote2/ui/MainActivity.kt'
          s=p.read_text()
          old='''        if (action == "power") {\n            val selected = vm.selected.value\n            if (selected?.type == DeviceType.WINDOWS_PC) {\n                vm.sendCommand(RemoteCommand.APP_CUSTOM, "URL\\n${piiwiiTvClient.pageUrl(true)}")\n            }\n        }\n        piiwiiTvClient.send(action) { ok, message ->\n'''
          new='''        val selected = vm.selected.value\n        if (selected?.type == DeviceType.WINDOWS_PC) {\n            val fastCommand = when (action) {\n                "channel_up" -> RemoteCommand.PIIWII_TV_CHANNEL_UP\n                "channel_down" -> RemoteCommand.PIIWII_TV_CHANNEL_DOWN\n                "volume_up" -> RemoteCommand.PIIWII_TV_VOLUME_UP\n                "volume_down" -> RemoteCommand.PIIWII_TV_VOLUME_DOWN\n                "mute" -> RemoteCommand.PIIWII_TV_MUTE\n                else -> null\n            }\n            if (fastCommand != null) {\n                vm.sendCommand(fastCommand)\n                return\n            }\n            if (action == "power") {\n                vm.sendCommand(RemoteCommand.APP_CUSTOM, "URL\\n${piiwiiTvClient.pageUrl(true)}")\n            }\n        }\n        piiwiiTvClient.send(action) { ok, message ->\n'''
          if old not in s: raise SystemExit('PiiWii TV action block missing')
          p.write_text(s.replace(old,new,1))
          PY
          grep -q 'versionCode = 48' "$ROOT/remote/build.gradle.kts"
          grep -q 'PIIWII_TV_CHANNEL_UP' "$ROOT/remote/src/main/java/ch/piiwii/remote2/ui/MainActivity.kt"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Gradle 8.9
        shell: bash
        run: |
          curl -fL --retry 5 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(cat /tmp/remote-root.txt)"
          cd "$ROOT"
          /tmp/gradle-8.9/bin/gradle --no-daemon :remote:testDebugUnitTest :remote:assembleRelease

      - name: Package APK
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(cat /tmp/remote-root.txt)"
          OUT=/tmp/delivery; mkdir -p "$OUT"
          RAW="$ROOT/remote/build/outputs/apk/release/remote-release-unsigned.apk"
          APK="$OUT/PiiWii-Remote-Phone-2.0.0-beta18-LAN-ALIGNED-UNSIGNED.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$RAW" "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > "$OUT/BADGING.txt"
          grep -q "package: name='ch.piiwii.remote2' versionCode='48' versionName='2.0.0-beta18'" "$OUT/BADGING.txt"
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" "$OUT/apksigner.jar"
          sha256sum "$APK" > "$OUT/SHA256-UNSIGNED.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: PiiWii-Remote-beta18-LAN-fastpath
          path: /tmp/delivery/*
          retention-days: 7
