name: PiiWii Remote Android 35 signing tool

on:
  push:
    branches: [piiwii-remote-phone-beta17-icons-restore]
    paths:
      - '.github/workflows/piiwii-remote-beta16-fastremote-build.yml'
  workflow_dispatch:

jobs:
  export-apksigner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android Build Tools 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "build-tools;35.0.0"
          mkdir -p /tmp/apksigner-tool
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" /tmp/apksigner-tool/apksigner.jar
          sha256sum /tmp/apksigner-tool/apksigner.jar > /tmp/apksigner-tool/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-35-apksigner
          path: /tmp/apksigner-tool/*
          retention-days: 1
