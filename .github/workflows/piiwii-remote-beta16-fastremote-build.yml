name: PiiWii Remote beta17 restore original navigation icons

on:
  push:
    branches: [piiwii-remote-phone-beta17-icons-restore]
    paths:
      - '.github/workflows/piiwii-remote-beta16-fastremote-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout current correction assets
        uses: actions/checkout@v4
        with:
          path: current

      - name: Checkout historical beta15 source snapshot
        uses: actions/checkout@v4
        with:
          ref: 4f2389b48f741f501180f917b53358406141dc15
          path: base

      - name: Reconstruct beta15 source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          parts=sorted(Path('base/piiwii-remote-beta15-temp').glob('rb15c.*.b64'))
          print('parts:', [p.name for p in parts])
          if not parts: raise SystemExit('missing historical beta15 chunks')
          text=''.join(''.join(p.read_text().split()) for p in parts)
          text += '='*((4-len(text)%4)%4)
          raw=base64.b64decode(text, validate=True)
          Path('/tmp/remote-beta15.zip').write_bytes(raw)
          print('zip bytes', len(raw))
          PY
          echo '7427ac4f4e6a95f6bfb9660fd6c4ea117c4fe24d4aa30370aa0b6cb9649c90ed  /tmp/remote-beta15.zip' | sha256sum -c -
          rm -rf /tmp/remote-beta17-src && mkdir -p /tmp/remote-beta17-src
          unzip -q /tmp/remote-beta15.zip -d /tmp/remote-beta17-src
          ROOT=/tmp/remote-beta17-src/remote_ci_text
          test -f "$ROOT/remote/build.gradle.kts"
          grep -q 'versionCode = 45' "$ROOT/remote/build.gradle.kts"
          grep -q 'versionName = "2.0.0-beta15"' "$ROOT/remote/build.gradle.kts"

      - name: Restore original bottom icons and bump beta17
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/remote-beta17-src/remote_ci_text
          DRAW="$ROOT/remote/src/main/res/drawable-nodpi"
          base64 -d current/piiwii-remote-beta17-icons/ic_remote_custom.png.b64 > "$DRAW/ic_remote_custom.png"
          base64 -d current/piiwii-remote-beta17-icons/ic_touchpad_custom.png.b64 > "$DRAW/ic_touchpad_custom.png"
          base64 -d current/piiwii-remote-beta17-icons/ic_keyboard_custom.png.b64 > "$DRAW/ic_keyboard_custom.png"
          base64 -d current/piiwii-remote-beta17-icons/ic_apps_custom.png.b64 > "$DRAW/ic_apps_custom.png"
          sed -i 's/versionCode = 45/versionCode = 47/' "$ROOT/remote/build.gradle.kts"
          sed -i 's/versionName = "2.0.0-beta15"/versionName = "2.0.0-beta17"/' "$ROOT/remote/build.gradle.kts"
          python3 - <<'PY'
          from pathlib import Path
          import struct
          root=Path('/tmp/remote-beta17-src/remote_ci_text/remote/src/main/res/drawable-nodpi')
          for n in ['ic_remote_custom.png','ic_touchpad_custom.png','ic_keyboard_custom.png','ic_apps_custom.png']:
              d=(root/n).read_bytes(); w,h=struct.unpack('>II',d[16:24]); assert (w,h)==(48,48),(n,w,h)
          PY
          grep -q 'R.drawable.ic_piiwii_tv_custom' "$ROOT/remote/src/main/java/ch/piiwii/remote2/ui/MainShellView.kt"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Gradle 8.9
        shell: bash
        run: |
          curl -fL --retry 5 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Test and build
        working-directory: /tmp/remote-beta17-src/remote_ci_text
        run: /tmp/gradle-8.9/bin/gradle --no-daemon :remote:testDebugUnitTest :remote:assembleRelease

      - name: Validate and package
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/remote-beta17-src/remote_ci_text
          OUT=/tmp/delivery; mkdir -p "$OUT"
          RAW="$ROOT/remote/build/outputs/apk/release/remote-release-unsigned.apk"
          APK="$OUT/PiiWii-Remote-Phone-2.0.0-beta17-ALIGNED-UNSIGNED.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$RAW" "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK" > "$OUT/ZIPALIGN.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > "$OUT/BADGING.txt"
          grep -q "package: name='ch.piiwii.remote2' versionCode='47' versionName='2.0.0-beta17'" "$OUT/BADGING.txt"
          unzip -t "$APK" > "$OUT/ZIPTEST.txt"
          sha256sum "$APK" > "$OUT/SHA256-UNSIGNED.txt"
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" "$OUT/apksigner.jar"
          (cd "$ROOT" && zip -qr "$OUT/PiiWii-Remote-2.0.0-beta17-SOURCES.zip" .)
          sha256sum "$OUT/PiiWii-Remote-2.0.0-beta17-SOURCES.zip" > "$OUT/SHA256-SOURCES.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: PiiWii-Remote-beta17-icons-restored-unsigned
          path: /tmp/delivery/*
          retention-days: 7
