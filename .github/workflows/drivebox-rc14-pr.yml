name: Build DriveBox RC14 APK (PR)

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/drivebox-rc14-pr.yml'
      - '.github/workflows/drivebox-rc14-quick-tools.yml'
      - 'drivebox-ci/rc14-trigger.txt'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare fixed RC14 source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/drivebox-rc14-quick-tools.yml').read_text()
          def extract(step_name, out):
              marker = '      - name: ' + step_name + '\n'
              start = text.index(marker)
              run_start = text.index('        run: |\n', start) + len('        run: |\n')
              end = text.find('\n      - ', run_start)
              if end < 0: end = len(text)
              block = text[run_start:end]
              lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
              Path(out).write_text('\n'.join(lines) + '\n')
          extract('Reconstruct verified RC13 source', '/tmp/reconstruct.sh')
          extract('Apply RC14 quick tools favorites', '/tmp/rc14.sh')

          p = Path('/tmp/rc14.sh')
          script = p.read_text()
          old = '''home_marker = 'Runnable renderDefault = () -> {\\n              results.removeAllViews();'\nif home_marker not in s:\n    raise RuntimeError('Home renderDefault marker not found')\ns = s.replace(home_marker, home_marker + '\\n              renderQuickTools(results);', 1)'''
          new = '''home_start = s.index('Runnable renderDefault = () -> {')\nremove_end = s.index('results.removeAllViews();', home_start) + len('results.removeAllViews();')\ns = s[:remove_end] + '\\n              renderQuickTools(results);' + s[remove_end:]'''
          if old not in script:
              raise RuntimeError('RC14 patch block to fix was not found')
          p.write_text(script.replace(old, new, 1))
          PY
          bash /tmp/reconstruct.sh
          bash /tmp/rc14.sh

          python3 - <<'PY'
          from pathlib import Path
          java = Path('/tmp/drivebox-src/app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java')
          s = java.read_text()

          def replace_method(src, signature_start, new_method):
              a = src.index(signature_start)
              brace = src.index('{', a)
              depth = 0
              i = brace
              while i < len(src):
                  if src[i] == '{': depth += 1
                  elif src[i] == '}':
                      depth -= 1
                      if depth == 0:
                          return src[:a] + new_method + src[i+1:]
                  i += 1
              raise RuntimeError('Unbalanced method: ' + signature_start)

          detail = r'''private void countryDetail(String flag, String country, int signColor, String signColorName,
                                     String city, String rural, String expressway, String motorway,
                                     String motorwayBadge, String toll, String[] equipment,
                                     String winter, String emergency) {
              LinearLayout root = page(flag, country, "Fiche route rapide • voiture particulière", this::countriesScreen);
              root.addView(countrySignCard(signColorName, signColor));

              root.addView(sectionTitle("LIMITATIONS"), lp(-1, -2, 0, 18, 0, 8));
              LinearLayout speeds1 = row(Gravity.CENTER);
              speeds1.addView(speedCard(city, "Ville"), new LinearLayout.LayoutParams(0, dp(132), 1));
              speeds1.addView(speedCard(rural, "Hors agglo"), new LinearLayout.LayoutParams(0, dp(132), 1));
              root.addView(speeds1);
              LinearLayout speeds2 = row(Gravity.CENTER);
              speeds2.addView(speedCard(expressway, "Voie rapide"), new LinearLayout.LayoutParams(0, dp(132), 1));
              speeds2.addView(speedCard(motorway, "Autoroute"), new LinearLayout.LayoutParams(0, dp(132), 1));
              root.addView(speeds2, lp(-1, -2, 0, 8, 0, 0));
              if ("Allemagne".equals(country)) {
                  root.addView(infoStrip("i", "Sur Autobahn sans limitation affichée, 130 km/h est la vitesse recommandée, pas une limitation générale.", BLUE));
              }

              root.addView(sectionTitle("AUTOROUTE / PÉAGE"), lp(-1, -2, 0, 18, 0, 8));
              root.addView(infoStrip("🛣", toll, BLUE));
              if ("Suisse".equals(country)) {
                  root.addView(infoStrip("✓", "E-vignette officielle : CHF 40 • liée à la plaque.", GREEN), lp(-1, -2, 0, 8, 0, 0));
                  root.addView(officialWebButton("Acheter l’e-vignette officielle", "https://www.e-vignette.ch/"), lp(-1, dp(48), 0, 8, 0, 0));
              } else if ("Autriche".equals(country)) {
                  root.addView(infoStrip("✓", "Vignette numérique officielle disponible en ligne.", GREEN), lp(-1, -2, 0, 8, 0, 0));
                  root.addView(infoStrip("!", "Les règles de validité immédiate varient selon la durée choisie : vérifiez la date affichée avant l’achat.", ORANGE), lp(-1, -2, 0, 8, 0, 0));
                  root.addView(officialWebButton("Acheter la vignette ASFINAG", "https://shop.asfinag.at/fr/produits/vignette-numerique/"), lp(-1, dp(48), 0, 8, 0, 0));
              }

              root.addView(sectionTitle("ÉQUIPEMENT / OBLIGATIONS"), lp(-1, -2, 0, 18, 0, 8));
              for (String item : equipment) {
                  String[] p = item.split("\\|", 3);
                  if (p.length == 3) root.addView(equipmentRow(p[0], p[1], p[2]));
              }

              root.addView(sectionTitle("HIVER"), lp(-1, -2, 0, 18, 0, 8));
              root.addView(infoStrip("❄", winter, ORANGE));
              root.addView(sectionTitle("URGENCE"), lp(-1, -2, 0, 18, 0, 8));
              root.addView(infoStrip("☎", emergency, RED));
              root.addView(infoStrip("!", "Résumé pratique, pas un texte juridique. Vérifiez les règles officielles et la signalisation locale avant un voyage.", MUTED), lp(-1, -2, 0, 14, 0, 0));
              setScrollablePage(root);
          }'''
          s = replace_method(s, 'private void countryDetail(', detail)
          java.write_text(s)
          PY

          grep -q "DriveBox 1.0.0 RC14" /tmp/drivebox-src/app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java
          grep -q 'renderQuickTools(results)' /tmp/drivebox-src/app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java
          grep -q 'String city, String rural, String expressway, String motorway' /tmp/drivebox-src/app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java
          grep -q "versionCode 23" /tmp/drivebox-src/app/build.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build RC14
        working-directory: /tmp/drivebox-src
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Verify and package RC14
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/drivebox-src/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/cert.txt
          grep -qi '6699b2b6b15b5e09032b4f54c5c26bbd982a41dc48d5a5093d1501036a474a1e' /tmp/cert.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='ch.clubvwsuisse.drivebox.v1'" /tmp/badging.txt
          grep -q "versionCode='23'" /tmp/badging.txt
          grep -q "versionName='1.0.0-rc14'" /tmp/badging.txt
          grep -q "application-label:'DriveBox'" /tmp/badging.txt
          unzip -t "$APK"
          unzip -l "$APK" | grep -q 'resources.arsc'
          unzip -l "$APK" | grep -q 'classes.dex'
          for f in ch fr de it at; do unzip -l "$APK" | grep -q "res/drawable-nodpi-v4/motorway_${f}.png"; done
          unzip -p "$APK" res/mipmap-xxxhdpi-v4/ic_launcher.webp > /tmp/icon.webp
          test "$(sha256sum /tmp/icon.webp | awk '{print $1}')" = 'ab5bbd86c44f537aae43e60584c39c923cee3e7c855ae887332617158c0e8a05'
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | grep -q 'android.permission.INTERNET'; then echo 'Unexpected INTERNET permission'; exit 1; fi
          cp "$APK" "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC14.apk"
          rm -rf /tmp/drivebox-src/app/build /tmp/drivebox-src/.gradle
          (cd /tmp/drivebox-src && zip -qr "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC14-source.zip" .)
          sha256sum "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC14.apk" > "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC14.apk.sha256.txt"
          sha256sum "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC14-source.zip" > "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC14-source.zip.sha256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: DriveBox-1.0.0-RC14-QUICK-TOOLS
          path: |
            DriveBox-1.0.0-RC14.apk
            DriveBox-1.0.0-RC14.apk.sha256.txt
            DriveBox-1.0.0-RC14-source.zip
            DriveBox-1.0.0-RC14-source.zip.sha256.txt
          if-no-files-found: error
          retention-days: 7
