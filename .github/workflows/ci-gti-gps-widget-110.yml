name: CI GTI GPS Widget 1.2.0

on:
  push:
    branches: [ci-gti-gps-widget-1.1.0]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact 1.2.0 source
        shell: bash
        run: |
          set -euo pipefail
          cat ci-gtigps-1.2/source-part-* | base64 -d > /tmp/GTI-GPS-Widget-1.2.0-SOURCES.zip
          echo '5c8ced230e1f8cab717cca1b5b1d823d4de91e24c3332af95bdd99db5845a444  /tmp/GTI-GPS-Widget-1.2.0-SOURCES.zip' | sha256sum -c -
          mkdir -p /tmp/src
          unzip -q /tmp/GTI-GPS-Widget-1.2.0-SOURCES.zip -d /tmp/src
          test -f /tmp/src/gtigps_120/app/build.gradle
          grep -q "applicationId 'ch.piiwii.gtigps'" /tmp/src/gtigps_120/app/build.gradle
          grep -q "versionCode 4" /tmp/src/gtigps_120/app/build.gradle
          grep -q "versionName '1.2.0'" /tmp/src/gtigps_120/app/build.gradle
          grep -q "org.maplibre.gl:android-sdk-opengl:13.4.1" /tmp/src/gtigps_120/app/build.gradle
          grep -q "GpsTrackingService" /tmp/src/gtigps_120/app/src/main/AndroidManifest.xml
          grep -q "NavigationEngine" /tmp/src/gtigps_120/app/src/main/java/ch/piiwii/gtigps/MainActivity.java
          grep -q "requestRoute" /tmp/src/gtigps_120/app/src/main/java/ch/piiwii/gtigps/NavigationEngine.java

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle -p /tmp/src/gtigps_120 --no-daemon --stacktrace clean assembleRelease

      - name: Zipalign release APK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 \
            /tmp/src/gtigps_120/app/build/outputs/apk/release/app-release-unsigned.apk \
            GTI-GPS-Widget-1.2.0-aligned-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -p 4 GTI-GPS-Widget-1.2.0-aligned-unsigned.apk
          sha256sum GTI-GPS-Widget-1.2.0-aligned-unsigned.apk > GTI-GPS-Widget-1.2.0-aligned-unsigned.apk.sha256

      - name: Export apksigner
        shell: bash
        run: |
          set -euo pipefail
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" apksigner.jar
          sha256sum apksigner.jar > apksigner.jar.sha256

      - name: Upload build bundle
        uses: actions/upload-artifact@v4
        with:
          name: GTI-GPS-Widget-1.2.0-build
          if-no-files-found: error
          retention-days: 3
          path: |
            GTI-GPS-Widget-1.2.0-aligned-unsigned.apk
            GTI-GPS-Widget-1.2.0-aligned-unsigned.apk.sha256
            apksigner.jar
            apksigner.jar.sha256
