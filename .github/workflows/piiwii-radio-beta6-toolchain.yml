name: Prepare PiiWii Radio beta6 local toolchain

on:
  push:
    branches:
      - chatgpt/piiwii-radio-100-beta6-build
    paths:
      - '.github/workflows/piiwii-radio-beta6-toolchain.yml'
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Warm Gradle cache with beta5
        shell: bash
        run: |
          set -euo pipefail
          cat piiwii-radio-100-beta5-build/src-parts/part-*.b64 > /tmp/beta5.zip.b64
          base64 -d /tmp/beta5.zip.b64 > /tmp/beta5.zip
          rm -rf /tmp/beta5 && mkdir -p /tmp/beta5
          unzip -q /tmp/beta5.zip -d /tmp/beta5
          cd /tmp/beta5/PiiWiiRadio
          gradle --no-daemon :app:assembleRelease

      - name: Pack local offline toolchain
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_BIN="$(readlink -f "$(command -v gradle)")"
          GRADLE_HOME="$(cd "$(dirname "$GRADLE_BIN")/.." && pwd)"
          mkdir -p /tmp/piiwii-toolchain/sdk/platforms /tmp/piiwii-toolchain/sdk/build-tools /tmp/piiwii-toolchain/gradle
          cp -a "$ANDROID_HOME/platforms/android-35" /tmp/piiwii-toolchain/sdk/platforms/
          cp -a "$ANDROID_HOME/build-tools/35.0.0" /tmp/piiwii-toolchain/sdk/build-tools/
          cp -a "$GRADLE_HOME" /tmp/piiwii-toolchain/gradle/gradle-8.9
          cp -a "$HOME/.gradle/caches" /tmp/piiwii-toolchain/gradle/caches
          tar -C /tmp -czf PiiWii-Radio-beta6-local-toolchain.tar.gz piiwii-toolchain
          ls -lh PiiWii-Radio-beta6-local-toolchain.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: PiiWii-Radio-beta6-local-toolchain
          path: PiiWii-Radio-beta6-local-toolchain.tar.gz
          retention-days: 2
          if-no-files-found: error
