name: PiiWii Remote beta15 temporary build

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/piiwii-remote-beta15-temp-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download intact beta15 source archive
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 'https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-444c-820a-906f-971e61ba82dd/raw?se=2026-09-21T23%3A54%3A59Z&sp=r&sv=2026-02-06&sr=b&scid=31edd7f5-5708-561c-8d14-cea81c5bb201&skoid=b5d2651b-fef3-4bb0-a03b-ca59cc22929b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-21T23%3A16%3A02Z&ske=2026-09-22T23%3A16%3A02Z&sks=b&skv=2026-02-06&sig=uSDQs2Ext4%2BfsI/TheddDWKpXQPCFOITBA1soNYMYmY%3D' -o /tmp/remote-beta15.zip
          test -s /tmp/remote-beta15.zip
          test "$(wc -c < /tmp/remote-beta15.zip)" -eq 64688
          echo '7427ac4f4e6a95f6bfb9660fd6c4ea117c4fe24d4aa30370aa0b6cb9649c90ed  /tmp/remote-beta15.zip' | sha256sum -c -

      - name: Reconstruct sources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/remote-beta15-src
          mkdir -p /tmp/remote-beta15-src
          unzip -q /tmp/remote-beta15.zip -d /tmp/remote-beta15-src
          test -f /tmp/remote-beta15-src/remote_ci_text/remote/build.gradle.kts
          grep -q 'versionCode = 45' /tmp/remote-beta15-src/remote_ci_text/remote/build.gradle.kts
          grep -q 'versionName = "2.0.0-beta15"' /tmp/remote-beta15-src/remote_ci_text/remote/build.gradle.kts

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android 35 SDK pieces
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -111 | head -n1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"

      - name: Prepare Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 2 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          rm -rf /tmp/gradle-8.9
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.9/bin/gradle --version

      - name: Build release APK
        working-directory: /tmp/remote-beta15-src/remote_ci_text
        run: /tmp/gradle-8.9/bin/gradle --no-daemon --stacktrace :remote:assembleRelease

      - name: Prepare delivery
        shell: bash
        run: |
          set -euo pipefail
          APK='/tmp/remote-beta15-src/remote_ci_text/remote/build/outputs/apk/release/remote-release-unsigned.apk'
          test -s "$APK"
          mkdir -p /tmp/delivery
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$APK" /tmp/delivery/PiiWii-Remote-Phone-2.0.0-beta15-ALIGNED-UNSIGNED.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 /tmp/delivery/PiiWii-Remote-Phone-2.0.0-beta15-ALIGNED-UNSIGNED.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging /tmp/delivery/PiiWii-Remote-Phone-2.0.0-beta15-ALIGNED-UNSIGNED.apk > /tmp/delivery/aapt-badging.txt
          sha256sum /tmp/delivery/PiiWii-Remote-Phone-2.0.0-beta15-ALIGNED-UNSIGNED.apk > /tmp/delivery/unsigned-sha256.txt
          unzip -t /tmp/delivery/PiiWii-Remote-Phone-2.0.0-beta15-ALIGNED-UNSIGNED.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PiiWii-Remote-beta15-unsigned
          path: /tmp/delivery/*
          retention-days: 1
          if-no-files-found: error
