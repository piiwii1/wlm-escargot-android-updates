name: Build DriveBox RC42 Parking History

on:
  push:
    branches: [ drivebox-rc42-parking-history ]
    paths:
      - '.github/workflows/drivebox-rc42-history.yml'
      - 'drivebox-ci/rc42.part*.b64'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore validated RC41 source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9641725450/zip" -o /tmp/rc41-artifact.zip
          rm -rf /tmp/rc41-artifact /tmp/drivebox-src
          mkdir -p /tmp/rc41-artifact /tmp/drivebox-src
          unzip -oq /tmp/rc41-artifact.zip -d /tmp/rc41-artifact
          test "$(sha256sum /tmp/rc41-artifact/DriveBox-1.0.0-RC41-source.zip | awk '{print $1}')" = '1b499f1f9f9dd2082923778a3e28b0f2c0242f4ba42f224470b411a6eaf04d28'
          unzip -oq /tmp/rc41-artifact/DriveBox-1.0.0-RC41-source.zip -d /tmp/drivebox-src
          grep -q 'versionCode 50' /tmp/drivebox-src/app/build.gradle
          grep -q "versionName '1.0.0-rc41'" /tmp/drivebox-src/app/build.gradle

      - name: Verify and apply RC42 history patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum drivebox-ci/rc42.part00.b64 | awk '{print $1}')" = 'cb02fda3e66d4a1e250d1b94df7a496dfcbdf2ba487dc28da3be7f36aa2758e1'
          test "$(sha256sum drivebox-ci/rc42.part01.b64 | awk '{print $1}')" = '4cc317d5c492e4cabf34c2344c207a75b84454ff6c918297bbf92b0403a9921d'
          test "$(sha256sum drivebox-ci/rc42.part02.b64 | awk '{print $1}')" = '2829883da4e3d1af6c02c5167da38f00681df5ad969ed794dfdca4ed91774096'
          cat drivebox-ci/rc42.part*.b64 | base64 -d > /tmp/rc42.patch.gz
          test "$(sha256sum /tmp/rc42.patch.gz | awk '{print $1}')" = 'b9e0e45c8dd7d9a32bb66fce5d0d57c063c63f9857bc16aad50d0f61e3c1b578'
          gzip -d -c /tmp/rc42.patch.gz > /tmp/rc42.patch
          test "$(sha256sum /tmp/rc42.patch | awk '{print $1}')" = 'b24c3cb5647ac0341b0d4f98a59c8b857f37f9ca7dd55d0745e75ae400e43d43'
          cd /tmp/drivebox-src
          patch -p1 < /tmp/rc42.patch

          grep -q 'versionCode 51' app/build.gradle
          grep -q "versionName '1.0.0-rc42'" app/build.gradle
          test -f app/src/main/java/ch/clubvwsuisse/drivebox/ParkingHistoryStore.java
          grep -q 'MAX_ROWS = 200' app/src/main/java/ch/clubvwsuisse/drivebox/ParkingHistoryStore.java
          grep -q 'snapshotActive()' app/src/main/java/ch/clubvwsuisse/drivebox/ParkingSessionStore.java
          grep -q 'Historique des arrêts' app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java
          grep -q 'parkingHistoryStore.record(snapshot, finishedAt)' app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java
          test "$(grep -R -h '@Test' app/src/test/java | wc -l)" -ge 8
          test -f CONTINUITE-RC42.md
          if grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml; then echo 'Unexpected INTERNET permission'; exit 1; fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests and compile RC42
        working-directory: /tmp/drivebox-src
        run: gradle --no-daemon clean :app:testDebugUnitTest :app:assembleDebug

      - name: Verify and package RC42
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/drivebox-src/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/cert.txt
          grep -qi '6699b2b6b15b5e09032b4f54c5c26bbd982a41dc48d5a5093d1501036a474a1e' /tmp/cert.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='ch.clubvwsuisse.drivebox.v1'" /tmp/badging.txt
          grep -q "versionCode='51'" /tmp/badging.txt
          grep -q "versionName='1.0.0-rc42'" /tmp/badging.txt
          grep -q "application-label:'DriveBox'" /tmp/badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | tee /tmp/perms.txt
          grep -q 'android.permission.CAMERA' /tmp/perms.txt
          grep -q 'android.permission.ACCESS_FINE_LOCATION' /tmp/perms.txt
          grep -q 'android.permission.POST_NOTIFICATIONS' /tmp/perms.txt
          if grep -q 'android.permission.INTERNET' /tmp/perms.txt; then exit 1; fi
          unzip -t "$APK"
          unzip -p "$APK" res/mipmap-xxxhdpi-v4/ic_launcher.webp > /tmp/icon.webp
          test "$(sha256sum /tmp/icon.webp | awk '{print $1}')" = 'ab5bbd86c44f537aae43e60584c39c923cee3e7c855ae887332617158c0e8a05'
          cp "$APK" "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC42.apk"
          rm -rf /tmp/drivebox-src/app/build /tmp/drivebox-src/.gradle
          (cd /tmp/drivebox-src && zip -qr "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC42-source.zip" .)
          sha256sum "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC42.apk" > "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC42.apk.sha256.txt"
          sha256sum "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC42-source.zip" > "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC42-source.zip.sha256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: DriveBox-1.0.0-RC42-PARKING-HISTORY
          path: |
            DriveBox-1.0.0-RC42.apk
            DriveBox-1.0.0-RC42.apk.sha256.txt
            DriveBox-1.0.0-RC42-source.zip
            DriveBox-1.0.0-RC42-source.zip.sha256.txt
          if-no-files-found: error
          retention-days: 7
