name: Live Event Widget 1.5.1 Build

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.piiwii-events-151/**'
      - '.github/workflows/live-event-widget-151-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK 35
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Reconstruct Live Event Widget 1.4.2
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/live-event-widget-142-build.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(src) if line.strip() == '- name: Reconstruct clean Live Event Widget 1.4.0')
          run_line = next(i for i in range(start + 1, len(src)) if src[i].strip() == 'run: |')
          end = next(i for i in range(run_line + 1, len(src)) if src[i].strip() == '- name: Apply ergonomic UI, icon and bump 1.4.2')
          body=[]
          for line in src[run_line+1:end]:
              if line.startswith('          '): body.append(line[10:])
              elif not line.strip(): body.append('')
          Path('/tmp/reconstruct140.sh').write_text('\n'.join(body)+'\n')
          PY
          bash /tmp/reconstruct140.sh
          cd /tmp/piiwii-events-build
          base64 -d "$GITHUB_WORKSPACE/.piiwii-events-142/ergonomics.patch.gz.b64" | gzip -d > /tmp/ergonomics.patch
          patch -p1 < /tmp/ergonomics.patch

      - name: Install Live Event Widget 1.5.1 UI
        run: |
          set -euo pipefail
          cd /tmp/piiwii-events-build

          base64 -d "$GITHUB_WORKSPACE/.piiwii-events-150/MainActivity.kt.gz.b64" | gzip -d > app/src/main/java/ch/piiwii/events/ui/MainActivity.kt
          base64 -d "$GITHUB_WORKSPACE/.piiwii-events-150/UiFactory.kt.gz.b64" | gzip -d > app/src/main/java/ch/piiwii/events/ui/UiFactory.kt

          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/ch/piiwii/events/ui/MainActivity.kt')
          s = p.read_text()

          start = s.index('            settingsButton =', s.index('private fun buildShell()'))
          end = s.index('\n', s.index('            head.addView(settingsButton', start)) + 1
          new_settings = '''            settingsButton = TextView(this@MainActivity).apply {
                text = "⚙"
                textSize = 23f
                gravity = Gravity.CENTER
                setTextColor(UiFactory.NAVY)
                background = UiFactory.rounded(UiFactory.SOFT_BLUE, 15f, this@MainActivity)
                contentDescription = "Réglages"
                isClickable = true
                isFocusable = true
                setOnClickListener {
                    settingsSection = SettingsSection.ROOT
                    settingsOpen = true
                    showTab(selectedTab)
                }
            }
            head.addView(settingsButton, LinearLayout.LayoutParams(UiFactory.dp(this@MainActivity, 46), UiFactory.dp(this@MainActivity, 46)))
'''
          s = s[:start] + new_settings + s[end:]

          widget_start = s.index('    private fun widgetPage(): View {')
          actions_start = s.index('        val actions = UiFactory.card(this)', widget_start)
          actions_end = s.index('\n', s.index('        body.addView(actions)', actions_start)) + 1
          new_actions = '''        val actions = UiFactory.card(this)
        val widgetManager = AppWidgetManager.getInstance(this)
        val widgetIds = widgetManager.getAppWidgetIds(ComponentName(this, PiiWiiEventsWidgetProvider::class.java))
        actions.addView(UiFactory.title(this, "Widget d’accueil", 17f))
        actions.addView(UiFactory.muted(this, if (widgetIds.isEmpty()) {
            "Aucun widget installé pour l’instant."
        } else {
            "${widgetIds.size} widget${if (widgetIds.size > 1) "s" else ""} installé${if (widgetIds.size > 1) "s" else ""}."
        }))
        UiFactory.addRowButtons(this, actions,
            UiFactory.button(this, "Ajouter widget", true).apply { setOnClickListener { requestAddWidget() } },
            UiFactory.secondaryButton(this, "Actualiser", true).apply {
                setOnClickListener {
                    WidgetRenderer.updateAll(this@MainActivity, "widget_page_refresh")
                    toast("Widget actualisé")
                    showTab(3)
                }
            }
        )
        actions.addView(UiFactory.secondaryButton(this, "Aide écran d’accueil / verrouillage").apply {
            setOnClickListener { showLockScreenHelp() }
        })
        body.addView(actions)
'''
          s = s[:actions_start] + new_actions + s[actions_end:]

          root_start = s.index('    private fun settingsRootPage(): View {')
          item_start = s.index('        addItem("▣", "Widget"', root_start)
          item_end = s.index('        addItem("⚽"', item_start)
          new_item = '''        addItem("▣", "Widget", "Options du widget et aide d’affichage") {
            settingsOpen = false
            selectedTab = 3
            showTab(3)
        }
'''
          s = s[:item_start] + new_item + s[item_end:]
          p.write_text(s)

          p = Path('app/build.gradle.kts')
          s = p.read_text().replace('versionCode = 11', 'versionCode = 14').replace('versionName = "1.4.2"', 'versionName = "1.5.1"')
          p.write_text(s)

          p = Path('app/src/main/AndroidManifest.xml')
          s = p.read_text().replace('android:icon="@drawable/ic_launcher_art"', 'android:icon="@mipmap/ic_launcher"').replace('android:roundIcon="@drawable/ic_launcher_art"', 'android:roundIcon="@mipmap/ic_launcher_round"')
          p.write_text(s)
          PY

          mkdir -p app/src/main/res/drawable-nodpi app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26
          base64 -d "$GITHUB_WORKSPACE/.piiwii-events-150/icon_clean.b64" > app/src/main/res/drawable-nodpi/ic_launcher_art_clean.png
          test -s app/src/main/res/drawable-nodpi/ic_launcher_art_clean.png
          file app/src/main/res/drawable-nodpi/ic_launcher_art_clean.png | grep -q 'PNG image data'

          cat > app/src/main/res/drawable/ic_launcher_background.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#F7F9FC" />
          </shape>
          EOF

          cat > app/src/main/res/drawable/ic_launcher_foreground.xml <<'EOF'
          <inset xmlns:android="http://schemas.android.com/apk/res/android"
              android:insetLeft="10dp"
              android:insetTop="10dp"
              android:insetRight="10dp"
              android:insetBottom="10dp">
              <bitmap android:gravity="center" android:src="@drawable/ic_launcher_art_clean" />
          </inset>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF
          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          grep -q 'versionCode = 14' app/build.gradle.kts
          grep -q 'versionName = "1.5.1"' app/build.gradle.kts
          grep -q 'contentDescription = "Réglages"' app/src/main/java/ch/piiwii/events/ui/MainActivity.kt
          grep -q 'widget_page_refresh' app/src/main/java/ch/piiwii/events/ui/MainActivity.kt
          grep -q 'android:icon="@mipmap/ic_launcher"' app/src/main/AndroidManifest.xml

      - name: Build and test release
        working-directory: /tmp/piiwii-events-build
        run: gradle --no-daemon --stacktrace test assembleRelease

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="$(find /tmp/piiwii-events-build/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -c -v 4 "$APK"
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/signature.txt
          "$BT/aapt" dump badging "$APK" | head -n 1 | tee /tmp/badging.txt
          grep -q "package: name='ch.piiwii.events' versionCode='14' versionName='1.5.1'" /tmp/badging.txt
          CERT="$(grep -i 'Signer #1 certificate SHA-256 digest:' /tmp/signature.txt | sed 's/.*digest: //' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$CERT" = "63a2a61bc07cda7fc7da2425a76c19c4f11ecf9a7e570ad5f6038d5bdc4c9a8c"
          mkdir -p delivery
          cp "$APK" delivery/Live-Event-Widget-1.5.1.apk
          sha256sum delivery/Live-Event-Widget-1.5.1.apk | tee delivery/APK_SHA256.txt
          cp /tmp/signature.txt delivery/SIGNATURE.txt
          cp /tmp/badging.txt delivery/BADGING.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Live-Event-Widget-1.5.1-APK
          path: delivery/
          retention-days: 7
          if-no-files-found: error
