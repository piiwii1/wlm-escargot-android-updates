name: Live Event Widget 1.5.1 Build

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.piiwii-events-151/**'
      - '.github/workflows/live-event-widget-151-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK 35
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Reconstruct Live Event Widget 1.4.2
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/live-event-widget-142-build.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(src) if line.strip() == '- name: Reconstruct clean Live Event Widget 1.4.0')
          run_line = next(i for i in range(start + 1, len(src)) if src[i].strip() == 'run: |')
          end = next(i for i in range(run_line + 1, len(src)) if src[i].strip() == '- name: Apply ergonomic UI, icon and bump 1.4.2')
          body=[]
          for line in src[run_line+1:end]:
              if line.startswith('          '): body.append(line[10:])
              elif not line.strip(): body.append('')
          Path('/tmp/reconstruct140.sh').write_text('\n'.join(body)+'\n')
          PY
          bash /tmp/reconstruct140.sh
          cd /tmp/piiwii-events-build
          base64 -d "$GITHUB_WORKSPACE/.piiwii-events-142/ergonomics.patch.gz.b64" | gzip -d > /tmp/ergonomics.patch
          patch -p1 < /tmp/ergonomics.patch
          mkdir -p app/src/main/res/drawable-nodpi
          python3 - <<'PY'
          from pathlib import Path
          import base64, os
          root=Path(os.environ['GITHUB_WORKSPACE'])/'.piiwii-events-141'/'icon192small_chunks'
          parts=[root/'part-00',root/'fix01-0',root/'fix01-1',root/'part-02',root/'part-03',root/'part-04']
          Path('app/src/main/res/drawable-nodpi/ic_launcher_art.png').write_bytes(base64.b64decode(''.join(p.read_text().strip() for p in parts),validate=True))
          PY

      - name: Install Live Event Widget 1.5.1 UI
        run: |
          set -euo pipefail
          cd /tmp/piiwii-events-build

          base64 -d "$GITHUB_WORKSPACE/.piiwii-events-150/MainActivity.kt.gz.b64" | gzip -d > app/src/main/java/ch/piiwii/events/ui/MainActivity.kt
          base64 -d "$GITHUB_WORKSPACE/.piiwii-events-150/UiFactory.kt.gz.b64" | gzip -d > app/src/main/java/ch/piiwii/events/ui/UiFactory.kt

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/src/main/java/ch/piiwii/events/ui/MainActivity.kt')
          s = p.read_text()

          settings_pos = s.find('settingsButton =')
          if settings_pos < 0:
              raise SystemExit('1.5.1: settingsButton marker not found')
          settings_start = s.rfind('\n', 0, settings_pos) + 1
          add_pos = s.find('head.addView(settingsButton', settings_pos)
          if add_pos < 0:
              add_pos = s.find('addView(settingsButton', settings_pos)
          if add_pos < 0:
              raise SystemExit('1.5.1: settingsButton addView marker not found')
          settings_end = s.find('\n', add_pos)
          settings_end = len(s) if settings_end < 0 else settings_end + 1
          indent = re.match(r'\s*', s[settings_start:settings_pos]).group(0)
          new_settings = f'''{indent}settingsButton = TextView(this@MainActivity).apply {{
          {indent}    text = "⚙"
          {indent}    textSize = 23f
          {indent}    gravity = Gravity.CENTER
          {indent}    setTextColor(UiFactory.NAVY)
          {indent}    background = UiFactory.rounded(UiFactory.SOFT_BLUE, 15f, this@MainActivity)
          {indent}    contentDescription = "Réglages"
          {indent}    isClickable = true
          {indent}    isFocusable = true
          {indent}    setOnClickListener {{
          {indent}        settingsSection = SettingsSection.ROOT
          {indent}        settingsOpen = true
          {indent}        showTab(selectedTab)
          {indent}    }}
          {indent}}}
          {indent}head.addView(settingsButton, LinearLayout.LayoutParams(UiFactory.dp(this@MainActivity, 46), UiFactory.dp(this@MainActivity, 46)))
          '''
          s = s[:settings_start] + new_settings + s[settings_end:]

          widget_match = re.search(r'\bfun\s+widgetPage\s*\(\s*\)\s*:\s*View\s*\{', s)
          if not widget_match:
              raise SystemExit('1.5.1: widgetPage marker not found')
          body_pos = s.find('val body =', widget_match.end())
          if body_pos < 0:
              raise SystemExit('1.5.1: widgetPage body marker not found')
          body_line_end = s.find('\n', body_pos)
          body_line_end = len(s) if body_line_end < 0 else body_line_end + 1
          body_line_start = s.rfind('\n', 0, body_pos) + 1
          body_indent = re.match(r'\s*', s[body_line_start:body_pos]).group(0)
          status = f'''{body_indent}val widgetManager151 = android.appwidget.AppWidgetManager.getInstance(this)
          {body_indent}val widgetIds151 = widgetManager151.getAppWidgetIds(android.content.ComponentName(this, PiiWiiEventsWidgetProvider::class.java))
          {body_indent}val widgetStatus151 = UiFactory.card(this)
          {body_indent}widgetStatus151.addView(UiFactory.title(this, "État du widget", 17f))
          {body_indent}widgetStatus151.addView(UiFactory.muted(this, if (widgetIds151.isEmpty()) {{
          {body_indent}    "Aucun widget installé pour l’instant."
          {body_indent}}} else {{
          {body_indent}    widgetIds151.size.toString() + " widget" + (if (widgetIds151.size > 1) "s" else "") + " installé" + (if (widgetIds151.size > 1) "s" else "") + "."
          {body_indent}}}))
          {body_indent}widgetStatus151.addView(UiFactory.secondaryButton(this, "Actualiser maintenant").apply {{
          {body_indent}    setOnClickListener {{
          {body_indent}        WidgetRenderer.updateAll(this@MainActivity, "widget_page_refresh")
          {body_indent}        toast("Widget actualisé")
          {body_indent}        showTab(3)
          {body_indent}    }}
          {body_indent}}})
          {body_indent}body.addView(widgetStatus151)
          '''
          s = s[:body_line_end] + status + s[body_line_end:]

          item_pos = s.find('addItem("▣", "Widget"')
          if item_pos >= 0:
              item_start = s.rfind('\n', 0, item_pos) + 1
              next_item = s.find('addItem("⚽"', item_pos)
              if next_item > item_pos:
                  item_end = s.rfind('\n', 0, next_item) + 1
                  item_indent = re.match(r'\s*', s[item_start:item_pos]).group(0)
                  new_item = f'''{item_indent}addItem("▣", "Widget", "Options du widget et aide d’affichage") {{
          {item_indent}    settingsOpen = false
          {item_indent}    selectedTab = 3
          {item_indent}    showTab(3)
          {item_indent}}}
          '''
                  s = s[:item_start] + new_item + s[item_end:]

          p.write_text(s)

          p = Path('app/build.gradle.kts')
          s = p.read_text().replace('versionCode = 11', 'versionCode = 14').replace('versionName = "1.4.2"', 'versionName = "1.5.1"')
          p.write_text(s)

          p = Path('app/src/main/AndroidManifest.xml')
          s = p.read_text().replace('android:icon="@drawable/ic_launcher_art"', 'android:icon="@mipmap/ic_launcher"').replace('android:roundIcon="@drawable/ic_launcher_art"', 'android:roundIcon="@mipmap/ic_launcher_round"')
          p.write_text(s)
          Path('app/src/main/res/drawable/ic_launcher_background.xml').write_text('''<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle"><solid android:color="#00000000"/></shape>''')
          Path('app/src/main/res/drawable/ic_launcher_foreground.xml').write_text('''<inset xmlns:android="http://schemas.android.com/apk/res/android" android:insetLeft="-6dp" android:insetTop="-6dp" android:insetRight="-6dp" android:insetBottom="-6dp"><bitmap android:gravity="center" android:src="@drawable/ic_launcher_art" /></inset>''')
          PY

          grep -q 'versionCode = 14' app/build.gradle.kts
          grep -q 'versionName = "1.5.1"' app/build.gradle.kts
          grep -q 'contentDescription = "Réglages"' app/src/main/java/ch/piiwii/events/ui/MainActivity.kt
          grep -q 'widget_page_refresh' app/src/main/java/ch/piiwii/events/ui/MainActivity.kt
          grep -q 'android:icon="@mipmap/ic_launcher"' app/src/main/AndroidManifest.xml

      - name: Build and test release
        working-directory: /tmp/piiwii-events-build
        run: gradle --no-daemon --stacktrace test assembleRelease

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="$(find /tmp/piiwii-events-build/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -c -v 4 "$APK"
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/signature.txt
          "$BT/aapt" dump badging "$APK" | head -n 1 | tee /tmp/badging.txt
          grep -q "package: name='ch.piiwii.events' versionCode='14' versionName='1.5.1'" /tmp/badging.txt
          CERT="$(grep -i 'Signer #1 certificate SHA-256 digest:' /tmp/signature.txt | sed 's/.*digest: //' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$CERT" = "63a2a61bc07cda7fc7da2425a76c19c4f11ecf9a7e570ad5f6038d5bdc4c9a8c"
          mkdir -p delivery
          cp "$APK" delivery/Live-Event-Widget-1.5.1.apk
          sha256sum delivery/Live-Event-Widget-1.5.1.apk | tee delivery/APK_SHA256.txt
          cp /tmp/signature.txt delivery/SIGNATURE.txt
          cp /tmp/badging.txt delivery/BADGING.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Live-Event-Widget-1.5.1-APK
          path: delivery/
          retention-days: 7
          if-no-files-found: error
