name: PiiWii NFC 1.0.7 Ergonomics Build

on:
  push:
    branches: [ main ]
    paths:
      - 'piiwii-nfc-public/nfc107.patch.b64.001'
      - 'piiwii-nfc-public/nfc107.patch.b64.002'
      - '.github/workflows/piiwii-nfc-public-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare 1.0.7 sources
        run: |
          rm -rf /tmp/piiwii-nfc
          mkdir -p /tmp/piiwii-nfc
          unzip -q piiwii-nfc-public/PiiWii-NFC-1.0.2-SOURCES.zip -d /tmp/piiwii-nfc
          mv /tmp/piiwii-nfc/PiiWii-NFC-1.0.2 /tmp/piiwii-nfc/PiiWii-NFC-1.0.4
          cd /tmp/piiwii-nfc/PiiWii-NFC-1.0.4
          git apply "$GITHUB_WORKSPACE/piiwii-nfc-public/nfc103.patch"
          python3 "$GITHUB_WORKSPACE/piiwii-nfc-public/apply104.py"
          cd /tmp/piiwii-nfc
          mv PiiWii-NFC-1.0.4 PiiWii-NFC-1.0.5
          cd PiiWii-NFC-1.0.5
          python3 "$GITHUB_WORKSPACE/piiwii-nfc-public/apply105.py"
          sed -i "s/applicationId 'ch.piiwii.nfc'/applicationId 'ch.piiwii.nfc.v105'/" app/build.gradle
          cd /tmp/piiwii-nfc
          mv PiiWii-NFC-1.0.5 PiiWii-NFC-1.0.6
          cd PiiWii-NFC-1.0.6
          python3 "$GITHUB_WORKSPACE/piiwii-nfc-public/apply106.py"
          cat "$GITHUB_WORKSPACE/piiwii-nfc-public/nfc107.patch.b64.001" "$GITHUB_WORKSPACE/piiwii-nfc-public/nfc107.patch.b64.002" | base64 -d > /tmp/nfc107.patch
          git apply /tmp/nfc107.patch
          sed -i "s/applicationId 'ch.piiwii.nfc.v106'/applicationId 'ch.piiwii.nfc.v107'/" app/build.gradle
          cd /tmp/piiwii-nfc
          mv PiiWii-NFC-1.0.6 PiiWii-NFC-1.0.7
      - name: Build APK
        working-directory: /tmp/piiwii-nfc/PiiWii-NFC-1.0.7
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify APK and ergonomics
        run: |
          AAPT=/usr/local/lib/android/sdk/build-tools/35.0.0/aapt
          APKSIGNER=/usr/local/lib/android/sdk/build-tools/35.0.0/apksigner
          APK=/tmp/piiwii-nfc/PiiWii-NFC-1.0.7/app/build/outputs/apk/debug/app-debug.apk
          "$AAPT" dump badging "$APK" | head -20
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          grep -q "versionName '1.0.7'" /tmp/piiwii-nfc/PiiWii-NFC-1.0.7/app/build.gradle
          grep -q "applicationId 'ch.piiwii.nfc.v107'" /tmp/piiwii-nfc/PiiWii-NFC-1.0.7/app/build.gradle
          grep -q 'readContentText' /tmp/piiwii-nfc/PiiWii-NFC-1.0.7/app/src/main/res/layout/activity_main.xml
          grep -q 'PRÊT À ÉCRIRE' /tmp/piiwii-nfc/PiiWii-NFC-1.0.7/app/src/main/res/layout/activity_main.xml
          grep -q 'updateReadResult' /tmp/piiwii-nfc/PiiWii-NFC-1.0.7/app/src/main/java/ch/piiwii/nfc/MainActivity.java
      - name: Package deliverables
        run: |
          mkdir -p piiwii-nfc-public/dist-107
          cp /tmp/piiwii-nfc/PiiWii-NFC-1.0.7/app/build/outputs/apk/debug/app-debug.apk piiwii-nfc-public/dist-107/PiiWii-NFC-1.0.7.apk
          cd /tmp/piiwii-nfc
          zip -qr "$GITHUB_WORKSPACE/piiwii-nfc-public/dist-107/PiiWii-NFC-1.0.7-SOURCES.zip" PiiWii-NFC-1.0.7
          cd "$GITHUB_WORKSPACE/piiwii-nfc-public/dist-107"
          sha256sum PiiWii-NFC-1.0.7.apk PiiWii-NFC-1.0.7-SOURCES.zip > SHA256SUMS.txt
      - name: Upload deliverables
        uses: actions/upload-artifact@v4
        with:
          name: PiiWii-NFC-1.0.7
          path: piiwii-nfc-public/dist-107/
          retention-days: 7
          if-no-files-found: error
