name: PiiWii NFC 1.0.2 Public Build

on:
  push:
    branches: [ main ]
    paths:
      - 'piiwii-nfc-public/**'
      - '.github/workflows/piiwii-nfc-public-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract sources
        run: |
          rm -rf /tmp/piiwii-nfc
          mkdir -p /tmp/piiwii-nfc
          unzip -q piiwii-nfc-public/PiiWii-NFC-1.0.2-SOURCES.zip -d /tmp/piiwii-nfc
      - name: Build APK
        working-directory: /tmp/piiwii-nfc/PiiWii-NFC-1.0.2
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Package deliverables
        run: |
          mkdir -p piiwii-nfc-public/dist
          cp /tmp/piiwii-nfc/PiiWii-NFC-1.0.2/app/build/outputs/apk/debug/app-debug.apk piiwii-nfc-public/dist/PiiWii-NFC-1.0.2.apk
          cp piiwii-nfc-public/PiiWii-NFC-1.0.2-SOURCES.zip piiwii-nfc-public/dist/
          cd piiwii-nfc-public/dist
          sha256sum PiiWii-NFC-1.0.2.apk PiiWii-NFC-1.0.2-SOURCES.zip > SHA256SUMS.txt
      - name: Upload deliverables
        uses: actions/upload-artifact@v4
        with:
          name: PiiWii-NFC-1.0.2
          path: piiwii-nfc-public/dist/
          retention-days: 7
          if-no-files-found: error
