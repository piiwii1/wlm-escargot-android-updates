name: PiiWii NFC 1.0.2 Public Build

on:
  push:
    branches: [ main ]
    paths:
      - 'piiwii-nfc-public/**'
      - '.github/workflows/piiwii-nfc-public-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Rebuild sources
        run: |
          cat piwii-nfc-public/part*.txt > /tmp/piiwii-nfc-source.b64
          base64 -d /tmp/piiwii-nfc-source.b64 > /tmp/PiiWii-NFC-1.0.2-SOURCES.zip
          rm -rf /tmp/piiwii-nfc
          mkdir -p /tmp/piiwii-nfc
          unzip -q /tmp/PiiWii-NFC-1.0.2-SOURCES.zip -d /tmp/piiwii-nfc
      - name: Build APK
        working-directory: /tmp/piiwii-nfc/PiiWii-NFC-1.0.2
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Package deliverables
        run: |
          mkdir -p piwii-nfc-public/dist
          cp /tmp/piiwii-nfc/PiiWii-NFC-1.0.2/app/build/outputs/apk/debug/app-debug.apk piwii-nfc-public/dist/PiiWii-NFC-1.0.2.apk
          cp /tmp/PiiWii-NFC-1.0.2-SOURCES.zip piwii-nfc-public/dist/PiiWii-NFC-1.0.2-SOURCES.zip
          cd piwii-nfc-public/dist
          sha256sum PiiWii-NFC-1.0.2.apk PiiWii-NFC-1.0.2-SOURCES.zip > SHA256SUMS.txt
      - name: Upload deliverables
        uses: actions/upload-artifact@v4
        with:
          name: PiiWii-NFC-1.0.2
          path: piwii-nfc-public/dist/
          retention-days: 7
          if-no-files-found: error
