name: FannyArchive 1.3.2 Stable APK

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'fannyarchive-ci/source-v131-part*.txt'
      - 'fannyarchive-ci/build-v131.txt'
      - 'fannyarchive-ci/WhatsAppZipImporter-v132.kt'
      - 'fannyarchive-ci/build-v132.txt'

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Reconstruct source and apply 1.3.2 importer fix
        run: |
          cat fannyarchive-ci/source-v131-part*.txt | base64 -d > /tmp/FannyArchive-v1.3.1-source-STABLE.zip
          echo 'f78f787484eefdf3f12a6a5c9864949de3d09e0d6136cd3d2cfe3ff7bff9c9c4  /tmp/FannyArchive-v1.3.1-source-STABLE.zip' | sha256sum -c -
          mkdir -p /tmp/fanny132
          unzip -q /tmp/FannyArchive-v1.3.1-source-STABLE.zip -d /tmp/fanny132
          cp fannyarchive-ci/WhatsAppZipImporter-v132.kt /tmp/fanny132/FannyArchive-v1.3-source/app/src/main/java/ch/piiwii/fannyarchive/importer/WhatsAppZipImporter.kt
          sed -i 's/versionCode = 14/versionCode = 15/' /tmp/fanny132/FannyArchive-v1.3-source/app/build.gradle.kts
          sed -i 's/versionName = "1.3.1"/versionName = "1.3.2"/' /tmp/fanny132/FannyArchive-v1.3-source/app/build.gradle.kts
          sed -i '/^org.gradle.jvmargs=/d' /tmp/fanny132/FannyArchive-v1.3-source/gradle.properties
          printf '\norg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8\norg.gradle.workers.max=2\n' >> /tmp/fanny132/FannyArchive-v1.3-source/gradle.properties

      - name: Build signed stable release
        working-directory: /tmp/fanny132/FannyArchive-v1.3-source
        run: |
          gradle --no-daemon --max-workers=2 :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk /tmp/FannyArchive-1.3.2-STABLE.apk
          sha256sum /tmp/FannyArchive-1.3.2-STABLE.apk | tee /tmp/apk.sha256

      - name: Verify APK package signature
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$AAPT" dump badging /tmp/FannyArchive-1.3.2-STABLE.apk | tee /tmp/badging.txt
          grep -F "package: name='ch.piiwii.fannyarchive.stable' versionCode='15' versionName='1.3.2'" /tmp/badging.txt
          grep -F "sdkVersion:'26'" /tmp/badging.txt
          grep -F "targetSdkVersion:'35'" /tmp/badging.txt
          "$APKSIGNER" verify --verbose --print-certs /tmp/FannyArchive-1.3.2-STABLE.apk | tee /tmp/signature.txt
          grep -F 'Verifies' /tmp/signature.txt

      - name: Upload compiled APK immediately
        uses: actions/upload-artifact@v4
        with:
          name: FannyArchive-1.3.2-STABLE
          path: |
            /tmp/FannyArchive-1.3.2-STABLE.apk
            /tmp/apk.sha256
            /tmp/badging.txt
            /tmp/signature.txt
          retention-days: 7

      - name: Install launch verify Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-boot-timeout: 900
          script: |
            set -e
            adb install -r /tmp/FannyArchive-1.3.2-STABLE.apk | tee /tmp/install.txt
            grep -q 'Success' /tmp/install.txt
            adb logcat -c
            adb shell am force-stop ch.piiwii.fannyarchive.stable
            adb shell am start -n ch.piiwii.fannyarchive.stable/ch.piiwii.fannyarchive.MainActivity | tee /tmp/start.txt
            sleep 20
            adb shell pidof ch.piiwii.fannyarchive.stable | tee /tmp/pid.txt
            test -s /tmp/pid.txt
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml /tmp/window.xml >/dev/null
            grep -F 'Archive Fanny' /tmp/window.xml | tee /tmp/ui-proof.txt
            test -s /tmp/ui-proof.txt
            adb shell dumpsys activity activities | grep -F 'ch.piiwii.fannyarchive.stable/ch.piiwii.fannyarchive.MainActivity' | tee /tmp/activity.txt
            test -s /tmp/activity.txt
            adb logcat -d -v brief | grep -E 'FATAL EXCEPTION|AndroidRuntime' | grep -F 'ch.piiwii.fannyarchive.stable' > /tmp/crash.txt || true
            test ! -s /tmp/crash.txt
            adb exec-out screencap -p > /tmp/FannyArchive-1.3.2-STABLE-launch.png
            echo 'INSTALL_LAUNCH_UI=PASS'

      - name: Upload validation proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FannyArchive-1.3.2-validation
          path: |
            /tmp/install.txt
            /tmp/start.txt
            /tmp/pid.txt
            /tmp/activity.txt
            /tmp/ui-proof.txt
            /tmp/crash.txt
            /tmp/FannyArchive-1.3.2-STABLE-launch.png
          if-no-files-found: ignore
          retention-days: 7
