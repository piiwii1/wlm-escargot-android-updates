name: FannyArchive 1.3.1 Stable APK

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'fannyarchive-ci/source-v131-part*.txt'
      - 'fannyarchive-ci/build-v131.txt'

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Reconstruct stable source
        run: |
          cat fannyarchive-ci/source-v131-part*.txt | base64 -d > /tmp/FannyArchive-v1.3.1-source-STABLE.zip
          echo 'f78f787484eefdf3f12a6a5c9864949de3d09e0d6136cd3d2cfe3ff7bff9c9c4  /tmp/FannyArchive-v1.3.1-source-STABLE.zip' | sha256sum -c -
          mkdir -p /tmp/fanny131
          unzip -q /tmp/FannyArchive-v1.3.1-source-STABLE.zip -d /tmp/fanny131

      - name: Build signed stable release
        working-directory: /tmp/fanny131/FannyArchive-v1.3-source
        run: |
          gradle --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk /tmp/FannyArchive-1.3.1-STABLE.apk
          sha256sum /tmp/FannyArchive-1.3.1-STABLE.apk | tee /tmp/apk.sha256

      - name: Verify APK package signature
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$AAPT" dump badging /tmp/FannyArchive-1.3.1-STABLE.apk | tee /tmp/badging.txt
          grep -F "package: name='ch.piiwii.fannyarchive.stable' versionCode='14' versionName='1.3.1'" /tmp/badging.txt
          grep -F "sdkVersion:'26'" /tmp/badging.txt
          grep -F "targetSdkVersion:'35'" /tmp/badging.txt
          "$APKSIGNER" verify --verbose --print-certs /tmp/FannyArchive-1.3.1-STABLE.apk | tee /tmp/signature.txt
          grep -F 'Verifies' /tmp/signature.txt

      - name: Upload compiled APK immediately
        uses: actions/upload-artifact@v4
        with:
          name: FannyArchive-1.3.1-STABLE
          path: |
            /tmp/FannyArchive-1.3.1-STABLE.apk
            /tmp/apk.sha256
            /tmp/badging.txt
            /tmp/signature.txt
          retention-days: 7

      - name: Install launch verify Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-boot-timeout: 900
          script: |
            set -e
            adb install -r /tmp/FannyArchive-1.3.1-STABLE.apk | tee /tmp/install.txt
            grep -q 'Success' /tmp/install.txt
            adb logcat -c
            adb shell am force-stop ch.piiwii.fannyarchive.stable
            adb shell am start -n ch.piiwii.fannyarchive.stable/ch.piiwii.fannyarchive.MainActivity | tee /tmp/start.txt
            sleep 15
            ok=0
            for i in $(seq 1 18); do
              PID=$(adb shell pidof ch.piiwii.fannyarchive.stable 2>/dev/null | tr -d '\r' || true)
              if [ -n "$PID" ]; then
                adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
                adb pull /sdcard/window.xml /tmp/window.xml >/dev/null 2>&1 || true
                if grep -Fq 'Archive Fanny' /tmp/window.xml 2>/dev/null; then
                  ok=1
                  echo "UI_OK pid=$PID"
                  break
                fi
              fi
              sleep 5
            done
            test "$ok" = 1
            adb shell dumpsys activity activities | grep -F 'ch.piiwii.fannyarchive.stable/ch.piiwii.fannyarchive.MainActivity'
            ! adb logcat -d -v brief | grep -E 'FATAL EXCEPTION|AndroidRuntime' | grep -F 'ch.piiwii.fannyarchive.stable'
            adb exec-out screencap -p > /tmp/FannyArchive-1.3.1-STABLE-launch.png
            echo 'INSTALL_LAUNCH_UI=PASS'

      - name: Upload validation proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FannyArchive-1.3.1-validation
          path: |
            /tmp/install.txt
            /tmp/start.txt
            /tmp/window.xml
            /tmp/FannyArchive-1.3.1-STABLE-launch.png
          if-no-files-found: ignore
          retention-days: 7
