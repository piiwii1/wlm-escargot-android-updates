name: PiiWii Remote Windows beta3 Reopen Fix

on:
  push:
    branches: [piiwii-remote-v2-windows-beta3-reopen]
    paths:
      - 'piiwii-remote-v2-windows-beta3/PiiWiiRemoteAgent.iss'
      - '.github/workflows/piiwii-remote-windows-beta3-reopen.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Build and test Windows beta3 reopen behavior
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct beta1 source and prepare beta3
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(cygpath -u "$RUNNER_TEMP")"
          bash piiwii-remote-v2-lot12/reconstruct-lot12.sh "$BASE/piiwii-beta3-src"
          ROOT="$BASE/piiwii-beta3-src/piiwii-remote"
          python - "$ROOT" <<'PY'
          from pathlib import Path
          import sys
          root=Path(sys.argv[1])
          cpp=root/'windows-agent/src/PiiWiiRemoteAgent.cpp'
          rc=root/'windows-agent/src/PiiWiiRemoteAgent.rc'
          s=cpp.read_text(encoding='utf-8-sig').replace('2.0.0-beta1','2.0.0-beta3')
          anchor='''int WINAPI wWinMain(HINSTANCE hInstance, HINSTANCE, PWSTR cmdLine, int showCmd) {'''
          helper='''static bool revealExistingAgentWindow() {
    HWND existing = nullptr;
    for (int attempt = 0; attempt < 20 && !existing; ++attempt) {
        existing = FindWindowW(L"PiiWiiRemoteAgentWindow2", nullptr);
        if (!existing) Sleep(50);
    }
    if (!existing) return false;
    ShowWindow(existing, SW_SHOW);
    if (IsIconic(existing)) ShowWindow(existing, SW_RESTORE);
    SetForegroundWindow(existing);
    FlashWindow(existing, TRUE);
    return IsWindowVisible(existing) != FALSE;
}

static LRESULT CALLBACK ReopenTestProc(HWND hwnd, UINT msg, WPARAM wParam, LPARAM lParam) {
    return DefWindowProcW(hwnd, msg, wParam, lParam);
}

static bool runReopenSelfTest(HINSTANCE instance) {
    WNDCLASSW wc{};
    wc.lpfnWndProc = ReopenTestProc;
    wc.hInstance = instance;
    wc.lpszClassName = L"PiiWiiRemoteAgentWindow2";
    if (!RegisterClassW(&wc)) return false;
    HWND hwnd = CreateWindowW(wc.lpszClassName, L"PiiWii Remote Agent test", WS_OVERLAPPEDWINDOW, 0, 0, 320, 180, nullptr, nullptr, instance, nullptr);
    if (!hwnd) { UnregisterClassW(wc.lpszClassName, instance); return false; }
    ShowWindow(hwnd, SW_HIDE);
    const bool ok = revealExistingAgentWindow() && IsWindowVisible(hwnd);
    DestroyWindow(hwnd);
    UnregisterClassW(wc.lpszClassName, instance);
    return ok;
}

'''
          if anchor not in s: raise SystemExit('wWinMain anchor not found')
          s=s.replace(anchor, helper + anchor)
          old='''    gMutex = CreateMutexW(nullptr, TRUE, L"Local\\PiiWiiRemoteAgent2");
    if (GetLastError() == ERROR_ALREADY_EXISTS && wcsstr(cmdLine, L"--self-test") == nullptr) return 0;'''
          new='''    if (wcsstr(cmdLine, L"--reopen-self-test") != nullptr) return runReopenSelfTest(hInstance) ? 0 : 11;
    gMutex = CreateMutexW(nullptr, TRUE, L"Local\\PiiWiiRemoteAgent2");
    if (GetLastError() == ERROR_ALREADY_EXISTS && wcsstr(cmdLine, L"--self-test") == nullptr) {
        const bool reopened = revealExistingAgentWindow();
        if (gMutex) CloseHandle(gMutex);
        return reopened ? 0 : 12;
    }'''
          if old not in s: raise SystemExit('single-instance block not found')
          s=s.replace(old,new)
          s=s.replace('''            if (lParam == WM_LBUTTONDBLCLK) {\n                ShowWindow(hwnd, SW_RESTORE);''','''            if (lParam == WM_LBUTTONUP || lParam == WM_LBUTTONDBLCLK) {\n                ShowWindow(hwnd, SW_RESTORE);''')
          s=s.replace('''        case WM_CLOSE:\n            ShowWindow(hwnd, SW_HIDE);\n            return 0;''','''        case WM_CLOSE: {\n            ShowWindow(hwnd, SW_HIDE);\n            static bool hintShown = false;\n            if (!hintShown && gTray.hWnd) {\n                hintShown = true;\n                NOTIFYICONDATAW hint = gTray;\n                hint.uFlags = NIF_INFO;\n                lstrcpynW(hint.szInfoTitle, L"PiiWii Remote reste actif", ARRAYSIZE(hint.szInfoTitle));\n                lstrcpynW(hint.szInfo, L"Cliquez sur l’icône près de l’horloge ou sur le raccourci Bureau pour rouvrir la fenêtre et retrouver le code d’appairage.", ARRAYSIZE(hint.szInfo));\n                hint.dwInfoFlags = NIIF_INFO;\n                Shell_NotifyIconW(NIM_MODIFY, &hint);\n            }\n            return 0;\n        }''')
          cpp.write_text(s,encoding='utf-8')
          s=rc.read_text(encoding='utf-8-sig')
          s=s.replace('FILEVERSION 2,0,0,8','FILEVERSION 2,0,0,10').replace('PRODUCTVERSION 2,0,0,8','PRODUCTVERSION 2,0,0,10').replace('2.0.0-beta1','2.0.0-beta3')
          rc.write_text(s,encoding='utf-8')
          PY
          mkdir -p "$ROOT/windows-agent/installer"
          cp piiwii-remote-v2-windows-beta3/PiiWiiRemoteAgent.iss "$ROOT/windows-agent/installer/"
          grep -q 'static bool revealExistingAgentWindow()' "$ROOT/windows-agent/src/PiiWiiRemoteAgent.cpp"
          grep -q 'WM_LBUTTONUP || lParam == WM_LBUTTONDBLCLK' "$ROOT/windows-agent/src/PiiWiiRemoteAgent.cpp"
          grep -q 'PiiWii Remote reste actif' "$ROOT/windows-agent/src/PiiWiiRemoteAgent.cpp"
          grep -q 'FILEVERSION 2,0,0,10' "$ROOT/windows-agent/src/PiiWiiRemoteAgent.rc"

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile Agent beta3 x64
        shell: cmd
        working-directory: ${{ runner.temp }}\piiwii-beta3-src\piiwii-remote\windows-agent
        run: |
          if not exist build mkdir build
          rc /nologo /fo build\PiiWiiRemoteAgent.res src\PiiWiiRemoteAgent.rc
          cl /nologo /std:c++17 /EHsc /W4 /DUNICODE /D_UNICODE /DWIN32 /D_WINDOWS /O2 src\PiiWiiRemoteAgent.cpp build\PiiWiiRemoteAgent.res gdi32.lib user32.lib advapi32.lib PowrProf.lib bcrypt.lib shell32.lib /link /SUBSYSTEM:WINDOWS /OUT:build\PiiWii-Remote-Agent-2.0.0-beta3.exe

      - name: Validate Agent beta3
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'piiwii-beta3-src\piiwii-remote\windows-agent'
          $exe=Join-Path $root 'build\PiiWii-Remote-Agent-2.0.0-beta3.exe'
          $p=Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru
          if($p.ExitCode -ne 0){throw "Agent self-test failed: $($p.ExitCode)"}
          $r=Start-Process -FilePath $exe -ArgumentList '--reopen-self-test' -Wait -PassThru
          if($r.ExitCode -ne 0){throw "Reopen self-test failed: $($r.ExitCode)"}
          $h=& dumpbin /headers $exe | Out-String
          if($h -notmatch 'PE32\+' -or ($h -notmatch 'machine \(x64\)' -and $h -notmatch '8664 machine')){throw 'Agent is not PE32+ x64'}
          $v=(Get-Item $exe).VersionInfo
          if($v.ProductVersion -notlike '2.0.0-beta3*'){throw "Bad ProductVersion: $($v.ProductVersion)"}

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'piiwii-beta3-src\piiwii-remote\windows-agent'
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if(-not (Test-Path $iscc)){ choco install innosetup --no-progress -y }
          & $iscc (Join-Path $root 'installer\PiiWiiRemoteAgent.iss')
          if($LASTEXITCODE -ne 0){throw "Inno Setup failed: $LASTEXITCODE"}
          $setup=Join-Path $root 'installer\output\PiiWii-Remote-Setup-2.0.0-beta3.exe'
          if(-not(Test-Path $setup)){throw 'Setup missing'}
          if((Get-Item $setup).VersionInfo.ProductVersion -notlike '2.0.0.10*'){throw 'Bad setup version'}

      - name: Real install shortcut target and installed reopen self-test
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'piiwii-beta3-src\piiwii-remote\windows-agent'
          $setup=Join-Path $root 'installer\output\PiiWii-Remote-Setup-2.0.0-beta3.exe'
          $installDir=Join-Path $env:LOCALAPPDATA 'Programs\PiiWii Remote Agent'
          $installedExe=Join-Path $installDir 'PiiWii-Remote-Agent.exe'
          $desktop=Join-Path ([Environment]::GetFolderPath('Desktop')) 'PiiWii Remote Agent.lnk'
          $startMenu=Join-Path ([Environment]::GetFolderPath('Programs')) 'PiiWii Remote Agent.lnk'
          $p=Start-Process $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if($p.ExitCode -ne 0){throw 'Install failed'}
          foreach($f in @($installedExe,$desktop,$startMenu)){if(-not(Test-Path $f)){throw "Missing $f"}}
          $ws=New-Object -ComObject WScript.Shell
          foreach($lnk in @($desktop,$startMenu)){
            $sc=$ws.CreateShortcut($lnk)
            if([IO.Path]::GetFullPath($sc.TargetPath) -ne [IO.Path]::GetFullPath($installedExe)){throw "Shortcut target is wrong: $lnk -> $($sc.TargetPath)"}
          }
          $t=Start-Process $installedExe -ArgumentList '--self-test' -Wait -PassThru
          if($t.ExitCode -ne 0){throw 'Installed Agent self-test failed'}
          $r=Start-Process $installedExe -ArgumentList '--reopen-self-test' -Wait -PassThru
          if($r.ExitCode -ne 0){throw 'Installed reopen self-test failed'}
          $un=Join-Path $installDir 'unins000.exe'
          $u=Start-Process $un -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if($u.ExitCode -ne 0){throw 'Uninstall failed'}
          Start-Sleep -Seconds 1
          if(Test-Path $desktop){throw 'Desktop shortcut remained'}
          if(Test-Path $startMenu){throw 'Start Menu shortcut remained'}
          'SHORTCUT TARGET + REOPEN SELF-TEST + UNINSTALL: OK'

      - name: Package output
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'piiwii-beta3-src\piiwii-remote\windows-agent'
          $out=Join-Path $env:RUNNER_TEMP 'piiwii-beta3-out'; New-Item -ItemType Directory -Force $out|Out-Null
          Copy-Item (Join-Path $root 'build\PiiWii-Remote-Agent-2.0.0-beta3.exe') $out
          Copy-Item (Join-Path $root 'installer\output\PiiWii-Remote-Setup-2.0.0-beta3.exe') $out
          Copy-Item (Join-Path $root 'installer\PiiWiiRemoteAgent.iss') $out
          $lines=@(); Get-ChildItem $out -File | ForEach-Object {$lines += "$((Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower())  $($_.Name)"}; $lines|Set-Content (Join-Path $out 'SHA256.txt')
          @('PIIWII REMOTE WINDOWS BETA3 REOPEN AUDIT PASSED','Desktop shortcut targets installed Agent: OK','Tray single click/double click reopen: implemented','First close notification: implemented','Agent x64 self-test + reopen self-test: OK','Install/uninstall shortcuts: OK') | Set-Content (Join-Path $out 'AUDIT.txt')
          Compress-Archive -Path (Join-Path $root 'src'),(Join-Path $root 'installer') -DestinationPath (Join-Path $out 'PiiWii-Remote-Windows-2.0.0-beta3-Sources.zip') -Force

      - uses: actions/upload-artifact@v4
        with:
          name: PiiWii-Remote-Windows-2.0.0-beta3-Reopen
          path: ${{ runner.temp }}\piiwii-beta3-out\*
          retention-days: 7
          if-no-files-found: error
