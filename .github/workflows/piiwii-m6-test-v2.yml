name: Build PiiWii M6 Test v2

on:
  push:
    branches:
      - chatgpt/piiwii-m6-test-20260918
    paths:
      - 'm6-test/**'
      - '.github/workflows/piiwii-m6-test-v2.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 35
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable APK
        working-directory: m6-test
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare delivery
        run: |
          mkdir -p m6-test/delivery
          cp m6-test/app/build/outputs/apk/debug/app-debug.apk m6-test/delivery/PiiWii-M6-Test-0.1.2.apk
          sha256sum m6-test/delivery/PiiWii-M6-Test-0.1.2.apk > m6-test/delivery/PiiWii-M6-Test-0.1.2.apk.sha256
          cd m6-test
          zip -r delivery/PiiWii-M6-Test-0.1.2-Sources.zip app/src app/build.gradle build.gradle settings.gradle gradle.properties >/dev/null
          cd ..
          sha256sum m6-test/delivery/PiiWii-M6-Test-0.1.2-Sources.zip > m6-test/delivery/PiiWii-M6-Test-0.1.2-Sources.zip.sha256

      - name: Upload delivery
        uses: actions/upload-artifact@v4
        with:
          name: PiiWii-M6-Test-0.1.2
          path: m6-test/delivery/*
          if-no-files-found: error
          retention-days: 30
