name: Export Android apksigner 35
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ca106-temp-build.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "build-tools;35.0.0"
      - name: Package signer
        run: |
          set -e
          BT="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p /tmp/signer/lib
          cp "$BT/apksigner" /tmp/signer/apksigner
          cp "$BT/lib/apksigner.jar" /tmp/signer/lib/apksigner.jar
          chmod +x /tmp/signer/apksigner
          "$BT/apksigner" version
      - uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-35
          path: '/tmp/signer/**'
          retention-days: 1
