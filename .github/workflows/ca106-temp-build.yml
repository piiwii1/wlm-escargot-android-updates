name: Compagnon Autoroute 1.0.8 corrected unsigned build
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ca106-temp-build.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Reconstruct and patch source
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          set -euo pipefail
          : > /tmp/source.zip
          for H in \
            2ea825b585a9f260bd4256fe811650d245ccd837 \
            5e6264585e4ec332f8e6b0f3852857f9edfb4dca \
            d39c3528e691213de6d750e3ba12d2e29baccf78 \
            0f9b4635d69cc740e8ccb462379e07c0685e0159
          do
            gh api repos/${GITHUB_REPOSITORY}/git/blobs/$H --jq .content | tr -d '\n' | base64 -d >> /tmp/source.zip
          done
          echo '4b336e63b342a0cd7eca9a68d7b51fdf7a908d531c6ba87a1a585f7aed2374a1  /tmp/source.zip' | sha256sum -c -
          unzip -tq /tmp/source.zip
          mkdir /tmp/src
          unzip -q /tmp/source.zip -d /tmp/src
          P=$(dirname "$(find /tmp/src -maxdepth 3 -name settings.gradle | head -1)")
          sed -i 's/external.setOnClickListener(v -> openCurrentPositionInMaps());/external.setOnClickListener(view -> openCurrentPositionInMaps());/' "$P/app/src/main/java/com/compagnonautoroute/app/MainActivity.java"
          grep -F 'external.setOnClickListener(view -> openCurrentPositionInMaps());' "$P/app/src/main/java/com/compagnonautoroute/app/MainActivity.java"
      - name: Core tests
        run: |
          set -e
          P=$(dirname "$(find /tmp/src -maxdepth 3 -name settings.gradle | head -1)")
          mkdir /tmp/core
          javac -d /tmp/core "$P/app/src/main/java/com/compagnonautoroute/app/core/GeoMath.java" "$P/app/src/main/java/com/compagnonautoroute/app/core/RouteGraph.java" "$P/tools/CoreLogicSelfTest.java"
          java -cp /tmp/core CoreLogicSelfTest | tee /tmp/core-tests.txt
      - name: Build unsigned APK
        run: |
          set -e
          P=$(dirname "$(find /tmp/src -maxdepth 3 -name settings.gradle | head -1)")
          cd "$P"
          gradle --no-daemon :app:assembleRelease
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          test -f "$APK"
          mkdir /tmp/out
          cp "$APK" /tmp/out/CompagnonAutoroute-1.0.8-V1-unsigned.apk
          B=$(find $ANDROID_HOME/build-tools -name aapt | sort -V | tail -1)
          $B dump badging /tmp/out/CompagnonAutoroute-1.0.8-V1-unsigned.apk | tee /tmp/out/badging.txt
          grep -F "package: name='com.compagnonautoroute.app' versionCode='9' versionName='1.0.8-v1'" /tmp/out/badging.txt
          cp /tmp/core-tests.txt /tmp/out/
      - uses: actions/upload-artifact@v4
        with:
          name: CompagnonAutoroute-1.0.8-V1-UNSIGNED
          path: '/tmp/out/*'
          retention-days: 1
