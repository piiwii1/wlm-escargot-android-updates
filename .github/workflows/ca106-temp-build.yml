name: Compagnon Autoroute 1.0.6 ergonomie build

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/ca106-temp-build.yml'

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Live service coverage smoke test
        shell: bash
        run: |
          set -euo pipefail
          LAT='46.2331'; LON='7.3606'
          Q='[out:json][timeout:16];(nwr(around:18000,'"$LAT"','"$LON"')[amenity=fuel];nwr(around:18000,'"$LAT"','"$LON"')[amenity=toilets];nwr(around:18000,'"$LAT"','"$LON"')[amenity=charging_station];nwr(around:15000,'"$LAT"','"$LON"')[amenity~"^(restaurant|cafe|fast_food|parking)$"];nwr(around:15000,'"$LAT"','"$LON"')[tourism~"^(hotel|motel|hostel)$"];nwr(around:18000,'"$LAT"','"$LON"')[highway~"^(services|rest_area)$"];);out center qt;'
          curl --fail --silent --show-error --max-time 30 -A 'CompagnonAutoroute-CI/1.0.6' -X POST 'https://overpass.osm.ch/api/interpreter' --data-urlencode "data=$Q" -o /tmp/services.json
          FUEL=$(jq '[.elements[]|select(.tags.amenity=="fuel" or .tags.highway=="services")]|length' /tmp/services.json)
          WC=$(jq '[.elements[]|select(.tags.amenity=="toilets" or .tags.toilets!=null)]|length' /tmp/services.json)
          CHARGE=$(jq '[.elements[]|select(.tags.amenity=="charging_station")]|length' /tmp/services.json)
          FOOD=$(jq '[.elements[]|select(.tags.amenity=="restaurant" or .tags.amenity=="cafe" or .tags.amenity=="fast_food")]|length' /tmp/services.json)
          printf 'FUEL=%s WC=%s CHARGE=%s FOOD=%s\n' "$FUEL" "$WC" "$CHARGE" "$FOOD" | tee /tmp/services-smoke.txt
          test "$FUEL" -gt 0
          test "$WC" -gt 0
          test "$CHARGE" -gt 0
          test "$FOOD" -gt 0
      - name: Open encrypted session
        id: session
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SESSION=$(openssl rand -hex 12)
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/ca106-private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/ca106-private.pem -pubout -out /tmp/ca106-public.pem
          PUB=$(base64 -w0 /tmp/ca106-public.pem)
          gh api repos/${GITHUB_REPOSITORY}/issues/45/comments -f body="CA106_PUBLIC_KEY:${SESSION}:${PUB}" >/dev/null
          echo "session=${SESSION}" >> "$GITHUB_OUTPUT"
      - name: Receive encrypted bundle
        env:
          GH_TOKEN: ${{ github.token }}
          SESSION: ${{ steps.session.outputs.session }}
        run: |
          set -euo pipefail
          MANIFEST=''
          for i in $(seq 1 180); do
            MANIFEST=$(gh api --paginate repos/${GITHUB_REPOSITORY}/issues/45/comments --jq ".[] | select(.body | startswith(\"CA106_BLOBS:${SESSION}:\")) | .body" | tail -n 1 || true)
            [ -n "$MANIFEST" ] && break
            sleep 5
          done
          test -n "$MANIFEST"
          REST=${MANIFEST#CA106_BLOBS:${SESSION}:}
          KEY_SHA=${REST%%:*}
          SHAS_CSV=${REST#*:}
          gh api repos/${GITHUB_REPOSITORY}/git/blobs/${KEY_SHA} --jq .content | tr -d '\n' | base64 -d > /tmp/key.enc
          : > /tmp/bundle.enc
          IFS=',' read -ra SHAS <<< "$SHAS_CSV"
          for SHA in "${SHAS[@]}"; do gh api repos/${GITHUB_REPOSITORY}/git/blobs/${SHA} --jq .content | tr -d '\n' | base64 -d >> /tmp/bundle.enc; done
          openssl pkeyutl -decrypt -inkey /tmp/ca106-private.pem -in /tmp/key.enc -pkeyopt rsa_padding_mode:oaep > /tmp/pass.txt
          openssl enc -d -aes-256-cbc -pbkdf2 -in /tmp/bundle.enc -out /tmp/bundle.zip -pass file:/tmp/pass.txt
          unzip -tq /tmp/bundle.zip
          cd /tmp && unzip -q /tmp/bundle.zip
          mkdir -p /tmp/src && unzip -q /tmp/ca106-bundle/source.zip -d /tmp/src
      - name: Core tests
        shell: bash
        run: |
          set -euo pipefail
          PROJ=$(dirname "$(find /tmp/src -maxdepth 3 -type f -name settings.gradle | head -n1)")
          mkdir -p /tmp/core
          javac -d /tmp/core "$PROJ/app/src/main/java/com/compagnonautoroute/app/core/GeoMath.java" "$PROJ/app/src/main/java/com/compagnonautoroute/app/core/RouteGraph.java" "$PROJ/tools/CoreLogicSelfTest.java"
          java -cp /tmp/core CoreLogicSelfTest | tee /tmp/core-tests.txt
      - name: Build and sign
        shell: bash
        run: |
          set -euo pipefail
          PROJ=$(dirname "$(find /tmp/src -maxdepth 3 -type f -name settings.gradle | head -n1)")
          cd "$PROJ"
          gradle --no-daemon :app:assembleDebug --stacktrace
          APK=$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n1)
          mkdir -p /tmp/out
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)
          PASS=$(cat /tmp/ca106-bundle/signing-pass.txt)
          "$APKSIGNER" sign --ks /tmp/ca106-bundle/signing.jks --ks-key-alias compagnon-test --ks-pass pass:"$PASS" --key-pass pass:"$PASS" --out /tmp/out/CompagnonAutoroute-1.0.6-V1.apk "$APK"
          sha256sum /tmp/out/CompagnonAutoroute-1.0.6-V1.apk | tee /tmp/out/CompagnonAutoroute-1.0.6-V1.apk.sha256
          "$AAPT" dump badging /tmp/out/CompagnonAutoroute-1.0.6-V1.apk | tee /tmp/out/badging.txt
          grep -F "package: name='com.compagnonautoroute.app' versionCode='7' versionName='1.0.6-v1'" /tmp/out/badging.txt
          "$APKSIGNER" verify --verbose --print-certs /tmp/out/CompagnonAutoroute-1.0.6-V1.apk | tee /tmp/out/signature.txt
          grep -Fi 'f71e230f97112b5763e0b546e6b297b9e9c54df243dc8dcd8c856f35ea37acfc' /tmp/out/signature.txt
          cp /tmp/services-smoke.txt /tmp/out/services-smoke.txt
          cp /tmp/core-tests.txt /tmp/out/core-tests.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CompagnonAutoroute-1.0.6-V1-APK
          path: /tmp/out/*
          if-no-files-found: error
          retention-days: 1
      - if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          SESSION: ${{ steps.session.outputs.session }}
        run: gh api repos/${GITHUB_REPOSITORY}/issues/45/comments -f body="CA106_BUILD_DONE:${SESSION}" >/dev/null
