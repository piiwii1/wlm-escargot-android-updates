name: EuroScan Offline Toolchain Export

on:
  push:
    branches: [chatgpt-build-test-20260926]
    paths:
      - '.github/workflows/euroscan-toolchain.yml'
      - '.chatgpt/euroscan-toolchain-trigger.txt'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Warm exact EuroScan dependencies
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/euroscan-warm
          mkdir -p /tmp/euroscan-warm/app/src/main/java/ch/piiwii/euroscan
          mkdir -p /tmp/euroscan-warm/app/src/main/res/values
          cat > /tmp/euroscan-warm/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'EuroScanWarm'
          include ':app'
          EOF
          cat > /tmp/euroscan-warm/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF
          cat > /tmp/euroscan-warm/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
          cat > /tmp/euroscan-warm/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'ch.piiwii.euroscan'
              compileSdk 35
              defaultConfig { applicationId 'ch.piiwii.euroscan.warm'; minSdk 26; targetSdk 35; versionCode 1; versionName '1.0' }
              buildTypes { release { minifyEnabled false } }
          }
          dependencies {
              implementation 'androidx.activity:activity:1.10.0'
              implementation 'androidx.core:core:1.15.0'
              implementation 'androidx.camera:camera-core:1.4.2'
              implementation 'androidx.camera:camera-camera2:1.4.2'
              implementation 'androidx.camera:camera-lifecycle:1.4.2'
              implementation 'androidx.camera:camera-view:1.4.2'
              implementation 'com.google.mlkit:text-recognition:16.0.1'
              implementation 'org.jsoup:jsoup:1.18.3'
          }
          EOF
          cat > /tmp/euroscan-warm/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:theme="@style/AppTheme"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF
          cat > /tmp/euroscan-warm/app/src/main/res/values/styles.xml <<'EOF'
          <resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"/></resources>
          EOF
          cat > /tmp/euroscan-warm/app/src/main/java/ch/piiwii/euroscan/MainActivity.java <<'EOF'
          package ch.piiwii.euroscan;
          public class MainActivity extends android.app.Activity { @Override protected void onCreate(android.os.Bundle b) { super.onCreate(b); } }
          EOF
          gradle -p /tmp/euroscan-warm --no-daemon --stacktrace assembleRelease

      - name: Package compact offline toolchain
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_BIN="$(readlink -f "$(command -v gradle)")"
          GRADLE_HOME="$(dirname "$(dirname "$GRADLE_BIN")")"
          OUT=/tmp/euroscan-toolchain
          rm -rf "$OUT"
          mkdir -p "$OUT/android-sdk/build-tools" "$OUT/android-sdk/platforms" "$OUT/gradle-user-home/caches"
          cp -a "$GRADLE_HOME" "$OUT/gradle-8.9"
          cp -a "$ANDROID_HOME/build-tools/35.0.0" "$OUT/android-sdk/build-tools/"
          cp -a "$ANDROID_HOME/platforms/android-35" "$OUT/android-sdk/platforms/"
          cp -a "$ANDROID_HOME/platform-tools" "$OUT/android-sdk/"
          for d in modules-2 8.9 jars-9 transforms-4 journal-1; do
            if [ -e "$HOME/.gradle/caches/$d" ]; then cp -a "$HOME/.gradle/caches/$d" "$OUT/gradle-user-home/caches/"; fi
          done
          if [ -d "$HOME/.gradle/native" ]; then cp -a "$HOME/.gradle/native" "$OUT/gradle-user-home/"; fi
          find "$OUT/gradle-user-home" -name '*.lock' -delete || true
          tar -C /tmp -czf /tmp/euroscan-offline-toolchain.tar.gz euroscan-toolchain
          sha256sum /tmp/euroscan-offline-toolchain.tar.gz > /tmp/euroscan-offline-toolchain-SHA256.txt
          du -h /tmp/euroscan-offline-toolchain.tar.gz

      - name: Upload offline toolchain
        uses: actions/upload-artifact@v4
        with:
          name: euroscan-offline-toolchain
          path: |
            /tmp/euroscan-offline-toolchain.tar.gz
            /tmp/euroscan-offline-toolchain-SHA256.txt
          retention-days: 1
          if-no-files-found: error
