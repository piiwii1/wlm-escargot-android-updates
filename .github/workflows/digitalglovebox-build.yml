name: DigitalGlovebox APK Build

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/digitalglovebox-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated build branch
        uses: actions/checkout@v4
        with:
          ref: build-digitalglovebox-010

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore source archive
        run: |
          base64 -d digitalglovebox-build/source.b64 > /tmp/DigitalGlovebox-0.1.0-source.zip
          mkdir -p /tmp/dgbox
          unzip -q /tmp/DigitalGlovebox-0.1.0-source.zip -d /tmp/dgbox

      - name: Build debug APK
        working-directory: /tmp/dgbox/DigitalGlovebox
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        run: |
          cp /tmp/dgbox/DigitalGlovebox/app/build/outputs/apk/debug/app-debug.apk DigitalGlovebox-0.1.0.apk
          sha256sum DigitalGlovebox-0.1.0.apk > DigitalGlovebox-0.1.0.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DigitalGlovebox-0.1.0-APK
          path: |
            DigitalGlovebox-0.1.0.apk
            DigitalGlovebox-0.1.0.apk.sha256
          if-no-files-found: error
