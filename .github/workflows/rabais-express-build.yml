name: Rabais Express APK Build

on:
  push:
    branches: [ rabais-express-build ]
    paths:
      - '.github/workflows/rabais-express-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      SDKMANAGER: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct verified 1.5.0 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/piiwii1/wlm-escargot-android-updates/issues/46/comments?per_page=100" -o /tmp/comments.json
          python3 - <<'PY'
          import base64, hashlib, json, pathlib, shutil, zipfile
          comments={int(c['id']):c['body'] for c in json.load(open('/tmp/comments.json',encoding='utf-8'))}
          specs=[
            (5688863149,'R150 1/7',5600,'309d59937f3c0e07efe5f061b1fb180711984471d9ef9c54b38745654f312acc'),
            (5688868002,'R150 2/7',5600,'31745f8479c7e62b5a033cb532aadf716ae2f77f3935dcb39353dffaf5b5d07b'),
            (5688872809,'R150 3/7',5600,'f759272c0ec908d5aca3b3767c2631b88d22e38c188905e8cf05eecf1275d782'),
            (5688885338,'R150 4/7',5600,'d0dced65edae52076707757213be2b4058b23c754d0bc652e1224d3edff7d573'),
            (5688889635,'R150 5/7',5600,'268febdfc1b4aac800df1d64c2dc2d1a6d9d103305dcde60ae748460040d6bc9'),
            (5688906120,'R150 6A',2000,'9c5577ace118945a431b9290717182c6ed9af8cf9ade8c8c09cd19d002fd2415'),
            (5688908134,'R150 6B',2000,'744aecc4a1b26dc509c717ae464eecc87b67865522eb89695d8d0498f7f33eee'),
            (5688920609,'R150 6C1',800,'0a2f079928d85a65accd338edc19361c380ccacb5a41e20c4bf47eb05073d0d7'),
            (5688922115,'R150 6C2',800,'4d5ed6dfa7513562719aa5ec16319a180a339c8c8cca19056115423851c89cc2'),
            (5688894095,'R150 7/7',36,'dda367a24ca6e69a41ce31ae6ce6526a64b3f9c1ecd7aaf35cddb04e66f2f9ba'),
          ]
          chunks=[]
          for cid,header_expected,len_expected,sha_expected in specs:
            body=comments[cid]
            header,payload=body.split('\n',1)
            clean=''.join(payload.split())
            assert header.strip()==header_expected,(cid,header)
            assert len(clean)==len_expected,(cid,len(clean),len_expected)
            assert hashlib.sha256(clean.encode()).hexdigest()==sha_expected,(cid,'sha mismatch')
            chunks.append(clean)
          raw=base64.b64decode(''.join(chunks),validate=True)
          sha=hashlib.sha256(raw).hexdigest()
          assert sha=='707c64ff02337435d6c10553608a40529442aaac3ce84b787b5b025c42f17108',sha
          pathlib.Path('/tmp/Rabais-Express-1.5.0-SOURCES.zip').write_bytes(raw)
          with zipfile.ZipFile('/tmp/Rabais-Express-1.5.0-SOURCES.zip') as z:
            bad=z.testzip(); assert bad is None,bad
          shutil.rmtree('rabais-express',ignore_errors=True)
          pathlib.Path('rabais-express').mkdir()
          with zipfile.ZipFile('/tmp/Rabais-Express-1.5.0-SOURCES.zip') as z: z.extractall('rabais-express')
          PY
          grep -q "applicationId 'ch.piiwii.rabaisexpress'" rabais-express/app/build.gradle
          grep -q "versionCode 9" rabais-express/app/build.gradle
          grep -q "versionName '1.5.0'" rabais-express/app/build.gradle
          grep -q 'android:id="@+id/settingsPage"' rabais-express/app/src/main/res/layout/activity_main.xml
          grep -q 'android:id="@+id/themeClassic"' rabais-express/app/src/main/res/layout/activity_main.xml
          grep -q 'android:id="@+id/themeDark"' rabais-express/app/src/main/res/layout/activity_main.xml
          grep -q 'android:id="@+id/themeXP"' rabais-express/app/src/main/res/layout/activity_main.xml
          grep -q 'android:id="@+id/themeMSN"' rabais-express/app/src/main/res/layout/activity_main.xml
          grep -q 'SKIN_MSN' rabais-express/app/src/main/java/ch/piiwii/rabais/MainActivity.java

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned release APK
        working-directory: rabais-express
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Prepare delivery
        run: |
          mkdir -p delivery/signing-tools/lib
          APK="rabais-express/app/build/outputs/apk/release/app-release-unsigned.apk"
          cp "$APK" delivery/Rabais-Express-1.5.0-UNSIGNED.apk
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" delivery/signing-tools/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/lib/apksigner.jar" delivery/signing-tools/lib/apksigner.jar
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign" delivery/signing-tools/zipalign
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2" delivery/signing-tools/aapt2
          chmod +x delivery/signing-tools/* || true
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2" dump badging "$APK" > delivery/BADGING.txt || true
          sha256sum delivery/Rabais-Express-1.5.0-UNSIGNED.apk > delivery/SHA256-UNSIGNED.txt

      - name: Upload APK and signing tools
        uses: actions/upload-artifact@v4
        with:
          name: Rabais-Express-1.5.0-UNSIGNED-TOOLS
          path: delivery/*
          retention-days: 7
          if-no-files-found: error
