name: Rabais Express APK Build

on:
  push:
    branches: [ rabais-express-build ]
    paths:
      - '.github/workflows/rabais-express-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      SDKMANAGER: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct verified 1.4.0 base source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/piiwii1/wlm-escargot-android-updates/issues/46/comments?per_page=100" -o /tmp/comments.json
          python3 - <<'PYBASE'
          import base64, hashlib, json, pathlib, shutil, zipfile
          comments = {int(c['id']): c['body'] for c in json.load(open('/tmp/comments.json', encoding='utf-8'))}
          specs = [
              (5688218123, 'CHUNK 1/5', 6000, '5c71ef2a71d602b4ed5703e5fe646ac2c4d545d3cbcd9369e732f4aac88570cd'),
              (5688223858, 'CHUNK 2/5', 6000, '30acd0ff03ffc45c4fb3622a4a052956f6a3ff7af6f07d58b1746c9a13f8883a'),
              (5688316966, 'CHUNK 3A', 2000, '91168118112e05c6d28f9e6f07db9e39d8c5220b357097bf590c53f157b7eb5c'),
              (5688319042, 'CHUNK 3B', 2000, '8db121abe4717028e73559070934ff022e292f4168f2b93f297d701d6fccbc46'),
              (5688321048, 'CHUNK 3C', 2000, '38254c6c5fe3e30c6e7b076fee953635340fc8c4943202e450a373951edc8333'),
              (5688235073, 'CHUNK 4/5', 6000, '8b49a537d260cdf10bc457a2ef45f705576a4fb353959696298cfa4d14255b9d'),
              (5688281114, 'CHUNK 5/5', 4672, '4e1b26745c3105a5fa5c6a8a7bb6a31969f333dcfbf5d57eacf55b1dea9a9b25'),
          ]
          chunks=[]
          for cid, header_expected, len_expected, sha_expected in specs:
              header,payload=comments[cid].split('\n',1)
              clean=''.join(payload.split())
              if header.strip()!=header_expected or len(clean)!=len_expected or hashlib.sha256(clean.encode()).hexdigest()!=sha_expected:
                  raise SystemExit('Base source verification failed: '+header_expected)
              chunks.append(clean)
          raw=base64.b64decode(''.join(chunks),validate=True)
          if hashlib.sha256(raw).hexdigest()!='cd5a773cbe083eb69bc4e86a14a056817117c7b169b2a9592c35374c4543a315':
              raise SystemExit('Base source SHA mismatch')
          pathlib.Path('/tmp/base.zip').write_bytes(raw)
          shutil.rmtree('rabais-express',ignore_errors=True)
          pathlib.Path('rabais-express').mkdir()
          with zipfile.ZipFile('/tmp/base.zip') as z: z.extractall('rabais-express')
          PYBASE

      - name: Apply 1.4.1 UX update
        run: |
          python3 - <<'PYUPDATE'
          import base64,gzip,pathlib
          java_gz = ""
          layout_gz = "[... ELLIPSIZATION ...]"
          layout_gz = "[... ELLIPSIZATION ...]"
          layout_gz = "[... ELLIPSIZATION ...]"
          layout_gz = "[... ELLIPSIZATION ...]"
          layout_gz = "[... ELLIPSIZATION ...]"
          pathlib.Path('rabais-express/app/src/main/java/ch/piiwii/rabais/MainActivity.java').write_bytes(gzip.decompress(base64.b64decode(java_gz)))
          pathlib.Path('rabais-express/app/src/main/res/layout/activity_main.xml').write_bytes(gzip.decompress(base64.b64decode(layout_gz)))
          p=pathlib.Path('rabais-express/app/build.gradle')
          s=p.read_text().replace('versionCode 6','versionCode 7').replace("versionName '1.4.0'","versionName '1.4.1'")
          p.write_text(s)
          PYUPDATE
          grep -n "applicationId\|versionCode\|versionName" rabais-express/app/build.gradle
          ! grep -q '<ScrollView' rabais-express/app/src/main/res/layout/activity_main.xml

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned release APK
        working-directory: rabais-express
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Prepare delivery
        run: |
          mkdir -p delivery/signing-tools/lib
          APK="rabais-express/app/build/outputs/apk/release/app-release-unsigned.apk"
          cp "$APK" delivery/Rabais-Express-1.4.1-UNSIGNED.apk
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" delivery/signing-tools/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/lib/apksigner.jar" delivery/signing-tools/lib/apksigner.jar
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign" delivery/signing-tools/zipalign
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2" delivery/signing-tools/aapt2
          chmod +x delivery/signing-tools/* || true
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2" dump badging "$APK" > delivery/BADGING.txt || true
          sha256sum delivery/Rabais-Express-1.4.1-UNSIGNED.apk | tee delivery/SHA256-UNSIGNED.txt

      - name: Upload APK and signing tools
        uses: actions/upload-artifact@v4
        with:
          name: Rabais-Express-1.4.1-UNSIGNED-TOOLS
          path: delivery/*
          retention-days: 7
          if-no-files-found: error
