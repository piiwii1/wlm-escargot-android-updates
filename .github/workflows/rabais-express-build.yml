name: Rabais Express APK Build

on:
  push:
    branches: [ rabais-express-build ]
    paths:
      - 'rabais-express/**'
      - '.github/workflows/rabais-express-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      SDKMANAGER: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned release APK
        working-directory: rabais-express
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Prepare delivery
        run: |
          mkdir -p delivery/signing-tools/lib
          cp rabais-express/app/build/outputs/apk/release/app-release-unsigned.apk delivery/Rabais-Express-1.2.0-UNSIGNED.apk
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" delivery/signing-tools/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/lib/apksigner.jar" delivery/signing-tools/lib/apksigner.jar
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign" delivery/signing-tools/zipalign
          chmod +x delivery/signing-tools/apksigner delivery/signing-tools/zipalign
          sha256sum delivery/Rabais-Express-1.2.0-UNSIGNED.apk | tee delivery/SHA256-UNSIGNED.txt

      - name: Upload APK and signing tools
        uses: actions/upload-artifact@v4
        with:
          name: Rabais-Express-1.2.0-UNSIGNED-TOOLS
          path: delivery/*
          retention-days: 7
          if-no-files-found: error
