name: Rabais Express APK Build

on:
  push:
    branches: [ rabais-express-build ]
    paths:
      - 'rabais-express/**'
      - '.github/workflows/rabais-express-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      SDKMANAGER: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: rabais-express
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Prepare delivery
        run: |
          mkdir -p delivery
          cp rabais-express/app/build/outputs/apk/debug/app-debug.apk delivery/Rabais-Express-1.1.0.apk
          sha256sum delivery/Rabais-Express-1.1.0.apk | tee delivery/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rabais-Express-1.1.0-APK
          path: delivery/*
          retention-days: 7
          if-no-files-found: error
