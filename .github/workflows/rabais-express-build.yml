name: Rabais Express APK Build

on:
  push:
    branches: [ rabais-express-build ]
    paths:
      - '.github/workflows/rabais-express-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      SDKMANAGER: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct verified 1.4.2 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/piiwii1/wlm-escargot-android-updates/issues/46/comments?per_page=100" \
            -o /tmp/comments.json
          python3 - <<'PY'
          import base64, hashlib, json, pathlib, shutil, zipfile
          comments = {int(c['id']): c['body'] for c in json.load(open('/tmp/comments.json', encoding='utf-8'))}
          specs = [
              (5688721674, 'V142 1/6', 5000, '71f8de737f54181bcea802af85407828320ba45fa55fe85541dd119a9034be9e'),
              (5688726559, 'V142 2/6', 5000, 'bb82e87af8c1c5da6af8b8952c8244a0812e0c007f8ed1b649355365d0f3562b'),
              (5688732001, 'V142 3/6', 5000, 'ca7f4777224c053dbce634994308698788892ffe8eacdca4b741f89246080899'),
              (5688737933, 'V142 4/6', 5000, '4b6f60b92f9bb9c38c3af7de9d7e9cc1f4e61904eec579516bca202afeee6431'),
              (5688743699, 'V142 5/6', 5000, 'd3b027a8f309d75d9537bb8756b395f36baf309fd099db79a97f00c6ce68bb3a'),
              (5688748603, 'V142 6/6', 4888, '4dedd4d71fb228f69043192fc8c374774cdea18d2ef23c85185055becccb4273'),
          ]
          chunks=[]
          for cid, header_expected, len_expected, sha_expected in specs:
              body = comments[cid]
              header, payload = body.split('\n', 1)
              clean = ''.join(payload.split())
              digest = hashlib.sha256(clean.encode()).hexdigest()
              if header.strip() != header_expected:
                  raise SystemExit(f'Bad header {header!r} for {cid}')
              if len(clean) != len_expected:
                  raise SystemExit(f'Bad length {len(clean)} for {header_expected}')
              if digest != sha_expected:
                  raise SystemExit(f'Bad chunk SHA for {header_expected}: {digest}')
              chunks.append(clean)
          raw = base64.b64decode(''.join(chunks), validate=True)
          digest = hashlib.sha256(raw).hexdigest()
          print('Source ZIP SHA-256:', digest)
          if digest != '6784e089f6478260800f486b865255667ba73ea4fbcd8fcdd28bec59ae60539d':
              raise SystemExit('Source ZIP SHA mismatch')
          pathlib.Path('/tmp/source.zip').write_bytes(raw)
          with zipfile.ZipFile('/tmp/source.zip') as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit('Corrupt ZIP member: '+bad)
          shutil.rmtree('rabais-express', ignore_errors=True)
          pathlib.Path('rabais-express').mkdir()
          with zipfile.ZipFile('/tmp/source.zip') as z:
              z.extractall('rabais-express')
          PY
          grep -n "applicationId\|versionCode\|versionName" rabais-express/app/build.gradle
          grep -q "applicationId 'ch.piiwii.rabaisexpress'" rabais-express/app/build.gradle
          grep -q "versionCode 8" rabais-express/app/build.gradle
          grep -q "versionName '1.4.2'" rabais-express/app/build.gradle
          grep -q 'android:id="@+id/calcPercent"' rabais-express/app/src/main/res/layout/activity_main.xml
          grep -q 'findViewById(R.id.calcPercent)' rabais-express/app/src/main/java/ch/piiwii/rabais/MainActivity.java

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned release APK
        working-directory: rabais-express
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Prepare delivery
        run: |
          mkdir -p delivery/signing-tools/lib
          APK="rabais-express/app/build/outputs/apk/release/app-release-unsigned.apk"
          cp "$APK" delivery/Rabais-Express-1.4.2-UNSIGNED.apk
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" delivery/signing-tools/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/lib/apksigner.jar" delivery/signing-tools/lib/apksigner.jar
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign" delivery/signing-tools/zipalign
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2" delivery/signing-tools/aapt2
          chmod +x delivery/signing-tools/* || true
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2" dump badging "$APK" > delivery/BADGING.txt || true
          sha256sum delivery/Rabais-Express-1.4.2-UNSIGNED.apk | tee delivery/SHA256-UNSIGNED.txt

      - name: Upload APK and signing tools
        uses: actions/upload-artifact@v4
        with:
          name: Rabais-Express-1.4.2-UNSIGNED-TOOLS
          path: delivery/*
          retention-days: 7
          if-no-files-found: error
