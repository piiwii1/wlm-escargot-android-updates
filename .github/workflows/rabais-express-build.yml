name: Rabais Express APK Build

on:
  push:
    branches: [ rabais-express-build ]
    paths:
      - '.github/workflows/rabais-express-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      SDKMANAGER: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct verified 1.4.0 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/piiwii1/wlm-escargot-android-updates/issues/46/comments?per_page=100" -o /tmp/comments.json
          python3 - <<'PY'
          import base64, hashlib, json, pathlib, shutil, zipfile
          expected_ids = [5688218123, 5688223858, 5688229285, 5688235073, 5688281114]
          comments = {int(c['id']): c['body'] for c in json.load(open('/tmp/comments.json', encoding='utf-8'))}
          chunks = []
          for index, cid in enumerate(expected_ids, 1):
              body = comments[cid]
              header, payload = body.split('\n', 1)
              if header.strip() != f'CHUNK {index}/5':
                  raise SystemExit(f'Bad chunk header: {header}')
              clean = ''.join(payload.split())
              print(f'CHUNK {index}: len={len(clean)} sha256={hashlib.sha256(clean.encode()).hexdigest()}')
              chunks.append(clean)
          raw = base64.b64decode(''.join(chunks), validate=True)
          digest = hashlib.sha256(raw).hexdigest()
          expected = 'cd5a773cbe083eb69bc4e86a14a056817117c7b169b2a9592c35374c4543a315'
          print('Payload SHA-256:', digest)
          if digest != expected:
              raise SystemExit('Payload SHA-256 mismatch')
          payload = pathlib.Path('/tmp/rabais-1.4.0.zip')
          payload.write_bytes(raw)
          shutil.rmtree('rabais-express', ignore_errors=True)
          pathlib.Path('rabais-express').mkdir()
          with zipfile.ZipFile(payload) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f'Corrupt ZIP member: {bad}')
              z.extractall('rabais-express')
          PY
          grep -n "applicationId\|versionCode\|versionName" rabais-express/app/build.gradle

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned release APK
        working-directory: rabais-express
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Prepare delivery
        run: |
          mkdir -p delivery/signing-tools/lib
          APK="rabais-express/app/build/outputs/apk/release/app-release-unsigned.apk"
          cp "$APK" delivery/Rabais-Express-1.4.0-UNSIGNED.apk
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" delivery/signing-tools/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/lib/apksigner.jar" delivery/signing-tools/lib/apksigner.jar
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign" delivery/signing-tools/zipalign
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2" delivery/signing-tools/aapt2
          chmod +x delivery/signing-tools/* || true
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2" dump badging "$APK" > delivery/BADGING.txt || true
          sha256sum delivery/Rabais-Express-1.4.0-UNSIGNED.apk | tee delivery/SHA256-UNSIGNED.txt

      - name: Upload APK and signing tools
        uses: actions/upload-artifact@v4
        with:
          name: Rabais-Express-1.4.0-UNSIGNED-TOOLS
          path: delivery/*
          retention-days: 7
          if-no-files-found: error
