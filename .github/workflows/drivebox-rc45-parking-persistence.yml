name: Build DriveBox RC45 Parking Persistence

on:
  push:
    branches: [ drivebox-rc45-parking-persistence ]
    paths:
      - '.github/workflows/drivebox-rc45-parking-persistence.yml'
      - 'drivebox-ci/rc45v2.part*.b64'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore validated RC44 source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9651283730/zip" -o /tmp/rc44-artifact.zip
          rm -rf /tmp/rc44-artifact /tmp/drivebox-src
          mkdir -p /tmp/rc44-artifact /tmp/drivebox-src
          unzip -oq /tmp/rc44-artifact.zip -d /tmp/rc44-artifact
          test "$(sha256sum /tmp/rc44-artifact/DriveBox-1.0.0-RC44-source.zip | awk '{print $1}')" = '2a3f6df41c8fe8be85cf1ca26473a6574e879016768705f8bdd42d2c26a41bc1'
          unzip -oq /tmp/rc44-artifact/DriveBox-1.0.0-RC44-source.zip -d /tmp/drivebox-src
          grep -q 'versionCode 53' /tmp/drivebox-src/app/build.gradle
          grep -q "versionName '1.0.0-rc44'" /tmp/drivebox-src/app/build.gradle

      - name: Verify and apply RC45 persistence patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum drivebox-ci/rc45v2.part00.b64 | awk '{print $1}')" = '525ecfec656991a686dc43c918b42b09b3a42904b88a692bc383bd6bf30623f3'
          test "$(sha256sum drivebox-ci/rc45v2.part01.b64 | awk '{print $1}')" = '34037a22ae91ce5b6670a51f853d2c9cde025ae4b51e469846929d0c7e9ef9c7'
          test "$(sha256sum drivebox-ci/rc45v2.part02.b64 | awk '{print $1}')" = '9a4fac2f8bdf99b1d5e82863d3ac3e6a573f6bef267594f287be1b69e5b6c719'
          cat drivebox-ci/rc45v2.part00.b64 drivebox-ci/rc45v2.part01.b64 drivebox-ci/rc45v2.part02.b64 | base64 -d > /tmp/rc45.patch.gz
          test "$(sha256sum /tmp/rc45.patch.gz | awk '{print $1}')" = 'a97b605071142f982c43e266e8e8376a70ca3af4771cd573bd9271545fb6d59f'
          gzip -d -c /tmp/rc45.patch.gz > /tmp/rc45.patch
          test "$(sha256sum /tmp/rc45.patch | awk '{print $1}')" = '7a72303c17d07ffc0333cbe1d8bace0c4ce38f9c5c2ff5c1bd60527a06bf3134'
          cd /tmp/drivebox-src
          patch -p2 < /tmp/rc45.patch
          grep -q 'versionCode 54' app/build.gradle
          grep -q "versionName '1.0.0-rc45'" app/build.gradle
          grep -q 'boolean flushToDisk()' app/src/main/java/ch/clubvwsuisse/drivebox/ParkingSessionStore.java
          grep -q 'parkingStore.flushToDisk()' app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java
          grep -q 'Enregistré automatiquement' app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java
          grep -q 'parking.floor.persist' app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java
          grep -q 'parking.zone.persist' app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java
          test "$(grep -R -h '@Test' app/src/test/java | wc -l)" -ge 12
          test -f CONTINUITE-RC45.md
          if grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml; then echo 'Unexpected INTERNET permission'; exit 1; fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests and compile RC45
        working-directory: /tmp/drivebox-src
        run: gradle --no-daemon clean :app:testDebugUnitTest :app:assembleDebug

      - name: Verify and package RC45
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/drivebox-src/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/cert.txt
          grep -qi '6699b2b6b15b5e09032b4f54c5c26bbd982a41dc48d5a5093d1501036a474a1e' /tmp/cert.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='ch.clubvwsuisse.drivebox.v1'" /tmp/badging.txt
          grep -q "versionCode='54'" /tmp/badging.txt
          grep -q "versionName='1.0.0-rc45'" /tmp/badging.txt
          grep -q "application-label:'DriveBox'" /tmp/badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | tee /tmp/perms.txt
          grep -q 'android.permission.ACCESS_FINE_LOCATION' /tmp/perms.txt
          grep -q 'android.permission.ACCESS_BACKGROUND_LOCATION' /tmp/perms.txt
          grep -q 'android.permission.FOREGROUND_SERVICE_LOCATION' /tmp/perms.txt
          grep -q 'android.permission.POST_NOTIFICATIONS' /tmp/perms.txt
          if grep -q 'android.permission.INTERNET' /tmp/perms.txt; then exit 1; fi
          unzip -t "$APK"
          unzip -p "$APK" res/mipmap-xxxhdpi-v4/ic_launcher.webp > /tmp/icon.webp
          test "$(sha256sum /tmp/icon.webp | awk '{print $1}')" = 'ab5bbd86c44f537aae43e60584c39c923cee3e7c855ae887332617158c0e8a05'
          cp "$APK" "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC45.apk"
          rm -rf /tmp/drivebox-src/app/build /tmp/drivebox-src/.gradle
          (cd /tmp/drivebox-src && zip -qr "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC45-source.zip" .)
          sha256sum "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC45.apk" > "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC45.apk.sha256.txt"
          sha256sum "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC45-source.zip" > "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC45-source.zip.sha256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: DriveBox-1.0.0-RC45-PARKING-PERSISTENCE
          path: |
            DriveBox-1.0.0-RC45.apk
            DriveBox-1.0.0-RC45.apk.sha256.txt
            DriveBox-1.0.0-RC45-source.zip
            DriveBox-1.0.0-RC45-source.zip.sha256.txt
          if-no-files-found: error
          retention-days: 7
