name: Build DriveBox RC13B APK

on:
  push:
    branches: [ drivebox-ci-temp ]
    paths:
      - 'drivebox-ci/rc13b-trigger.txt'
      - '.github/workflows/drivebox-rc13b.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare verified RC11 source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/drivebox-rc11b.yml').read_text()
          def extract(step_name, out):
              marker = '      - name: ' + step_name + '\n'
              start = text.index(marker)
              run_start = text.index('        run: |\n', start) + len('        run: |\n')
              end = text.find('\n      - ', run_start)
              if end < 0: end = len(text)
              block = text[run_start:end]
              lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
              Path(out).write_text('\n'.join(lines) + '\n')
          extract('Prepare RC10 source', '/tmp/prepare-rc10.sh')
          extract('Integrate supplied tab artwork', '/tmp/integrate-tabs.sh')
          extract('Apply RC11 integration', '/tmp/apply-rc11.sh')
          PY
          bash /tmp/prepare-rc10.sh
          bash /tmp/integrate-tabs.sh
          bash /tmp/apply-rc11.sh
          grep -q "DriveBox 1.0.0 RC11" /tmp/drivebox-src/app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java

      - name: Apply RC12 country improvements
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/drivebox-rc12.yml').read_text()
          marker = '      - name: Apply RC12 country improvements\n'
          start = text.index(marker)
          run_start = text.index('        run: |\n', start) + len('        run: |\n')
          end = text.find('\n      - ', run_start)
          if end < 0: end = len(text)
          block = text[run_start:end]
          lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
          Path('/tmp/apply-rc12.sh').write_text('\n'.join(lines) + '\n')
          PY
          bash /tmp/apply-rc12.sh
          grep -q "DriveBox 1.0.0 RC12" /tmp/drivebox-src/app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java

      - name: Apply RC13 simple color tabs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/drivebox-rc13.yml').read_text()
          marker = '      - name: Apply RC13 simple color tabs\n'
          start = text.index(marker)
          run_start = text.index('        run: |\n', start) + len('        run: |\n')
          end = text.find('\n      - ', run_start)
          if end < 0: end = len(text)
          block = text[run_start:end]
          lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
          Path('/tmp/apply-rc13.sh').write_text('\n'.join(lines) + '\n')
          PY
          bash /tmp/apply-rc13.sh
          grep -q "DriveBox 1.0.0 RC13" /tmp/drivebox-src/app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java
          grep -q "versionCode 22" /tmp/drivebox-src/app/build.gradle
          grep -q "versionName '1.0.0-rc13'" /tmp/drivebox-src/app/build.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        working-directory: /tmp/drivebox-src
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Verify RC13
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/drivebox-src/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/cert.txt
          grep -qi '6699b2b6b15b5e09032b4f54c5c26bbd982a41dc48d5a5093d1501036a474a1e' /tmp/cert.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='ch.clubvwsuisse.drivebox.v1'" /tmp/badging.txt
          grep -q "versionCode='22'" /tmp/badging.txt
          grep -q "versionName='1.0.0-rc13'" /tmp/badging.txt
          grep -q "application-label:'DriveBox'" /tmp/badging.txt
          unzip -t "$APK"
          unzip -p "$APK" res/mipmap-xxxhdpi-v4/ic_launcher.webp > /tmp/icon-from-apk.webp
          test "$(sha256sum /tmp/icon-from-apk.webp | awk '{print $1}')" = 'ab5bbd86c44f537aae43e60584c39c923cee3e7c855ae887332617158c0e8a05'
          cp "$APK" "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC13.apk"
          sha256sum "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC13.apk" > "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC13.apk.sha256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: DriveBox-1.0.0-RC13
          path: |
            DriveBox-1.0.0-RC13.apk
            DriveBox-1.0.0-RC13.apk.sha256.txt
          if-no-files-found: error
          retention-days: 7
