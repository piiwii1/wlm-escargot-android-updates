name: PiiWii NFC 1.0.19 Visual Polish Build

on:
  push:
    branches: [ main ]
    paths:
      - 'piiwii-nfc-public/v119/**'
      - '.github/workflows/piiwii-nfc-119.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download validated 1.0.18 sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/piiwii-nfc /tmp/art118
          mkdir -p /tmp/piiwii-nfc /tmp/art118
          gh api repos/${{ github.repository }}/actions/artifacts/11028846478/zip > /tmp/art118.zip
          unzip -q /tmp/art118.zip -d /tmp/art118
          unzip -q /tmp/art118/PiiWii-NFC-1.0.18-SOURCES.zip -d /tmp/piiwii-nfc
          test -d /tmp/piiwii-nfc/PiiWii-NFC-1.0.18
      - name: Apply 1.0.19 visual upgrade
        run: |
          python3 "$GITHUB_WORKSPACE/piiwii-nfc-public/v119/apply119.py"
          cd /tmp/piiwii-nfc
          mv PiiWii-NFC-1.0.18 PiiWii-NFC-1.0.19
      - name: Build APK
        working-directory: /tmp/piiwii-nfc/PiiWii-NFC-1.0.19
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify APK and 1.0.19 UI
        run: |
          AAPT=/usr/local/lib/android/sdk/build-tools/35.0.0/aapt
          APKSIGNER=/usr/local/lib/android/sdk/build-tools/35.0.0/apksigner
          ROOT=/tmp/piiwii-nfc/PiiWii-NFC-1.0.19
          APK=$ROOT/app/build/outputs/apk/debug/app-debug.apk
          "$AAPT" dump badging "$APK" | head -20
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          grep -q "versionName '1.0.19'" "$ROOT/app/build.gradle"
          grep -q "versionCode 20" "$ROOT/app/build.gradle"
          grep -q "applicationId 'ch.piiwii.nfc.v119'" "$ROOT/app/build.gradle"
          grep -q 'historySearchInput' "$ROOT/app/src/main/res/layout/activity_main.xml"
          grep -q 'ic_home' "$ROOT/app/src/main/res/layout/activity_main.xml"
          grep -q 'bg_setting_purple' "$ROOT/app/src/main/res/layout/activity_main.xml"
          grep -q 'historySearchInput.addTextChangedListener' "$ROOT/app/src/main/java/ch/piiwii/nfc/MainActivity.java"
      - name: Package deliverables
        run: |
          mkdir -p piiwii-nfc-public/dist-119
          cp /tmp/piiwii-nfc/PiiWii-NFC-1.0.19/app/build/outputs/apk/debug/app-debug.apk piiwii-nfc-public/dist-119/PiiWii-NFC-1.0.19.apk
          cd /tmp/piiwii-nfc
          zip -qr "$GITHUB_WORKSPACE/piiwii-nfc-public/dist-119/PiiWii-NFC-1.0.19-SOURCES.zip" PiiWii-NFC-1.0.19
          cd "$GITHUB_WORKSPACE/piiwii-nfc-public/dist-119"
          sha256sum PiiWii-NFC-1.0.19.apk PiiWii-NFC-1.0.19-SOURCES.zip > SHA256SUMS.txt
      - name: Upload deliverables
        uses: actions/upload-artifact@v4
        with:
          name: PiiWii-NFC-1.0.19
          path: piiwii-nfc-public/dist-119/
          retention-days: 7
          if-no-files-found: error
