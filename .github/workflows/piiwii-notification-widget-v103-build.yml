name: PiiWii Notification Widget 1.0.3 Android bottom tabs
on:
  push:
    branches: [chatgpt/piiwii-notification-widget-103]
    paths:
      - 'notification-widget-v103-ui/**'
      - '.github/workflows/piiwii-notification-widget-v103-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Android SDK
        run: |
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore 1.0.2 sources and apply 1.0.3 UI changes
        shell: bash
        run: |
          set -euo pipefail
          cp -a piiwii-notification-widget-v101 piiwii-notification-widget-v103
          cat notification-widget-v102-patch/part-* | base64 -d > /tmp/widget102.tar.xz
          echo "74fe74bb99e989af513a435892931a3c36324c5392604222df33bef3503f8b90  /tmp/widget102.tar.xz" | sha256sum -c -
          tar -xJf /tmp/widget102.tar.xz -C piiwii-notification-widget-v103
          python3 notification-widget-v103-ui/patch.py
          grep -q "versionCode 4" piiwii-notification-widget-v103/app/build.gradle
          grep -q "WindowInsets.Type.navigationBars" piiwii-notification-widget-v103/app/src/main/java/ch/piiwii/notificationwidget/MainActivity.java
      - name: Compile release APK
        run: gradle -p piiwii-notification-widget-v103 --no-daemon --stacktrace assembleRelease
      - name: Package sources and aligned APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -f -p 4 piiwii-notification-widget-v103/app/build/outputs/apk/release/app-release-unsigned.apk out/PiiWii-Notification-Widget-1.0.3-UNSIGNED.apk
          cp "$BT/lib/apksigner.jar" out/apksigner.jar
          zip -q -r out/PiiWii-Notification-Widget-1.0.3-SOURCES.zip piiwii-notification-widget-v103 -x '*/build/*' '*/.gradle/*'
          sha256sum out/PiiWii-Notification-Widget-1.0.3-UNSIGNED.apk out/PiiWii-Notification-Widget-1.0.3-SOURCES.zip > out/SHA256-BUILD.txt
      - name: Upload compiled APK and sources
        uses: actions/upload-artifact@v4
        with:
          name: PiiWii-Notification-Widget-1.0.3-build
          path: out/*
          retention-days: 15
          if-no-files-found: error
