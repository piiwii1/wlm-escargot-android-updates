name: PiiWii NFC 1.0.34 UI Final Polish

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/piiwii-nfc-134.yml'
      - 'piiwii-nfc-public/v134/**'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download 1.0.33 source baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/nfc134 /tmp/base133 /tmp/base133.zip
          mkdir -p /tmp/nfc134 /tmp/base133
          ART_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts | map(select(.name == "PiiWii-NFC-1.0.33-build" and .expired == false)) | sort_by(.created_at) | reverse | .[0].id // empty')
          test -n "$ART_ID"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$ART_ID/zip" > /tmp/base133.zip
          unzip -q /tmp/base133.zip -d /tmp/base133
          SRCZIP=$(find /tmp/base133 -type f -name 'PiiWii-NFC-1.0.33-SOURCES-BUILD.zip' -print -quit)
          test -n "$SRCZIP"
          unzip -q "$SRCZIP" -d /tmp/nfc134
          test -d /tmp/nfc134/PiiWii-NFC-1.0.33

      - name: Apply final polish
        run: |
          set -euo pipefail
          PAYLOAD="$GITHUB_WORKSPACE/piiwii-nfc-public/v134"
          cat "$PAYLOAD/patch_00.b64" | base64 -d | gzip -d > /tmp/v134.patch
          cd /tmp/nfc134/PiiWii-NFC-1.0.33
          patch -p2 < /tmp/v134.patch
          grep -q "applicationId 'ch.piiwii.nfc.app'" app/build.gradle
          grep -q "versionCode 35" app/build.gradle
          grep -q "versionName '1.0.34'" app/build.gradle
          grep -q 'android:id="@+id/typeWifi"' app/src/main/res/layout/activity_main.xml
          grep -q 'android:id="@+id/modelsWifiButton"' app/src/main/res/layout/activity_main.xml
          grep -q 'android:id="@+id/writeTypeIcon"' app/src/main/res/layout/activity_main.xml

      - name: Build release
        working-directory: /tmp/nfc134/PiiWii-NFC-1.0.33
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Align and verify APK
        run: |
          set -euo pipefail
          ROOT=/tmp/nfc134/PiiWii-NFC-1.0.33
          BT="$ANDROID_HOME/build-tools/35.0.0"
          IN="$ROOT/app/build/outputs/apk/release/app-release-unsigned.apk"
          OUT=/tmp/PiiWii-NFC-1.0.34-ALIGNED-UNSIGNED.apk
          test -f "$IN"
          "$BT/zipalign" -f -p 4 "$IN" "$OUT"
          "$BT/zipalign" -c -v 4 "$OUT"
          "$BT/aapt" dump badging "$OUT" | tee /tmp/badging134.txt
          grep -q "package: name='ch.piiwii.nfc.app'" /tmp/badging134.txt
          grep -q "versionCode='35'" /tmp/badging134.txt
          grep -q "versionName='1.0.34'" /tmp/badging134.txt
          if grep -q 'application-debuggable' /tmp/badging134.txt; then
            echo 'ERROR: release APK is debuggable' >&2
            exit 1
          fi
          unzip -t "$OUT" >/dev/null

      - name: Package deliverables
        run: |
          set -euo pipefail
          mkdir -p /tmp/out134
          cp /tmp/PiiWii-NFC-1.0.34-ALIGNED-UNSIGNED.apk /tmp/out134/
          cd /tmp/nfc134
          mv PiiWii-NFC-1.0.33 PiiWii-NFC-1.0.34
          zip -qr /tmp/out134/PiiWii-NFC-1.0.34-SOURCES-BUILD.zip PiiWii-NFC-1.0.34
          cat > /tmp/out134/BUILD-IDENTITY.txt <<'EOF'
          PiiWii NFC 1.0.34 — final visual polish
          package=ch.piiwii.nfc.app
          versionCode=35
          versionName=1.0.34
          release=true
          scope=visual fidelity polish + Wi-Fi primary model/type + navigation density
          signing=stable PiiWii key after artifact download
          EOF

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: PiiWii-NFC-1.0.34-build
          path: /tmp/out134/
          retention-days: 7
          if-no-files-found: error
