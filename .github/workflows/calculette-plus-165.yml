name: Calculette Plus 1.6.5 Build

on:
  push:
    branches: [ rabais-express-build ]
    paths:
      - '.github/workflows/calculette-plus-165.yml'
      - 'build-input/Calculette-Plus-1.6.5-SOURCES.zip'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      SDKMANAGER: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source
        run: |
          set -euo pipefail
          rm -rf calculette-plus
          mkdir calculette-plus
          unzip -q build-input/Calculette-Plus-1.6.5-SOURCES.zip -d calculette-plus
          grep -q "applicationId 'ch.piiwii.rabaisexpress'" calculette-plus/app/build.gradle
          grep -q 'versionCode 17' calculette-plus/app/build.gradle
          grep -q "versionName '1.6.5'" calculette-plus/app/build.gradle
          grep -q 'android:label="Calculette+"' calculette-plus/app/src/main/AndroidManifest.xml
          grep -q 'settingsButton' calculette-plus/app/src/main/res/layout/activity_main.xml
          grep -q 'ratesInternetButton' calculette-plus/app/src/main/res/layout/activity_main.xml
          grep -q 'ratesManualSave' calculette-plus/app/src/main/res/layout/activity_main.xml
          grep -q 'saveManualRates' calculette-plus/app/src/main/java/ch/piiwii/rabais/MainActivity.java
          grep -q 'refreshRatesFromInternet' calculette-plus/app/src/main/java/ch/piiwii/rabais/MainActivity.java
          ! grep -q 'requestRatesIfNeeded' calculette-plus/app/src/main/java/ch/piiwii/rabais/MainActivity.java
          ! grep -q 'navPlus' calculette-plus/app/src/main/res/layout/activity_main.xml
          ! grep -q 'ScrollView' calculette-plus/app/src/main/res/layout/activity_main.xml
          echo 'ebbda3b2a77f66ae6cfc663f7351f05f1c2e3668b364808a9614ca5bf658b4db  calculette-plus/app/src/main/res/drawable-nodpi/ic_calculette_plus.webp' | sha256sum -c -
          sha256sum build-input/Calculette-Plus-1.6.5-SOURCES.zip

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned release APK
        working-directory: calculette-plus
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Prepare delivery
        run: |
          mkdir -p delivery/signing-tools/lib
          APK='calculette-plus/app/build/outputs/apk/release/app-release-unsigned.apk'
          cp "$APK" delivery/Calculette-Plus-1.6.5-UNSIGNED.apk
          cp build-input/Calculette-Plus-1.6.5-SOURCES.zip delivery/Calculette-Plus-1.6.5-SOURCES.zip
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" delivery/signing-tools/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/lib/apksigner.jar" delivery/signing-tools/lib/apksigner.jar
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2" delivery/signing-tools/aapt2
          chmod +x delivery/signing-tools/* || true
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2" dump badging "$APK" > delivery/BADGING.txt
          sha256sum delivery/Calculette-Plus-1.6.5-UNSIGNED.apk delivery/Calculette-Plus-1.6.5-SOURCES.zip > delivery/SHA256-UNSIGNED.txt

      - name: Upload APK source and signing tools
        uses: actions/upload-artifact@v4
        with:
          name: Calculette-Plus-1.6.5-UNSIGNED-TOOLS
          path: delivery/*
          retention-days: 7
          if-no-files-found: error
