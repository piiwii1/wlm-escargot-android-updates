name: Calculette Plus 1.6.5 Build

on:
  push:
    branches: [ rabais-express-build ]
    paths:
      - '.github/workflows/calculette-plus-165.yml'
      - 'build-input/c165patch.gz.b64'
      - 'build-input/c165icon-*.txt'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      SDKMANAGER: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct verified 1.6.4 and apply 1.6.5
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          p=Path('.github/workflows/rabais-express-164.yml')
          s=p.read_text()
          marker='      - name: Reconstruct verified 1.6.3 and apply Calculette+ identity\n        run: |\n'
          start=s.index(marker)+len(marker)
          end=s.index('\n      - name: Setup Java 17', start)
          block=textwrap.dedent(s[start:end])
          Path('/tmp/reconstruct164.sh').write_text('set -euo pipefail\n'+block+'\n')
          PY
          bash /tmp/reconstruct164.sh

          base64 -d build-input/c165patch.gz.b64 > /tmp/c165patch.gz
          echo '91ccfd98c07b819df1bacb1676d14acede4a321a5369c66444caa6325970aed5  /tmp/c165patch.gz' | sha256sum -c -
          gunzip -c /tmp/c165patch.gz > /tmp/c165.patch
          (cd rabais-express && patch -p1 < /tmp/c165.patch)

          cat build-input/c165icon-00.txt build-input/c165icon-01.txt build-input/c165icon-02.txt build-input/c165icon-03.txt build-input/c165icon-04.txt > /tmp/c165icon.b64
          base64 -d /tmp/c165icon.b64 > rabais-express/app/src/main/res/drawable-nodpi/ic_calculette_plus.webp
          file rabais-express/app/src/main/res/drawable-nodpi/ic_calculette_plus.webp | grep -qi 'Web/P image'

          grep -q "applicationId 'ch.piiwii.rabaisexpress'" rabais-express/app/build.gradle
          grep -q 'versionCode 17' rabais-express/app/build.gradle
          grep -q "versionName '1.6.5'" rabais-express/app/build.gradle
          grep -Fq 'android:label="Calculette+"' rabais-express/app/src/main/AndroidManifest.xml
          grep -q 'settingsButton' rabais-express/app/src/main/res/layout/activity_main.xml
          grep -q 'ratesInternetButton' rabais-express/app/src/main/res/layout/activity_main.xml
          grep -q 'ratesManualSave' rabais-express/app/src/main/res/layout/activity_main.xml
          grep -q 'saveManualRates' rabais-express/app/src/main/java/ch/piiwii/rabais/MainActivity.java
          grep -q 'refreshRatesFromInternet' rabais-express/app/src/main/java/ch/piiwii/rabais/MainActivity.java
          ! grep -q 'requestRatesIfNeeded' rabais-express/app/src/main/java/ch/piiwii/rabais/MainActivity.java
          ! grep -q 'navPlus' rabais-express/app/src/main/res/layout/activity_main.xml
          ! grep -q 'ScrollView' rabais-express/app/src/main/res/layout/activity_main.xml
          sha256sum rabais-express/app/src/main/res/drawable-nodpi/ic_calculette_plus.webp

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned release APK
        working-directory: rabais-express
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Prepare delivery
        run: |
          mkdir -p delivery/signing-tools/lib
          APK='rabais-express/app/build/outputs/apk/release/app-release-unsigned.apk'
          cp "$APK" delivery/Calculette-Plus-1.6.5-UNSIGNED.apk
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" delivery/signing-tools/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/lib/apksigner.jar" delivery/signing-tools/lib/apksigner.jar
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2" delivery/signing-tools/aapt2
          chmod +x delivery/signing-tools/* || true
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2" dump badging "$APK" > delivery/BADGING.txt
          (cd rabais-express && zip -qr ../delivery/Calculette-Plus-1.6.5-SOURCES.zip . -x 'app/build/*' '.gradle/*')
          sha256sum delivery/Calculette-Plus-1.6.5-UNSIGNED.apk delivery/Calculette-Plus-1.6.5-SOURCES.zip > delivery/SHA256-UNSIGNED.txt

      - name: Upload APK source and signing tools
        uses: actions/upload-artifact@v4
        with:
          name: Calculette-Plus-1.6.5-UNSIGNED-TOOLS
          path: delivery/*
          retention-days: 7
          if-no-files-found: error
