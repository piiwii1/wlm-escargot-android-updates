name: WidgEvent 1.5.33 Automatic Priorities APK
on:
  push:
    branches: [ "chatgpt/widgevent-1533-auto" ]
    paths:
      - ".github/workflows/widgevent-1533-build.yml"
      - "widgevent-1533/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
          test -x "$SDKM"
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore base and apply automatic priority patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/widgevent/project"
          cat widgevent-1527/parts/part-*.b64 | base64 -d > "$RUNNER_TEMP/widgevent/source.zip"
          echo "c35a460e7a3663fa4f1c013d0a2d091d26d1d2872c3a1d744620c70c334600d1  $RUNNER_TEMP/widgevent/source.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/widgevent/source.zip" -d "$RUNNER_TEMP/widgevent/project"
          python3 widgevent-1533/apply_1533.py "$RUNNER_TEMP/widgevent/project"
          grep -q 'versionCode = 51' "$RUNNER_TEMP/widgevent/project/app/build.gradle.kts"
          grep -q 'versionName = "1.5.33"' "$RUNNER_TEMP/widgevent/project/app/build.gradle.kts"
      - name: Disable signing on CI, historical key remains local
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path(os.environ['RUNNER_TEMP'])/'widgevent/project/app/build.gradle.kts'
          s=p.read_text()
          old='signingConfig = signingConfigs.getByName("betaRelease")'
          assert s.count(old)==1
          s=s.replace(old,'// CI unsigned release; historical key kept private')
          mark='gradle.taskGraph.whenReady {'
          assert s.count(mark)==1
          s=s[:s.index(mark)]
          p.write_text(s)
          PY
      - name: Compile real release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/widgevent/project"
          gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Align and verify generated APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p widgevent-1533/output
          apk=$(find "$RUNNER_TEMP/widgevent/project/app/build/outputs/apk/release" -maxdepth 1 -name "*.apk" -type f | head -1)
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 "$apk" widgevent-1533/output/WidgEvent-1.5.33-UNSIGNED-ALIGNED.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -p 4 widgevent-1533/output/WidgEvent-1.5.33-UNSIGNED-ALIGNED.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging widgevent-1533/output/WidgEvent-1.5.33-UNSIGNED-ALIGNED.apk | grep "^package: " > widgevent-1533/output/badging.txt
          grep -q "name='ch.piiwii.eventb'" widgevent-1533/output/badging.txt
          grep -q "versionCode='51'" widgevent-1533/output/badging.txt
          sha256sum widgevent-1533/output/*.apk > widgevent-1533/output/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: WidgEvent-1.5.33-UNSIGNED
          path: widgevent-1533/output/*
          retention-days: 7
          if-no-files-found: error
