name: Build PiiWii Code Capture 1.2.3

on:
  push:
    branches: [ "temp-piiwii-code-capture-1.2.3" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Program.cs
        shell: pwsh
        run: |
          $parts = Get-ChildItem PiiWiiWebAssetExtractor/appparts/Program.part* | Sort-Object Name
          $text = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          $text = $text.Replace('PiiWii Code Capture 1.2.1', 'PiiWii Code Capture 1.2.3')
          [IO.File]::WriteAllText((Join-Path $PWD 'PiiWiiWebAssetExtractor/app/Program.cs'), $text, [Text.UTF8Encoding]::new($false))

      - name: Reconstruct application icon
        shell: pwsh
        run: |
          $b64 = Get-Content 'PiiWiiWebAssetExtractor/app/app.ico.b64' -Raw
          [IO.File]::WriteAllBytes((Join-Path $PWD 'PiiWiiWebAssetExtractor/app/app.ico'), [Convert]::FromBase64String($b64))

      - name: Expand icon to 256px
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $path = Join-Path $PWD 'PiiWiiWebAssetExtractor/app/app.ico'
          $tmp = Join-Path $PWD 'PiiWiiWebAssetExtractor/app/app-base.ico'
          Copy-Item $path $tmp -Force
          $ico = New-Object System.Drawing.Icon($tmp)
          $src = $ico.ToBitmap()
          $bmp = New-Object System.Drawing.Bitmap(256,256,[System.Drawing.Imaging.PixelFormat]::Format32bppArgb)
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.Clear([System.Drawing.Color]::Transparent)
          $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::NearestNeighbor
          $g.PixelOffsetMode = [System.Drawing.Drawing2D.PixelOffsetMode]::HighQuality
          $g.DrawImage($src,0,0,256,256)
          $g.Dispose()
          $ms = New-Object IO.MemoryStream
          $bmp.Save($ms,[System.Drawing.Imaging.ImageFormat]::Png)
          $png = $ms.ToArray()
          $ms.Dispose(); $bmp.Dispose(); $src.Dispose(); $ico.Dispose()
          $fs = [IO.File]::Open($path,[IO.FileMode]::Create)
          $bw = New-Object IO.BinaryWriter($fs)
          $bw.Write([UInt16]0); $bw.Write([UInt16]1); $bw.Write([UInt16]1)
          $bw.Write([byte]0); $bw.Write([byte]0); $bw.Write([byte]0); $bw.Write([byte]0)
          $bw.Write([UInt16]1); $bw.Write([UInt16]32)
          $bw.Write([UInt32]$png.Length); $bw.Write([UInt32]22)
          $bw.Write([byte[]]$png)
          $bw.Flush(); $bw.Dispose(); $fs.Dispose()
          Remove-Item $tmp -Force
          Write-Host "Icone 256x256 creee : $((Get-Item $path).Length) octets"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore PiiWiiWebAssetExtractor/app/PiiWiiWebAssetExtractor.csproj

      - name: Build Release x64
        run: dotnet build PiiWiiWebAssetExtractor/app/PiiWiiWebAssetExtractor.csproj -c Release -p:Platform=x64 --no-restore

      - name: Publish
        run: dotnet publish PiiWiiWebAssetExtractor/app/PiiWiiWebAssetExtractor.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o PiiWiiWebAssetExtractor/publish

      - name: Smoke-check executable and icon
        shell: pwsh
        run: |
          $exe = 'PiiWiiWebAssetExtractor/publish/PiiWii-Code-Capture.exe'
          if (!(Test-Path $exe)) { throw 'EXE absent' }
          if ((Get-Item $exe).Length -lt 10000) { throw 'EXE anormalement petit' }
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path $exe))
          if ($null -eq $icon) { throw 'Icone EXE absente' }
          Write-Host "Icone EXE : $($icon.Width)x$($icon.Height)"

      - name: Create portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path PiiWiiWebAssetExtractor/dist | Out-Null
          Compress-Archive -Path PiiWiiWebAssetExtractor/publish/* -DestinationPath PiiWiiWebAssetExtractor/dist/PiiWii-Code-Capture-1.2.3-PORTABLE.zip -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "PiiWiiWebAssetExtractor\installer\PiiWii-Web-Asset-Extractor.iss"'

      - name: Create source ZIP
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP 'PiiWii-Code-Capture-SOURCES'
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          Copy-Item PiiWiiWebAssetExtractor/app -Destination $tmp -Recurse
          Copy-Item PiiWiiWebAssetExtractor/installer -Destination $tmp -Recurse
          Compress-Archive -Path "$tmp/*" -DestinationPath PiiWiiWebAssetExtractor/dist/PiiWii-Code-Capture-1.2.3-SOURCES.zip -Force

      - name: SHA-256
        shell: pwsh
        run: |
          Get-ChildItem PiiWiiWebAssetExtractor/dist -File | ForEach-Object {
            $h = Get-FileHash $_.FullName -Algorithm SHA256
            "$($h.Hash.ToLower())  $($_.Name)"
          } | Set-Content PiiWiiWebAssetExtractor/dist/SHA256SUMS.txt
          Get-Content PiiWiiWebAssetExtractor/dist/SHA256SUMS.txt

      - name: Upload deliverables
        uses: actions/upload-artifact@v4
        with:
          name: PiiWii-Code-Capture-1.2.3
          path: PiiWiiWebAssetExtractor/dist/*
          if-no-files-found: error
          retention-days: 30
