name: Reveo Toolchain Export

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/reveo-toolchain-export.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Download Gradle 8.9
        run: |
          curl -L --fail --retry 3 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle-home

      - name: Package toolchain
        run: |
          mkdir -p /tmp/reveo-toolchain/android-sdk /tmp/reveo-toolchain/gradle
          cp -a "$ANDROID_HOME/platforms/android-35" /tmp/reveo-toolchain/android-sdk/
          cp -a "$ANDROID_HOME/build-tools/35.0.0" /tmp/reveo-toolchain/android-sdk/
          cp -a "$ANDROID_HOME/platform-tools" /tmp/reveo-toolchain/android-sdk/
          cp -a /tmp/gradle-home/gradle-8.9 /tmp/reveo-toolchain/gradle/
          tar -C /tmp -czf /tmp/reveo-toolchain.tar.gz reveo-toolchain
          ls -lh /tmp/reveo-toolchain.tar.gz

      - name: Upload toolchain
        uses: actions/upload-artifact@v4
        with:
          name: reveo-toolchain-linux
          path: /tmp/reveo-toolchain.tar.gz
          retention-days: 1
          if-no-files-found: error
