name: GTI Speedometer Delivery Relay

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/gti-speedometer-delivery-relay.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout delivery repository
        uses: actions/checkout@v4

      - name: Download and verify signed APK
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 20 'https://litter.catbox.moe/m0aumi.apk' -o /tmp/Compteur-GTI-1.0.0.apk
          echo '720c943dc4619e0ec6f153bd5948e3ab942e138e53901823dcad4f787bd67de6  /tmp/Compteur-GTI-1.0.0.apk' | sha256sum -c -

      - name: Keep verified public repository copy
        run: |
          set -euo pipefail
          mkdir -p piiwii-delivery/gti-speedometer
          cp /tmp/Compteur-GTI-1.0.0.apk piiwii-delivery/gti-speedometer/Compteur-GTI-1.0.0.apk
          git config user.name 'PiiWii Delivery Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add piiwii-delivery/gti-speedometer/Compteur-GTI-1.0.0.apk
          if ! git diff --cached --quiet; then
            git commit -m 'Deliver Compteur GTI 1.0.0 signed APK'
            git push origin HEAD:main
          fi

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Compteur-GTI-1.0.0
          path: /tmp/Compteur-GTI-1.0.0.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
