name: Build DriveBox RC26 Square Parking Widget

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/drivebox-rc26-widget-square.yml'
      - '.github/workflows/drivebox-rc18-countries-compact.yml'
      - 'drivebox-ci/rc20-part*.b64'
      - 'drivebox-ci/rc21-parking-ergonomy.patch.gz.b64'
      - 'drivebox-ci/rc22-part*.b64'
      - 'drivebox-ci/rc23-parking-single-screen.patch.gz.b64'
      - 'drivebox-ci/rc24-parking-tariff-alarm.patch.gz.b64'
      - 'drivebox-ci/rc25-parking-readable.patch.gz.b64'
      - 'drivebox-ci/rc26-parking-square-widget.patch.gz.b64'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct RC25 source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/drivebox-rc18-countries-compact.yml').read_text()
          def extract(step_name, out):
              marker = '      - name: ' + step_name + '\n'
              start = text.index(marker)
              run_start = text.index('        run: |\n', start) + len('        run: |\n')
              end = text.find('\n      - ', run_start)
              if end < 0: end = len(text)
              block = text[run_start:end]
              lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
              Path(out).write_text('\n'.join(lines) + '\n')
          extract('Reconstruct validated RC17 source', '/tmp/rc18-base.sh')
          extract('Apply RC18 countries and compact motorway signs', '/tmp/rc18-apply.sh')
          PY
          bash /tmp/rc18-base.sh
          bash /tmp/rc18-apply.sh
          cat drivebox-ci/rc20-part{1..8}.b64 | tr -d '\r\n' | base64 -d | gzip -d > /tmp/rc20.patch
          (cd /tmp/drivebox-src && patch -p1 < /tmp/rc20.patch)
          printf 'android.useAndroidX=true\nandroid.enableJetifier=true\n' > /tmp/drivebox-src/gradle.properties
          base64 -d drivebox-ci/rc21-parking-ergonomy.patch.gz.b64 | gzip -d > /tmp/rc21.patch
          (cd /tmp/drivebox-src && patch -p1 < /tmp/rc21.patch)
          cat drivebox-ci/rc22-part{1..5}.b64 | tr -d '\r\n' | base64 -d | gzip -d > /tmp/rc22.patch
          (cd /tmp/drivebox-src && patch -p1 < /tmp/rc22.patch)
          for pair in \
            'drivebox-ci/rc23-parking-single-screen.patch.gz.b64:/tmp/rc23.patch' \
            'drivebox-ci/rc24-parking-tariff-alarm.patch.gz.b64:/tmp/rc24.patch' \
            'drivebox-ci/rc25-parking-readable.patch.gz.b64:/tmp/rc25.patch'; do
            src="${pair%%:*}"; out="${pair##*:}"
            base64 -d "$src" | gzip -d > "$out"
            (cd /tmp/drivebox-src && patch -p1 < "$out")
          done
          grep -q 'versionCode 34' /tmp/drivebox-src/app/build.gradle
          grep -q "versionName '1.0.0-rc25'" /tmp/drivebox-src/app/build.gradle

      - name: Apply RC26 responsive square widget
        shell: bash
        run: |
          set -euo pipefail
          base64 -d drivebox-ci/rc26-parking-square-widget.patch.gz.b64 | gzip -d > /tmp/rc26.patch
          cd /tmp/drivebox-src
          patch -p1 < /tmp/rc26.patch
          JAVA=app/src/main/java/ch/clubvwsuisse/drivebox/DriveBoxParkingWidget.java
          MAIN=app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java
          INFO=app/src/main/res/xml/parking_widget_info.xml
          grep -q 'versionCode 35' app/build.gradle
          grep -q "versionName '1.0.0-rc26'" app/build.gradle
          grep -q 'onAppWidgetOptionsChanged' "$JAVA"
          grep -q 'OPTION_APPWIDGET_MIN_WIDTH' "$JAVA"
          grep -q 'widget_compact' "$JAVA"
          grep -q 'widget_actions' "$JAVA"
          grep -q 'ACTION_WIDGET_MAPS' "$MAIN"
          grep -q 'ACTION_WIDGET_FINISH' "$MAIN"
          grep -q 'targetCellWidth="2"' "$INFO"
          grep -q 'targetCellHeight="2"' "$INFO"
          test -f app/src/main/res/drawable/widget_parking_action.xml
          test -f app/src/main/res/drawable/widget_parking_action_danger.xml
          if grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml; then echo 'Unexpected INTERNET permission'; exit 1; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build RC26
        working-directory: /tmp/drivebox-src
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Verify and package RC26
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/drivebox-src/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/cert.txt
          grep -qi '6699b2b6b15b5e09032b4f54c5c26bbd982a41dc48d5a5093d1501036a474a1e' /tmp/cert.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='ch.clubvwsuisse.drivebox.v1'" /tmp/badging.txt
          grep -q "versionCode='35'" /tmp/badging.txt
          grep -q "versionName='1.0.0-rc26'" /tmp/badging.txt
          grep -q "application-label:'DriveBox'" /tmp/badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | tee /tmp/perms.txt
          if grep -q 'android.permission.INTERNET' /tmp/perms.txt; then echo 'Unexpected INTERNET permission'; exit 1; fi
          unzip -t "$APK"
          unzip -l "$APK" | grep -q 'classes.dex'
          unzip -p "$APK" res/mipmap-xxxhdpi-v4/ic_launcher.webp > /tmp/icon.webp
          test "$(sha256sum /tmp/icon.webp | awk '{print $1}')" = 'ab5bbd86c44f537aae43e60584c39c923cee3e7c855ae887332617158c0e8a05'
          cp "$APK" "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC26.apk"
          rm -rf /tmp/drivebox-src/app/build /tmp/drivebox-src/.gradle
          (cd /tmp/drivebox-src && zip -qr "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC26-source.zip" .)
          sha256sum "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC26.apk" > "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC26.apk.sha256.txt"
          sha256sum "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC26-source.zip" > "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC26-source.zip.sha256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: DriveBox-1.0.0-RC26-SQUARE-WIDGET
          path: |
            DriveBox-1.0.0-RC26.apk
            DriveBox-1.0.0-RC26.apk.sha256.txt
            DriveBox-1.0.0-RC26-source.zip
            DriveBox-1.0.0-RC26-source.zip.sha256.txt
          if-no-files-found: error
          retention-days: 7
