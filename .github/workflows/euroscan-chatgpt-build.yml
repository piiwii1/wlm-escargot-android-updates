name: EuroScan ChatGPT Build 1.3.17

on:
  push:
    branches: [ 'chatgpt/euroscan-1.3.13-redesign' ]
    paths: [ '.github/workflows/euroscan-chatgpt-build.yml' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Recreate EuroScan project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/euroscan
          mkdir -p /tmp/euroscan
          cat .chatgpt-build/euroscan-1.3.17/part00.b64 .chatgpt-build/euroscan-1.3.17/part01.b64 .chatgpt-build/euroscan-1.3.17/part02.b64 .chatgpt-build/euroscan-1.3.17/part03.b64 | base64 -d | tar -xJ -C /tmp/euroscan
          ROOT="$(dirname "$(find /tmp/euroscan -name settings.gradle -print -quit)")"
          test -f "$ROOT/settings.gradle"
          # The second user-provided logo is the in-app brand mark; keep the first image for the launcher icon.
          sed -i 's/appIcon.setImageResource(R.drawable.euroscan_icon);/appIcon.setImageResource(R.drawable.euroscan_mark);/' "$ROOT/app/src/main/java/ch/piiwii/euroscan/MainActivity.java"
          echo "EU_ROOT=$ROOT" >> "$GITHUB_ENV"
          mkdir -p "$ROOT/app/src/main/res/drawable-nodpi"
          python3 - "$ROOT" <<'PY'
          import struct,zlib,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          def png(path,w,h,r,g,b,a=255):
              raw=b''.join(b'\x00'+bytes([r,g,b,a])*w for _ in range(h))
              def ch(t,d):
                  return struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
              data=b'\x89PNG\r\n\x1a\n'+ch(b'IHDR',struct.pack('>IIBBBBB',w,h,8,6,0,0,0))+ch(b'IDAT',zlib.compress(raw))+ch(b'IEND',b'')
              pathlib.Path(path).write_bytes(data)
          base=root/'app/src/main/res/drawable-nodpi'
          png(base/'euroscan_icon.png',32,32,8,54,129)
          png(base/'euroscan_mark.png',32,32,12,78,180)
          png(base/'hero_ball.png',32,32,20,64,160)
          PY
      - name: Build unsigned release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$EU_ROOT"
          gradle --no-daemon --stacktrace :app:assembleRelease
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk /tmp/EuroScan-CH-1.3.17-UNSIGNED.apk
          sha256sum /tmp/EuroScan-CH-1.3.17-UNSIGNED.apk > /tmp/EuroScan-CH-1.3.17-UNSIGNED.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: EuroScan-CH-1.3.17-unsigned
          path: |
            /tmp/EuroScan-CH-1.3.17-UNSIGNED.apk
            /tmp/EuroScan-CH-1.3.17-UNSIGNED.sha256
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
