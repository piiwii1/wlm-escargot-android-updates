name: CI GTI GPS Widget

on:
  push:
    branches: [ci-gti-gps-widget-1.0.0]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source
        shell: bash
        run: |
          set -euo pipefail
          cat ci-gtigps/source-part-* | base64 -d > /tmp/src.zip
          echo '63f3d1eb58e9c027edda799ce840f5dcfa4cf714aa0da12c2c2b7b8c9d7cb44e  /tmp/src.zip' | sha256sum -c -
          mkdir -p /tmp/src
          unzip -q /tmp/src.zip -d /tmp/src
          grep -q "applicationId 'ch.piiwii.gtigps'" /tmp/src/GTI-GPS-Widget-1.0.0/app/build.gradle
          grep -q "versionCode 1" /tmp/src/GTI-GPS-Widget-1.0.0/app/build.gradle
          grep -q "versionName '1.0.0'" /tmp/src/GTI-GPS-Widget-1.0.0/app/build.gradle

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release
        run: gradle -p /tmp/src/GTI-GPS-Widget-1.0.0 --no-daemon --stacktrace clean assembleRelease

      - name: Collect
        shell: bash
        run: |
          cp /tmp/src/GTI-GPS-Widget-1.0.0/app/build/outputs/apk/release/app-release-unsigned.apk GTI-GPS-Widget-1.0.0-unsigned.apk
          sha256sum GTI-GPS-Widget-1.0.0-unsigned.apk > GTI-GPS-Widget-1.0.0-unsigned.apk.sha256

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: GTI-GPS-Widget-1.0.0-unsigned
          if-no-files-found: error
          retention-days: 3
          path: |
            GTI-GPS-Widget-1.0.0-unsigned.apk
            GTI-GPS-Widget-1.0.0-unsigned.apk.sha256
