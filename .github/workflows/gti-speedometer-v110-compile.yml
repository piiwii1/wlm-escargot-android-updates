      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile
        working-directory: piiwii-delivery/gti-speedometer/v110-src
        run: gradle --no-daemon clean assembleRelease

      - name: Package delivery
        shell: bash
        run: |
          set -euo pipefail
          P='piiwii-delivery/gti-speedometer/v110-src'
          mkdir -p /tmp/gti-delivery
          cp "$P/app/build/outputs/apk/release/app-release-unsigned.apk" /tmp/gti-delivery/Compteur-GTI-1.1.0-UNSIGNED.apk
          (cd "$P" && zip -qr /tmp/gti-delivery/Compteur-GTI-1.1.0-SOURCE.zip . -x 'app/build/*' '.gradle/*' 'build/*')
          sha256sum /tmp/gti-delivery/Compteur-GTI-1.1.0-UNSIGNED.apk /tmp/gti-delivery/Compteur-GTI-1.1.0-SOURCE.zip

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Compteur-GTI-1.1.0-build
          path: /tmp/gti-delivery/*
          retention-days: 1
          compression-level: 0
