name: Build DriveBox RC30 Parking Fixes V2

on:
  push:
    branches: [ drivebox-rc30-parking-fixes ]
    paths:
      - '.github/workflows/drivebox-rc30-parking-fixes-v2.yml'
      - 'drivebox-ci/rc30-parking-fixes-v2.patch.gz.b64'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore validated RC29 source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9626399190/zip" \
            -o /tmp/rc29-artifact.zip
          rm -rf /tmp/rc29-artifact /tmp/drivebox-src
          mkdir -p /tmp/rc29-artifact /tmp/drivebox-src
          unzip -oq /tmp/rc29-artifact.zip -d /tmp/rc29-artifact
          unzip -oq /tmp/rc29-artifact/DriveBox-1.0.0-RC29-source.zip -d /tmp/drivebox-src
          grep -q 'versionCode 38' /tmp/drivebox-src/app/build.gradle
          grep -q "versionName '1.0.0-rc29'" /tmp/drivebox-src/app/build.gradle

      - name: Apply complete RC30 parking fixes
        shell: bash
        run: |
          set -euo pipefail
          base64 -d drivebox-ci/rc30-parking-fixes-v2.patch.gz.b64 | gzip -d > /tmp/rc30.patch
          test "$(sha256sum /tmp/rc30.patch | awk '{print $1}')" = '47ac71581404ff2ae998ab8ad2442b919cb77432ed6d7a5547d09943dffc2233'
          cd /tmp/drivebox-src
          patch -p1 < /tmp/rc30.patch
          grep -q 'versionCode 39' app/build.gradle
          grep -q "versionName '1.0.0-rc30'" app/build.gradle
          test -s app/src/main/java/ch/clubvwsuisse/drivebox/ParkingExpiryAlarmService.java
          test -s app/src/main/java/ch/clubvwsuisse/drivebox/ParkingPhotoStore.java
          grep -q 'ParkingExpiryAlarmService' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.SCHEDULE_EXACT_ALARM' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK' app/src/main/AndroidManifest.xml
          grep -q 'DriveBox' app/src/main/java/ch/clubvwsuisse/drivebox/ParkingPhotoStore.java
          grep -q 'exportToGallery' app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java
          grep -q 'DriveBoxParkingWidget.updateAll(this)' app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java
          grep -q 'square_photo' app/src/main/java/ch/clubvwsuisse/drivebox/ParkingWidgetRenderer.java
          grep -q 'full_info' app/src/main/res/layout/widget_parking_full.xml
          grep -q 'ZONE BLEUE' app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java
          grep -q '"1 H", "4 H", "10 H"' app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java
          grep -q 'PERSO' app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java
          grep -q '10 minutes' app/src/main/java/ch/clubvwsuisse/drivebox/ParkingAlarmReceiver.java
          grep -q 'setLooping(true)' app/src/main/java/ch/clubvwsuisse/drivebox/ParkingExpiryAlarmService.java
          if grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml; then echo 'Unexpected INTERNET permission'; exit 1; fi
          if grep -q 'android.permission.ACCESS_BACKGROUND_LOCATION' app/src/main/AndroidManifest.xml; then echo 'Unexpected background location permission'; exit 1; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build RC30
        working-directory: /tmp/drivebox-src
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Verify and package RC30
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/drivebox-src/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/cert.txt
          grep -qi '6699b2b6b15b5e09032b4f54c5c26bbd982a41dc48d5a5093d1501036a474a1e' /tmp/cert.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='ch.clubvwsuisse.drivebox.v1'" /tmp/badging.txt
          grep -q "versionCode='39'" /tmp/badging.txt
          grep -q "versionName='1.0.0-rc30'" /tmp/badging.txt
          grep -q "application-label:'DriveBox'" /tmp/badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | tee /tmp/perms.txt
          grep -q 'android.permission.CAMERA' /tmp/perms.txt
          grep -q 'android.permission.ACCESS_COARSE_LOCATION' /tmp/perms.txt
          grep -q 'android.permission.ACCESS_FINE_LOCATION' /tmp/perms.txt
          grep -q 'android.permission.POST_NOTIFICATIONS' /tmp/perms.txt
          grep -q 'android.permission.SCHEDULE_EXACT_ALARM' /tmp/perms.txt
          grep -q 'android.permission.FOREGROUND_SERVICE' /tmp/perms.txt
          grep -q 'android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK' /tmp/perms.txt
          grep -q 'android.permission.VIBRATE' /tmp/perms.txt
          if grep -q 'android.permission.INTERNET' /tmp/perms.txt; then echo 'Unexpected INTERNET permission'; exit 1; fi
          if grep -q 'android.permission.ACCESS_BACKGROUND_LOCATION' /tmp/perms.txt; then echo 'Unexpected background location permission'; exit 1; fi
          unzip -t "$APK"
          unzip -p "$APK" res/mipmap-xxxhdpi-v4/ic_launcher.webp > /tmp/icon.webp
          test "$(sha256sum /tmp/icon.webp | awk '{print $1}')" = 'ab5bbd86c44f537aae43e60584c39c923cee3e7c855ae887332617158c0e8a05'
          cp "$APK" "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC30.apk"
          rm -rf /tmp/drivebox-src/app/build /tmp/drivebox-src/.gradle
          (cd /tmp/drivebox-src && zip -qr "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC30-source.zip" .)
          sha256sum "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC30.apk" > "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC30.apk.sha256.txt"
          sha256sum "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC30-source.zip" > "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC30-source.zip.sha256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: DriveBox-1.0.0-RC30-PARKING-FIXES
          path: |
            DriveBox-1.0.0-RC30.apk
            DriveBox-1.0.0-RC30.apk.sha256.txt
            DriveBox-1.0.0-RC30-source.zip
            DriveBox-1.0.0-RC30-source.zip.sha256.txt
          if-no-files-found: error
          retention-days: 7
