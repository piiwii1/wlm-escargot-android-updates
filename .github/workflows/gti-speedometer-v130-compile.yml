name: Compteur GTI 1.3.0 Compile

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/gti-speedometer-v130-compile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Rebuild source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/gti130
          sha256sum .gti130/source.part*
          cat .gti130/source.part00 .gti130/source.part01 .gti130/source.part02 .gti130/source.part03 .gti130/source.part04 > /tmp/gti130.b64
          test "$(wc -c < /tmp/gti130.b64)" = "25236"
          base64 -d /tmp/gti130.b64 > /tmp/Compteur-GTI-1.3.0-SOURCE.zip
          sha256sum /tmp/Compteur-GTI-1.3.0-SOURCE.zip
          unzip -t /tmp/Compteur-GTI-1.3.0-SOURCE.zip
          unzip -q /tmp/Compteur-GTI-1.3.0-SOURCE.zip -d build/gti130

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p build/gti130 :app:assembleRelease --no-daemon
          mkdir -p delivery
          cp build/gti130/app/build/outputs/apk/release/app-release-unsigned.apk delivery/Compteur-GTI-1.3.0-UNSIGNED.apk
          cp /tmp/Compteur-GTI-1.3.0-SOURCE.zip delivery/Compteur-GTI-1.3.0-SOURCE.zip
          sha256sum delivery/*

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Compteur-GTI-1.3.0-build
          path: delivery/*
          retention-days: 1
          if-no-files-found: error
