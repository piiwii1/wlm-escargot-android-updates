name: PiiWii NFC 1.0.35 Render Check

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/piiwii-nfc-135-render-check.yml'

permissions:
  contents: write
  actions: read

jobs:
  render:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download 1.0.35 sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/render135src" "$GITHUB_WORKSPACE/render135out" /tmp/base135 /tmp/base135.zip
          mkdir -p "$GITHUB_WORKSPACE/render135src" "$GITHUB_WORKSPACE/render135out" /tmp/base135
          ART_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts | map(select(.name == "PiiWii-NFC-1.0.35-build" and .expired == false)) | sort_by(.created_at) | reverse | .[0].id // empty')
          test -n "$ART_ID"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$ART_ID/zip" > /tmp/base135.zip
          unzip -q /tmp/base135.zip -d /tmp/base135
          SRCZIP=$(find /tmp/base135 -type f -name 'PiiWii-NFC-1.0.35-SOURCES-BUILD.zip' -print -quit)
          test -n "$SRCZIP"
          unzip -q "$SRCZIP" -d "$GITHUB_WORKSPACE/render135src"
          test -d "$GITHUB_WORKSPACE/render135src/PiiWii-NFC-1.0.35"

      - name: Build debug APK for render only
        working-directory: render135src/PiiWii-NFC-1.0.35
        run: |
          set -euo pipefail
          gradle --no-daemon assembleDebug
          APK=$(find "$GITHUB_WORKSPACE/render135src/PiiWii-NFC-1.0.35/app/build/outputs/apk" -type f -name '*.apk' -print -quit)
          test -n "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/render135out/app-render.apk"
          ls -lh "$GITHUB_WORKSPACE/render135out/app-render.apk"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Render app in Android emulator
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set +e
            OUT="$GITHUB_WORKSPACE/render135out"
            APK="$OUT/app-render.apk"
            mkdir -p "$OUT"
            echo "APK=$APK" > "$OUT/diagnostic.txt"
            echo "=== DEVICES ===" >> "$OUT/diagnostic.txt"
            adb devices -l >> "$OUT/diagnostic.txt" 2>&1
            ls -lh "$APK" >> "$OUT/diagnostic.txt" 2>&1
            adb install -r "$APK" >> "$OUT/diagnostic.txt" 2>&1
            adb shell wm size 1080x2400 >> "$OUT/diagnostic.txt" 2>&1
            adb shell wm density 420 >> "$OUT/diagnostic.txt" 2>&1
            adb shell settings put system font_scale 1.0 >> "$OUT/diagnostic.txt" 2>&1
            adb shell am force-stop ch.piiwii.nfc.app >> "$OUT/diagnostic.txt" 2>&1
            adb shell monkey -p ch.piiwii.nfc.app -c android.intent.category.LAUNCHER 1 >> "$OUT/diagnostic.txt" 2>&1
            sleep 7
            adb shell dumpsys window windows | grep -E 'mCurrentFocus|mFocusedApp' >> "$OUT/diagnostic.txt" 2>&1
            adb exec-out screencap -p > "$OUT/home.png" 2>> "$OUT/diagnostic.txt"
            adb shell uiautomator dump /sdcard/window.xml >> "$OUT/diagnostic.txt" 2>&1
            adb pull /sdcard/window.xml "$OUT/window.xml" >> "$OUT/diagnostic.txt" 2>&1
            adb logcat -d -t 500 > "$OUT/logcat.txt" 2>&1
            file "$OUT/home.png" >> "$OUT/diagnostic.txt" 2>&1
            ls -lh "$OUT" >> "$OUT/diagnostic.txt" 2>&1

            publish_file() {
              local SRC="$1"
              local DEST="$2"
              [ -s "$SRC" ] || return 0
              local B64 SHA
              B64=$(base64 -w0 "$SRC")
              SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${DEST}" --jq '.sha' 2>/dev/null || true)
              if [ -n "$SHA" ]; then
                gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${DEST}" -f message="Update PiiWii NFC render check" -f content="$B64" -f sha="$SHA" >/dev/null
              else
                gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${DEST}" -f message="Add PiiWii NFC render check" -f content="$B64" >/dev/null
              fi
            }

            publish_file "$OUT/home.png" "piiwii-nfc-public/render-check/home.png"
            publish_file "$OUT/diagnostic.txt" "piiwii-nfc-public/render-check/diagnostic.txt"
            publish_file "$OUT/window.xml" "piiwii-nfc-public/render-check/window.xml"
            exit 0

      - name: Upload render check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PiiWii-NFC-1.0.35-render-check
          path: render135out/
          retention-days: 7
          if-no-files-found: warn
