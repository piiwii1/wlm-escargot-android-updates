name: PiiWii NFC 1.0.35 Render Check

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/piiwii-nfc-135-render-check.yml'

permissions:
  contents: read
  actions: read

jobs:
  render:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download 1.0.35 sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/nfc135render /tmp/base135 /tmp/base135.zip /tmp/render135
          mkdir -p /tmp/nfc135render /tmp/base135 /tmp/render135
          ART_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts | map(select(.name == "PiiWii-NFC-1.0.35-build" and .expired == false)) | sort_by(.created_at) | reverse | .[0].id // empty')
          test -n "$ART_ID"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$ART_ID/zip" > /tmp/base135.zip
          unzip -q /tmp/base135.zip -d /tmp/base135
          SRCZIP=$(find /tmp/base135 -type f -name 'PiiWii-NFC-1.0.35-SOURCES-BUILD.zip' -print -quit)
          test -n "$SRCZIP"
          unzip -q "$SRCZIP" -d /tmp/nfc135render
          test -d /tmp/nfc135render/PiiWii-NFC-1.0.35

      - name: Build debug APK for render only
        working-directory: /tmp/nfc135render/PiiWii-NFC-1.0.35
        run: gradle --no-daemon assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Render app in Android emulator
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set +e
            APK=/tmp/nfc135render/PiiWii-NFC-1.0.35/app/build/outputs/apk/debug/app-debug.apk
            echo "=== DEVICES ===" > /tmp/render135/diagnostic.txt
            adb devices -l >> /tmp/render135/diagnostic.txt 2>&1
            adb install -r "$APK" >> /tmp/render135/diagnostic.txt 2>&1
            adb shell wm size 1080x2400 >> /tmp/render135/diagnostic.txt 2>&1
            adb shell wm density 420 >> /tmp/render135/diagnostic.txt 2>&1
            adb shell settings put system font_scale 1.0 >> /tmp/render135/diagnostic.txt 2>&1
            adb shell am force-stop ch.piiwii.nfc.app >> /tmp/render135/diagnostic.txt 2>&1
            adb shell monkey -p ch.piiwii.nfc.app -c android.intent.category.LAUNCHER 1 >> /tmp/render135/diagnostic.txt 2>&1
            sleep 7
            adb shell dumpsys window windows | grep -E 'mCurrentFocus|mFocusedApp' >> /tmp/render135/diagnostic.txt 2>&1
            adb shell dumpsys activity activities | head -120 >> /tmp/render135/diagnostic.txt 2>&1
            adb exec-out screencap -p > /tmp/render135/home.png 2>> /tmp/render135/diagnostic.txt
            adb shell uiautomator dump /sdcard/window.xml >> /tmp/render135/diagnostic.txt 2>&1
            adb pull /sdcard/window.xml /tmp/render135/window.xml >> /tmp/render135/diagnostic.txt 2>&1
            adb logcat -d -t 500 > /tmp/render135/logcat.txt 2>&1
            file /tmp/render135/home.png >> /tmp/render135/diagnostic.txt 2>&1
            ls -lh /tmp/render135 >> /tmp/render135/diagnostic.txt 2>&1
            exit 0

      - name: Upload render check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PiiWii-NFC-1.0.35-render-check
          path: /tmp/render135/
          retention-days: 7
          if-no-files-found: warn
