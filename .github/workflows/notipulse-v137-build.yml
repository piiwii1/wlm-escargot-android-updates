          base64 -d notification-widget-v124-patch/ui124.b64 > /tmp/ui124.diff.xz
          echo "be25e061ceeaeac375819ae11c80d4e8cf90ede51fc528bdce204791129b3c91  /tmp/ui124.diff.xz" | sha256sum -c -
          xz -dc /tmp/ui124.diff.xz > /tmp/ui124.diff
          patch --batch -p1 --directory=piiwii-notification-widget-v124 < /tmp/ui124.diff
          grep -q "versionCode 25" piiwii-notification-widget-v124/app/build.gradle
          python3 - <<'PY'
