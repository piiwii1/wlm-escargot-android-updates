name: NotiPulse 1.0.37 - Music Theme, Icons and Harmonization
on:
  push:
    branches: [chatgpt/notipulse-v137-unified-icons]
    paths:
      - 'notipulse-v137-unified-icons/**'
      - '.github/workflows/notipulse-v137-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Android SDK
        run: |
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore 1.0.4 source exactly then apply new bottom navigation
        shell: bash
        run: |
          set -euo pipefail
          cp -a piiwii-notification-widget-v101 piiwii-notification-widget-v104
          cat notification-widget-v102-patch/part-* | base64 -d > /tmp/widget102.tar.xz
          echo "74fe74bb99e989af513a435892931a3c36324c5392604222df33bef3503f8b90  /tmp/widget102.tar.xz" | sha256sum -c -
          tar -xJf /tmp/widget102.tar.xz -C piiwii-notification-widget-v104
          cp -a piiwii-notification-widget-v104 piiwii-notification-widget-v103
          python3 notification-widget-v103-ui/patch.py
          cp -a piiwii-notification-widget-v103/. piiwii-notification-widget-v104/
          cp notification-widget-v104-patch/EphemeralEvents.java piiwii-notification-widget-v104/app/src/main/java/ch/piiwii/notificationwidget/
          python3 notification-widget-v104-patch/engine.py
          python3 notification-widget-v104-patch/ui.py
          cp -a piiwii-notification-widget-v104 piiwii-notification-widget-v105
          python3 notification-widget-v105/patch_nav.py
          grep -q "versionCode 6" piiwii-notification-widget-v105/app/build.gradle
          grep -q "R.drawable.nav_home" piiwii-notification-widget-v105/app/src/main/java/ch/piiwii/notificationwidget/MainActivity.java
          grep -q "void showDisplayModeCard" piiwii-notification-widget-v105/app/src/main/java/ch/piiwii/notificationwidget/MainActivity.java
          cp -a piiwii-notification-widget-v105 piiwii-notification-widget-v106
          python3 notification-widget-v106-fix/repair106.py
          cp -a piiwii-notification-widget-v106 piiwii-notification-widget-v107
          cp notification-widget-v107-patch/SpotifyMedia.java piiwii-notification-widget-v107/app/src/main/java/ch/piiwii/notificationwidget/SpotifyMedia.java
          python3 notification-widget-v107-patch/apply.py
          grep -q 'versionCode 8' piiwii-notification-widget-v107/app/build.gradle
          grep -q 'SpotifyMedia.start' piiwii-notification-widget-v107/app/src/main/java/ch/piiwii/notificationwidget/NotificationMonitor.java
          grep -q 'SpotifyMedia.playingPick' piiwii-notification-widget-v107/app/src/main/java/ch/piiwii/notificationwidget/WidgetProvider.java
          cp -a piiwii-notification-widget-v107 piiwii-notification-widget-v108
          base64 -d notification-widget-v108-patch/patch108.b64 > /tmp/patch108.tar.xz
          echo "769f3048504c4d22ce16fda64b7935ddbe5e626b3ad350225e810e4a3d2987ec  /tmp/patch108.tar.xz" | sha256sum -c -
          mkdir -p /tmp/widget108
          tar -xJf /tmp/patch108.tar.xz -C /tmp/widget108
          patch -p1 --directory=piiwii-notification-widget-v108 < /tmp/widget108/patch108.diff
          cp /tmp/widget108/verify_features.py piiwii-notification-widget-v108/verify_features.py
          python3 piiwii-notification-widget-v108/verify_features.py
          cp -a piiwii-notification-widget-v108 piiwii-notification-widget-v109
          base64 -d notification-widget-v109-patch/delta109.b64 > /tmp/delta109.tar.xz
          echo "f42880facc7ea04c7081213a02ebad861e53cce500125a878cf630b844fca906  /tmp/delta109.tar.xz" | sha256sum -c -
          mkdir -p /tmp/delta109
          tar -xJf /tmp/delta109.tar.xz -C /tmp/delta109
          patch -p1 --directory=piiwii-notification-widget-v109 < /tmp/delta109/delta109.diff
          cp /tmp/delta109/app/src/main/java/ch/piiwii/notificationwidget/NotificationRules.java piiwii-notification-widget-v109/app/src/main/java/ch/piiwii/notificationwidget/
          mkdir -p piiwii-notification-widget-v109/tests
          cp /tmp/delta109/tests/ClassifierRegression.java piiwii-notification-widget-v109/tests/
          grep -q "versionCode 10" piiwii-notification-widget-v109/app/build.gradle
          grep -q "void showHome()" piiwii-notification-widget-v109/app/src/main/java/ch/piiwii/notificationwidget/MainActivity.java
          grep -q "void showTests()" piiwii-notification-widget-v109/app/src/main/java/ch/piiwii/notificationwidget/MainActivity.java
          cp -a piiwii-notification-widget-v109 piiwii-notification-widget-v110
          base64 -d notification-widget-v110-patch/delta110.b64 > /tmp/delta110.tar.xz
          echo "fb8351b9c30001c9f590d7a627df11c72c823ff2134e6ea33702d5a10fc2f416  /tmp/delta110.tar.xz" | sha256sum -c -
          mkdir -p /tmp/delta110
          tar -xJf /tmp/delta110.tar.xz -C /tmp/delta110
          patch --batch -p1 --directory=piiwii-notification-widget-v110 < /tmp/delta110/delta110.diff
          grep -q 'versionCode 11' piiwii-notification-widget-v110/app/build.gradle
          grep -q 'BatteryRules.parse' piiwii-notification-widget-v110/app/src/main/java/ch/piiwii/notificationwidget/WidgetProvider.java
          grep -q 'ACTION_BATTERY_CHANGED' piiwii-notification-widget-v110/app/src/main/java/ch/piiwii/notificationwidget/NotificationMonitor.java
          cp -a piiwii-notification-widget-v110 piiwii-notification-widget-v111
          base64 -d notification-widget-v111-patch/delta111.b64 > /tmp/delta111.diff.xz
          echo "d9a2ac950c6339846ec6bf6f57af4c57913d87b0a777b76dea4dc0c34b9fd5de  /tmp/delta111.diff.xz" | sha256sum -c -
          xz -dc /tmp/delta111.diff.xz > /tmp/delta111.diff
          patch --batch -p1 --directory=piiwii-notification-widget-v111 < /tmp/delta111.diff
          grep -q 'versionCode 12' piiwii-notification-widget-v111/app/build.gradle
          grep -q 'refreshSessions' piiwii-notification-widget-v111/app/src/main/java/ch/piiwii/notificationwidget/SpotifyMedia.java
          grep -q 'messageChannel' piiwii-notification-widget-v111/app/src/main/java/ch/piiwii/notificationwidget/NotificationRules.java
          cp -a piiwii-notification-widget-v111 piiwii-notification-widget-v112
          cp notification-widget-v112-patch/WidgetClickActivity.java piiwii-notification-widget-v112/app/src/main/java/ch/piiwii/notificationwidget/
          cp notification-widget-v112-patch/ClickPolicy.java piiwii-notification-widget-v112/app/src/main/java/ch/piiwii/notificationwidget/
          cp notification-widget-v112-patch/ClickPolicyRegression.java piiwii-notification-widget-v112/tests/
          python3 notification-widget-v112-patch/apply.py
          grep -q 'versionCode 13' piiwii-notification-widget-v112/app/build.gradle
          cp -a piiwii-notification-widget-v112 piiwii-notification-widget-v113
          cat notification-widget-v113-patch/part-* | base64 -d > /tmp/widget113.diff.xz
          echo "695c993f9b09d98e092536db31a5595846f99a0cdca8204c424e4c6a106adbcd  /tmp/widget113.diff.xz" | sha256sum -c -
          xz -dc /tmp/widget113.diff.xz > /tmp/widget113.diff
          # The last added test file had no final newline; patch requires a newline terminator.
          printf '\n' >> /tmp/widget113.diff
          patch --batch -p1 --directory=piiwii-notification-widget-v113 < /tmp/widget113.diff
          # Legacy unified diff joins a /dev/null header to the two XML closing tags.
          # Remove that exact patch artifact, and parse both XMLs before compilation.
          for layout in widget_large widget_wide; do
            sed -i 's@</LinearLayout>--- /dev/null@</LinearLayout>@' "piiwii-notification-widget-v113/app/src/main/res/layout/$layout.xml"
            python3 -c 'import sys,xml.etree.ElementTree as e;e.parse(sys.argv[1])' "piiwii-notification-widget-v113/app/src/main/res/layout/$layout.xml"
          done
          grep -q 'versionCode 14' piiwii-notification-widget-v113/app/build.gradle
          grep -q 'void showAppsCard()' piiwii-notification-widget-v113/app/src/main/java/ch/piiwii/notificationwidget/MainActivity.java
          grep -q 'void showWidgetProfilesCard()' piiwii-notification-widget-v113/app/src/main/java/ch/piiwii/notificationwidget/MainActivity.java
          for layout in widget widget_wide widget_large; do test -s piiwii-notification-widget-v113/app/src/main/res/layout/$layout.xml; done
          cp -a piiwii-notification-widget-v113 piiwii-notification-widget-v114
          base64 -d notification-widget-v114-patch/delta114.b64 > /tmp/delta114.diff.xz
          echo "91d0cf020b81a34d63e55e96d9a8c06f1bdfa59c8862fba52812b76bd5423014  /tmp/delta114.diff.xz" | sha256sum -c -
          xz -dc /tmp/delta114.diff.xz > /tmp/delta114.diff
          patch --batch -p1 --directory=piiwii-notification-widget-v114 < /tmp/delta114.diff
          grep -q "versionCode 15" piiwii-notification-widget-v114/app/build.gradle
          grep -q "void fillGalleryGrid(" piiwii-notification-widget-v114/app/src/main/java/ch/piiwii/notificationwidget/MainActivity.java
          grep -q "GraphicIcons.draw" piiwii-notification-widget-v114/app/src/main/java/ch/piiwii/notificationwidget/IconRenderer.java
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          root=Path('piiwii-notification-widget-v114/app/src/main/res/drawable')
          files=list(root.glob('pic_*.xml'))
          assert len(files)==24, len(files)
          for f in files: ET.parse(f)
          java=Path('piiwii-notification-widget-v114/app/src/main/java/ch/piiwii/notificationwidget/MainActivity.java').read_text()
          assert all(token in java for token in ('if(tab==0)showHome();','else if(tab==1)showCategories();','else if(tab==2)showAppearance();','else showTests();','root.addView(navSurface,navPosition)'))
          print('24 native graphics and 4/4 page dispatch verified')
          PY
          cp -a piiwii-notification-widget-v114 piiwii-notification-widget-v115
          python3 notification-widget-v115-patch/apply.py
          grep -q 'versionCode 16' piiwii-notification-widget-v115/app/build.gradle
          grep -q 'void showIntegrationReport' piiwii-notification-widget-v115/app/src/main/java/ch/piiwii/notificationwidget/MainActivity.java
          grep -q 'battery.percent>=0' piiwii-notification-widget-v115/app/src/main/java/ch/piiwii/notificationwidget/WidgetProvider.java
          cp -a piiwii-notification-widget-v115 piiwii-notification-widget-v116
          base64 -d notification-widget-v116-patch/icon-editor.b64 > /tmp/icon-editor-v116.patch.xz
          echo "d96089898ce21561fe3c126cb5ce1779e8c95ba0d6d4504bfebe76c6b575bcba  /tmp/icon-editor-v116.patch.xz" | sha256sum -c -
          xz -dc /tmp/icon-editor-v116.patch.xz > /tmp/icon-editor-v116.patch
          patch --batch -p1 --directory=piiwii-notification-widget-v116 < /tmp/icon-editor-v116.patch
          grep -q "versionCode 17" piiwii-notification-widget-v116/app/build.gradle
          grep -q "void saveIconDraft(IconDraft draft)" piiwii-notification-widget-v116/app/src/main/java/ch/piiwii/notificationwidget/MainActivity.java
          grep -q "static Bitmap previewChoice(" piiwii-notification-widget-v116/app/src/main/java/ch/piiwii/notificationwidget/IconRenderer.java
          python3 - <<'PY'
          from pathlib import Path
          main=Path('piiwii-notification-widget-v116/app/src/main/java/ch/piiwii/notificationwidget/MainActivity.java').read_text()
          expected=['if(tab==0)showHome();','else if(tab==1)showCategories();','else if(tab==2)showAppearance();','else showTests();',
                    'root.addView(navSurface,navPosition)','private void saveIconDraft(IconDraft draft)',
                    'iconDialog(Categories.ALL[which][0])','putString("icon_"+draft.id,draft.choice)',
                    'new File(getFilesDir(),draft.tempPhoto).delete()','setPositiveButton("Enregistrer",null)',
                    'setNegativeButton("Annuler"','setNeutralButton("Par défaut",null)']
          for item in expected:assert item in main,item
          assert 'void showGallery(' not in main
          print('PASS: 30-category icon editor, draft preview, save/cancel/reset and preserved four screens')
          PY
          cp -a piiwii-notification-widget-v116 piiwii-notification-widget-v117
          base64 -d notification-widget-v117-patch/ui117.b64 > /tmp/ui117.patch.xz
          echo "264b54cf3be278084a50f722c5f33b49c24b4df8524f87cacbeb375e6a4cd6fb  /tmp/ui117.patch.xz" | sha256sum -c -
          xz -dc /tmp/ui117.patch.xz > /tmp/ui117.patch
          patch --batch -p1 --directory=piiwii-notification-widget-v117 < /tmp/ui117.patch
          grep -q 'versionCode 18' piiwii-notification-widget-v117/app/build.gradle
          python3 - <<'PY'
          from pathlib import Path
          p=Path('piiwii-notification-widget-v117/app/src/main/java/ch/piiwii/notificationwidget/MainActivity.java')
          main=p.read_text()
          assert 'void showInlineIconManager()' in main
          assert 'openGallery.setOnClickListener(v->showInlineIconManager())' in main
          assert 'new AlertDialog.Builder(this).setTitle("Catégorie du pictogramme")' not in main
          profile=main.split('void chooseWidgetProfile(int widgetId){',1)[1].split('void showInlineIconManager(){',1)[0]
          assert '.setItems(' not in profile
          assert 'save.setOnClickListener' in profile and 'cancel.setOnClickListener' in profile
          for token in ['if(tab==0)showHome();','else if(tab==1)showCategories();','else if(tab==2)showAppearance();','else showTests();','root.addView(navSurface,navPosition)','private boolean commitIconDraft(IconDraft draft)']:
              assert token in main,token
          print('PASS: single-window gallery, in-place category edit, full widget settings, drafts, 4 page navigation')
          PY
          cp -a piiwii-notification-widget-v117 piiwii-notification-widget-v118
          base64 -d notification-widget-v118-patch/delta118.b64 > /tmp/delta118.diff.xz
          echo "a4a0336546fe770ff11a9304bcb92ede34c262af7db5133ee4e94245ff786d2b  /tmp/delta118.diff.xz" | sha256sum -c -
          xz -dc /tmp/delta118.diff.xz > /tmp/delta118.diff
          patch --batch -p1 --directory=piiwii-notification-widget-v118 < /tmp/delta118.diff
          python3 notification-widget-v118-patch/fix118.py
          grep -q 'versionCode 19' piiwii-notification-widget-v118/app/build.gradle
          grep -q 'ChargeRules.choose' piiwii-notification-widget-v118/app/src/main/java/ch/piiwii/notificationwidget/WidgetProvider.java
          python3 - <<'PY'
          import re
          from pathlib import Path
          root=Path('piiwii-notification-widget-v118')
          cats=(root/'app/src/main/java/ch/piiwii/notificationwidget/Categories.java').read_text()
          block=cats.split('static final String[][] ALL = {',1)[1].split('};',1)[0]
          assert block.count('{"')==37
          main=(root/'app/src/main/java/ch/piiwii/notificationwidget/MainActivity.java').read_text()
          for token in ['if(tab==0)showHome();','else if(tab==1)showCategories();','else if(tab==2)showAppearance();','else showTests();','root.addView(navSurface,navPosition)','void showInlineIconManager()']:
              assert token in main,token
          assert 'ChargeRules.explanation' in main
          print('PASS: 37 customizable states and preserved 4-page UI')
          PY
          cp -a piiwii-notification-widget-v118 piiwii-notification-widget-v119
          base64 -d notification-widget-v119-patch/scripts119.b64 > /tmp/scripts119.tar.xz
          echo "638a7b9132b6d3dbe3f231e2fcac8c3bfc0ea0c667d1b3472e8ae28f5799bc4d  /tmp/scripts119.tar.xz" | sha256sum -c -
          mkdir -p /tmp/scripts119
          tar -xJf /tmp/scripts119.tar.xz -C /tmp/scripts119
          python3 /tmp/scripts119/implement119.py
          python3 /tmp/scripts119/adjust119.py
          python3 notification-widget-v119-patch/fix119.py
          grep -q "versionCode 20" piiwii-notification-widget-v119/app/build.gradle
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          root=Path('piiwii-notification-widget-v119/app/src/main')
          for xml in root.rglob('*.xml'): ET.parse(xml)
          mf=(root/'AndroidManifest.xml').read_text()
          assert all(n in mf for n in ('WidgetProvider2','WidgetProvider3','WidgetProvider'))
          widget=(root/'java/ch/piiwii/notificationwidget/WidgetProvider.java').read_text()
          assert all(n in widget for n in ('MultiSlotPolicy.compose','renderMulti','R.id.slot_1','R.id.slot_2','R.id.slot_3','allWidgetIds(c)'))
          for n in (2,3):
            assert (root/'res/xml'/f'widget_{n}_info.xml').is_file()
            for orientation in ('horizontal','vertical'):
              assert (root/'res/layout'/f'widget_{n}_{orientation}.xml').is_file()
          home=(root/'java/ch/piiwii/notificationwidget/MainActivity.java').read_text()
          for n in ('if(tab==0)showHome();','else if(tab==1)showCategories();','else if(tab==2)showAppearance();','else showTests();','root.addView(navSurface,navPosition)','void showInlineIconManager()'):
            assert n in home,n
          print('PASS: 3 picker entries, separate slot tap areas, 4 screens and all XMLs')
          PY
          cp -a piiwii-notification-widget-v119 piiwii-notification-widget-v120
          base64 -d notification-widget-v120-patch/delta120.b64 > /tmp/delta120.diff.xz
          echo "cb2d53f03948514e664c521270a27a28277d51713476683e119334fa3feb3d5f  /tmp/delta120.diff.xz" | sha256sum -c -
          xz -dc /tmp/delta120.diff.xz > /tmp/delta120.diff
          patch --batch -p1 --directory=piiwii-notification-widget-v120 < /tmp/delta120.diff
          grep -q 'versionCode 21' piiwii-notification-widget-v120/app/build.gradle
          grep -q 'MultiSlotPolicy.showLabels' piiwii-notification-widget-v120/app/src/main/java/ch/piiwii/notificationwidget/WidgetProvider.java
          grep -q 'MultiSlotPolicy.compare' piiwii-notification-widget-v120/app/src/main/java/ch/piiwii/notificationwidget/NotificationMonitor.java
          grep -q 'R.drawable.widget_slot_empty_icon' piiwii-notification-widget-v120/app/src/main/java/ch/piiwii/notificationwidget/WidgetProvider.java
          cp -a piiwii-notification-widget-v120 piiwii-notification-widget-v121
          python3 notification-widget-v121-patch/apply.py
          grep -q 'versionCode 22' piiwii-notification-widget-v121/app/build.gradle
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root=Path('piiwii-notification-widget-v121/app/src/main')
          d=root/'res/drawable'
          for f in (Path('notification-widget-v121-patch/drawable')).glob('*.xml'):ET.parse(f)
          for f in d.glob('pic_*.xml'):ET.parse(f)
          assert len(list(d.glob('pic_*.xml')))==32
          texts={f.name:f.read_text() for f in d.glob('pic_*.xml')}
          for name in ['pic_brand_whatsapp.xml','pic_brand_messenger.xml','pic_brand_facebook.xml',
                       'pic_brand_facebook_dm.xml','pic_brand_tiktok.xml','pic_charge_induction.xml','pic_charge_induction_fast.xml','pic_idle_quiet.xml']:
            assert name in texts,name
          for name,keyword in [('pic_brand_whatsapp.xml','#25D366'),('pic_brand_facebook.xml','#1877F2'),
