          cp -a piiwii-notification-widget-v121 piiwii-notification-widget-v122
          base64 -d notification-widget-v122-patch/delta122.b64 > /tmp/delta122.diff.xz
          echo "fcb34a7a0eee54d23286228b5c7b661feaa0cba6e61f3b8c6fd5fa446259d960  /tmp/delta122.diff.xz" | sha256sum -c -
          xz -dc /tmp/delta122.diff.xz > /tmp/delta122.diff
          patch --batch -p1 --directory=piiwii-notification-widget-v122 < /tmp/delta122.diff
          grep -q 'versionCode 23' piiwii-notification-widget-v122/app/build.gradle
          python3 - <<'PY'
          from pathlib import Path
