            assert keyword in texts[name],name
          icon=(root/'java/ch/piiwii/notificationwidget/IconRenderer.java').read_text()
          assert 'GraphicIcons.defaultFor(id)' in icon
          assert 'Categories.prefs(c).getString("icon_"+id,null)' in icon
          main=(root/'java/ch/piiwii/notificationwidget/MainActivity.java').read_text()
          assert all(t in main for t in ['if(tab==0)showHome();','else if(tab==1)showCategories();','else if(tab==2)showAppearance();','else showTests();','void showInlineIconManager()'])
          ET.parse(d/'widget_slot_empty_icon.xml')
          print('PASS: 32 vector pictograms, distinct brand art, silent empty state and 4 pages')
