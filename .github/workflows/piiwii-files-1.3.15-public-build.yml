name: PiiWii Files 1.3.15 Public Build

on:
  push:
    branches: [ piiwii-files-1.3.15-build ]
    paths:
      - 'piiwii-files-1.3.15-build/payload2/**'
      - '.github/workflows/piiwii-files-1.3.15-public-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reassemble and verify project
        run: |
          mkdir -p /tmp/piiwii/project
          cat piiwii-files-1.3.15-build/payload2/p{00..12} > /tmp/piiwii/project.zip
          echo 'ed954f07e3ad628f5b02359781954d78026e3467f8b3b59ea0f9a6949732f72d  /tmp/piiwii/project.zip' | sha256sum -c -
          unzip -q /tmp/piiwii/project.zip -d /tmp/piiwii/project
          test -f /tmp/piiwii/project/app/build.gradle
          grep -E "applicationId|versionCode|versionName|targetSdk|minSdk" /tmp/piiwii/project/app/build.gradle

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        working-directory: /tmp/piiwii/project
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Align and prepare signing tools
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          "$SDK/build-tools/35.0.0/zipalign" -p -f 4 \
            /tmp/piiwii/project/app/build/outputs/apk/release/app-release-unsigned.apk \
            /tmp/PiiWii-Files-1.3.15-unsigned-aligned.apk
          "$SDK/build-tools/35.0.0/zipalign" -c -v 4 /tmp/PiiWii-Files-1.3.15-unsigned-aligned.apk
          cp "$SDK/build-tools/35.0.0/lib/apksigner.jar" /tmp/apksigner-35.0.0.jar
          sha256sum /tmp/PiiWii-Files-1.3.15-unsigned-aligned.apk > /tmp/PiiWii-Files-1.3.15-unsigned.sha256

      - name: Upload unsigned build
        uses: actions/upload-artifact@v4
        with:
          name: PiiWii-Files-1.3.15-unsigned-build
          path: |
            /tmp/PiiWii-Files-1.3.15-unsigned-aligned.apk
            /tmp/apksigner-35.0.0.jar
            /tmp/PiiWii-Files-1.3.15-unsigned.sha256
          retention-days: 7
          if-no-files-found: error
