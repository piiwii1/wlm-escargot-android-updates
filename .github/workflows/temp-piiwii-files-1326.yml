name: Temp PiiWii Files 1.3.26 Delivery
on:
  push:
    branches: [ temp-piiwii-files-1326-delivery ]
    paths:
      - '.github/workflows/temp-piiwii-files-1326.yml'
      - 'temp-piiwii-files-1326/payload/**'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n1)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Restore source
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/piiwii-files-1.3.26
          mkdir -p "$ROOT/project"
          cat temp-piiwii-files-1326/payload/part-* > "$ROOT/project.tar.xz.b64"
          base64 -d "$ROOT/project.tar.xz.b64" > "$ROOT/project.tar.xz"
          echo '423fe4e880b0095cd192fcb84a6b9cab0348a59e31468182418eeb6e5ec81194  /tmp/piiwii-files-1.3.26/project.tar.xz' | sha256sum -c -
          tar -xJf "$ROOT/project.tar.xz" -C "$ROOT/project"
          grep -q "versionCode 30" "$ROOT/project/app/build.gradle"
          grep -q "versionName '1.3.26'" "$ROOT/project/app/build.gradle"
          sed -i '/applicationIdSuffix/d;/versionNameSuffix/d' "$ROOT/project/app/build.gradle"
      - name: Build installable APK
        working-directory: /tmp/piiwii-files-1.3.26/project
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify and stage APK
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/piiwii-files-1.3.26/project/app/build/outputs/apk/debug/app-debug.apk
          BT=/usr/local/lib/android/sdk/build-tools/35.0.0
          OUT="$GITHUB_WORKSPACE/temp-piiwii-files-1326/delivery"
          mkdir -p "$OUT"
          cp "$APK" "$OUT/PiiWii-Files-1.3.26.apk"
          "$BT/apksigner" verify --verbose --print-certs "$OUT/PiiWii-Files-1.3.26.apk" > "$OUT/apksigner.txt"
          "$BT/aapt" dump badging "$OUT/PiiWii-Files-1.3.26.apk" | head -n 5 > "$OUT/badging.txt"
          grep -q "package: name='ch.piiwii.files' versionCode='30' versionName='1.3.26'" "$OUT/badging.txt"
          sha256sum "$OUT/PiiWii-Files-1.3.26.apk" > "$OUT/PiiWii-Files-1.3.26.sha256"
      - name: Commit delivery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT Android Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add -f temp-piiwii-files-1326/delivery
          git commit -m 'Temporary PiiWii Files 1.3.26 APK delivery' || exit 0
          git push origin HEAD:temp-piiwii-files-1326-delivery
