name: Mode Convoi Clean Release Build

on:
  push:
    branches: [mode-convoi-apk-build]
    paths:
      - '.github/workflows/mode-convoi-clean-release.yml'
      - 'mode-convoi-clean/**'
      - '_modeconvoi_assets/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mode-convoi-apk-build

      - name: Apply guarded 0.3.40 Volkswagen HD and selection migration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          parts=sorted(Path('_modeconvoi_assets').glob('vw_sprite_192.part*'))
          if len(parts)!=11:
              raise SystemExit(f'Expected 11 Volkswagen sprite chunks, found {len(parts)}')
          payload=''.join(p.read_text().strip() for p in parts)
          target=Path('mode-convoi-clean/android/app/src/main/res/drawable-nodpi/vw_sprite_192.webp')
          target.write_text(payload)
          print('Reassembled Volkswagen sprite transport:', len(payload), 'base64 chars')
          PY
          sed -i 's/sprite_path.stat().st_size>100000/sprite_path.stat().st_size>60000/' mode-convoi-clean/tools/patch_0340.py
          python mode-convoi-clean/tools/patch_0340.py
          python - <<'PY'
          from pathlib import Path
          p=Path('mode-convoi-clean/android/app/src/main/res/drawable-nodpi/vw_sprite_192.webp')
          raw=p.read_bytes()
          if len(raw)!=63628 or not (raw.startswith(b'RIFF') and raw[8:12]==b'WEBP'):
              raise SystemExit(f'Unexpected reconstructed Volkswagen sprite: {len(raw)} bytes')
          print('Volkswagen sprite verified:', len(raw), 'bytes')
          PY
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mode-convoi-clean/android
          git diff --cached --quiet && { echo 'No canonical Android changes produced'; exit 1; }
          git commit -m 'Mode Convoi 0.3.40: fix Volkswagen HD icons and live selection [skip ci]'
          git push origin HEAD:mode-convoi-apk-build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release directly from canonical source
        run: gradle -p mode-convoi-clean/android --no-daemon assembleRelease

      - name: Package unsigned release
        shell: bash
        run: |
          set -euo pipefail
          cp mode-convoi-clean/android/app/build/outputs/apk/release/app-release-unsigned.apk ModeConvoi-clean-release-unsigned.apk
          sha256sum ModeConvoi-clean-release-unsigned.apk > ModeConvoi-clean-release-unsigned.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ModeConvoi-clean-release-unsigned
          if-no-files-found: error
          path: |
            ModeConvoi-clean-release-unsigned.apk
            ModeConvoi-clean-release-unsigned.apk.sha256

      - name: Package official Android apksigner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apksigner-tool/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" apksigner-tool/apksigner
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" apksigner-tool/lib/apksigner.jar
          chmod +x apksigner-tool/apksigner

      - uses: actions/upload-artifact@v4
        with:
          name: Android-apksigner-35.0.0
          if-no-files-found: error
          path: apksigner-tool/
