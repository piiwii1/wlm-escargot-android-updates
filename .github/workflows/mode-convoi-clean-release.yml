name: Mode Convoi Clean Release Build

on:
  push:
    branches: [mode-convoi-apk-build]
    paths:
      - '.github/workflows/mode-convoi-clean-release.yml'
      - 'mode-convoi-clean/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply guarded 0.3.30 session refactor
        shell: bash
        run: |
          set -euo pipefail
          python3 mode-convoi-clean/tools/patch_0330.py
          if ! git diff --quiet; then
            git config user.name 'piiwii1'
            git config user.email 'piiwii32@gmail.com'
            git add mode-convoi-clean/android
            git commit -m 'Mode Convoi 0.3.30: move session and admin transport out of MainActivity'
            git push origin HEAD:mode-convoi-apk-build
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release directly from canonical source
        run: gradle -p mode-convoi-clean/android --no-daemon assembleRelease

      - name: Package unsigned release
        shell: bash
        run: |
          set -euo pipefail
          cp mode-convoi-clean/android/app/build/outputs/apk/release/app-release-unsigned.apk ModeConvoi-clean-release-unsigned.apk
          sha256sum ModeConvoi-clean-release-unsigned.apk > ModeConvoi-clean-release-unsigned.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ModeConvoi-clean-release-unsigned
          if-no-files-found: error
          path: |
            ModeConvoi-clean-release-unsigned.apk
            ModeConvoi-clean-release-unsigned.apk.sha256

      - name: Package official Android apksigner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apksigner-tool/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" apksigner-tool/apksigner
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" apksigner-tool/lib/apksigner.jar
          chmod +x apksigner-tool/apksigner

      - uses: actions/upload-artifact@v4
        with:
          name: Android-apksigner-35.0.0
          if-no-files-found: error
          path: apksigner-tool/
