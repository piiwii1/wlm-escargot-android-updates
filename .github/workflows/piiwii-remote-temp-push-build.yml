name: PiiWii Remote 1.2.0 Temporary Phone Build

on:
  push:
    branches:
      - tmp-piiwii-remote-120-build
    paths:
      - 'tmp-piiwii-payload/**'
      - '.github/workflows/piiwii-remote-temp-push-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and validate sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/piiwii-src
          cat tmp-piiwii-payload/part*.b64 | base64 -d > /tmp/piiwii-remote-sources.tar.xz
          xz -t /tmp/piiwii-remote-sources.tar.xz
          tar -xJf /tmp/piiwii-remote-sources.tar.xz -C /tmp/piiwii-src
          test -f /tmp/piiwii-src/piiwii-remote/settings.gradle
          test -f /tmp/piiwii-src/piiwii-remote/remote/src/main/java/ch/piiwii/remote/MainActivity.java

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build phone APK
        working-directory: /tmp/piiwii-src/piiwii-remote
        run: gradle --no-daemon --stacktrace :remote:assembleDebug

      - name: Validate and package APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/out
          APK=/tmp/piiwii-src/piiwii-remote/remote/build/outputs/apk/debug/remote-debug.apk
          test -s "$APK"
          cp "$APK" /tmp/out/PiiWii-Remote-Phone-1.2.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs /tmp/out/PiiWii-Remote-Phone-1.2.0.apk | tee /tmp/out/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging /tmp/out/PiiWii-Remote-Phone-1.2.0.apk | tee /tmp/out/badging.txt
          sha256sum /tmp/out/PiiWii-Remote-Phone-1.2.0.apk | tee /tmp/out/SHA256.txt
          unzip -t /tmp/out/PiiWii-Remote-Phone-1.2.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PiiWii-Remote-Phone-1.2.0
          path: /tmp/out/*
          if-no-files-found: error
          retention-days: 1
