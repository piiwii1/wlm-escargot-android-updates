# artifact test
name: AppDoctor Runner Test
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/appdoctor-runner-test.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: echo 'AppDoctor artifact transfer OK' > hello.txt
      - uses: actions/upload-artifact@v4
        with:
          name: appdoctor-transfer-test
          path: hello.txt
