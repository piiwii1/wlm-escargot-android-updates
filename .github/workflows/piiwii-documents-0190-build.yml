name: PiiWii Documents 0.19.0 Windows Build
on:
  push:
    branches: [build/piiwii-documents-0.19.0]
    paths:
      - '.github/workflows/piiwii-documents-0190-build.yml'
      - 'build-piiwii-documents-0190/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble 0.18.0 base
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-piiwii-documents-0190/work
          cat build-piiwii-documents-030/chunks/00 build-piiwii-documents-030/chunks/01 build-piiwii-documents-030/chunks/02 build-piiwii-documents-030/chunks/03 build-piiwii-documents-030/chunks/04 build-piiwii-documents-030/chunks/05 build-piiwii-documents-030/chunks/06 > build-piiwii-documents-0190/source.b64
          base64 -d build-piiwii-documents-0190/source.b64 > build-piiwii-documents-0190/source.zip
          unzip -q -o build-piiwii-documents-0190/source.zip -d build-piiwii-documents-0190/work || [ $? -eq 1 ]
          rm -rf build-piiwii-documents-0190/work/src/*/bin build-piiwii-documents-0190/work/src/*/obj build-piiwii-documents-0190/work/src/PiiWii.Documents.Installer/payload
          rm -rf build-piiwii-documents-040/work build-piiwii-documents-050/work build-piiwii-documents-060/work build-piiwii-documents-070/work build-piiwii-documents-080/work build-piiwii-documents-090/work build-piiwii-documents-0100/work build-piiwii-documents-0110/work build-piiwii-documents-0120/work build-piiwii-documents-0130/work build-piiwii-documents-0140/work build-piiwii-documents-0150/work build-piiwii-documents-0160/work build-piiwii-documents-0170/work build-piiwii-documents-0180/work
          for v in 040 050 060 070 080 090 0100 0110 0120 0130 0140 0150 0160 0170 0180; do ln -s ../build-piiwii-documents-0190/work build-piiwii-documents-$v/work; done
          python3 build-piiwii-documents-040/fix_apply.py || true
          python3 build-piiwii-documents-040/apply.py
          python3 build-piiwii-documents-050/apply.py
          python3 build-piiwii-documents-060/apply.py
          python3 build-piiwii-documents-070/apply.py
          python3 build-piiwii-documents-080/apply.py
          python3 build-piiwii-documents-090/apply.py
          python3 build-piiwii-documents-090/fix.py
          python3 build-piiwii-documents-0100/apply.py
          python3 build-piiwii-documents-0110/apply.py
          python3 build-piiwii-documents-0120/apply.py
          python3 build-piiwii-documents-0130/apply.py
          python3 build-piiwii-documents-0140/apply.py
          python3 build-piiwii-documents-0140/harden.py
          python3 build-piiwii-documents-0150/apply.py
          python3 build-piiwii-documents-0160/apply.py
          python3 build-piiwii-documents-0170/apply.py
          python3 build-piiwii-documents-0180/apply.py
          for v in 040 050 060 070 080 090 0100 0110 0120 0130 0140 0150 0160 0170 0180; do rm build-piiwii-documents-$v/work; done
      - name: Apply 0.19.0 direct-open return
        run: python3 build-piiwii-documents-0190/apply.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build application
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore build-piiwii-documents-0190/work/src/PiiWii.Documents/PiiWii.Documents.csproj -r win-x64
          dotnet publish build-piiwii-documents-0190/work/src/PiiWii.Documents/PiiWii.Documents.csproj -c Release -r win-x64 --self-contained true -o build-piiwii-documents-0190/work/publish
          test -f build-piiwii-documents-0190/work/publish/PiiWii.Documents.exe
      - name: Build installer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-piiwii-documents-0190/work/src/PiiWii.Documents.Installer/payload
          cp build-piiwii-documents-0190/work/publish/PiiWii.Documents.exe build-piiwii-documents-0190/work/src/PiiWii.Documents.Installer/payload/PiiWii.Documents.exe
          dotnet restore build-piiwii-documents-0190/work/src/PiiWii.Documents.Installer/PiiWii.Documents.Installer.csproj -r win-x64
          dotnet publish build-piiwii-documents-0190/work/src/PiiWii.Documents.Installer/PiiWii.Documents.Installer.csproj -c Release -r win-x64 --self-contained true -o build-piiwii-documents-0190/work/installer-publish
          test -f build-piiwii-documents-0190/work/installer-publish/PiiWii-Documents-Setup-0.19.0.exe
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          W=build-piiwii-documents-0190/work
          cat > $W/README.md <<'EOF'
          # PiiWii Documents 0.19.0
          Retour ChatGPT en double-clic : le format .piiwii-docs ouvre directement PiiWii Documents, vérifie la session et propose d'appliquer le tri.
          EOF
          cat > $W/CHANGELOG.md <<'EOF'
          # Changelog
          ## 0.19.0
          - Association Windows pour les fichiers .piiwii-docs.
          - Double-clic sur un retour ChatGPT pour le vérifier et l'appliquer.
          - Validation de l'échange et des IDs conservée via AssistantReturnPackService.
          - Sauvegarde automatique avant application conservée.
          - Plus besoin de chercher l'option d'import dans les menus.
          EOF
          mkdir -p $W/dist $W/PACK-REPRISE
          cp $W/installer-publish/PiiWii-Documents-Setup-0.19.0.exe $W/dist/
          cp $W/publish/PiiWii.Documents.exe $W/dist/PiiWii-Documents-0.19.0-PORTABLE.exe
          cd $W
          zip -qr dist/PiiWii-Documents-0.19.0-SOURCES.zip src README.md CHANGELOG.md -x 'src/*/bin/*' 'src/*/obj/*' 'src/PiiWii.Documents.Installer/payload/*'
          cp README.md CHANGELOG.md PACK-REPRISE/
          cp ../../build-piiwii-documents-0190/apply.py PACK-REPRISE/
          zip -qr dist/PiiWii-Documents-0.19.0-PACK-REPRISE.zip PACK-REPRISE
          cd dist
          sha256sum PiiWii-Documents-Setup-0.19.0.exe PiiWii-Documents-0.19.0-PORTABLE.exe PiiWii-Documents-0.19.0-SOURCES.zip PiiWii-Documents-0.19.0-PACK-REPRISE.zip > PiiWii-Documents-0.19.0-SHA256SUMS.txt
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: PiiWii-Documents-0.19.0-BINARIES
          path: |
            build-piiwii-documents-0190/work/dist/PiiWii-Documents-Setup-0.19.0.exe
            build-piiwii-documents-0190/work/dist/PiiWii-Documents-0.19.0-PORTABLE.exe
            build-piiwii-documents-0190/work/dist/PiiWii-Documents-0.19.0-SHA256SUMS.txt
      - name: Upload sources
        uses: actions/upload-artifact@v4
        with:
          name: PiiWii-Documents-0.19.0-SOURCEPACK
          path: |
            build-piiwii-documents-0190/work/dist/PiiWii-Documents-0.19.0-SOURCES.zip
            build-piiwii-documents-0190/work/dist/PiiWii-Documents-0.19.0-PACK-REPRISE.zip
            build-piiwii-documents-0190/work/dist/PiiWii-Documents-0.19.0-SHA256SUMS.txt
