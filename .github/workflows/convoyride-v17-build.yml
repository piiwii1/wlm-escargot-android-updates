name: Build ConvoyRide V1.7.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/convoyride-v17-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct V1.6 and apply verified V1.7
        shell: bash
        run: |
          set -euo pipefail
          cat convoyride-v15-source/source-part-* | base64 -d > /tmp/ConvoyRide-V1.5.0-source.zip
          echo '9618adb3c1c52a94af1f4a655f816ea37f4d9ff44d1ab6b465e627abe21a1afc  /tmp/ConvoyRide-V1.5.0-source.zip' | sha256sum -c -
          rm -rf cr17
          mkdir -p cr17
          unzip -q /tmp/ConvoyRide-V1.5.0-source.zip -d cr17
          cat convoyride-v16/patch-part-* | base64 -d | gunzip > /tmp/convoyride-v16.patch
          (cd cr17 && patch -p4 < /tmp/convoyride-v16.patch)
          cat convoyride-v17b64/part-* | base64 -d > /tmp/convoyride-v17.patch.gz
          echo 'af47abf9e1b463ae6905f24b8bb5499e9629c06c5889d9e21c3df704c1ac1e96  /tmp/convoyride-v17.patch.gz' | sha256sum -c -
          gunzip -c /tmp/convoyride-v17.patch.gz > /tmp/convoyride-v17.patch
          echo 'b955c2d54ef718d2bda07239a9247ec66d223b3141b65af797e612ef0797e9e6  /tmp/convoyride-v17.patch' | sha256sum -c -
          (cd cr17 && patch -p1 < /tmp/convoyride-v17.patch)
          grep -q "versionName '1.7.0'" cr17/app/build.gradle
          grep -q "versionCode 8" cr17/app/build.gradle
          grep -q "com.google.zxing:core:3.5.3" cr17/app/build.gradle
          grep -q 'android:scheme="convoyride"' cr17/app/src/main/AndroidManifest.xml
          grep -q 'android:host="join"' cr17/app/src/main/AndroidManifest.xml
          grep -q 'android:launchMode="singleTop"' cr17/app/src/main/AndroidManifest.xml
          grep -q 'showInviteQr' cr17/app/src/main/java/ch/piiwii/convoyride/MainActivity.java
          grep -q 'handleIncomingIntent' cr17/app/src/main/java/ch/piiwii/convoyride/MainActivity.java

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build release
        run: gradle -p cr17 --no-daemon assembleRelease

      - name: Align
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 \
            cr17/app/build/outputs/apk/release/app-release-unsigned.apk \
            ConvoyRide-V1.7.0-aligned-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 ConvoyRide-V1.7.0-aligned-unsigned.apk

      - name: Sign and verify APK
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://raw.githubusercontent.com/piiwii1/wpab-builds/main/convoyride/signing/convoyride.keystore.b64' -o /tmp/convoyride.keystore.b64
          curl -fsSL 'https://raw.githubusercontent.com/piiwii1/wpab-builds/main/convoyride/signing/signing.properties' -o /tmp/signing.properties
          base64 -d /tmp/convoyride.keystore.b64 > /tmp/ConvoyRide-release.jks
          ALIAS=$(sed -n 's/^alias=//p' /tmp/signing.properties)
          STOREPASS=$(sed -n 's/^storePassword=//p' /tmp/signing.properties)
          KEYPASS=$(sed -n 's/^keyPassword=//p' /tmp/signing.properties)
          echo "::add-mask::$STOREPASS"
          echo "::add-mask::$KEYPASS"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks /tmp/ConvoyRide-release.jks \
            --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$STOREPASS" \
            --key-pass "pass:$KEYPASS" \
            --out ConvoyRide-V1.7.0.apk \
            ConvoyRide-V1.7.0-aligned-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs ConvoyRide-V1.7.0.apk | tee ConvoyRide-V1.7.0-signature-verification.txt
          grep -qi 'd3043b12bc332c6ff2d15c4e659e064d1a8f28817d84d14eb9ef55408a7052a0' ConvoyRide-V1.7.0-signature-verification.txt
          sha256sum ConvoyRide-V1.7.0.apk > ConvoyRide-V1.7.0.apk.sha256
          rm -f /tmp/ConvoyRide-release.jks /tmp/convoyride.keystore.b64 /tmp/signing.properties

      - uses: actions/upload-artifact@v4
        with:
          name: ConvoyRide-V1.7.0-signed
          if-no-files-found: error
          retention-days: 7
          path: |
            ConvoyRide-V1.7.0.apk
            ConvoyRide-V1.7.0.apk.sha256
            ConvoyRide-V1.7.0-signature-verification.txt
