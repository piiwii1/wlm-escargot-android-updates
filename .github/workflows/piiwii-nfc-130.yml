name: PiiWii NFC 1.0.30 Build

on:
  push:
    paths:
      - 'piiwii-nfc-public/v130/v130.patch.gz.b64'
      - '.github/workflows/piiwii-nfc-130.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download official 1.0.29 fresh-install sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/nfc130 /tmp/art129 /tmp/art129.zip
          mkdir -p /tmp/nfc130 /tmp/art129
          ART_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts | map(select(.name == "PiiWii-NFC-1.0.29-fresh-install" and .expired == false)) | sort_by(.created_at) | reverse | .[0].id // empty')
          test -n "$ART_ID"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$ART_ID/zip" > /tmp/art129.zip
          unzip -q /tmp/art129.zip -d /tmp/art129
          SRCZIP=$(find /tmp/art129 -type f \( -name 'PiiWii-NFC-1.0.29-SOURCES-BUILD.zip' -o -name 'PiiWii-NFC-1.0.29-SOURCES.zip' \) -print -quit)
          test -n "$SRCZIP"
          unzip -q "$SRCZIP" -d /tmp/nfc130
          ROOT=$(find /tmp/nfc130 -maxdepth 1 -type d -name 'PiiWii-NFC-1.0.29' -print -quit)
          test -n "$ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Apply 1.0.30 improvements
        run: |
          set -euo pipefail
          base64 -d piiwii-nfc-public/v130/v130.patch.gz.b64 | gzip -d > /tmp/v130.patch
          patch -p1 -d "$ROOT" < /tmp/v130.patch
          grep -q "applicationId 'ch.piiwii.nfc.app'" "$ROOT/app/build.gradle"
          grep -q "versionCode 31" "$ROOT/app/build.gradle"
          grep -q "versionName '1.0.30'" "$ROOT/app/build.gradle"

      - name: Build release
        working-directory: ${{ env.ROOT }}
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Align and verify APK
        run: |
          set -euo pipefail
          mkdir -p /tmp/out130
          APK=$(find "$ROOT/app/build/outputs/apk/release" -type f -name '*.apk' -print -quit)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$APK" /tmp/out130/PiiWii-NFC-1.0.30-ALIGNED-UNSIGNED.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 /tmp/out130/PiiWii-NFC-1.0.30-ALIGNED-UNSIGNED.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging /tmp/out130/PiiWii-NFC-1.0.30-ALIGNED-UNSIGNED.apk | tee /tmp/badging130.txt
          grep -q "package: name='ch.piiwii.nfc.app'" /tmp/badging130.txt
          grep -q "versionCode='31'" /tmp/badging130.txt
          grep -q "versionName='1.0.30'" /tmp/badging130.txt
          if grep -q 'application-debuggable' /tmp/badging130.txt; then exit 1; fi
          unzip -t /tmp/out130/PiiWii-NFC-1.0.30-ALIGNED-UNSIGNED.apk >/dev/null

      - name: Package sources
        run: |
          set -euo pipefail
          mv "$ROOT" /tmp/nfc130/PiiWii-NFC-1.0.30
          cd /tmp/nfc130
          zip -qr /tmp/out130/PiiWii-NFC-1.0.30-SOURCES-BUILD.zip PiiWii-NFC-1.0.30

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: PiiWii-NFC-1.0.30-build
          path: /tmp/out130/
          retention-days: 7
          if-no-files-found: error
