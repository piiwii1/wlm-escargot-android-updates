name: Foire du Valais 1.5.31 extra official events
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/foire-valais-extra-1531.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download 1.5.30 source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p previous buildsrc
          gh run download 36509467416 -R piiwii1/wlm-escargot-android-updates -n Foire-du-Valais-2026-1.5.30 -D previous
          unzip -q previous/Foire-du-Valais-2026-1.5.30-SOURCES.zip -d buildsrc
      - name: Apply extra official events
        shell: bash
        run: |
          set -euo pipefail
          (cd buildsrc && patch -p1 < ../foire-valais-app/patches/extra1531/step1531.patch)
          grep -q 'versionCode = 37' buildsrc/app/build.gradle.kts
          grep -q 'versionName = "1.5.31"' buildsrc/app/build.gradle.kts
          grep -q 'Cortège de la Foire du Valais' buildsrc/app/src/main/java/ch/piiwii/foirevalais/MainActivity.java
          grep -q 'After Foire · From Rock' buildsrc/app/src/main/java/ch/piiwii/foirevalais/MainActivity.java
          grep -q 'Projection publique · Concours de courts-métrages' buildsrc/app/src/main/java/ch/piiwii/foirevalais/MainActivity.java
          grep -q '"EN VILLE"' buildsrc/app/src/main/java/ch/piiwii/foirevalais/MainActivity.java
      - name: Download extra event photos
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          python - <<'PY'
          import os,re,requests
          from urllib.parse import urljoin
          h={'User-Agent':'Mozilla/5.0'}
          pages={
            31001:'https://www.martigny.ch/fr/bienvenue/manifestations/foire-du-valais-cortege-17536/',
            31002:'https://www.martigny.ch/fr/bienvenue/manifestations/caves-du-manoir-after-foire-17341/?date=20261003',
            31003:'https://www.martigny.ch/fr/bienvenue/manifestations/caves-du-manoir-after-foire-17341/?date=20261010',
            31004:'https://www.valaisfilms.ch/event-details/foire-du-valais-concours-de-courts-metrages',
          }
          out='buildsrc/app/src/main/res/drawable-nodpi';os.makedirs(out,exist_ok=True)
          cache={};n=0
          for eid,url in pages.items():
            try:
              html=requests.get(url,headers=h,timeout=30).text
              pats=[r'<meta[^>]+property=["\']og:image["\'][^>]+content=["\']([^"\']+)',r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+property=["\']og:image["\']']
              img=None
              for p in pats:
                m=re.search(p,html,re.I)
                if m: img=urljoin(url,m.group(1).replace('&amp;','&'));break
              if not img: continue
              if img in cache: data,ctype=cache[img]
              else:
                r=requests.get(img,headers=h,timeout=30);r.raise_for_status();data=r.content;ctype=r.headers.get('content-type','').lower();cache[img]=(data,ctype)
              ext='.png' if 'png' in ctype else '.webp' if 'webp' in ctype else '.jpg'
              open(os.path.join(out,f'program_{eid}{ext}'),'wb').write(data);n+=1
            except Exception as e:
              print('Photo skipped',eid,type(e).__name__)
          print('Extra event photos downloaded:',n)
          PY
      - name: Install Android SDK 35
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build release
        working-directory: buildsrc
        run: gradle --no-daemon :app:assembleRelease
      - name: Prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deliverables/sign-tools/lib
          /usr/local/lib/android/sdk/build-tools/35.0.0/zipalign -f -p 4 buildsrc/app/build/outputs/apk/release/app-release-unsigned.apk deliverables/Foire-du-Valais-2026-1.5.31-ALIGNED-UNSIGNED.apk
          /usr/local/lib/android/sdk/build-tools/35.0.0/zipalign -c -v 4 deliverables/Foire-du-Valais-2026-1.5.31-ALIGNED-UNSIGNED.apk
          cp /usr/local/lib/android/sdk/build-tools/35.0.0/lib/apksigner.jar deliverables/sign-tools/lib/apksigner.jar
          cd buildsrc
          zip -qr ../deliverables/Foire-du-Valais-2026-1.5.31-SOURCES.zip . -x '*/build/*' '.gradle/*'
      - uses: actions/upload-artifact@v4
        with:
          name: Foire-du-Valais-2026-1.5.31
          path: deliverables/*
          retention-days: 7
