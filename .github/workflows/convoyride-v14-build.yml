name: Build ConvoyRide V1.4.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/convoyride-v14-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct verified V1.4 source
        shell: bash
        run: |
          set -euo pipefail
          cat convoyride-v14-source/source-part-* | base64 -d > /tmp/ConvoyRide-V1.4.0-source.zip
          echo '79591f9f301d36065158ebd7a2870a3dcd28ba54196392e28050e7de0f221699  /tmp/ConvoyRide-V1.4.0-source.zip' | sha256sum -c -
          rm -rf cr14
          mkdir -p cr14
          unzip -q /tmp/ConvoyRide-V1.4.0-source.zip -d cr14
          test -s cr14/app/src/main/java/ch/piiwii/convoyride/RouteModel.java
          test -s cr14/app/src/main/java/ch/piiwii/convoyride/ApiClient.java
          test -s cr14/app/src/main/java/ch/piiwii/convoyride/MainActivity.java
          grep -q "versionName '1.4.0'" cr14/app/build.gradle
          grep -q "versionCode 5" cr14/app/build.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build release
        run: gradle -p cr14 --no-daemon assembleRelease

      - name: Align and inspect
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 \
            cr14/app/build/outputs/apk/release/app-release-unsigned.apk \
            ConvoyRide-V1.4.0-aligned-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 ConvoyRide-V1.4.0-aligned-unsigned.apk
          sha256sum ConvoyRide-V1.4.0-aligned-unsigned.apk > ConvoyRide-V1.4.0-aligned-unsigned.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ConvoyRide-V1.4.0-unsigned
          if-no-files-found: error
          retention-days: 7
          path: |
            ConvoyRide-V1.4.0-aligned-unsigned.apk
            ConvoyRide-V1.4.0-aligned-unsigned.apk.sha256
