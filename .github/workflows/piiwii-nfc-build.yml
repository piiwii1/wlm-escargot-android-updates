name: PiiWii NFC APK Build

on:
  push:
    branches: [ main ]
    paths:
      - 'piiwii-nfc/**'
      - '.github/workflows/piiwii-nfc-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract
        run: |
          mkdir -p piwii-nfc/work
          base64 -d piwii-nfc/source.b64 > piwii-nfc/source.zip
          unzip -q -o piwii-nfc/source.zip -d piwii-nfc/work
      - name: Build
        working-directory: piwii-nfc/work/PiiWii-NFC-1.0.2
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Package
        run: |
          mkdir -p piwii-nfc/dist
          cp piwii-nfc/work/PiiWii-NFC-1.0.2/app/build/outputs/apk/debug/app-debug.apk piwii-nfc/dist/PiiWii-NFC-1.0.2.apk
          cp piwii-nfc/source.zip piwii-nfc/dist/PiiWii-NFC-1.0.2-SOURCES.zip
          cd piwii-nfc/dist
          sha256sum PiiWii-NFC-1.0.2.apk PiiWii-NFC-1.0.2-SOURCES.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PiiWii-NFC-1.0.2
          path: piwii-nfc/dist/
          retention-days: 7
          if-no-files-found: error
