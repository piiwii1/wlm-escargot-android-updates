name: PiiWii NFC APK Build

on:
  push:
    branches: [ main ]
    paths:
      - 'piiwii-nfc/**'
      - '.github/workflows/piiwii-nfc-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract
        shell: bash
        run: |
          rm -rf piwii-nfc/work
          mkdir -p piwii-nfc/work
          cp piwii-nfc/source.zip /tmp/piiwii-nfc-source.zip
          python3 - <<'PY'
          import os, zipfile
          p='/tmp/piiwii-nfc-source.zip'
          print('ZIP bytes:', os.path.getsize(p))
          with zipfile.ZipFile(p) as z:
              names=z.namelist()
              print('ZIP entries:', len(names))
              for n in names: print(n)
              z.extractall('piiwii-nfc/work')
          PY
          echo 'Extracted files:'
          find piwii-nfc/work -type f -print | sort
      - name: Build
        shell: bash
        run: |
          SETTINGS="$(find piwii-nfc/work -type f -name settings.gradle -print -quit)"
          test -n "$SETTINGS"
          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "Building from: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleDebug
      - name: Package
        shell: bash
        run: |
          rm -rf piwii-nfc/dist
          mkdir -p piwii-nfc/dist
          APK="$(find piwii-nfc/work -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"
          test -n "$APK" && test -f "$APK"
          cp "$APK" piwii-nfc/dist/PiiWii-NFC-1.0.2.apk
          cp /tmp/piiwii-nfc-source.zip piwii-nfc/dist/PiiWii-NFC-1.0.2-SOURCES.zip
          cd piwii-nfc/dist
          sha256sum PiiWii-NFC-1.0.2.apk PiiWii-NFC-1.0.2-SOURCES.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PiiWii-NFC-1.0.2
          path: piwii-nfc/dist/
          retention-days: 7
          if-no-files-found: error
