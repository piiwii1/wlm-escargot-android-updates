name: Build DriveBox RC12 APK

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/drivebox-rc11b.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct RC11 and apply RC12
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail -o /tmp/rc11b-old.yml https://raw.githubusercontent.com/piiwii1/wlm-escargot-android-updates/b7569f6356d81d470d4a0ed25365d847134de4bc/.github/workflows/drivebox-rc11b.yml
          python3 - <<'PY'
          from pathlib import Path
          def extract(text, step_name, out):
              marker = '      - name: ' + step_name + '\n'
              start = text.index(marker)
              run_start = text.index('        run: |\n', start) + len('        run: |\n')
              end = text.find('\n      - ', run_start)
              if end < 0: end = len(text)
              block = text[run_start:end]
              lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
              Path(out).write_text('\n'.join(lines) + '\n')
          old = Path('/tmp/rc11b-old.yml').read_text()
          extract(old, 'Prepare RC10 source', '/tmp/a.sh')
          extract(old, 'Integrate supplied tab artwork', '/tmp/b.sh')
          extract(old, 'Apply RC11 integration', '/tmp/c.sh')
          rc12 = Path('.github/workflows/drivebox-rc12.yml').read_text()
          extract(rc12, 'Apply RC12 country improvements', '/tmp/d.sh')
          PY
          bash /tmp/a.sh
          bash /tmp/b.sh
          bash /tmp/c.sh
          bash /tmp/d.sh
          grep -q "DriveBox 1.0.0 RC12" /tmp/drivebox-src/app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java
          grep -q "versionCode 21" /tmp/drivebox-src/app/build.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        working-directory: /tmp/drivebox-src
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Verify RC12
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/drivebox-src/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/cert.txt
          grep -qi '6699b2b6b15b5e09032b4f54c5c26bbd982a41dc48d5a5093d1501036a474a1e' /tmp/cert.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='ch.clubvwsuisse.drivebox.v1'" /tmp/badging.txt
          grep -q "versionCode='21'" /tmp/badging.txt
          grep -q "versionName='1.0.0-rc12'" /tmp/badging.txt
          grep -q "application-label:'DriveBox'" /tmp/badging.txt
          unzip -t "$APK"
          unzip -l "$APK" | grep -q 'tab_motorway_green'
          unzip -l "$APK" | grep -q 'tab_motorway_blue'
          for f in ch fr de it at; do unzip -l "$APK" | grep -q "motorway_${f}"; done
          cp "$APK" "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC12.apk"
          sha256sum "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC12.apk" > "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC12.apk.sha256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: DriveBox-1.0.0-RC12
          path: |
            DriveBox-1.0.0-RC12.apk
            DriveBox-1.0.0-RC12.apk.sha256.txt
          if-no-files-found: error
          retention-days: 7
