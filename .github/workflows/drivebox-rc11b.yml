name: Build DriveBox RC13 APK

on:
  push:
    branches: [ drivebox-ci-temp ]
    paths:
      - '.github/workflows/drivebox-rc11b.yml'
      - 'drivebox-ci/rc13-run.txt'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare valid RC12 source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/drivebox-rc12.yml').read_text()
          def extract(step_name, out):
              marker = '      - name: ' + step_name + '\n'
              start = text.index(marker)
              run_start = text.index('        run: |\n', start) + len('        run: |\n')
              end = text.find('\n      - ', run_start)
              if end < 0: end = len(text)
              block = text[run_start:end]
              lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
              Path(out).write_text('\n'.join(lines) + '\n')
          extract('Prepare RC11 source', '/tmp/prepare-rc11.sh')
          extract('Apply RC12 country improvements', '/tmp/apply-rc12.sh')
          PY
          bash /tmp/prepare-rc11.sh
          bash /tmp/apply-rc12.sh
          grep -q "DriveBox 1.0.0 RC12" /tmp/drivebox-src/app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java
          grep -q "versionCode 21" /tmp/drivebox-src/app/build.gradle

      - name: Apply RC13 color-only country tabs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          java = Path('/tmp/drivebox-src/app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java')
          s = java.read_text()
          def replace_method(src, signature_start, new_method):
              a = src.index(signature_start)
              brace = src.index('{', a)
              depth = 0
              i = brace
              while i < len(src):
                  if src[i] == '{': depth += 1
                  elif src[i] == '}':
                      depth -= 1
                      if depth == 0:
                          return src[:a] + new_method + src[i+1:]
                  i += 1
              raise RuntimeError('Unbalanced method')

          s = s.replace('DriveBox 1.0.0 RC12', 'DriveBox 1.0.0 RC13')
          country_card = r'''private View countryCard(String flag, String country, String colorName, String note, int signColor, Runnable action) {
              LinearLayout c = row(Gravity.CENTER_VERTICAL);
              c.setPadding(dp(14), dp(11), dp(14), dp(11));
              c.setBackground(round(PANEL, 18));
              c.setClickable(true);
              c.setFocusable(true);
              c.setOnClickListener(v -> action.run());

              TextView f = text(flag, 28, TEXT, false);
              f.setGravity(Gravity.CENTER);
              c.addView(f, lp(dp(42), dp(54), 0, 0, 10, 0));

              LinearLayout labels = column();
              labels.addView(text(country, 17, TEXT, true));
              labels.addView(text(note, 12, MUTED, false), lp(-2, -2, 0, 3, 0, 0));
              c.addView(labels, new LinearLayout.LayoutParams(0, -2, 1));

              boolean green = "Suisse".equals(country) || "Italie".equals(country);
              int tabColor = green ? Color.rgb(18, 132, 72) : Color.rgb(24, 93, 188);
              TextView colorBlock = text("", 1, Color.TRANSPARENT, false);
              colorBlock.setBackground(round(tabColor, 12));
              colorBlock.setContentDescription("Signalisation autoroute " + (green ? "verte" : "bleue") + " - " + country);
              c.addView(colorBlock, lp(dp(72), dp(44), 10, 0, 0, 0));

              return withMargins(c, 0, 0, 0, 10);
          }'''
          s = replace_method(s, 'private View countryCard(', country_card)
          java.write_text(s)

          gradle = Path('/tmp/drivebox-src/app/build.gradle')
          g = gradle.read_text()
          g = g.replace('versionCode 21', 'versionCode 22')
          g = g.replace("versionName '1.0.0-rc12'", "versionName '1.0.0-rc13'")
          gradle.write_text(g)
          PY
          grep -q "DriveBox 1.0.0 RC13" /tmp/drivebox-src/app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java
          grep -q "versionCode 22" /tmp/drivebox-src/app/build.gradle
          grep -q "versionName '1.0.0-rc13'" /tmp/drivebox-src/app/build.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        working-directory: /tmp/drivebox-src
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Verify installable RC13
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/drivebox-src/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/cert.txt
          grep -qi '6699b2b6b15b5e09032b4f54c5c26bbd982a41dc48d5a5093d1501036a474a1e' /tmp/cert.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='ch.clubvwsuisse.drivebox.v1'" /tmp/badging.txt
          grep -q "versionCode='22'" /tmp/badging.txt
          grep -q "versionName='1.0.0-rc13'" /tmp/badging.txt
          grep -q "application-label:'DriveBox'" /tmp/badging.txt
          unzip -t "$APK"
          unzip -l "$APK" | grep -q 'resources.arsc'
          unzip -l "$APK" | grep -q 'classes.dex'
          unzip -p "$APK" res/mipmap-xxxhdpi-v4/ic_launcher.webp > /tmp/icon.webp
          test "$(sha256sum /tmp/icon.webp | awk '{print $1}')" = 'ab5bbd86c44f537aae43e60584c39c923cee3e7c855ae887332617158c0e8a05'
          cp "$APK" "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC13.apk"
          sha256sum "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC13.apk" > "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC13.apk.sha256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: DriveBox-1.0.0-RC13-FIXED
          path: |
            DriveBox-1.0.0-RC13.apk
            DriveBox-1.0.0-RC13.apk.sha256.txt
          if-no-files-found: error
          retention-days: 7
