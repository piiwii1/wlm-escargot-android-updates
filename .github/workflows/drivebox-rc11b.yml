name: Build DriveBox RC12 APK

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/drivebox-rc11b.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct RC11 and apply fixed RC12
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail -o /tmp/rc11b-old.yml https://raw.githubusercontent.com/piiwii1/wlm-escargot-android-updates/b7569f6356d81d470d4a0ed25365d847134de4bc/.github/workflows/drivebox-rc11b.yml
          python3 - <<'PY'
          from pathlib import Path
          def extract(text, step_name, out):
              marker = '      - name: ' + step_name + '\n'
              start = text.index(marker)
              run_start = text.index('        run: |\n', start) + len('        run: |\n')
              end = text.find('\n      - ', run_start)
              if end < 0: end = len(text)
              block = text[run_start:end]
              lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
              Path(out).write_text('\n'.join(lines) + '\n')
          old = Path('/tmp/rc11b-old.yml').read_text()
          extract(old, 'Prepare RC10 source', '/tmp/a.sh')
          extract(old, 'Integrate supplied tab artwork', '/tmp/b.sh')
          extract(old, 'Apply RC11 integration', '/tmp/c.sh')
          PY
          bash /tmp/a.sh
          bash /tmp/b.sh
          bash /tmp/c.sh

          python3 - <<'PY'
          from pathlib import Path
          java = Path('/tmp/drivebox-src/app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java')
          s = java.read_text()

          def replace_method(src, signature_start, new_method):
              a = src.index(signature_start)
              brace = src.index('{', a)
              depth = 0
              i = brace
              while i < len(src):
                  if src[i] == '{': depth += 1
                  elif src[i] == '}':
                      depth -= 1
                      if depth == 0:
                          return src[:a] + new_method + src[i+1:]
                  i += 1
              raise RuntimeError('Unbalanced method: ' + signature_start)

          s = s.replace('DriveBox 1.0.0 RC11', 'DriveBox 1.0.0 RC12')

          country_card = r'''private View countryCard(String flag, String country, String signColorName, String speedSummary, int accent, Runnable action) {
              LinearLayout c = row(Gravity.CENTER_VERTICAL);
              c.setPadding(dp(14), dp(11), dp(14), dp(11));
              c.setBackground(round(PANEL, 18));
              c.setClickable(true);
              c.setFocusable(true);
              c.setOnClickListener(v -> action.run());

              TextView f = text(flag, 28, TEXT, false);
              f.setGravity(Gravity.CENTER);
              c.addView(f, lp(dp(42), dp(54), 0, 0, 10, 0));

              LinearLayout labels = column();
              labels.addView(text(country, 17, TEXT, true));
              labels.addView(text(speedSummary, 12, MUTED, false), lp(-2, -2, 0, 3, 0, 0));
              c.addView(labels, new LinearLayout.LayoutParams(0, -2, 1));

              android.widget.ImageView sign = new android.widget.ImageView(this);
              boolean green = "Suisse".equals(country) || "Italie".equals(country);
              sign.setImageResource(green ? R.drawable.tab_motorway_green : R.drawable.tab_motorway_blue);
              sign.setScaleType(android.widget.ImageView.ScaleType.CENTER_INSIDE);
              sign.setAdjustViewBounds(true);
              sign.setContentDescription("Panneau autoroute " + (green ? "vert" : "bleu") + " - " + country);
              c.addView(sign, lp(dp(76), dp(68), 10, 0, 0, 0));
              return withMargins(c, 0, 0, 0, 10);
          }'''
          s = replace_method(s, 'private View countryCard(', country_card)

          toll_marker = 'root.addView(infoStrip("🛣", toll, BLUE));'
          if toll_marker not in s:
              raise RuntimeError('Toll marker not found')
          s = s.replace(toll_marker, toll_marker + '\n              addVignettePurchaseLinks(root, country);', 1)

          helper_marker = 'private View countrySignCard(String country) {'
          if helper_marker not in s:
              raise RuntimeError('countrySignCard marker not found')
          helpers = r'''private void addVignettePurchaseLinks(LinearLayout root, String country) {
              if ("Suisse".equals(country)) {
                  root.addView(infoStrip("✓", "E-vignette suisse officielle disponible en ligne • CHF 40 • liée à la plaque.", GREEN), lp(-1, -2, 0, 8, 0, 0));
                  root.addView(officialWebButton("Acheter l’e-vignette suisse", "https://www.e-vignette.ch/"), lp(-1, dp(48), 0, 8, 0, 0));
              } else if ("Autriche".equals(country)) {
                  root.addView(infoStrip("✓", "Vignette numérique ASFINAG disponible en ligne (1 jour, 10 jours, 2 mois ou annuelle).", GREEN), lp(-1, -2, 0, 8, 0, 0));
                  root.addView(infoStrip("i", "Attention au début de validité selon le type de vignette et le mode d’achat. Vérifiez la date affichée avant de payer.", ORANGE), lp(-1, -2, 0, 8, 0, 0));
                  root.addView(officialWebButton("Acheter la vignette ASFINAG", "https://shop.asfinag.at/fr/produits/vignette-numerique/"), lp(-1, dp(48), 0, 8, 0, 0));
              }
          }

          private View officialWebButton(String label, String url) {
              TextView b = text(label + "  ↗", 14, Color.WHITE, true);
              b.setGravity(Gravity.CENTER);
              b.setPadding(dp(14), 0, dp(14), 0);
              b.setBackground(round(BLUE, 14));
              b.setClickable(true);
              b.setFocusable(true);
              b.setContentDescription(label + ". Ouvre le site officiel dans le navigateur.");
              b.setOnClickListener(v -> {
                  try {
                      android.content.Intent intent = new android.content.Intent(android.content.Intent.ACTION_VIEW, android.net.Uri.parse(url));
                      startActivity(intent);
                  } catch (Exception ex) {
                      android.widget.Toast.makeText(this, "Impossible d’ouvrir le navigateur.", android.widget.Toast.LENGTH_SHORT).show();
                  }
              });
              return b;
          }

          '''
          s = s.replace(helper_marker, helpers + helper_marker, 1)
          java.write_text(s)

          gradle = Path('/tmp/drivebox-src/app/build.gradle')
          g = gradle.read_text()
          g = g.replace('versionCode 20', 'versionCode 21')
          g = g.replace("versionName '1.0.0-rc11'", "versionName '1.0.0-rc12'")
          gradle.write_text(g)
          PY

          grep -q "versionCode 21" /tmp/drivebox-src/app/build.gradle
          grep -q "versionName '1.0.0-rc12'" /tmp/drivebox-src/app/build.gradle
          grep -q '"Suisse".equals(country) || "Italie".equals(country)' /tmp/drivebox-src/app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java
          grep -q 'e-vignette.ch' /tmp/drivebox-src/app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java
          grep -q 'shop.asfinag.at' /tmp/drivebox-src/app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        working-directory: /tmp/drivebox-src
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Verify RC12
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/drivebox-src/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/cert.txt
          grep -qi '6699b2b6b15b5e09032b4f54c5c26bbd982a41dc48d5a5093d1501036a474a1e' /tmp/cert.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='ch.clubvwsuisse.drivebox.v1'" /tmp/badging.txt
          grep -q "versionCode='21'" /tmp/badging.txt
          grep -q "versionName='1.0.0-rc12'" /tmp/badging.txt
          grep -q "application-label:'DriveBox'" /tmp/badging.txt
          unzip -t "$APK"
          unzip -l "$APK" | grep -q 'tab_motorway_green'
          unzip -l "$APK" | grep -q 'tab_motorway_blue'
          for f in ch fr de it at; do unzip -l "$APK" | grep -q "motorway_${f}"; done
          cp "$APK" "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC12.apk"
          sha256sum "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC12.apk" > "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC12.apk.sha256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: DriveBox-1.0.0-RC12
          path: |
            DriveBox-1.0.0-RC12.apk
            DriveBox-1.0.0-RC12.apk.sha256.txt
          if-no-files-found: error
          retention-days: 7
