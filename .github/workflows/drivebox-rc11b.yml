name: Build DriveBox RC11B APK

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'drivebox-ci/rc11b-trigger.txt'
      - '.github/workflows/drivebox-rc11b.yml'
      - 'drivebox-ci/rc11-user-green.b64'
      - 'drivebox-ci/rc11-user-blue.b64'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare RC10 source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/drivebox-rc10.yml').read_text()
          def extract(step_name, out):
              marker = '      - name: ' + step_name + '\n'
              start = text.index(marker)
              run_start = text.index('        run: |\n', start) + len('        run: |\n')
              end = text.find('\n      - ', run_start)
              if end < 0: end = len(text)
              block = text[run_start:end]
              lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
              Path(out).write_text('\n'.join(lines) + '\n')
          extract('Prepare RC9 source', '/tmp/prepare-rc9.sh')
          extract('Apply RC10 harmonization', '/tmp/apply-rc10.sh')
          PY
          bash /tmp/prepare-rc9.sh
          bash /tmp/apply-rc10.sh
          grep -q "DriveBox 1.0.0 RC10" /tmp/drivebox-src/app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java

      - name: Integrate supplied tab artwork
        shell: bash
        run: |
          set -euo pipefail
          RES=/tmp/drivebox-src/app/src/main/res/drawable-nodpi
          mkdir -p "$RES"
          tr -d '[:space:]' < drivebox-ci/rc11-user-green.b64 | base64 -d > "$RES/tab_motorway_green.png"
          tr -d '[:space:]' < drivebox-ci/rc11-user-blue.b64 | base64 -d > "$RES/tab_motorway_blue.png"
          test -s "$RES/tab_motorway_green.png"
          test -s "$RES/tab_motorway_blue.png"
          file "$RES/tab_motorway_green.png"
          file "$RES/tab_motorway_blue.png"

      - name: Apply RC11 integration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          java = Path('/tmp/drivebox-src/app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java')
          s = java.read_text()

          def replace_method(src, signature_start, new_method):
              a = src.index(signature_start)
              brace = src.index('{', a)
              depth = 0
              i = brace
              while i < len(src):
                  if src[i] == '{': depth += 1
                  elif src[i] == '}':
                      depth -= 1
                      if depth == 0:
                          return src[:a] + new_method + src[i+1:]
                  i += 1
              raise RuntimeError('Unbalanced method: ' + signature_start)

          s = s.replace('DriveBox 1.0.0 RC10', 'DriveBox 1.0.0 RC11')
          country_card = r'''private View countryCard(String flag, String name, String signColorName, String speedSummary, int accent, Runnable action) {
              LinearLayout c = row(Gravity.CENTER_VERTICAL);
              c.setPadding(dp(14), dp(11), dp(14), dp(11));
              c.setBackground(round(PANEL, 18));
              c.setClickable(true);
              c.setFocusable(true);
              c.setOnClickListener(v -> action.run());

              TextView f = text(flag, 28, TEXT, false);
              f.setGravity(Gravity.CENTER);
              c.addView(f, lp(dp(42), dp(54), 0, 0, 10, 0));

              LinearLayout labels = column();
              labels.addView(text(name, 17, TEXT, true));
              labels.addView(text(speedSummary, 12, MUTED, false), lp(-2, -2, 0, 3, 0, 0));
              c.addView(labels, new LinearLayout.LayoutParams(0, -2, 1));

              android.widget.ImageView sign = new android.widget.ImageView(this);
              boolean green = signColorName != null && signColorName.toUpperCase(Locale.ROOT).contains("VERT");
              sign.setImageResource(green ? R.drawable.tab_motorway_green : R.drawable.tab_motorway_blue);
              sign.setScaleType(android.widget.ImageView.ScaleType.FIT_CENTER);
              sign.setAdjustViewBounds(true);
              sign.setContentDescription("Panneau autoroute " + (green ? "vert" : "bleu") + " - " + name);
              c.addView(sign, lp(dp(74), dp(68), 10, 0, 0, 0));
              return withMargins(c, 0, 0, 0, 10);
          }'''
          s = replace_method(s, 'private View countryCard(', country_card)
          java.write_text(s)

          gradle = Path('/tmp/drivebox-src/app/build.gradle')
          g = gradle.read_text()
          g = g.replace('versionCode 19', 'versionCode 20')
          g = g.replace("versionName '1.0.0-rc10'", "versionName '1.0.0-rc11'")
          gradle.write_text(g)
          PY

          grep -q "versionCode 20" /tmp/drivebox-src/app/build.gradle
          grep -q "versionName '1.0.0-rc11'" /tmp/drivebox-src/app/build.gradle
          grep -q "R.drawable.tab_motorway_green" /tmp/drivebox-src/app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java
          grep -q "R.drawable.tab_motorway_blue" /tmp/drivebox-src/app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        working-directory: /tmp/drivebox-src
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Verify RC11
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/drivebox-src/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/cert.txt
          grep -qi '6699b2b6b15b5e09032b4f54c5c26bbd982a41dc48d5a5093d1501036a474a1e' /tmp/cert.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='ch.clubvwsuisse.drivebox.v1'" /tmp/badging.txt
          grep -q "versionCode='20'" /tmp/badging.txt
          grep -q "versionName='1.0.0-rc11'" /tmp/badging.txt
          grep -q "application-label:'DriveBox'" /tmp/badging.txt
          unzip -t "$APK"
          unzip -l "$APK" | grep -q 'tab_motorway_green'
          unzip -l "$APK" | grep -q 'tab_motorway_blue'
          for f in ch fr de it at; do unzip -l "$APK" | grep -q "motorway_${f}"; done
          cp "$APK" "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC11.apk"
          sha256sum "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC11.apk" > "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC11.apk.sha256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: DriveBox-1.0.0-RC11
          path: |
            DriveBox-1.0.0-RC11.apk
            DriveBox-1.0.0-RC11.apk.sha256.txt
          if-no-files-found: error
          retention-days: 7
