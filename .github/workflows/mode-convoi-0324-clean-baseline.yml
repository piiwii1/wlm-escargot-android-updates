name: Mode Convoi 0.3.24 Clean Baseline

on:
  push:
    branches: [mode-convoi-apk-build]
    paths:
      - '.github/workflows/mode-convoi-0324-clean-baseline.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote-and-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct validated 0.3.23 once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mode-convoi-build/android/app/src/main/java/ch/piiwii/modeconvoi
          cat mode-convoi-build/main-parts/part-00 mode-convoi-build/main-parts/part-01 mode-convoi-build/main-parts/part-02 mode-convoi-build/main-parts/part-03 mode-convoi-build/main-parts/part-04 mode-convoi-build/main-parts/part-05 > mode-convoi-build/android/app/src/main/java/ch/piiwii/modeconvoi/MainActivity.java
          python mode-convoi-build/ui_patch.py
          python mode-convoi-build/bottom_nav_patch.py
          python mode-convoi-build/ux_032_patch.py
          python mode-convoi-build/ux_033_patch.py
          python mode-convoi-build/ux_034_patch.py
          python mode-convoi-build/ux_035_patch.py
          python mode-convoi-build/ux_036_patch.py
          python mode-convoi-build/ux_036_fix.py
          python mode-convoi-build/ux_037_map_patch.py
          python mode-convoi-build/ux_038_gps_patch.py
          python mode-convoi-build/ux_039_exact.py
          python mode-convoi-build/ux_039_map_patch.py
          python mode-convoi-build/ux_0310_profile_patch.py
          python mode-convoi-build/ux_0311_ui_patch.py
          cat mode-convoi-build/ux0312_part_01.txt mode-convoi-build/ux0312_part_02.txt mode-convoi-build/ux0312_part_03.txt mode-convoi-build/ux0312_part_04.txt mode-convoi-build/ux0312_part_05.txt | base64 -d | gunzip > /tmp/ux0312.patch
          patch -p0 < /tmp/ux0312.patch || true
          rm -f mode-convoi-build/android/app/src/main/java/ch/piiwii/modeconvoi/MainActivity.java.rej
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('mode-convoi-build/android/app/src/main/java/ch/piiwii/modeconvoi/MainActivity.java')
          s=p.read_text()
          repl=r'''    private void ensureParticipantDefaults(){
              if(!prefs.getBool("participantDefaultsV0312",false) && !prefs.hasActiveConvoy()){
                  String oldName=prefs.get("profileName","").trim();
                  if(oldName.isEmpty() || "PiiWii".equalsIgnoreCase(oldName) || "Conducteur".equalsIgnoreCase(oldName) || oldName.matches("(?i)user\\s*\\d+"))
                      prefs.put("profileName",funnyNickname());
                  String oldVehicle=prefs.get("profileVehicle","").trim();
                  if("VW Polo GTI".equalsIgnoreCase(oldVehicle) || "Véhicule".equalsIgnoreCase(oldVehicle)) prefs.put("profileVehicle","");
                  String[] markerColors={"#EF4444","#3B82F6","#22C55E","#A855F7","#F97316","#14B8A6","#EC4899","#EAB308","#64748B","#06B6D4"};
                  String current=prefs.get("profileVehicleMarkerColor","");
                  if(current.isEmpty() || "#FFB514".equalsIgnoreCase(current)){
                      int idx=Math.floorMod(java.util.UUID.randomUUID().getLeastSignificantBits(),markerColors.length);
                      prefs.put("profileVehicleMarkerColor",markerColors[idx]);
                  }
                  prefs.putBool("participantDefaultsV0312",true);
              }
          }
          private String funnyNickname(){
              String[] names={"TurboMarmotte","PapyNitro","TartifletteRacing","ChamoisPressé","BiscotteTurbo","KlaxonSauvage","PatateGTI","CroissantRacing","PneuMou","GPSPerdu","VirageMystère","CaféTurbo","CornichonSport","BaguetteExpress","MoustacheRacing","PistonRigolo","RacletteFurieuse","MarmotteGTI","CactusTurbo","FromagePressé","CapitaineKlaxon","BiberonRacing","ChaussetteTurbo","EscargotNitro","PandaPressé","FriteSport","BananeRacing","PouletTurbo","PneuCarré","ChamoisNitro","RacletteExpress","BiscotteGTI"};
              return names[new java.util.Random().nextInt(names.length)];
          }
          '''
          pat=r'    private void ensureParticipantDefaults\(\)\{.*?(?=    private boolean saveProfileChecked)'
          s,n=re.subn(pat,lambda m: repl,s,flags=re.S)
          if n!=1: raise SystemExit(f'profile default replacement count={n}')
          p.write_text(s)
          PY
          python mode-convoi-build/ux_0313_compact_settings.py
          python mode-convoi-build/ux_0314_talkie.py
          python mode-convoi-build/ux_0315_talkie_fix.py
          python mode-convoi-build/ux_0316_talkie_outline.py
          sed -i "s/versionCode 2/versionCode 19/" mode-convoi-build/android/app/build.gradle
          sed -i "s/versionName '0.2.0'/versionName '0.3.16'/" mode-convoi-build/android/app/build.gradle
          base64 -d mode-convoi-build/ux0317_patch.gz.b64 | gunzip > /tmp/ux0317.patch
          patch -p0 < /tmp/ux0317.patch
          python mode-convoi-build/ux_0318_stability_talkie.py
          base64 -d mode-convoi-build/ux0319_patch.gz.b64 | gunzip > /tmp/ux0319.patch
          patch -p0 < /tmp/ux0319.patch
          cat mode-convoi-build/ux0320_part1.b64 mode-convoi-build/ux0320_part2.b64 | base64 -d | gunzip > /tmp/ux0320.patch
          patch -p0 < /tmp/ux0320.patch || true
          rm -f mode-convoi-build/android/app/build.gradle.rej
          base64 -d mode-convoi-build/ux0321_patch.gz.b64 | gunzip > /tmp/ux0321.patch
          patch -p0 < /tmp/ux0321.patch
          python mode-convoi-build/ux_0322_notifications.py
          python mode-convoi-build/ux_0323_map_noscroll.py

      - name: Promote reconstructed tree to clean source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mode-convoi-clean/android
          mkdir -p mode-convoi-clean
          cp -a mode-convoi-build/android mode-convoi-clean/android
          find mode-convoi-clean/android -name '*.rej' -delete
          find mode-convoi-clean/android -name '*.orig' -delete
          rm -rf mode-convoi-clean/android/.gradle mode-convoi-clean/android/app/build mode-convoi-clean/android/build
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('mode-convoi-clean/android/app/build.gradle')
          s=p.read_text()
          s=re.sub(r'versionCode\s+\d+', 'versionCode 27', s)
          s=re.sub(r"versionName\s+'[^']+'", "versionName '0.3.24'", s)
          p.write_text(s)
          PY
          cat > mode-convoi-clean/README.md <<'EOF'
          # Mode Convoi clean source

          This directory is the canonical Android source starting with 0.3.24.
          It was promoted from the fully reconstructed and validated 0.3.23 tree.
          Future builds must compile this source directly and must not replay the historical patch chain.
          EOF
          grep -q "versionCode 27" mode-convoi-clean/android/app/build.gradle
          grep -q "versionName '0.3.24'" mode-convoi-clean/android/app/build.gradle
          grep -q 'fitMapPageNoScroll' mode-convoi-clean/android/app/src/main/java/ch/piiwii/modeconvoi/MainActivity.java
          grep -q 'convoy_alerts_v2' mode-convoi-clean/android/app/src/main/java/ch/piiwii/modeconvoi/MainActivity.java
          grep -q 'state.initiator' mode-convoi-clean/android/app/src/main/java/ch/piiwii/modeconvoi/LiveTalkieManager.java

      - name: Commit canonical clean source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mode-convoi-clean
          if ! git diff --cached --quiet; then
            git commit -m 'Promote Mode Convoi 0.3.24 clean canonical source'
            git push origin HEAD:mode-convoi-apk-build
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile directly from clean source
        run: gradle -p mode-convoi-clean/android --no-daemon assembleDebug

      - name: Verify no patch-chain dependency
        shell: bash
        run: |
          set -euo pipefail
          test -f mode-convoi-clean/android/app/build/outputs/apk/debug/app-debug.apk
          ! grep -R "ux_03\|ux03" -n mode-convoi-clean/android --exclude-dir=build || true
          cp mode-convoi-clean/android/app/build/outputs/apk/debug/app-debug.apk ModeConvoi-0.3.24-CLEAN-TEST.apk
          sha256sum ModeConvoi-0.3.24-CLEAN-TEST.apk > ModeConvoi-0.3.24-CLEAN-TEST.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ModeConvoi-0.3.24-clean-compile
          if-no-files-found: error
          path: |
            ModeConvoi-0.3.24-CLEAN-TEST.apk
            ModeConvoi-0.3.24-CLEAN-TEST.apk.sha256
            mode-convoi-clean/README.md
