name: Foire du Valais 1.5.31 final dedupe
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/foire-valais-extra-1531-final.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download 1.5.31 sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p previous buildsrc
          gh run download 36510802970 -R piiwii1/wlm-escargot-android-updates -n Foire-du-Valais-2026-1.5.31 -D previous
          unzip -q previous/Foire-du-Valais-2026-1.5.31-SOURCES.zip -d buildsrc
      - name: Remove old duplicate cortège seed
        run: |
          python - <<'PY'
          p='buildsrc/app/src/main/java/ch/piiwii/foirevalais/MainActivity.java'
          s=open(p,encoding='utf-8').read()
          old='int[] ids={101,31001,31002,31003,31004};'
          new='int[] ids={20,101,31001,31002,31003,31004};'
          assert old in s
          s=s.replace(old,new,1)
          open(p,'w',encoding='utf-8').write(s)
          PY
          grep -q 'int\[\] ids={20,101,31001,31002,31003,31004};' buildsrc/app/src/main/java/ch/piiwii/foirevalais/MainActivity.java
          grep -q 'versionCode = 37' buildsrc/app/build.gradle.kts
      - name: Install Android SDK 35
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build release
        working-directory: buildsrc
        run: gradle --no-daemon :app:assembleRelease
      - name: Prepare artifact
        run: |
          set -euo pipefail
          mkdir -p deliverables/sign-tools/lib
          /usr/local/lib/android/sdk/build-tools/35.0.0/zipalign -f -p 4 buildsrc/app/build/outputs/apk/release/app-release-unsigned.apk deliverables/Foire-du-Valais-2026-1.5.31-ALIGNED-UNSIGNED.apk
          cp /usr/local/lib/android/sdk/build-tools/35.0.0/lib/apksigner.jar deliverables/sign-tools/lib/apksigner.jar
          cd buildsrc
          zip -qr ../deliverables/Foire-du-Valais-2026-1.5.31-SOURCES.zip . -x '*/build/*' '.gradle/*'
      - uses: actions/upload-artifact@v4
        with:
          name: Foire-du-Valais-2026-1.5.31-final
          path: deliverables/*
          retention-days: 7
