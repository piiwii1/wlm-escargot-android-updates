name: Build AppDoctor 2.1.0 Integrated ADB

on:
  push:
    branches: [main]
    paths:
      - 'appdoctor-build-v210/**'
      - '.github/workflows/appdoctor-public-build-v210.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore and verify source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p appdoctor-build-v210/out appdoctor-build-v210/work
          cat appdoctor-build-v210/source.b64.part.* | base64 -d > appdoctor-build-v210/source.zip
          unzip -q appdoctor-build-v210/source.zip -d appdoctor-build-v210/work
          ROOT=appdoctor-build-v210/work/AppDoctor-2.1.0-source
          grep -q "versionCode 4" "$ROOT/app/build.gradle"
          grep -q "versionName '2.1.0'" "$ROOT/app/build.gradle"
          grep -q 'android.permission.INTERNET' "$ROOT/app/src/main/AndroidManifest.xml"
          grep -q 'PairCodeReceiver' "$ROOT/app/src/main/AndroidManifest.xml"
          grep -q 'AppDoctorApplication' "$ROOT/app/src/main/AndroidManifest.xml"
          grep -q 'DÉMARRER' "$ROOT/app/src/main/java/ch/piiwii/appdoctor/MainActivity.java"
          grep -q 'ARRÊTER' "$ROOT/app/src/main/java/ch/piiwii/appdoctor/MainActivity.java"
          grep -q 'DIAGNOSTIC' "$ROOT/app/src/main/java/ch/piiwii/appdoctor/MainActivity.java"
          if grep -q 'Shizuku' "$ROOT/app/src/main/AndroidManifest.xml"; then exit 1; fi

      - name: Build release APK
        id: compile
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle -p appdoctor-build-v210/work/AppDoctor-2.1.0-source --no-daemon assembleRelease 2>&1 | tee appdoctor-build-v210/out/build.log

      - name: Collect APK and signing tool
        if: steps.compile.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          cp appdoctor-build-v210/work/AppDoctor-2.1.0-source/app/build/outputs/apk/release/app-release-unsigned.apk appdoctor-build-v210/out/AppDoctor-2.1.0-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" appdoctor-build-v210/out/apksigner.jar
          sha256sum appdoctor-build-v210/out/AppDoctor-2.1.0-unsigned.apk > appdoctor-build-v210/out/AppDoctor-2.1.0-unsigned.apk.sha256

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AppDoctor-2.1.0-unsigned-tools
          if-no-files-found: error
          path: appdoctor-build-v210/out/

      - name: Fail if compile failed
        if: steps.compile.outcome != 'success'
        run: exit 1
