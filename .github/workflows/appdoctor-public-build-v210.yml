name: Build AppDoctor 2.1.0 Integrated ADB

on:
  push:
    branches: [main]
    paths:
      - 'appdoctor-build-v210/**'
      - '.github/workflows/appdoctor-public-build-v210.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p appdoctor-build-v210/out appdoctor-build-v210/work
          cat appdoctor-build-v210/source.b64.part.00 appdoctor-build-v210/source.b64.part.01 appdoctor-build-v210/source.b64.part.02 appdoctor-build-v210/source.b64.part.03 appdoctor-build-v210/source.b64.tail.0 appdoctor-build-v210/source.b64.tail.1 appdoctor-build-v210/source.b64.tail.2 | base64 -d > appdoctor-build-v210/source.zip
          unzip -t appdoctor-build-v210/source.zip
          unzip -q appdoctor-build-v210/source.zip -d appdoctor-build-v210/work
          ROOT=appdoctor-build-v210/work/AppDoctor-2.1.0-source
          test -f "$ROOT/app/build.gradle"
          sed -i 's/^android\.useAndroidX=.*/android.useAndroidX=true/' "$ROOT/gradle.properties"
          grep -q '^android.useAndroidX=true' "$ROOT/gradle.properties"
          echo "$ROOT" > appdoctor-build-v210/root.txt

      - name: Build release APK
        id: compile
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ROOT=$(cat appdoctor-build-v210/root.txt)
          gradle -p "$ROOT" --no-daemon assembleRelease 2>&1 | tee appdoctor-build-v210/out/build.log

      - name: Collect APK and signing tool
        if: steps.compile.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          ROOT=$(cat appdoctor-build-v210/root.txt)
          cp "$ROOT/app/build/outputs/apk/release/app-release-unsigned.apk" appdoctor-build-v210/out/AppDoctor-2.1.0-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" appdoctor-build-v210/out/apksigner.jar
          sha256sum appdoctor-build-v210/out/AppDoctor-2.1.0-unsigned.apk > appdoctor-build-v210/out/AppDoctor-2.1.0-unsigned.apk.sha256

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AppDoctor-2.1.0-unsigned-tools
          if-no-files-found: error
          path: appdoctor-build-v210/out/

      - name: Fail if compile failed
        if: steps.compile.outcome != 'success'
        run: exit 1
