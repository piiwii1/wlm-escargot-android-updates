name: WA Archive Engine 0.3.4 Build

on:
  push:
    branches: [ waarchive-engine-build ]
    paths:
      - 'waarchive-engine-build/**'
      - '.github/workflows/waarchive-engine-build-temp.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release APK
        working-directory: waarchive-engine-build
        run: gradle --no-daemon --stacktrace assembleRelease
      - name: Verify APK
        run: |
          test -f waarchive-engine-build/app/build/outputs/apk/release/app-release-unsigned.apk
          ls -lh waarchive-engine-build/app/build/outputs/apk/release/app-release-unsigned.apk
          sha256sum waarchive-engine-build/app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WAArchive-0.3.4-unsigned
          path: waarchive-engine-build/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 3
          if-no-files-found: error
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: WAArchive-0.3.4-source
          path: waarchive-engine-build
          retention-days: 7
          if-no-files-found: error
      - name: Upload official apksigner tool
        uses: actions/upload-artifact@v4
        with:
          name: Android-35-apksigner
          path: ${{ env.ANDROID_HOME }}/build-tools/35.0.0/lib/apksigner.jar
          retention-days: 1
          if-no-files-found: error
