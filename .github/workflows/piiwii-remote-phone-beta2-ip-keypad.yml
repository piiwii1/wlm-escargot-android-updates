name: PiiWii Remote Phone beta2 IP Keypad

on:
  push:
    branches:
      - piiwii-remote-v2-phone-beta2-ip-keypad
    paths:
      - .github/workflows/piiwii-remote-phone-beta2-ip-keypad.yml
      - piiwii-remote-v2-phone-beta2/prepare_beta2.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Prepare beta2 source
        shell: bash
        run: |
          set -e
          bash piiwii-remote-v2-lot12/reconstruct-lot12.sh /tmp/piiwii-phone-beta2-src
          python piiwii-remote-v2-phone-beta2/prepare_beta2.py /tmp/piiwii-phone-beta2-src/piiwii-remote
          ROOT=/tmp/piiwii-phone-beta2-src/piiwii-remote
          grep -q 'versionCode = 32' "$ROOT/remote/build.gradle.kts"
          grep -q 'versionName = "2.0.0-beta2"' "$ROOT/remote/build.gradle.kts"
          grep -q 'DigitsKeyListener.getInstance("0123456789.,")' "$ROOT/remote/src/main/java/ch/piiwii/remote2/ui/MainActivity.kt"
          grep -q 'TYPE_NUMBER_FLAG_DECIMAL' "$ROOT/remote/src/main/java/ch/piiwii/remote2/ui/MainActivity.kt"
          grep -q 'WindowInsetsCompat.Type.systemBars() or WindowInsetsCompat.Type.displayCutout()' "$ROOT/remote/src/main/java/ch/piiwii/remote2/ui/MainActivity.kt"
          grep -q 'PairingCodec.authenticated' "$ROOT/remote/src/main/java/ch/piiwii/remote2/ui/MainViewModel.kt"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          echo 'ANDROID_HOME=/usr/local/lib/android/sdk' >> "$GITHUB_ENV"
          echo 'ANDROID_SDK_ROOT=/usr/local/lib/android/sdk' >> "$GITHUB_ENV"
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test and build
        working-directory: /tmp/piiwii-phone-beta2-src/piiwii-remote
        run: gradle --no-daemon --stacktrace :remote:testDebugUnitTest :remote:assembleRelease

      - name: Validate and package
        shell: bash
        run: |
          set -e
          ROOT=/tmp/piiwii-phone-beta2-src/piiwii-remote
          OUT=/tmp/piiwii-phone-beta2-out
          mkdir -p "$OUT"
          RAW="$ROOT/remote/build/outputs/apk/release/remote-release-unsigned.apk"
          APK="$OUT/PiiWii-Remote-Phone-2.0.0-beta2-aligned-unsigned.apk"
          /usr/local/lib/android/sdk/build-tools/35.0.0/zipalign -f 4 "$RAW" "$APK"
          /usr/local/lib/android/sdk/build-tools/35.0.0/zipalign -c -v 4 "$APK" > "$OUT/PHONE-ZIPALIGN.txt"
          /usr/local/lib/android/sdk/build-tools/35.0.0/aapt dump badging "$APK" > "$OUT/PHONE-BADGING.txt"
          grep -q "package: name='ch.piiwii.remote2' versionCode='32' versionName='2.0.0-beta2'" "$OUT/PHONE-BADGING.txt"
          unzip -t "$APK" > "$OUT/PHONE-ZIPTEST.txt"
          unzip -p "$APK" 'classes*.dex' | strings > "$OUT/DEX-STRINGS.txt"
          grep -q '0123456789.,' "$OUT/DEX-STRINGS.txt"
          grep -q 'PAIR_REQUEST' "$OUT/DEX-STRINGS.txt"
          cd /tmp/piiwii-phone-beta2-src
          zip -qr "$OUT/PiiWii-Remote-2.0.0-beta2-Phone-Sources.zip" piiwii-remote -x '*/build/*' '*/.gradle/*' '*/.kotlin/*' '*.jks' '*.keystore' '*Signing.properties'
          unzip -l "$OUT/PiiWii-Remote-2.0.0-beta2-Phone-Sources.zip" > "$OUT/SOURCE-ZIP-LIST.txt"
          if grep -Ei '\.(jks|keystore)$|Signing\.properties' "$OUT/SOURCE-ZIP-LIST.txt"; then exit 9; fi
          sha256sum "$APK" "$OUT/PiiWii-Remote-2.0.0-beta2-Phone-Sources.zip" > "$OUT/CI-SHA256.txt"
          echo 'PIIWII REMOTE PHONE BETA2 IP KEYPAD AUDIT PASSED' > "$OUT/AUDIT.txt"
          echo 'IP field uses numeric decimal keypad; dot and comma accepted, comma normalized to dot.' >> "$OUT/AUDIT.txt"
          echo 'Pairing code remains numeric. Pairing/auth and WindowInsets retained.' >> "$OUT/AUDIT.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: PiiWii-Remote-Phone-2.0.0-beta2-IP-Keypad
          path: /tmp/piiwii-phone-beta2-out/*
          retention-days: 7
          if-no-files-found: error
