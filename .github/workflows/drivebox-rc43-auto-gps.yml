name: Build DriveBox RC43 Auto GPS

on:
  push:
    branches: [ drivebox-rc43-auto-gps ]
    paths:
      - '.github/workflows/drivebox-rc43-auto-gps.yml'
      - 'drivebox-ci/rc43v2.part*.b64'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore validated RC42 source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9642249630/zip" -o /tmp/rc42-artifact.zip
          rm -rf /tmp/rc42-artifact /tmp/drivebox-src
          mkdir -p /tmp/rc42-artifact /tmp/drivebox-src
          unzip -oq /tmp/rc42-artifact.zip -d /tmp/rc42-artifact
          test "$(sha256sum /tmp/rc42-artifact/DriveBox-1.0.0-RC42-source.zip | awk '{print $1}')" = '3fb1437a8b2cb46cec6fd4ca4b58b072333db0760abda55243d2ecba441feb72'
          unzip -oq /tmp/rc42-artifact/DriveBox-1.0.0-RC42-source.zip -d /tmp/drivebox-src
          grep -q 'versionCode 51' /tmp/drivebox-src/app/build.gradle
          grep -q "versionName '1.0.0-rc42'" /tmp/drivebox-src/app/build.gradle

      - name: Verify and apply RC43 auto GPS patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum drivebox-ci/rc43v2.part00.b64 | awk '{print $1}')" = 'f3ef73fd10750d32da6ef9a8cf9beabf9cae0e7aed2769f921db5f670b45f1ea'
          test "$(sha256sum drivebox-ci/rc43v2.part01.b64 | awk '{print $1}')" = '852f3c90fc521eb3e27a3bfe0f38a093ae0afbfa7465532cdd0a1ec66c960350'
          test "$(sha256sum drivebox-ci/rc43v2.part02.b64 | awk '{print $1}')" = 'dd28e0ae237a53c83d081d7792f47e46913dfad774daa16a197ac642907af825'
          test "$(sha256sum drivebox-ci/rc43v2.part03.b64 | awk '{print $1}')" = '3f7324ae50a8bdeab8c122650970ca80f7e8c928c50e07fe8267c270ecb9a633'
          test "$(sha256sum drivebox-ci/rc43v2.part04.b64 | awk '{print $1}')" = 'b3016c4d10aa840e435e65601912974f698deb4734d616cc4d68329a4daf1be1'
          cat drivebox-ci/rc43v2.part*.b64 | base64 -d > /tmp/rc43.patch.gz
          test "$(sha256sum /tmp/rc43.patch.gz | awk '{print $1}')" = '29a5fc30d6d4eaa4449ed06c8d32599eb6571cb1ca953a7f3a9a5fee8387e8d2'
          gzip -d -c /tmp/rc43.patch.gz > /tmp/rc43.patch
          test "$(sha256sum /tmp/rc43.patch | awk '{print $1}')" = 'c9139cb46aa6a65dc4d75dc8ef4f7bc8cdcf12ec3ba9d5cf4fa93ebd6a737ca9'
          cd /tmp/drivebox-src
          patch -p1 < /tmp/rc43.patch

          grep -q 'versionCode 52' app/build.gradle
          grep -q "versionName '1.0.0-rc43'" app/build.gradle
          grep -q 'android.permission.ACCESS_BACKGROUND_LOCATION' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.FOREGROUND_SERVICE_LOCATION' app/src/main/AndroidManifest.xml
          grep -q 'ParkingAutoLocationService' app/src/main/AndroidManifest.xml
          grep -q 'foregroundServiceType="location"' app/src/main/AndroidManifest.xml
          grep -q 'ParkingAutoBootReceiver' app/src/main/AndroidManifest.xml
          test -f app/src/main/java/ch/clubvwsuisse/drivebox/ParkingAutoMotionPolicy.java
          test -f app/src/main/java/ch/clubvwsuisse/drivebox/ParkingAutoController.java
          test -f app/src/main/java/ch/clubvwsuisse/drivebox/ParkingAutoLocationService.java
          test -f app/src/main/java/ch/clubvwsuisse/drivebox/ParkingAutoBootReceiver.java
          grep -q 'startAutomatic' app/src/main/java/ch/clubvwsuisse/drivebox/ParkingSessionStore.java
          grep -q 'Automatique GPS' app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java
          test "$(grep -R -h '@Test' app/src/test/java | wc -l)" -ge 12
          test -f CONTINUITE-RC43.md
          if grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml; then echo 'Unexpected INTERNET permission'; exit 1; fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests and compile RC43
        working-directory: /tmp/drivebox-src
        run: gradle --no-daemon clean :app:testDebugUnitTest :app:assembleDebug

      - name: Verify and package RC43
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/drivebox-src/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/cert.txt
          grep -qi '6699b2b6b15b5e09032b4f54c5c26bbd982a41dc48d5a5093d1501036a474a1e' /tmp/cert.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='ch.clubvwsuisse.drivebox.v1'" /tmp/badging.txt
          grep -q "versionCode='52'" /tmp/badging.txt
          grep -q "versionName='1.0.0-rc43'" /tmp/badging.txt
          grep -q "application-label:'DriveBox'" /tmp/badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | tee /tmp/perms.txt
          grep -q 'android.permission.CAMERA' /tmp/perms.txt
          grep -q 'android.permission.ACCESS_FINE_LOCATION' /tmp/perms.txt
          grep -q 'android.permission.ACCESS_BACKGROUND_LOCATION' /tmp/perms.txt
          grep -q 'android.permission.FOREGROUND_SERVICE_LOCATION' /tmp/perms.txt
          grep -q 'android.permission.POST_NOTIFICATIONS' /tmp/perms.txt
          if grep -q 'android.permission.INTERNET' /tmp/perms.txt; then exit 1; fi
          unzip -t "$APK"
          unzip -p "$APK" res/mipmap-xxxhdpi-v4/ic_launcher.webp > /tmp/icon.webp
          test "$(sha256sum /tmp/icon.webp | awk '{print $1}')" = 'ab5bbd86c44f537aae43e60584c39c923cee3e7c855ae887332617158c0e8a05'
          cp "$APK" "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC43.apk"
          rm -rf /tmp/drivebox-src/app/build /tmp/drivebox-src/.gradle
          (cd /tmp/drivebox-src && zip -qr "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC43-source.zip" .)
          sha256sum "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC43.apk" > "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC43.apk.sha256.txt"
          sha256sum "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC43-source.zip" > "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC43-source.zip.sha256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: DriveBox-1.0.0-RC43-AUTO-GPS
          path: |
            DriveBox-1.0.0-RC43.apk
            DriveBox-1.0.0-RC43.apk.sha256.txt
            DriveBox-1.0.0-RC43-source.zip
            DriveBox-1.0.0-RC43-source.zip.sha256.txt
          if-no-files-found: error
          retention-days: 7
