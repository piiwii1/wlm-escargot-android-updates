name: Calculette+ 1.6.4 Build

on:
  push:
    branches: [ rabais-express-build ]
    paths:
      - '.github/workflows/rabais-express-164.yml'
      - 'build-input/calculette-plus-icon.webp'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      SDKMANAGER: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct verified 1.6.3 and apply Calculette+ identity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          p=Path('.github/workflows/rabais-express-163.yml')
          s=p.read_text()
          marker='      - name: Reconstruct verified 1.6.2 and integrate real vector icons\n        run: |\n'
          start=s.index(marker)+len(marker)
          end=s.index('\n      - name: Setup Java 17', start)
          block=textwrap.dedent(s[start:end])
          Path('/tmp/reconstruct163.sh').write_text('set -euo pipefail\n'+block+'\n')
          PY
          bash /tmp/reconstruct163.sh

          echo '446c937dc9c426c9076e180cc975d5c5677a8eac987cfcfdd961a7acd6c0422c  build-input/calculette-plus-icon.webp' | sha256sum -c -

          python3 - <<'PY'
          from pathlib import Path

          gradle=Path('rabais-express/app/build.gradle')
          g=gradle.read_text()
          if 'versionCode 15' not in g or "versionName '1.6.3'" not in g:
              raise SystemExit('Unexpected 1.6.3 version metadata')
          g=g.replace('versionCode 15','versionCode 16',1).replace("versionName '1.6.3'","versionName '1.6.4'",1)
          gradle.write_text(g)

          manifest=Path('rabais-express/app/src/main/AndroidManifest.xml')
          m=manifest.read_text()
          if 'android:label="Rabais Express"' not in m:
              raise SystemExit('Expected old application label missing')
          m=m.replace('android:label="Rabais Express"','android:label="Calculette+"',1)
          m=m.replace('android:icon="@drawable/ic_discount"','android:icon="@drawable/ic_calculette_plus"\n        android:roundIcon="@drawable/ic_calculette_plus"',1)
          manifest.write_text(m)

          for path in [
              Path('rabais-express/app/src/main/java/ch/piiwii/rabais/MainActivity.java'),
              Path('rabais-express/app/src/main/res/layout/activity_main.xml'),
          ]:
              s=path.read_text()
              s=s.replace('Rabais Express','Calculette+')
              path.write_text(s)
          PY

          mkdir -p rabais-express/app/src/main/res/drawable-nodpi
          cp build-input/calculette-plus-icon.webp rabais-express/app/src/main/res/drawable-nodpi/ic_calculette_plus.webp

          grep -q "applicationId 'ch.piiwii.rabaisexpress'" rabais-express/app/build.gradle
          grep -q "versionCode 16" rabais-express/app/build.gradle
          grep -q "versionName '1.6.4'" rabais-express/app/build.gradle
          grep -Fq 'android:label="Calculette+"' rabais-express/app/src/main/AndroidManifest.xml
          grep -Fq 'android:icon="@drawable/ic_calculette_plus"' rabais-express/app/src/main/AndroidManifest.xml
          grep -Fq 'android:roundIcon="@drawable/ic_calculette_plus"' rabais-express/app/src/main/AndroidManifest.xml
          grep -Fq 'Calculette+' rabais-express/app/src/main/res/layout/activity_main.xml
          ! grep -R -q 'Rabais Express' rabais-express/app/src/main/AndroidManifest.xml rabais-express/app/src/main/res/layout/activity_main.xml rabais-express/app/src/main/java/ch/piiwii/rabais/MainActivity.java
          test -f rabais-express/app/src/main/res/drawable-nodpi/ic_calculette_plus.webp
          test -f rabais-express/app/src/main/res/drawable/nav_rabais.xml
          test -f rabais-express/app/src/main/res/drawable/nav_devises.xml
          test -f rabais-express/app/src/main/res/drawable/nav_calculatrice.xml
          test -f rabais-express/app/src/main/res/drawable/nav_parametres.xml
          ! grep -q 'ScrollView' rabais-express/app/src/main/res/layout/activity_main.xml

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned release APK
        working-directory: rabais-express
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Prepare delivery
        run: |
          mkdir -p delivery/signing-tools/lib
          APK='rabais-express/app/build/outputs/apk/release/app-release-unsigned.apk'
          cp "$APK" delivery/Calculette-Plus-1.6.4-UNSIGNED.apk
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" delivery/signing-tools/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/lib/apksigner.jar" delivery/signing-tools/lib/apksigner.jar
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2" delivery/signing-tools/aapt2
          chmod +x delivery/signing-tools/* || true
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2" dump badging "$APK" > delivery/BADGING.txt
          (cd rabais-express && zip -qr ../delivery/Calculette-Plus-1.6.4-SOURCES.zip . -x 'app/build/*' '.gradle/*')
          sha256sum delivery/Calculette-Plus-1.6.4-UNSIGNED.apk delivery/Calculette-Plus-1.6.4-SOURCES.zip > delivery/SHA256-UNSIGNED.txt

      - name: Upload APK source and signing tools
        uses: actions/upload-artifact@v4
        with:
          name: Calculette-Plus-1.6.4-UNSIGNED-TOOLS
          path: delivery/*
          retention-days: 7
          if-no-files-found: error
