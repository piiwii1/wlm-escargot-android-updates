name: Build DriveBox RC5 Clean Install APK

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'drivebox-ci/rc4-final-trigger.txt'
      - '.github/workflows/drivebox-rc4-final.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct base
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/drivebox-src
          mkdir -p /tmp/drivebox-src
          cat drivebox-ci/source.part*.b64 | tr -d '\r\n\t ' | base64 -d > /tmp/drivebox-source.zip
          unzip -q /tmp/drivebox-source.zip -d /tmp/drivebox-src
          sed -i 's/@color\/drivebox_icon_bg/@color\/launcher_background/g' /tmp/drivebox-src/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          sed -i 's/@color\/drivebox_icon_bg/@color\/launcher_background/g' /tmp/drivebox-src/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Reuse RC2 and RC4 transformations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          def extract(path, step_name, out):
              text = Path(path).read_text()
              marker = '      - name: ' + step_name + '\n'
              start = text.index(marker)
              run_start = text.index('        run: |\n', start) + len('        run: |\n')
              end = text.find('\n      - name:', run_start)
              if end < 0: end = len(text)
              block = text[run_start:end]
              lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
              Path(out).write_text('\n'.join(lines) + '\n')
          extract('.github/workflows/drivebox-build.yml', 'Apply DriveBox RC2 cleanup', '/tmp/rc2.sh')
          extract('.github/workflows/drivebox-rc4-build.yml', 'Apply RC4 cleanup, exact icon, stable signing', '/tmp/rc4.sh')
          PY
          bash /tmp/rc2.sh
          bash /tmp/rc4.sh
          keytool -list -keystore /tmp/drivebox-src/drivebox-dev.keystore -storepass DriveBoxDev2026 -alias drivebox | grep -qi drivebox

      - name: Force clean-install identity and RC5 version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          g = Path('/tmp/drivebox-src/app/build.gradle')
          s = g.read_text()
          s = s.replace("applicationId 'ch.clubvwsuisse.drivebox'", "applicationId 'ch.clubvwsuisse.drivebox.v1'")
          s = s.replace('versionCode 13', 'versionCode 14')
          s = s.replace("versionName '1.0.0-rc4'", "versionName '1.0.0-rc5'")
          g.write_text(s)
          j = Path('/tmp/drivebox-src/app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java')
          t = j.read_text().replace('DriveBox 1.0.0 RC4', 'DriveBox 1.0.0 RC5')
          j.write_text(t)
          PY
          grep -q "applicationId 'ch.clubvwsuisse.drivebox.v1'" /tmp/drivebox-src/app/build.gradle
          grep -q "versionCode 14" /tmp/drivebox-src/app/build.gradle
          grep -q "versionName '1.0.0-rc5'" /tmp/drivebox-src/app/build.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        working-directory: /tmp/drivebox-src
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Verify and stage
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/drivebox-src/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/cert.txt
          grep -qi '6699b2b6b15b5e09032b4f54c5c26bbd982a41dc48d5a5093d1501036a474a1e' /tmp/cert.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='ch.clubvwsuisse.drivebox.v1'" /tmp/badging.txt
          grep -q "application-label:'DriveBox'" /tmp/badging.txt
          unzip -t "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC5-CLEAN-INSTALL.apk"
          sha256sum "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC5-CLEAN-INSTALL.apk" > "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC5-CLEAN-INSTALL.apk.sha256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: DriveBox-1.0.0-RC5-CLEAN-INSTALL
          path: |
            DriveBox-1.0.0-RC5-CLEAN-INSTALL.apk
            DriveBox-1.0.0-RC5-CLEAN-INSTALL.apk.sha256.txt
          if-no-files-found: error
          retention-days: 7
