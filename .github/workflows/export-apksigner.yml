name: Export apksigner

on:
  push:
    branches: [mode-convoi-apk-build]
    paths: ['.github/workflows/export-apksigner.yml']
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
      - name: Install build tools
        run: sdkmanager 'build-tools;35.0.0'
      - name: Package apksigner
        shell: bash
        run: |
          mkdir -p out/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" out/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" out/lib/
          chmod +x out/apksigner
      - uses: actions/upload-artifact@v4
        with:
          name: apksigner-35
          path: out
