name: Mode Convoi secure payload joiner

on:
  push:
    branches: [ mode-convoi-secure-build ]
    paths:
      - '.github/workflows/mode-convoi-secure-join.yml'

permissions:
  contents: read
  issues: write

jobs:
  join:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Join encrypted Mode Convoi chunks
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: '40'
        run: |
          set -euo pipefail
          SESSION=''
          for i in $(seq 1 60); do
            SESSION=$(gh api --paginate repos/${GITHUB_REPOSITORY}/issues/${ISSUE}/comments --jq '.[] | select(.body | startswith("MC_PUBLIC_KEY_V1:")) | .body' | tail -n 1 | cut -d: -f2 || true)
            [ -n "$SESSION" ] && break
            sleep 3
          done
          test -n "$SESSION"
          DONE=''
          for i in $(seq 1 120); do
            DONE=$(gh api --paginate repos/${GITHUB_REPOSITORY}/issues/${ISSUE}/comments --jq ".[] | select(.body | startswith(\"MC_CHUNK_DONE_V1:${SESSION}:\")) | .body" | tail -n 1 || true)
            [ -n "$DONE" ] && break
            sleep 3
          done
          test -n "$DONE"
          COUNT=${DONE##*:}
          : > /tmp/mc-joined.txt
          for N in $(seq 1 "$COUNT"); do
            BODY=$(gh api --paginate repos/${GITHUB_REPOSITORY}/issues/${ISSUE}/comments --jq ".[] | select(.body | startswith(\"MC_CHUNK_V1:${SESSION}:${N}:\")) | .body" | tail -n 1)
            test -n "$BODY"
            PREFIX="MC_CHUNK_V1:${SESSION}:${N}:"
            printf '%s' "${BODY#${PREFIX}}" >> /tmp/mc-joined.txt
          done
          BODY="MC_PAYLOAD_V1:${SESSION}:$(cat /tmp/mc-joined.txt)"
          test $(printf '%s' "$BODY" | wc -c) -lt 65000
          jq -n --arg body "$BODY" '{body:$body}' > /tmp/comment.json
          gh api --method POST repos/${GITHUB_REPOSITORY}/issues/${ISSUE}/comments --input /tmp/comment.json >/dev/null
