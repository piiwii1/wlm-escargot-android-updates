name: PiiWii Documents 0.2.0 Windows Build
on:
  push:
    branches:
      - build/piiwii-documents-0.2.0
    paths:
      - 'build-piiwii-documents-020/**'
      - '.github/workflows/piiwii-documents-020-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble and verify source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-piiwii-documents-020/work
          cat build-piiwii-documents-020/chunks/00 build-piiwii-documents-020/chunks/01 build-piiwii-documents-020/chunks/02 build-piiwii-documents-020/chunks/03 build-piiwii-documents-020/chunks/04 build-piiwii-documents-020/chunks/05 > build-piiwii-documents-020/source.b64
          echo '6d37c515522fda2925dd30c6b914b5f827f166c6f3c079bc63adbd9a5833d6d0  build-piiwii-documents-020/source.b64' | sha256sum -c -
          base64 -d build-piiwii-documents-020/source.b64 > build-piiwii-documents-020/source.zip
          echo 'e08a27fe01d6f23787e4ac7b0588781ed5088726c2a406f1a504c8c0db8d4df8  build-piiwii-documents-020/source.zip' | sha256sum -c -
          unzip -t build-piiwii-documents-020/source.zip
          unzip -q -o build-piiwii-documents-020/source.zip -d build-piiwii-documents-020/work

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore and publish application
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore build-piiwii-documents-020/work/src/PiiWii.Documents/PiiWii.Documents.csproj -r win-x64
          dotnet publish build-piiwii-documents-020/work/src/PiiWii.Documents/PiiWii.Documents.csproj -c Release -r win-x64 --self-contained true -o build-piiwii-documents-020/work/publish
          test -f build-piiwii-documents-020/work/publish/PiiWii.Documents.exe

      - name: Build installer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-piiwii-documents-020/work/src/PiiWii.Documents.Installer/payload
          cp build-piiwii-documents-020/work/publish/PiiWii.Documents.exe build-piiwii-documents-020/work/src/PiiWii.Documents.Installer/payload/PiiWii.Documents.exe
          dotnet restore build-piiwii-documents-020/work/src/PiiWii.Documents.Installer/PiiWii.Documents.Installer.csproj -r win-x64
          dotnet publish build-piiwii-documents-020/work/src/PiiWii.Documents.Installer/PiiWii.Documents.Installer.csproj -c Release -r win-x64 --self-contained true -o build-piiwii-documents-020/work/installer-publish
          test -f build-piiwii-documents-020/work/installer-publish/PiiWii-Documents-Setup-0.2.0.exe

      - name: Package deliverables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-piiwii-documents-020/work/dist
          cp build-piiwii-documents-020/work/installer-publish/PiiWii-Documents-Setup-0.2.0.exe build-piiwii-documents-020/work/dist/
          cp build-piiwii-documents-020/work/publish/PiiWii.Documents.exe build-piiwii-documents-020/work/dist/PiiWii-Documents-0.2.0-PORTABLE.exe
          cd build-piiwii-documents-020/work
          zip -qr dist/PiiWii-Documents-0.2.0-SOURCES.zip src README.md CHANGELOG.md
          mkdir -p PACK-REPRISE
          cp README.md CHANGELOG.md PACK-REPRISE/
          cp ../source.b64 PACK-REPRISE/
          cp ../../.github/workflows/piiwii-documents-020-build.yml PACK-REPRISE/
          zip -qr dist/PiiWii-Documents-0.2.0-PACK-REPRISE.zip PACK-REPRISE
          cd dist
          sha256sum PiiWii-Documents-Setup-0.2.0.exe PiiWii-Documents-0.2.0-PORTABLE.exe PiiWii-Documents-0.2.0-SOURCES.zip PiiWii-Documents-0.2.0-PACK-REPRISE.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: PiiWii-Documents-0.2.0-BINARIES
          path: |
            build-piiwii-documents-020/work/dist/PiiWii-Documents-Setup-0.2.0.exe
            build-piiwii-documents-020/work/dist/PiiWii-Documents-0.2.0-PORTABLE.exe
            build-piiwii-documents-020/work/dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload source pack
        uses: actions/upload-artifact@v4
        with:
          name: PiiWii-Documents-0.2.0-SOURCEPACK
          path: |
            build-piiwii-documents-020/work/dist/PiiWii-Documents-0.2.0-SOURCES.zip
            build-piiwii-documents-020/work/dist/PiiWii-Documents-0.2.0-PACK-REPRISE.zip
            build-piiwii-documents-020/work/dist/SHA256SUMS.txt
          if-no-files-found: error
