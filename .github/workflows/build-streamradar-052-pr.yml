name: Build StreamRadar 0.52.0 installable PR

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'temp-streamradar-052/**'
      - '.github/workflows/build-streamradar-052-pr.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Récupérer source 0.51 validée
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9563548387/zip" -o /tmp/sr051-artifact.zip
          mkdir -p /tmp/sr051-artifact /tmp/streamradar-src
          unzip -q /tmp/sr051-artifact.zip -d /tmp/sr051-artifact
          test -f /tmp/sr051-artifact/StreamRadar-0.51.0-source.zip
          unzip -q /tmp/sr051-artifact/StreamRadar-0.51.0-source.zip -d /tmp/streamradar-src
          test -f /tmp/streamradar-src/android/app/build.gradle.kts

      - name: Appliquer StreamRadar 0.52.0
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/streamradar-src/android
          patch -p1 --dry-run < "$GITHUB_WORKSPACE/temp-streamradar-052/patch.diff"
          patch -p1 < "$GITHUB_WORKSPACE/temp-streamradar-052/patch.diff"

          # Garder exactement l'icône StreamRadar existante, sans la redessiner :
          # on retire uniquement les coins noirs du JPG et on les rend transparents.
          command -v convert >/dev/null || { sudo apt-get update -qq; sudo apt-get install -y imagemagick; }
          ICON_DIR="app/src/main/res/drawable-nodpi"
          test -f "$ICON_DIR/streamradar_brand.jpg"
          convert -size 192x192 xc:none -fill white -draw "roundrectangle 0,0 191,191 42,42" /tmp/streamradar-mask.png
          convert "$ICON_DIR/streamradar_brand.jpg" /tmp/streamradar-mask.png -alpha off -compose CopyOpacity -composite "$ICON_DIR/streamradar_brand.png"
          rm "$ICON_DIR/streamradar_brand.jpg"
          file "$ICON_DIR/streamradar_brand.png" | grep -q 'PNG image data'

          grep -q 'applicationId = "ch.piiwii.streamradar2"' app/build.gradle.kts
          grep -q 'versionName = "0.52.0"' app/build.gradle.kts
          grep -q 'versionCode = 52' app/build.gradle.kts
          grep -q 'width(92.dp)' app/src/main/java/ch/piiwii/streamradar/StreamRadarApp.kt
          grep -q 'requestSize = PosterRequestSize.CARD' app/src/main/java/ch/piiwii/streamradar/StreamRadarApp.kt
          test -f app/src/main/res/drawable-nodpi/streamradar_brand.png
          test ! -f app/src/main/res/drawable-nodpi/streamradar_brand.jpg

      - name: Préparer sources 0.52
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/streamradar-src
          zip -qr /tmp/StreamRadar-0.52.0-source.zip android -x 'android/.gradle/*' 'android/app/build/*' 'android/build/*'

      - name: Compiler release
        working-directory: /tmp/streamradar-src/android
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk /tmp/StreamRadar-0.52.0-aligned.apk

      - name: Récupérer la clé StreamRadar
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9539378213/zip" -o /tmp/streamradar-signing.zip
          mkdir -p /tmp/streamradar-signing
          unzip -q /tmp/streamradar-signing.zip -d /tmp/streamradar-signing
          test -f /tmp/streamradar-signing/StreamRadar-release.jks
          test -f /tmp/streamradar-signing/SIGNING.txt

      - name: Signer et vérifier
        shell: bash
        run: |
          set -euo pipefail
          STOREPASS="$(sed -n 's/^storePassword=//p' /tmp/streamradar-signing/SIGNING.txt)"
          KEYPASS="$(sed -n 's/^keyPassword=//p' /tmp/streamradar-signing/SIGNING.txt)"
          ALIAS="$(sed -n 's/^alias=//p' /tmp/streamradar-signing/SIGNING.txt)"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks /tmp/streamradar-signing/StreamRadar-release.jks --ks-key-alias "$ALIAS" --ks-pass "pass:$STOREPASS" --key-pass "pass:$KEYPASS" --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true --out /tmp/StreamRadar-0.52.0-INSTALLABLE.apk /tmp/StreamRadar-0.52.0-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs /tmp/StreamRadar-0.52.0-INSTALLABLE.apk | tee /tmp/verify-052.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/verify-052.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/verify-052.txt
          grep -qi 'Signer #1 certificate SHA-256 digest: dd7ba53a3fe59e22b8dac20251711929dd0cbc9e0cc211f1c1cac8499aca4bec' /tmp/verify-052.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging /tmp/StreamRadar-0.52.0-INSTALLABLE.apk | head -n 3 | tee /tmp/package-052.txt
          grep -q "package: name='ch.piiwii.streamradar2' versionCode='52' versionName='0.52.0'" /tmp/package-052.txt
          sha256sum /tmp/StreamRadar-0.52.0-INSTALLABLE.apk > /tmp/StreamRadar-0.52.0-INSTALLABLE.apk.sha256

      - name: Publier APK installable
        uses: actions/upload-artifact@v4
        with:
          name: StreamRadar-0.52.0-INSTALLABLE
          path: |
            /tmp/StreamRadar-0.52.0-INSTALLABLE.apk
            /tmp/StreamRadar-0.52.0-INSTALLABLE.apk.sha256
            /tmp/StreamRadar-0.52.0-source.zip
            /tmp/verify-052.txt
            /tmp/package-052.txt
          if-no-files-found: error
          retention-days: 1
