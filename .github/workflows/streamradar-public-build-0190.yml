name: StreamRadar Public Build 0.19.0

on:
  pull_request:
    paths:
      - 'streamradar-0.19.0-public-build/**'
      - '.github/workflows/streamradar-public-build-0190.yml'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild 0.18.0 and apply 0.19.0
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-4160-81f4-b702-35509fa6ea43/raw?se=2026-08-24T14%3A22%3A57Z&sp=r&sv=2026-02-06&sr=b&scid=9398e572-d7b8-5081-8f30-45fc897a88ee&skoid=c30e7ce7-1f51-4051-a377-288cdba21c02&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-24T09%3A38%3A11Z&ske=2026-08-25T09%3A38%3A11Z&sks=b&skv=2026-02-06&sig=toX3BeyA27v1ad0zAKGol6sYBZyc5r0DUrAJsgh0B5s%3D' -o /tmp/base-artifact.zip
          mkdir -p /tmp/base-artifact /tmp/sr-source
          unzip -q /tmp/base-artifact.zip -d /tmp/base-artifact
          SRCZIP="$(find /tmp/base-artifact -maxdepth 2 -type f -name 'StreamRadar-0.18.0-SOURCE-COMPLET.zip' | head -1)"
          test -n "$SRCZIP"
          unzip -q "$SRCZIP" -d /tmp/sr-source
          cd /tmp/sr-source/StreamRadar-0.18.0
          git init -q
          git config user.email build@streamradar.local
          git config user.name StreamRadarBuild
          git add .
          git commit -qm base
          python3 - <<'PY'
          import base64, gzip, re
          from pathlib import Path
          import os
          root = Path(os.environ['GITHUB_WORKSPACE']) / 'streamradar-0.19.0-public-build'
          txt = (root / 'patch-v2.gz.b64').read_text(encoding='utf-8', errors='ignore')
          clean = re.sub(r'[^A-Za-z0-9+/=]', '', txt)
          patch = gzip.decompress(base64.b64decode(clean))
          Path('/tmp/sr019.patch').write_bytes(patch)
          print('patch bytes', len(patch))
          PY
          git apply /tmp/sr019.patch
          mkdir -p android/app/src/main/res/drawable-nodpi
          cp "$GITHUB_WORKSPACE/streamradar-0.19.0-public-build/official-icon.jpg" android/app/src/main/res/drawable-nodpi/streamradar_brand.jpg
          grep -q 'versionCode = 19' android/app/build.gradle.kts
          grep -q 'versionName = "0.19.0"' android/app/build.gradle.kts
          grep -q 'android:icon="@drawable/streamradar_brand"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@drawable/streamradar_brand"' android/app/src/main/AndroidManifest.xml
          grep -q 'Films • Séries • Dernières sorties' android/app/src/main/java/ch/piiwii/streamradar/StreamRadarApp.kt
          ICON=android/app/src/main/res/drawable-nodpi/streamradar_brand.jpg
          echo '65dbf44e4a589a6553ea8217c13547e873cae107b26341204c5cce4005b84188  '"$ICON" | sha256sum -c -
          file "$ICON" | grep -q '192x192'
          cd /tmp/sr-source
          mv StreamRadar-0.18.0 StreamRadar-0.19.0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Compile APK
        working-directory: /tmp/sr-source/StreamRadar-0.19.0/android
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/sr-source/StreamRadar-0.19.0/android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "package: name='ch.piiwii.streamradar' versionCode='19' versionName='0.19.0'"
          cp "$APK" /tmp/StreamRadar-0.19.0.apk
          sha256sum /tmp/StreamRadar-0.19.0.apk > /tmp/StreamRadar-0.19.0-SHA256.txt

      - name: Package source
        shell: bash
        run: |
          cd /tmp/sr-source
          zip -qr /tmp/StreamRadar-0.19.0-SOURCE-COMPLET.zip StreamRadar-0.19.0 -x '*/build/*' '*/.gradle/*' '*/.kotlin/*'

      - name: Upload APK and source
        uses: actions/upload-artifact@v4
        with:
          name: StreamRadar-0.19.0-PublicBuild
          path: |
            /tmp/StreamRadar-0.19.0.apk
            /tmp/StreamRadar-0.19.0-SHA256.txt
            /tmp/StreamRadar-0.19.0-SOURCE-COMPLET.zip
          if-no-files-found: error
          retention-days: 14
