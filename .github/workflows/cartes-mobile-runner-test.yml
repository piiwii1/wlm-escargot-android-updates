name: Cartes Organizer Mobile Build

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/cartes-mobile-runner-test.yml'
      - 'cartes-mobile-ci/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          d=Path('cartes-mobile-ci/parts/part-04').read_bytes()
          for i in range(0,len(d),100): print(i, hashlib.sha256(d[i:i+100]).hexdigest())
          PY
          cat cartes-mobile-ci/parts/part-* > /tmp/source.b64
          test "$(wc -c < /tmp/source.b64)" -eq 31828
          echo '5e9e0a72a4ab90e7b871fc670d3ea50518baac99e4c8c6b46beee32c115e0212  /tmp/source.b64' | sha256sum -c -
          base64 -d /tmp/source.b64 > /tmp/cartes-mobile.zip
          echo '51bd63cf41b125d3c787ca06672136e89a0338bc260df7abb7377478154f8641  /tmp/cartes-mobile.zip' | sha256sum -c -
          rm -rf /tmp/cartes-mobile
          mkdir -p /tmp/cartes-mobile
          unzip -q /tmp/cartes-mobile.zip -d /tmp/cartes-mobile
          test -f /tmp/cartes-mobile/cartes-mobile-public-src/app/build.gradle.kts

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools" >/dev/null || true
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -x "$ANDROID_HOME/build-tools/35.0.0/zipalign"
          test -f "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build and align release APK
        shell: bash
        run: |
          set -euo pipefail
          PROJ=/tmp/cartes-mobile/cartes-mobile-public-src
          gradle -p "$PROJ" --no-daemon --stacktrace :app:assembleRelease
          mkdir -p ci-output
          cp "$PROJ/app/build/outputs/apk/release/app-release-unsigned.apk" ci-output/Cartes-Organizer-Mobile-0.2.0-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 ci-output/Cartes-Organizer-Mobile-0.2.0-unsigned.apk ci-output/Cartes-Organizer-Mobile-0.2.0-aligned-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 ci-output/Cartes-Organizer-Mobile-0.2.0-aligned-unsigned.apk > ci-output/zipalign-verify.txt
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" ci-output/apksigner.jar
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging ci-output/Cartes-Organizer-Mobile-0.2.0-aligned-unsigned.apk > ci-output/metadata.txt
          sha256sum ci-output/Cartes-Organizer-Mobile-0.2.0-aligned-unsigned.apk > ci-output/unsigned-SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cartes-Organizer-Mobile-0.2.0-signing-input
          path: ci-output/
          retention-days: 7
          if-no-files-found: error
