name: Cartes Organizer Mobile Build

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/cartes-mobile-runner-test.yml'
      - 'cartes-mobile-ci/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source
        shell: bash
        run: |
          set -euo pipefail
          cat cartes-mobile-ci/parts/part-* > /tmp/source.b64
          test "$(wc -c < /tmp/source.b64)" -eq 28520
          echo '17ebf63a2851aed9d7588823da8797a19792a4160688b379d442300a687f6aab  /tmp/source.b64' | sha256sum -c -
          base64 -d /tmp/source.b64 > /tmp/cartes-mobile.zip
          echo 'fb17bef51ebd4d50804baf1c711d0bfca56cf96a37433ed7cfc8557365752600  /tmp/cartes-mobile.zip' | sha256sum -c -
          rm -rf /tmp/cartes-mobile
          mkdir -p /tmp/cartes-mobile
          unzip -q /tmp/cartes-mobile.zip -d /tmp/cartes-mobile
          test -f /tmp/cartes-mobile/cartes-mobile-public-src/app/build.gradle.kts

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools" >/dev/null || true
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          PROJ=/tmp/cartes-mobile/cartes-mobile-public-src
          gradle -p "$PROJ" --no-daemon --stacktrace :app:assembleRelease
          mkdir -p ci-output
          cp "$PROJ/app/build/outputs/apk/release/app-release-unsigned.apk" ci-output/Cartes-Organizer-Mobile-0.1.0-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging ci-output/Cartes-Organizer-Mobile-0.1.0-unsigned.apk > ci-output/metadata.txt
          sha256sum ci-output/Cartes-Organizer-Mobile-0.1.0-unsigned.apk > ci-output/unsigned-SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cartes-Organizer-Mobile-0.1.0-unsigned
          path: ci-output/
          retention-days: 7
          if-no-files-found: error
