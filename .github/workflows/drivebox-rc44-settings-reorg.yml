name: Build DriveBox RC44 Settings Reorg

on:
  push:
    branches: [ drivebox-rc44-settings-reorg ]
    paths:
      - '.github/workflows/drivebox-rc44-settings-reorg.yml'
      - 'drivebox-ci/rc44.part*.b64'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore validated RC43 source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9649728885/zip" -o /tmp/rc43-artifact.zip
          rm -rf /tmp/rc43-artifact /tmp/drivebox-src
          mkdir -p /tmp/rc43-artifact /tmp/drivebox-src
          unzip -oq /tmp/rc43-artifact.zip -d /tmp/rc43-artifact
          test "$(sha256sum /tmp/rc43-artifact/DriveBox-1.0.0-RC43-source.zip | awk '{print $1}')" = 'e3cec24f36c87691523f280d1fff0fd980dd94f3c92215a08e2272dcf6ebaaf8'
          unzip -oq /tmp/rc43-artifact/DriveBox-1.0.0-RC43-source.zip -d /tmp/drivebox-src
          grep -q 'versionCode 52' /tmp/drivebox-src/app/build.gradle
          grep -q "versionName '1.0.0-rc43'" /tmp/drivebox-src/app/build.gradle

      - name: Verify and apply RC44 settings patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum drivebox-ci/rc44.part00.b64 | awk '{print $1}')" = '18293148617c724438c03ac2413770265cbe0d9f0b5574b1ba6fa54335fa88f1'
          test "$(sha256sum drivebox-ci/rc44.part01.b64 | awk '{print $1}')" = 'eb201c4eb5066fea4e67b95234d7d308e723842020defbe9066dd2d829c732ac'
          cat drivebox-ci/rc44.part*.b64 | base64 -d > /tmp/rc44.patch.gz
          test "$(sha256sum /tmp/rc44.patch.gz | awk '{print $1}')" = '6db93ea61782b417a48bf3358aac681ea634dee2353a929f3776484cff4944db'
          gzip -d -c /tmp/rc44.patch.gz > /tmp/rc44.patch
          test "$(sha256sum /tmp/rc44.patch | awk '{print $1}')" = '00caba289b97c7bd284ad189c49798b40852e714699566d040f23ee6eab3fd10'
          cd /tmp/drivebox-src
          patch -p1 < /tmp/rc44.patch
          grep -q 'versionCode 53' app/build.gradle
          grep -q "versionName '1.0.0-rc44'" app/build.gradle
          grep -q 'TextView settings = pill("⚙"' app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java
          if grep -q 'setContentDescription("Ouvrir les favoris")' app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java; then echo 'Old home favorites button still present'; exit 1; fi
          grep -q 'sectionTitle("STATIONNEMENT")' app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java
          grep -q '"Historique des arrêts"' app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java
          grep -q 'this::settingsScreen);' app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java
          test "$(grep -R -h '@Test' app/src/test/java | wc -l)" -ge 12
          test -f CONTINUITE-RC44.md
          python - <<'PY'
from pathlib import Path
s=Path('app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java').read_text()
parking=s[s.index('private void parkingScreen()'):s.index('private void startParkingFromDraft', s.index('private void parkingScreen()'))]
assert 'Historique des arrêts' not in parking
assert 'Automatique GPS' not in parking
settings=s[s.index('private void settingsScreen()'):s.index('private void aboutScreen()', s.index('private void settingsScreen()'))]
assert 'Historique des arrêts' in settings
assert 'Automatique GPS' in settings
PY
          if grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml; then echo 'Unexpected INTERNET permission'; exit 1; fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests and compile RC44
        working-directory: /tmp/drivebox-src
        run: gradle --no-daemon clean :app:testDebugUnitTest :app:assembleDebug

      - name: Verify and package RC44
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/drivebox-src/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/cert.txt
          grep -qi '6699b2b6b15b5e09032b4f54c5c26bbd982a41dc48d5a5093d1501036a474a1e' /tmp/cert.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='ch.clubvwsuisse.drivebox.v1'" /tmp/badging.txt
          grep -q "versionCode='53'" /tmp/badging.txt
          grep -q "versionName='1.0.0-rc44'" /tmp/badging.txt
          grep -q "application-label:'DriveBox'" /tmp/badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | tee /tmp/perms.txt
          grep -q 'android.permission.ACCESS_FINE_LOCATION' /tmp/perms.txt
          grep -q 'android.permission.ACCESS_BACKGROUND_LOCATION' /tmp/perms.txt
          grep -q 'android.permission.FOREGROUND_SERVICE_LOCATION' /tmp/perms.txt
          grep -q 'android.permission.POST_NOTIFICATIONS' /tmp/perms.txt
          if grep -q 'android.permission.INTERNET' /tmp/perms.txt; then exit 1; fi
          unzip -t "$APK"
          unzip -p "$APK" res/mipmap-xxxhdpi-v4/ic_launcher.webp > /tmp/icon.webp
          test "$(sha256sum /tmp/icon.webp | awk '{print $1}')" = 'ab5bbd86c44f537aae43e60584c39c923cee3e7c855ae887332617158c0e8a05'
          cp "$APK" "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC44.apk"
          rm -rf /tmp/drivebox-src/app/build /tmp/drivebox-src/.gradle
          (cd /tmp/drivebox-src && zip -qr "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC44-source.zip" .)
          sha256sum "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC44.apk" > "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC44.apk.sha256.txt"
          sha256sum "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC44-source.zip" > "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC44-source.zip.sha256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: DriveBox-1.0.0-RC44-SETTINGS-REORG
          path: |
            DriveBox-1.0.0-RC44.apk
            DriveBox-1.0.0-RC44.apk.sha256.txt
            DriveBox-1.0.0-RC44-source.zip
            DriveBox-1.0.0-RC44-source.zip.sha256.txt
          if-no-files-found: error
          retention-days: 7
