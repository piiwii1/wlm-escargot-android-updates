name: PiiWii Remote Phone beta14 exact transparent icons

on:
  push:
    branches: [piiwii-remote-phone-beta11-icons]
    paths:
      - 'piiwii-remote-phone-beta14-exact-icons/**'
      - '.github/workflows/piiwii-remote-phone-beta11-icons.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct beta10 memory and apply beta14 UI
        shell: bash
        run: |
          set -euo pipefail
          bash piiwii-remote-v2-lot12/reconstruct-lot12.sh /tmp/src
          ROOT=/tmp/src/piiwii-remote
          for v in 3 4 5 6 7 8; do
            base64 -d piiwii-remote-phone-beta${v}/phone-beta${v}.patch.xz.b64 > /tmp/p.patch.xz
            xz -dc /tmp/p.patch.xz > /tmp/p.patch
            (cd "$ROOT" && patch -p1 < /tmp/p.patch)
          done
          base64 -d piiwii-remote-phone-beta9/phone-beta9.patch.xz.b64 > /tmp/p9.patch.xz
          xz -dc /tmp/p9.patch.xz > /tmp/p9.patch
          (cd "$ROOT" && patch -p1 < /tmp/p9.patch)
          (cd "$ROOT" && patch -p1 < "$GITHUB_WORKSPACE/piiwii-remote-phone-beta9/phone-beta9-fix1.patch")
          (cd "$ROOT" && patch -p1 < "$GITHUB_WORKSPACE/piiwii-remote-phone-beta9/phone-beta9-space.patch")
          (cd "$ROOT" && patch -p1 < "$GITHUB_WORKSPACE/piiwii-remote-phone-beta10-memory/phone-beta10-memory.patch")

          python3 - "$ROOT" <<'PY'
          from pathlib import Path
          import re, sys
          root = Path(sys.argv[1])

          p = root / 'remote/build.gradle.kts'
          s = p.read_text()
          s = s.replace('versionCode = 40','versionCode = 44',1)
          s = s.replace('versionName = "2.0.0-beta10"','versionName = "2.0.0-beta14"',1)
          p.write_text(s)

          p = root / 'remote/src/main/java/ch/piiwii/remote2/ui/MainShellView.kt'
          s = p.read_text()
          if 'import android.widget.ImageView\n' not in s:
              s = s.replace('import android.widget.FrameLayout\n','import android.widget.FrameLayout\nimport android.widget.ImageView\n',1)
          if 'import ch.piiwii.remote2.R\n' not in s:
              s = s.replace('import android.widget.ViewFlipper\n','import android.widget.ViewFlipper\nimport ch.piiwii.remote2.R\n',1)

          s = s.replace('addView(bottomBar(), LayoutParams(LayoutParams.MATCH_PARENT, UiKit.dp(context, 70)))',
                        'addView(bottomBar(), LayoutParams(LayoutParams.MATCH_PARENT, UiKit.dp(context, 88)))',1)

          # Keep settings icon as before; the user's current request concerns the four bottom-menu icons.
          settings_pattern = re.compile(r'        addView\(TextView\(context\)\.apply \{\s*\n\s*text = "⚙"\s*\n.*?contentDescription = "Paramètres".*?\n\s*\}, LayoutParams\(UiKit\.dp\(context, 52\), UiKit\.dp\(context, 52\)\)\.apply \{\s*\n\s*marginStart = UiKit\.dp\(context, 8\)\s*\n\s*\}\)', re.S)
          new_settings='''        addView(ImageView(context).apply {
              setImageResource(R.drawable.ic_settings_custom)
              adjustViewBounds = true
              scaleType = ImageView.ScaleType.FIT_CENTER
              setPadding(UiKit.dp(context, 2), UiKit.dp(context, 2), UiKit.dp(context, 2), UiKit.dp(context, 2))
              isClickable = true
              isFocusable = true
              contentDescription = "Paramètres"
              background = null
              setOnClickListener { settingsClick?.invoke() }
          }, LayoutParams(UiKit.dp(context, 48), UiKit.dp(context, 48)).apply {
              marginStart = UiKit.dp(context, 8)
          })'''
          s,c=settings_pattern.subn(new_settings,s,count=1)
          assert c==1, 'settings block not replaced'

          nav_pattern=re.compile(r'                addView\(TextView\(context\)\.apply \{\s*\n\s*text = section\.glyph\s*\n\s*textSize = 21f\s*\n\s*gravity = Gravity\.CENTER\s*\n\s*\}\)\s*\n\s*addView\(TextView\(context\)\.apply \{\s*\n\s*text = section\.label\s*\n\s*textSize = 10f\s*\n\s*gravity = Gravity\.CENTER\s*\n\s*maxLines = 1\s*\n\s*\}\)')
          new_nav='''                addView(ImageView(context).apply {
                      setImageResource(when (section) {
                          RemoteSection.REMOTE, RemoteSection.NAVIGATION -> R.drawable.ic_remote_custom
                          RemoteSection.TOUCHPAD -> R.drawable.ic_touchpad_custom
                          RemoteSection.KEYBOARD, RemoteSection.KEYBOARD_ADVANCED -> R.drawable.ic_keyboard_custom
                          RemoteSection.APPS -> R.drawable.ic_apps_custom
                      })
                      adjustViewBounds = true
                      scaleType = ImageView.ScaleType.FIT_CENTER
                      contentDescription = section.label
                  }, LayoutParams(UiKit.dp(context, 64), UiKit.dp(context, 64)))'''
          s,c=nav_pattern.subn(new_nav,s,count=1)
          assert c==1, 'bottom nav blocks not replaced'

          # The images already contain transparency. Do not draw a button/background behind them.
          old_bg='view.background = UiKit.rounded(if (active) UiKit.SURFACE_ALT else UiKit.SURFACE, 14, context)'
          assert old_bg in s, 'nav background line not found'
          s = s.replace(old_bg, 'view.background = null', 1)
          old_loop='''            for (i in 0 until view.childCount) {
                (view.getChildAt(i) as? TextView)?.setTextColor(if (active) UiKit.ACCENT else UiKit.TEXT_SECONDARY)
            }'''
          new_loop='''            for (i in 0 until view.childCount) {
                (view.getChildAt(i) as? ImageView)?.alpha = if (active) 1f else 0.84f
            }'''
          assert old_loop in s, 'nav state loop not found'
          s = s.replace(old_loop, new_loop, 1)
          p.write_text(s)
          PY

          RES="$ROOT/remote/src/main/res/drawable-nodpi"
          mkdir -p "$RES"
          cp "$GITHUB_WORKSPACE/piiwii-remote-phone-beta14-exact-icons/icon-assets/ic_remote.png" "$RES/ic_remote_custom.png"
          cp "$GITHUB_WORKSPACE/piiwii-remote-phone-beta14-exact-icons/icon-assets/ic_touchpad.png" "$RES/ic_touchpad_custom.png"
          cp "$GITHUB_WORKSPACE/piiwii-remote-phone-beta14-exact-icons/icon-assets/ic_keyboard.png" "$RES/ic_keyboard_custom.png"
          cp "$GITHUB_WORKSPACE/piiwii-remote-phone-beta14-exact-icons/icon-assets/ic_apps.png" "$RES/ic_apps_custom.png"
          curl -fsSL "https://raw.githubusercontent.com/piiwii1/wlm-escargot-android-updates/piiwii-remote-v2-phone-beta10-icons/piiwii-remote-phone-beta10/icon-assets/ic_settings.png" -o "$RES/ic_settings_custom.png"

          grep -q 'versionCode = 44' "$ROOT/remote/build.gradle.kts"
          grep -q 'versionName = "2.0.0-beta14"' "$ROOT/remote/build.gradle.kts"
          grep -Fq 'devices.firstOrNull { it.id == selectedId }?.let { return it }' "$ROOT/remote/src/main/java/ch/piiwii/remote2/device/DeviceSelectionPolicy.kt"
          grep -q 'UiKit.dp(context, 64)' "$ROOT/remote/src/main/java/ch/piiwii/remote2/ui/MainShellView.kt"
          grep -q 'view.background = null' "$ROOT/remote/src/main/java/ch/piiwii/remote2/ui/MainShellView.kt"
          ! grep -q 'text = section.label' "$ROOT/remote/src/main/java/ch/piiwii/remote2/ui/MainShellView.kt"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        shell: bash
        run: |
          echo 'ANDROID_HOME=/usr/local/lib/android/sdk' >> "$GITHUB_ENV"
          echo 'ANDROID_SDK_ROOT=/usr/local/lib/android/sdk' >> "$GITHUB_ENV"
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests and release build
        working-directory: /tmp/src/piiwii-remote
        run: gradle --no-daemon --stacktrace :remote:testDebugUnitTest :remote:assembleRelease

      - name: Validate and package beta14
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/src/piiwii-remote
          OUT=/tmp/out
          mkdir -p "$OUT"
          ZIPALIGN=/usr/local/lib/android/sdk/build-tools/35.0.0/zipalign
          AAPT=/usr/local/lib/android/sdk/build-tools/35.0.0/aapt
          RAW="$ROOT/remote/build/outputs/apk/release/remote-release-unsigned.apk"
          APK="$OUT/PiiWii-Remote-Phone-2.0.0-beta14-UNSIGNED.apk"
          "$ZIPALIGN" -f 4 "$RAW" "$APK"
          "$ZIPALIGN" -c -v 4 "$APK" > "$OUT/ZIPALIGN.txt"
          "$AAPT" dump badging "$APK" > "$OUT/BADGING.txt"
          grep -q "package: name='ch.piiwii.remote2' versionCode='44' versionName='2.0.0-beta14'" "$OUT/BADGING.txt"
          unzip -t "$APK" > "$OUT/ZIPTEST.txt"
          sha256sum "$APK" > "$OUT/SHA256.txt"
          cp /usr/local/lib/android/sdk/build-tools/35.0.0/lib/apksigner.jar "$OUT/apksigner.jar"

      - uses: actions/upload-artifact@v4
        with:
          name: PiiWii-Remote-Phone-2.0.0-beta14-UNSIGNED
          path: /tmp/out/*
          retention-days: 7
          if-no-files-found: error
