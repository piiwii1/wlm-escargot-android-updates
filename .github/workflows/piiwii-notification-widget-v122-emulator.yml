name: PiiWii 1.0.22 Appearance Android Emulator Smoke Test
on:
  push:
    branches: [chatgpt/piiwii-notification-widget-122]
    paths:
      - '.github/workflows/piiwii-notification-widget-v122-emulator.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  android-ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download compiled 1.0.22 release artifact
        uses: actions/download-artifact@v4
        with:
          name: PiiWii-Notification-Widget-1.0.22-build
          run-id: 40386785859
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: out
      - name: Prepare installation signature for emulator
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -keystore /tmp/widget-smoke.jks -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 30 -dname "CN=Android UI Smoke"
          java -jar out/apksigner.jar sign --ks /tmp/widget-smoke.jks --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey --out /tmp/widget-smoke.apk out/PiiWii-Notification-Widget-1.0.22-UNSIGNED.apk
          java -jar out/apksigner.jar verify --min-sdk-version 26 /tmp/widget-smoke.apk
      - name: Grant emulator KVM permissions
        run: |
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; fi
      - name: Launch emulator and tap Appearance
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -eu
            adb install -r /tmp/widget-smoke.apk
            adb logcat -c
            adb shell am start -n ch.piiwii.notificationwidget/.MainActivity
            sleep 6
            adb shell uiautomator dump /sdcard/smoke_before.xml
            adb pull /sdcard/smoke_before.xml /tmp/smoke_before.xml
            python3 - <<'PY'
            import xml.etree.ElementTree as ET
            import re
            root=ET.parse('/tmp/smoke_before.xml').getroot()
            for node in root.iter('node'):
                desc=node.attrib.get('content-desc','')
                if desc.startswith('Apparence'):
                    b=node.attrib.get('bounds','')
                    p=list(map(int,re.findall(r'\d+',b)))
                    assert len(p)==4,(desc,b)
                    x=(p[0]+p[2])//2
                    y=(p[1]+p[3])//2
                    open('/tmp/appearance_point.txt','w').write(f'{x} {y}\n')
                    print('Appearance tab:',desc,'at',x,y)
                    break
            else: raise RuntimeError('Appearance tab not found in activity hierarchy')
            PY
            read x y < /tmp/appearance_point.txt
            adb shell input tap "$x" "$y"
            sleep 6
            pid=$(adb shell pidof ch.piiwii.notificationwidget | tr -d '\r')
            test -n "$pid" || { echo 'App died on Appearance click'; adb logcat -d -t 220; exit 1; }
            adb shell uiautomator dump /sdcard/smoke_after.xml
            adb pull /sdcard/smoke_after.xml /tmp/smoke_after.xml
            python3 - <<'PY'
            import xml.etree.ElementTree as ET
            root=ET.parse('/tmp/smoke_after.xml').getroot()
            content=' '.join(n.attrib.get('text','')+' '+n.attrib.get('content-desc','') for n in root.iter('node'))
            assert 'Galerie graphique' in content or 'Apparence — mode de secours' in content,content[:2000]
            print('PASS: Appearance visible after clicking, with normal page or guarded recovery.')
            PY
            if adb logcat -d | grep -E 'FATAL EXCEPTION.*|Process: ch.piiwii.notificationwidget' | grep -q 'ch.piiwii.notificationwidget'; then
              echo 'FATAL EXCEPTION seen'; exit 1
            fi
            echo 'Emulator Appearance interaction smoke test passed'
