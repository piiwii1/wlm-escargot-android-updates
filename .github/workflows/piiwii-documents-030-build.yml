name: PiiWii Documents 0.3.0 Windows Build
on:
  push:
    branches:
      - build/piiwii-documents-0.3.0
    paths:
      - 'build-piiwii-documents-030/**'
      - '.github/workflows/piiwii-documents-030-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble and verify source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-piiwii-documents-030/work
          cat build-piiwii-documents-030/chunks/00 build-piiwii-documents-030/chunks/01 build-piiwii-documents-030/chunks/02 build-piiwii-documents-030/chunks/03 build-piiwii-documents-030/chunks/04 build-piiwii-documents-030/chunks/05 build-piiwii-documents-030/chunks/06 > build-piiwii-documents-030/source.b64
          base64 -d build-piiwii-documents-030/source.b64 > build-piiwii-documents-030/source.zip
          echo '92c2cd3353440df926bc6615b8c8f017acdff14955e873220aeff00d1d482973  build-piiwii-documents-030/source.zip' | sha256sum -c -
          set +e
          unzip -t build-piiwii-documents-030/source.zip
          rc=$?
          set -e
          if [ "$rc" -gt 1 ]; then exit "$rc"; fi
          set +e
          unzip -q -o build-piiwii-documents-030/source.zip -d build-piiwii-documents-030/work
          rc=$?
          set -e
          if [ "$rc" -gt 1 ]; then exit "$rc"; fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore and publish application
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore build-piiwii-documents-030/work/src/PiiWii.Documents/PiiWii.Documents.csproj -r win-x64
          dotnet publish build-piiwii-documents-030/work/src/PiiWii.Documents/PiiWii.Documents.csproj -c Release -r win-x64 --self-contained true -o build-piiwii-documents-030/work/publish
          test -f build-piiwii-documents-030/work/publish/PiiWii.Documents.exe

      - name: Build installer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-piiwii-documents-030/work/src/PiiWii.Documents.Installer/payload
          cp build-piiwii-documents-030/work/publish/PiiWii.Documents.exe build-piiwii-documents-030/work/src/PiiWii.Documents.Installer/payload/PiiWii.Documents.exe
          dotnet restore build-piiwii-documents-030/work/src/PiiWii.Documents.Installer/PiiWii.Documents.Installer.csproj -r win-x64
          dotnet publish build-piiwii-documents-030/work/src/PiiWii.Documents.Installer/PiiWii.Documents.Installer.csproj -c Release -r win-x64 --self-contained true -o build-piiwii-documents-030/work/installer-publish
          test -f build-piiwii-documents-030/work/installer-publish/PiiWii-Documents-Setup-0.3.0.exe

      - name: Package deliverables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-piiwii-documents-030/work/dist
          cp build-piiwii-documents-030/work/installer-publish/PiiWii-Documents-Setup-0.3.0.exe build-piiwii-documents-030/work/dist/
          cp build-piiwii-documents-030/work/publish/PiiWii.Documents.exe build-piiwii-documents-030/work/dist/PiiWii-Documents-0.3.0-PORTABLE.exe
          cd build-piiwii-documents-030/work
          rm -rf src/PiiWii.Documents.Installer/payload
          zip -qr dist/PiiWii-Documents-0.3.0-SOURCES.zip src README.md CHANGELOG.md
          mkdir -p PACK-REPRISE
          cp README.md CHANGELOG.md PACK-REPRISE/
          cp ../source.zip PACK-REPRISE/PiiWii-Documents-0.3.0-SOURCEPAYLOAD.zip
          cp ../../.github/workflows/piiwii-documents-030-build.yml PACK-REPRISE/
          zip -qr dist/PiiWii-Documents-0.3.0-PACK-REPRISE.zip PACK-REPRISE
          cd dist
          sha256sum PiiWii-Documents-Setup-0.3.0.exe PiiWii-Documents-0.3.0-PORTABLE.exe PiiWii-Documents-0.3.0-SOURCES.zip PiiWii-Documents-0.3.0-PACK-REPRISE.zip > PiiWii-Documents-0.3.0-SHA256SUMS.txt
          cat PiiWii-Documents-0.3.0-SHA256SUMS.txt

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: PiiWii-Documents-0.3.0-BINARIES
          path: |
            build-piiwii-documents-030/work/dist/PiiWii-Documents-Setup-0.3.0.exe
            build-piiwii-documents-030/work/dist/PiiWii-Documents-0.3.0-PORTABLE.exe
            build-piiwii-documents-030/work/dist/PiiWii-Documents-0.3.0-SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload sources and recovery
        uses: actions/upload-artifact@v4
        with:
          name: PiiWii-Documents-0.3.0-SOURCEPACK
          path: |
            build-piiwii-documents-030/work/dist/PiiWii-Documents-0.3.0-SOURCES.zip
            build-piiwii-documents-030/work/dist/PiiWii-Documents-0.3.0-PACK-REPRISE.zip
            build-piiwii-documents-030/work/dist/PiiWii-Documents-0.3.0-SHA256SUMS.txt
          if-no-files-found: error
