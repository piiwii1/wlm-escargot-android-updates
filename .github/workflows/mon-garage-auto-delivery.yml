name: Mon Garage Auto 1.0.2 - Downloadable Artifact
on:
  push:
    branches: [mon-garage-auto-v1.0.2-apk]
    paths:
      - '.github/workflows/mon-garage-auto-delivery.yml'
  workflow_dispatch:
jobs:
  artifact:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify APK
        run: |
          test -f MonGarageAuto-v1.0.2-debug.apk
          echo 'e4afca40f0ddb8378e5b92cde2cfb7ebd366e48440acfa4fba106c697b2e5f8c  MonGarageAuto-v1.0.2-debug.apk' | sha256sum -c -
      - name: Make APK available as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: MonGarageAuto-1.0.2-APK
          path: MonGarageAuto-v1.0.2-debug.apk
          retention-days: 7
          if-no-files-found: error
