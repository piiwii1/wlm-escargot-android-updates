name: PiiWii Files 1.3.7 Clean Build

on:
  push:
    branches:
      - piiwii-files-137-build
    paths-ignore:
      - 'piiwii-files-137-build/output/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Reconstruct project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/piiwii-files-137
          echo '1ce1aff417f98c7ee184b7dbee71b659c6ec83aed5d643073ef9569061b313d1  piiwii-files-137-build/source.part.00' | sha256sum -c -
          echo '2912d7c03e72a9f2a442e654aff80d2c83a6d5ca024d5bb8cc8e9c2a81edbca5  piiwii-files-137-build/source.part.01' | sha256sum -c -
          echo '22771d37a5f5fd7befd173753a0265debe1bdcfde0d9bbb5be408b1bdda81b08  piiwii-files-137-build/source.part.02' | sha256sum -c -
          echo 'e58eaab5cc304929514396672d51c6336170d1e52e8f480973fc2c658d86ebac  piiwii-files-137-build/source.part.03' | sha256sum -c -
          echo '0d09c2e799dce20570c2848455bb272b0516e0c589a4f3a64b8431fc9247ddaa  piiwii-files-137-build/source.part.04' | sha256sum -c -
          cat piiwii-files-137-build/source.part.00 \
              piiwii-files-137-build/source.part.01 \
              piiwii-files-137-build/source.part.02 \
              piiwii-files-137-build/source.part.03 \
              piiwii-files-137-build/source.part.04 \
              > /tmp/piiwii-files-137/source.b64
          base64 -d /tmp/piiwii-files-137/source.b64 > /tmp/piiwii-files-137/source.tar.gz
          echo '4c4633dc8f43e866887ee1bdcf85397a60a6af01c25cb1c0d3e491ca11f20754  /tmp/piiwii-files-137/source.tar.gz' | sha256sum -c -
          mkdir -p /tmp/piiwii-files-137/project
          tar -xzf /tmp/piiwii-files-137/source.tar.gz -C /tmp/piiwii-files-137/project

      - name: Build release
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/piiwii-files-137/project
          gradle --no-daemon clean assembleRelease

      - name: Export aligned unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/piiwii-files-137-build/output"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          RAW=/tmp/piiwii-files-137/project/app/build/outputs/apk/release/app-release-unsigned.apk
          APK=/tmp/PiiWii-Files-1.3.7-aligned-unsigned.apk
          test -f "$RAW"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 "$RAW" "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 8 > "$OUT/PiiWii-Files-1.3.7-metadata.txt"
          sha256sum "$APK" | sed 's#  .*#  PiiWii-Files-1.3.7-aligned-unsigned.apk#' > "$OUT/PiiWii-Files-1.3.7-unsigned.sha256"
          base64 -w0 "$APK" > /tmp/PiiWii-Files-1.3.7-unsigned.apk.b64
          split -b 8000 -d -a 3 /tmp/PiiWii-Files-1.3.7-unsigned.apk.b64 "$OUT/PiiWii-Files-1.3.7-unsigned.apk.b64.part."

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: piiwii-files-1.3.7-unsigned
          path: |
            /tmp/PiiWii-Files-1.3.7-aligned-unsigned.apk
            piiwii-files-137-build/output/PiiWii-Files-1.3.7-metadata.txt
            piiwii-files-137-build/output/PiiWii-Files-1.3.7-unsigned.sha256
          if-no-files-found: error

      - name: Commit build output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'PiiWii Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A piiwii-files-137-build/output
          git commit -m 'PiiWii Files 1.3.7 clean build output' || exit 0
          git push origin HEAD:piiwii-files-137-build
