name: ChatGPT Fetch Uber APK Signer
on:
  push:
    branches: [ 'chatgpt/euroscan-1.3.13-redesign' ]
    paths: [ '.github/workflows/chatgpt-fetch-uber-apk-signer.yml' ]
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download trusted public signer tool
        run: |
          curl -L --fail --retry 3 -o /tmp/uber-apk-signer-1.3.0.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          echo 'e1299fd6fcf4da527dd53735b56127e8ea922a321128123b9c32d619bba1d835  /tmp/uber-apk-signer-1.3.0.jar' | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: uber-apk-signer-1.3.0
          path: /tmp/uber-apk-signer-1.3.0.jar
          retention-days: 1
          compression-level: 0
