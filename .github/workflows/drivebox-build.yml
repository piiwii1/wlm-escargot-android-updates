name: Build DriveBox APK

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'drivebox-ci/**'
      - '.github/workflows/drivebox-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct DriveBox source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/drivebox-src
          cat drivebox-ci/source.part*.b64 | base64 -d > /tmp/drivebox-source.zip
          unzip -q /tmp/drivebox-source.zip -d /tmp/drivebox-src
          test -f /tmp/drivebox-src/app/build.gradle
          sed -i 's/@color\/drivebox_icon_bg/@color\/launcher_background/g' /tmp/drivebox-src/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          sed -i 's/@color\/drivebox_icon_bg/@color\/launcher_background/g' /tmp/drivebox-src/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: /tmp/drivebox-src
        shell: bash
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify and stage APK
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/drivebox-src/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC1-debug.apk"
          sha256sum "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC1-debug.apk" > "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC1-debug.apk.sha256.txt"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DriveBox-1.0.0-RC1-APK
          path: |
            DriveBox-1.0.0-RC1-debug.apk
            DriveBox-1.0.0-RC1-debug.apk.sha256.txt
          if-no-files-found: error
          retention-days: 7
