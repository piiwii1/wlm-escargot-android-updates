name: Build DriveBox APK

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'drivebox-ci/**'
      - '.github/workflows/drivebox-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct DriveBox source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/drivebox-src
          mkdir -p /tmp/drivebox-src
          for f in drivebox-ci/source.part*.b64; do
            echo "Checking $f ($(wc -c < "$f") chars)"
            if grep -n '[^A-Za-z0-9+/=[:space:]]' "$f"; then
              echo "Invalid Base64 character found in $f"
              exit 2
            fi
          done
          cat drivebox-ci/source.part*.b64 | tr -d '\r\n\t ' | base64 -d > /tmp/drivebox-source.zip
          unzip -t /tmp/drivebox-source.zip
          unzip -q /tmp/drivebox-source.zip -d /tmp/drivebox-src
          test -f /tmp/drivebox-src/app/build.gradle
          sed -i 's/@color\/drivebox_icon_bg/@color\/launcher_background/g' /tmp/drivebox-src/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          sed -i 's/@color\/drivebox_icon_bg/@color\/launcher_background/g' /tmp/drivebox-src/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Apply DriveBox RC2 cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          java = Path('/tmp/drivebox-src/app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java')
          s = java.read_text()

          def replace_between(src, start, next_start, new):
              a = src.index(start)
              b = src.index(next_start, a)
              return src[:a] + new + "\n\n    " + src[b:]

          s = s.replace('logo.setImageResource(ch.clubvwsuisse.drivebox.R.drawable.drivebox_logo);',
                        'logo.setImageResource(ch.clubvwsuisse.drivebox.R.drawable.ic_launcher_foreground);')
          s = s.replace('logo.setScaleType(ImageView.ScaleType.CENTER_CROP);',
                        'logo.setScaleType(ImageView.ScaleType.CENTER_INSIDE);\n        logo.setAdjustViewBounds(true);')
          s = s.replace('brandRow.addView(logo, lp(dp(72), dp(72), 0, 0, 14, 0));',
                        'brandRow.addView(logo, lp(dp(58), dp(58), 0, 0, 12, 0));')
          s = s.replace('TextView tagline = text("L\'essentiel auto, au même endroit.", 12, MUTED, false);',
                        'TextView tagline = text("Les infos et outils auto utiles, sans blabla.", 12, MUTED, false);')
          s = s.replace('search.setHint("🔎  Rechercher : huile, pneus, Italie, miles…");',
                        'search.setHint("Rechercher : huile, pneus, Italie, miles…");')
          s = s.replace('TextView quick = text("ACCÈS RAPIDE", 12, MUTED, true);\n        root.addView(quick, lp(-1, -2, 2, 0, 0, 8));',
                        'TextView quick = text("RUBRIQUES", 12, MUTED, true);\n        root.addView(quick, lp(-1, -2, 2, 0, 0, 8));')
          s = s.replace('"Niveaux & contrôles"', '"Contrôles du quotidien"')
          s = s.replace('"Types & marquages"', '"Lire, reconnaître, contrôler"')
          s = s.replace('"Repères en Europe"', '"Règles et repères utiles"')
          s = s.replace('"Calculs pratiques"', '"Conversions et calculs"')

          old_default_start = 'Runnable renderDefault = () -> {'
          old_default_end = '        };\n        renderDefault.run();'
          a = s.index(old_default_start)
          b = s.index(old_default_end, a)
          new_default = '''Runnable renderDefault = () -> {
              results.removeAllViews();

              results.addView(sectionTitle("À SAVOIR VITE"));
              results.addView(wideCard("🛢", "Niveau d'huile", "La bonne méthode pour lire la jauge", ORANGE, this::oilGuide));
              results.addView(wideCard("🛞", "Reconnaître ses pneus", "Été, hiver, 4 saisons et marquages", BLUE, this::tyreTypesGuide));
              results.addView(wideCard("⚠", "Voyants du tableau de bord", "Rouge, orange, vert : quoi faire ?", RED, this::warningLightsGuide));
              results.addView(wideCard("🛣", "Autoroutes en Europe", "Couleurs, vitesses et repères par pays", GREEN, this::countriesScreen));

              results.addView(sectionTitle("OUTILS UTILES"), lp(-1, -2, 0, 14, 0, 8));
              results.addView(wideCard("⇄", "Convertisseur km / miles", "Distance et vitesse", BLUE, this::converterScreen));
              results.addView(wideCard("⛽", "Calculateur de frais", "Carburant et partage du coût", GREEN, this::costCalculatorScreen));
              results.addView(wideCard("🧮", "Tous les calculateurs", "Pression, autonomie, pneus, temps de trajet…", PURPLE, this::toolsScreen));

              results.addView(sectionTitle("MES REPÈRES"), lp(-1, -2, 0, 14, 0, 8));
              results.addView(wideCard("🚗", "Mon véhicule", vehicleSummary(), BLUE, this::vehicleProfileScreen));
              if (favoriteCount() > 0) {
                  results.addView(wideCard("★", "Favoris", favoriteCount() + " raccourci(s) enregistré(s)", ORANGE, this::favoritesScreen));
              }

              results.addView(sectionTitle("PRÉPARER UN DÉPART"), lp(-1, -2, 0, 14, 0, 8));
              results.addView(wideCard("✓", "Check-lists", "Convoi ou long trajet, quand vous en avez besoin", MUTED, this::checklistsScreen));

              TextView offline = infoStrip("📴", "Les informations principales restent disponibles hors ligne.", BLUE);
              results.addView(offline, lp(-1, -2, 0, 16, 0, 0));
              TextView foot = text("DriveBox 1.0.0 RC2 • by Club VW Suisse", 11, MUTED, false);
              foot.setGravity(Gravity.CENTER);
              results.addView(foot, lp(-1, -2, 0, 18, 0, 0));
          };'''
          s = s[:a] + new_default + s[b+len('        };'):]
          s = s.replace('Aucun résultat pour « " + s + " ». Le catalogue va s\'enrichir.',
                        'Aucun résultat pour « " + s + " ».')

          new_maintenance = '''private void maintenanceHome() {
              LinearLayout root = page("🔧", "Entretien", "Des contrôles simples pour tout le monde.");
              root.addView(sectionTitle("NIVEAUX & MOTEUR"));
              root.addView(wideCard("🛢", "Niveau d'huile", "Lire correctement la jauge", ORANGE, this::oilGuide));
              root.addView(wideCard("🌡", "Liquide de refroidissement", "Contrôler moteur froid", BLUE, this::coolantGuide));
              root.addView(wideCard("🔋", "Batterie", "Reconnaître une batterie faible", GREEN, this::batteryGuide));
              root.addView(sectionTitle("SÉCURITÉ"), lp(-1, -2, 0, 14, 0, 8));
              root.addView(wideCard("🛑", "Freins", "Les signes qui doivent alerter", RED, this::brakeGuide));
              root.addView(wideCard("⚠", "Voyants", "Comprendre la priorité par couleur", ORANGE, this::warningLightsGuide));
              root.addView(wideCard("💡", "Éclairage", "Vérifier les feux principaux", ORANGE, this::lightingGuide));
              root.addView(wideCard("💧", "Essuie-glaces", "Visibilité et lave-glace", BLUE, this::wipersGuide));
              root.addView(sectionTitle("DÉPANNAGE & QUOTIDIEN"), lp(-1, -2, 0, 14, 0, 8));
              root.addView(wideCard("⚡", "Câbles / booster", "Ordre de branchement et précautions", RED, this::jumpStartGuide));
              root.addView(wideCard("🦺", "Crevaison / bord de route", "D'abord se mettre en sécurité", RED, this::roadsideSafetyGuide));
              root.addView(wideCard("🌬", "Désembuage", "Retrouver rapidement de la visibilité", BLUE, this::demistGuide));
              root.addView(wideCard("⛽", "Carburants E5 / E10 / B7", "Comprendre les étiquettes à la pompe", GREEN, this::fuelLabelsGuide));
              setScrollablePage(root);
          }'''
          s = replace_between(s, 'private void maintenanceHome() {', 'private void oilGuide() {', new_maintenance)

          for cls in [
              'CoolantIllustrationView','BatteryIllustrationView','BrakeIllustrationView',
              'WarningLightsIllustrationView','JumpStartIllustrationView','WipersIllustrationView',
              'LightingIllustrationView','RoadsideIllustrationView','DemistIllustrationView',
              'FuelLabelsIllustrationView','PressureIllustrationView','TyreIllustrationView'
          ]:
              s = re.sub(r'\n\s*root\.addView\(new '+cls+r'\(this\), lp\([^\n]+\);\n', '\n', s)

          new_tyres = '''private void tyreTypesGuide() {
              LinearLayout root = page("🛞", "Types de pneus", "Regardez d'abord les marquages sur le flanc", this::tyresHome, "Types de pneus");
              root.addView(infoStrip("i", "Le dessin de la bande de roulement peut donner une idée, mais ce n'est pas un moyen fiable à lui seul. Le marquage du pneu est plus sûr.", BLUE));
              root.addView(typeCard("☀", "PNEU ÉTÉ", "En général sans symbole 3PMSF. Conçu avant tout pour les températures douces et chaudes.", ORANGE));
              root.addView(typeCard("❄", "PNEU HIVER", "Cherchez le symbole montagne à trois pics avec flocon (3PMSF). C'est le repère le plus utile pour identifier un pneu homologué pour conditions hivernales.", BLUE));
              root.addView(typeCard("◐", "4 SAISONS", "Beaucoup de pneus 4 saisons portent aussi le 3PMSF, souvent avec M+S. Vérifiez la gamme et les marquages du fabricant.", GREEN));
              root.addView(infoStrip("M+S", "M+S seul ne suffit pas toujours selon le pays. Dans les fiches pays, DriveBox indique les règles locales quand elles sont connues.", ORANGE), lp(-1, -2, 0, 10, 0, 0));
              setScrollablePage(root);
          }'''
          s = replace_between(s, 'private void tyreTypesGuide() {', 'private View typeCard(', new_tyres)

          new_tools = '''private void toolsScreen() {
              LinearLayout root = page("🧰", "Outils", "Des calculs simples, sans fonctions inutiles.");
              root.addView(sectionTitle("CONVERSIONS"));
              root.addView(wideCard("⇄", "km / miles", "Distance et vitesse", BLUE, this::converterScreen));
              root.addView(wideCard("💨", "bar / psi", "Pression des pneus", BLUE, this::pressureConverterScreen));
              root.addView(wideCard("⛽", "Consommation", "L/100 km ↔ km/L", PURPLE, this::consumptionConverterScreen));
              root.addView(sectionTitle("CALCULATEURS"), lp(-1, -2, 0, 14, 0, 8));
              root.addView(wideCard("⛽", "Frais de route", "Carburant et coût par personne", GREEN, this::costCalculatorScreen));
              root.addView(wideCard("⛽", "Autonomie", "Litres restants → distance estimée", PURPLE, this::rangeCalculatorScreen));
              root.addView(wideCard("🛞", "Dimensions de pneus", "Comparer diamètre et circonférence", BLUE, this::tyreSizeComparatorScreen));
              root.addView(wideCard("⏱", "Temps de trajet", "Distance, vitesse moyenne et pauses", GREEN, this::tripTimeCalculatorScreen));
              setScrollablePage(root);
          }

          private void checklistsScreen() {
              LinearLayout root = page("✓", "Check-lists", "Uniquement quand vous préparez un départ.");
              root.addView(wideCard("🚙", "Check-list convoi", "Véhicule, communication et logistique", ORANGE, this::checklistScreen));
              root.addView(wideCard("🧳", "Check-list long trajet", "Véhicule, documents et confort", BLUE, this::longTripChecklistScreen));
              root.addView(infoStrip("i", "Ces listes restent secondaires : elles sont là quand vous en avez besoin.", MUTED), lp(-1, -2, 0, 12, 0, 0));
              setScrollablePage(root);
          }'''
          s = replace_between(s, 'private void toolsScreen() {', 'private void converterScreen() {', new_tools)

          s = s.replace('this::toolsScreen, "Check-list convoi"', 'this::checklistsScreen, "Check-list convoi"')
          s = s.replace('this::toolsScreen, "Check-list long trajet"', 'this::checklistsScreen, "Check-list long trajet"')
          s = s.replace('DriveBox 1.0.0 RC1', 'DriveBox 1.0.0 RC2')
          java.write_text(s)

          gradle = Path('/tmp/drivebox-src/app/build.gradle')
          g = gradle.read_text().replace('versionCode 10', 'versionCode 11').replace("versionName '1.0.0-rc1'", "versionName '1.0.0-rc2'")
          gradle.write_text(g)

          print('RC2 source cleanup applied')
          PY

          rm -f /tmp/drivebox-src/app/src/main/res/drawable/drivebox_logo.png

          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y imagemagick
          fi

          SRC=/tmp/drivebox-src/app/src/main/res/drawable-nodpi/ic_launcher_foreground.png
          convert "$SRC" -trim +repage /tmp/drivebox-mark.png
          convert -size 432x432 xc:none /tmp/drivebox-mark.png -resize 270x270 -gravity center -composite "$SRC"

          for spec in \
            "mipmap-mdpi 48" \
            "mipmap-hdpi 72" \
            "mipmap-xhdpi 96" \
            "mipmap-xxhdpi 144" \
            "mipmap-xxxhdpi 192"; do
            set -- $spec
            folder=$1
            size=$2
            target=$(( size * 74 / 100 ))
            out=/tmp/drivebox-src/app/src/main/res/$folder/ic_launcher.png
            convert -size ${size}x${size} xc:"#0B1017" /tmp/drivebox-mark.png -resize ${target}x${target} -gravity center -composite "$out"
          done

          grep -q "versionCode 11" /tmp/drivebox-src/app/build.gradle
          grep -q "versionName '1.0.0-rc2'" /tmp/drivebox-src/app/build.gradle
          grep -q "checklistsScreen" /tmp/drivebox-src/app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java
          grep -q "Les infos et outils auto utiles" /tmp/drivebox-src/app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: /tmp/drivebox-src
        shell: bash
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify and stage APK
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/drivebox-src/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC2-debug.apk"
          sha256sum "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC2-debug.apk" > "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC2-debug.apk.sha256.txt"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DriveBox-1.0.0-RC2-APK
          path: |
            DriveBox-1.0.0-RC2-debug.apk
            DriveBox-1.0.0-RC2-debug.apk.sha256.txt
          if-no-files-found: error
          retention-days: 7
