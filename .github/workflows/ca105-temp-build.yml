name: Compagnon Autoroute 1.0.5 restricted graph build

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/ca105-temp-build.yml'

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Live Swiss enriched graph smoke test
        shell: bash
        run: |
          set -euo pipefail
          LAT='46.2331'; LON='7.3606'; R='18000'
          Q='[out:json][timeout:24];way(around:'"$R"','"$LAT"','"$LON"')[highway~"^(motorway|motorway_link|trunk|trunk_link)$"]->.major;nwr(around:'"$R"','"$LAT"','"$LON"')[highway~"^(services|rest_area)$"]->.facilities;way(around.facilities:900)[highway=service][access!~"^(private|no)$"]->.accessroads;(.major;.accessroads;)->.roads;rel(bw.roads)[type=restriction]->.restrictions;(.roads;.restrictions;);out body geom qt;'
          : > /tmp/graph-smoke.txt
          OK=0
          for ENDPOINT in 'https://overpass.osm.ch/api/interpreter' 'https://overpass.private.coffee/api/interpreter' 'https://maps.mail.ru/osm/tools/overpass/api/interpreter'; do
            echo "ENDPOINT=$ENDPOINT" | tee -a /tmp/graph-smoke.txt
            if curl --fail --silent --show-error --max-time 28 -A 'CompagnonAutoroute-CI/1.0.5' -X POST "$ENDPOINT" --data-urlencode "data=$Q" -o /tmp/graph.json; then
              MAJOR=$(jq '[.elements[] | select(.type=="way" and (.tags.highway|test("^(motorway|motorway_link|trunk|trunk_link)$")))] | length' /tmp/graph.json)
              SERVICE=$(jq '[.elements[] | select(.type=="way" and .tags.highway=="service")] | length' /tmp/graph.json)
              RESTR=$(jq '[.elements[] | select(.type=="relation" and .tags.type=="restriction")] | length' /tmp/graph.json)
              echo "MAJOR_WAYS=$MAJOR SERVICE_WAYS=$SERVICE RESTRICTIONS=$RESTR" | tee -a /tmp/graph-smoke.txt
              if [ "$MAJOR" -gt 0 ]; then OK=1; break; fi
            fi
          done
          test "$OK" = 1

      - name: Live Swiss WC and fuel regression smoke test
        shell: bash
        run: |
          set -euo pipefail
          LAT='46.2331'; LON='7.3606'
          Q='[out:json][timeout:12];(nwr(around:18000,'"$LAT"','"$LON"')[amenity=fuel];nwr(around:18000,'"$LAT"','"$LON"')[amenity=toilets];nwr(around:18000,'"$LAT"','"$LON"')[highway~"^(services|rest_area)$"];);out center qt;'
          curl --fail --silent --show-error --max-time 28 -A 'CompagnonAutoroute-CI/1.0.5' -X POST 'https://overpass.osm.ch/api/interpreter' --data-urlencode "data=$Q" -o /tmp/services.json
          FUEL=$(jq '[.elements[] | select(.tags.amenity=="fuel" or .tags.highway=="services")] | length' /tmp/services.json)
          WC=$(jq '[.elements[] | select(.tags.amenity=="toilets" or (.tags.toilets!=null))] | length' /tmp/services.json)
          printf 'FUEL_LIKE=%s WC_LIKE=%s\n' "$FUEL" "$WC" | tee /tmp/services-smoke.txt
          test "$FUEL" -gt 0
          test "$WC" -gt 0

      - name: Open encrypted build session
        id: session
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SESSION=$(openssl rand -hex 12)
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/ca105-private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/ca105-private.pem -pubout -out /tmp/ca105-public.pem
          PUB=$(base64 -w0 /tmp/ca105-public.pem)
          gh api repos/${GITHUB_REPOSITORY}/issues/43/comments -f body="CA105_PUBLIC_KEY:${SESSION}:${PUB}" >/dev/null
          echo "session=${SESSION}" >> "$GITHUB_OUTPUT"

      - name: Receive encrypted build bundle
        env:
          GH_TOKEN: ${{ github.token }}
          SESSION: ${{ steps.session.outputs.session }}
        run: |
          set -euo pipefail
          MANIFEST=''
          for i in $(seq 1 180); do
            MANIFEST=$(gh api --paginate repos/${GITHUB_REPOSITORY}/issues/43/comments --jq ".[] | select(.body | startswith(\"CA105_BLOBS:${SESSION}:\")) | .body" | tail -n 1 || true)
            [ -n "$MANIFEST" ] && break
            sleep 5
          done
          test -n "$MANIFEST"
          REST=${MANIFEST#CA105_BLOBS:${SESSION}:}
          KEY_SHA=${REST%%:*}
          SHAS_CSV=${REST#*:}
          gh api repos/${GITHUB_REPOSITORY}/git/blobs/${KEY_SHA} --jq .content | tr -d '\n' | base64 -d > /tmp/ca105-key.enc
          : > /tmp/ca105-bundle.enc
          IFS=',' read -ra SHAS <<< "$SHAS_CSV"
          for SHA in "${SHAS[@]}"; do
            gh api repos/${GITHUB_REPOSITORY}/git/blobs/${SHA} --jq .content | tr -d '\n' | base64 -d >> /tmp/ca105-bundle.enc
          done
          openssl pkeyutl -decrypt -inkey /tmp/ca105-private.pem -in /tmp/ca105-key.enc -pkeyopt rsa_padding_mode:oaep > /tmp/ca105-pass.txt
          openssl enc -d -aes-256-cbc -pbkdf2 -in /tmp/ca105-bundle.enc -out /tmp/ca105-private-build-bundle.zip -pass file:/tmp/ca105-pass.txt
          unzip -tq /tmp/ca105-private-build-bundle.zip
          cd /tmp
          unzip -q /tmp/ca105-private-build-bundle.zip
          unzip -tq /tmp/ca105-bundle/source.zip
          mkdir -p /tmp/ca105-src
          unzip -q /tmp/ca105-bundle/source.zip -d /tmp/ca105-src

      - name: Run route graph core tests
        shell: bash
        run: |
          set -euo pipefail
          PROJ=$(dirname "$(find /tmp/ca105-src -maxdepth 3 -type f -name settings.gradle | head -n 1)")
          test -n "$PROJ"
          mkdir -p /tmp/ca105-core
          javac -d /tmp/ca105-core "$PROJ/app/src/main/java/com/compagnonautoroute/app/core/GeoMath.java" "$PROJ/app/src/main/java/com/compagnonautoroute/app/core/RouteGraph.java" "$PROJ/tools/CoreLogicSelfTest.java"
          java -cp /tmp/ca105-core CoreLogicSelfTest | tee /tmp/core-tests.txt

      - name: Build and persistently sign APK
        shell: bash
        run: |
          set -euo pipefail
          PROJ=$(dirname "$(find /tmp/ca105-src -maxdepth 3 -type f -name settings.gradle | head -n 1)")
          cd "$PROJ"
          gradle --no-daemon :app:assembleDebug --stacktrace
          APK=$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)
          test -f "$APK"
          mkdir -p /tmp/ca105-out
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          PASS=$(cat /tmp/ca105-bundle/signing-pass.txt)
          "$APKSIGNER" sign --ks /tmp/ca105-bundle/signing.jks --ks-key-alias compagnon-test --ks-pass pass:"$PASS" --key-pass pass:"$PASS" --out /tmp/ca105-out/CompagnonAutoroute-1.0.5-V1.apk "$APK"
          sha256sum /tmp/ca105-out/CompagnonAutoroute-1.0.5-V1.apk | tee /tmp/ca105-out/CompagnonAutoroute-1.0.5-V1.apk.sha256
          "$AAPT" dump badging /tmp/ca105-out/CompagnonAutoroute-1.0.5-V1.apk | tee /tmp/ca105-out/badging.txt
          grep -F "package: name='com.compagnonautoroute.app' versionCode='6' versionName='1.0.5-v1'" /tmp/ca105-out/badging.txt
          "$APKSIGNER" verify --verbose --print-certs /tmp/ca105-out/CompagnonAutoroute-1.0.5-V1.apk | tee /tmp/ca105-out/signature.txt
          grep -Fi '8121700ea70092d2f8784152eec92d14fe1dab2b7653c4a99bf0e3ff1d90e9be' /tmp/ca105-out/signature.txt
          cp /tmp/graph-smoke.txt /tmp/ca105-out/graph-smoke.txt
          cp /tmp/services-smoke.txt /tmp/ca105-out/services-smoke.txt
          cp /tmp/core-tests.txt /tmp/ca105-out/core-tests.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CompagnonAutoroute-1.0.5-V1-APK
          path: /tmp/ca105-out/*
          if-no-files-found: error
          retention-days: 1

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          SESSION: ${{ steps.session.outputs.session }}
        run: gh api repos/${GITHUB_REPOSITORY}/issues/43/comments -f body="CA105_BUILD_DONE:${SESSION}" >/dev/null
