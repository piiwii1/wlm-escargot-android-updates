name: EuroScan CH 1.3.0 Build

on:
  push:
    branches: [ euroscan-build-130 ]
    paths:
      - '.ci/euroscan130/**'
      - '.github/workflows/euroscan-ch-130-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore exact EuroScan 1.3.0 source
        run: |
          set -euo pipefail
          cd .ci/euroscan130
          test -f payload.part00
          test -f payload.part01
          test -f payload.part02
          test -f payload.part03
          test -f payload.part04a
          test -f payload.part04b1
          test -f payload.part04b2
          test -f payload.part04c
          cat payload.part00 payload.part01 payload.part02 payload.part03 payload.part04a payload.part04b1 payload.part04b2 payload.part04c | base64 -d > /tmp/euroscan130.zip
          echo '88a4ae5c43d7852a68861a953f916ef3f32b2faf8956bfefaaa28f18178f53dd  /tmp/euroscan130.zip' | sha256sum -c -
          cd "$GITHUB_WORKSPACE"
          rm -rf euroscan-ch
          unzip -q /tmp/euroscan130.zip
          test -f euroscan-ch/app/build.gradle
          grep -q 'versionCode 5' euroscan-ch/app/build.gradle
          grep -q "versionName '1.3.0'" euroscan-ch/app/build.gradle

      - name: Harden Android status and navigation safe areas
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          main = Path('euroscan-ch/app/src/main/java/ch/piiwii/euroscan/MainActivity.java')
          s = main.read_text()
          anchor = '''        getWindow().setStatusBarColor(BG);\n        getWindow().setNavigationBarColor(BG);\n'''
          patch = '''        getWindow().setStatusBarColor(BG);\n        getWindow().setNavigationBarColor(BG);\n        // Samsung / Android 15: draw edge-to-edge only when we also apply the real system insets.\n        if (Build.VERSION.SDK_INT >= 30) {\n            getWindow().setDecorFitsSystemWindows(false);\n        }\n'''
          if 'setDecorFitsSystemWindows(false)' not in s:
              if anchor not in s:
                  raise SystemExit('MainActivity system-bar anchor not found')
              s = s.replace(anchor, patch, 1)
          main.write_text(s)

          scanner = Path('euroscan-ch/app/src/main/java/ch/piiwii/euroscan/ScannerActivity.java')
          s = scanner.read_text()
          anchor = '''        getWindow().setStatusBarColor(Color.rgb(5, 18, 39));\n        getWindow().setNavigationBarColor(Color.rgb(5, 18, 39));\n'''
          patch = '''        getWindow().setStatusBarColor(Color.rgb(5, 18, 39));\n        getWindow().setNavigationBarColor(Color.rgb(5, 18, 39));\n        // Scanner also uses the real status-bar/cutout/navigation insets.\n        if (Build.VERSION.SDK_INT >= 30) {\n            getWindow().setDecorFitsSystemWindows(false);\n        }\n'''
          if 'setDecorFitsSystemWindows(false)' not in s:
              if anchor not in s:
                  raise SystemExit('ScannerActivity system-bar anchor not found')
              s = s.replace(anchor, patch, 1)
          scanner.write_text(s)
          PY
          grep -q 'setDecorFitsSystemWindows(false)' euroscan-ch/app/src/main/java/ch/piiwii/euroscan/MainActivity.java
          grep -q 'setDecorFitsSystemWindows(false)' euroscan-ch/app/src/main/java/ch/piiwii/euroscan/ScannerActivity.java
          grep -q 'WindowInsets.Type.statusBars() | WindowInsets.Type.displayCutout()' euroscan-ch/app/src/main/java/ch/piiwii/euroscan/MainActivity.java
          grep -q 'WindowInsets.Type.statusBars() | WindowInsets.Type.displayCutout()' euroscan-ch/app/src/main/java/ch/piiwii/euroscan/ScannerActivity.java

      - name: Build unsigned release
        working-directory: euroscan-ch
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Verify package metadata
        run: |
          set -euo pipefail
          APK='euroscan-ch/app/build/outputs/apk/release/app-release-unsigned.apk'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='ch.piiwii.euroscan' versionCode='5' versionName='1.3.0'" /tmp/badging.txt
          grep -q "launchable-activity: name='ch.piiwii.euroscan.MainActivity'" /tmp/badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"

      - name: Prepare unsigned delivery
        run: |
          set -euo pipefail
          mkdir -p delivery
          cp euroscan-ch/app/build/outputs/apk/release/app-release-unsigned.apk delivery/EuroScan-CH-1.3.0-UNSIGNED.apk
          zip -qr delivery/EuroScan-CH-1.3.0-SOURCES.zip euroscan-ch -x 'euroscan-ch/app/build/*' 'euroscan-ch/.gradle/*'
          cp /tmp/badging.txt delivery/APK-BADGING.txt
          printf 'versionName=1.3.0\nversionCode=5\npackage=ch.piiwii.euroscan\n' > delivery/VERSION.txt
          sha256sum delivery/EuroScan-CH-1.3.0-UNSIGNED.apk > delivery/UNSIGNED-SHA256.txt
          sha256sum delivery/EuroScan-CH-1.3.0-SOURCES.zip > delivery/SOURCES-SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: EuroScan-CH-1.3.0-UNSIGNED
          path: delivery/*
          retention-days: 7
          if-no-files-found: error
