name: EuroScan CH 1.3.0 Build

on:
  push:
    branches: [ euroscan-build-130 ]
    paths:
      - '.ci/euroscan130/**'
      - '.github/workflows/euroscan-ch-130-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify and restore exact EuroScan 1.3.0 source
        run: |
          set -euo pipefail
          cd .ci/euroscan130
          echo 'd2435698dba3b5b1eddb3467a725cd51bf7e57dfcdc66624b7cf7a35b205d207  payload.part00' | sha256sum -c -
          echo '12604e5a87e5a16451d086f43f72f521f9e51d6f4e544d36b8add5505633a0cf  payload.part01' | sha256sum -c -
          echo 'ff1b8e04785c92f566e3f61c590665b608370c7eefca141c3febb504c7d14577  payload.part02' | sha256sum -c -
          echo '1d66fd1ca83bfa81b33b46634ef1c244281cc5fb62ef80816fc6e7c225e056b5  payload.part03' | sha256sum -c -
          echo '9fb03e8e5a3d5a12eb9ac250a667e41f07cddf76d951e8d9f9a202d40d5299a9  payload.part04a' | sha256sum -c -
          echo 'f0bc0ade9a16e0c77f15d1e951cb5330a611e93d17c2322b28b7924dc49e3b4e  payload.part04b' | sha256sum -c -
          echo '906bdb36ac55686cd95fe6d92dd2d5df20553f0160065957aeee8bb80dbf207c  payload.part04c' | sha256sum -c -
          cat payload.part00 payload.part01 payload.part02 payload.part03 payload.part04a payload.part04b payload.part04c | base64 -d > /tmp/euroscan130.zip
          echo '88a4ae5c43d7852a68861a953f916ef3f32b2faf8956bfefaaa28f18178f53dd  /tmp/euroscan130.zip' | sha256sum -c -
          cd "$GITHUB_WORKSPACE"
          rm -rf euroscan-ch
          unzip -q /tmp/euroscan130.zip
          test -f euroscan-ch/app/build.gradle
          grep -q 'versionCode 5' euroscan-ch/app/build.gradle
          grep -q "versionName '1.3.0'" euroscan-ch/app/build.gradle

      - name: Build unsigned release
        working-directory: euroscan-ch
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Verify package metadata
        run: |
          set -euo pipefail
          APK='euroscan-ch/app/build/outputs/apk/release/app-release-unsigned.apk'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='ch.piiwii.euroscan' versionCode='5' versionName='1.3.0'" /tmp/badging.txt
          grep -q "launchable-activity: name='ch.piiwii.euroscan.MainActivity'" /tmp/badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"

      - name: Prepare unsigned delivery
        run: |
          set -euo pipefail
          mkdir -p delivery
          cp euroscan-ch/app/build/outputs/apk/release/app-release-unsigned.apk delivery/EuroScan-CH-1.3.0-UNSIGNED.apk
          zip -qr delivery/EuroScan-CH-1.3.0-SOURCES.zip euroscan-ch -x 'euroscan-ch/app/build/*' 'euroscan-ch/.gradle/*'
          cp /tmp/badging.txt delivery/APK-BADGING.txt
          printf 'versionName=1.3.0\nversionCode=5\npackage=ch.piiwii.euroscan\n' > delivery/VERSION.txt
          sha256sum delivery/EuroScan-CH-1.3.0-UNSIGNED.apk > delivery/UNSIGNED-SHA256.txt
          sha256sum delivery/EuroScan-CH-1.3.0-SOURCES.zip > delivery/SOURCES-SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: EuroScan-CH-1.3.0-UNSIGNED
          path: delivery/*
          retention-days: 7
          if-no-files-found: error
