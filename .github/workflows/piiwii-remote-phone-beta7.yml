name: PiiWii Remote Phone beta7 - Grouped tabs

on:
  push:
    branches: [piiwii-remote-v2-phone-beta7-tabs]
    paths:
      - 'piiwii-remote-phone-beta7/**'
      - '.github/workflows/piiwii-remote-phone-beta7.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phone-beta7:
    name: Build and audit Phone 2.0.0-beta7
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct beta6 and apply beta7
        shell: bash
        run: |
          set -euo pipefail
          bash piiwii-remote-v2-lot12/reconstruct-lot12.sh /tmp/piiwii-phone-beta7-src
          ROOT=/tmp/piiwii-phone-beta7-src/piiwii-remote

          apply_patch() {
            local dir="$1" name="$2" xzsha="$3" patchsha="$4"
            base64 -d "$dir/$name.patch.xz.b64" > "/tmp/$name.patch.xz"
            echo "$xzsha  /tmp/$name.patch.xz" | sha256sum -c -
            xz -dc "/tmp/$name.patch.xz" > "/tmp/$name.patch"
            echo "$patchsha  /tmp/$name.patch" | sha256sum -c -
            (cd "$ROOT" && patch -p1 < "/tmp/$name.patch")
          }

          apply_patch piiwii-remote-phone-beta3 phone-beta3 \
            b0510a468202e0898d0c07b2056daa3d06ecbb35b574c9a54655c7b63dbb7a1e \
            7e0019639f059feb9f6b409e01b7e47377be9c297d303a161d46c1c23a9c07cb
          apply_patch piiwii-remote-phone-beta4 phone-beta4 \
            45ffb0cf4741eaf7364b95933cc744ec7968720ad334a50a91ceac8071ef9519 \
            490272fe7e7a386d83f78c2de37810605421551aff9d9577a9f53e77c55efeed
          apply_patch piiwii-remote-phone-beta5 phone-beta5 \
            dbd42fa96eb3b7c32a8777e0fa2718a50b524b1b4666019b59316edd0afe7128 \
            a4f347649bee64f637d56c181a6f38a34a5991f9bcd65e9acfa8f40bab1d68a3
          apply_patch piiwii-remote-phone-beta6 phone-beta6 \
            56ca922ce6493e1963dd03f19cc07a38d62de0031f62ade8b477591c947d2719 \
            b922f805e558bfd87ca960595d82e6f4f6ee25585359a1be2370987e4f025ae7
          apply_patch piiwii-remote-phone-beta7 phone-beta7 \
            4c9188f19ea66e77d80ddf568d704b9ce8b30b39083988fc2a6b1253901b32d2 \
            f25b835ab11488c3fd072b8e5dc1c98cad9a0e8777fffdb7b1dfc42a1a74119b

      - name: Static regression audit
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/piiwii-phone-beta7-src/piiwii-remote
          BUILD="$ROOT/remote/build.gradle.kts"
          MAIN="$ROOT/remote/src/main/java/ch/piiwii/remote2/ui/MainActivity.kt"
          SHELL="$ROOT/remote/src/main/java/ch/piiwii/remote2/ui/MainShellView.kt"
          SCREEN="$ROOT/remote/src/main/java/ch/piiwii/remote2/ui/screens/SectionScreenFactory.kt"
          SECTIONS="$ROOT/remote/src/main/java/ch/piiwii/remote2/ui/RemoteSection.kt"
          TOUCHPAD="$ROOT/remote/src/main/java/ch/piiwii/remote2/ui/TouchpadView.kt"
          PROTO="$ROOT/remote/src/main/java/ch/piiwii/remote2/protocol/Protocol.kt"

          grep -q 'applicationId = "ch.piiwii.remote2"' "$BUILD"
          grep -q 'compileSdk = 35' "$BUILD"
          grep -q 'minSdk = 26' "$BUILD"
          grep -q 'targetSdk = 35' "$BUILD"
          grep -q 'versionCode = 37' "$BUILD"
          grep -q 'versionName = "2.0.0-beta7"' "$BUILD"
          grep -q 'JavaVersion.VERSION_17' "$BUILD"
          grep -q 'jvmTarget = "17"' "$BUILD"
          grep -q 'WindowInsetsCompat.Type.systemBars() or WindowInsetsCompat.Type.displayCutout()' "$MAIN"
          grep -q 'DigitsKeyListener.getInstance("0123456789.,")' "$MAIN"
          grep -q "replace(',', '.')" "$MAIN"

          grep -q 'class RemoteNavigationPager' "$SHELL"
          grep -q 'RemoteSection.REMOTE || section == RemoteSection.NAVIGATION' "$SHELL"
          grep -q 'key == RemoteSection.REMOTE && section == RemoteSection.NAVIGATION' "$SHELL"
          grep -q 'listOf(RemoteSection.REMOTE, RemoteSection.TOUCHPAD, RemoteSection.KEYBOARD, RemoteSection.APPS)' "$SHELL"
          ! grep -q 'RemoteSection.entries.forEach' "$SHELL"
          ! grep -q 'class TouchpadSectionPager' "$SHELL"

          grep -q 'RemoteSection.KEYBOARD -> keyboard' "$SCREEN"
          grep -q 'private fun keyboard' "$SCREEN"
          grep -q 'addView(RemoteKeyboardView' "$SCREEN"
          grep -q 'glissez vers le haut pour ouvrir la navigation complète' "$SCREEN"
          grep -q 'touchpadClickRow' "$SCREEN"
          grep -q '"Clic gauche"' "$SCREEN"
          grep -q '"Clic droit"' "$SCREEN"
          grep -q 'discreetPcOptionsButton' "$SCREEN"
          grep -q '⋮  Options PC' "$SCREEN"
          grep -q 'Lecture / pause' "$SCREEN"
          grep -q 'navigationQuickButton' "$SCREEN"
          ! grep -q 'canvas.drawText' "$TOUCHPAD"
          grep -q 'PIIWII_REMOTE/1' "$PROTO"

          python - "$SECTIONS" "$SHELL" <<'PY'
          from pathlib import Path
          import re,sys
          sections=Path(sys.argv[1]).read_text(encoding='utf-8')
          labels=re.findall(r'\("([^"]+)",\s*"[^"]*"\)',sections)
          assert labels == ['Télécommande','Navigation','Pavé tactile','Clavier','Applications'], labels
          shell=Path(sys.argv[2]).read_text(encoding='utf-8')
          bottom=shell[shell.index('private fun bottomBar'):]
          assert 'RemoteSection.NAVIGATION' not in bottom
          assert 'RemoteSection.REMOTE, RemoteSection.TOUCHPAD, RemoteSection.KEYBOARD, RemoteSection.APPS' in bottom
          print('Static beta7 grouped-tabs audit OK')
          PY

          if find "$ROOT" -type f \( -name '*.jks' -o -name '*.keystore' -o -name 'Signing.properties' \) | grep -q .; then
            echo 'Private signing material must not be in source tree' >&2
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK 35
        shell: bash
        run: |
          echo 'ANDROID_HOME=/usr/local/lib/android/sdk' >> "$GITHUB_ENV"
          echo 'ANDROID_SDK_ROOT=/usr/local/lib/android/sdk' >> "$GITHUB_ENV"
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests and release compilation
        working-directory: /tmp/piiwii-phone-beta7-src/piiwii-remote
        run: gradle --no-daemon --stacktrace :remote:testDebugUnitTest :remote:assembleRelease

      - name: Validate release and package sources
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/piiwii-phone-beta7-src/piiwii-remote
          OUT=/tmp/piiwii-phone-beta7-out
          mkdir -p "$OUT"
          RAW="$ROOT/remote/build/outputs/apk/release/remote-release-unsigned.apk"
          APK="$OUT/PiiWii-Remote-Phone-2.0.0-beta7-UNSIGNED.apk"
          AAPT=/usr/local/lib/android/sdk/build-tools/35.0.0/aapt
          APKSIGNER=/usr/local/lib/android/sdk/build-tools/35.0.0/apksigner
          ZIPALIGN=/usr/local/lib/android/sdk/build-tools/35.0.0/zipalign

          "$ZIPALIGN" -f 4 "$RAW" "$APK"
          "$ZIPALIGN" -c -v 4 "$APK" > "$OUT/PHONE-ZIPALIGN.txt"
          "$AAPT" dump badging "$APK" > "$OUT/PHONE-BADGING.txt"
          grep -q "package: name='ch.piiwii.remote2' versionCode='37' versionName='2.0.0-beta7'" "$OUT/PHONE-BADGING.txt"
          if "$APKSIGNER" verify "$APK" >/dev/null 2>&1; then exit 1; fi
          unzip -t "$APK" > "$OUT/PHONE-ZIPTEST.txt"

          python - "$APK" <<'PY'
          import sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              data=b''.join(z.read(n) for n in z.namelist() if n.startswith('classes') and n.endswith('.dex'))
          need=['Télécommande','Navigation','Pavé tactile','Clavier','Applications','Clic gauche','Clic droit','Options PC','Direction','Raccourcis','2.0.0-beta7','PAIR_REQUEST','AUTH1']
          missing=[x for x in need if x.encode('utf-8') not in data]
          assert not missing, missing
          print('DEX beta7 audit OK')
          PY

          cd /tmp/piiwii-phone-beta7-src
          zip -qr "$OUT/PiiWii-Remote-Phone-2.0.0-beta7-Sources.zip" piiwii-remote -x '*/build/*' '*/.gradle/*' '*/.kotlin/*' '*.jks' '*.keystore' '*Signing.properties'
          unzip -t "$OUT/PiiWii-Remote-Phone-2.0.0-beta7-Sources.zip" > "$OUT/SOURCES-ZIPTEST.txt"
          sha256sum "$APK" "$OUT/PiiWii-Remote-Phone-2.0.0-beta7-Sources.zip" > "$OUT/SHA256.txt"
          cat > "$OUT/AUDIT.txt" <<'EOT'
          PIIWII REMOTE PHONE 2.0.0-beta7 / versionCode 37
          Bottom menu: Télécommande | Pavé tactile | Clavier | Applications
          Navigation remains a full-screen vertical-swipe page under Télécommande and is hidden from the bottom menu.
          Pavé tactile remains the clean beta6 full-height surface with Clic gauche / Clic droit.
          Clavier is now a direct dedicated tab for Windows and Android TV.
          Beta2 IP fix, beta3 Remote controls, beta4 Navigation and beta5 PC power safety are retained.
          Release candidate intentionally unsigned; final APK must use stable PiiWii certificate.
          EOT

      - uses: actions/upload-artifact@v4
        with:
          name: PiiWii-Remote-Phone-2.0.0-beta7-Grouped-Tabs-UNSIGNED
          path: /tmp/piiwii-phone-beta7-out/*
          retention-days: 7
          if-no-files-found: error
