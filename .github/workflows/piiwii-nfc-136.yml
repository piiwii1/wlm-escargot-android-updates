name: PiiWii NFC 1.0.36 Faithful Home Cards

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/piiwii-nfc-136.yml'
      - 'piiwii-nfc-public/v136/**'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download 1.0.35 source baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/nfc136 /tmp/base135 /tmp/base135.zip
          mkdir -p /tmp/nfc136 /tmp/base135
          ART_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts | map(select(.name == "PiiWii-NFC-1.0.35-build" and .expired == false)) | sort_by(.created_at) | reverse | .[0].id // empty')
          test -n "$ART_ID"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$ART_ID/zip" > /tmp/base135.zip
          unzip -q /tmp/base135.zip -d /tmp/base135
          SRCZIP=$(find /tmp/base135 -type f -name 'PiiWii-NFC-1.0.35-SOURCES-BUILD.zip' -print -quit)
          test -n "$SRCZIP"
          unzip -q "$SRCZIP" -d /tmp/nfc136
          test -d /tmp/nfc136/PiiWii-NFC-1.0.35

      - name: Inject faithful custom-card interface
        run: |
          set -euo pipefail
          ROOT=/tmp/nfc136/PiiWii-NFC-1.0.35
          PAYLOAD="$GITHUB_WORKSPACE/piiwii-nfc-public/v136"
          cat "$PAYLOAD/xml_00.b64" "$PAYLOAD/xml_01.b64" "$PAYLOAD/xml_02.b64" "$PAYLOAD/xml_03.b64" > /tmp/activity_main.xml.gz.b64
          test "$(wc -c < /tmp/activity_main.xml.gz.b64)" -eq 12304
          test "$(sha256sum /tmp/activity_main.xml.gz.b64 | awk '{print $1}')" = "81f85527a37e7610b1513cd492b29c9e4b2fbd9c0699452b9b771291b6d6aa47"
          base64 -d /tmp/activity_main.xml.gz.b64 | gzip -d > "$ROOT/app/src/main/res/layout/activity_main.xml"
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/nfc136/PiiWii-NFC-1.0.35')
          grad=root/'app/build.gradle'
          s=grad.read_text()
          s=s.replace('versionCode 36','versionCode 37').replace("versionName '1.0.35'","versionName '1.0.36'")
          grad.write_text(s)
          layout=root/'app/src/main/res/layout/activity_main.xml'
          x=layout.read_text().replace('@color/text_muted','@color/muted')
          layout.write_text(x)
          java=root/'app/src/main/java/ch/piiwii/nfc/MainActivity.java'
          j=java.read_text()
          for name in ['readButton','writeButton','copyButton','eraseButton','historyShortcutButton','modelsShortcutButton','backupShortcutButton']:
              old=f'Button {name} = findViewById(R.id.{name});'
              new=f'View {name} = findViewById(R.id.{name});'
              if old not in j:
                  raise SystemExit(f'missing Java anchor: {name}')
              j=j.replace(old,new)
          java.write_text(j)
          PY
          grep -q "applicationId 'ch.piiwii.nfc.app'" "$ROOT/app/build.gradle"
          grep -q "versionCode 37" "$ROOT/app/build.gradle"
          grep -q "versionName '1.0.36'" "$ROOT/app/build.gradle"
          ! grep -q '@color/text_muted' "$ROOT/app/src/main/res/layout/activity_main.xml"
          grep -q 'android:id="@+id/readButton"' "$ROOT/app/src/main/res/layout/activity_main.xml"
          grep -q 'View readButton = findViewById' "$ROOT/app/src/main/java/ch/piiwii/nfc/MainActivity.java"

      - name: Build release
        working-directory: /tmp/nfc136/PiiWii-NFC-1.0.35
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Align and verify APK
        run: |
          set -euo pipefail
          ROOT=/tmp/nfc136/PiiWii-NFC-1.0.35
          BT="$ANDROID_HOME/build-tools/35.0.0"
          IN="$ROOT/app/build/outputs/apk/release/app-release-unsigned.apk"
          OUT=/tmp/PiiWii-NFC-1.0.36-ALIGNED-UNSIGNED.apk
          test -f "$IN"
          "$BT/zipalign" -f -p 4 "$IN" "$OUT"
          "$BT/zipalign" -c -v 4 "$OUT"
          "$BT/aapt" dump badging "$OUT" | tee /tmp/badging136.txt
          grep -q "package: name='ch.piiwii.nfc.app'" /tmp/badging136.txt
          grep -q "versionCode='37'" /tmp/badging136.txt
          grep -q "versionName='1.0.36'" /tmp/badging136.txt
          if grep -q 'application-debuggable' /tmp/badging136.txt; then exit 1; fi
          unzip -t "$OUT" >/dev/null

      - name: Package deliverables
        run: |
          set -euo pipefail
          mkdir -p /tmp/out136
          cp /tmp/PiiWii-NFC-1.0.36-ALIGNED-UNSIGNED.apk /tmp/out136/
          cd /tmp/nfc136
          mv PiiWii-NFC-1.0.35 PiiWii-NFC-1.0.36
          zip -qr /tmp/out136/PiiWii-NFC-1.0.36-SOURCES-BUILD.zip PiiWii-NFC-1.0.36
          printf 'package=ch.piiwii.nfc.app\nversionCode=37\nversionName=1.0.36\nrelease=true\nscope=faithful custom home cards\n' > /tmp/out136/BUILD-IDENTITY.txt

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: PiiWii-NFC-1.0.36-build
          path: /tmp/out136/
          retention-days: 7
          if-no-files-found: error
