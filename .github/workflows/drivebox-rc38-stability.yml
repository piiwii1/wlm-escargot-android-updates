name: Build DriveBox RC38 Stability

on:
  push:
    branches: [ drivebox-rc38-stability ]
    paths:
      - '.github/workflows/drivebox-rc38-stability.yml'
      - 'drivebox-ci/rc38-stability.part*.b64'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore validated RC37 source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9634888895/zip" -o /tmp/rc37-artifact.zip
          rm -rf /tmp/rc37-artifact /tmp/drivebox-src
          mkdir -p /tmp/rc37-artifact /tmp/drivebox-src
          unzip -oq /tmp/rc37-artifact.zip -d /tmp/rc37-artifact
          unzip -oq /tmp/rc37-artifact/DriveBox-1.0.0-RC37-source.zip -d /tmp/drivebox-src
          grep -q 'versionCode 46' /tmp/drivebox-src/app/build.gradle
          grep -q "versionName '1.0.0-rc37'" /tmp/drivebox-src/app/build.gradle

      - name: Verify and apply RC38 stability patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum drivebox-ci/rc38-stability.part1.b64 | awk '{print $1}')" = '6add24550b828ab740c41439cd80f15f96de65d771037af8ffef32c5fca91964'
          test "$(sha256sum drivebox-ci/rc38-stability.part2.b64 | awk '{print $1}')" = '2925d74537a4d8c406a6740affe56d97be3fa8894ab269b7d565c1e391ccea63'
          test "$(sha256sum drivebox-ci/rc38-stability.part3a.b64 | awk '{print $1}')" = 'f2672dab065e337ed7b5098b9cd10de809c5546e313a4bbd1d073d44b8c7196c'
          test "$(sha256sum drivebox-ci/rc38-stability.part3b.b64 | awk '{print $1}')" = '219899a0385a681981052fd5806df6aaa4ff2f90d726a8c54178cccc6cd274ac'
          cat drivebox-ci/rc38-stability.part1.b64 drivebox-ci/rc38-stability.part2.b64 drivebox-ci/rc38-stability.part3a.b64 drivebox-ci/rc38-stability.part3b.b64 | base64 -d | gzip -d > /tmp/rc38.patch
          test "$(sha256sum /tmp/rc38.patch | awk '{print $1}')" = '6bd0f46a90b343acd06c6fd63222ec2c80c2083b21402aedc3b34d9e0337e27a'
          cd /tmp/drivebox-src
          patch -p1 < /tmp/rc38.patch
          grep -q 'versionCode 47' app/build.gradle
          grep -q "versionName '1.0.0-rc38'" app/build.gradle
          grep -q 'context.stopService' app/src/main/java/ch/clubvwsuisse/drivebox/ParkingExpiryAlarmService.java
          grep -q 'setExactAndAllowWhileIdle' app/src/main/java/ch/clubvwsuisse/drivebox/ParkingAlarmReceiver.java
          grep -q 'parking_free_warning_v2' app/src/main/java/ch/clubvwsuisse/drivebox/FreeParkingAlarmReceiver.java
          grep -q 'parkingGeocodeGeneration' app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java
          grep -q 'cleanupParkingLocationRequest' app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java
          grep -q 'boolean blueZone' app/src/main/java/ch/clubvwsuisse/drivebox/WidgetQuickStartActivity.java
          test -f app/src/main/java/ch/clubvwsuisse/drivebox/DriveBoxLog.java
          if grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml; then echo 'Unexpected INTERNET permission'; exit 1; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile RC38
        working-directory: /tmp/drivebox-src
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Verify and package RC38
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/drivebox-src/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/cert.txt
          grep -qi '6699b2b6b15b5e09032b4f54c5c26bbd982a41dc48d5a5093d1501036a474a1e' /tmp/cert.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='ch.clubvwsuisse.drivebox.v1'" /tmp/badging.txt
          grep -q "versionCode='47'" /tmp/badging.txt
          grep -q "versionName='1.0.0-rc38'" /tmp/badging.txt
          grep -q "application-label:'DriveBox'" /tmp/badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | tee /tmp/perms.txt
          grep -q 'android.permission.CAMERA' /tmp/perms.txt
          grep -q 'android.permission.ACCESS_FINE_LOCATION' /tmp/perms.txt
          grep -q 'android.permission.POST_NOTIFICATIONS' /tmp/perms.txt
          if grep -q 'android.permission.INTERNET' /tmp/perms.txt; then exit 1; fi
          unzip -t "$APK"
          unzip -p "$APK" res/mipmap-xxxhdpi-v4/ic_launcher.webp > /tmp/icon.webp
          test "$(sha256sum /tmp/icon.webp | awk '{print $1}')" = 'ab5bbd86c44f537aae43e60584c39c923cee3e7c855ae887332617158c0e8a05'
          cp "$APK" "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC38.apk"
          rm -rf /tmp/drivebox-src/app/build /tmp/drivebox-src/.gradle
          (cd /tmp/drivebox-src && zip -qr "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC38-source.zip" .)
          sha256sum "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC38.apk" > "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC38.apk.sha256.txt"
          sha256sum "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC38-source.zip" > "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC38-source.zip.sha256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: DriveBox-1.0.0-RC38-STABILITY
          path: |
            DriveBox-1.0.0-RC38.apk
            DriveBox-1.0.0-RC38.apk.sha256.txt
            DriveBox-1.0.0-RC38-source.zip
            DriveBox-1.0.0-RC38-source.zip.sha256.txt
          if-no-files-found: error
          retention-days: 7
