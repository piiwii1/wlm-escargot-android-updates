name: Temporary PiiWii Files 1.3.34 delivery
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/_chatgpt_temp_nca108_delivery.yml'
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode verified APK
        run: |
          set -euo pipefail
          base64 -d delivery/PiiWii-Files-1.3.34.apk.b64 > delivery/PiiWii-Files-1.3.34.apk
          unzip -t delivery/PiiWii-Files-1.3.34.apk >/dev/null
          sha256sum delivery/PiiWii-Files-1.3.34.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PiiWii-Files-1.3.34-APK
          path: delivery/PiiWii-Files-1.3.34.apk
          retention-days: 1

      - name: Commit temporary APK
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f delivery/PiiWii-Files-1.3.34.apk
          git commit -m 'Temporary PiiWii Files 1.3.34 APK delivery' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
