name: Build DriveBox RC17 Country Ergonomy

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/drivebox-rc17-country-ergonomy.yml'
      - '.github/workflows/drivebox-rc16-country-light.yml'
      - 'drivebox-ci/rc17-country-ergonomy.patch.gz.b64'
      - 'drivebox-ci/rc17-trigger.txt'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct validated RC16 source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/drivebox-rc16-country-light.yml').read_text()
          def extract(step_name, out):
              marker = '      - name: ' + step_name + '\n'
              start = text.index(marker)
              run_start = text.index('        run: |\n', start) + len('        run: |\n')
              end = text.find('\n      - ', run_start)
              if end < 0:
                  end = len(text)
              block = text[run_start:end]
              lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
              Path(out).write_text('\n'.join(lines) + '\n')
          extract('Reconstruct validated RC15 source', '/tmp/rc16-base.sh')
          extract('Apply RC16 country sheets and light mode', '/tmp/rc16-apply.sh')
          PY
          bash /tmp/rc16-base.sh
          bash /tmp/rc16-apply.sh
          test -f /tmp/drivebox-src/app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java
          grep -q "versionCode 25" /tmp/drivebox-src/app/build.gradle
          grep -q "1.0.0-rc16" /tmp/drivebox-src/app/build.gradle

      - name: Apply RC17 country ergonomics
        shell: bash
        run: |
          set -euo pipefail
          base64 -d drivebox-ci/rc17-country-ergonomy.patch.gz.b64 | gzip -d > /tmp/rc17.patch
          cd /tmp/drivebox-src
          patch -p1 < /tmp/rc17.patch
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path('/tmp/drivebox-src/app/build.gradle')
          g = gradle.read_text()
          g = g.replace('versionCode 25', 'versionCode 26')
          g = g.replace("versionName '1.0.0-rc16'", "versionName '1.0.0-rc17'")
          gradle.write_text(g)
          PY
          JAVA=/tmp/drivebox-src/app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java
          grep -q 'countryGroup("🚗", "Conduite"' "$JAVA"
          grep -q 'countryGroup("🛣", "Autoroute & péage"' "$JAVA"
          grep -q 'countryGroup("🧰", "Équipement"' "$JAVA"
          grep -q 'countryGroup("❄", "Hiver"' "$JAVA"
          grep -q 'countryGroup("☎", "Urgence"' "$JAVA"
          grep -q 'Alcool • feux • zones environnementales' "$JAVA"
          grep -q 'E-vignette officielle : CHF 40' "$JAVA"
          grep -q 'Résumé pratique hors ligne' "$JAVA"
          grep -q 'DriveBox 1.0.0 RC17' "$JAVA"
          grep -q "versionCode 26" /tmp/drivebox-src/app/build.gradle
          grep -q "1.0.0-rc17" /tmp/drivebox-src/app/build.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build RC17
        working-directory: /tmp/drivebox-src
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Verify and package RC17
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/drivebox-src/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/cert.txt
          grep -qi '6699b2b6b15b5e09032b4f54c5c26bbd982a41dc48d5a5093d1501036a474a1e' /tmp/cert.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='ch.clubvwsuisse.drivebox.v1'" /tmp/badging.txt
          grep -q "versionCode='26'" /tmp/badging.txt
          grep -q "versionName='1.0.0-rc17'" /tmp/badging.txt
          grep -q "application-label:'DriveBox'" /tmp/badging.txt
          unzip -t "$APK"
          unzip -l "$APK" | grep -q 'classes.dex'
          unzip -l "$APK" | grep -q 'resources.arsc'
          unzip -p "$APK" res/mipmap-xxxhdpi-v4/ic_launcher.webp > /tmp/icon.webp
          test "$(sha256sum /tmp/icon.webp | awk '{print $1}')" = 'ab5bbd86c44f537aae43e60584c39c923cee3e7c855ae887332617158c0e8a05'
          cp "$APK" "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC17.apk"
          rm -rf /tmp/drivebox-src/app/build /tmp/drivebox-src/.gradle
          (cd /tmp/drivebox-src && zip -qr "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC17-source.zip" .)
          sha256sum "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC17.apk" > "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC17.apk.sha256.txt"
          sha256sum "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC17-source.zip" > "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC17-source.zip.sha256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: DriveBox-1.0.0-RC17-COUNTRY-ERGONOMY
          path: |
            DriveBox-1.0.0-RC17.apk
            DriveBox-1.0.0-RC17.apk.sha256.txt
            DriveBox-1.0.0-RC17-source.zip
            DriveBox-1.0.0-RC17-source.zip.sha256.txt
          if-no-files-found: error
          retention-days: 7
