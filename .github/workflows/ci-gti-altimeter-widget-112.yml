name: CI GTI Altimeter Widget 1.1.2

on:
  push:
    branches: [ci-gti-altimeter-widget-1.1.2]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild source project from stable 1.1.1 chunks
        shell: bash
        run: |
          set -euo pipefail
          cat ci/gtialtimeter-project.b64.00 ci/gtialtimeter-project.b64.01 ci/gtialtimeter-project.b64.02 ci/gtialtimeter-project.b64.03 | tr -d '\n\r' | base64 -d > /tmp/gtialtimeter-project.zip
          unzip -t /tmp/gtialtimeter-project.zip
          rm -rf ci-gtialtimeter-1.1.2-project
          mkdir ci-gtialtimeter-1.1.2-project
          unzip -q /tmp/gtialtimeter-project.zip -d ci-gtialtimeter-1.1.2-project

      - name: Patch 1.1.2 UI and GPS waiting state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('ci-gtialtimeter-1.1.2-project')
          p=root/'app/build.gradle'
          s=p.read_text()
          s=s.replace('versionCode 3','versionCode 4').replace("versionName '1.1.1'","versionName '1.1.2'")
          p.write_text(s)

          p=root/'app/src/main/java/ch/piiwii/gtialtimeter/WidgetRenderer.java'
          s=p.read_text()
          s=s.replace('Paint waiting = textPaint(10.2f, Color.rgb(222, 223, 228), true);\n            fitText(waiting, "RECHERCHE…", 64f, 8f);\n            c.drawText("RECHERCHE…", 61f, 49.5f, waiting);\n            Paint hint = textPaint(5.6f, MUTED, false);\n            c.drawText(AltitudeState.gpsEnabled(context) ? "signal GPS" : "GPS désactivé", 61.5f, 57f, hint);', 'Paint waiting = textPaint(9.6f, Color.rgb(226, 227, 232), true);\n            fitText(waiting, "RECHERCHE…", 58f, 7.5f);\n            c.drawText("RECHERCHE…", 61f, 48.8f, waiting);\n            Paint hint = textPaint(5.4f, MUTED, false);\n            String status = !AltitudeState.gpsEnabled(context) ? "GPS désactivé" :\n                    (AltitudeState.positionReceived(context) ? "signal insuffisant" : "signal GPS");\n            c.drawText(status, 61.5f, 56.4f, hint);')
          s=s.replace('drawGps(c, context, 61f, 76.2f);\n        drawAccuracy(c, context, 111f, 76.2f);', 'drawGps(c, context, 61f, 76.2f, valid);\n        drawAccuracy(c, context, 111f, 76.2f, valid);')
          s=s.replace('private static void drawGps(Canvas c, Context context, float x, float y) {', 'private static void drawGps(Canvas c, Context context, float x, float y, boolean altitudeValid) {')
          s=s.replace('int bars = gpsBars(AltitudeState.hAcc(context), enabled);', 'int bars = gpsBars(AltitudeState.hAcc(context), enabled && (altitudeValid || AltitudeState.positionReceived(context)));')
          s=s.replace('private static void drawAccuracy(Canvas c, Context context, float x, float y) {', 'private static void drawAccuracy(Canvas c, Context context, float x, float y, boolean altitudeValid) {')
          old='''        float accuracy = !Float.isNaN(AltitudeState.vAcc(context)) ? AltitudeState.vAcc(context) : AltitudeState.hAcc(context);\n        String value = Float.isNaN(accuracy) ? "PRÉC. —" : "±" + Math.max(1, Math.round(accuracy)) + " m";\n        Paint text = textPaint(Float.isNaN(accuracy) ? 5.8f : 6.8f, Color.rgb(232, 233, 237), true);\n        fitText(text, value, 34f, 5f);\n        c.drawText(value, x + 9.2f, y, text);'''
          new='''        float accuracy = !Float.isNaN(AltitudeState.vAcc(context)) ? AltitudeState.vAcc(context) : AltitudeState.hAcc(context);\n        boolean usableAccuracy = altitudeValid && !Float.isNaN(accuracy) && accuracy <= 120f;\n        String value = usableAccuracy ? "±" + Math.max(1, Math.round(accuracy)) + " m" : "PRÉC. —";\n        Paint text = textPaint(usableAccuracy ? 6.8f : 5.8f, usableAccuracy ? Color.rgb(232, 233, 237) : MUTED, true);\n        fitText(text, value, 34f, 5f);\n        c.drawText(value, x + 9.2f, y, text);'''
          if old not in s:
              raise SystemExit('accuracy block not found')
          s=s.replace(old,new)
          p.write_text(s)
          PY

      - name: Verify source identity
        shell: bash
        run: |
          set -euo pipefail
          grep -q "applicationId 'ch.piiwii.gtialtimeter'" ci-gtialtimeter-1.1.2-project/app/build.gradle
          grep -q "versionCode 4" ci-gtialtimeter-1.1.2-project/app/build.gradle
          grep -q "versionName '1.1.2'" ci-gtialtimeter-1.1.2-project/app/build.gradle
          grep -q "usableAccuracy" ci-gtialtimeter-1.1.2-project/app/src/main/java/ch/piiwii/gtialtimeter/WidgetRenderer.java

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle -p ci-gtialtimeter-1.1.2-project --no-daemon --stacktrace clean assembleRelease

      - name: Zipalign and inspect APK
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          "$BT/zipalign" -p -f 4 ci-gtialtimeter-1.1.2-project/app/build/outputs/apk/release/app-release-unsigned.apk GTI-Altimeter-Widget-1.1.2-aligned-unsigned.apk
          "$BT/zipalign" -c -v 4 GTI-Altimeter-Widget-1.1.2-aligned-unsigned.apk
          "$BT/aapt" dump badging GTI-Altimeter-Widget-1.1.2-aligned-unsigned.apk > GTI-Altimeter-Widget-1.1.2-badging.txt
          grep -q "package: name='ch.piiwii.gtialtimeter' versionCode='4' versionName='1.1.2'" GTI-Altimeter-Widget-1.1.2-badging.txt
          cp "$BT/lib/apksigner.jar" apksigner.jar
          sha256sum GTI-Altimeter-Widget-1.1.2-aligned-unsigned.apk apksigner.jar > CI-SHA256.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GTI-Altimeter-Widget-1.1.2-build
          if-no-files-found: error
          retention-days: 3
          path: |
            GTI-Altimeter-Widget-1.1.2-aligned-unsigned.apk
            GTI-Altimeter-Widget-1.1.2-badging.txt
            CI-SHA256.txt
            apksigner.jar
