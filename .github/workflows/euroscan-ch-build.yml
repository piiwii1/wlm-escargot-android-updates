name: EuroScan CH APK Build
on:
  push:
    branches: [ euroscan-build-100 ]
    paths:
      - 'euroscan-ch-1.0.1-src.zip'
      - '.github/workflows/euroscan-ch-build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore EuroScan CH 1.0.1 sources
        run: |
          rm -rf euroscan-ch
          unzip -q euroscan-ch-1.0.1-src.zip
      - name: Build APK
        working-directory: euroscan-ch
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Prepare delivery
        run: |
          mkdir -p delivery
          cp euroscan-ch/app/build/outputs/apk/debug/app-debug.apk delivery/EuroScan-CH-1.0.1.apk
          cp euroscan-ch-1.0.1-src.zip delivery/EuroScan-CH-1.0.1-SOURCES.zip
          printf 'versionName=1.0.1\nversionCode=2\npackage=ch.piiwii.euroscan\n' > delivery/VERSION.txt
          sha256sum delivery/EuroScan-CH-1.0.1.apk | tee delivery/APK-SHA256.txt
          sha256sum delivery/EuroScan-CH-1.0.1-SOURCES.zip | tee delivery/SOURCES-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: EuroScan-CH-1.0.1-DELIVERY
          path: delivery/*
          retention-days: 7
          if-no-files-found: error

# trigger 1.0.1
