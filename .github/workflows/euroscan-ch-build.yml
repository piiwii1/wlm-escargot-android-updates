name: EuroScan CH 1.2.1 Unsigned Build
on:
  push:
    branches: [ euroscan-build-110 ]
    paths:
      - 'euroscan-ch/**'
      - '.github/workflows/euroscan-ch-build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply 1.2.1 hotfix
        working-directory: euroscan-ch
        run: python3 hotfix_121.py
      - name: Build unsigned release
        working-directory: euroscan-ch
        run: gradle --no-daemon --stacktrace assembleRelease
      - name: Verify package metadata
        run: |
          APK='euroscan-ch/app/build/outputs/apk/release/app-release-unsigned.apk'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='ch.piiwii.euroscan' versionCode='4' versionName='1.2.1'" /tmp/badging.txt
          grep -q "launchable-activity: name='ch.piiwii.euroscan.MainActivity'" /tmp/badging.txt
      - name: Prepare unsigned delivery
        run: |
          mkdir -p delivery/tools/lib64
          cp euroscan-ch/app/build/outputs/apk/release/app-release-unsigned.apk delivery/EuroScan-CH-1.2.1-UNSIGNED.apk
          cp /tmp/badging.txt delivery/APK-BADGING.txt
          zip -qr delivery/EuroScan-CH-1.2.1-SOURCES.zip euroscan-ch -x 'euroscan-ch/app/build/*' -x 'euroscan-ch/.gradle/*'
          printf 'versionName=1.2.1\nversionCode=4\npackage=ch.piiwii.euroscan\n' > delivery/VERSION.txt
          sha256sum delivery/EuroScan-CH-1.2.1-UNSIGNED.apk > delivery/UNSIGNED-SHA256.txt
          sha256sum delivery/EuroScan-CH-1.2.1-SOURCES.zip > delivery/SOURCES-SHA256.txt
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" delivery/tools/apksigner.jar
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" delivery/tools/zipalign
          cp "$ANDROID_HOME/build-tools/35.0.0/lib64/libc++.so" delivery/tools/lib64/libc++.so
          chmod +x delivery/tools/zipalign
      - uses: actions/upload-artifact@v4
        with:
          name: EuroScan-CH-1.2.1-UNSIGNED-WITH-TOOLS
          path: delivery/*
          retention-days: 7
          if-no-files-found: error
