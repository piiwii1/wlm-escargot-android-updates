name: PiiWii Remote Windows beta4 Legacy Migration

on:
  push:
    branches: [piiwii-remote-v2-windows-beta4-migration]
    paths:
      - 'piiwii-remote-v2-windows-beta4/**'
      - '.github/workflows/piiwii-remote-windows-beta4-migration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Build and test Windows beta4 migration
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct beta1 and apply beta4 patch
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(cygpath -u "$RUNNER_TEMP")"
          bash piiwii-remote-v2-lot12/reconstruct-lot12.sh "$BASE/piiwii-beta4-src"
          ROOT="$BASE/piiwii-beta4-src/piiwii-remote"
          base64 -d piiwii-remote-v2-windows-beta4/beta4.patch.xz.b64 | xz -d > "$BASE/beta4.patch"
          (cd "$ROOT" && patch -p1 < "$BASE/beta4.patch")
          mkdir -p "$ROOT/windows-agent/installer"
          cp piiwii-remote-v2-windows-beta4/PiiWiiRemoteAgent.iss "$ROOT/windows-agent/installer/"
          grep -q '2.0.0-beta4' "$ROOT/windows-agent/src/PiiWiiRemoteAgent.cpp"
          grep -q 'Code d.appairage' "$ROOT/windows-agent/src/PiiWiiRemoteAgent.cpp"
          grep -q 'revealExistingAgentWindow' "$ROOT/windows-agent/src/PiiWiiRemoteAgent.cpp"
          grep -q 'FILEVERSION 2,0,0,11' "$ROOT/windows-agent/src/PiiWiiRemoteAgent.rc"
          grep -q 'RegDeleteValue' "$ROOT/windows-agent/installer/PiiWiiRemoteAgent.iss"
          grep -q 'PiiWii-Remote-Agent-2.0.0-alpha4.exe' "$ROOT/windows-agent/installer/PiiWiiRemoteAgent.iss"

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile Agent beta4 x64
        shell: cmd
        working-directory: ${{ runner.temp }}\piiwii-beta4-src\piiwii-remote\windows-agent
        run: |
          if not exist build mkdir build
          rc /nologo /fo build\PiiWiiRemoteAgent.res src\PiiWiiRemoteAgent.rc
          cl /nologo /std:c++17 /EHsc /W4 /DUNICODE /D_UNICODE /DWIN32 /D_WINDOWS /O2 src\PiiWiiRemoteAgent.cpp build\PiiWiiRemoteAgent.res gdi32.lib user32.lib advapi32.lib PowrProf.lib bcrypt.lib shell32.lib /link /SUBSYSTEM:WINDOWS /OUT:build\PiiWii-Remote-Agent-2.0.0-beta4.exe

      - name: Validate Agent beta4
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'piiwii-beta4-src\piiwii-remote\windows-agent'
          $exe=Join-Path $root 'build\PiiWii-Remote-Agent-2.0.0-beta4.exe'
          $p=Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru
          if($p.ExitCode -ne 0){throw "Agent self-test failed: $($p.ExitCode)"}
          $r=Start-Process -FilePath $exe -ArgumentList '--reopen-self-test' -Wait -PassThru
          if($r.ExitCode -ne 0){throw "Reopen self-test failed: $($r.ExitCode)"}
          $h=& dumpbin /headers $exe | Out-String
          if($h -notmatch 'PE32\+' -or ($h -notmatch 'machine \(x64\)' -and $h -notmatch '8664 machine')){throw 'Agent is not PE32+ x64'}
          $v=(Get-Item $exe).VersionInfo
          if($v.ProductVersion -notlike '2.0.0-beta4*'){throw "Bad ProductVersion: $($v.ProductVersion)"}

      - name: Build beta4 installer
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'piiwii-beta4-src\piiwii-remote\windows-agent'
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if(-not(Test-Path $iscc)){ choco install innosetup --no-progress -y }
          & $iscc (Join-Path $root 'installer\PiiWiiRemoteAgent.iss')
          if($LASTEXITCODE -ne 0){throw "Inno Setup failed: $LASTEXITCODE"}
          $setup=Join-Path $root 'installer\output\PiiWii-Remote-Setup-2.0.0-beta4.exe'
          if(-not(Test-Path $setup)){throw 'Setup missing'}
          if((Get-Item $setup).VersionInfo.ProductVersion -notlike '2.0.0.11*'){throw 'Bad setup version'}

      - name: Simulate alpha4 startup and verify automatic migration
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'piiwii-beta4-src\piiwii-remote\windows-agent'
          $setup=Join-Path $root 'installer\output\PiiWii-Remote-Setup-2.0.0-beta4.exe'
          $installDir=Join-Path $env:LOCALAPPDATA 'Programs\PiiWii Remote Agent'
          $installedExe=Join-Path $installDir 'PiiWii-Remote-Agent.exe'
          $desktop=Join-Path ([Environment]::GetFolderPath('Desktop')) 'PiiWii Remote Agent.lnk'
          $startMenu=Join-Path ([Environment]::GetFolderPath('Programs')) 'PiiWii Remote Agent.lnk'
          $runKey='HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'

          New-Item -Path $runKey -Force | Out-Null
          $legacyPath=Join-Path $env:RUNNER_TEMP 'PiiWii-Remote-Agent-2.0.0-alpha4.exe'
          Copy-Item "$env:WINDIR\System32\cmd.exe" $legacyPath -Force
          New-ItemProperty -Path $runKey -Name 'PiiWii Remote Agent' -Value ('"'+$legacyPath+'" --background') -PropertyType String -Force | Out-Null
          $legacy=Start-Process -FilePath $legacyPath -ArgumentList '/c','ping -t 127.0.0.1' -PassThru
          Start-Sleep -Milliseconds 800
          if($legacy.HasExited){throw 'Legacy alpha4 simulation did not start'}

          $p=Start-Process $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS="autostart"') -Wait -PassThru
          if($p.ExitCode -ne 0){throw "Install failed: $($p.ExitCode)"}
          Start-Sleep -Milliseconds 800
          $legacy.Refresh()
          if(-not $legacy.HasExited){Stop-Process -Id $legacy.Id -Force -ErrorAction SilentlyContinue; throw 'Legacy alpha4 process was not terminated'}

          foreach($f in @($installedExe,$desktop,$startMenu)){if(-not(Test-Path $f)){throw "Missing $f"}}
          $runValue=(Get-ItemProperty -Path $runKey -Name 'PiiWii Remote Agent').'PiiWii Remote Agent'
          $expected='"'+$installedExe+'" --background'
          if($runValue -ne $expected){throw "Run migration failed. Expected [$expected], got [$runValue]"}
          if($runValue -match 'alpha4'){throw 'Legacy alpha4 startup reference remained'}

          $ws=New-Object -ComObject WScript.Shell
          foreach($lnk in @($desktop,$startMenu)){
            $sc=$ws.CreateShortcut($lnk)
            if([IO.Path]::GetFullPath($sc.TargetPath) -ne [IO.Path]::GetFullPath($installedExe)){throw "Wrong shortcut target: $($sc.TargetPath)"}
          }
          $v=(Get-Item $installedExe).VersionInfo
          if($v.ProductVersion -notlike '2.0.0-beta4*'){throw "Installed version is not beta4: $($v.ProductVersion)"}
          $t=Start-Process $installedExe -ArgumentList '--self-test' -Wait -PassThru
          if($t.ExitCode -ne 0){throw 'Installed beta4 self-test failed'}
          $r=Start-Process $installedExe -ArgumentList '--reopen-self-test' -Wait -PassThru
          if($r.ExitCode -ne 0){throw 'Installed beta4 reopen self-test failed'}

          $un=Join-Path $installDir 'unins000.exe'
          $u=Start-Process $un -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if($u.ExitCode -ne 0){throw 'Uninstall failed'}
          Start-Sleep -Seconds 1
          if(Test-Path $desktop){throw 'Desktop shortcut remained'}
          if(Test-Path $startMenu){throw 'Start Menu shortcut remained'}
          $remaining=(Get-ItemProperty -Path $runKey -Name 'PiiWii Remote Agent' -ErrorAction SilentlyContinue).'PiiWii Remote Agent'
          if($remaining){throw "Run value remained after uninstall: $remaining"}
          'LEGACY ALPHA4 -> BETA4 MIGRATION: OK'

      - name: Package beta4
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'piiwii-beta4-src\piiwii-remote\windows-agent'
          $out=Join-Path $env:RUNNER_TEMP 'piiwii-beta4-out'; New-Item -ItemType Directory -Force $out|Out-Null
          Copy-Item (Join-Path $root 'build\PiiWii-Remote-Agent-2.0.0-beta4.exe') $out
          Copy-Item (Join-Path $root 'installer\output\PiiWii-Remote-Setup-2.0.0-beta4.exe') $out
          Copy-Item (Join-Path $root 'installer\PiiWiiRemoteAgent.iss') $out
          @(
            'PIIWII REMOTE WINDOWS BETA4 MIGRATION AUDIT PASSED',
            'Legacy alpha4 Run registry value replaced: OK',
            'Legacy alpha4 process termination: OK',
            'Canonical install path: OK',
            'Desktop + Start Menu shortcuts: OK',
            'Autostart points to canonical beta4: OK',
            'Pairing code UI retained: OK',
            'Single-instance reopen retained: OK',
            'Agent PE32+ x64 self-test + reopen self-test: OK',
            'Uninstall removes shortcuts + autostart: OK'
          ) | Set-Content (Join-Path $out 'PiiWii-Remote-Windows-2.0.0-beta4-AUDIT.txt')
          Get-ChildItem $out -File | ForEach-Object {"$((Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower())  $($_.Name)"} | Set-Content (Join-Path $out 'PiiWii-Remote-Windows-2.0.0-beta4-SHA256.txt')
          Compress-Archive -Path (Join-Path $root 'src'),(Join-Path $root 'installer') -DestinationPath (Join-Path $out 'PiiWii-Remote-Windows-2.0.0-beta4-Sources.zip') -Force

      - uses: actions/upload-artifact@v4
        with:
          name: PiiWii-Remote-Windows-2.0.0-beta4-Migration
          path: ${{ runner.temp }}\piiwii-beta4-out\*
          retention-days: 7
          if-no-files-found: error
