name: PiiWii Documents 0.14.0 Windows Build
on:
  push:
    branches: [build/piiwii-documents-0.14.0]
    paths:
      - '.github/workflows/piiwii-documents-0140-build.yml'
      - 'build-piiwii-documents-0140/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble 0.13.0 base
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-piiwii-documents-0140/work
          cat build-piiwii-documents-030/chunks/00 build-piiwii-documents-030/chunks/01 build-piiwii-documents-030/chunks/02 build-piiwii-documents-030/chunks/03 build-piiwii-documents-030/chunks/04 build-piiwii-documents-030/chunks/05 build-piiwii-documents-030/chunks/06 > build-piiwii-documents-0140/source.b64
          base64 -d build-piiwii-documents-0140/source.b64 > build-piiwii-documents-0140/source.zip
          unzip -q -o build-piiwii-documents-0140/source.zip -d build-piiwii-documents-0140/work || [ $? -eq 1 ]
          rm -rf build-piiwii-documents-0140/work/src/*/bin build-piiwii-documents-0140/work/src/*/obj build-piiwii-documents-0140/work/src/PiiWii.Documents.Installer/payload
          rm -rf build-piiwii-documents-040/work build-piiwii-documents-050/work build-piiwii-documents-060/work build-piiwii-documents-070/work build-piiwii-documents-080/work build-piiwii-documents-090/work build-piiwii-documents-0100/work build-piiwii-documents-0110/work build-piiwii-documents-0120/work build-piiwii-documents-0130/work
          for v in 040 050 060 070 080 090 0100 0110 0120 0130; do ln -s ../build-piiwii-documents-0140/work build-piiwii-documents-$v/work; done
          python3 build-piiwii-documents-040/fix_apply.py || true
          python3 build-piiwii-documents-040/apply.py
          python3 build-piiwii-documents-050/apply.py
          python3 build-piiwii-documents-060/apply.py
          python3 build-piiwii-documents-070/apply.py
          python3 build-piiwii-documents-080/apply.py
          python3 build-piiwii-documents-090/apply.py
          python3 build-piiwii-documents-090/fix.py
          python3 build-piiwii-documents-0100/apply.py
          python3 build-piiwii-documents-0110/apply.py
          python3 build-piiwii-documents-0120/apply.py
          python3 build-piiwii-documents-0130/apply.py
          for v in 040 050 060 070 080 090 0100 0110 0120 0130; do rm build-piiwii-documents-$v/work; done
      - name: Apply 0.14.0 reliability and bridge upgrade
        shell: bash
        run: |
          set -euo pipefail
          python3 build-piiwii-documents-0140/apply.py
          python3 build-piiwii-documents-0140/harden.py
          cat > build-piiwii-documents-0140/work/README.md <<'EOF'
          # PiiWii Documents 0.14.0
          Version fiabilité et assistant : sauvegardes SQLite réelles, pont local limité par permissions et portée, sessions ChatGPT autorisées et import de PiiWii Import Packs.
          EOF
          cat > build-piiwii-documents-0140/work/CHANGELOG.md <<'EOF'
          # Changelog

          ## 0.14.0
          - Sauvegarde SQLite cohérente avant migration, import, paquet ChatGPT et application de résultats assistant.
          - Sauvegarde quotidienne avec rotation des 10 dernières sauvegardes.
          - Sauvegarde manuelle et ouverture du dossier Backups depuis l'interface.
          - Pont local toujours lié à 127.0.0.1, version corrigée en 0.14.0.
          - Permissions du pont vérifiées route par route : lecture et recherche uniquement.
          - Portée d'appairage limitée au lot courant ou document courant quand disponible.
          - Révocation de toutes les sessions du pont depuis l'interface.
          - Export assistant v2 avec session temporaire, lot et liste blanche d'identifiants.
          - Prévisualisation des modifications ChatGPT avant application.
          - Un résultat assistant ne peut plus modifier un document hors de la session autorisée.
          - Import d'un ZIP PiiWii préparé par ChatGPT avec manifest.json, contrôle de chemin et SHA-256.
          - Aucune commande système, aucun PowerShell/CMD et aucune écriture via le pont HTTP.
          - Compatibilité avec les documents et bases des versions précédentes.
          EOF
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build application
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore build-piiwii-documents-0140/work/src/PiiWii.Documents/PiiWii.Documents.csproj -r win-x64
          dotnet publish build-piiwii-documents-0140/work/src/PiiWii.Documents/PiiWii.Documents.csproj -c Release -r win-x64 --self-contained true -o build-piiwii-documents-0140/work/publish
          test -f build-piiwii-documents-0140/work/publish/PiiWii.Documents.exe
      - name: Build installer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-piiwii-documents-0140/work/src/PiiWii.Documents.Installer/payload
          cp build-piiwii-documents-0140/work/publish/PiiWii.Documents.exe build-piiwii-documents-0140/work/src/PiiWii.Documents.Installer/payload/PiiWii.Documents.exe
          dotnet restore build-piiwii-documents-0140/work/src/PiiWii.Documents.Installer/PiiWii.Documents.Installer.csproj -r win-x64
          dotnet publish build-piiwii-documents-0140/work/src/PiiWii.Documents.Installer/PiiWii.Documents.Installer.csproj -c Release -r win-x64 --self-contained true -o build-piiwii-documents-0140/work/installer-publish
          test -f build-piiwii-documents-0140/work/installer-publish/PiiWii-Documents-Setup-0.14.0.exe
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          W=build-piiwii-documents-0140/work
          mkdir -p $W/dist $W/PACK-REPRISE
          cp $W/installer-publish/PiiWii-Documents-Setup-0.14.0.exe $W/dist/
          cp $W/publish/PiiWii.Documents.exe $W/dist/PiiWii-Documents-0.14.0-PORTABLE.exe
          cd $W
          zip -qr dist/PiiWii-Documents-0.14.0-SOURCES.zip src README.md CHANGELOG.md -x 'src/*/bin/*' 'src/*/obj/*' 'src/PiiWii.Documents.Installer/payload/*'
          cp README.md CHANGELOG.md PACK-REPRISE/
          cp ../../build-piiwii-documents-0140/apply.py ../../build-piiwii-documents-0140/harden.py PACK-REPRISE/
          zip -qr dist/PiiWii-Documents-0.14.0-PACK-REPRISE.zip PACK-REPRISE
          cd dist
          sha256sum PiiWii-Documents-Setup-0.14.0.exe PiiWii-Documents-0.14.0-PORTABLE.exe PiiWii-Documents-0.14.0-SOURCES.zip PiiWii-Documents-0.14.0-PACK-REPRISE.zip > PiiWii-Documents-0.14.0-SHA256SUMS.txt
          cat PiiWii-Documents-0.14.0-SHA256SUMS.txt
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: PiiWii-Documents-0.14.0-BINARIES
          path: |
            build-piiwii-documents-0140/work/dist/PiiWii-Documents-Setup-0.14.0.exe
            build-piiwii-documents-0140/work/dist/PiiWii-Documents-0.14.0-PORTABLE.exe
            build-piiwii-documents-0140/work/dist/PiiWii-Documents-0.14.0-SHA256SUMS.txt
      - name: Upload sources
        uses: actions/upload-artifact@v4
        with:
          name: PiiWii-Documents-0.14.0-SOURCEPACK
          path: |
            build-piiwii-documents-0140/work/dist/PiiWii-Documents-0.14.0-SOURCES.zip
            build-piiwii-documents-0140/work/dist/PiiWii-Documents-0.14.0-PACK-REPRISE.zip
            build-piiwii-documents-0140/work/dist/PiiWii-Documents-0.14.0-SHA256SUMS.txt
