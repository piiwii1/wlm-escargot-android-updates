name: PiiWii Remote 2 Lot4

on:
  push:
    branches:
      - piiwii-remote-v2-lot4
    paths:
      - 'piiwii-remote-v2-lot4/source/**'
      - '.github/workflows/piiwii-remote-v2-lot4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-lot4:
    name: Phone alpha4 + TV regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and verify Lot 4 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/piiwii-lot4-src
          cat piiwii-remote-v2-lot4/source/part_*.b64 | base64 -d > /tmp/piiwii-lot4.tar.xz
          echo '9ae6dfa09c88638c4554c961c7990d55e6d644bfe08bffa46214c7f7b0b4967a  /tmp/piiwii-lot4.tar.xz' | sha256sum -c -
          tar -xJf /tmp/piiwii-lot4.tar.xz -C /tmp/piiwii-lot4-src
          ROOT=/tmp/piiwii-lot4-src/piiwii-remote
          test -f "$ROOT/settings.gradle.kts"
          test -f "$ROOT/remote/src/main/java/ch/piiwii/remote2/ui/TouchpadView.kt"
          test -f "$ROOT/remote/src/main/java/ch/piiwii/remote2/ui/TouchpadSettings.kt"
          test -f "$ROOT/remote/src/main/java/ch/piiwii/remote2/protocol/PointerPayload.kt"
          grep -q 'versionCode = 23' "$ROOT/remote/build.gradle.kts"
          grep -q 'versionName = "2.0.0-alpha4"' "$ROOT/remote/build.gradle.kts"
          grep -q 'versionCode = 20' "$ROOT/tvreceiver/build.gradle.kts"
          grep -q 'versionName = "2.0.0-alpha1"' "$ROOT/tvreceiver/build.gradle.kts"
          grep -R -q 'POINTER_MOVE' "$ROOT/remote/src/main/java"
          grep -R -q 'POINTER_SCROLL' "$ROOT/remote/src/main/java"
          grep -R -q 'POINTER_DOUBLE_CLICK' "$ROOT/remote/src/main/java"
          grep -R -q 'POINTER_RIGHT_CLICK' "$ROOT/remote/src/main/java"
          grep -R -q 'TouchpadSettingsRepository' "$ROOT/remote/src/main/java"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK 35
        shell: bash
        run: |
          set -e
          echo 'ANDROID_HOME=/usr/local/lib/android/sdk' >> "$GITHUB_ENV"
          echo 'ANDROID_SDK_ROOT=/usr/local/lib/android/sdk' >> "$GITHUB_ENV"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run Android unit tests
        working-directory: /tmp/piiwii-lot4-src/piiwii-remote
        run: gradle --no-daemon --stacktrace :remote:testDebugUnitTest :tvreceiver:testDebugUnitTest

      - name: Build phone and TV APKs
        working-directory: /tmp/piiwii-lot4-src/piiwii-remote
        run: gradle --no-daemon --stacktrace :remote:assembleDebug :tvreceiver:assembleDebug

      - name: Validate and package Android Lot 4
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/piiwii-lot4-src/piiwii-remote
          OUT=/tmp/piiwii-lot4-android
          mkdir -p "$OUT"
          PHONE="$OUT/PiiWii-Remote-Phone-2.0.0-alpha4.apk"
          TV="$OUT/PiiWii-Remote-TV-2.0.0-alpha1.apk"
          cp "$ROOT/remote/build/outputs/apk/debug/remote-debug.apk" "$PHONE"
          cp "$ROOT/tvreceiver/build/outputs/apk/debug/tvreceiver-debug.apk" "$TV"
          AAPT=/usr/local/lib/android/sdk/build-tools/35.0.0/aapt
          APKSIGNER=/usr/local/lib/android/sdk/build-tools/35.0.0/apksigner
          ZIPALIGN=/usr/local/lib/android/sdk/build-tools/35.0.0/zipalign
          "$AAPT" dump badging "$PHONE" > "$OUT/PiiWii-Remote-Phone-2.0.0-alpha4-BADGING.txt"
          "$AAPT" dump badging "$TV" > "$OUT/PiiWii-Remote-TV-2.0.0-alpha1-BADGING.txt"
          grep -q "package: name='ch.piiwii.remote2' versionCode='23' versionName='2.0.0-alpha4'" "$OUT/PiiWii-Remote-Phone-2.0.0-alpha4-BADGING.txt"
          grep -q "package: name='ch.piiwii.remote2.tv' versionCode='20' versionName='2.0.0-alpha1'" "$OUT/PiiWii-Remote-TV-2.0.0-alpha1-BADGING.txt"
          "$APKSIGNER" verify --verbose --print-certs "$PHONE" > "$OUT/PiiWii-Remote-Phone-2.0.0-alpha4-SIGNATURE.txt"
          "$APKSIGNER" verify --verbose --print-certs "$TV" > "$OUT/PiiWii-Remote-TV-2.0.0-alpha1-SIGNATURE.txt"
          "$ZIPALIGN" -c -v 4 "$PHONE" > "$OUT/PiiWii-Remote-Phone-2.0.0-alpha4-ZIPALIGN.txt"
          "$ZIPALIGN" -c -v 4 "$TV" > "$OUT/PiiWii-Remote-TV-2.0.0-alpha1-ZIPALIGN.txt"
          unzip -t "$PHONE" > "$OUT/PiiWii-Remote-Phone-2.0.0-alpha4-ZIPTEST.txt"
          unzip -t "$TV" > "$OUT/PiiWii-Remote-TV-2.0.0-alpha1-ZIPTEST.txt"
          sha256sum "$PHONE" "$TV" > "$OUT/PiiWii-Remote-Android-Lot4-SHA256.txt"
          cd /tmp/piiwii-lot4-src
          zip -qr "$OUT/PiiWii-Remote-2.0.0-alpha4-Sources.zip" piiwii-remote -x '*/build/*' '*/.gradle/*' '*/.kotlin/*'
          sha256sum "$OUT/PiiWii-Remote-2.0.0-alpha4-Sources.zip" >> "$OUT/PiiWii-Remote-Android-Lot4-SHA256.txt"
          cat > "$OUT/PiiWii-Remote-2.0.0-alpha4-Lot4-Android-CI.txt" <<'EOF'
          LOT 4 ANDROID CI VALIDATED
          - Phone: ch.piiwii.remote2 / 2.0.0-alpha4 / versionCode 23
          - TV regression: ch.piiwii.remote2.tv / 2.0.0-alpha1 / versionCode 20
          - Touchpad source contains move, left click, double click, long-press right click and two-finger vertical scroll
          - Persistent cursor speed, sensitivity, scroll speed, vibration and long-press settings are present
          - Phone and TV unit tests passed
          - Both APKs built, signature verified, zipalign verified and ZIP integrity verified
          EOF

      - name: Upload Android Lot 4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: PiiWii-Remote-Android-2.0.0-alpha4-Lot4
          path: /tmp/piiwii-lot4-android/*
          retention-days: 7
          if-no-files-found: error

  windows-lot4:
    name: Windows Agent alpha2 pointer
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and verify Lot 4 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/piiwii-lot4-src
          cat piiwii-remote-v2-lot4/source/part_*.b64 | base64 -d > /tmp/piiwii-lot4.tar.xz
          echo '9ae6dfa09c88638c4554c961c7990d55e6d644bfe08bffa46214c7f7b0b4967a  /tmp/piiwii-lot4.tar.xz' | sha256sum -c -
          tar -xJf /tmp/piiwii-lot4.tar.xz -C /tmp/piiwii-lot4-src
          ROOT=/tmp/piiwii-lot4-src/piiwii-remote
          grep -q '2.0.0-alpha2' "$ROOT/windows-agent/src/PiiWiiRemoteAgent.cpp"
          grep -q 'POINTER_MOVE' "$ROOT/windows-agent/src/PiiWiiRemoteAgent.cpp"
          grep -q 'POINTER_LEFT_CLICK' "$ROOT/windows-agent/src/PiiWiiRemoteAgent.cpp"
          grep -q 'POINTER_RIGHT_CLICK' "$ROOT/windows-agent/src/PiiWiiRemoteAgent.cpp"
          grep -q 'POINTER_DOUBLE_CLICK' "$ROOT/windows-agent/src/PiiWiiRemoteAgent.cpp"
          grep -q 'POINTER_SCROLL' "$ROOT/windows-agent/src/PiiWiiRemoteAgent.cpp"

      - name: Setup MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile native x64 agent
        shell: cmd
        working-directory: C:\tmp\piiwii-lot4-src\piiwii-remote\windows-agent
        run: |
          rc /nologo /fo PiiWiiRemoteAgent.res src\PiiWiiRemoteAgent.rc
          cl /nologo /std:c++17 /EHsc /W4 /DUNICODE /D_UNICODE /DWIN32 /D_WINDOWS /O2 src\PiiWiiRemoteAgent.cpp PiiWiiRemoteAgent.res /link /SUBSYSTEM:WINDOWS /OUT:PiiWii-Remote-Agent-2.0.0-alpha2.exe

      - name: Run Windows Agent self-test
        shell: pwsh
        run: |
          $exe = 'C:\tmp\piiwii-lot4-src\piiwii-remote\windows-agent\PiiWii-Remote-Agent-2.0.0-alpha2.exe'
          $p = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Agent self-test failed with exit code $($p.ExitCode)" }

      - name: Validate x64 and version metadata
        shell: pwsh
        run: |
          $root = 'C:\tmp\piiwii-lot4-src\piiwii-remote\windows-agent'
          $exe = Join-Path $root 'PiiWii-Remote-Agent-2.0.0-alpha2.exe'
          $headers = & dumpbin /headers $exe | Out-String
          if ($headers -notmatch 'machine \(x64\)' -and $headers -notmatch '8664 machine') { throw 'EXE is not x64' }
          if ($headers -notmatch 'PE32\+') { throw 'EXE is not PE32+' }
          $vi = (Get-Item $exe).VersionInfo
          if ($vi.ProductVersion -notlike '2.0.0-alpha2*') { throw "Unexpected ProductVersion: $($vi.ProductVersion)" }
          New-Item -ItemType Directory -Force 'C:\tmp\piiwii-lot4-windows' | Out-Null
          Copy-Item $exe 'C:\tmp\piiwii-lot4-windows\PiiWii-Remote-Agent-2.0.0-alpha2.exe'
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLower()
          "$hash  PiiWii-Remote-Agent-2.0.0-alpha2.exe" | Set-Content 'C:\tmp\piiwii-lot4-windows\PiiWii-Remote-Agent-2.0.0-alpha2-SHA256.txt'
          @"
          LOT 4 WINDOWS CI VALIDATED
          - Native Win32 x64 / PE32+
          - ProductVersion 2.0.0-alpha2
          - Self-test passed
          - Pointer move, left/right/double click and vertical wheel command handlers present
          - Pointer payload parsing is covered by self-test without physically moving the CI runner cursor
          "@ | Set-Content 'C:\tmp\piiwii-lot4-windows\PiiWii-Remote-Agent-2.0.0-alpha2-CI.txt'

      - name: Upload Windows Lot 4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: PiiWii-Remote-Windows-Agent-2.0.0-alpha2-Lot4
          path: C:\tmp\piiwii-lot4-windows\*
          retention-days: 7
          if-no-files-found: error
