name: Build DriveBox RC7 APK

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'drivebox-ci/rc7-trigger.txt'
      - 'drivebox-ci/rc7-icon-192.webp.b64'
      - '.github/workflows/drivebox-rc7.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct base
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/drivebox-src
          mkdir -p /tmp/drivebox-src
          cat drivebox-ci/source.part*.b64 | tr -d '\r\n\t ' | base64 -d > /tmp/drivebox-source.zip
          unzip -t /tmp/drivebox-source.zip
          unzip -q /tmp/drivebox-source.zip -d /tmp/drivebox-src
          test -f /tmp/drivebox-src/app/build.gradle
          sed -i 's/@color\/drivebox_icon_bg/@color\/launcher_background/g' /tmp/drivebox-src/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          sed -i 's/@color\/drivebox_icon_bg/@color\/launcher_background/g' /tmp/drivebox-src/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Reuse stable RC2 and RC4 base
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          def extract(path, step_name, out):
              text = Path(path).read_text()
              marker = '      - name: ' + step_name + '\n'
              start = text.index(marker)
              run_start = text.index('        run: |\n', start) + len('        run: |\n')
              end = text.find('\n      - name:', run_start)
              if end < 0: end = len(text)
              block = text[run_start:end]
              lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
              Path(out).write_text('\n'.join(lines) + '\n')
          extract('.github/workflows/drivebox-build.yml', 'Apply DriveBox RC2 cleanup', '/tmp/rc2.sh')
          extract('.github/workflows/drivebox-rc4-build.yml', 'Apply RC4 cleanup, exact icon, stable signing', '/tmp/rc4.sh')
          PY
          bash /tmp/rc2.sh
          bash /tmp/rc4.sh
          keytool -list -keystore /tmp/drivebox-src/drivebox-dev.keystore -storepass DriveBoxDev2026 -alias drivebox | grep -qi drivebox

      - name: Apply RC7 simplified app and exact official icon
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          java = Path('/tmp/drivebox-src/app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java')
          s = java.read_text()

          def replace_between(src, start, next_start, new):
              a = src.index(start)
              b = src.index(next_start, a)
              return src[:a] + new + "\n\n    " + src[b:]

          s = s.replace('DriveBox 1.0.0 RC4', 'DriveBox 1.0.0 RC7')
          s = s.replace('DriveBox 1.0.0 RC2', 'DriveBox 1.0.0 RC7')
          s = s.replace('Les infos et outils auto utiles, sans superflu.', 'L’essentiel automobile, sans remplissage.')
          s = s.replace('Les infos et outils auto utiles, sans blabla.', 'L’essentiel automobile, sans remplissage.')
          s = s.replace('Des contrôles simples pour tout le monde.', 'Mécanique et diagnostic utiles.')
          s = s.replace('Des contrôles simples, expliqués sans jargon.', 'Mécanique et diagnostic utiles.')

          # Search/favorites: retain only useful technical references and calculators.
          banned = [
              'Éclairage', 'Essuie-glaces', 'Désembuage', 'Crevaison', 'Étiquettes carburant',
              'Check-list convoi', 'Check-list long trajet', 'Mon véhicule', 'Temps de trajet', 'Consommation'
          ]
          lines = []
          for line in s.splitlines():
              if 'x.add(new CatalogItem(' in line and any(word in line for word in banned):
                  continue
              lines.append(line)
          s = '\n'.join(lines) + '\n'

          # Home: the four category tiles are enough. No wall of secondary cards.
          start = 'Runnable renderDefault = () -> {'
          a = s.index(start)
          end_marker = '        };\n        renderDefault.run();'
          b = s.index(end_marker, a)
          new_default = '''Runnable renderDefault = () -> {
              results.removeAllViews();
              if (favoriteCount() > 0) {
                  results.addView(wideCard("★", "Mes favoris", favoriteCount() + " raccourci(s)", ORANGE, this::favoritesScreen));
              }
              TextView foot = text("DriveBox 1.0.0 RC7 • by Club VW Suisse", 11, MUTED, false);
              foot.setGravity(Gravity.CENTER);
              results.addView(foot, lp(-1, -2, 0, 18, 0, 0));
          };'''
          s = s[:a] + new_default + s[b+len('        };'):]

          # Technical maintenance only.
          new_maintenance = '''private void maintenanceHome() {
              LinearLayout root = page("🔧", "Entretien", "Mécanique et diagnostic utiles.");
              root.addView(wideCard("🛢", "Niveau d'huile", "Lecture correcte de la jauge", ORANGE, this::oilGuide));
              root.addView(wideCard("🌡", "Liquide de refroidissement", "Contrôle à froid et anomalies", BLUE, this::coolantGuide));
              root.addView(wideCard("🔋", "Batterie 12 V", "Tension, faiblesse et diagnostic", GREEN, this::batteryGuide));
              root.addView(wideCard("🛑", "Freins", "Symptômes, usure et alertes", RED, this::brakeGuide));
              root.addView(wideCard("⚠", "Voyants", "Priorité et gravité des alertes", ORANGE, this::warningLightsGuide));
              root.addView(wideCard("⚡", "Câbles / booster", "Branchement et précautions", RED, this::jumpStartGuide));
              setScrollablePage(root);
          }'''
          s = replace_between(s, 'private void maintenanceHome() {', 'private void oilGuide() {', new_maintenance)

          # Compact toolbox only.
          new_tools = '''private void toolsScreen() {
              LinearLayout root = page("🧰", "Outils", "Conversions et calculs utiles.");
              root.addView(wideCard("⇄", "km / miles", "Distance et vitesse", BLUE, this::converterScreen));
              root.addView(wideCard("💨", "bar / psi", "Pression des pneus", BLUE, this::pressureConverterScreen));
              root.addView(wideCard("⛽", "Frais de route", "Carburant et partage du coût", GREEN, this::costCalculatorScreen));
              root.addView(wideCard("⛽", "Autonomie", "Estimation à partir du carburant restant", PURPLE, this::rangeCalculatorScreen));
              root.addView(wideCard("🛞", "Dimensions de pneus", "Comparer diamètre et circonférence", BLUE, this::tyreSizeComparatorScreen));
              setScrollablePage(root);
          }'''
          s = replace_between(s, 'private void toolsScreen() {', 'private void converterScreen() {', new_tools)
          java.write_text(s)

          gradle = Path('/tmp/drivebox-src/app/build.gradle')
          g = gradle.read_text()
          g = g.replace("applicationId 'ch.clubvwsuisse.drivebox'", "applicationId 'ch.clubvwsuisse.drivebox.v1'")
          g = g.replace('versionCode 13', 'versionCode 16')
          g = g.replace("versionName '1.0.0-rc4'", "versionName '1.0.0-rc7'")
          gradle.write_text(g)
          PY

          # Exact artwork supplied by the user, only resized/compressed for Android. No substitute vector.
          base64 -d drivebox-ci/rc7-icon-192.webp.b64 > /tmp/drivebox-official.webp
          file /tmp/drivebox-official.webp | grep -qi WebP
          test "$(sha256sum /tmp/drivebox-official.webp | awk '{print $1}')" = 'ab5bbd86c44f537aae43e60584c39c923cee3e7c855ae887332617158c0e8a05'

          RES=/tmp/drivebox-src/app/src/main/res
          rm -f "$RES/drawable/ic_launcher_foreground.xml" "$RES/drawable/drivebox_logo.xml" "$RES/drawable/ic_launcher_adaptive_foreground.xml"
          rm -rf "$RES/mipmap-anydpi-v26"
          rm -f "$RES/mipmap/ic_launcher.xml"
          mkdir -p "$RES/drawable-nodpi"
          rm -f "$RES/drawable-nodpi/ic_launcher_foreground."* "$RES/drawable-nodpi/drivebox_logo."*
          cp /tmp/drivebox-official.webp "$RES/drawable-nodpi/ic_launcher_foreground.webp"
          cp /tmp/drivebox-official.webp "$RES/drawable-nodpi/drivebox_logo.webp"

          # Legacy launcher resources on purpose: avoids Android selecting an obsolete/empty adaptive foreground.
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$RES/mipmap-$d"
            rm -f "$RES/mipmap-$d/ic_launcher."* "$RES/mipmap-$d/ic_launcher_round."*
            cp /tmp/drivebox-official.webp "$RES/mipmap-$d/ic_launcher.webp"
            cp /tmp/drivebox-official.webp "$RES/mipmap-$d/ic_launcher_round.webp"
          done

          grep -q "applicationId 'ch.clubvwsuisse.drivebox.v1'" /tmp/drivebox-src/app/build.gradle
          grep -q "versionCode 16" /tmp/drivebox-src/app/build.gradle
          grep -q "versionName '1.0.0-rc7'" /tmp/drivebox-src/app/build.gradle
          grep -q "DriveBox 1.0.0 RC7" /tmp/drivebox-src/app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        working-directory: /tmp/drivebox-src
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Verify signature package and exact icon
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/drivebox-src/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/cert.txt
          grep -qi '6699b2b6b15b5e09032b4f54c5c26bbd982a41dc48d5a5093d1501036a474a1e' /tmp/cert.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='ch.clubvwsuisse.drivebox.v1'" /tmp/badging.txt
          grep -q "versionCode='16'" /tmp/badging.txt
          grep -q "application-label:'DriveBox'" /tmp/badging.txt
          unzip -t "$APK"
          unzip -l "$APK" | grep -q 'res/mipmap-xxxhdpi-v4/ic_launcher.webp'
          unzip -l "$APK" | grep -q 'res/drawable-nodpi-v4/drivebox_logo.webp'
          unzip -p "$APK" res/mipmap-xxxhdpi-v4/ic_launcher.webp > /tmp/icon-from-apk.webp
          unzip -p "$APK" res/drawable-nodpi-v4/drivebox_logo.webp > /tmp/logo-from-apk.webp
          test "$(sha256sum /tmp/icon-from-apk.webp | awk '{print $1}')" = 'ab5bbd86c44f537aae43e60584c39c923cee3e7c855ae887332617158c0e8a05'
          test "$(sha256sum /tmp/logo-from-apk.webp | awk '{print $1}')" = 'ab5bbd86c44f537aae43e60584c39c923cee3e7c855ae887332617158c0e8a05'
          cp "$APK" "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC7.apk"
          sha256sum "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC7.apk" > "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC7.apk.sha256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: DriveBox-1.0.0-RC7
          path: |
            DriveBox-1.0.0-RC7.apk
            DriveBox-1.0.0-RC7.apk.sha256.txt
          if-no-files-found: error
          retention-days: 7
