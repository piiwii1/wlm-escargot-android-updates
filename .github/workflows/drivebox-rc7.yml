name: Build DriveBox RC7 APK

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'drivebox-ci/rc7-trigger.txt'
      - 'drivebox-ci/rc7-icon-192.webp.b64'
      - '.github/workflows/drivebox-rc7.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct base
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/drivebox-src
          mkdir -p /tmp/drivebox-src
          cat drivebox-ci/source.part*.b64 | tr -d '\r\n\t ' | base64 -d > /tmp/drivebox-source.zip
          unzip -t /tmp/drivebox-source.zip
          unzip -q /tmp/drivebox-source.zip -d /tmp/drivebox-src
          test -f /tmp/drivebox-src/app/build.gradle
          sed -i 's/@color\/drivebox_icon_bg/@color\/launcher_background/g' /tmp/drivebox-src/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          sed -i 's/@color\/drivebox_icon_bg/@color\/launcher_background/g' /tmp/drivebox-src/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Reuse validated RC2 RC4 RC5 RC6 transformations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          def extract(path, step_name, out):
              text = Path(path).read_text()
              marker = '      - name: ' + step_name + '\n'
              start = text.index(marker)
              run_start = text.index('        run: |\n', start) + len('        run: |\n')
              end = text.find('\n      - name:', run_start)
              if end < 0: end = len(text)
              block = text[run_start:end]
              lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
              Path(out).write_text('\n'.join(lines) + '\n')
          extract('.github/workflows/drivebox-build.yml', 'Apply DriveBox RC2 cleanup', '/tmp/rc2.sh')
          extract('.github/workflows/drivebox-rc4-build.yml', 'Apply RC4 cleanup, exact icon, stable signing', '/tmp/rc4.sh')
          extract('.github/workflows/drivebox-rc4-final.yml', 'Force clean-install identity and RC5 version', '/tmp/rc5.sh')
          extract('.github/workflows/drivebox-rc6.yml', 'Apply RC6 drastic cleanup and robust launcher icon', '/tmp/rc6.sh')
          PY
          bash /tmp/rc2.sh
          bash /tmp/rc4.sh
          bash /tmp/rc5.sh
          bash /tmp/rc6.sh
          keytool -list -keystore /tmp/drivebox-src/drivebox-dev.keystore -storepass DriveBoxDev2026 -alias drivebox | grep -qi drivebox

      - name: Apply RC7 official icon and final cleanup
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          java = Path('/tmp/drivebox-src/app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java')
          s = java.read_text()
          s = s.replace('DriveBox 1.0.0 RC6', 'DriveBox 1.0.0 RC7')
          s = s.replace('Références et outils auto essentiels.', 'L’essentiel automobile, sans remplissage.')
          # Keep the useful jump-start procedure, but no longer expose low-value legacy guides.
          for needle in ['Éclairage', 'Essuie-glaces', 'Désembuage', 'Crevaison', 'Étiquettes carburant', 'Check-list convoi', 'Check-list long trajet', 'Mon véhicule']:
              lines = []
              for line in s.splitlines():
                  if 'x.add(new CatalogItem(' in line and needle in line:
                      continue
                  lines.append(line)
              s = '\n'.join(lines) + '\n'
          java.write_text(s)

          gradle = Path('/tmp/drivebox-src/app/build.gradle')
          g = gradle.read_text()
          g = g.replace('versionCode 15', 'versionCode 16')
          g = g.replace("versionName '1.0.0-rc6'", "versionName '1.0.0-rc7'")
          gradle.write_text(g)
          PY

          # Decode the exact artwork supplied in this conversation, reduced only to Android launcher resolution.
          base64 -d drivebox-ci/rc7-icon-192.webp.b64 > /tmp/drivebox-official.webp
          file /tmp/drivebox-official.webp | grep -qi WebP
          ICON_SHA=$(sha256sum /tmp/drivebox-official.webp | awk '{print $1}')
          test "$ICON_SHA" = 'ab5bbd86c44f537aae43e60584c39c923cee3e7c855ae887332617158c0e8a05'

          RES=/tmp/drivebox-src/app/src/main/res
          # Remove every previous launcher implementation so Android cannot select an obsolete vector/adaptive icon.
          rm -f "$RES/drawable/ic_launcher_foreground.xml" "$RES/drawable/drivebox_logo.xml" "$RES/drawable/ic_launcher_adaptive_foreground.xml"
          rm -rf "$RES/mipmap-anydpi-v26"
          rm -f "$RES/drawable-nodpi/ic_launcher_foreground.png" "$RES/drawable-nodpi/drivebox_logo.png"
          rm -f "$RES/drawable-nodpi/ic_launcher_foreground.webp" "$RES/drawable-nodpi/drivebox_logo.webp"
          mkdir -p "$RES/drawable-nodpi"
          cp /tmp/drivebox-official.webp "$RES/drawable-nodpi/ic_launcher_foreground.webp"
          cp /tmp/drivebox-official.webp "$RES/drawable-nodpi/drivebox_logo.webp"

          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$RES/mipmap-$d"
            rm -f "$RES/mipmap-$d/ic_launcher.png" "$RES/mipmap-$d/ic_launcher_round.png" "$RES/mipmap-$d/ic_launcher.webp" "$RES/mipmap-$d/ic_launcher_round.webp"
            cp /tmp/drivebox-official.webp "$RES/mipmap-$d/ic_launcher.webp"
            cp /tmp/drivebox-official.webp "$RES/mipmap-$d/ic_launcher_round.webp"
          done
          rm -f "$RES/mipmap/ic_launcher.xml"

          grep -q "applicationId 'ch.clubvwsuisse.drivebox.v1'" /tmp/drivebox-src/app/build.gradle
          grep -q "versionCode 16" /tmp/drivebox-src/app/build.gradle
          grep -q "versionName '1.0.0-rc7'" /tmp/drivebox-src/app/build.gradle
          grep -q "DriveBox 1.0.0 RC7" /tmp/drivebox-src/app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        working-directory: /tmp/drivebox-src
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Verify APK signature identity and exact icon
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/drivebox-src/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/cert.txt
          grep -qi '6699b2b6b15b5e09032b4f54c5c26bbd982a41dc48d5a5093d1501036a474a1e' /tmp/cert.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='ch.clubvwsuisse.drivebox.v1'" /tmp/badging.txt
          grep -q "versionCode='16'" /tmp/badging.txt
          grep -q "application-label:'DriveBox'" /tmp/badging.txt
          unzip -t "$APK"
          unzip -l "$APK" | grep -q 'res/mipmap-xxxhdpi-v4/ic_launcher.webp'
          unzip -l "$APK" | grep -q 'res/drawable-nodpi-v4/drivebox_logo.webp'
          unzip -p "$APK" res/mipmap-xxxhdpi-v4/ic_launcher.webp > /tmp/icon-from-apk.webp
          unzip -p "$APK" res/drawable-nodpi-v4/drivebox_logo.webp > /tmp/logo-from-apk.webp
          test "$(sha256sum /tmp/icon-from-apk.webp | awk '{print $1}')" = 'ab5bbd86c44f537aae43e60584c39c923cee3e7c855ae887332617158c0e8a05'
          test "$(sha256sum /tmp/logo-from-apk.webp | awk '{print $1}')" = 'ab5bbd86c44f537aae43e60584c39c923cee3e7c855ae887332617158c0e8a05'
          cp "$APK" "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC7.apk"
          sha256sum "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC7.apk" > "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC7.apk.sha256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: DriveBox-1.0.0-RC7
          path: |
            DriveBox-1.0.0-RC7.apk
            DriveBox-1.0.0-RC7.apk.sha256.txt
          if-no-files-found: error
          retention-days: 7
