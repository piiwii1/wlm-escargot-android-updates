name: Chatou Voice APK Build

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'chatou-voice-build/**'
      - '.github/workflows/chatou-voice-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 35 SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: chatou-voice-build/project
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Package and verify APK
        run: |
          mkdir -p deliverables
          cp chatou-voice-build/project/app/build/outputs/apk/debug/app-debug.apk deliverables/Chatou-Voice-0.1.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 deliverables/Chatou-Voice-0.1.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs deliverables/Chatou-Voice-0.1.0.apk | tee deliverables/APK-VERIFY.txt
          sha256sum deliverables/Chatou-Voice-0.1.0.apk | tee deliverables/SHA256.txt
          cd chatou-voice-build/project && zip -qr ../../deliverables/Chatou-Voice-0.1.0-SOURCES.zip . -x '*/build/*' '.gradle/*'
      - uses: actions/upload-artifact@v4
        with:
          name: Chatou-Voice-0.1.0
          path: deliverables/
          if-no-files-found: error
