name: Android Toolchain Export

on:
  push:
    branches: [ android-toolchain-export-20260831 ]
    paths:
      - '.github/workflows/android-toolchain-export.yml'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Warm isolated AGP cache
        run: |
          set -euo pipefail
          rm -rf /tmp/isolated-gradle /tmp/dummy
          mkdir -p /tmp/isolated-gradle /tmp/dummy/app/src/main/java/test/toolchain
          cat > /tmp/dummy/settings.gradle <<'EOF'
          pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          rootProject.name='ToolchainWarmup'
          include ':app'
          EOF
          cat > /tmp/dummy/build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.7.3' apply false
          }
          EOF
          cat > /tmp/dummy/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'test.toolchain'
            compileSdk 35
            defaultConfig { applicationId 'test.toolchain'; minSdk 26; targetSdk 35; versionCode 1; versionName '1.0' }
            buildTypes { release { minifyEnabled false } }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          EOF
          cat > /tmp/dummy/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="Toolchain"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF
          cat > /tmp/dummy/app/src/main/java/test/toolchain/MainActivity.java <<'EOF'
          package test.toolchain; public class MainActivity extends android.app.Activity { }
          EOF
          GRADLE_USER_HOME=/tmp/isolated-gradle gradle --no-daemon -p /tmp/dummy :app:assembleRelease
          du -sh /tmp/isolated-gradle/caches/modules-2

      - name: Pack minimal toolchain
        run: |
          set -euo pipefail
          GRADLE_BIN="$(readlink -f "$(command -v gradle)")"
          GRADLE_HOME="$(dirname "$(dirname "$GRADLE_BIN")")"
          rm -rf /tmp/toolchain
          mkdir -p /tmp/toolchain/android-sdk /tmp/toolchain/gradle-cache/caches
          cp -a "$GRADLE_HOME" /tmp/toolchain/gradle-8.9
          cp -a "$ANDROID_HOME/platforms/android-35" /tmp/toolchain/android-sdk/
          cp -a "$ANDROID_HOME/build-tools/35.0.0" /tmp/toolchain/android-sdk/
          cp -a /tmp/isolated-gradle/caches/modules-2 /tmp/toolchain/gradle-cache/caches/
          tar -C /tmp -czf android-toolchain-minimal.tar.gz toolchain
          ls -lh android-toolchain-minimal.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: android-toolchain-minimal
          path: android-toolchain-minimal.tar.gz
          retention-days: 1
          if-no-files-found: error
