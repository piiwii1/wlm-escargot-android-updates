name: Build ConvoyRide V1.8.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/convoyride-v18-build.yml'
      - 'convoyride-v18b64/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct verified V1.8 source
        shell: bash
        run: |
          set -euo pipefail
          cat convoyride-v15-source/source-part-* | base64 -d > /tmp/ConvoyRide-V1.5.0-source.zip
          echo '9618adb3c1c52a94af1f4a655f816ea37f4d9ff44d1ab6b465e627abe21a1afc  /tmp/ConvoyRide-V1.5.0-source.zip' | sha256sum -c -
          rm -rf cr18
          mkdir -p cr18
          unzip -q /tmp/ConvoyRide-V1.5.0-source.zip -d cr18
          cat convoyride-v16/patch-part-* | base64 -d | gunzip > /tmp/convoyride-v16.patch
          (cd cr18 && patch -p4 < /tmp/convoyride-v16.patch)
          cat convoyride-v17b64/part-* | base64 -d > /tmp/convoyride-v17.patch.gz
          echo 'af47abf9e1b463ae6905f24b8bb5499e9629c06c5889d9e21c3df704c1ac1e96  /tmp/convoyride-v17.patch.gz' | sha256sum -c -
          gunzip -c /tmp/convoyride-v17.patch.gz > /tmp/convoyride-v17.patch
          echo 'b955c2d54ef718d2bda07239a9247ec66d223b3141b65af797e612ef0797e9e6  /tmp/convoyride-v17.patch' | sha256sum -c -
          (cd cr18 && patch -p1 < /tmp/convoyride-v17.patch)
          cat convoyride-v18b64/part-0* | base64 -d > /tmp/convoyride-v18.patch.gz
          echo 'd4d855095e87d8a2018fa34b903f25256b88cd50fb4b41553f736bcbc3dbf9c8  /tmp/convoyride-v18.patch.gz' | sha256sum -c -
          gunzip -c /tmp/convoyride-v18.patch.gz > /tmp/convoyride-v18.patch
          echo '92bd1cca522482b0fb63472445442382c4b208bbe9870a6ddebad76be0ea1b45  /tmp/convoyride-v18.patch' | sha256sum -c -
          (cd cr18 && patch -p1 < /tmp/convoyride-v18.patch)
          echo '062877d353849eee0d8431906563b4e1126620c304ec12db1b1747f8e59fb618  convoyride-v18b64/speedfix.patch' | sha256sum -c -
          (cd cr18 && patch -p1 < ../convoyride-v18b64/speedfix.patch)
          grep -q "versionName '1.8.0'" cr18/app/build.gradle
          grep -q "versionCode 9" cr18/app/build.gradle
          grep -q 'showAlerts' cr18/app/src/main/java/ch/piiwii/convoyride/MainActivity.java
          grep -q 'bottomNav' cr18/app/src/main/java/ch/piiwii/convoyride/MainActivity.java
          grep -q 'updateSpeedBadge' cr18/app/src/main/java/ch/piiwii/convoyride/MainActivity.java
          grep -q 'PURPLE' cr18/app/src/main/java/ch/piiwii/convoyride/Ui.java

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build release
        run: gradle -p cr18 --no-daemon assembleRelease

      - name: Align and inspect
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 \
            cr18/app/build/outputs/apk/release/app-release-unsigned.apk \
            ConvoyRide-V1.8.0-aligned-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 ConvoyRide-V1.8.0-aligned-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging ConvoyRide-V1.8.0-aligned-unsigned.apk | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: ConvoyRide-V1.8.0-unsigned
          if-no-files-found: error
          retention-days: 7
          path: ConvoyRide-V1.8.0-aligned-unsigned.apk
