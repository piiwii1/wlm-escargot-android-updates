name: Publish verified PiiWii PDF 1.8.2 APK

on:
  push:
    branches: [piiwii-pdf-1.8.2-delivery]
    paths: ['.github/workflows/piiwii-pdf-182-publish.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble and verify APK signed in private build
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,io,pathlib,zipfile
          src=pathlib.Path('piiwii-pdf-182-transfer')
          parts=[(src/f'PART{i:02d}.b64').read_text().strip() for i in range(9)]
          assert all(parts)
          joined=''.join(parts)
          assert len(joined)==4235888, len(joined)
          apk=base64.b64decode(joined,validate=True)
          expected='db90e2a31994dc8888f6057025c3137b65cbb5879e0eb22c69b13b8768767260'
          assert (src/'SHA256.txt').read_text().strip()==expected
          assert hashlib.sha256(apk).hexdigest()==expected
          assert len(apk)==3176915
          with zipfile.ZipFile(io.BytesIO(apk)) as z:
            assert z.testzip() is None
            assert 'classes.dex' in z.namelist()
          target=pathlib.Path('piiwii-pdf-download/PiiWii-PDF-1.8.2.apk')
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_bytes(apk)
          print('Verified SHA-256',expected,'bytes',len(apk))
          PY
      - name: Publish public direct download
        run: |
          set -euo pipefail
          printf 'db90e2a31994dc8888f6057025c3137b65cbb5879e0eb22c69b13b8768767260  piiwii-pdf-download/PiiWii-PDF-1.8.2.apk\n' | sha256sum -c -
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add piiwii-pdf-download/PiiWii-PDF-1.8.2.apk
          git diff --cached --quiet && exit 0
          git commit -m 'Publish verified signed PiiWii PDF 1.8.2 APK'
          git push origin HEAD:piiwii-pdf-1.8.2-delivery
