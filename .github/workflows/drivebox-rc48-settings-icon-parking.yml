name: Build DriveBox RC48 Settings Icon Parking

on:
  push:
    branches: [ drivebox-rc48-settings-icon-parking ]
    paths:
      - '.github/workflows/drivebox-rc48-settings-icon-parking.yml'
      - 'drivebox-ci/rc48.patch.gz.b64'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore validated RC47 source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9657212219/zip" -o /tmp/rc47-artifact.zip
          rm -rf /tmp/rc47-artifact /tmp/drivebox-src
          mkdir -p /tmp/rc47-artifact /tmp/drivebox-src
          unzip -oq /tmp/rc47-artifact.zip -d /tmp/rc47-artifact
          test "$(sha256sum /tmp/rc47-artifact/DriveBox-1.0.0-RC47-source.zip | awk '{print $1}')" = '459d8132b5261d95cfcb86b7900d57cb68082c750030265d0ebe1ff1ae40c4d9'
          unzip -oq /tmp/rc47-artifact/DriveBox-1.0.0-RC47-source.zip -d /tmp/drivebox-src
          grep -q 'versionCode 56' /tmp/drivebox-src/app/build.gradle
          grep -q "versionName '1.0.0-rc47'" /tmp/drivebox-src/app/build.gradle

      - name: Verify and apply RC48 patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum drivebox-ci/rc48.patch.gz.b64 | awk '{print $1}')" = 'b0a849a4008a9b16d2faf4d073a0f5bfdbb12c976f4c2647ff602893e1da9942'
          base64 -d drivebox-ci/rc48.patch.gz.b64 > /tmp/rc48.patch.gz
          test "$(sha256sum /tmp/rc48.patch.gz | awk '{print $1}')" = 'b068311898428ef8cef1baaf71c4aa1a29858b399546ff71b6f76bad153a5013'
          gzip -d -c /tmp/rc48.patch.gz > /tmp/rc48.patch
          test "$(sha256sum /tmp/rc48.patch | awk '{print $1}')" = '87953e828f06d158cf430cf4275e13eccd7d46d0b842674b0bc47042ce04996a'
          cd /tmp/drivebox-src
          patch -p1 < /tmp/rc48.patch
          grep -q 'versionCode 57' app/build.gradle
          grep -q "versionName '1.0.0-rc48'" app/build.gradle
          grep -q 'TextView settings = pill("⚙", MUTED, PANEL_2);' app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java
          grep -q 'page(PARKING_ICON, "Stationnement", "", () -> showHome(false), null)' app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java
          grep -q 'if ("Stationnement".equals(title))' app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java
          if grep -q '⚙  Paramètres' app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java; then echo 'Settings text still present'; exit 1; fi
          test -f CONTINUITE-RC48.md
          if grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml; then echo 'Unexpected INTERNET permission'; exit 1; fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests and compile RC48
        working-directory: /tmp/drivebox-src
        run: gradle --no-daemon clean :app:testDebugUnitTest :app:assembleDebug

      - name: Verify and package RC48
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/drivebox-src/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/cert.txt
          grep -qi '6699b2b6b15b5e09032b4f54c5c26bbd982a41dc48d5a5093d1501036a474a1e' /tmp/cert.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='ch.clubvwsuisse.drivebox.v1'" /tmp/badging.txt
          grep -q "versionCode='57'" /tmp/badging.txt
          grep -q "versionName='1.0.0-rc48'" /tmp/badging.txt
          grep -q "application-label:'DriveBox'" /tmp/badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | tee /tmp/perms.txt
          grep -q 'android.permission.ACCESS_FINE_LOCATION' /tmp/perms.txt
          grep -q 'android.permission.ACCESS_BACKGROUND_LOCATION' /tmp/perms.txt
          grep -q 'android.permission.FOREGROUND_SERVICE_LOCATION' /tmp/perms.txt
          grep -q 'android.permission.POST_NOTIFICATIONS' /tmp/perms.txt
          if grep -q 'android.permission.INTERNET' /tmp/perms.txt; then exit 1; fi
          unzip -t "$APK"
          unzip -p "$APK" res/mipmap-xxxhdpi-v4/ic_launcher.webp > /tmp/icon.webp
          test "$(sha256sum /tmp/icon.webp | awk '{print $1}')" = 'ab5bbd86c44f537aae43e60584c39c923cee3e7c855ae887332617158c0e8a05'
          cp "$APK" "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC48.apk"
          rm -rf /tmp/drivebox-src/app/build /tmp/drivebox-src/.gradle
          (cd /tmp/drivebox-src && zip -qr "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC48-source.zip" .)
          sha256sum "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC48.apk" > "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC48.apk.sha256.txt"
          sha256sum "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC48-source.zip" > "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC48-source.zip.sha256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: DriveBox-1.0.0-RC48-SETTINGS-ICON-PARKING
          path: |
            DriveBox-1.0.0-RC48.apk
            DriveBox-1.0.0-RC48.apk.sha256.txt
            DriveBox-1.0.0-RC48-source.zip
            DriveBox-1.0.0-RC48-source.zip.sha256.txt
          if-no-files-found: error
          retention-days: 7
