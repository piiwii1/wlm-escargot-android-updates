name: Build DriveBox RC32 Stability Hardening

on:
  push:
    branches: [ drivebox-rc32-stability-hardening ]
    paths:
      - '.github/workflows/drivebox-rc32-stability-hardening.yml'
      - 'drivebox-ci/rc32-stability-hardening.patch.gz.b64'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore validated RC31 source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9628594992/zip" \
            -o /tmp/rc31-artifact.zip
          rm -rf /tmp/rc31-artifact /tmp/drivebox-src
          mkdir -p /tmp/rc31-artifact /tmp/drivebox-src
          unzip -oq /tmp/rc31-artifact.zip -d /tmp/rc31-artifact
          unzip -oq /tmp/rc31-artifact/DriveBox-1.0.0-RC31-source.zip -d /tmp/drivebox-src
          grep -q 'versionCode 40' /tmp/drivebox-src/app/build.gradle
          grep -q "versionName '1.0.0-rc31'" /tmp/drivebox-src/app/build.gradle

      - name: Apply RC32 stability hardening
        shell: bash
        run: |
          set -euo pipefail
          base64 -d drivebox-ci/rc32-stability-hardening.patch.gz.b64 | gzip -d > /tmp/rc32.patch
          test "$(sha256sum /tmp/rc32.patch | awk '{print $1}')" = 'cd7b14e4056f762fbe5b4a11d2b6ff75b6259765692e7c06622eb7c589cea56b'
          cd /tmp/drivebox-src
          patch -p1 < /tmp/rc32.patch
          grep -q 'versionCode 41' app/build.gradle
          grep -q "versionName '1.0.0-rc32'" app/build.gradle
          test -s app/src/main/java/ch/clubvwsuisse/drivebox/DriveBoxPrefs.java
          grep -q 'DriveBoxPrefs.sanitized(this)' app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java
          grep -q 'onNewIntent' app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java
          grep -q 'recoverToHome' app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java
          grep -q 'DriveBoxPrefs.sanitized(context)' app/src/main/java/ch/clubvwsuisse/drivebox/ParkingAlarmReceiver.java
          grep -q 'DriveBoxPrefs.sanitized(context)' app/src/main/java/ch/clubvwsuisse/drivebox/FreeParkingAlarmReceiver.java
          grep -q 'DriveBoxPrefs.sanitized(this)' app/src/main/java/ch/clubvwsuisse/drivebox/ParkingExpiryAlarmService.java
          grep -q 'handler.removeCallbacksAndMessages(null)' app/src/main/java/ch/clubvwsuisse/drivebox/TwintQrScannerActivity.java

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build RC32
        working-directory: /tmp/drivebox-src
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Verify and package RC32
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/drivebox-src/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/cert.txt
          grep -qi '6699b2b6b15b5e09032b4f54c5c26bbd982a41dc48d5a5093d1501036a474a1e' /tmp/cert.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='ch.clubvwsuisse.drivebox.v1'" /tmp/badging.txt
          grep -q "versionCode='41'" /tmp/badging.txt
          grep -q "versionName='1.0.0-rc32'" /tmp/badging.txt
          grep -q "application-label:'DriveBox'" /tmp/badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | tee /tmp/perms.txt
          grep -q 'android.permission.CAMERA' /tmp/perms.txt
          grep -q 'android.permission.ACCESS_COARSE_LOCATION' /tmp/perms.txt
          grep -q 'android.permission.ACCESS_FINE_LOCATION' /tmp/perms.txt
          grep -q 'android.permission.POST_NOTIFICATIONS' /tmp/perms.txt
          grep -q 'android.permission.SCHEDULE_EXACT_ALARM' /tmp/perms.txt
          grep -q 'android.permission.FOREGROUND_SERVICE' /tmp/perms.txt
          grep -q 'android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK' /tmp/perms.txt
          grep -q 'android.permission.VIBRATE' /tmp/perms.txt
          if grep -q 'android.permission.INTERNET' /tmp/perms.txt; then echo 'Unexpected INTERNET permission'; exit 1; fi
          if grep -q 'android.permission.ACCESS_BACKGROUND_LOCATION' /tmp/perms.txt; then echo 'Unexpected background location permission'; exit 1; fi
          unzip -t "$APK"
          unzip -p "$APK" res/mipmap-xxxhdpi-v4/ic_launcher.webp > /tmp/icon.webp
          test "$(sha256sum /tmp/icon.webp | awk '{print $1}')" = 'ab5bbd86c44f537aae43e60584c39c923cee3e7c855ae887332617158c0e8a05'
          cp "$APK" "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC32.apk"
          rm -rf /tmp/drivebox-src/app/build /tmp/drivebox-src/.gradle
          (cd /tmp/drivebox-src && zip -qr "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC32-source.zip" .)
          sha256sum "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC32.apk" > "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC32.apk.sha256.txt"
          sha256sum "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC32-source.zip" > "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC32-source.zip.sha256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: DriveBox-1.0.0-RC32-STABILITY-HARDENING
          path: |
            DriveBox-1.0.0-RC32.apk
            DriveBox-1.0.0-RC32.apk.sha256.txt
            DriveBox-1.0.0-RC32-source.zip
            DriveBox-1.0.0-RC32-source.zip.sha256.txt
          if-no-files-found: error
          retention-days: 7
