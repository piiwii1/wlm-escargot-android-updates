name: Build DriveBox RC36 Direct TWINT

on:
  push:
    branches: [ drivebox-rc36-direct-twint ]
    paths:
      - '.github/workflows/drivebox-rc36-direct-twint.yml'
      - 'drivebox-ci/rc36-direct-twint.p1.b64'
      - 'drivebox-ci/rc36-direct-twint.p2.b64'
      - 'drivebox-ci/rc36-direct-twint.p3.b64'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore validated RC35 source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9629818372/zip" \
            -o /tmp/rc35-artifact.zip
          rm -rf /tmp/rc35-artifact /tmp/drivebox-src
          mkdir -p /tmp/rc35-artifact /tmp/drivebox-src
          unzip -oq /tmp/rc35-artifact.zip -d /tmp/rc35-artifact
          unzip -oq /tmp/rc35-artifact/DriveBox-1.0.0-RC35-source.zip -d /tmp/drivebox-src
          grep -q 'versionCode 44' /tmp/drivebox-src/app/build.gradle
          grep -q "versionName '1.0.0-rc35'" /tmp/drivebox-src/app/build.gradle

      - name: Apply RC36 direct TWINT experiment
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum drivebox-ci/rc36-direct-twint.p1.b64 | awk '{print $1}')" = '5646bdf2f9fc8fbab1eb56c5a47a6aab0843ac4673c3d8524b74953be86a62a5'
          test "$(sha256sum drivebox-ci/rc36-direct-twint.p2.b64 | awk '{print $1}')" = '6dc74c7dede59c4b8e4f2a7db84ee0b1b35e1376cfb5d497c7642a301e8d0f42'
          test "$(sha256sum drivebox-ci/rc36-direct-twint.p3.b64 | awk '{print $1}')" = '16d29ff2cd9a6a2fcc3db218e0eafe1c18e4d676268c4317094ffd02768a7e1e'
          cat drivebox-ci/rc36-direct-twint.p1.b64 drivebox-ci/rc36-direct-twint.p2.b64 drivebox-ci/rc36-direct-twint.p3.b64 | base64 -d | gzip -d > /tmp/rc36.patch
          test "$(sha256sum /tmp/rc36.patch | awk '{print $1}')" = '719593e01cbc199dbedce3e136ef67af54697c11f8d0881e4ecefbb46dc4dcd5'
          cd /tmp/drivebox-src
          patch -p1 < /tmp/rc36.patch
          grep -q 'versionCode 45' app/build.gradle
          grep -q "versionName '1.0.0-rc36'" app/build.gradle
          grep -q 'openDirectTwintPayment' app/src/main/java/ch/clubvwsuisse/drivebox/TwintParkingDetailActivity.java
          grep -q 'preferred_strategy' app/src/main/java/ch/clubvwsuisse/drivebox/TwintParkingDetailActivity.java
          grep -q 'qrCode' app/src/main/java/ch/clubvwsuisse/drivebox/TwintParkingDetailActivity.java
          grep -q 'scanResult' app/src/main/java/ch/clubvwsuisse/drivebox/TwintParkingDetailActivity.java
          if grep -qi 'parkingpay' app/src/main/java/ch/clubvwsuisse/drivebox/TwintParkingDetailActivity.java; then echo 'ParkingPay route still present'; exit 1; fi
          if grep -q 'S.code=' app/src/main/java/ch/clubvwsuisse/drivebox/TwintParkingDetailActivity.java; then echo 'Fabricated TWINT code still present'; exit 1; fi
          if grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml; then echo 'Unexpected INTERNET permission'; exit 1; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build RC36
        working-directory: /tmp/drivebox-src
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Verify and package RC36
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/drivebox-src/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/cert.txt
          grep -qi '6699b2b6b15b5e09032b4f54c5c26bbd982a41dc48d5a5093d1501036a474a1e' /tmp/cert.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='ch.clubvwsuisse.drivebox.v1'" /tmp/badging.txt
          grep -q "versionCode='45'" /tmp/badging.txt
          grep -q "versionName='1.0.0-rc36'" /tmp/badging.txt
          grep -q "application-label:'DriveBox'" /tmp/badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | tee /tmp/perms.txt
          grep -q 'android.permission.CAMERA' /tmp/perms.txt
          grep -q 'android.permission.ACCESS_COARSE_LOCATION' /tmp/perms.txt
          grep -q 'android.permission.ACCESS_FINE_LOCATION' /tmp/perms.txt
          grep -q 'android.permission.POST_NOTIFICATIONS' /tmp/perms.txt
          if grep -q 'android.permission.INTERNET' /tmp/perms.txt; then echo 'Unexpected INTERNET permission'; exit 1; fi
          unzip -t "$APK"
          unzip -p "$APK" res/mipmap-xxxhdpi-v4/ic_launcher.webp > /tmp/icon.webp
          test "$(sha256sum /tmp/icon.webp | awk '{print $1}')" = 'ab5bbd86c44f537aae43e60584c39c923cee3e7c855ae887332617158c0e8a05'
          cp "$APK" "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC36.apk"
          rm -rf /tmp/drivebox-src/app/build /tmp/drivebox-src/.gradle
          (cd /tmp/drivebox-src && zip -qr "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC36-source.zip" .)
          sha256sum "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC36.apk" > "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC36.apk.sha256.txt"
          sha256sum "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC36-source.zip" > "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC36-source.zip.sha256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: DriveBox-1.0.0-RC36-DIRECT-TWINT
          path: |
            DriveBox-1.0.0-RC36.apk
            DriveBox-1.0.0-RC36.apk.sha256.txt
            DriveBox-1.0.0-RC36-source.zip
            DriveBox-1.0.0-RC36-source.zip.sha256.txt
          if-no-files-found: error
          retention-days: 7
