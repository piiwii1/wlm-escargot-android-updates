name: Rabais Express 1.6.3 Real Icons Build

on:
  push:
    branches: [ rabais-express-build ]
    paths:
      - '.github/workflows/rabais-express-163.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      SDKMANAGER: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct verified 1.6.2 and integrate real vector icons
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          p=Path('.github/workflows/rabais-express-162-fix.yml')
          s=p.read_text()
          marker='      - name: Reconstruct and fix verified 1.6.2 source\n        run: |\n'
          start=s.index(marker)+len(marker)
          end=s.index('\n      - name: Setup Java 17', start)
          block=textwrap.dedent(s[start:end])
          Path('/tmp/reconstruct162.sh').write_text('set -euo pipefail\n'+block+'\n')
          PY
          bash /tmp/reconstruct162.sh

          python3 - <<'PY'
          from pathlib import Path

          java=Path('rabais-express/app/src/main/java/ch/piiwii/rabais/MainActivity.java')
          s=java.read_text()
          old='''    private void styleNavIcon(TextView item, int type, boolean selected) {\n        int color = item.getCurrentTextColor();\n        NavIconDrawable icon = new NavIconDrawable(type, color, selected, currentSkin);\n        int size = Math.round(dp(25));\n        icon.setBounds(0, 0, size, size);\n        item.setCompoundDrawables(null, icon, null, null);\n        item.setCompoundDrawablePadding(Math.round(dp(2)));\n    }\n'''
          new='''    private void styleNavIcon(TextView item, int type, boolean selected) {\n        int color = item.getCurrentTextColor();\n        Drawable icon = getDrawable(navIconRes(type)).mutate();\n        icon.setTint(color);\n        int size = Math.round(dp(selected ? 27 : 25));\n        icon.setBounds(0, 0, size, size);\n        item.setCompoundDrawables(null, icon, null, null);\n        item.setCompoundDrawablePadding(Math.round(dp(2)));\n    }\n\n    private int navIconRes(int type) {\n        if (type == NavIconDrawable.TYPE_GLOBE) return R.drawable.nav_devises;\n        if (type == NavIconDrawable.TYPE_CALCULATOR) return R.drawable.nav_calculatrice;\n        if (type == NavIconDrawable.TYPE_SETTINGS) return R.drawable.nav_parametres;\n        return R.drawable.nav_rabais;\n    }\n'''
          if old not in s:
              raise SystemExit('Expected old procedural navigation icon block not found')
          s=s.replace(old,new,1)
          start=s.index('    private static class NavIconDrawable extends Drawable {')
          end=s.index('\n    private static class RivetedPanelDrawable extends Drawable {', start)
          constants='''    private static final class NavIconDrawable {\n        static final int TYPE_TAG=0, TYPE_GLOBE=1, TYPE_CALCULATOR=2, TYPE_SETTINGS=3;\n        private NavIconDrawable() {}\n    }\n'''
          s=s[:start]+constants+s[end:]
          java.write_text(s)

          gradle=Path('rabais-express/app/build.gradle')
          g=gradle.read_text()
          g=g.replace('versionCode 14','versionCode 15').replace("versionName '1.6.2'","versionName '1.6.3'")
          gradle.write_text(g)

          d=Path('rabais-express/app/src/main/res/drawable')
          icons={
          'nav_rabais.xml':'''<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">\n    <path android:fillColor="#FF000000" android:pathData="M21.41,11.58L12.42,2.59A2,2 0,0 0,11,2H4A2,2 0,0 0,2 4v7c0,0.55 0.22,1.05 0.59,1.41l9,9a2,2 0,0 0,2.82 0l7,-7a2,2 0,0 0,0 -2.83zM5.5,7A1.5,1.5 0,1 1,5.5 4a1.5,1.5 0,0 1,0 3z"/>\n    <path android:fillColor="#FF000000" android:pathData="M11.1,8.4a1.35,1.35 0,1 0,0 2.7a1.35,1.35 0,0 0,0 -2.7zM15.8,13.1a1.35,1.35 0,1 0,0 2.7a1.35,1.35 0,0 0,0 -2.7zM10.4,15.9L16.5,9.8l1.1,1.1l-6.1,6.1z"/>\n</vector>\n''',
          'nav_devises.xml':'''<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">\n    <path android:fillColor="#FF000000" android:pathData="M7,7h10.17l-1.58,-1.59L17,4l4,4l-4,4l-1.41,-1.41L17.17,9H7V7zM17,17H6.83l1.58,1.59L7,20l-4,-4l4,-4l1.41,1.41L6.83,15H17v2z"/>\n    <path android:fillColor="#FF000000" android:pathData="M12,2a10,10 0,0 0,0 20a10,10 0,0 0,0 -20zM5.1,10h2.1c-0.12,0.65 -0.2,1.31 -0.2,2s0.08,1.35 0.2,2H5.1A8,8 0,0 1,5.1 10zM12,4c1.05,1.28 1.8,2.68 2.2,4H9.8c0.4,-1.32 1.15,-2.72 2.2,-4zM9.35,10h5.3c0.14,0.65 0.22,1.32 0.22,2s-0.08,1.35 -0.22,2h-5.3A9.3,9.3 0,0 1,9.35 10zM9.8,16h4.4c-0.4,1.32 -1.15,2.72 -2.2,4c-1.05,-1.28 -1.8,-2.68 -2.2,-4zM16.8,10h2.1a8,8 0,0 1,0 4h-2.1c0.12,-0.65 0.2,-1.31 0.2,-2s-0.08,-1.35 -0.2,-2z"/>\n</vector>\n''',
          'nav_calculatrice.xml':'''<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">\n    <path android:fillColor="#FF000000" android:pathData="M19,3H5a2,2 0,0 0,-2 2v14a2,2 0,0 0,2 2h14a2,2 0,0 0,2 -2V5a2,2 0,0 0,-2 -2zM6,6h12v3H6V6zM6,12h2v2H6v-2zM10,12h2v2h-2v-2zM14,12h4v2h-4v-2zM6,16h2v2H6v-2zM10,16h2v2h-2v-2zM14,16h4v2h-4v-2z"/>\n</vector>\n''',
          'nav_parametres.xml':'''<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">\n    <path android:fillColor="#FF000000" android:pathData="M19.43,12.98c0.04,-0.32 0.07,-0.65 0.07,-0.98s-0.03,-0.66 -0.07,-0.98l2.11,-1.65a0.5,0.5 0,0 0,0.12 -0.64l-2,-3.46a0.5,0.5 0,0 0,-0.61 -0.22l-2.49,1a7.3,7.3 0,0 0,-1.69 -0.98L14.5,2.42A0.5,0.5 0,0 0,14 2h-4a0.5,0.5 0,0 0,-0.49 0.42L9.13,5.07a7.3,7.3 0,0 0,-1.69 0.98l-2.49,-1a0.5,0.5 0,0 0,-0.61 0.22l-2,3.46a0.5,0.5 0,0 0,0.12 0.64l2.11,1.65c-0.04,0.32 -0.07,0.66 -0.07,0.98s0.03,0.66 0.07,0.98l-2.11,1.65a0.5,0.5 0,0 0,-0.12 0.64l2,3.46a0.5,0.5 0,0 0,0.61 0.22l2.49,-1c0.52,0.4 1.09,0.73 1.69,0.98l0.38,2.65A0.5,0.5 0,0 0,10 22h4a0.5,0.5 0,0 0,0.49 -0.42l0.38,-2.65c0.6,-0.25 1.17,-0.58 1.69,-0.98l2.49,1a0.5,0.5 0,0 0,0.61 -0.22l2,-3.46a0.5,0.5 0,0 0,-0.12 -0.64l-2.11,-1.65zM12,15.5A3.5,3.5 0,1 1,12 8a3.5,3.5 0,0 1,0 7.5z"/>\n</vector>\n'''
          }
          for name, content in icons.items():
              (d/name).write_text(content)
          PY

          grep -q "applicationId 'ch.piiwii.rabaisexpress'" rabais-express/app/build.gradle
          grep -q "versionCode 15" rabais-express/app/build.gradle
          grep -q "versionName '1.6.3'" rabais-express/app/build.gradle
          grep -q 'getDrawable(navIconRes(type))' rabais-express/app/src/main/java/ch/piiwii/rabais/MainActivity.java
          ! grep -q 'new NavIconDrawable' rabais-express/app/src/main/java/ch/piiwii/rabais/MainActivity.java
          test -f rabais-express/app/src/main/res/drawable/nav_rabais.xml
          test -f rabais-express/app/src/main/res/drawable/nav_devises.xml
          test -f rabais-express/app/src/main/res/drawable/nav_calculatrice.xml
          test -f rabais-express/app/src/main/res/drawable/nav_parametres.xml
          ! grep -q 'ScrollView' rabais-express/app/src/main/res/layout/activity_main.xml

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned release APK
        working-directory: rabais-express
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Prepare delivery
        run: |
          mkdir -p delivery/signing-tools/lib delivery/source
          APK='rabais-express/app/build/outputs/apk/release/app-release-unsigned.apk'
          cp "$APK" delivery/Rabais-Express-1.6.3-UNSIGNED.apk
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" delivery/signing-tools/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/lib/apksigner.jar" delivery/signing-tools/lib/apksigner.jar
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2" delivery/signing-tools/aapt2
          chmod +x delivery/signing-tools/* || true
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2" dump badging "$APK" > delivery/BADGING.txt
          (cd rabais-express && zip -qr ../delivery/Rabais-Express-1.6.3-SOURCES.zip .)
          sha256sum delivery/Rabais-Express-1.6.3-UNSIGNED.apk delivery/Rabais-Express-1.6.3-SOURCES.zip > delivery/SHA256-UNSIGNED.txt

      - name: Upload APK source and signing tools
        uses: actions/upload-artifact@v4
        with:
          name: Rabais-Express-1.6.3-UNSIGNED-TOOLS
          path: delivery/*
          retention-days: 7
          if-no-files-found: error
