name: Build DriveBox RC3 APK

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'drivebox-ci/rc3-trigger.txt'
      - 'drivebox-ci/rc3-icon-192.b64'
      - '.github/workflows/drivebox-rc3-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct DriveBox base source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/drivebox-src
          mkdir -p /tmp/drivebox-src
          cat drivebox-ci/source.part*.b64 | tr -d '\r\n\t ' | base64 -d > /tmp/drivebox-source.zip
          unzip -t /tmp/drivebox-source.zip
          unzip -q /tmp/drivebox-source.zip -d /tmp/drivebox-src
          test -f /tmp/drivebox-src/app/build.gradle
          sed -i 's/@color\/drivebox_icon_bg/@color\/launcher_background/g' /tmp/drivebox-src/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          sed -i 's/@color\/drivebox_icon_bg/@color\/launcher_background/g' /tmp/drivebox-src/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Reuse verified RC2 cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/drivebox-build.yml')
          text = p.read_text()
          marker = '      - name: Apply DriveBox RC2 cleanup\n'
          start = text.index(marker)
          run_marker = '        run: |\n'
          run_start = text.index(run_marker, start) + len(run_marker)
          end = text.find('\n      - name:', run_start)
          if end < 0:
              end = len(text)
          block = text[run_start:end]
          lines = []
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/rc2-step.sh').write_text('\n'.join(lines) + '\n')
          PY
          bash /tmp/rc2-step.sh

      - name: Apply RC3 cleanup and official icon
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          java = Path('/tmp/drivebox-src/app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java')
          s = java.read_text()
          s = s.replace('Les infos et outils auto utiles, sans blabla.', 'Les infos et outils auto utiles, sans superflu.')
          s = s.replace('Contrôles du quotidien', 'Mécanique & sécurité')
          s = s.replace('Des contrôles simples, expliqués sans jargon.', "L'essentiel utile, sans évidences.")
          s = s.replace('        x.add(new CatalogItem("💡", "Éclairage", "Contrôle rapide avant de partir", "phares feux stop clignotant eclairage ampoule", this::lightingGuide));\n', '')
          s = s.replace('        x.add(new CatalogItem("💧", "Essuie-glaces & lave-glace", "Visibilité, balais et liquide", "essuie glace essuie-glace lave glace visibilite balais pare brise", this::wipersGuide));\n', '')
          s = s.replace('              root.addView(wideCard("💡", "Éclairage", "Vérifier les feux principaux", ORANGE, this::lightingGuide));\n', '')
          s = s.replace('              root.addView(wideCard("💧", "Essuie-glaces", "Visibilité et lave-glace", BLUE, this::wipersGuide));\n', '')
          s = s.replace('Éclairage contrôlé (phares, clignotants)', 'Autonomie / assistance / itinéraire vérifiés')
          s = s.replace('Éclairage et essuie-glaces testés', 'État général et anomalies connues vérifiés')
          s = s.replace('DriveBox 1.0.0 RC2', 'DriveBox 1.0.0 RC3')
          java.write_text(s)

          gradle = Path('/tmp/drivebox-src/app/build.gradle')
          g = gradle.read_text().replace('versionCode 11', 'versionCode 12').replace("versionName '1.0.0-rc2'", "versionName '1.0.0-rc3'")
          gradle.write_text(g)
          PY

          mkdir -p /tmp/drivebox-src/app/src/main/res/drawable-nodpi
          base64 -d drivebox-ci/rc3-icon-192.b64 > /tmp/drivebox-official.png
          rm -f /tmp/drivebox-src/app/src/main/res/drawable/ic_launcher_foreground.xml
          rm -f /tmp/drivebox-src/app/src/main/res/drawable/drivebox_logo.xml
          cp /tmp/drivebox-official.png /tmp/drivebox-src/app/src/main/res/drawable-nodpi/ic_launcher_foreground.png
          cp /tmp/drivebox-official.png /tmp/drivebox-src/app/src/main/res/drawable-nodpi/drivebox_logo.png

          for spec in 'mipmap-mdpi 48' 'mipmap-hdpi 72' 'mipmap-xhdpi 96' 'mipmap-xxhdpi 144' 'mipmap-xxxhdpi 192'; do
            set -- $spec
            folder=$1
            size=$2
            mkdir -p /tmp/drivebox-src/app/src/main/res/$folder
            convert /tmp/drivebox-official.png -resize ${size}x${size} /tmp/drivebox-src/app/src/main/res/$folder/ic_launcher.png
          done

          cat > /tmp/drivebox-src/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@android:color/transparent" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF
          cp /tmp/drivebox-src/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml /tmp/drivebox-src/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          grep -q "versionCode 12" /tmp/drivebox-src/app/build.gradle
          grep -q "versionName '1.0.0-rc3'" /tmp/drivebox-src/app/build.gradle
          grep -q "DriveBox 1.0.0 RC3" /tmp/drivebox-src/app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java
          ! grep -q 'new CatalogItem("💡", "Éclairage"' /tmp/drivebox-src/app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: /tmp/drivebox-src
        shell: bash
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify and stage APK
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/drivebox-src/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC3-debug.apk"
          sha256sum "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC3-debug.apk" > "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC3-debug.apk.sha256.txt"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DriveBox-1.0.0-RC3-APK
          path: |
            DriveBox-1.0.0-RC3-debug.apk
            DriveBox-1.0.0-RC3-debug.apk.sha256.txt
          if-no-files-found: error
          retention-days: 7
