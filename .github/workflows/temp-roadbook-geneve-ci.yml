name: Temp Roadbook Geneve CI

on:
  push:
    branches: [ temp-roadbook-geneve-ci-20260829 ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: roadbook-geneve
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify APK
        run: |
          cp roadbook-geneve/app/build/outputs/apk/debug/app-debug.apk Roadbook-Geneve-2026-08-29-v1.0.0.apk
          test -s Roadbook-Geneve-2026-08-29-v1.0.0.apk
          unzip -t Roadbook-Geneve-2026-08-29-v1.0.0.apk >/dev/null
          sha256sum Roadbook-Geneve-2026-08-29-v1.0.0.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Roadbook-Geneve-2026-08-29-v1.0.0
          path: Roadbook-Geneve-2026-08-29-v1.0.0.apk
          retention-days: 7
          if-no-files-found: error
