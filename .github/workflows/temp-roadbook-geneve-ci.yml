name: Temp Roadbook Geneve CI v1.1.1

on:
  push:
    branches: [ temp-roadbook-geneve-ci-v110 ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore and verify stable signing key
        run: |
          base64 -d roadbook-geneve/signing/roadbook-release.jks.b64 > roadbook-geneve/signing/roadbook-release.jks
          test "$(stat -c%s roadbook-geneve/signing/roadbook-release.jks)" -eq 3075
          keytool -list -storetype JKS -keystore roadbook-geneve/signing/roadbook-release.jks -storepass 'Roadbook2026!' -alias roadbook
      - name: Build debug APK
        working-directory: roadbook-geneve
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify APK
        run: |
          cp roadbook-geneve/app/build/outputs/apk/debug/app-debug.apk Roadbook-Geneve-2026-08-29-v1.1.1.apk
          test -s Roadbook-Geneve-2026-08-29-v1.1.1.apk
          unzip -t Roadbook-Geneve-2026-08-29-v1.1.1.apk >/dev/null
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose Roadbook-Geneve-2026-08-29-v1.1.1.apk
          sha256sum Roadbook-Geneve-2026-08-29-v1.1.1.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Roadbook-Geneve-2026-08-29-v1.1.1
          path: Roadbook-Geneve-2026-08-29-v1.1.1.apk
          retention-days: 7
          if-no-files-found: error
