name: Temp Roadbook Geneve unsigned release

on:
  push:
    branches: [ temp-roadbook-geneve-ci-v110 ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build unsigned release APK
        working-directory: roadbook-geneve
        run: gradle --no-daemon --stacktrace assembleRelease
      - name: Verify unsigned APK
        run: |
          cp roadbook-geneve/app/build/outputs/apk/release/app-release-unsigned.apk Roadbook-Geneve-2026-08-29-v1.1.1-unsigned.apk
          test -s Roadbook-Geneve-2026-08-29-v1.1.1-unsigned.apk
          unzip -t Roadbook-Geneve-2026-08-29-v1.1.1-unsigned.apk >/dev/null
          sha256sum Roadbook-Geneve-2026-08-29-v1.1.1-unsigned.apk
      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: Roadbook-Geneve-2026-08-29-v1.1.1-unsigned
          path: Roadbook-Geneve-2026-08-29-v1.1.1-unsigned.apk
          retention-days: 7
          if-no-files-found: error
