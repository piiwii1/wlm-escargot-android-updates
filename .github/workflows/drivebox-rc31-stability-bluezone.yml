name: Build DriveBox RC31 Stability BlueZone

on:
  push:
    branches: [ drivebox-rc31-stability-bluezone ]
    paths:
      - '.github/workflows/drivebox-rc31-stability-bluezone.yml'
      - 'drivebox-ci/rc31-stability-bluezone.patch.gz.b64'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Restore validated RC30 source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9626855025/zip" -o /tmp/rc30-artifact.zip
          rm -rf /tmp/rc30-artifact /tmp/drivebox-src
          mkdir -p /tmp/rc30-artifact /tmp/drivebox-src
          unzip -oq /tmp/rc30-artifact.zip -d /tmp/rc30-artifact
          unzip -oq /tmp/rc30-artifact/DriveBox-1.0.0-RC30-source.zip -d /tmp/drivebox-src
          grep -q 'versionCode 39' /tmp/drivebox-src/app/build.gradle
          grep -q "versionName '1.0.0-rc30'" /tmp/drivebox-src/app/build.gradle

      - name: Apply RC31 patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d drivebox-ci/rc31-stability-bluezone.patch.gz.b64 | gzip -d > /tmp/rc31.patch
          test "$(sha256sum /tmp/rc31.patch | awk '{print $1}')" = 'bca643187bf6aeaec1bda90c2f9a1b8fea44239698a1e0e27c5d60acd8169ad8'
          cd /tmp/drivebox-src
          patch -p1 < /tmp/rc31.patch
          grep -q 'versionCode 40' app/build.gradle
          grep -q "versionName '1.0.0-rc31'" app/build.gradle
          grep -q 'Gratuit • zone bleue' app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java
          grep -q 'parkingScreenVisible' app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java
          grep -q 'stopParkingTicker' app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java
          grep -q '10 minutes' app/src/main/java/ch/clubvwsuisse/drivebox/ParkingAlarmReceiver.java
          grep -q 'setLooping(true)' app/src/main/java/ch/clubvwsuisse/drivebox/ParkingExpiryAlarmService.java
          if grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml; then echo 'Unexpected INTERNET permission'; exit 1; fi
          if grep -q 'android.permission.ACCESS_BACKGROUND_LOCATION' app/src/main/AndroidManifest.xml; then echo 'Unexpected background location permission'; exit 1; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build RC31
        working-directory: /tmp/drivebox-src
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Verify and package RC31
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/drivebox-src/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/cert.txt
          grep -qi '6699b2b6b15b5e09032b4f54c5c26bbd982a41dc48d5a5093d1501036a474a1e' /tmp/cert.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='ch.clubvwsuisse.drivebox.v1'" /tmp/badging.txt
          grep -q "versionCode='40'" /tmp/badging.txt
          grep -q "versionName='1.0.0-rc31'" /tmp/badging.txt
          grep -q "application-label:'DriveBox'" /tmp/badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | tee /tmp/perms.txt
          grep -q 'android.permission.CAMERA' /tmp/perms.txt
          grep -q 'android.permission.ACCESS_COARSE_LOCATION' /tmp/perms.txt
          grep -q 'android.permission.ACCESS_FINE_LOCATION' /tmp/perms.txt
          grep -q 'android.permission.POST_NOTIFICATIONS' /tmp/perms.txt
          grep -q 'android.permission.SCHEDULE_EXACT_ALARM' /tmp/perms.txt
          grep -q 'android.permission.VIBRATE' /tmp/perms.txt
          if grep -q 'android.permission.INTERNET' /tmp/perms.txt; then exit 1; fi
          if grep -q 'android.permission.ACCESS_BACKGROUND_LOCATION' /tmp/perms.txt; then exit 1; fi
          unzip -t "$APK"
          unzip -p "$APK" res/mipmap-xxxhdpi-v4/ic_launcher.webp > /tmp/icon.webp
          test "$(sha256sum /tmp/icon.webp | awk '{print $1}')" = 'ab5bbd86c44f537aae43e60584c39c923cee3e7c855ae887332617158c0e8a05'
          cp "$APK" "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC31.apk"
          rm -rf /tmp/drivebox-src/app/build /tmp/drivebox-src/.gradle
          (cd /tmp/drivebox-src && zip -qr "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC31-source.zip" .)
          cp /tmp/cert.txt "$GITHUB_WORKSPACE/APK-SIGNATURE.txt"
          cp /tmp/badging.txt "$GITHUB_WORKSPACE/APK-BADGING.txt"
          sha256sum "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC31.apk" "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC31-source.zip" > "$GITHUB_WORKSPACE/SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: DriveBox-1.0.0-RC31-STABILITY-BLUEZONE
          path: |
            DriveBox-1.0.0-RC31.apk
            DriveBox-1.0.0-RC31-source.zip
            APK-SIGNATURE.txt
            APK-BADGING.txt
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
