name: Build PiiWii Camera 1.3.9 reference landscape

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/piiwii-camera-v139.yml'
      - 'piiwii-camera-v139/**'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Restore verified 1.3.8 source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10176409552/zip" \
            -o /tmp/v138-artifact.zip
          mkdir -p /tmp/v138-artifact /tmp/piiwii-camera-v139
          unzip -q /tmp/v138-artifact.zip -d /tmp/v138-artifact
          unzip -q /tmp/v138-artifact/PiiWii-Camera-1.3.8-SOURCES.zip -d /tmp/piiwii-camera-v139
          test -f /tmp/piiwii-camera-v139/PiiWii-Camera-1.3.8-public/app/build.gradle
          grep -q "versionCode 21" /tmp/piiwii-camera-v139/PiiWii-Camera-1.3.8-public/app/build.gradle
          grep -q "versionName '1.3.8'" /tmp/piiwii-camera-v139/PiiWii-Camera-1.3.8-public/app/build.gradle

      - name: Apply 1.3.9 reference landscape patch
        run: |
          echo '2bc8b9f262cf0ef6ee5122a538fcf2f4db8f137abe601bb92f77cc328a065a43  piiwii-camera-v139/v139.patch' | sha256sum -c -
          cd /tmp/piiwii-camera-v139/PiiWii-Camera-1.3.8-public
          patch -p1 < "$GITHUB_WORKSPACE/piiwii-camera-v139/v139.patch"
          grep -q "versionCode 22" app/build.gradle
          grep -q "versionName '1.3.9'" app/build.gradle
          grep -q 'applyLandscapeReferenceGeometry' app/src/main/java/ch/piiwii/camera/MainActivity.java
          grep -q 'landscapeModeRail' app/src/main/res/layout-land/activity_main.xml

      - name: Build release APK
        run: gradle -p /tmp/piiwii-camera-v139/PiiWii-Camera-1.3.8-public --no-daemon :app:assembleRelease

      - name: Collect APK and sources
        run: |
          set -e
          mkdir -p /tmp/piiwii-camera-v139-out
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 \
            /tmp/piiwii-camera-v139/PiiWii-Camera-1.3.8-public/app/build/outputs/apk/release/app-release-unsigned.apk \
            /tmp/piiwii-camera-v139-out/PiiWii-Camera-1.3.9-ALIGNED-UNSIGNED.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" /tmp/piiwii-camera-v139-out/apksigner.jar
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging /tmp/piiwii-camera-v139-out/PiiWii-Camera-1.3.9-ALIGNED-UNSIGNED.apk > /tmp/piiwii-camera-v139-out/badging.txt
          sha256sum /tmp/piiwii-camera-v139-out/PiiWii-Camera-1.3.9-ALIGNED-UNSIGNED.apk > /tmp/piiwii-camera-v139-out/unsigned-sha256.txt
          cd /tmp/piiwii-camera-v139
          mv PiiWii-Camera-1.3.8-public PiiWii-Camera-1.3.9-public
          zip -qr /tmp/piiwii-camera-v139-out/PiiWii-Camera-1.3.9-SOURCES.zip PiiWii-Camera-1.3.9-public

      - uses: actions/upload-artifact@v4
        with:
          name: PiiWii-Camera-1.3.9-reference-landscape-unsigned
          retention-days: 7
          path: /tmp/piiwii-camera-v139-out/
