name: Build DriveBox RC29 TWINT QR Phase 1

on:
  push:
    branches: [ drivebox-rc29-twint ]
    paths:
      - '.github/workflows/drivebox-rc29-twint-qr.yml'
      - 'drivebox-ci/rc29-twint-part*.b64'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/drivebox-rc29-twint-qr.yml'
      - 'drivebox-ci/rc29-twint-part*.b64'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore validated RC28 source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9625744762/zip" \
            -o /tmp/rc28-artifact.zip
          unzip -t /tmp/rc28-artifact.zip
          rm -rf /tmp/rc28-artifact /tmp/drivebox-src
          mkdir -p /tmp/rc28-artifact /tmp/drivebox-src
          unzip -oq /tmp/rc28-artifact.zip -d /tmp/rc28-artifact
          test -s /tmp/rc28-artifact/DriveBox-1.0.0-RC28-source.zip
          unzip -oq /tmp/rc28-artifact/DriveBox-1.0.0-RC28-source.zip -d /tmp/drivebox-src
          grep -q 'versionCode 37' /tmp/drivebox-src/app/build.gradle
          grep -q "versionName '1.0.0-rc28'" /tmp/drivebox-src/app/build.gradle

      - name: Apply RC29 experimental TWINT QR phase 1
        shell: bash
        run: |
          set -euo pipefail
          cat drivebox-ci/rc29-twint-part{00..03}.b64 | tr -d '\r\n' | base64 -d | gzip -d > /tmp/rc29.patch
          test "$(sha256sum /tmp/rc29.patch | awk '{print $1}')" = '5b387253398656b5f21c3da3e3d6bcddd5fa57858207af4872664c90ebae0c54'
          cd /tmp/drivebox-src
          patch -p1 < /tmp/rc29.patch
          grep -q 'versionCode 38' app/build.gradle
          grep -q "versionName '1.0.0-rc29'" app/build.gradle
          grep -q "zxing-android-embedded:4.3.0" app/build.gradle
          grep -q 'android.permission.CAMERA' app/src/main/AndroidManifest.xml
          grep -q 'TwintQrScannerActivity' app/src/main/AndroidManifest.xml
          test -s app/src/main/java/ch/clubvwsuisse/drivebox/TwintParkingDbHelper.java
          test -s app/src/main/java/ch/clubvwsuisse/drivebox/TwintParkingActivity.java
          test -s app/src/main/java/ch/clubvwsuisse/drivebox/TwintParkingDetailActivity.java
          test -s app/src/main/java/ch/clubvwsuisse/drivebox/TwintQrScannerActivity.java
          grep -q 'qr_raw_content TEXT NOT NULL' app/src/main/java/ch/clubvwsuisse/drivebox/TwintParkingDbHelper.java
          grep -q 'Tester ce QR' app/src/main/java/ch/clubvwsuisse/drivebox/TwintParkingDetailActivity.java
          grep -q 'Copier le contenu' app/src/main/java/ch/clubvwsuisse/drivebox/TwintParkingDetailActivity.java
          grep -q 'Parkings TWINT' app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java
          if grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml; then echo 'Unexpected INTERNET permission'; exit 1; fi
          if grep -q 'android.permission.ACCESS_BACKGROUND_LOCATION' app/src/main/AndroidManifest.xml; then echo 'Unexpected background location permission'; exit 1; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build RC29
        working-directory: /tmp/drivebox-src
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Verify and package RC29
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/drivebox-src/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/cert.txt
          grep -qi '6699b2b6b15b5e09032b4f54c5c26bbd982a41dc48d5a5093d1501036a474a1e' /tmp/cert.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='ch.clubvwsuisse.drivebox.v1'" /tmp/badging.txt
          grep -q "versionCode='38'" /tmp/badging.txt
          grep -q "versionName='1.0.0-rc29'" /tmp/badging.txt
          grep -q "application-label:'DriveBox'" /tmp/badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | tee /tmp/perms.txt
          grep -q 'android.permission.CAMERA' /tmp/perms.txt
          grep -q 'android.permission.ACCESS_COARSE_LOCATION' /tmp/perms.txt
          grep -q 'android.permission.ACCESS_FINE_LOCATION' /tmp/perms.txt
          if grep -q 'android.permission.INTERNET' /tmp/perms.txt; then echo 'Unexpected INTERNET permission'; exit 1; fi
          if grep -q 'android.permission.ACCESS_BACKGROUND_LOCATION' /tmp/perms.txt; then echo 'Unexpected background location permission'; exit 1; fi
          unzip -t "$APK"
          unzip -l "$APK" | grep -q 'classes.dex'
          unzip -p "$APK" res/mipmap-xxxhdpi-v4/ic_launcher.webp > /tmp/icon.webp
          test "$(sha256sum /tmp/icon.webp | awk '{print $1}')" = 'ab5bbd86c44f537aae43e60584c39c923cee3e7c855ae887332617158c0e8a05'
          cp "$APK" "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC29.apk"
          rm -rf /tmp/drivebox-src/app/build /tmp/drivebox-src/.gradle
          (cd /tmp/drivebox-src && zip -qr "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC29-source.zip" .)
          sha256sum "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC29.apk" > "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC29.apk.sha256.txt"
          sha256sum "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC29-source.zip" > "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC29-source.zip.sha256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: DriveBox-1.0.0-RC29-TWINT-QR-PHASE1
          path: |
            DriveBox-1.0.0-RC29.apk
            DriveBox-1.0.0-RC29.apk.sha256.txt
            DriveBox-1.0.0-RC29-source.zip
            DriveBox-1.0.0-RC29-source.zip.sha256.txt
          if-no-files-found: error
          retention-days: 7
