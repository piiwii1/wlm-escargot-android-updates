name: Build PiiWii Camera 1.3.11 polish

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/piiwii-camera-v1311.yml'
      - 'piiwii-camera-v1311/**'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Restore verified 1.3.10 source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10177082411/zip" \
            -o /tmp/v1310-artifact.zip
          mkdir -p /tmp/v1310-artifact /tmp/piiwii-camera-v1311
          unzip -q /tmp/v1310-artifact.zip -d /tmp/v1310-artifact
          unzip -q /tmp/v1310-artifact/PiiWii-Camera-1.3.10-SOURCES.zip -d /tmp/piiwii-camera-v1311
          test -f /tmp/piiwii-camera-v1311/PiiWii-Camera-1.3.10-public/app/build.gradle
          grep -q "versionCode 23" /tmp/piiwii-camera-v1311/PiiWii-Camera-1.3.10-public/app/build.gradle
          grep -q "versionName '1.3.10'" /tmp/piiwii-camera-v1311/PiiWii-Camera-1.3.10-public/app/build.gradle

      - name: Apply 1.3.11 polish patch
        run: |
          set -e
          base64 -d "$GITHUB_WORKSPACE/piiwii-camera-v1311/v1311.patch.gz.b64" | gzip -d > /tmp/v1311.patch
          echo 'ae49783ce2b7f23bb842ab0a60679feecd042df6dc6332864bf5280c3d771d23  /tmp/v1311.patch' | sha256sum -c -
          cd /tmp/piiwii-camera-v1311/PiiWii-Camera-1.3.10-public
          patch -p2 < /tmp/v1311.patch
          grep -q "versionCode 24" app/build.gradle
          grep -q "versionName '1.3.11'" app/build.gradle
          grep -q 'loadVideoThumb' app/src/main/java/ch/piiwii/camera/MainActivity.java
          grep -q 'targetRatio = photoMode' app/src/main/java/ch/piiwii/camera/MainActivity.java
          grep -q 'lastMediaBadge' app/src/main/res/layout-land/activity_main.xml

      - name: Build release APK
        run: gradle -p /tmp/piiwii-camera-v1311/PiiWii-Camera-1.3.10-public --no-daemon :app:assembleRelease

      - name: Collect APK and sources
        run: |
          set -e
          mkdir -p /tmp/piiwii-camera-v1311-out
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 \
            /tmp/piiwii-camera-v1311/PiiWii-Camera-1.3.10-public/app/build/outputs/apk/release/app-release-unsigned.apk \
            /tmp/piiwii-camera-v1311-out/PiiWii-Camera-1.3.11-ALIGNED-UNSIGNED.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" /tmp/piiwii-camera-v1311-out/apksigner.jar
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging /tmp/piiwii-camera-v1311-out/PiiWii-Camera-1.3.11-ALIGNED-UNSIGNED.apk > /tmp/piiwii-camera-v1311-out/badging.txt
          sha256sum /tmp/piiwii-camera-v1311-out/PiiWii-Camera-1.3.11-ALIGNED-UNSIGNED.apk > /tmp/piiwii-camera-v1311-out/unsigned-sha256.txt
          cd /tmp/piiwii-camera-v1311
          mv PiiWii-Camera-1.3.10-public PiiWii-Camera-1.3.11-public
          rm -rf PiiWii-Camera-1.3.11-public/app/build PiiWii-Camera-1.3.11-public/.gradle
          zip -qr /tmp/piiwii-camera-v1311-out/PiiWii-Camera-1.3.11-SOURCES.zip PiiWii-Camera-1.3.11-public

      - uses: actions/upload-artifact@v4
        with:
          name: PiiWii-Camera-1.3.11-polish-unsigned
          retention-days: 7
          path: /tmp/piiwii-camera-v1311-out/
