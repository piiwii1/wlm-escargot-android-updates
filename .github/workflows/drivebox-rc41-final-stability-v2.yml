name: Build DriveBox RC41 Final Stability V2

on:
  push:
    branches: [ drivebox-rc41-final-stability ]
    paths:
      - '.github/workflows/drivebox-rc41-final-stability-v2.yml'
      - 'drivebox-ci/rc41fix.patch.gz.b64'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore validated RC40 source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9637775623/zip" -o /tmp/rc40-artifact.zip
          rm -rf /tmp/rc40-artifact /tmp/drivebox-src
          mkdir -p /tmp/rc40-artifact /tmp/drivebox-src
          unzip -oq /tmp/rc40-artifact.zip -d /tmp/rc40-artifact
          test "$(sha256sum /tmp/rc40-artifact/DriveBox-1.0.0-RC40-source.zip | awk '{print $1}')" = 'a47caa8b879582c215ab1bcd23087c13493fc595703324bbc5cbb30d0d939e36'
          unzip -oq /tmp/rc40-artifact/DriveBox-1.0.0-RC40-source.zip -d /tmp/drivebox-src
          grep -q 'versionCode 49' /tmp/drivebox-src/app/build.gradle
          grep -q "versionName '1.0.0-rc40'" /tmp/drivebox-src/app/build.gradle

      - name: Apply RC41 and compile fix
        shell: bash
        run: |
          set -euo pipefail
          base64 -d drivebox-ci/rc41.patch.gz.b64 > /tmp/rc41.patch.gz
          test "$(sha256sum /tmp/rc41.patch.gz | awk '{print $1}')" = '9e847913adeca0e0788e26ba1aa05356439f7dc1e11f677ece0fb81b8d2de600'
          gzip -d -c /tmp/rc41.patch.gz > /tmp/rc41.patch
          test "$(sha256sum /tmp/rc41.patch | awk '{print $1}')" = 'e3501fd80d9d1cc68dda874977dbb06f0378f21a21122e8fd0f8bd00c8780f98'
          cd /tmp/drivebox-src
          patch -p1 < /tmp/rc41.patch

          cd "$GITHUB_WORKSPACE"
          base64 -d drivebox-ci/rc41fix.patch.gz.b64 > /tmp/rc41fix.patch.gz
          test "$(sha256sum /tmp/rc41fix.patch.gz | awk '{print $1}')" = '4d05199b833a20a277c4c369fcda7eeb692380c049e909d2f7d589f97d645adb'
          gzip -d -c /tmp/rc41fix.patch.gz > /tmp/rc41fix.patch
          test "$(sha256sum /tmp/rc41fix.patch | awk '{print $1}')" = '8cde1811706ef8f925cb6da03c3dad5c84acc9a57b55a7fff14d0f34d4407356'
          cd /tmp/drivebox-src
          patch -p1 < /tmp/rc41fix.patch

          grep -q 'versionCode 50' app/build.gradle
          grep -q "versionName '1.0.0-rc41'" app/build.gradle
          grep -q 'android:name=".DriveBoxApplication"' app/src/main/AndroidManifest.xml
          test -f app/src/main/java/ch/clubvwsuisse/drivebox/DriveBoxApplication.java
          test -f app/src/main/java/ch/clubvwsuisse/drivebox/ParkingPhotoManager.java
          grep -q 'REQ_PARK_CAMERA' app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java
          grep -q 'setClipData' app/src/main/java/ch/clubvwsuisse/drivebox/ParkingPhotoManager.java
          grep -q 'activeLocationCancellation' app/src/main/java/ch/clubvwsuisse/drivebox/TwintQrScannerActivity.java
          grep -q 'cleanupLocationRequest' app/src/main/java/ch/clubvwsuisse/drivebox/TwintQrScannerActivity.java
          test "$(grep -c '@Test' app/src/test/java/ch/clubvwsuisse/drivebox/ParkingTimePolicyTest.java)" -ge 8
          test -f CONTINUITE-RC41.md
          if grep -q 'getParkingPhotoFile' app/src/main/java/ch/clubvwsuisse/drivebox/MainActivity.java; then echo 'Stale photo helper reference'; exit 1; fi
          if grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml; then echo 'Unexpected INTERNET permission'; exit 1; fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests and compile RC41
        working-directory: /tmp/drivebox-src
        run: gradle --no-daemon clean :app:testDebugUnitTest :app:assembleDebug

      - name: Verify and package RC41
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/drivebox-src/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/cert.txt
          grep -qi '6699b2b6b15b5e09032b4f54c5c26bbd982a41dc48d5a5093d1501036a474a1e' /tmp/cert.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='ch.clubvwsuisse.drivebox.v1'" /tmp/badging.txt
          grep -q "versionCode='50'" /tmp/badging.txt
          grep -q "versionName='1.0.0-rc41'" /tmp/badging.txt
          grep -q "application-label:'DriveBox'" /tmp/badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | tee /tmp/perms.txt
          grep -q 'android.permission.CAMERA' /tmp/perms.txt
          grep -q 'android.permission.ACCESS_FINE_LOCATION' /tmp/perms.txt
          grep -q 'android.permission.POST_NOTIFICATIONS' /tmp/perms.txt
          if grep -q 'android.permission.INTERNET' /tmp/perms.txt; then exit 1; fi
          unzip -t "$APK"
          unzip -p "$APK" res/mipmap-xxxhdpi-v4/ic_launcher.webp > /tmp/icon.webp
          test "$(sha256sum /tmp/icon.webp | awk '{print $1}')" = 'ab5bbd86c44f537aae43e60584c39c923cee3e7c855ae887332617158c0e8a05'
          cp "$APK" "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC41.apk"
          rm -rf /tmp/drivebox-src/app/build /tmp/drivebox-src/.gradle
          (cd /tmp/drivebox-src && zip -qr "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC41-source.zip" .)
          sha256sum "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC41.apk" > "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC41.apk.sha256.txt"
          sha256sum "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC41-source.zip" > "$GITHUB_WORKSPACE/DriveBox-1.0.0-RC41-source.zip.sha256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: DriveBox-1.0.0-RC41-FINAL-STABILITY-V2
          path: |
            DriveBox-1.0.0-RC41.apk
            DriveBox-1.0.0-RC41.apk.sha256.txt
            DriveBox-1.0.0-RC41-source.zip
            DriveBox-1.0.0-RC41-source.zip.sha256.txt
          if-no-files-found: error
          retention-days: 7
