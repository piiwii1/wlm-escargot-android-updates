name: FannyArchive APK Smoke Test macOS

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'fannyarchive-apk-test-macos-trigger.txt'

jobs:
  verify-apk:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android
        uses: android-actions/setup-android@v3
      - name: Download compiled APK
        run: |
          curl -fL 'https://sdmntprukwest.oaiusercontent.com/files/00000000-757c-8243-83fe-2af5c11266a3/raw?se=2026-08-24T12%3A52%3A44Z&sp=r&sv=2026-02-06&sr=b&scid=7331677b-fdef-50cb-a9bb-71a8a31a1125&skoid=1d6acb5b-b3f4-43ec-a5ec-b05c4a7708c8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-24T06%3A51%3A34Z&ske=2026-08-25T06%3A51%3A34Z&sks=b&skv=2026-02-06&sig=vOAaD//vuGhhy9ulXNgipTugfrJAEzm6ZT7qZ8LFppI%3D' -o /tmp/fanny.zip
          unzip -q /tmp/fanny.zip -d /tmp/fanny
          echo '7bcfcebf496b66ebc030dd36ecedf2ffc4f2a0ab915ae605cd11aca2c393b2d9  /tmp/fanny/FannyArchive-1.3.0-debug.apk' | shasum -a 256 -c -
      - name: Install launch and verify Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          script: |
            adb install -r /tmp/fanny/FannyArchive-1.3.0-debug.apk > /tmp/install.txt 2>&1; cat /tmp/install.txt; grep -q 'Success' /tmp/install.txt
            adb logcat -c
            adb shell am force-stop ch.piiwii.fannyarchive
            adb shell am start -n ch.piiwii.fannyarchive/.MainActivity | tee /tmp/start.txt
            sleep 20
            adb shell pidof ch.piiwii.fannyarchive | tee /tmp/pid.txt
            test -s /tmp/pid.txt
            adb shell dumpsys activity activities | grep -F 'ch.piiwii.fannyarchive' | head -20 | tee /tmp/activity.txt
            test -s /tmp/activity.txt
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml /tmp/window.xml >/dev/null
            grep -F 'Archive Fanny' /tmp/window.xml | tee /tmp/ui-proof.txt
            test -s /tmp/ui-proof.txt
            adb logcat -d -v brief > /tmp/logcat.txt
            if grep -E 'FATAL EXCEPTION|AndroidRuntime' /tmp/logcat.txt | grep -F 'ch.piiwii.fannyarchive'; then exit 1; else true; fi
            adb exec-out screencap -p > /tmp/FannyArchive-1.3.0-launch.png
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: FannyArchive-1.3.0-ANDROID15-VERIFIED-MACOS
          path: |
            /tmp/fanny/FannyArchive-1.3.0-debug.apk
            /tmp/FannyArchive-1.3.0-launch.png
            /tmp/start.txt
            /tmp/pid.txt
            /tmp/activity.txt
            /tmp/ui-proof.txt
            /tmp/logcat.txt
          retention-days: 7
