name: Build PiiWii TV Phone 0.5.4 stable-signed

on:
  push:
    branches:
      - chatgpt/piiwii-tv-phone-053-build
    paths:
      - 'piiwii-tv-phone-053-build/**'
      - '.github/workflows/piiwii-tv-phone-053-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install ImageMagick
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

      - name: Download verified 0.5.3 build
        uses: actions/download-artifact@v4
        with:
          name: PiiWii-TV-Phone-0.5.3-DELIVERY
          path: /tmp/piiwii053-artifact
          run-id: 35342251150
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore verified 0.5.2 sources
        shell: bash
        run: |
          set -euo pipefail
          cat piiwii-tv-phone-052-build/src-parts/part-*.b64 > /tmp/PiiWii-TV-Phone-0.5.2-Sources.zip.b64
          test "$(wc -c < /tmp/PiiWii-TV-Phone-0.5.2-Sources.zip.b64)" -eq 72204
          base64 -d /tmp/PiiWii-TV-Phone-0.5.2-Sources.zip.b64 > /tmp/PiiWii-TV-Phone-0.5.2-Sources.zip
          echo "5ecf8dd1925cd2e69b015f5379e105a09340d1e4468ade2433e13e287947d04a  /tmp/PiiWii-TV-Phone-0.5.2-Sources.zip" | sha256sum -c -
          rm -rf /tmp/piiwii054
          mkdir -p /tmp/piiwii054
          unzip -q /tmp/PiiWii-TV-Phone-0.5.2-Sources.zip -d /tmp/piiwii054

      - name: Apply 0.5.4 menu icon update
        shell: bash
        run: |
          set -euo pipefail
          PRJ=/tmp/piiwii054/piiwii-tv-phone-0.5.2
          MAIN="$PRJ/app/src/main/java/ch/piiwii/tvphone/MainActivity.java"
          BUILD="$PRJ/app/build.gradle"
          RES="$PRJ/app/src/main/res/drawable-nodpi"
          APK=/tmp/piiwii053-artifact/PiiWii-TV-Phone-0.5.3.apk
          test -s "$APK"
          mkdir -p "$RES" /tmp/icons053
          unzip -p "$APK" res/drawable-nodpi-v4/nav_direct.png > /tmp/icons053/nav_direct.png
          unzip -p "$APK" res/drawable-nodpi-v4/nav_guide.png > /tmp/icons053/nav_guide.png
          unzip -p "$APK" res/drawable-nodpi-v4/nav_recordings.png > /tmp/icons053/nav_recordings.png
          unzip -p "$APK" res/drawable-nodpi-v4/nav_settings.png > /tmp/icons053/nav_settings.png
          for f in /tmp/icons053/nav_*.png; do
            out="$RES/$(basename "$f")"
            convert "$f" -trim +repage -resize '118x118>' -background none -gravity center -extent 128x128 -strip -depth 8 PNG32:"$out"
            test -s "$out"
          done
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/piiwii054/piiwii-tv-phone-0.5.2/app/src/main/java/ch/piiwii/tvphone/MainActivity.java')
          s=p.read_text()
          s=s.replace('bottomNav.setPadding(dp(8), dp(5), dp(8), dp(5));','bottomNav.setPadding(dp(8), dp(6), dp(8), dp(6));')
          s=s.replace('bottomNav.addView(navItem("●", "Direct", Tab.DIRECT), new LinearLayout.LayoutParams(0, dp(58), 1f));','bottomNav.addView(navItem(R.drawable.nav_direct, "Direct", Tab.DIRECT), new LinearLayout.LayoutParams(0, dp(70), 1f));')
          s=s.replace('bottomNav.addView(navItem("☷", "Guide", Tab.GUIDE), new LinearLayout.LayoutParams(0, dp(58), 1f));','bottomNav.addView(navItem(R.drawable.nav_guide, "Guide", Tab.GUIDE), new LinearLayout.LayoutParams(0, dp(70), 1f));')
          s=s.replace('bottomNav.addView(navItem("▣", "Enregistrements", Tab.RECORDINGS), new LinearLayout.LayoutParams(0, dp(58), 1f));','bottomNav.addView(navItem(R.drawable.nav_recordings, "Enregistrements", Tab.RECORDINGS), new LinearLayout.LayoutParams(0, dp(70), 1f));')
          s=s.replace('bottomNav.addView(navItem("⚙", "Réglages", Tab.SETTINGS), new LinearLayout.LayoutParams(0, dp(58), 1f));','bottomNav.addView(navItem(R.drawable.nav_settings, "Réglages", Tab.SETTINGS), new LinearLayout.LayoutParams(0, dp(70), 1f));')
          old='''    private View navItem(String icon, String label, Tab target) {\n        LinearLayout box = new LinearLayout(this);\n        box.setOrientation(LinearLayout.VERTICAL);\n        box.setGravity(Gravity.CENTER);\n        box.setPadding(dp(4), dp(4), dp(4), dp(4));\n        box.setTag(target);\n        TextView i = text(icon, 19, MUTED, true); i.setGravity(Gravity.CENTER); box.addView(i);\n        TextView l = text(label, 11, MUTED, true); l.setGravity(Gravity.CENTER); box.addView(l);\n        box.setOnClickListener(v -> showTab(target));\n        return box;\n    }\n'''
          new='''    private View navItem(int iconRes, String label, Tab target) {\n        LinearLayout box = new LinearLayout(this);\n        box.setOrientation(LinearLayout.VERTICAL);\n        box.setGravity(Gravity.CENTER);\n        box.setPadding(dp(3), dp(4), dp(3), dp(4));\n        box.setTag(target);\n        ImageView icon = new ImageView(this);\n        icon.setImageResource(iconRes);\n        icon.setScaleType(ImageView.ScaleType.FIT_CENTER);\n        icon.setAdjustViewBounds(true);\n        icon.setAlpha(0.72f);\n        LinearLayout.LayoutParams iconLp = new LinearLayout.LayoutParams(dp(36), dp(36));\n        box.addView(icon, iconLp);\n        TextView l = text(label, 9, MUTED, true);\n        l.setGravity(Gravity.CENTER);\n        l.setSingleLine(true);\n        LinearLayout.LayoutParams labelLp = new LinearLayout.LayoutParams(-1, dp(20));\n        labelLp.topMargin = dp(1);\n        box.addView(l, labelLp);\n        box.setOnClickListener(v -> showTab(target));\n        return box;\n    }\n'''
          if old not in s:
              raise SystemExit('navItem source block not found')
          s=s.replace(old,new)
          s=s.replace('                    if (item instanceof TextView) ((TextView) item).setTextColor(active ? Color.rgb(112, 179, 255) : MUTED);\n','                    if (item instanceof TextView) ((TextView) item).setTextColor(active ? Color.rgb(112, 179, 255) : MUTED);\n                    if (item instanceof ImageView) ((ImageView) item).setAlpha(active ? 1.0f : 0.72f);\n')
          s=s.replace('Version 0.5.2 · Media3 / ExoPlayer','Version 0.5.4 · Media3 / ExoPlayer')
          p.write_text(s)
          b=Path('/tmp/piiwii054/piiwii-tv-phone-0.5.2/app/build.gradle')
          t=b.read_text().replace('versionCode 7','versionCode 9').replace("versionName '0.5.2'","versionName '0.5.4'")
          b.write_text(t)
          PY
          grep -q 'versionCode 9' "$BUILD"
          grep -q "versionName '0.5.4'" "$BUILD"
          grep -q 'R.drawable.nav_direct' "$MAIN"
          grep -q 'R.drawable.nav_guide' "$MAIN"
          grep -q 'R.drawable.nav_recordings' "$MAIN"
          grep -q 'R.drawable.nav_settings' "$MAIN"

      - name: Build unsigned release APK
        working-directory: /tmp/piiwii054/piiwii-tv-phone-0.5.2
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Create stable signing key and sign APK
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          UNSIGNED=/tmp/piiwii054/piiwii-tv-phone-0.5.2/app/build/outputs/apk/release/app-release-unsigned.apk
          mkdir -p out/signing
          PASS=$(openssl rand -hex 16)
          KEY=out/signing/PiiWii-TV-Phone-signing.jks
          keytool -genkeypair -keystore "$KEY" -storepass "$PASS" -keypass "$PASS" -alias piiwii-tv-phone -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=PiiWii TV Phone,O=PiiWii,C=CH" >/dev/null 2>&1
          "$BT/zipalign" -f -p 4 "$UNSIGNED" out/PiiWii-TV-Phone-0.5.4-aligned.apk
          "$BT/apksigner" sign --ks "$KEY" --ks-key-alias piiwii-tv-phone --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --out out/PiiWii-TV-Phone-0.5.4.apk out/PiiWii-TV-Phone-0.5.4-aligned.apk
          rm out/PiiWii-TV-Phone-0.5.4-aligned.apk
          printf 'Keystore: PiiWii-TV-Phone-signing.jks\nAlias: piiwii-tv-phone\nStore password: %s\nKey password: %s\nKeep this file with the keystore for every future update.\n' "$PASS" "$PASS" > out/signing/SIGNING-CREDENTIALS.txt
          "$BT/apksigner" verify --verbose --print-certs out/PiiWii-TV-Phone-0.5.4.apk > out/APKSIGNER.txt
          "$BT/aapt" dump badging out/PiiWii-TV-Phone-0.5.4.apk > out/BADGING.txt
          grep -F "package: name='ch.piiwii.tvphone'" out/BADGING.txt
          grep -F "versionCode='9'" out/BADGING.txt
          grep -F "versionName='0.5.4'" out/BADGING.txt
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' out/APKSIGNER.txt
          sha256sum out/PiiWii-TV-Phone-0.5.4.apk > out/PiiWii-TV-Phone-0.5.4.apk.sha256
          sha256sum "$KEY" > out/signing/PiiWii-TV-Phone-signing.jks.sha256

      - name: Upload stable-signed delivery
        uses: actions/upload-artifact@v4
        with:
          name: PiiWii-TV-Phone-0.5.4-STABLE-SIGNED
          path: out/*
          retention-days: 7
          if-no-files-found: error
