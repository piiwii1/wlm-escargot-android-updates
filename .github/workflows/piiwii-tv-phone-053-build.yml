name: Build PiiWii TV Phone 0.5.5 exact icons

on:
  push:
    branches:
      - chatgpt/piiwii-tv-phone-053-build
    paths:
      - '.github/workflows/piiwii-tv-phone-053-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download verified 0.5.3 delivery
        uses: actions/download-artifact@v4
        with:
          name: PiiWii-TV-Phone-0.5.3-DELIVERY
          path: /tmp/piiwii053-artifact
          run-id: 35342251150
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore exact 0.5.3 sources
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/piiwii053-artifact/PiiWii-TV-Phone-0.5.3-Sources.zip
          test -s "$SRC"
          echo "e881e2853b08fc1bd1492802efa96b325513f9aaa26af3e71db05c9b18267759  $SRC" | sha256sum -c -
          rm -rf /tmp/piiwii055
          mkdir -p /tmp/piiwii055
          unzip -q "$SRC" -d /tmp/piiwii055

      - name: Enlarge exact user icons and bump version
        shell: bash
        run: |
          set -euo pipefail
          PRJ=/tmp/piiwii055/piiwii-tv-phone-0.5.3
          MAIN="$PRJ/app/src/main/java/ch/piiwii/tvphone/MainActivity.java"
          BUILD="$PRJ/app/build.gradle"
          RES="$PRJ/app/src/main/res/drawable-nodpi"

          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          res = Path('/tmp/piiwii055/piiwii-tv-phone-0.5.3/app/src/main/res/drawable-nodpi')
          for name in ('nav_direct.png','nav_guide.png','nav_recordings.png','nav_settings.png'):
              p = res / name
              im = Image.open(p).convert('RGBA')
              bbox = im.getbbox()
              if not bbox:
                  raise SystemExit(f'empty icon: {name}')
              crop = im.crop(bbox)
              maxdim = 122
              scale = min(maxdim / crop.width, maxdim / crop.height)
              size = (max(1, round(crop.width * scale)), max(1, round(crop.height * scale)))
              crop = crop.resize(size, Image.Resampling.LANCZOS)
              canvas = Image.new('RGBA', (128, 128), (0, 0, 0, 0))
              canvas.alpha_composite(crop, ((128-size[0])//2, (128-size[1])//2))
              canvas.save(p, format='PNG', optimize=True)
              with Image.open(p) as check:
                  check.verify()
          PY

          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/piiwii055/piiwii-tv-phone-0.5.3/app/src/main/java/ch/piiwii/tvphone/MainActivity.java')
          s = p.read_text()
          s = s.replace('new LinearLayout.LayoutParams(0, dp(62), 1f)', 'new LinearLayout.LayoutParams(0, dp(70), 1f)')
          s = s.replace('icon.setAlpha(0.58f);', 'icon.setAlpha(0.78f);')
          s = s.replace('new LinearLayout.LayoutParams(dp(30), dp(30))', 'new LinearLayout.LayoutParams(dp(40), dp(40))')
          s = s.replace('TextView l = text(label, 10, MUTED, true);', 'TextView l = text(label, 9, MUTED, true);')
          s = s.replace('active ? 1.0f : 0.58f', 'active ? 1.0f : 0.78f')
          s = s.replace('Version 0.5.3 · Media3 / ExoPlayer', 'Version 0.5.5 · Media3 / ExoPlayer')
          p.write_text(s)

          b = Path('/tmp/piiwii055/piiwii-tv-phone-0.5.3/app/build.gradle')
          t = b.read_text().replace('versionCode 8', 'versionCode 10').replace("versionName '0.5.3'", "versionName '0.5.5'")
          b.write_text(t)
          PY

          grep -q 'versionCode 10' "$BUILD"
          grep -q "versionName '0.5.5'" "$BUILD"
          grep -q 'dp(40), dp(40)' "$MAIN"
          identify "$RES/nav_direct.png" "$RES/nav_guide.png" "$RES/nav_recordings.png" "$RES/nav_settings.png"

      - name: Build release APK
        working-directory: /tmp/piiwii055/piiwii-tv-phone-0.5.3
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify and package unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          PRJ=/tmp/piiwii055/piiwii-tv-phone-0.5.3
          APK="$PRJ/app/build/outputs/apk/release/app-release-unsigned.apk"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$APK"
          mkdir -p out
          cp "$APK" out/PiiWii-TV-Phone-0.5.5-unsigned.apk
          "$BT/aapt" dump badging "$APK" > out/BADGING.txt
          grep -F "package: name='ch.piiwii.tvphone'" out/BADGING.txt
          grep -F "versionCode='10'" out/BADGING.txt
          grep -F "versionName='0.5.5'" out/BADGING.txt
          "$BT/zipalign" -c -v 4 "$APK" > out/ZIPALIGN-CHECK.txt
          sha256sum out/PiiWii-TV-Phone-0.5.5-unsigned.apk > out/PiiWii-TV-Phone-0.5.5-unsigned.apk.sha256
          (cd /tmp/piiwii055 && zip -qr "$GITHUB_WORKSPACE/out/PiiWii-TV-Phone-0.5.5-Sources.zip" piiwii-tv-phone-0.5.3)

      - name: Upload 0.5.5 artifact
        uses: actions/upload-artifact@v4
        with:
          name: PiiWii-TV-Phone-0.5.5-UNSIGNED
          path: out/*
          retention-days: 14
          if-no-files-found: error
