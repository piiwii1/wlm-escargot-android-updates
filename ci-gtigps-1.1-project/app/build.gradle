plugins {
    id 'com.android.application'
}

android {
    namespace 'ch.piiwii.gtigps'
    compileSdk 35

    defaultConfig {
        applicationId 'ch.piiwii.gtigps'
        minSdk 23
        targetSdk 28
        versionCode 4
        versionName '1.2.0'
    }

    lint {
        // targetSdk 28 is intentional for the Android 10 TS18/Topway target.
        disable 'ExpiredTargetSdkVersion'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // OpenGL flavor: widest compatibility for older Android head units.
    implementation 'org.maplibre.gl:android-sdk-opengl:13.4.1'
}
